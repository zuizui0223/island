name: Acquire minimum endemic colour from public Web

on:
  pull_request:
    paths:
      - ".github/workflows/acquire-minimum-endemic-colour-public-web.yml"
  workflow_dispatch:
    inputs:
      target_queue_run:
        description: "Run carrying the locked minimum endemic-colour queue"
        required: false
        default: "32614335237"

permissions:
  contents: read
  actions: read

concurrency:
  group: minimum-endemic-colour-public-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_QUEUE_RUN: ${{ inputs.target_queue_run || '32614335237' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate public-Web shard engine
        run: |
          ruff check src/island_v2/web_trait_shard_campaign.py
          pytest -q tests/test_web_trait_shard_campaign.py

      - name: Download the frozen 23-species queue
        run: |
          set -euo pipefail
          mkdir -p /tmp/locked-queue
          gh run download "$TARGET_QUEUE_RUN" \
            -n "minimum-endemic-acquisition-queue-${TARGET_QUEUE_RUN}" \
            -D /tmp/locked-queue
          QUEUE=$(find /tmp/locked-queue -name minimum_endemic_trait_acquisition_queue.csv -print -quit)
          test -s "$QUEUE"
          cp "$QUEUE" /tmp/minimum_endemic_trait_acquisition_queue.csv

      - name: Build a 23-species campaign master
        run: |
          python - <<'PY'
          import pandas as pd

          queue = pd.read_csv('/tmp/minimum_endemic_trait_acquisition_queue.csv')
          queue = queue.loc[queue['outcome'].eq('plain_colour')].copy()
          targets = set(queue['accepted_species'].astype(str))
          master = pd.read_csv('data/v2/staging/gbif/collected/island_taxa.csv')
          target_master = master.loc[
              master['accepted_species'].astype(str).isin(targets),
              ['accepted_species', 'genus', 'family'],
          ].drop_duplicates('accepted_species')
          missing = sorted(targets - set(target_master['accepted_species'].astype(str)))
          if missing:
              raise SystemExit(f'Queue species missing from master: {missing}')
          target_master = target_master.sort_values('accepted_species').reset_index(drop=True)
          if len(target_master) != 23:
              raise SystemExit(f'Expected exactly 23 locked targets, got {len(target_master)}')
          target_master.to_csv('/tmp/target_master.csv', index=False)
          print(target_master.to_string(index=False))
          PY

      - name: Run one bounded credential-free shard
        run: |
          set -euo pipefail
          island-v2-web-trait-shards run \
            --master-csv /tmp/target_master.csv \
            --campaign-dir /tmp/campaign \
            --shard-index 0 \
            --shard-count 1 \
            --batch-size 23 \
            --max-attempts 1 \
            --expected-species 0 \
            --gbif \
            --wikimedia \
            --web-descriptions \
            --world-flora \
            --no-openalex \
            --no-europe-pmc \
            --pause-seconds 0.1
          test -s /tmp/campaign/campaign_status.json

      - name: Extract colour-only review packet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/campaign')
          csvs = list(root.rglob('*.csv'))
          candidate_frames = []
          for path in csvs:
              try:
                  table = pd.read_csv(path)
              except Exception:
                  continue
              if {'species', 'flower_color'}.issubset(table.columns):
                  candidate_frames.append(table)
          if candidate_frames:
              combined = pd.concat(candidate_frames, ignore_index=True, sort=False)
              colour = combined.loc[
                  combined['flower_color'].fillna('').astype(str).str.strip().ne('')
                  & ~combined['flower_color'].fillna('').astype(str).str.lower().eq('unknown')
              ].drop_duplicates()
          else:
              colour = pd.DataFrame()
          colour.to_csv('/tmp/minimum_endemic_colour_public_web_candidates.csv', index=False)

          status = json.loads((root / 'campaign_status.json').read_text(encoding='utf-8'))
          summary = {
              'contract': 'minimum_endemic_colour_public_web_review_only_v1',
              'queue_run': 32614335237,
              'n_locked_species': 23,
              'providers': ['gbif', 'web_descriptions', 'wikimedia', 'world_flora'],
              'n_nonempty_colour_candidate_rows': int(len(colour)),
              'campaign_status': status,
              'promotion_policy': 'review_only; no automatic promotion',
          }
          Path('/tmp/minimum_endemic_colour_public_web_summary.json').write_text(
              json.dumps(summary, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: minimum-endemic-colour-public-web-${{ github.run_id }}
          path: |
            /tmp/target_master.csv
            /tmp/minimum_endemic_trait_acquisition_queue.csv
            /tmp/minimum_endemic_colour_public_web_candidates.csv
            /tmp/minimum_endemic_colour_public_web_summary.json
            /tmp/campaign
          if-no-files-found: error
          retention-days: 90
