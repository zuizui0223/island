name: Acquire protologue floral traits

# Why this source: the unresolved tail is 74,846 species on three islands or
# fewer. No monograph or ecological study covers most of them, but every one has
# a protologue, because the name was validly published -- and for a species with
# four occurrence records that original description is frequently the only
# floral description in existence.
#
# `validate` runs on every pull request with no network: the extraction,
# declension, sentence-boundary and copyright-gate logic is all exercised
# against fakes. `acquire` is dispatch-only because it needs a BHL API key and
# walks a queue of tens of thousands of species against two external APIs.
#
# Only the two routes declared in config/island_flora_sources.yml are used --
# the IPNI official API for the citation and the BHL official API for the scan.
# Nothing is crawled, and an item BHL declares still in copyright is skipped.

on:
  pull_request:
    paths:
      - ".github/workflows/acquire-protologue-traits.yml"
      - "config/protologue_acquisition.yml"
      - "config/island_flora_sources.yml"
      - "src/island_v2/protologue_trait_acquisition.py"
      - "tests/test_protologue_trait_acquisition.py"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many queued species to attempt (0 walks the whole queue)"
        required: false
        default: "500"
      max_islands:
        description: "Tail cutoff: queue species occurring on at most this many islands"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: protologue-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Lint and test
        run: |
          ruff check \
            src/island_v2/protologue_trait_acquisition.py \
            tests/test_protologue_trait_acquisition.py
          pytest -q tests/test_protologue_trait_acquisition.py

  acquire:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
      LIMIT: ${{ inputs.limit || '500' }}
      MAX_ISLANDS: ${{ inputs.max_islands || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Require the BHL API key
        run: |
          set -euo pipefail
          test -n "${BHL_API_KEY:-}" || {
            echo "BHL_API_KEY secret is not configured."
            echo "Request one at https://www.biodiversitylibrary.org/getapikey"
            exit 1
          }

      - name: Build the tail queue
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          path = Path("config/protologue_acquisition.yml")
          config = yaml.safe_load(path.read_text(encoding="utf-8"))
          config["target_selection"]["max_islands"] = int(os.environ["MAX_ISLANDS"])
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY
          island-v2-protologue-acquisition queue \
            --config config/protologue_acquisition.yml \
            --output-csv /tmp/protologue/queue.csv

      - name: Resolve protologues and mine floral statements
        run: |
          set -euo pipefail
          island-v2-protologue-acquisition run \
            --config config/protologue_acquisition.yml \
            --queue-csv /tmp/protologue/queue.csv \
            --output-dir /tmp/protologue \
            --limit "$LIMIT"

      - uses: actions/upload-artifact@v4
        with:
          name: protologue-acquisition-${{ github.run_id }}
          path: /tmp/protologue
          if-no-files-found: error
          retention-days: 90
