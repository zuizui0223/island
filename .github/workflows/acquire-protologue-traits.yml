name: Acquire protologue floral traits

# Default acquisition is the model-support-driven endemic-colour queue.
# The historical <=3-island tail remains available only when explicitly chosen.
# Candidate statements are unreviewed and never promoted by this workflow.

on:
  pull_request:
    paths:
      - ".github/workflows/acquire-protologue-traits.yml"
      - "config/protologue_acquisition.yml"
      - "config/island_flora_sources.yml"
      - "src/island_v2/protologue_trait_acquisition.py"
      - "tests/test_protologue_trait_acquisition.py"
  workflow_dispatch:
    inputs:
      target_mode:
        description: "minimum_endemic_colour (default) or legacy_tail"
        required: false
        default: "minimum_endemic_colour"
      target_queue_run:
        description: "Run carrying minimum-endemic-acquisition-queue artifact"
        required: false
        default: "32685711975"
      limit:
        description: "How many queued species to attempt (0 walks the whole queue)"
        required: false
        default: "500"
      max_islands:
        description: "Legacy tail only: queue species occurring on at most this many islands"
        required: false
        default: "3"

permissions:
  contents: read
  actions: read

concurrency:
  group: protologue-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Lint and test
        run: |
          ruff check \
            src/island_v2/protologue_trait_acquisition.py \
            tests/test_protologue_trait_acquisition.py
          pytest -q tests/test_protologue_trait_acquisition.py

  acquire:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TARGET_MODE: ${{ inputs.target_mode || 'minimum_endemic_colour' }}
      TARGET_QUEUE_RUN: ${{ inputs.target_queue_run || '32685711975' }}
      LIMIT: ${{ inputs.limit || '500' }}
      MAX_ISLANDS: ${{ inputs.max_islands || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Require the BHL API key
        run: |
          set -euo pipefail
          test -n "${BHL_API_KEY:-}" || {
            echo "BHL_API_KEY secret is not configured."
            echo "Request one at https://www.biodiversitylibrary.org/getapikey"
            exit 1
          }

      - name: Build the declared acquisition queue
        run: |
          set -euo pipefail
          mkdir -p /tmp/protologue
          if [ "$TARGET_MODE" = "minimum_endemic_colour" ]; then
            mkdir -p /tmp/locked-queue
            gh run download "$TARGET_QUEUE_RUN" \
              -n "minimum-endemic-acquisition-queue-${TARGET_QUEUE_RUN}" \
              -D /tmp/locked-queue
            QUEUE=$(find /tmp/locked-queue -name minimum_endemic_trait_acquisition_queue.csv -print -quit)
            test -s "$QUEUE"
            python - "$QUEUE" <<'PY'
          import sys
          import pandas as pd

          source = pd.read_csv(sys.argv[1])
          source = source.loc[source['outcome'].eq('plain_colour')].copy()
          source = source.sort_values(['regime', 'selection_order'])
          source = source.drop_duplicates('accepted_species')
          source.to_csv('/tmp/protologue/queue.csv', index=False)
          print({
              'target_mode': 'minimum_endemic_colour',
              'n_queued': int(len(source)),
              'regimes': source['regime'].value_counts().to_dict(),
          })
          PY
          elif [ "$TARGET_MODE" = "legacy_tail" ]; then
            python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          path = Path('config/protologue_acquisition.yml')
          config = yaml.safe_load(path.read_text(encoding='utf-8'))
          config['target_selection']['max_islands'] = int(os.environ['MAX_ISLANDS'])
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding='utf-8')
          PY
            island-v2-protologue-acquisition queue \
              --config config/protologue_acquisition.yml \
              --output-csv /tmp/protologue/queue.csv
          else
            echo "Unknown TARGET_MODE=$TARGET_MODE; expected minimum_endemic_colour or legacy_tail" >&2
            exit 1
          fi
          test -s /tmp/protologue/queue.csv

      - name: Resolve protologues and mine floral statements
        run: |
          set -euo pipefail
          island-v2-protologue-acquisition run \
            --config config/protologue_acquisition.yml \
            --queue-csv /tmp/protologue/queue.csv \
            --output-dir /tmp/protologue \
            --limit "$LIMIT"

      - uses: actions/upload-artifact@v4
        with:
          name: protologue-acquisition-${{ github.run_id }}
          path: /tmp/protologue
          if-no-files-found: error
          retention-days: 90
