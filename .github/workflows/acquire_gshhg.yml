name: acquire_gshhg

# Rebuilds a candidate public island universe from GSHHG for validation,
# source updates, and area-threshold sensitivity analyses. It never mutates
# the frozen universe pinned by the active GBIF acquisition campaign.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/island_source_gshhg.yml"
      - "config/island_plant_database_v2.yml"
      - "src/island_v2/gshhg_source.py"
      - "src/island_v2/island_plant_database.py"
      - "pyproject.toml"
      - ".github/workflows/acquire_gshhg.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e .
      - name: Build public island polygons
        run: island-v2-gshhg build --output-dir data/v2/external/islands/gshhg
      - name: Export Island Plant Database 2.0 islands core
        run: |
          python -m island_v2.island_plant_database export-islands \
            --islands-gpkg data/v2/external/islands/gshhg/prepared/islands_v2.gpkg \
            --source-policy data/v2/external/islands/gshhg/prepared/source_policy.json \
            --output-csv data/v2/curated/island_plant_database/alpha1/islands.csv
          python - <<'PY'
          import pandas as pd
          path = 'data/v2/curated/island_plant_database/alpha1/islands.csv'
          frame = pd.read_csv(path, dtype=str).fillna('')
          assert len(frame) > 0
          assert frame['island_id'].is_unique
          assert frame['geometry_sha256'].str.fullmatch(r'[0-9a-f]{64}').all()
          assert frame['release_status'].eq('redistributable').all()
          assert frame['source_license'].isin(
              {'LGPL-3.0-or-later', 'PUBLIC-DOMAIN'}
          ).all()
          PY
      - name: Upload island geometry and Database 2.0 core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-universe-v2-${{ github.run_id }}
          path: |
            data/v2/external/islands/gshhg/prepared/islands_v2.gpkg
            data/v2/external/islands/gshhg/prepared/island_manifest.csv
            data/v2/external/islands/gshhg/prepared/source_policy.json
            data/v2/curated/island_plant_database/alpha1/islands.csv
          if-no-files-found: warn
          retention-days: 90
      - name: Report source and island-universe diagnostics
        if: success()
        run: |
          echo '## Island source build' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/external/islands/gshhg/prepared/source_policy.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import geopandas as gpd
          import pandas as pd

          frame = gpd.read_file(
              'data/v2/external/islands/gshhg/prepared/islands_v2.gpkg',
              layer='islands',
          )
          core = pd.read_csv(
              'data/v2/curated/island_plant_database/alpha1/islands.csv',
              dtype=str,
          )
          areas = frame['area_km2']
          print('## Island-universe diagnostics')
          print(f'- n_islands: {len(frame)}')
          print(f'- database2_island_rows: {len(core)}')
          print(f'- total_area_km2: {areas.sum():,.1f}')
          print(f'- min_area_km2: {areas.min():,.3f}')
          print(f'- median_area_km2: {areas.median():,.3f}')
          print(f'- max_area_km2: {areas.max():,.3f}')
          print('')
          print('### Largest retained polygon units')
          print('```csv')
          print(
              frame[['island_id', 'parent_feature_id', 'area_km2']]
              .sort_values('area_km2', ascending=False)
              .head(15)
              .to_csv(index=False),
              end='',
          )
          print('```')
          PY
