name: apply_one_week_global_screen

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-one-week-global-screen
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'feat/one-week-global-screen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/one-week-global-screen
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: |
          python scripts/patch_one_week_global_screen.py
          python scripts/fix_one_week_fixture.py
      - name: Validate patch
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pip install -e ".[dev]"
            ruff check --fix \
              src/island_v2/global_trait_campaign.py \
              src/island_v2/global_candidate_index.py \
              tests/test_global_trait_campaign.py \
              tests/test_global_candidate_index.py
            ruff format \
              src/island_v2/global_trait_campaign.py \
              src/island_v2/global_candidate_index.py \
              tests/test_global_trait_campaign.py \
              tests/test_global_candidate_index.py
            pytest -q \
              tests/test_global_trait_campaign.py \
              tests/test_global_candidate_index.py \
              tests/test_openalex_rate_budget.py \
              tests/test_reported_ecology_machine.py
            python scripts/validate_workflows.py
          } 2>&1 | tee one_week_validation.log
      - name: Commit patched production files or diagnostics
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if test "${{ steps.validate.outcome }}" = "success"; then
            git rm -f one_week_validation.log 2>/dev/null || rm -f one_week_validation.log
            git restore .github/workflows/drive-global-trait-campaign.yml
            git add \
              src/island_v2/global_trait_campaign.py \
              src/island_v2/global_candidate_index.py \
              config/global_trait_campaign.yml \
              tests/test_global_trait_campaign.py \
              tests/test_global_candidate_index.py \
              docs/global_trait_campaign.md
            git diff --cached --quiet && { echo "No patch changes."; exit 0; }
            git commit -m "feat: complete the global primary screen within one week"
          else
            git restore src/island_v2/global_trait_campaign.py \
              src/island_v2/global_candidate_index.py \
              config/global_trait_campaign.yml \
              tests/test_global_trait_campaign.py \
              tests/test_global_candidate_index.py \
              docs/global_trait_campaign.md \
              .github/workflows/drive-global-trait-campaign.yml
            git add one_week_validation.log
            git commit -m "chore: record one-week screen validation failure"
          fi
          git push origin HEAD:feat/one-week-global-screen
      - name: Fail after diagnostics are persisted
        if: steps.validate.outcome == 'failure'
        run: exit 1
