name: apply_openalex_rate_patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-openalex-rate-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'fix/openalex-rate-budget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openalex-rate-budget
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python scripts/patch_openalex_rate_budget.py
      - name: Validate patch
        run: |
          pip install -e ".[dev]"
          ruff check --fix src/island_v2/global_trait_campaign.py tests/test_openalex_rate_budget.py
          ruff format src/island_v2/global_trait_campaign.py tests/test_openalex_rate_budget.py
          pytest -q \
            tests/test_openalex_rate_budget.py \
            tests/test_global_trait_campaign.py \
            tests/test_global_candidate_index.py \
            tests/test_reported_ecology_machine.py
          python scripts/validate_workflows.py
      - name: Commit patched production files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/island_v2/global_trait_campaign.py config/global_trait_campaign.yml \
            tests/test_openalex_rate_budget.py
          git diff --cached --quiet && { echo "No patch changes."; exit 0; }
          git commit -m "fix: respect OpenAlex authentication and search budget"
          git push origin HEAD:fix/openalex-rate-budget
