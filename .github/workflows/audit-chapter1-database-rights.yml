name: Audit Chapter 1 database redistribution rights

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-chapter1-database-rights.yml"
      - "config/chapter1_database_release_source_policy.yml"
      - "config/chapter1_database_versions/current.yml"
      - "src/island_v2/chapter1_database_release.py"
      - "analysis/recover_florml_rights_provenance.py"
      - "analysis/recover_validated_low_rights_provenance.py"
      - "analysis/recover_historical_validated_low_rights_provenance.py"
      - "scripts/recover_verified_trait_checkpoint.py"
      - "tests/test_recover_validated_low_rights_provenance.py"
      - "tests/test_recover_historical_validated_low_rights_provenance.py"
  pull_request:
    paths:
      - ".github/workflows/audit-chapter1-database-rights.yml"
      - "config/chapter1_database_release_source_policy.yml"
      - "config/chapter1_database_versions/**"
      - "src/island_v2/chapter1_database_release.py"
      - "analysis/recover_florml_rights_provenance.py"
      - "analysis/recover_validated_low_rights_provenance.py"
      - "analysis/recover_historical_validated_low_rights_provenance.py"
      - "scripts/recover_verified_trait_checkpoint.py"
      - "tests/test_recover_validated_low_rights_provenance.py"
      - "tests/test_recover_historical_validated_low_rights_provenance.py"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test rights/provenance reconstruction helpers
        run: |
          pytest -q \
            tests/test_recover_validated_low_rights_provenance.py \
            tests/test_recover_historical_validated_low_rights_provenance.py
      - name: Resolve immutable Database 1.0 source
        id: db
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          payload = yaml.safe_load(Path('config/chapter1_database_versions/v1.0.0.yml').read_text())
          source = payload['database']['source']
          assert source['kind'] == 'github_artifact'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"repository={source['repository']}\n")
              out.write(f"run_id={source['run_id']}\n")
              out.write(f"artifact_name={source['artifact_name']}\n")
          PY
      - name: Download Database 1.0 source artifact
        run: |
          mkdir -p /tmp/ch1-db-source
          gh run download "${{ steps.db.outputs.run_id }}" \
            --repo "${{ steps.db.outputs.repository }}" \
            -n "${{ steps.db.outputs.artifact_name }}" \
            -D /tmp/ch1-db-source
      - name: Validate immutable ledger
        run: |
          python -m island_v2.chapter1_database_manifest validate \
            --manifest config/chapter1_database_versions/v1.0.0.yml \
            --species-axis /tmp/ch1-db-source/species_axis_coverage.csv.gz
      - name: Download and verify Wave53 rule provenance source
        run: |
          set -euo pipefail
          mkdir -p /tmp/wave53-source
          gh run download 33605098044 --repo "$GITHUB_REPOSITORY" \
            --name wave53-support-two-reproductive-unlock-v2-33605098044 \
            --dir /tmp/wave53-source
          python scripts/recover_verified_trait_checkpoint.py \
            --source /tmp/wave53-source \
            --output /tmp/recovered-wave53
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('/tmp/recovered-wave53/public_source/wave53-all-evidence-audit')
          expected = {
              'resolved_direct_species_trait.csv.gz': '9a6b0a7bec119e68c8fbe05ceadddb84f97526ec3bbfb6f9d89e3b2fb761db79',
              'external_congener_resolved_species_trait.csv.gz': 'c2bd31dc41644ac8a3585dd112684cb744f70153566ec5379d86b77e385affd9',
              'trait_specific_genus_rule_audit.csv.gz': 'd9ea8363f27b341e4b432c2f72c88746127c2d740856d682a826bf21b7fd51a9',
          }
          for name, digest in expected.items():
              path = root / name
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'Wave53 provenance input checksum mismatch: {name}')
          PY
      - name: Download and verify Run329 formal rule provenance source
        run: |
          set -euo pipefail
          mkdir -p /tmp/run329
          gh run download 32932103226 --repo "$GITHUB_REPOSITORY" \
            --name integrated-trait-coverage-32932103226 \
            --dir /tmp/run329
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('/tmp/run329')
          expected = {
              'resolved_direct_species_trait.csv.gz': '16658fd88e5de39a0f4a30d53d24cb2fb251572214e4787625056b1a304250ef',
              'trait_specific_genus_rule_audit.csv.gz': 'd876b67f86fdf10dbda4f899a74e54eeed667b2c638a6652d3c8e18922288825',
          }
          for name, digest in expected.items():
              path = root / name
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'Run329 provenance input checksum mismatch: {name}')
          PY
      - name: Download and verify historical Validated-Low rule sources
        run: |
          set -euo pipefail
          for spec in \
            "33065274749|9643466501|wave34-secondary-coverage-33065274749|sha256:c3142447baad04ecff93f92d396c723eb528fa941fe31b459a05e8a6a9e0c5e6|wave34" \
            "33072865120|9646562206|wave35-trait-coverage-33072865120|sha256:d16b071fa93371a8c31ee6f4bba21702f9cf40c2fc376589b69e3572275bb8a3|wave35" \
            "33149998400|9677327835|wave39-floraweb-synonym-recovery-33149998400|sha256:3b6dbd4dbd1143ae79e79ff16990e881f5371dac5671a2c5d732a4cffe5f00d5|wave39" \
            "33155408805|9679520443|wave40-reviewed-source-recovery-33155408805|sha256:a6a9a2ca28abf44d6fc1ef3b3bba07cecce567d203e6e28db6048ad7b523ee0a|wave40" \
            "33355297355|9744976429|wave41-external-congener-reproduction-33355297355|sha256:2c42f30df358c682119d921c4963939a8a2f4f571912cdcacf100068d2b71803|wave41" \
            "33357283159|9745623568|wave42-external-bulk-reproduction-33357283159|sha256:9b70274b169d241b329eb7fc0c660a3b37329822200c63ba2d26675860348e4d|wave42" \
            "33359673472|9746369275|wave43-austraits-external-morphology-33359673472|sha256:b9ee209ecb7483b9d74fdfe177aacbfd5359cbab38d1349684716ac4945c700b|wave43"; do
            IFS='|' read -r run_id artifact_id artifact_name artifact_digest target <<<"$spec"
            test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")
            test "$(jq -r .name <<<"$metadata")" = "$artifact_name"
            test "$(jq -r .expired <<<"$metadata")" = false
            test "$(jq -r .digest <<<"$metadata")" = "$artifact_digest"
            mkdir -p "/tmp/$target"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" --dir "/tmp/$target"
          done

          WAVE34_FRONTIER=$(find /tmp/wave34 -type f -name trait_specific_rule_frontier.csv.gz -print -quit)
          WAVE33_SECONDARY_LOW=$(find /tmp/wave34 -type f -path '*/wave33_secondary_baseline/validated_probabilistic_genus_low_species_axis.csv.gz' -print -quit)
          WAVE35_RULES=$(find /tmp/wave35 -type f -name wave35_provider_touched_new_rule_audit.csv.gz -print -quit)
          WAVE35_COVERAGE=$(find /tmp/wave35 -type f -path '*/wave35-trait-coverage/wave35_species_axis_coverage.csv.gz' -print -quit)
          WAVE35_DIRECT=$(find /tmp/wave35 -type f -name wave35_resolved_direct_species_trait.csv.gz -print -quit)
          WAVE39_RULES=$(find /tmp/wave39 -type f -path '*/wave39-touched-rule-rebuild/trait_specific_genus_rule_audit.csv.gz' -print -quit)
          WAVE39_DIRECT=$(find /tmp/wave39 -type f -path '*/wave39-touched-rule-rebuild/resolved_direct_species_trait.csv.gz' -print -quit)
          WAVE40_RULES=$(find /tmp/wave40 -type f -path '*/wave40-all-evidence-audit/trait_specific_genus_rule_audit.csv.gz' -print -quit)
          WAVE40_DIRECT=$(find /tmp/wave40 -type f -path '*/wave40-all-evidence-audit/resolved_direct_species_trait.csv.gz' -print -quit)
          WAVE41_RULES=$(find /tmp/wave41 -type f -path '*/wave41-all-evidence-audit/trait_specific_genus_rule_audit.csv.gz' -print -quit)
          WAVE41_DIRECT=$(find /tmp/wave41 -type f -path '*/wave41-all-evidence-audit/resolved_direct_species_trait.csv.gz' -print -quit)
          WAVE41_EXTERNAL=$(find /tmp/wave41 -type f -path '*/wave41-all-evidence-audit/external_congener_resolved_species_trait.csv.gz' -print -quit)
          WAVE42_RULES=$(find /tmp/wave42 -type f -path '*/wave42-all-evidence-audit/trait_specific_genus_rule_audit.csv.gz' -print -quit)
          WAVE42_DIRECT=$(find /tmp/wave42 -type f -path '*/wave42-all-evidence-audit/resolved_direct_species_trait.csv.gz' -print -quit)
          WAVE42_EXTERNAL=$(find /tmp/wave42 -type f -path '*/wave42-all-evidence-audit/external_congener_resolved_species_trait.csv.gz' -print -quit)
          WAVE43_RULES=$(find /tmp/wave43 -type f -path '*/wave43-all-evidence-audit/trait_specific_genus_rule_audit.csv.gz' -print -quit)
          WAVE43_DIRECT=$(find /tmp/wave43 -type f -path '*/wave43-all-evidence-audit/resolved_direct_species_trait.csv.gz' -print -quit)
          WAVE43_EXTERNAL=$(find /tmp/wave43 -type f -path '*/wave43-all-evidence-audit/external_congener_resolved_species_trait.csv.gz' -print -quit)
          for required in \
            "$WAVE34_FRONTIER" "$WAVE33_SECONDARY_LOW" \
            "$WAVE35_RULES" "$WAVE35_COVERAGE" "$WAVE35_DIRECT" \
            "$WAVE39_RULES" "$WAVE39_DIRECT" "$WAVE40_RULES" "$WAVE40_DIRECT" \
            "$WAVE41_RULES" "$WAVE41_DIRECT" "$WAVE41_EXTERNAL" \
            "$WAVE42_RULES" "$WAVE42_DIRECT" "$WAVE42_EXTERNAL" \
            "$WAVE43_RULES" "$WAVE43_DIRECT" "$WAVE43_EXTERNAL"; do
            test -n "$required" && test -f "$required"
          done
          for name in \
            WAVE34_FRONTIER WAVE33_SECONDARY_LOW WAVE35_RULES WAVE35_COVERAGE WAVE35_DIRECT \
            WAVE39_RULES WAVE39_DIRECT WAVE40_RULES WAVE40_DIRECT \
            WAVE41_RULES WAVE41_DIRECT WAVE41_EXTERNAL \
            WAVE42_RULES WAVE42_DIRECT WAVE42_EXTERNAL \
            WAVE43_RULES WAVE43_DIRECT WAVE43_EXTERNAL; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - name: Build preliminary rights audit
        run: |
          python -m island_v2.chapter1_database_release \
            --source-dir /tmp/ch1-db-source \
            --manifest config/chapter1_database_versions/v1.0.0.yml \
            --source-policy config/chapter1_database_release_source_policy.yml \
            --output-dir /tmp/ch1-db-rights
      - name: Recover FlorML provider provenance
        run: |
          python analysis/recover_florml_rights_provenance.py \
            --lineage-details /tmp/ch1-db-rights/SOURCE_LINEAGE_DETAILS.csv \
            --output-dir /tmp/ch1-db-rights
      - name: Rebuild rights audit with recovered provider families
        run: |
          python -m island_v2.chapter1_database_release \
            --source-dir /tmp/ch1-db-source \
            --manifest config/chapter1_database_versions/v1.0.0.yml \
            --source-policy config/chapter1_database_release_source_policy.yml \
            --lineage-family-map /tmp/ch1-db-rights/FLORML_LINEAGE_FAMILY_MAP.csv \
            --output-dir /tmp/ch1-db-rights
      - name: Recover Validated-Low upstream source provenance
        run: |
          python analysis/recover_validated_low_rights_provenance.py \
            --species-axis /tmp/ch1-db-source/species_axis_coverage.csv.gz \
            --wave53-direct /tmp/recovered-wave53/public_source/wave53-all-evidence-audit/resolved_direct_species_trait.csv.gz \
            --wave53-external-congener /tmp/recovered-wave53/public_source/wave53-all-evidence-audit/external_congener_resolved_species_trait.csv.gz \
            --wave53-rules /tmp/recovered-wave53/public_source/wave53-all-evidence-audit/trait_specific_genus_rule_audit.csv.gz \
            --run329-direct /tmp/run329/resolved_direct_species_trait.csv.gz \
            --run329-rules /tmp/run329/trait_specific_genus_rule_audit.csv.gz \
            --lineage-family-map /tmp/ch1-db-rights/FLORML_LINEAGE_FAMILY_MAP.csv \
            --output-dir /tmp/ch1-db-rights
      - name: Recover retained historical Validated-Low rule provenance
        run: |
          python analysis/recover_historical_validated_low_rights_provenance.py \
            --rights-dir /tmp/ch1-db-rights \
            --lineage-family-map /tmp/ch1-db-rights/FLORML_LINEAGE_FAMILY_MAP.csv \
            --run329-direct /tmp/run329/resolved_direct_species_trait.csv.gz \
            --wave34-frontier "$WAVE34_FRONTIER" \
            --wave33-secondary-low "$WAVE33_SECONDARY_LOW" \
            --wave35-rules "$WAVE35_RULES" \
            --wave35-coverage "$WAVE35_COVERAGE" \
            --wave35-direct "$WAVE35_DIRECT" \
            --wave39-rules "$WAVE39_RULES" \
            --wave39-direct "$WAVE39_DIRECT" \
            --wave40-rules "$WAVE40_RULES" \
            --wave40-direct "$WAVE40_DIRECT" \
            --wave41-rules "$WAVE41_RULES" \
            --wave41-direct "$WAVE41_DIRECT" \
            --wave41-external "$WAVE41_EXTERNAL" \
            --wave42-rules "$WAVE42_RULES" \
            --wave42-direct "$WAVE42_DIRECT" \
            --wave42-external "$WAVE42_EXTERNAL" \
            --wave43-rules "$WAVE43_RULES" \
            --wave43-direct "$WAVE43_DIRECT" \
            --wave43-external "$WAVE43_EXTERNAL"
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path('/tmp/ch1-db-rights')
          summary = json.loads((root/'VALIDATED_LOW_PROVENANCE_SUMMARY.json').read_text())
          assert summary['distinct_derived_lineages'] == 3070
          assert summary['exact_rule_generations_recovered'] == 3069
          assert summary['source_provenance_recovered_rule_lineages'] == 3070
          assert summary['new_historical_exact_rule_recoveries'] == 139
          assert summary['historical_state_set_mismatch_rules'] == 1
          assert summary['unresolved_exact_rule_cells'] == 1
          assert summary['unresolved_source_provenance_cells'] == 0
          assert summary['zero_support_cells'] == 0
          mismatch = pd.read_csv(root/'VALIDATED_LOW_SEMANTIC_MISMATCHES.csv')
          assert len(mismatch) == 1
          assert mismatch.iloc[0]['derived_lineage'] == (
              'validated-low:Piptatherum:flower_primary_color:'
              '["blue_purple","green_brown_inconspicuous"]'
          )
          PY
      - name: Summarize rights audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path('/tmp/ch1-db-rights')
          inv = pd.read_csv(root/'SOURCE_LICENSE_INVENTORY.csv')
          blockers = pd.read_csv(root/'RELEASE_BLOCKERS.csv')
          buckets = pd.read_csv(root/'RIGHTS_TRIAGE_BUCKETS.csv')
          manifest = json.loads((root/'RELEASE_MANIFEST.json').read_text())
          lines = [
              '# Chapter 1 Database 1.0 rights audit', '',
              f"- public release ready: **{manifest['release_ready_for_public_zenodo']}**",
              f"- source families after provenance normalization: **{len(inv):,}**",
              f"- blocker families: **{len(blockers):,}**",
              f"- exact source lineages: **{manifest['distinct_source_lineages']:,}**",
              f"- recovered lineage-family overrides applied: **{manifest['lineage_family_overrides_applied']:,}**", '',
              '## Redistribution status', ''
          ]
          status = inv.groupby('redistribution_status', dropna=False)['resolved_cell_mentions'].sum().sort_values(ascending=False)
          for key, value in status.items():
              lines.append(f"- {key}: {int(value):,} resolved-cell mentions")
          lines += ['', '## Rights-review workload by audit bucket', '']
          for _, row in buckets.iterrows():
              lines.append(
                  f"- `{row['audit_bucket']}` — {int(row['blocker_families']):,} families; "
                  f"{int(row['resolved_cell_mentions']):,} cell mentions; {int(row['exact_lineages']):,} exact lineages"
              )
          lines += ['', '## Largest unresolved source families', '']
          if len(blockers):
              for _, row in blockers.sort_values('resolved_cell_mentions', ascending=False).head(30).iterrows():
                  lines.append(
                      f"- `{row['source_family']}` — {int(row['resolved_cell_mentions']):,} cell mentions — "
                      f"example: `{row['example_lineage']}`"
                  )
          (root/'RIGHTS_AUDIT_SUMMARY.md').write_text('\n'.join(lines) + '\n')
          PY
          cat /tmp/ch1-db-rights/FLORML_PROVENANCE_SUMMARY.md | tee -a "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1-db-rights/VALIDATED_LOW_PROVENANCE_SUMMARY.md | tee -a "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1-db-rights/RIGHTS_AUDIT_SUMMARY.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-database-v1-rights-audit-${{ github.run_id }}
          path: /tmp/ch1-db-rights/
          if-no-files-found: error
          retention-days: 90
