name: Historical replay — Audit Chapter 1 effect fingerprint

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: "34232450884"
      PINNED_ARTIFACT_ID: "10058653212"
      PINNED_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PINNED_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Test and lint synthesis
        run: |
          pytest -q tests/test_chapter1_effect_fingerprint.py
          ruff check src/island_v2/chapter1_effect_fingerprint.py tests/test_chapter1_effect_fingerprint.py

      - name: Verify and download frozen PR142 artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$PINNED_ARTIFACT_ID"
          test "$observed_digest" = "$PINNED_ARTIFACT_DIGEST"
          rm -rf /tmp/pr142-final
          mkdir -p /tmp/pr142-final
          gh run download "$PINNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PINNED_ARTIFACT_NAME" --dir /tmp/pr142-final
          test -s /tmp/pr142-final/taxonomic-depth/all_analysis_eligible/slopes.csv
          test -s /tmp/pr142-final/taxonomic-depth/direct_only/slopes.csv
          test -s /tmp/pr142-final/atomic/all/observed_within_outcome_slopes.csv
          test -s /tmp/pr142-final/atomic/direct/observed_within_outcome_slopes.csv

      - name: Build effect-size fingerprint
        run: |
          rm -rf /tmp/effect-fingerprint
          python -m island_v2.chapter1_effect_fingerprint \
            --artifact-root /tmp/pr142-final \
            --config-path config/chapter1_effect_fingerprint.yml \
            --output-dir /tmp/effect-fingerprint

      - name: Validate and summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/effect-fingerprint')
          manifest=json.loads((root/'chapter1_effect_fingerprint_manifest.json').read_text())
          att=pd.read_csv(root/'taxonomic_vector_attenuation.csv')
          fp=pd.read_csv(root/'atomic_response_fingerprint.csv')
          assert manifest['new_p_values_generated'] is False
          assert manifest['mechanism_promoted'] is False
          assert len(att) == 16
          assert set(fp['domain']) == {'flower_colour','floral_structural_complexity','reproductive_assurance'}
          lines=[
              '# Chapter 1 effect-size fingerprint', '',
              f"Palearctic genus attenuation range: **{att['genus_attenuation_fraction'].min():.1%}–{att['genus_attenuation_fraction'].max():.1%}**",
              f"Median attenuation: **{att['genus_attenuation_fraction'].median():.1%}**", '',
              '## Palearctic two-axis vector attenuation', '',
              '| evidence | stratum | source mode | observed norm | family norm | genus norm | genus attenuation |',
              '|---|---|---|---:|---:|---:|---:|',
          ]
          for row in att.itertuples(index=False):
              lines.append(
                  f'| {row.evidence_scope} | {row.stratum} | {row.source_mode} | '
                  f'{row.observed_score_vector_norm:.4f} | {row.after_family_residual_vector_norm:.4f} | '
                  f'{row.after_genus_residual_vector_norm:.4f} | {row.genus_attenuation_fraction:.1%} |'
              )
          lines += ['', '## Atomic component fingerprint', '',
                    '| evidence | stratum | context | outcome | slope | 95% CI | direction |',
                    '|---|---|---|---|---:|---|---|']
          for row in fp.itertuples(index=False):
              lines.append(
                  f'| {row.evidence_scope} | {row.stratum} | {row.context} | {row.outcome} | '
                  f'{row.geography_slope_log_odds_per_response_sd:.4f} | '
                  f'[{row.ci_low:.4f}, {row.ci_high:.4f}] | {row.direction} |'
              )
          (root/'RESULT_SUMMARY.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
          cat /tmp/effect-fingerprint/RESULT_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-effect-fingerprint-${{ github.run_id }}
          path: /tmp/effect-fingerprint/
          if-no-files-found: error
          retention-days: 90
