name: Audit Chapter 1 EL hierarchical depth

on:
  push:
    branches:
      - ch1/el-hierarchical-depth-audit
    paths:
      - "config/chapter1_el_hierarchical_depth_audit.yml"
      - "src/island_v2/chapter1_hierarchical_depth_interaction.py"
      - "tests/test_chapter1_hierarchical_depth_interaction.py"
      - ".github/workflows/audit-chapter1-el-hierarchical-depth.yml"
  pull_request:
    branches: [main]
    paths:
      - "config/chapter1_el_hierarchical_depth_audit.yml"
      - "src/island_v2/chapter1_hierarchical_depth_interaction.py"
      - "tests/test_chapter1_hierarchical_depth_interaction.py"
      - ".github/workflows/audit-chapter1-el-hierarchical-depth.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter1-el-depth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: "34232450884"
      PINNED_ARTIFACT_ID: "10058653212"
      PINNED_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PINNED_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test and lint matched-depth implementation
        run: |
          pytest -q tests/test_chapter1_hierarchical_depth_interaction.py
          ruff check \
            src/island_v2/chapter1_hierarchical_depth_interaction.py \
            tests/test_chapter1_hierarchical_depth_interaction.py

      - name: Verify and download frozen final PR142 artifact
        run: |
          set -euo pipefail
          metadata=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r \
            ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .id" \
            <<<"$metadata")
          observed_digest=$(jq -r \
            ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .digest" \
            <<<"$metadata")
          test "$observed_id" = "$PINNED_ARTIFACT_ID"
          test "$observed_digest" = "$PINNED_ARTIFACT_DIGEST"
          rm -rf /tmp/pr142-final
          mkdir -p /tmp/pr142-final
          gh run download "$PINNED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$PINNED_ARTIFACT_NAME" \
            --dir /tmp/pr142-final
          test -s /tmp/pr142-final/architecture/all_analysis_eligible/source_adjusted_scores.csv
          test -s /tmp/pr142-final/architecture/all_analysis_eligible/genus_long.csv
          test -s /tmp/pr142-final/architecture/direct_only/source_adjusted_scores.csv
          test -s /tmp/pr142-final/architecture/direct_only/genus_long.csv
          test -s /tmp/pr142-final/fixed/isolation/results/purpose_shortest_island_data.csv

      - name: Run matched context by taxonomic-stage audit
        run: |
          set -euo pipefail
          rm -rf /tmp/el-depth-audit
          python -m island_v2.chapter1_hierarchical_depth_interaction run \
            --all-pre-genus-csv /tmp/pr142-final/architecture/all_analysis_eligible/source_adjusted_scores.csv \
            --all-genus-long-csv /tmp/pr142-final/architecture/all_analysis_eligible/genus_long.csv \
            --direct-pre-genus-csv /tmp/pr142-final/architecture/direct_only/source_adjusted_scores.csv \
            --direct-genus-long-csv /tmp/pr142-final/architecture/direct_only/genus_long.csv \
            --covariates-csv /tmp/pr142-final/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_el_hierarchical_depth_audit.yml \
            --output-dir /tmp/el-depth-audit

      - name: Validate output shape without requiring a biological conclusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/el-depth-audit')
          joint = pd.read_csv(root / 'matched_depth_joint_tests.csv')
          effects = pd.read_csv(root / 'matched_depth_component_effects.csv')
          manifest = json.loads((root / 'matched_depth_manifest.json').read_text())

          assert manifest['contract'] == 'chapter1_el_hierarchical_depth_audit_v1'
          assert manifest['status'] == 'matched_depth_audit_complete'
          assert set(manifest['components']) == {
              'shared_architecture_factor',
              'large_bee_like_residual',
              'butterfly_like_residual',
              'bird_like_residual',
          }
          assert len(joint) == 2 * 2 * 4
          assert set(joint['evidence_scope']) == {'all_analysis_eligible', 'direct_only'}
          assert set(joint['stratum']) == {'all_native', 'native_nonendemic'}
          assert set(joint['source_mode']) == {
              'geo_k5', 'geo_k10', 'geo_k20', 'geo50_climate10'
          }
          assert joint['status'].eq('fit').all()
          assert len(effects) == len(joint) * 4
          assert effects['ci95_low'].notna().all()
          assert effects['ci95_high'].notna().all()
          print(joint[[
              'evidence_scope', 'stratum', 'source_mode',
              'joint_context_by_stage_chisq', 'joint_context_by_stage_df',
              'p_value', 'q_across_source_modes', 'source_mode_supported'
          ]].to_string(index=False))
          print(json.dumps(manifest, indent=2))
          PY

      - name: Write audit summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/el-depth-audit')
          joint = pd.read_csv(root / 'matched_depth_joint_tests.csv')
          manifest = json.loads((root / 'matched_depth_manifest.json').read_text())
          summary = Path('/tmp/el-depth-audit/RESULT_SUMMARY.md')
          lines = [
              '# Matched context x taxonomic-depth audit',
              '',
              f"Classification: **{manifest['publication_gate_classification']}**",
              '',
              '| evidence | stratum | source mode | p | q | supported |',
              '|---|---|---|---:|---:|---|',
          ]
          for row in joint.itertuples(index=False):
              lines.append(
                  f'| {row.evidence_scope} | {row.stratum} | {row.source_mode} | '
                  f'{row.p_value:.6g} | {row.q_across_source_modes:.6g} | '
                  f'{bool(row.source_mode_supported)} |'
              )
          lines += [
              '',
              manifest['claim_boundary'],
              '',
              'This audit is a matched secondary re-expression of a frozen dataset; '
              'it is not presented as a newly preregistered outcome-blind primary test.',
          ]
          summary.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat /tmp/el-depth-audit/RESULT_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-el-hierarchical-depth-${{ github.run_id }}
          path: /tmp/el-depth-audit/
          if-no-files-found: error
          retention-days: 90
