name: Historical replay — Audit Chapter 1 H4 prospective temporal replication

concurrency:
  group: h4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test prospective outcome-blind gate
        run: |
          pytest -q \
            tests/test_chapter1_h4_prospective_temporal_replication.py \
            tests/test_chapter1_h4_prospective_methods_preflight.py \
            tests/test_chapter1_h4_prospective_validation_summary.py
      - name: Ruff prospective implementation
        run: |
          ruff check \
            src/island_v2/chapter1_h4_prospective_temporal_replication.py \
            scripts/screen_chapter1_h4_prospective_methods.py \
            scripts/build_chapter1_h4_prospective_support_metadata.py \
            scripts/discover_chapter1_h4_prospective_literature.py \
            scripts/build_chapter1_h4_prospective_trait_states.py \
            tests/test_chapter1_h4_prospective_temporal_replication.py \
            tests/test_chapter1_h4_prospective_methods_preflight.py \
            tests/test_chapter1_h4_prospective_validation_summary.py
