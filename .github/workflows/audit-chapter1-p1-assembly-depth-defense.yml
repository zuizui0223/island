name: Audit Chapter 1 P1 assembly-depth defense

on:
  push:
    branches: ["ch1/nee-bottom-up-p0-p1"]
    paths:
      - "config/chapter1_p1_assembly_depth_defense.yml"
      - "src/island_v2/chapter1_p1_assembly_depth_defense.py"
      - "tests/test_chapter1_p1_assembly_depth_defense.py"
      - ".github/workflows/audit-chapter1-p1-assembly-depth-defense.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  p1ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: "34232450884"
      PINNED_ARTIFACT_ID: "10058653212"
      PINNED_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PINNED_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install repository
        run: pip install -e ".[dev]"

      - name: Test and lint P1 implementation
        run: |
          pytest -q tests/test_chapter1_p1_assembly_depth_defense.py
          ruff check \
            src/island_v2/chapter1_p1_assembly_depth_defense.py \
            tests/test_chapter1_p1_assembly_depth_defense.py

      - name: Verify and download pinned PR142 artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$PINNED_ARTIFACT_ID"
          test "$observed_digest" = "$PINNED_ARTIFACT_DIGEST"
          rm -rf /tmp/p1
          mkdir -p /tmp/p1/pr142
          gh run download "$PINNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PINNED_ARTIFACT_NAME" --dir /tmp/p1/pr142
          test -s /tmp/p1/pr142/taxonomic-depth/chapter1_v2_taxonomic_depth_manifest.json
          test -s /tmp/p1/pr142/taxonomic-depth/direct_only/decomposition.csv
          test -s /tmp/p1/pr142/syndrome/direct/species_syndrome_concordance.csv.gz

      - name: Run frozen P1a and P1b
        run: |
          python -m island_v2.chapter1_p1_assembly_depth_defense \
            --artifact-root /tmp/p1/pr142 \
            --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --source-config-path config/chapter1_pr138_source_pool_sensitivity.yml \
            --explanation-config-path config/chapter1_explanation_gap_validation.yml \
            --p1-config-path config/chapter1_p1_assembly_depth_defense.yml \
            --output-dir /tmp/p1/out

      - name: Verify formal outputs without requiring scientific P1b success
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/p1/out')
          manifest = json.loads((root / 'chapter1_p1ab_manifest.json').read_text())
          assert manifest['pinned_workflow_run_id'] == 34232450884
          assert manifest['pinned_artifact_id'] == 10058653212
          assert manifest['pinned_artifact_digest'] == 'sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999'
          assert manifest['p1a_exact_reconstruction_pass'] is True
          assert manifest['n_direct_only_profiles'] == 8
          assert manifest['bootstrap_draws'] == 2000
          assert manifest['bootstrap_seed'] == 20260915
          assert manifest['p1c_opened'] is False
          summary = pd.read_csv(root / 'p1b_paired_bootstrap_summary.csv')
          direct = summary.loc[summary['evidence_scope'].eq('direct_only')]
          assert len(direct) == 8
          assert direct['n_valid_draws'].min() >= 1900
          audit = pd.read_csv(root / 'p1a_exact_pair_audit.csv')
          assert audit['exact_reconstruction_pass'].astype(bool).all()
          # Scientific support loss is a valid result and must not fail CI.
          print(json.dumps(manifest, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-p1ab-assembly-depth-${{ github.run_id }}
          path: /tmp/p1/out/
          if-no-files-found: error
          retention-days: 90
