name: Historical replay — Audit Chapter 1 P1 paired support

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: "34232450884"
      PINNED_ARTIFACT_ID: "10058653212"
      PINNED_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PINNED_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test and lint P1a audit
        run: |
          pytest -q tests/test_chapter1_p1_paired_support_audit.py
          ruff check src/island_v2/chapter1_p1_paired_support_audit.py tests/test_chapter1_p1_paired_support_audit.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path('config/chapter1_p1_assembly_depth_defense.yml').read_text())
          assert cfg['contract'] == 'chapter1_p1_assembly_depth_defense_v1'
          assert cfg['p1c_matched_complexity_genus_null']['permutations'] == 2000
          assert cfg['p1c_matched_complexity_genus_null']['random_seed'] == 20260915
          assert cfg['p1b_direct_only_safeguard']['primary_evidence_scope'] == 'direct_only'
          PY
      - name: Verify and download pinned primary artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$PINNED_ARTIFACT_ID"
          test "$observed_digest" = "$PINNED_ARTIFACT_DIGEST"
          rm -rf /tmp/p1a-primary /tmp/p1a-out
          mkdir -p /tmp/p1a-primary
          gh run download "$PINNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PINNED_ARTIFACT_NAME" --dir /tmp/p1a-primary
          test -s /tmp/p1a-primary/taxonomic-depth/direct_only/decomposition.csv
          test -s /tmp/p1a-primary/taxonomic-depth/direct_only/long_scores.csv
          test -s /tmp/p1a-primary/taxonomic-depth/all_analysis_eligible/decomposition.csv
          test -s /tmp/p1a-primary/taxonomic-depth/all_analysis_eligible/long_scores.csv
      - name: Run P1a exact paired-support audit
        run: |
          python -m island_v2.chapter1_p1_paired_support_audit \
            --artifact-root /tmp/p1a-primary \
            --config-path config/chapter1_p1_assembly_depth_defense.yml \
            --output-dir /tmp/p1a-out
      - name: Validate P1a output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path('/tmp/p1a-out')
          manifest = json.loads((root/'chapter1_p1a_paired_support_manifest.json').read_text())
          assert manifest['primary_direct_only_pass'] is True
          cells = pd.read_csv(root/'p1a_paired_support_cells.csv')
          assert len(cells) == 32
          assert cells['same_support_all_three_stages'].astype(bool).all()
          assert cells['same_n_species_weight_all_three_stages'].astype(bool).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-p1a-paired-support-${{ github.run_id }}
          path: /tmp/p1a-out/
          if-no-files-found: error
          retention-days: 90
