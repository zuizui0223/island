name: Qualify Chapter 1 P1c matched-genus null

on:
  push:
    branches: ["ch1/nee-island-first-design"]
    paths:
      - "config/chapter1_p1_assembly_depth_defense.yml"
      - "src/island_v2/chapter1_p1c_matched_genus_qualification.py"
      - "tests/test_chapter1_p1c_matched_genus_qualification.py"
      - ".github/workflows/audit-chapter1-p1c-matched-genus-qualification.yml"

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: "34232450884"
      PINNED_ARTIFACT_ID: "10058653212"
      PINNED_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PINNED_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test and lint P1c qualification
        run: |
          pytest -q tests/test_chapter1_p1c_matched_genus_qualification.py
          ruff check src/island_v2/chapter1_p1c_matched_genus_qualification.py tests/test_chapter1_p1c_matched_genus_qualification.py
      - name: Verify and download pinned primary artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$PINNED_ARTIFACT_ID"
          test "$observed_digest" = "$PINNED_ARTIFACT_DIGEST"
          rm -rf /tmp/p1c-primary /tmp/p1c-qual
          mkdir -p /tmp/p1c-primary
          gh run download "$PINNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PINNED_ARTIFACT_NAME" --dir /tmp/p1c-primary
          test -s /tmp/p1c-primary/syndrome/direct/species_syndrome_concordance.csv.gz
          test -s /tmp/p1c-primary/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/p1c-primary/fixed/source/source/gift_native_mainland_flora.csv.gz
          test -s /tmp/p1c-primary/fixed/source/result/island_source_assignments.csv.gz
          test -s /tmp/p1c-primary/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/p1c-primary/fixed/realm/realm/island_biogeographic_realm_assignment.csv
          test -s /tmp/p1c-primary/taxonomic-depth/direct_only/decomposition.csv
          test -s /tmp/p1c-primary/taxonomic-depth/direct_only/slopes.csv
      - name: Run outcome-closed P1c qualification
        run: |
          python -m island_v2.chapter1_p1c_matched_genus_qualification \
            --artifact-root /tmp/p1c-primary \
            --taxonomy-path data/v2/staging/gbif/collected/island_taxa.csv \
            --p1-config-path config/chapter1_p1_assembly_depth_defense.yml \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --source-config-path config/chapter1_pr138_source_pool_sensitivity.yml \
            --explanation-config-path config/chapter1_explanation_gap_validation.yml \
            --output-dir /tmp/p1c-qual
      - name: Validate outcome-closed qualification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/p1c-qual/chapter1_p1c_qualification_manifest.json').read_text())
          assert m['pseudo_attenuation_reported_or_stored'] is False
          assert m['new_biological_p_value_generated'] is False
          assert m['true_reproduction_pass'] is True
          assert m['pseudo_partition_audit']['group_size_multiset_preserved_all_families'] is True
          assert m['pseudo_primary_profiles_fit'] == 8
          assert m['pseudo_two_axis_slope_rows_fit'] == 16
          assert m['qualified_for_full_2000_permutation_null'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-p1c-qualification-${{ github.run_id }}
          path: /tmp/p1c-qual/
          if-no-files-found: error
          retention-days: 90
