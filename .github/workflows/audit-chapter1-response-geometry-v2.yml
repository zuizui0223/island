name: Audit Chapter 1 response-geometry V2

on:
  push:
    branches:
      - ch1/el-hierarchical-depth-audit
    paths:
      - "config/chapter1_response_geometry_v2.yml"
      - "src/island_v2/chapter1_response_geometry_calibrated.py"
      - "tests/test_chapter1_response_geometry_calibrated.py"
      - ".github/workflows/audit-chapter1-response-geometry-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "config/chapter1_response_geometry_v2.yml"
      - "src/island_v2/chapter1_response_geometry_calibrated.py"
      - "tests/test_chapter1_response_geometry_calibrated.py"
      - ".github/workflows/audit-chapter1-response-geometry-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter1-response-geometry-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrated-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: "34232450884"
      PINNED_ARTIFACT_ID: "10058653212"
      PINNED_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PINNED_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test and lint calibrated geometry audit
        run: |
          pytest -q tests/test_chapter1_response_geometry_calibrated.py
          ruff check \
            src/island_v2/chapter1_response_geometry_calibrated.py \
            tests/test_chapter1_response_geometry_calibrated.py

      - name: Verify and download frozen final PR142 artifact
        run: |
          set -euo pipefail
          metadata=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r \
            ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .id" \
            <<<"$metadata")
          observed_digest=$(jq -r \
            ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .digest" \
            <<<"$metadata")
          test "$observed_id" = "$PINNED_ARTIFACT_ID"
          test "$observed_digest" = "$PINNED_ARTIFACT_DIGEST"
          rm -rf /tmp/pr142-final
          mkdir -p /tmp/pr142-final
          gh run download "$PINNED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$PINNED_ARTIFACT_NAME" \
            --dir /tmp/pr142-final
          test -s /tmp/pr142-final/atomic/all/observed_broad_syndrome_counts.csv.gz
          test -s /tmp/pr142-final/atomic/direct/observed_broad_syndrome_counts.csv.gz
          test -s /tmp/pr142-final/fixed/isolation/results/purpose_shortest_island_data.csv

      - name: Run held-out calibrated recovery audit
        run: |
          set -euo pipefail
          rm -rf /tmp/geometry-v2
          python -m island_v2.chapter1_response_geometry_calibrated \
            --all-counts /tmp/pr142-final/atomic/all/observed_broad_syndrome_counts.csv.gz \
            --direct-counts /tmp/pr142-final/atomic/direct/observed_broad_syndrome_counts.csv.gz \
            --covariates-csv /tmp/pr142-final/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_response_geometry_v2.yml \
            --output-dir /tmp/geometry-v2

      - name: Validate V2 fail-closed output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/geometry-v2')
          manifest = json.loads((root / 'geometry_v2_manifest.json').read_text())
          design = pd.read_csv(root / 'geometry_v2_design_support.csv')
          calibration = pd.read_csv(root / 'geometry_v2_calibration.csv')
          validation = pd.read_csv(root / 'geometry_v2_validation.csv')
          scope = pd.read_csv(root / 'geometry_v2_scope_shape_qualification.csv')
          cross = pd.read_csv(root / 'geometry_v2_cross_scope_shape_qualification.csv')

          assert manifest['contract'] == 'chapter1_response_geometry_identifiability_v2'
          assert manifest['status'] == 'v2_recovery_audit_complete_observed_geometry_still_closed'
          assert manifest['parent_v1_run'] == 34764480158
          assert manifest['observed_geometry_fitted'] is False
          assert manifest['observed_breakpoint_reported'] is False
          assert manifest['calibration_and_validation_seeds_differ'] is True
          assert len(design) == 24
          assert design['support_qualified'].all()
          assert len(calibration) == 24 * 4
          assert set(validation['truth_shape']) == {
              'G0_flat', 'G1_cline', 'G2_step', 'G3_hinge', 'G4_reversal'
          }
          assert len(scope) == 24 * 3
          assert len(cross) == 12 * 3
          assert set(cross['shape']) == {'G2_step', 'G3_hinge', 'G4_reversal'}
          print(cross.to_string(index=False))
          print(json.dumps(manifest, indent=2))
          PY

      - name: Write V2 qualification summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/geometry-v2')
          manifest = json.loads((root / 'geometry_v2_manifest.json').read_text())
          cross = pd.read_csv(root / 'geometry_v2_cross_scope_shape_qualification.csv')
          scope = pd.read_csv(root / 'geometry_v2_scope_shape_qualification.csv')
          lines = [
              '# Chapter 1 response-geometry V2 held-out calibration',
              '',
              f"Headline-qualified shape tests: **{manifest['n_headline_shape_qualified']} / {manifest['n_cross_scope_shape_tests']}**",
              '',
              f"By shape: `{manifest['headline_qualified_by_shape']}`",
              '',
              '| axis | context | stratum | shape | all-analysis | direct-only | headline eligible |',
              '|---|---|---|---|---|---|---|',
          ]
          for row in cross.itertuples(index=False):
              lines.append(
                  f'| {row.measurement_axis} | {row.context} | {row.stratum} | {row.shape} | '
                  f'{bool(row.all_analysis_qualified)} | {bool(row.direct_only_qualified)} | '
                  f'{bool(row.headline_shape_qualified)} |'
              )
          lines += [
              '',
              '## Scope-level diagnostics',
              '',
              '| evidence | axis | context | stratum | shape | critical D | max false nonlinear | min recovery | max breakpoint MAE | qualified |',
              '|---|---|---|---|---|---:|---:|---:|---:|---|',
          ]
          for row in scope.itertuples(index=False):
              lines.append(
                  f'| {row.evidence_scope} | {row.measurement_axis} | {row.context} | '
                  f'{row.stratum} | {row.shape} | {row.critical_D:.3f} | '
                  f'{row.maximum_validation_false_nonlinear_rate:.3f} | '
                  f'{row.minimum_shape_recovery_rate:.3f} | '
                  f'{row.maximum_breakpoint_quantile_mae:.3f} | '
                  f'{bool(row.scope_shape_qualified)} |'
              )
          lines += [
              '',
              manifest['claim_boundary'],
              '',
              'Calibration and validation simulations use different frozen seeds. No observed nonlinear fit is produced here.',
          ]
          (root / 'RESULT_SUMMARY.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat /tmp/geometry-v2/RESULT_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-response-geometry-v2-${{ github.run_id }}
          path: /tmp/geometry-v2/
          if-no-files-found: error
          retention-days: 90
