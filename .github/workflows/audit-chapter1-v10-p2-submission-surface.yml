name: Audit Chapter 1 v10 P2-defended submission surface

on:
  push:
    branches: ["main", "ch1/p2-component-nonconcordance"]
    paths:
      - "config/chapter1_p2_component_nonconcordance*.yml"
      - "config/chapter1_p2_component_nonconcordance_result_lock.json"
      - "config/chapter1_v10_figure2_p2_result_lock.json"
      - "src/island_v2/chapter1_p2_component_nonconcordance.py"
      - "src/island_v2/chapter1_v10_figure2_p2_submission.py"
      - "tests/test_chapter1_p2_component_nonconcordance.py"
      - "tests/test_chapter1_v10_figure2_p2_submission.py"
      - "docs/chapter1_manuscript_full_v10_island_first_p1_p2_defended_20260915.md"
      - "docs/chapter1_submission_freeze_20260915_p1_p2_defended.md"
      - "docs/chapter1_v10_submission_figure_sync_20260915.md"
      - "docs/chapter1_p2_component_nonconcordance_result_20260915.md"
      - "README.md"
      - "docs/PAPER_PIPELINE.md"
      - ".github/workflows/audit-chapter1-v10-p2-submission-surface.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-v10-p2:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,figures]"

      - name: Run P2 and Figure 2 tests
        run: |
          pytest -q tests/test_chapter1_p2_component_nonconcordance.py tests/test_chapter1_v10_figure2_p2_submission.py
          ruff check \
            src/island_v2/chapter1_p2_component_nonconcordance.py \
            src/island_v2/chapter1_v10_figure2_p2_submission.py \
            tests/test_chapter1_p2_component_nonconcordance.py \
            tests/test_chapter1_v10_figure2_p2_submission.py

      - name: Verify live artifact identities
        run: |
          set -euo pipefail
          p2=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/34945548775/artifacts?per_page=100")
          test "$(jq -r '.artifacts[] | select(.id == 10387261614) | .digest' <<<"$p2")" = "sha256:f2038c37459986c5b4abc57265fb69026abb34d1c46eb4733acc504588bf2491"
          fig=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/34946927756/artifacts?per_page=100")
          test "$(jq -r '.artifacts[] | select(.id == 10387498515) | .digest' <<<"$fig")" = "sha256:b9391c238b33e1ee4c15d26ea8afbbf8d615c20f5d4018c6a75d1568476427ca"

      - name: Verify P2 locks and manuscript claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p2=json.loads(Path('config/chapter1_p2_component_nonconcordance_result_lock.json').read_text())
          f2=json.loads(Path('config/chapter1_v10_figure2_p2_result_lock.json').read_text())
          manuscript=Path('docs/chapter1_manuscript_full_v10_island_first_p1_p2_defended_20260915.md').read_text()
          freeze=Path('docs/chapter1_submission_freeze_20260915_p1_p2_defended.md').read_text()
          sync=Path('docs/chapter1_v10_submission_figure_sync_20260915.md').read_text()
          readme=Path('README.md').read_text()
          pipeline=Path('docs/PAPER_PIPELINE.md').read_text()

          assert p2['status']=='same_layer_vector_branching_robust_but_strong_noncollinearity_not_established'
          primary=p2['primary_same_layer_contrast']
          assert primary['context_layer']=='analysis_regime'
          assert primary['context_a']=='northern_midlatitude'
          assert primary['context_b']=='tropical'
          assert abs(primary['joint_vector_difference_p']-0.0009472634181526601) < 1e-15
          assert primary['common_island_n']==348
          assert primary['spatial_blocks']==78
          assert primary['determinant_95ci'][0] < 0 < primary['determinant_95ci'][1]
          assert primary['strong_noncollinearity_established'] is False
          cs=p2['common_species_sensitivity']
          assert cs['direct_only_coobserved_species']==853
          assert abs(cs['direct_only_native_nonendemic_joint_vector_difference_p']-0.0051667767759729175) < 1e-15
          assert p2['realm_boundary']['supported'] is False

          assert f2['workflow_run_id']==34946927756
          assert f2['artifact_id']==10387498515
          assert f2['source_p2_result']['workflow_run_id']==34945548775
          assert f2['visual_review']['submission_layout']=='accepted'

          required = [
              'Full working manuscript v10',
              'formal H2 direct comparison is northern-midlatitude versus tropical',
              'p=0.000947',
              'p=0.00517',
              'Palearctic–Neotropical direct vector tests are unsupported',
              'stronger geometric claim did not pass',
              '## Claim ceiling for v10',
          ]
          for phrase in required:
              assert phrase in manuscript, phrase
          assert 'Palearctic and tropical are not the two labels of one formal direct context contrast' in manuscript
          assert 'chapter1_manuscript_full_v10_island_first_p1_p2_defended_20260915.md' in readme
          assert 'chapter1_v10_figure2_p2_result_lock.json' in readme
          assert 'chapter1_p2_component_nonconcordance_result_lock.json' in pipeline
          assert 'canonical island-first v10 manuscript' in pipeline
          assert 'Palearctic and tropical must not be presented as labels of one formal direct context contrast' in freeze
          assert 'North–Tropical vectors are proven non-collinear' in freeze
          assert 'Palearctic and tropical are not interchangeable labels within one formal direct contrast' in sync

          forbidden_affirmative = [
              'Palearctic and tropical response vectors differ in composition/direction',
              'The formal H2 direct comparison is Palearctic versus tropical',
          ]
          canonical='\n'.join([manuscript, freeze, sync, readme, pipeline])
          for phrase in forbidden_affirmative:
              assert phrase not in canonical, phrase
          PY
