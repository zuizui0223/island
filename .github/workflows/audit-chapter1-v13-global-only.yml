name: Historical replay — Chapter 1 v13 global-only audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,figures]"
      - name: Run v13 submission tests
        env:
          PYTHONPATH: .:src
          MPLBACKEND: Agg
        run: pytest -q tests/test_chapter1_v13_submission_lock.py tests/test_chapter1_v13_submission_surface.py tests/test_chapter1_v13_functional_bridge.py
      - name: Ruff v13 code
        run: ruff check src/island_v2/chapter1_v13_*.py tests/test_chapter1_v13_*.py
      - name: Ensure historical v11/v12 submission files are not modified
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          changed=$(git diff --name-only origin/main...HEAD)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^docs/chapter1_manuscript_full_v11_|^config/chapter1_v12_|^docs/chapter1_v11_)'; then
            echo 'Historical v11/v12 submission provenance was modified' >&2
            exit 1
          fi
