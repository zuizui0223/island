name: Audit WCVP regional-native H1 convergence

on:
  push:
    branches:
      - analysis/wcvp-native-corrected
    paths:
      - ".github/workflows/audit-chapter1-wcvp-native-convergence.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
      WCVP_RUN_ID: "37090147140"
      WCVP_ARTIFACT: "chapter1-wcvp-native-corrected-37090147140"
      STATUS_RUN_ID: "32559322028"
      STATUS_ARTIFACT: "official-wcvp-corroborated-status-32559322028"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Download frozen inputs and WCVP ranges
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit/source /tmp/audit/wcvp /tmp/audit/status
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/audit/source
          gh run download "$WCVP_RUN_ID" -n "$WCVP_ARTIFACT" -D /tmp/audit/wcvp
          gh run download "$STATUS_RUN_ID" -n "$STATUS_ARTIFACT" -D /tmp/audit/status
          test -s /tmp/audit/source/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/audit/source/snapshot/chapter1_trait_state_audit_all.csv.gz
          test -s /tmp/audit/wcvp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz

      - name: Build expanded-iteration config
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path("config/chapter1_v14_all_data_probability.yml")
          cfg=yaml.safe_load(p.read_text())
          cfg["max_iter"]=5000
          out=Path("/tmp/audit/chapter1_v14_all_data_probability_maxiter5000.yml")
          out.write_text(yaml.safe_dump(cfg, sort_keys=False))
          PY

      - name: Refit all-analysis regional-native H1
        run: |
          python -m island_v2.chapter1_wcvp_native_compatibility \
            --status-flora-csv /tmp/audit/source/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/audit/source/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --wcvp-ranges-csv /tmp/audit/wcvp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz \
            --island-tdwg-csv /tmp/audit/status/resolved/island_tdwg_l3_mapping.csv \
            --config-path /tmp/audit/chapter1_v14_all_data_probability_maxiter5000.yml \
            --evidence-scope all_analysis_eligible \
            --output-dir /tmp/audit/results

      - name: Compare and persist audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          old=pd.read_csv("results/wcvp_native_corrected_20261003/all/regional_native_within_omnibus.csv")
          new=pd.read_csv("/tmp/audit/results/regional_native_within_omnibus.csv")
          old_s=pd.read_csv("results/wcvp_native_corrected_20261003/all/regional_native_within_slopes.csv")
          new_s=pd.read_csv("/tmp/audit/results/regional_native_within_slopes.csv")
          ctx="northern_high_latitude"
          o=old.loc[old.context.eq(ctx)].iloc[0].to_dict()
          n=new.loc[new.context.eq(ctx)].iloc[0].to_dict()
          os=old_s.loc[(old_s.context.eq(ctx)) & (old_s.outcome.eq("generalized_form"))].iloc[0].to_dict()
          ns=new_s.loc[(new_s.context.eq(ctx)) & (new_s.outcome.eq("generalized_form"))].iloc[0].to_dict()
          out={
            "context":ctx,
            "max_iter_retry":5000,
            "original_omnibus":o,
            "retry_omnibus":n,
            "original_generalized_form":os,
            "retry_generalized_form":ns,
            "absolute_slope_change":abs(float(ns["geography_slope_log_odds"])-float(os["geography_slope_log_odds"])),
          }
          Path("/tmp/audit/convergence_audit.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          target=results/wcvp_native_corrected_20261003/convergence_retry
          mkdir -p "$target"
          cp /tmp/audit/results/*.csv "$target/"
          cp /tmp/audit/convergence_audit.json "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Audit WCVP native H1 convergence"
          git push
