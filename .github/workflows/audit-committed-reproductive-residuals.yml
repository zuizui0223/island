name: Audit committed reproductive evidence residuals

on:
  push:
    branches: [codex/recover-verified-checkpoint]
    paths:
      - scripts/audit_committed_reproductive_residuals.py
      - .github/workflows/audit-committed-reproductive-residuals.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: committed-reproductive-residuals-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_SOURCE_BATCH_RUN: '34184996347'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas pyyaml tabulate

      - name: Download current cumulative public checkpoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          gh run download "$CURRENT_SOURCE_BATCH_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "source-scale-batch-integration-${CURRENT_SOURCE_BATCH_RUN}" \
            --dir /tmp/current
          CURRENT_COVERAGE=$(find /tmp/current -name species_axis_coverage.csv.gz -print -quit)
          CURRENT_DIRECT=$(find /tmp/current -name direct_species_trait_ledger.csv.gz -print -quit)
          test -n "$CURRENT_COVERAGE" && test -f "$CURRENT_COVERAGE"
          test -n "$CURRENT_DIRECT" && test -f "$CURRENT_DIRECT"
          printf 'CURRENT_COVERAGE=%s\nCURRENT_DIRECT=%s\n' "$CURRENT_COVERAGE" "$CURRENT_DIRECT" >> "$GITHUB_ENV"

      - name: Scan committed staging evidence for unresolved strict residuals
        run: |
          set -euo pipefail
          python scripts/audit_committed_reproductive_residuals.py \
            --staging-root data/v2/staging/traits \
            --coverage "$CURRENT_COVERAGE" \
            --direct-ledger "$CURRENT_DIRECT" \
            --ontology config/trait_ontology.yml \
            --output artifacts/committed-reproductive-residuals
          cat artifacts/committed-reproductive-residuals/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '### Strict-ready source files' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          p='artifacts/committed-reproductive-residuals/strict_ready_by_source.csv'
          x=pd.read_csv(p)
          print(x.head(30).to_markdown(index=False) if len(x) else 'none')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: committed-reproductive-residuals-${{ github.run_id }}
          path: artifacts/committed-reproductive-residuals/
          if-no-files-found: error
          retention-days: 90
