name: audit_connect_trait_cascade

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-connect-trait-cascade.yml"
      - "config/trait_cascade_artifact_lock.json"
      - "config/bombus_hypervolume_artifact_lock.json"
      - "config/trait_cascade_analysis_tiers.yml"
      - "config/m0_m4_sem.yml"
      - "src/island_v2/trait_cascade_analysis.py"
      - "src/island_v2/trait_bombus_analysis.py"
      - "src/island_v2/m0_m4_sem.py"
      - "src/island_v2/m0_m4_sem_scoped.py"
      - "src/island_v2/m0_global_baseline.py"
      - "src/island_v2/m1_m3_bombus_channel_input.py"
      - "src/island_v2/sem_readiness.py"
      - "tests/test_trait_cascade_analysis.py"
      - "tests/test_trait_bombus_analysis.py"
      - "tests/test_m0_m4_sem.py"
      - "tests/test_m0_m4_sem_scoped.py"
      - "tests/test_m1_m3_bombus_channel_input.py"
      - "pyproject.toml"

permissions:
  actions: read
  contents: read

jobs:
  audit-and-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test analysis contracts
        run: |
          pytest -q \
            tests/test_trait_cascade_analysis.py \
            tests/test_trait_bombus_analysis.py \
            tests/test_m0_m4_sem.py \
            tests/test_m0_m4_sem_scoped.py \
            tests/test_m1_m3_bombus_channel_input.py
          ruff check \
            src/island_v2/trait_cascade_analysis.py \
            src/island_v2/trait_bombus_analysis.py \
            src/island_v2/m0_m4_sem.py \
            src/island_v2/m0_m4_sem_scoped.py \
            src/island_v2/m0_global_baseline.py \
            src/island_v2/m1_m3_bombus_channel_input.py \
            src/island_v2/sem_readiness.py \
            tests/test_trait_cascade_analysis.py \
            tests/test_trait_bombus_analysis.py \
            tests/test_m0_m4_sem.py \
            tests/test_m0_m4_sem_scoped.py \
            tests/test_m1_m3_bombus_channel_input.py

      - name: Download locked PR 102 trait artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(jq -r '.artifact_id' config/trait_cascade_artifact_lock.json)
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/trait-cascade-artifact.zip
          mkdir -p /tmp/trait-cascade-download
          unzip -q /tmp/trait-cascade-artifact.zip -d /tmp/trait-cascade-download

      - name: Verify trait archive and internal shard checksums
        run: |
          set -euo pipefail
          cd /tmp/trait-cascade-download
          EXPECTED=$(jq -r '.archive_sha256' "$GITHUB_WORKSPACE/config/trait_cascade_artifact_lock.json")
          ACTUAL=$(sha256sum trait-fill-cascade-full.tgz | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          sha256sum -c trait-fill-cascade-full.tgz.sha256
          mkdir -p /tmp/trait-cascade-extracted
          tar -xzf trait-fill-cascade-full.tgz -C /tmp/trait-cascade-extracted
          cd /tmp/trait-cascade-extracted/fill_cascade
          sha256sum -c SHA256SUMS

      - name: Download locked PR 112 Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(jq -r '.artifact_id' config/bombus_hypervolume_artifact_lock.json)
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/bombus-hypervolume-artifact.zip
          EXPECTED=$(jq -r '.artifact_digest' config/bombus_hypervolume_artifact_lock.json | sed 's/^sha256://')
          ACTUAL=$(sha256sum /tmp/bombus-hypervolume-artifact.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/bombus-hypervolume-download
          unzip -q /tmp/bombus-hypervolume-artifact.zip -d /tmp/bombus-hypervolume-download
          BOMBUS_TABLE=$(find /tmp/bombus-hypervolume-download -name bombus_island_analysis_input.csv -print -quit)
          test -n "$BOMBUS_TABLE"
          cp "$BOMBUS_TABLE" /tmp/bombus_island_analysis_input.csv

      - name: Verify locked Bombus dimensions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          lock = json.loads(Path('config/bombus_hypervolume_artifact_lock.json').read_text())
          table = pd.read_csv('/tmp/bombus_island_analysis_input.csv')
          expected = lock['verified_summary']
          assert table['island_id'].nunique() == expected['n_islands'] == 8265
          assert table['n_bombus_species_total'].min() == expected['n_bombus_species_discovered'] == 169
          assert table['n_bombus_species_total'].max() == 169
          assert table['n_bombus_species_scored'].max() == expected['n_bombus_species_scored'] == 142
          assert not table['island_id'].duplicated().any()
          print(json.dumps({
            'bombus_lock_verified': True,
            'n_islands': int(table['island_id'].nunique()),
            'n_bombus_species_total': int(table['n_bombus_species_total'].max()),
          }, indent=2))
          PY

      - name: Audit completed trait matrix
        run: |
          island-v2-trait-cascade-analysis audit \
            --cascade-root /tmp/trait-cascade-extracted/fill_cascade \
            --output-dir data/v2/staging/traits/cascade_analysis

      - name: Join traits to exact island occurrence master
        run: |
          test -f data/v2/staging/gbif/collected/island_species_occurrences.csv.gz
          island-v2-trait-cascade-analysis join-islands \
            --cascade-root /tmp/trait-cascade-extracted/fill_cascade \
            --island-species-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --species-column species \
            --tiers-config config/trait_cascade_analysis_tiers.yml \
            --output-dir data/v2/staging/traits/cascade_analysis/island_join

      - name: Join Bombus metrics to every trait analysis tier
        run: |
          set -euo pipefail
          for TIER in primary broad sensitivity_all; do
            TRAITS="data/v2/staging/traits/cascade_analysis/island_join/island_species_traits_${TIER}.csv.gz"
            test -f "$TRAITS"
            island-v2-trait-bombus-analysis \
              --island-species-traits-csv "$TRAITS" \
              --bombus-island-csv /tmp/bombus_island_analysis_input.csv \
              --output-dir "data/v2/staging/traits/cascade_analysis/bombus_join/${TIER}"
          done

      - name: Verify locked dimensions and integrated master contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          trait_lock = json.loads(Path('config/trait_cascade_artifact_lock.json').read_text())
          audit = json.loads(Path('data/v2/staging/traits/cascade_analysis/trait_cascade_audit.json').read_text())
          assert audit['n_shards'] == trait_lock['n_shards'] == 128
          assert audit['n_species'] == trait_lock['n_angiosperm_eligible'] == 106295
          assert audit['n_traits'] == trait_lock['n_traits'] == 9
          assert audit['n_rows'] == trait_lock['n_rows'] == 956655
          assert audit['duplicate_species_trait_rows'] == 0
          assert audit['fill_tier_counts'] == trait_lock['fill_tier_counts']

          integrated = {}
          for tier in ('primary', 'broad', 'sensitivity_all'):
              root = Path(f'data/v2/staging/traits/cascade_analysis/bombus_join/{tier}')
              manifest = json.loads((root / 'island_bombus_trait_analysis_manifest.json').read_text())
              master = pd.read_csv(root / 'island_species_trait_bombus_master.csv.gz')
              assert len(master) == manifest['n_species_trait_master_rows']
              assert set(master['bombus_join_status'].dropna().astype(str)) <= {'both', 'left_only'}
              assert not master.duplicated(['island_id', 'accepted_species', 'trait_name', 'analysis_tier']).any()
              integrated[tier] = manifest
          print(json.dumps({'trait_lock_verified': True, 'integrated_tiers': integrated}, indent=2))
          PY

      - name: Upload audited integrated analysis inputs
        uses: actions/upload-artifact@v4
        with:
          name: audited-island-trait-bombus-master-${{ github.run_id }}
          path: |
            config/trait_cascade_artifact_lock.json
            config/bombus_hypervolume_artifact_lock.json
            config/m0_m4_sem.yml
            data/v2/staging/traits/cascade_analysis/
          if-no-files-found: error
          retention-days: 90
