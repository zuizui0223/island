name: fd original Direct species botanical-family map availability audit
on:
  push:
    branches:
      - analysis/fd-discrete-functional-volume-20261113
    paths:
      - 'scripts/audit_fd_original_species_family.py'
      - '.github/workflows/audit-fd-original-family-map.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-family-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STAGE: /tmp/fd-source-family
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - name: Restore frozen original private Direct species and GIFT source checkpoint
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/unpacked"
              unzip -q "$NESTED" -d "$STAGE/unpacked"
              LEDGER="$(find "$STAGE/unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER" && test -s "$LEDGER"
          ORIGINAL_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$LEDGER")")")")")"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Validate original species and family coverage without exposing raw taxon rows
        run: |
          set -euo pipefail
          python -m compileall -q scripts/audit_fd_original_species_family.py
          python scripts/audit_fd_original_species_family.py \
            --root "$ORIGINAL_ROOT" \
            --output "$STAGE/anonymous_original_taxonomy_family_feasibility.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['STAGE'])/'anonymous_original_taxonomy_family_feasibility.json'
          r=json.loads(path.read_text())
          assert r['n_original_Direct_complete_species']==2234
          assert r['genus_names_not_used_to_guess_family']
          assert r['source_family_names_and_taxon_map_never_exported']
          assert r['source_family_mapping_not_yet_used_to_fit_biological_effect']
          assert r['phylogenetic_tree_not_reconstructed']
          assert not any('"'+x+'"' in path.read_text() for x in (
            'accepted_species','genus','family','island_id','entity_ID'))
          print("Original taxonomic family-map availability and missingness audited")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fd-original-family-availability-${{ github.run_id }}
          path: /tmp/fd-source-family/anonymous_original_taxonomy_family_feasibility.json
          if-no-files-found: error
          retention-days: 90
