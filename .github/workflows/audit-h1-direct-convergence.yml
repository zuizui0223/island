name: Audit H1 direct northern-high convergence

on:
  push:
    branches:
      - paper/h1-convergence-audit-20260927
    paths:
      - "scripts/geography_correction/audit_h1_direct_convergence.py"
      - ".github/workflows/audit-h1-direct-convergence.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . pytest ruff
      - name: Validate audit code
        run: |
          ruff check scripts/geography_correction/audit_h1_direct_convergence.py
      - name: Download frozen v14 analysis artifact
        run: |
          rm -rf /tmp/v14
          mkdir -p /tmp/v14
          gh run download 35314955780 \
            --repo "$GITHUB_REPOSITORY" \
            --name "chapter1-v14-reordered-hypotheses-35314955780" \
            --dir /tmp/v14
          test -s /tmp/v14/direct/h1/all_data_probability_counts.csv.gz
      - name: Run convergence and six-response audit
        run: |
          python scripts/geography_correction/audit_h1_direct_convergence.py \
            --counts-csv /tmp/v14/direct/h1/all_data_probability_counts.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --config-path config/chapter1_v14_all_data_probability.yml \
            --frozen-slopes-csv results/geography_20260924/direct/beta_binomial_within_slopes.csv \
            --frozen-omnibus-csv results/geography_20260924/direct/beta_binomial_within_omnibus.csv \
            --output results/geography_20260924/h1_direct_northern_high_convergence_audit.json
      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/geography_20260924/h1_direct_northern_high_convergence_audit.json
          if git diff --cached --quiet; then
            echo "No result change"
            exit 0
          fi
          git commit -m "Record H1 direct convergence audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
