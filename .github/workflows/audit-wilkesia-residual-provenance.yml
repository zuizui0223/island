name: Audit Wilkesia reproductive residual provenance

on:
  push:
    branches: [codex/recover-verified-checkpoint]
    paths:
      - scripts/audit_wilkesia_residual_provenance.py
      - .github/workflows/audit-wilkesia-residual-provenance.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_SOURCE_BATCH_RUN: '34183943923'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - name: Download current cumulative public checkpoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          gh run download "$CURRENT_SOURCE_BATCH_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "source-scale-batch-integration-${CURRENT_SOURCE_BATCH_RUN}" \
            --dir /tmp/current
          CURRENT_COVERAGE=$(find /tmp/current -name species_axis_coverage.csv.gz -print -quit)
          CURRENT_DIRECT=$(find /tmp/current -name direct_species_trait_ledger.csv.gz -print -quit)
          test -n "$CURRENT_COVERAGE" && test -f "$CURRENT_COVERAGE"
          test -n "$CURRENT_DIRECT" && test -f "$CURRENT_DIRECT"
          printf 'CURRENT_COVERAGE=%s\nCURRENT_DIRECT=%s\n' "$CURRENT_COVERAGE" "$CURRENT_DIRECT" >> "$GITHUB_ENV"
      - name: Trace Wilkesia source and review rows
        run: |
          set -euo pipefail
          python scripts/audit_wilkesia_residual_provenance.py \
            --root data/v2/staging/traits/direct_llm_pilot/20260807_europe_pmc_reproduction_integrated \
            --coverage "$CURRENT_COVERAGE" \
            --direct-ledger "$CURRENT_DIRECT" \
            --output artifacts/wilkesia-residual-provenance \
            | tee artifacts/wilkesia-residual-provenance.log
          cat artifacts/wilkesia-residual-provenance/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wilkesia-residual-provenance-${{ github.run_id }}
          path: |
            artifacts/wilkesia-residual-provenance/
            artifacts/wilkesia-residual-provenance.log
          if-no-files-found: error
          retention-days: 90
