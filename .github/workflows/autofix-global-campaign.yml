name: autofix_global_campaign_lint

on:
  push:
    branches: [feat/global-trait-campaign]
    paths:
      - "src/island_v2/global_trait_campaign.py"
      - "tests/test_global_trait_campaign.py"
      - ".github/workflows/autofix-global-campaign.yml"

permissions:
  contents: write

concurrency:
  group: autofix-global-campaign-lint
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-trait-campaign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install "ruff>=0.6.0"
      - name: Apply Ruff fixes to new campaign files
        run: |
          ruff check --fix --unsafe-fixes \
            src/island_v2/global_trait_campaign.py \
            tests/test_global_trait_campaign.py || true
          ruff format \
            src/island_v2/global_trait_campaign.py \
            tests/test_global_trait_campaign.py
      - name: Commit fixes when needed
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/island_v2/global_trait_campaign.py tests/test_global_trait_campaign.py
          git diff --cached --quiet && { echo "No Ruff changes."; exit 0; }
          git commit -m "style: apply Ruff fixes to global campaign"
          git push origin HEAD:feat/global-trait-campaign
