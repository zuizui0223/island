name: benchmark_dynamic_trait_discovery

on:
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/trait_dynamic_discovery.py"
      - "tests/test_trait_dynamic_discovery.py"
      - ".github/workflows/benchmark-dynamic-trait-discovery.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Test dynamic discovery helpers
        continue-on-error: true
        run: pytest -q tests/test_trait_dynamic_discovery.py
      - name: Lint dynamic discovery helpers
        continue-on-error: true
        run: ruff check src/island_v2/trait_dynamic_discovery.py tests/test_trait_dynamic_discovery.py
      - name: Run fixed-site baseline
        run: |
          island-v2-v1-category-search search \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/fixed_baseline \
            --max-taxa 25
      - name: Run query-driven discovery with captured diagnostics
        id: dynamic
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/dynamic_discovery
          island-v2-trait-dynamic-discovery discover \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/dynamic_discovery \
            --max-taxa 25 \
            --max-synonyms 5 \
            --max-results-per-query 6 \
            --max-pages-per-species 12 \
            > /tmp/dynamic_discovery/command_stdout.log \
            2> /tmp/dynamic_discovery/command_stderr.log
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Compare source coverage when dynamic output exists
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          fixed = pd.read_csv('/tmp/fixed_baseline/source_texts.csv', dtype=str).fillna('')
          dynamic_path = Path('/tmp/dynamic_discovery/source_texts.csv')
          search_path = Path('/tmp/dynamic_discovery/search_results.csv')
          dynamic = pd.read_csv(dynamic_path, dtype=str).fillna('') if dynamic_path.exists() else pd.DataFrame()
          search = pd.read_csv(search_path, dtype=str).fillna('') if search_path.exists() else pd.DataFrame()
          fixed_species = set(fixed['accepted_species'])
          dynamic_species = set(dynamic['accepted_species']) if 'accepted_species' in dynamic else set()
          comparison = {
              'dynamic_command_exit_code': '${{ steps.dynamic.outputs.exit_code }}',
              'fixed_source_rows': len(fixed),
              'dynamic_source_rows': len(dynamic),
              'fixed_species_with_source_text': len(fixed_species),
              'dynamic_species_with_source_text': len(dynamic_species),
              'dynamic_incremental_species': sorted(dynamic_species - fixed_species),
              'dynamic_search_result_species': int(search['accepted_species'].nunique()) if len(search) and 'accepted_species' in search else 0,
              'dynamic_source_type_counts': dynamic['source_type'].value_counts().to_dict() if len(dynamic) and 'source_type' in dynamic else {},
          }
          Path('/tmp/dynamic_discovery/source_coverage_comparison.json').write_text(json.dumps(comparison, indent=2), encoding='utf-8')
          print(json.dumps(comparison, indent=2))
          PY
      - name: Build dynamic LLM evidence packets
        if: hashFiles('/tmp/dynamic_discovery/source_texts.csv') != ''
        run: |
          island-v2-llm-evidence prepare \
            --source-csv /tmp/dynamic_discovery/source_texts.csv \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --candidate-csv /tmp/fixed_baseline/v2_reported_candidates.csv \
            --output-dir /tmp/dynamic_llm_packets \
            --batch-size 10
      - name: Upload benchmark corpus and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-trait-discovery-benchmark-${{ github.run_id }}
          path: |
            /tmp/fixed_baseline/
            /tmp/dynamic_discovery/
            /tmp/dynamic_llm_packets/
          if-no-files-found: error
          retention-days: 90
