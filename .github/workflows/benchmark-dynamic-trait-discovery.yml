name: benchmark_dynamic_trait_discovery

on:
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/trait_dynamic_discovery.py"
      - "src/island_v2/trait_dynamic_discovery_fast.py"
      - "tests/test_trait_dynamic_discovery.py"
      - ".github/workflows/benchmark-dynamic-trait-discovery.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Test dynamic discovery helpers
        run: pytest -q tests/test_trait_dynamic_discovery.py
      - name: Lint dynamic discovery modules
        continue-on-error: true
        run: ruff check src/island_v2/trait_dynamic_discovery.py src/island_v2/trait_dynamic_discovery_fast.py tests/test_trait_dynamic_discovery.py
      - name: Run fixed-site baseline
        run: |
          island-v2-v1-category-search search \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/fixed_baseline \
            --max-taxa 25
      - name: Run parallel query-driven discovery
        id: dynamic
        run: |
          start=$(date +%s)
          island-v2-trait-dynamic-discovery-fast \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/dynamic_discovery \
            --max-taxa 25 \
            --max-synonyms 1 \
            --max-results-per-query 4 \
            --max-pages-per-species 8 \
            --workers 8
          end=$(date +%s)
          echo "elapsed_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
      - name: Compare source coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          fixed = pd.read_csv('/tmp/fixed_baseline/source_texts.csv', dtype=str).fillna('')
          dynamic = pd.read_csv('/tmp/dynamic_discovery/source_texts.csv', dtype=str).fillna('')
          search = pd.read_csv('/tmp/dynamic_discovery/search_results.csv', dtype=str).fillna('')
          fixed_species = set(fixed['accepted_species'])
          dynamic_species = set(dynamic['accepted_species'])
          comparison = {
              'dynamic_elapsed_seconds': int('${{ steps.dynamic.outputs.elapsed_seconds }}'),
              'fixed_source_rows': len(fixed),
              'dynamic_source_rows': len(dynamic),
              'fixed_species_with_source_text': len(fixed_species),
              'dynamic_species_with_source_text': len(dynamic_species),
              'dynamic_incremental_species': sorted(dynamic_species - fixed_species),
              'dynamic_search_result_species': int(search['accepted_species'].nunique()) if len(search) else 0,
              'dynamic_source_type_counts': dynamic['source_type'].value_counts().to_dict() if len(dynamic) else {},
          }
          Path('/tmp/dynamic_discovery/source_coverage_comparison.json').write_text(json.dumps(comparison, indent=2), encoding='utf-8')
          print(json.dumps(comparison, indent=2))
          PY
      - name: Build dynamic LLM evidence packets when sources exist
        run: |
          if [[ -s /tmp/dynamic_discovery/source_texts.csv ]] && [[ $(wc -l < /tmp/dynamic_discovery/source_texts.csv) -gt 1 ]]; then
            island-v2-llm-evidence prepare \
              --source-csv /tmp/dynamic_discovery/source_texts.csv \
              --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
              --candidate-csv /tmp/fixed_baseline/v2_reported_candidates.csv \
              --output-dir /tmp/dynamic_llm_packets \
              --batch-size 10
          else
            mkdir -p /tmp/dynamic_llm_packets
            printf '{"n_packets":0,"reason":"no_dynamic_sources"}\n' > /tmp/dynamic_llm_packets/llm_packet_manifest.json
          fi
      - name: Upload benchmark corpus
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-trait-discovery-benchmark-${{ github.run_id }}
          path: |
            /tmp/fixed_baseline/
            /tmp/dynamic_discovery/
            /tmp/dynamic_llm_packets/
          if-no-files-found: error
          retention-days: 90
