name: benchmark_literature_trait_recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/literature_trait_recovery.py"
      - "src/island_v2/trait_source_discovery.py"
      - ".github/workflows/benchmark-literature-trait-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate module syntax
        run: python -m py_compile src/island_v2/literature_trait_recovery.py
      - name: Run OpenAlex trait recovery
        run: |
          python -m island_v2.literature_trait_recovery \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/literature_trait_recovery \
            --max-taxa 25 \
            --per-page 8 \
            --workers 12
          cat /tmp/literature_trait_recovery/literature_trait_recovery_report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: literature-trait-recovery-${{ github.run_id }}
          path: /tmp/literature_trait_recovery/
          if-no-files-found: error
          retention-days: 90
