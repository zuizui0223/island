name: benchmark_search_enabled_llm_global_campaign

on:
  pull_request:
    branches: [main, codex/literature-recovery-pilot]
    paths:
      - "src/island_v2/search_enabled_llm_campaign.py"
      - "tests/test_search_enabled_llm_campaign.py"
      - ".github/workflows/benchmark-search-enabled-llm-global-campaign.yml"
  workflow_dispatch:
    inputs:
      shard_index:
        description: "Deterministic shard index"
        required: true
        default: "0"
        type: string
      shard_count:
        description: "Total shard count"
        required: true
        default: "128"
        type: string
      batch_size:
        description: "Jobs to prepare from this shard"
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run campaign tests
        run: pytest -q tests/test_search_enabled_llm_campaign.py
      - name: Validate campaign syntax
        run: python -m py_compile src/island_v2/search_enabled_llm_campaign.py
      - name: Lint campaign implementation
        run: ruff check src/island_v2/search_enabled_llm_campaign.py tests/test_search_enabled_llm_campaign.py
      - name: Build 100-job production dry run from the real 105k species master
        run: |
          python -m island_v2.search_enabled_llm_campaign prepare \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --campaign-dir /tmp/search_enabled_llm_campaign_100 \
            --shard-index 0 \
            --shard-count 128 \
            --batch-size 100
          cat /tmp/search_enabled_llm_campaign_100/campaign_status.json >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/search_enabled_llm_campaign_100/jobs_shard_0000.jsonl')
          jobs = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          assert len(jobs) == 100, len(jobs)
          assert len({job['job_id'] for job in jobs}) == 100
          assert all(job['prompt_sha256'] for job in jobs)
          print(f"validated {len(jobs)} unique production jobs")
          PY
      - name: Build 1,000-job scale dry run from the real master
        run: |
          python -m island_v2.search_enabled_llm_campaign prepare \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --campaign-dir /tmp/search_enabled_llm_campaign_1000 \
            --shard-index 0 \
            --shard-count 64 \
            --batch-size 1000
          cat /tmp/search_enabled_llm_campaign_1000/campaign_status.json >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/search_enabled_llm_campaign_1000/jobs_shard_0000.jsonl')
          jobs = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          assert len(jobs) == 1000, len(jobs)
          assert len({job['job_id'] for job in jobs}) == 1000
          assert len({job['species'] for job in jobs}) == 1000
          print(f"validated {len(jobs)} unique scale-test jobs")
          PY
      - name: Upload production dry-run manifests
        uses: actions/upload-artifact@v4
        with:
          name: search-enabled-llm-global-campaign-${{ github.run_id }}
          path: |
            /tmp/search_enabled_llm_campaign_100/
            /tmp/search_enabled_llm_campaign_1000/
          if-no-files-found: error
          retention-days: 90

  prepare-production-shard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SHARD_INDEX: ${{ inputs.shard_index }}
      SHARD_COUNT: ${{ inputs.shard_count }}
      BATCH_SIZE: ${{ inputs.batch_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate production inputs
        run: |
          python - <<'PY'
          import os

          shard_index = int(os.environ['SHARD_INDEX'])
          shard_count = int(os.environ['SHARD_COUNT'])
          batch_size = int(os.environ['BATCH_SIZE'])
          if not 1 <= shard_count <= 4096:
              raise SystemExit('shard_count must be between 1 and 4096')
          if not 0 <= shard_index < shard_count:
              raise SystemExit('shard_index must be within shard_count')
          if not 1 <= batch_size <= 10000:
              raise SystemExit('batch_size must be between 1 and 10000')
          PY
      - name: Prepare selected production shard
        run: |
          python -m island_v2.search_enabled_llm_campaign prepare \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --campaign-dir /tmp/search_enabled_llm_production \
            --shard-index "$SHARD_INDEX" \
            --shard-count "$SHARD_COUNT" \
            --batch-size "$BATCH_SIZE"
          cat /tmp/search_enabled_llm_production/campaign_status.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload selected production shard manifest
        uses: actions/upload-artifact@v4
        with:
          name: search-enabled-llm-production-shard-${{ inputs.shard_index }}-${{ github.run_id }}
          path: /tmp/search_enabled_llm_production/
          if-no-files-found: error
          retention-days: 90
