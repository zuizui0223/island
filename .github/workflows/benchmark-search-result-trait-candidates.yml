name: benchmark_search_result_trait_candidates

on:
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/search_result_trait_candidates.py"
      - "src/island_v2/family_trait_priors.py"
      - "src/island_v2/trait_dynamic_discovery.py"
      - "src/island_v2/trait_dynamic_discovery_fast.py"
      - "src/island_v2/trait_relevant_search.py"
      - "tests/test_search_result_trait_candidates.py"
      - "tests/test_family_trait_priors.py"
      - ".github/workflows/benchmark-search-result-trait-candidates.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate search-result extraction and likely priors
        run: |
          pytest -q tests/test_search_result_trait_candidates.py tests/test_family_trait_priors.py
          ruff check \
            src/island_v2/search_result_trait_candidates.py \
            src/island_v2/family_trait_priors.py \
            tests/test_search_result_trait_candidates.py \
            tests/test_family_trait_priors.py
          island-v2-search-result-trait-candidates --help >/dev/null
      - name: Run fixed-site baseline
        run: |
          island-v2-v1-category-search search \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/fixed_baseline \
            --max-taxa 25
      - name: Search broadly without source whitelist
        run: |
          island-v2-trait-dynamic-discovery-fast \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/broad_search \
            --max-taxa 25 \
            --max-synonyms 3 \
            --max-results-per-query 8 \
            --max-pages-per-species 4 \
            --workers 8
      - name: Run exact-name relevant snippet search
        run: |
          python -m island_v2.trait_relevant_search \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/relevant_search \
            --max-taxa 25 \
            --max-synonyms 1 \
            --max-results-per-query 8 \
            --max-sources-per-species 8 \
            --workers 8
      - name: Union broad and exact-name search-result evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          broad = pd.read_csv('/tmp/broad_search/search_results.csv', dtype=str).fillna('')
          relevant = pd.read_csv('/tmp/relevant_search/relevant_search_results.csv', dtype=str).fillna('')
          relevant = relevant.rename(columns={
              'search_result_title': 'result_title',
              'search_result_snippet': 'result_snippet',
              'source_url': 'result_url',
          })
          wanted = [
              'accepted_species', 'searched_name', 'query_family', 'search_query',
              'search_engine', 'search_rank', 'result_title', 'result_url', 'result_snippet',
          ]
          for frame in (broad, relevant):
              for column in wanted:
                  if column not in frame.columns:
                      frame[column] = ''
          combined = pd.concat([broad[wanted], relevant[wanted]], ignore_index=True)
          combined = combined.drop_duplicates(
              ['accepted_species', 'searched_name', 'result_url', 'result_title', 'result_snippet']
          )
          out = Path('/tmp/combined_search')
          out.mkdir(parents=True, exist_ok=True)
          combined.to_csv(out / 'search_results.csv', index=False)
          print({
              'broad_rows': len(broad),
              'relevant_rows': len(relevant),
              'combined_rows': len(combined),
              'combined_species': int(combined['accepted_species'].nunique()) if len(combined) else 0,
          })
          PY
      - name: Extract reported and likely candidates from frozen search results
        run: |
          island-v2-search-result-trait-candidates \
            --search-results-csv /tmp/combined_search/search_results.csv \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/search_result_candidates
          cat /tmp/search_result_candidates/search_result_trait_candidates_report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Add low-confidence family floral priors for remaining reported gaps
        run: |
          python -m island_v2.family_trait_priors \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --existing-candidates-csv /tmp/search_result_candidates/search_result_trait_candidates.csv \
            --output-dir /tmp/family_trait_priors
          cat /tmp/family_trait_priors/family_trait_likely_report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Compare reported-only and reported-plus-likely coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          species = pd.read_csv(
              'data/v2/staging/traits/validation_pilot/validation_pilot_species.csv',
              dtype=str,
          ).fillna('').head(25)
          denominator = set(species['accepted_species'])
          baseline = pd.read_csv('/tmp/fixed_baseline/v2_reported_candidates.csv', dtype=str).fillna('')
          search = pd.read_csv(
              '/tmp/search_result_candidates/search_result_trait_candidates.csv',
              dtype=str,
          ).fillna('')
          family = pd.read_csv(
              '/tmp/family_trait_priors/family_trait_likely_candidates.csv',
              dtype=str,
          ).fillna('')

          def pairs(frame, value_col='provisional_candidate_value'):
              if frame.empty:
                  return set()
              return {
                  (r.accepted_species, r.trait_name)
                  for r in frame.itertuples(index=False)
                  if r.accepted_species in denominator
                  and str(getattr(r, value_col, '')).strip()
                  and str(getattr(r, value_col, '')).strip() != 'unresolved'
              }

          b = pairs(baseline)
          reported = search[search['candidate_class'].eq('reported')]
          likely_search = search[search['inference_status'].eq('likely')]
          r = pairs(reported)
          ls = pairs(likely_search)
          lf = pairs(family)
          br = b | r
          brls = br | ls
          brlf = brls | lf

          def species_count(ps):
              return len({sp for sp, _ in ps})

          traits = sorted({trait for _, trait in brlf})
          by_trait = {}
          for trait in traits:
              def n(ps):
                  return len({sp for sp, tr in ps if tr == trait})
              by_trait[trait] = {
                  'baseline': n(b),
                  'baseline_plus_search_reported': n(br),
                  'plus_search_likely': n(brls),
                  'plus_family_trait_likely': n(brlf),
              }

          report = {
              'n_species_denominator': len(denominator),
              'baseline_species_any_trait': species_count(b),
              'search_reported_species': species_count(r),
              'search_likely_species': species_count(ls),
              'family_trait_likely_species': species_count(lf),
              'baseline_plus_search_reported_species_any_trait': species_count(br),
              'plus_search_likely_species_any_trait': species_count(brls),
              'plus_family_trait_likely_species_any_trait': species_count(brlf),
              'increment_reported_over_baseline_species': species_count(br) - species_count(b),
              'increment_search_likely_over_reported_species': species_count(brls) - species_count(br),
              'increment_family_likely_over_previous_species': species_count(brlf) - species_count(brls),
              'coverage_by_trait': by_trait,
              'policy': (
                  'reported, search-derived likely, and family-prior likely are benchmarked separately. '
                  'No likely/proxy row is silently promoted into the reported-only analysis.'
              ),
          }
          out = Path('/tmp/search_result_candidates')
          (out / 'coverage_comparison.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload benchmark corpus and candidates
        uses: actions/upload-artifact@v4
        with:
          name: search-result-trait-candidates-${{ github.run_id }}
          path: |
            /tmp/fixed_baseline/
            /tmp/broad_search/
            /tmp/relevant_search/
            /tmp/combined_search/
            /tmp/search_result_candidates/
            /tmp/family_trait_priors/
          if-no-files-found: error
          retention-days: 90
