name: benchmark_targeted_reproductive_recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/targeted_trait_recovery.py"
      - "src/island_v2/targeted_reproductive_recovery.py"
      - ".github/workflows/benchmark-targeted-reproductive-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate modules
        run: |
          python -m py_compile src/island_v2/targeted_trait_recovery.py src/island_v2/targeted_reproductive_recovery.py
          ruff check src/island_v2/targeted_trait_recovery.py src/island_v2/targeted_reproductive_recovery.py
      - name: Run reproductive recovery
        run: |
          python -m island_v2.targeted_reproductive_recovery \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/targeted_reproductive \
            --max-taxa 25 \
            --max-results-per-query 8 \
            --workers 16
          cat /tmp/targeted_reproductive/targeted_reproductive_recovery_report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: targeted-reproductive-recovery-${{ github.run_id }}
          path: /tmp/targeted_reproductive/
          if-no-files-found: error
          retention-days: 90
