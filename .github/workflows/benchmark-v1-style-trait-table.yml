name: benchmark_v1_style_trait_table

on:
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/v1_style_trait_table.py"
      - "src/island_v2/search_result_trait_candidates.py"
      - "src/island_v2/trait_dynamic_discovery_fast.py"
      - "src/island_v2/trait_relevant_search.py"
      - "tests/test_v1_style_trait_table.py"
      - ".github/workflows/benchmark-v1-style-trait-table.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate compact table builder
        run: |
          pytest -q tests/test_v1_style_trait_table.py
          ruff check src/island_v2/v1_style_trait_table.py tests/test_v1_style_trait_table.py
      - name: Broad source-agnostic search
        run: |
          island-v2-trait-dynamic-discovery-fast \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/broad_search \
            --max-taxa 25 \
            --max-synonyms 3 \
            --max-results-per-query 8 \
            --max-pages-per-species 4 \
            --workers 8
      - name: Exact-name relevant snippet search
        run: |
          python -m island_v2.trait_relevant_search \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/relevant_search \
            --max-taxa 25 \
            --max-synonyms 1 \
            --max-results-per-query 8 \
            --max-sources-per-species 8 \
            --workers 8
      - name: Union frozen search-result evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          broad = pd.read_csv('/tmp/broad_search/search_results.csv', dtype=str).fillna('')
          relevant = pd.read_csv('/tmp/relevant_search/relevant_search_results.csv', dtype=str).fillna('')
          relevant = relevant.rename(columns={
              'search_result_title': 'result_title',
              'search_result_snippet': 'result_snippet',
              'source_url': 'result_url',
          })
          wanted = [
              'accepted_species', 'searched_name', 'query_family', 'search_query',
              'search_engine', 'search_rank', 'result_title', 'result_url', 'result_snippet',
          ]
          for frame in (broad, relevant):
              for column in wanted:
                  if column not in frame.columns:
                      frame[column] = ''
          combined = pd.concat([broad[wanted], relevant[wanted]], ignore_index=True)
          combined = combined.drop_duplicates(
              ['accepted_species', 'searched_name', 'result_url', 'result_title', 'result_snippet']
          )
          out = Path('/tmp/combined_search')
          out.mkdir(parents=True, exist_ok=True)
          combined.to_csv(out / 'search_results.csv', index=False)
          PY
      - name: Extract reported and search-level likely candidates
        run: |
          island-v2-search-result-trait-candidates \
            --search-results-csv /tmp/combined_search/search_results.csv \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/search_candidates
      - name: Add pilot family-level likely floral candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          species = pd.read_csv(
              'data/v2/staging/traits/validation_pilot/validation_pilot_species.csv',
              dtype=str,
          ).fillna('').head(25)
          search = pd.read_csv(
              '/tmp/search_candidates/search_result_trait_candidates.csv',
              dtype=str,
          ).fillna('')

          priors = {
              'Asteraceae': [('floral_form', 'composite_head')],
              'Poaceae': [('floral_form', 'reduced_wind')],
              'Cyperaceae': [('floral_form', 'reduced_wind')],
              'Orchidaceae': [('floral_symmetry', 'zygomorphic')],
              'Lamiaceae': [('floral_symmetry', 'zygomorphic'), ('floral_form', 'tubular')],
              'Acanthaceae': [('floral_symmetry', 'zygomorphic'), ('floral_form', 'tubular')],
              'Gesneriaceae': [('floral_symmetry', 'zygomorphic'), ('floral_form', 'tubular')],
              'Campanulaceae': [('floral_form', 'bell_campanulate')],
              'Brassicaceae': [('floral_symmetry', 'actinomorphic'), ('floral_form', 'open_radial')],
              'Rosaceae': [('floral_symmetry', 'actinomorphic')],
              'Apocynaceae': [('floral_symmetry', 'actinomorphic'), ('floral_form', 'tubular')],
              'Rubiaceae': [('floral_symmetry', 'actinomorphic'), ('floral_form', 'tubular')],
              'Melastomataceae': [('floral_symmetry', 'actinomorphic')],
              'Lauraceae': [('floral_symmetry', 'actinomorphic')],
              'Primulaceae': [('floral_symmetry', 'actinomorphic')],
              'Annonaceae': [('floral_symmetry', 'actinomorphic')],
              'Araceae': [('floral_form', 'other_described')],
              'Arecaceae': [('floral_symmetry', 'actinomorphic')],
              'Phyllanthaceae': [('floral_symmetry', 'actinomorphic')],
              'Ranunculaceae': [('floral_symmetry', 'zygomorphic')],
          }

          reported_pairs = {
              (row.accepted_species, row.trait_name)
              for row in search.itertuples(index=False)
              if getattr(row, 'candidate_class', '') == 'reported'
          }
          rows = []
          for rec in species.to_dict('records'):
              sp = rec['accepted_species']
              family = rec.get('family', '')
              for trait, value in priors.get(family, []):
                  if (sp, trait) in reported_pairs:
                      continue
                  rows.append({
                      'accepted_species': sp,
                      'trait_name': trait,
                      'provisional_candidate_value': value,
                      'candidate_class': 'proxy',
                      'inference_status': 'likely',
                      'confidence': 'low',
                      'evidence_quote': f'family={family}',
                      'inference_rule': f'likely_family_typical_{trait}',
                      'searched_name': sp,
                      'search_query': '',
                      'search_engine': '',
                      'search_rank': '',
                      'source_url': '',
                      'source_title': '',
                      'source_type': 'declared_family_trait_prior',
                      'evidence_scope': 'proxy_not_reported',
                      'review_status': 'unreviewed_proxy',
                  })
          family = pd.DataFrame(rows)
          combined = pd.concat([search, family], ignore_index=True, sort=False).fillna('')
          out = Path('/tmp/all_candidates')
          out.mkdir(parents=True, exist_ok=True)
          family.to_csv(out / 'family_trait_likely_candidates.csv', index=False)
          combined.to_csv(out / 'all_candidates.csv', index=False)
          print({'family_likely_rows': len(family), 'family_likely_species': family['accepted_species'].nunique() if len(family) else 0})
          PY
      - name: Build requested nine-column table
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          from island_v2.v1_style_trait_table import build_v1_style_table

          species = pd.read_csv(
              'data/v2/staging/traits/validation_pilot/validation_pilot_species.csv',
              dtype=str,
          ).fillna('').head(25)
          candidates = pd.read_csv('/tmp/all_candidates/all_candidates.csv', dtype=str).fillna('')
          search = pd.read_csv('/tmp/combined_search/search_results.csv', dtype=str).fillna('')
          frame, report = build_v1_style_table(species, candidates, search)

          out = Path('/tmp/v1_style_table')
          out.mkdir(parents=True, exist_ok=True)
          frame.to_csv(out / 'v1_style_trait_table.csv', index=False)
          (out / 'v1_style_trait_table_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          cat /tmp/v1_style_table/v1_style_trait_table_report.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '### Preview' >> "$GITHUB_STEP_SUMMARY"
          head -n 11 /tmp/v1_style_table/v1_style_trait_table.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: v1-style-trait-table-${{ github.run_id }}
          path: |
            /tmp/broad_search/
            /tmp/relevant_search/
            /tmp/combined_search/
            /tmp/search_candidates/
            /tmp/all_candidates/
            /tmp/v1_style_table/
          if-no-files-found: error
          retention-days: 90
