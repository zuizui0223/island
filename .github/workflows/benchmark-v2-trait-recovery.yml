name: benchmark_v2_trait_recovery

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-v2-trait-recovery.yml"
      - "src/island_v2/trait_recovery_benchmark.py"
      - "src/island_v2/trait_media_scout.py"
      - "src/island_v2/trait_visual_packet.py"
      - "src/island_v2/taxon_name_expansion.py"
      - "tests/test_trait_recovery_benchmark.py"
      - "tests/test_trait_media_scout.py"
      - "tests/test_trait_visual_packet.py"
      - "tests/test_taxon_name_expansion.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate recovery experiments
        run: |
          pytest -q \
            tests/test_trait_recovery_benchmark.py \
            tests/test_trait_media_scout.py \
            tests/test_trait_visual_packet.py \
            tests/test_taxon_name_expansion.py
          ruff check \
            src/island_v2/trait_recovery_benchmark.py \
            src/island_v2/trait_media_scout.py \
            src/island_v2/trait_visual_packet.py \
            src/island_v2/taxon_name_expansion.py \
            tests/test_trait_recovery_benchmark.py \
            tests/test_trait_media_scout.py \
            tests/test_trait_visual_packet.py \
            tests/test_taxon_name_expansion.py
          island-v2-trait-recovery-benchmark --help >/dev/null
          island-v2-trait-media-scout --help >/dev/null
          island-v2-trait-visual-packet --help >/dev/null
          island-v2-taxon-name-expansion --help >/dev/null
      - name: Collect real GBIF visual evidence for validation pilot
        id: media
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/trait_media_pilot
          island-v2-trait-media-scout \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/trait_media_pilot \
            --max-taxa 25 \
            --max-occurrences 100 \
            --max-images-per-species 5 \
            > /tmp/trait_media_pilot/stdout.log \
            2> /tmp/trait_media_pilot/stderr.log
          status=$?
          echo "$status" > /tmp/trait_media_pilot/exit_code.txt
          if [ -f /tmp/trait_media_pilot/gbif_trait_media_report.json ]; then
            cat /tmp/trait_media_pilot/gbif_trait_media_report.json >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Freeze images and build visual contact sheets
        id: visual_packet
        if: steps.media.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/trait_visual_packet
          island-v2-trait-visual-packet build \
            --media-csv /tmp/trait_media_pilot/gbif_trait_media_manifest.csv \
            --output-dir /tmp/trait_visual_packet \
            --images-per-species 5 \
            --species-per-sheet 5 \
            > /tmp/trait_visual_packet/stdout.log \
            2> /tmp/trait_visual_packet/stderr.log
          status=$?
          echo "$status" > /tmp/trait_visual_packet/exit_code.txt
          if [ -f /tmp/trait_visual_packet/visual_packet_manifest.json ]; then
            cat /tmp/trait_visual_packet/visual_packet_manifest.json >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Expand accepted names to synonym search names
        id: synonyms
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/taxon_name_pilot
          island-v2-taxon-name-expansion \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/taxon_name_pilot \
            --max-taxa 25 \
            --max-synonyms-per-species 50 \
            > /tmp/taxon_name_pilot/stdout.log \
            2> /tmp/taxon_name_pilot/stderr.log
          status=$?
          echo "$status" > /tmp/taxon_name_pilot/exit_code.txt
          if [ -f /tmp/taxon_name_pilot/taxon_name_expansion_report.json ]; then
            cat /tmp/taxon_name_pilot/taxon_name_expansion_report.json >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Upload acquisition experiment manifests and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-trait-recovery-pilot-${{ github.run_id }}
          path: |
            /tmp/trait_media_pilot/
            /tmp/trait_visual_packet/
            /tmp/taxon_name_pilot/
          if-no-files-found: warn
          retention-days: 90
