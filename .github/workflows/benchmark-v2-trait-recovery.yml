name: benchmark_v2_trait_recovery

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-v2-trait-recovery.yml"
      - "src/island_v2/trait_recovery_benchmark.py"
      - "src/island_v2/trait_media_scout.py"
      - "tests/test_trait_recovery_benchmark.py"
      - "tests/test_trait_media_scout.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-media-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate benchmark and media scout
        run: |
          pytest -q tests/test_trait_recovery_benchmark.py tests/test_trait_media_scout.py
          ruff check \
            src/island_v2/trait_recovery_benchmark.py \
            src/island_v2/trait_media_scout.py \
            tests/test_trait_recovery_benchmark.py \
            tests/test_trait_media_scout.py
          island-v2-trait-recovery-benchmark --help >/dev/null
          island-v2-trait-media-scout --help >/dev/null
      - name: Collect real GBIF visual evidence for validation pilot
        run: |
          island-v2-trait-media-scout collect \
            --species-csv data/v2/staging/traits/validation_pilot/validation_pilot_species.csv \
            --output-dir /tmp/trait_media_pilot \
            --max-taxa 25 \
            --max-occurrences 100 \
            --max-images-per-species 5
          cat /tmp/trait_media_pilot/gbif_trait_media_report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload media manifest
        uses: actions/upload-artifact@v4
        with:
          name: v2-trait-media-pilot-${{ github.run_id }}
          path: /tmp/trait_media_pilot/
          if-no-files-found: error
          retention-days: 90
