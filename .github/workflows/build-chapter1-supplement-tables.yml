name: Build Chapter 1 supplement tables

on:
  push:
    branches:
      - paper/supplement-tables-20260927
    paths:
      - "scripts/submission/build_chapter1_supplement_tables.py"
      - ".github/workflows/build-chapter1-supplement-tables.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pandas ruff
      - name: Normalize and validate builder
        run: |
          ruff check --fix scripts/submission/build_chapter1_supplement_tables.py
          ruff check scripts/submission/build_chapter1_supplement_tables.py
      - name: Build supplement tables
        run: python scripts/submission/build_chapter1_supplement_tables.py
      - name: Commit generated supplement tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/submission/build_chapter1_supplement_tables.py submission/chapter1_current/supplement/
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build Chapter 1 supplement tables"
          git push origin "HEAD:${GITHUB_REF_NAME}"
