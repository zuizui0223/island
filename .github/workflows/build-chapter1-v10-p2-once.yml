name: Build Chapter 1 v10 P2 manuscript once

on:
  push:
    branches: ["ch1/p2-component-nonconcordance"]
    paths:
      - "scripts/build_chapter1_v10_p2.py"
      - ".github/workflows/build-chapter1-v10-p2-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ch1/p2-component-nonconcordance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate v10 from canonical v9
        run: python scripts/build_chapter1_v10_p2.py
      - name: Validate P2 wording boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/chapter1_manuscript_full_v10_island_first_p1_p2_defended_20260915.md')
          t=p.read_text()
          assert 'Full working manuscript v10' in t
          assert 'p=0.000947' in t
          assert 'p=0.00517' in t
          assert 'Palearctic–Neotropical direct vector tests are unsupported' in t
          assert 'stronger geometric claim did not pass' in t
          assert '## Claim ceiling for v10' in t
          assert 'Palearctic and tropical are not the two labels of one formal direct context contrast' in t
          PY
      - name: Commit generated manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chapter1_manuscript_full_v10_island_first_p1_p2_defended_20260915.md
          if git diff --cached --quiet; then
            echo "No manuscript diff"
          else
            git commit -m "Generate P2-defended Chapter 1 v10 manuscript"
            git push origin HEAD:ch1/p2-component-nonconcordance
          fi
