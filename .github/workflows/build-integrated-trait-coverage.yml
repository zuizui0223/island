name: Build integrated three-axis trait coverage

on:
  pull_request:
    paths:
      - ".github/workflows/build-integrated-trait-coverage.yml"
      - "config/integrated_trait_coverage_sources.json"
      - "config/trait_ontology.yml"
      - "src/island_v2/integrated_trait_coverage.py"
      - "src/island_v2/all_evidence_trait_audit.py"
      - "src/island_v2/pladias_traits.py"
      - "config/pladias_traits.yml"
      - "src/island_v2/open_web_common.py"
      - "src/island_v2/open_web_finalize.py"
      - "src/island_v2/validated_low_inference.py"
      - "tests/test_integrated_trait_coverage.py"
      - "tests/test_all_evidence_trait_audit.py"
      - "tests/test_pladias_traits.py"
      - "tests/test_validated_low_inference.py"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      baseline_integrated_run_id:
        description: Formal integrated-coverage run used for the immutable before/after comparison
        required: true
        default: "32932103226"
      baseline_integrated_artifact:
        description: Exact baseline integrated-coverage artifact name
        required: true
        default: "integrated-trait-coverage-32932103226"
      baseline_integrated_digest:
        description: Exact SHA-256 digest reported by GitHub for the baseline artifact
        required: true
        default: "sha256:d6405d520414b802fe75b2e450f45b8e74295f95049f20fb7ce61f57471326d1"
      latest_public_web_run_id:
        description: Successful reviewed public-Web evidence run
        required: true
        default: "30141880859"
      latest_public_web_artifact:
        description: Exact reviewed public-Web artifact name
        required: true
        default: "broad-web-medium-full-30141880859"
      all_master_run_id:
        description: Successful all-master ledger run containing every structured source package
        required: true
        default: "30081415812"
      all_master_artifact:
        description: Exact all-master artifact name
        required: true
        default: "all-master-trait-ledger-30081415812"

permissions:
  actions: read
  contents: read

concurrency:
  group: integrated-trait-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: |
          ruff check \
            src/island_v2/all_evidence_trait_audit.py \
            src/island_v2/integrated_trait_coverage.py \
            src/island_v2/pladias_traits.py \
            src/island_v2/validated_low_inference.py \
            tests/test_all_evidence_trait_audit.py \
            tests/test_integrated_trait_coverage.py \
            tests/test_pladias_traits.py \
            tests/test_validated_low_inference.py
          pytest -q \
            tests/test_all_evidence_trait_audit.py \
            tests/test_integrated_trait_coverage.py \
            tests/test_validated_low_inference.py

  aggregate:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INPUT_ROOT: /tmp/integrated-trait-inputs
      OUTPUT_ROOT: /tmp/integrated-trait-coverage
      BASELINE_INTEGRATED_RUN_ID: ${{ inputs.baseline_integrated_run_id || '32932103226' }}
      BASELINE_INTEGRATED_ARTIFACT: ${{ inputs.baseline_integrated_artifact || 'integrated-trait-coverage-32932103226' }}
      BASELINE_INTEGRATED_DIGEST: ${{ inputs.baseline_integrated_digest || 'sha256:d6405d520414b802fe75b2e450f45b8e74295f95049f20fb7ce61f57471326d1' }}
      LATEST_PUBLIC_WEB_RUN_ID: ${{ inputs.latest_public_web_run_id || '30141880859' }}
      LATEST_PUBLIC_WEB_ARTIFACT: ${{ inputs.latest_public_web_artifact || 'broad-web-medium-full-30141880859' }}
      ALL_MASTER_RUN_ID: ${{ inputs.all_master_run_id || '30081415812' }}
      ALL_MASTER_ARTIFACT: ${{ inputs.all_master_artifact || 'all-master-trait-ledger-30081415812' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Resolve and verify every pinned source artifact
        run: |
          python - <<'PY'
          import fnmatch
          import json
          import os
          import subprocess
          from pathlib import Path

          config = json.loads(
              Path("config/integrated_trait_coverage_sources.json").read_text()
          )
          for entry in config["sources"]:
              if entry["source_group"] != "latest_public_web":
                  if entry.get("role") not in {"bulk_materialization", "repo_staged_bulk"}:
                      continue
                  entry["run_id"] = int(os.environ["ALL_MASTER_RUN_ID"])
                  entry["artifact_name"] = os.environ["ALL_MASTER_ARTIFACT"]
              else:
                  entry["run_id"] = int(os.environ["LATEST_PUBLIC_WEB_RUN_ID"])
                  entry["artifact_name"] = os.environ["LATEST_PUBLIC_WEB_ARTIFACT"]
              entry.pop("artifact_id", None)
              entry.pop("artifact_digest", None)
          repo = config["repository"]
          resolved = []
          run_cache = {}
          artifact_cache = {}
          for entry in config["sources"]:
              run_id = int(entry["run_id"])
              if run_id not in run_cache:
                  run_cache[run_id] = json.loads(
                      subprocess.check_output(
                          ["gh", "api", f"repos/{repo}/actions/runs/{run_id}"],
                          text=True,
                      )
                  )
                  artifact_pages = json.loads(
                      subprocess.check_output(
                          [
                              "gh",
                              "api",
                              "--paginate",
                              "--slurp",
                              f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100",
                          ],
                          text=True,
                      )
                  )
                  artifact_cache[run_id] = [
                      artifact
                      for page in artifact_pages
                      for artifact in page["artifacts"]
                  ]
              run = run_cache[run_id]
              if run["status"] != "completed" or run["conclusion"] != "success":
                  raise SystemExit(
                      f"source run {run_id} is {run['status']}/{run['conclusion']}"
                  )
              pattern = entry["artifact_name"]
              matches = [
                  artifact
                  for artifact in artifact_cache[run_id]
                  if fnmatch.fnmatchcase(artifact["name"], pattern)
              ]
              if not matches:
                  raise SystemExit(
                      f"source run {run_id} has no artifact matching {pattern}"
                  )
              expired = [artifact["name"] for artifact in matches if artifact["expired"]]
              if expired:
                  raise SystemExit(f"expired source artifacts: {expired}")
              pinned_id = entry.get("artifact_id")
              if pinned_id and (
                  len(matches) != 1 or matches[0]["id"] != int(pinned_id)
              ):
                  raise SystemExit(
                      f"source {entry['source_group']} artifact id does not "
                      f"match pin {pinned_id}"
                  )
              pinned_digest = entry.get("artifact_digest")
              if pinned_digest and (
                  len(matches) != 1
                  or matches[0].get("digest", "") != pinned_digest
              ):
                  raise SystemExit(
                      f"source {entry['source_group']} artifact digest does "
                      f"not match pin {pinned_digest}"
                  )
              item = dict(entry)
              item["run_status"] = run["status"]
              item["run_conclusion"] = run["conclusion"]
              item["run_url"] = run["html_url"]
              item["resolved_artifacts"] = [
                  {
                      "id": artifact["id"],
                      "name": artifact["name"],
                      "digest": artifact.get("digest", ""),
                      "size_in_bytes": artifact["size_in_bytes"],
                      "expires_at": artifact["expires_at"],
                  }
                  for artifact in sorted(matches, key=lambda value: value["name"])
              ]
              resolved.append(item)
          config["sources"] = resolved
          config["resolved_by_workflow_run_id"] = int(os.environ["GITHUB_RUN_ID"])
          config["resolved_git_sha"] = os.environ["GITHUB_SHA"]
          output = Path("/tmp/resolved_integrated_trait_sources.json")
          output.write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          print(f"verified {len(resolved)} source entries")
          PY

      - name: Download exact aggregation inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/baseline-integrated
          mkdir -p "$INPUT_ROOT"/{three-pass-high,three-pass-medium,three-pass-unresolved}
          mkdir -p "$INPUT_ROOT"/{expanded,targeted,validated-low,all-master,pilot-input}
          mkdir -p "$INPUT_ROOT/latest-public-web"

          baseline_artifact_json=$(gh api --paginate \
            "repos/$GH_REPO/actions/runs/$BASELINE_INTEGRATED_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .name == \"$BASELINE_INTEGRATED_ARTIFACT\")")
          test "$(printf '%s\n' "$baseline_artifact_json" | jq -s 'length')" = "1"
          test "$(printf '%s\n' "$baseline_artifact_json" | jq -r .digest)" = "$BASELINE_INTEGRATED_DIGEST"
          test "$(gh run view "$BASELINE_INTEGRATED_RUN_ID" --repo "$GH_REPO" \
            --json conclusion --jq .conclusion)" = "success"
          gh run download "$BASELINE_INTEGRATED_RUN_ID" \
            --name "$BASELINE_INTEGRATED_ARTIFACT" \
            --dir /tmp/baseline-integrated
          test -f /tmp/baseline-integrated/strict_species_axis_coverage.csv.gz

          gh run download 29814502655 \
            --pattern "three-pass-pass1-shard-*-29814502655" \
            --dir "$INPUT_ROOT/three-pass-high"
          gh run download 29819475348 \
            --pattern "three-pass-pass2-shard-*-29819475348" \
            --dir "$INPUT_ROOT/three-pass-medium"
          gh run download 29840507345 \
            --pattern "three-pass-pass3-shard-*-29840507345" \
            --dir "$INPUT_ROOT/three-pass-unresolved"

          gh run download 29926967923 \
            --name "direct-expanded-trait-pilot-final-29926967923" \
            --dir "$INPUT_ROOT/expanded/29926967923"
          gh run download 29926967923 \
            --name "direct-expanded-trait-pilot-input-29926967923" \
            --dir "$INPUT_ROOT/pilot-input"
          for run_id in \
            30076138052 \
            29935400807 \
            29982714811 \
            30024100020 \
            30055434119 \
            30076151486
          do
            gh run download "$run_id" \
              --name "direct-expanded-large-final-$run_id" \
              --dir "$INPUT_ROOT/expanded/$run_id"
          done

          gh run download 30055437912 \
            --name "targeted-reacquisition-final-30055437912" \
            --dir "$INPUT_ROOT/targeted"
          gh run download 30055434111 \
            --name "validated-low-after-targeted-30055434111" \
            --dir "$INPUT_ROOT/validated-low"
          gh run download "$ALL_MASTER_RUN_ID" \
            --name "$ALL_MASTER_ARTIFACT" \
            --dir "$INPUT_ROOT/all-master"
          gh run download "$LATEST_PUBLIC_WEB_RUN_ID" \
            --name "$LATEST_PUBLIC_WEB_ARTIFACT" \
            --dir "$INPUT_ROOT/latest-public-web"

      - name: Verify artifact-confirmed expanded-wave ranges
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["INPUT_ROOT"])
          expected = {
              30076138052: (2000, 4000),
              29935400807: (4000, 24000),
              29982714811: (24000, 44000),
              30024100020: (44000, 64000),
              30055434119: (64000, 84000),
              30076151486: (84000, 107000),
          }
          observed = []
          for run_id, intended in expected.items():
              matches = list(
                  (root / "expanded" / str(run_id)).glob(
                      "**/direct_expanded_trait_summary.json"
                  )
              )
              if len(matches) != 1:
                  raise SystemExit(f"run {run_id}: summary count={len(matches)}")
              summary = json.loads(matches[0].read_text())
              actual = (summary["offset_start"], summary["offset_end"])
              if actual != intended:
                  raise SystemExit(
                      f"run {run_id}: artifact range {actual} != {intended}"
                  )
              observed.append(actual)
          if sorted(observed) != [
              (2000, 4000),
              (4000, 24000),
              (24000, 44000),
              (44000, 64000),
              (64000, 84000),
              (84000, 107000),
          ]:
              raise SystemExit(f"large-wave ranges overlap or have gaps: {observed}")

          pilot_masters = list(
              (root / "pilot-input").glob("**/targeted_master.csv.gz")
          )
          pilot_plans = list(
              (root / "pilot-input").glob("**/plan/shard_plan.json")
          )
          if len(pilot_masters) != 1 or len(pilot_plans) != 1:
              raise SystemExit(
                  "pilot artifact file counts differ from contract: "
                  f"masters={len(pilot_masters)}, plans={len(pilot_plans)}"
              )
          from island_v2.web_trait_shard_campaign import (
              _master_fingerprint,
              load_campaign_master,
          )

          pilot_master = load_campaign_master(
              pilot_masters[0],
              Path("config/angiosperm_scope.yml"),
          )
          pilot_plan = json.loads(pilot_plans[0].read_text())
          pilot_count = len(pilot_master)
          pilot_fingerprint = _master_fingerprint(pilot_master)
          expected_pilot_count = 715
          expected_pilot_fingerprint = (
              "9be8660b108a5d0926c157ba063135e0e"
              "a95447e4080717ce3b0b7db1084f584"
          )
          if pilot_count != expected_pilot_count:
              raise SystemExit(
                  f"pilot scoped species={pilot_count} != {expected_pilot_count}"
              )
          if pilot_fingerprint != expected_pilot_fingerprint:
              raise SystemExit(
                  "pilot targeted-master fingerprint changed: "
                  f"{pilot_fingerprint}"
              )
          if (
              pilot_plan["n_global_species"] != pilot_count
              or pilot_plan["master_fingerprint"] != pilot_fingerprint
          ):
              raise SystemExit("pilot targeted-master and shard plan disagree")
          print("artifact-confirmed expanded-wave coverage: [0,107000)")
          PY

      - name: Build integrated species-axis ledger
        run: |
          island-v2-integrated-trait-coverage \
            --three-pass-high-dir "$INPUT_ROOT/three-pass-high" \
            --three-pass-medium-dir "$INPUT_ROOT/three-pass-medium" \
            --three-pass-unresolved-dir "$INPUT_ROOT/three-pass-unresolved" \
            --expanded-artifact-dir "$INPUT_ROOT/expanded/29926967923" \
            --expanded-artifact-dir "$INPUT_ROOT/expanded/30076138052" \
            --expanded-artifact-dir "$INPUT_ROOT/expanded/29935400807" \
            --expanded-artifact-dir "$INPUT_ROOT/expanded/29982714811" \
            --expanded-artifact-dir "$INPUT_ROOT/expanded/30024100020" \
            --expanded-artifact-dir "$INPUT_ROOT/expanded/30055434119" \
            --expanded-artifact-dir "$INPUT_ROOT/expanded/30076151486" \
            --targeted-dir "$INPUT_ROOT/targeted" \
            --validated-low-dir "$INPUT_ROOT/validated-low" \
            --all-master-dir "$INPUT_ROOT/all-master" \
            --source-manifest-json /tmp/resolved_integrated_trait_sources.json \
            --output-dir "$OUTPUT_ROOT" \
            --expected-species 106295 \
            > "$OUTPUT_ROOT.log"
          cat "$OUTPUT_ROOT/integrated_trait_coverage_summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild Validated Low and strict all-evidence audit
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(
              "data/v2/staging/traits/direct_llm_pilot/"
              "20260808_scale_source_acquisition"
          )
          expected = {
              "scale_source_incremental_evidence.csv.gz": (
                  "3b9204acecd8b66e1f58dd9ae7165a4b3c43375d8fe2fed5ecf30ea03a55e298"
              ),
              "scale_source_manual_audit.csv": (
                  "5280af857b0398cf99a87a2c60a1675450d20e78543b445d1105538c77cea4c3"
              ),
          }
          for name, digest in expected.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"reviewed scale-source hash changed: {name}")
          audit = json.loads(
              (root / "scale_source_audit_summary.json").read_text(encoding="utf-8")
          )
          if (
              audit["precision_contract"] != "accepted_correct/all_reviewed"
              or audit["reviewed"] != 1622
              or audit["precision"] < 0.90
              or audit["cultivar_contamination_rate"] > 0.02
          ):
              raise SystemExit("reviewed scale-source promotion gate failed")
          PY
          island-v2-all-evidence-trait-audit \
            --integrated-dir "$OUTPUT_ROOT" \
            --latest-public-web-dir "$INPUT_ROOT/latest-public-web" \
            --validated-low-dir "$INPUT_ROOT/validated-low" \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --island-occurrences-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --source-manifest-json /tmp/resolved_integrated_trait_sources.json \
            --ontology-yaml config/trait_ontology.yml \
            --angiosperm-scope-yaml config/angiosperm_scope.yml \
            --sensitivity-lock-json config/trait_cascade_artifact_lock.json \
            --direct-evidence-exclusions-csv \
              data/v2/staging/traits/open_web_pilot/direct_evidence_exclusions_20260811.csv \
            --supplemental-direct-evidence-csv \
              data/v2/staging/traits/direct_llm_pilot/20260808_scale_source_acquisition/scale_source_incremental_evidence.csv.gz \
            --output-dir "$OUTPUT_ROOT" \
            --expected-species 106295 \
            > "$OUTPUT_ROOT/all_evidence_audit.log"
          cat "$OUTPUT_ROOT/all_evidence_trait_coverage_summary.json" \
            >> "$GITHUB_STEP_SUMMARY"
          cp \
            data/v2/staging/traits/direct_llm_pilot/20260808_scale_source_acquisition/scale_source_audit_summary.json \
            "$OUTPUT_ROOT/reviewed_scale_source_audit_summary.json"
          cp \
            data/v2/staging/traits/direct_llm_pilot/20260808_scale_source_acquisition/scale_source_provider_trait_audit_precision.csv \
            "$OUTPUT_ROOT/reviewed_scale_source_provider_trait_precision.csv"

      - name: Compare against the immutable formal baseline
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          import pandas as pd

          keys = ["accepted_species", "axis"]
          before = pd.read_csv(
              "/tmp/baseline-integrated/strict_species_axis_coverage.csv.gz",
              dtype=str,
          ).fillna("")
          after = pd.read_csv(
              Path(os.environ["OUTPUT_ROOT"]) / "strict_species_axis_coverage.csv.gz",
              dtype=str,
          ).fillna("")
          for label, frame in {"before": before, "after": after}.items():
              if len(frame) != 318885 or frame[keys].duplicated().any():
                  raise SystemExit(f"invalid {label} fixed universe")
              if frame["accepted_species"].nunique() != 106295:
                  raise SystemExit(f"invalid {label} species denominator")
          if set(map(tuple, before[keys].to_numpy())) != set(
              map(tuple, after[keys].to_numpy())
          ):
              raise SystemExit("baseline and rebuilt species-axis universes differ")

          before_filled = before.set_index(keys)["quality"].ne("")
          after_filled = after.set_index(keys)["quality"].ne("")
          comparison = {
              "contract": "formal_integrated_coverage_delta_v1",
              "baseline": {
                  "run_id": int(os.environ["BASELINE_INTEGRATED_RUN_ID"]),
                  "artifact_name": os.environ["BASELINE_INTEGRATED_ARTIFACT"],
                  "artifact_digest": os.environ["BASELINE_INTEGRATED_DIGEST"],
                  "filled_species_axis": int(before_filled.sum()),
              },
              "candidate": {
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "git_sha": os.environ["GITHUB_SHA"],
                  "filled_species_axis": int(after_filled.sum()),
              },
              "gross_gain": int((~before_filled & after_filled).sum()),
              "loss": int((before_filled & ~after_filled).sum()),
              "net_gain": int(after_filled.sum() - before_filled.sum()),
              "by_axis": {},
          }
          for axis in sorted(after["axis"].unique()):
              mask = after_filled.index.get_level_values("axis") == axis
              comparison["by_axis"][axis] = {
                  "gross_gain": int((~before_filled & after_filled & mask).sum()),
                  "loss": int((before_filled & ~after_filled & mask).sum()),
                  "net_gain": int((after_filled & mask).sum() - (before_filled & mask).sum()),
                  "before_filled": int((before_filled & mask).sum()),
                  "after_filled": int((after_filled & mask).sum()),
              }

          artifact = json.loads(
              subprocess.check_output(
                  [
                      "gh",
                      "api",
                      f"repos/{os.environ['GH_REPO']}/actions/runs/"
                      f"{os.environ['BASELINE_INTEGRATED_RUN_ID']}/artifacts?per_page=100",
                  ],
                  text=True,
              )
          )["artifacts"]
          exact = [
              item
              for item in artifact
              if item["name"] == os.environ["BASELINE_INTEGRATED_ARTIFACT"]
              and not item["expired"]
          ]
          if len(exact) != 1:
              raise SystemExit("baseline artifact identity is no longer unique")
          comparison["baseline"]["artifact_id"] = int(exact[0]["id"])
          output = Path(os.environ["OUTPUT_ROOT"]) / "formal_baseline_comparison.json"
          output.write_text(json.dumps(comparison, indent=2, sort_keys=True) + "\n")
          print(json.dumps(comparison, indent=2, sort_keys=True))
          PY
          cat "$OUTPUT_ROOT/formal_baseline_comparison.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: integrated-trait-coverage-${{ github.run_id }}
          path: /tmp/integrated-trait-coverage
          if-no-files-found: error
          retention-days: 90
