name: Build Izu public-data audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/izu-public-data-acquisition-final4
    paths:
      - "src/island_v2/izu_public_data.py"
      - "tests/test_izu_public_data.py"
      - ".github/workflows/build-izu-public-data-audit.yml"
      - "data/v2/staging/gbif/collected/island_species_occurrences.csv.gz"
      - "data/v2/staging/gbif/collected/island_observation_effort.csv"
  pull_request:
    paths:
      - "src/island_v2/izu_public_data.py"
      - "tests/test_izu_public_data.py"
      - ".github/workflows/build-izu-public-data-audit.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_izu_public_data.py
      - name: Extract exact-island Izu records
        run: >-
          python -m island_v2.izu_public_data build
          --species-snapshot data/v2/staging/gbif/collected/island_species_occurrences.csv.gz
          --effort-csv data/v2/staging/gbif/collected/island_observation_effort.csv
          --output-dir artifacts/izu_public_data
      - uses: actions/upload-artifact@v4
        with:
          name: izu-public-data-audit
          path: artifacts/izu_public_data
