name: build_pilot_island_curation

# Build a reviewable, non-curated worklist for the first exact-island GBIF
# records. The workflow does not alter taxon-scope decisions, establishment
# decisions, traits, or analysis inclusion.
on:
  workflow_dispatch:
    inputs:
      max_trait_candidates_per_island:
        description: "Maximum blocked trait candidates staged per island."
        required: false
        default: "25"

permissions:
  contents: read

concurrency:
  group: pilot-island-curation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FROZEN_ARTIFACT_ID: "8066083419"
      FROZEN_ARTIFACT_SHA256: "bee33e14672ec7ff4ed1f7acaea36b32cc6170a45c3d14b2caeb5f43bfaa623b"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test taxonomy and pilot-cureation routing
        run: pytest -q tests/test_taxon_intake.py tests/test_pilot_curation.py
      - name: Fetch and verify frozen island manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ARTIFACT_ID}/zip" \
            --output /tmp/frozen.zip
          actual="$(sha256sum /tmp/frozen.zip | awk '{print $1}')"
          test "$actual" = "$FROZEN_ARTIFACT_SHA256" || { echo "Frozen artifact digest mismatch: $actual" >&2; exit 2; }
          unzip -q /tmp/frozen.zip -d /tmp/frozen
      - name: Scope taxa to the pilot-registry islands
        run: |
          python - <<'PY'
          import os
          import pandas as pd

          registry = pd.read_csv("data/v2/curation/pilot_island_registry.csv", dtype=str).fillna("")
          island_ids = set(registry["island_id"].astype(str).str.strip())
          occ = pd.read_csv(
              "data/v2/staging/gbif/collected/island_species_occurrences.csv", dtype=str
          ).fillna("")
          occ = occ.loc[occ["island_id"].astype(str).str.strip().isin(island_ids)]
          species = set(occ["species"].astype(str).str.strip())
          taxa = pd.read_csv("data/v2/staging/gbif/collected/island_taxa.csv", dtype=str).fillna("")
          taxa = taxa.loc[taxa["accepted_species"].astype(str).str.strip().isin(species)]
          os.makedirs("/tmp/scoped", exist_ok=True)
          occ.to_csv("/tmp/scoped/island_species_occurrences.csv", index=False)
          taxa.to_csv("/tmp/scoped/island_taxa.csv", index=False)
          # One GBIF backbone call per name: scope to the declared pilot islands so
          # this stays bounded instead of matching the whole global flora.
          print(f"Scoped taxon intake to {len(island_ids)} pilot island(s): "
                f"{len(taxa)} taxa, {len(occ)} occurrence rows.")
          PY
      - name: Rebuild non-curated taxonomy and establishment queues
        run: |
          island-v2-taxon-intake build \
            --taxa-csv /tmp/scoped/island_taxa.csv \
            --island-species-csv /tmp/scoped/island_species_occurrences.csv \
            --output-dir /tmp/taxon_intake \
            --pause-seconds 0.05
      - name: Build pilot island curation worklist
        run: |
          island-v2-pilot-curation build \
            --island-manifest-csv /tmp/frozen/islands/gshhg/prepared/island_manifest.csv \
            --taxon-intake-csv /tmp/taxon_intake/taxon_intake_review_queue.csv \
            --establishment-queue-csv /tmp/taxon_intake/island_establishment_review_queue.csv \
            --pilot-registry-csv data/v2/curation/pilot_island_registry.csv \
            --output-dir data/v2/staging/pilot_curation \
            --max-trait-candidates-per-island "${{ inputs.max_trait_candidates_per_island }}" \
            --restrict-to-pilot-registry
      - name: Summarize pilot curation
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('data/v2/staging/pilot_curation/pilot_curation_summary.json')
          print('## Pilot island curation status')
          if path.exists():
              summary = json.loads(path.read_text(encoding='utf-8'))
              for key, value in summary.items():
                  if key != 'by_island':
                      print(f'- {key}: {value}')
              for island_id, details in summary.get('by_island', {}).items():
                  print(f'### {details["canonical_island_name"]} ({island_id})')
                  print(f'- flora_anchor_status: {details["flora_anchor_status"]}')
                  print(f'- curation_route: {details["curation_route"]}')
                  for stage, count in details["review_stage_counts"].items():
                      print(f'- {stage}: {count}')
          else:
              print('- No pilot curation output produced.')
          PY
      - name: Upload pilot curation worklists
        uses: actions/upload-artifact@v4
        with:
          name: pilot-island-curation-${{ github.run_id }}
          path: data/v2/staging/pilot_curation/
          if-no-files-found: error
          retention-days: 90
