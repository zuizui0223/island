name: build_taxon_intake

# Resolve the current raw collector taxa against GBIF Backbone into reviewable
# staging products. This workflow does not alter curated taxon decisions, trait
# evidence, or analysis inclusion.
on:
  workflow_dispatch:
    inputs:
      pause_seconds:
        description: "Pause between uncached GBIF backbone requests."
        required: false
        default: "0.05"

permissions:
  contents: read

concurrency:
  group: taxon-intake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test taxonomy intake logic
        run: pytest -q tests/test_taxon_intake.py
      - name: Build non-curated taxonomy and establishment queues
        run: |
          island-v2-taxon-intake build \
            --taxa-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --island-species-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --output-dir data/v2/staging/taxon_intake \
            --pause-seconds "${{ inputs.pause_seconds }}"
      - name: Summarize taxonomy intake
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('data/v2/staging/taxon_intake/taxon_intake_summary.json')
          print('## Taxon intake status')
          if path.exists():
              for key, value in json.loads(path.read_text(encoding='utf-8')).items():
                  print(f'- {key}: {value}')
          else:
              print('- No intake summary produced.')
          PY
      - name: Upload review queues and cached backbone responses
        uses: actions/upload-artifact@v4
        with:
          name: taxon-intake-${{ github.run_id }}
          path: data/v2/staging/taxon_intake/
          if-no-files-found: error
          retention-days: 90
