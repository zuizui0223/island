name: build_v2_llm_evidence_packets

on:
  workflow_dispatch:
    inputs:
      species_csv:
        description: "Species CSV used to generate and order the validation packet."
        required: true
        default: "data/v2/staging/traits/validation_pilot/validation_pilot_species.csv"
        type: string
      max_taxa:
        description: "Maximum species to retrieve source text for."
        required: true
        default: "25"
        type: string
      batch_size:
        description: "Species per evidence-locked LLM packet."
        required: true
        default: "10"
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-v2-llm-evidence-packets.yml"
      - "config/v2_llm_evidence_prompt.txt"
      - "config/v2_trait_acquisition.yml"
      - "src/island_v2/llm_evidence_extraction.py"
      - "tests/test_llm_evidence_extraction.py"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v2-llm-evidence-packets.yml"
      - "config/v2_llm_evidence_prompt.txt"
      - "config/v2_trait_acquisition.yml"
      - "src/island_v2/llm_evidence_extraction.py"
      - "tests/test_llm_evidence_extraction.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Validate evidence-locked LLM packet contract
        run: |
          pytest -q tests/test_llm_evidence_extraction.py
          island-v2-llm-evidence --help >/dev/null
          python scripts/validate_workflows.py
          ruff check \
            src/island_v2/llm_evidence_extraction.py \
            tests/test_llm_evidence_extraction.py

  build-packets:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    env:
      SPECIES_CSV: ${{ inputs.species_csv }}
      MAX_TAXA: ${{ inputs.max_taxa }}
      BATCH_SIZE: ${{ inputs.batch_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Validate bounded inputs
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          species_csv = Path(os.environ["SPECIES_CSV"])
          max_taxa = int(os.environ["MAX_TAXA"])
          batch_size = int(os.environ["BATCH_SIZE"])
          if not species_csv.exists():
              raise SystemExit(f"species_csv does not exist: {species_csv}")
          if not 1 <= max_taxa <= 500:
              raise SystemExit("max_taxa must be between 1 and 500")
          if not 1 <= batch_size <= 100:
              raise SystemExit("batch_size must be between 1 and 100")
          PY
      - name: Freeze public source text and deterministic baseline candidates
        run: |
          island-v2-v1-category-search search \
            --species-csv "$SPECIES_CSV" \
            --output-dir /tmp/public_flora_scout \
            --max-taxa "$MAX_TAXA"
      - name: Build gap-only evidence-locked LLM packets
        run: |
          island-v2-llm-evidence prepare \
            --source-csv /tmp/public_flora_scout/source_texts.csv \
            --species-csv "$SPECIES_CSV" \
            --candidate-csv /tmp/public_flora_scout/v2_reported_candidates.csv \
            --output-dir /tmp/v2_llm_evidence_packets \
            --batch-size "$BATCH_SIZE"
      - name: Publish packet summary
        run: cat /tmp/v2_llm_evidence_packets/llm_packet_manifest.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frozen sources and LLM packets
        uses: actions/upload-artifact@v4
        with:
          name: v2-llm-evidence-packets-${{ github.run_id }}
          path: |
            /tmp/public_flora_scout/source_texts.csv
            /tmp/public_flora_scout/v2_reported_candidates.csv
            /tmp/public_flora_scout/lookup_errors.csv
            /tmp/v2_llm_evidence_packets/
          if-no-files-found: error
          retention-days: 90
