name: Build Wave40 reviewed source recovery coverage

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-wave40-reviewed-source-recovery.yml"
      - "src/island_v2/all_evidence_trait_audit.py"
      - "src/island_v2/wave40_source_recovery_overlay.py"
      - "analysis/fetch_europe_pmc_reproduction_scale_20260807.py"
      - "tests/test_all_evidence_trait_audit.py"
      - "tests/test_wave40_source_recovery_overlay.py"
      - "tests/test_source_scale_trait_acquisition_20260807.py"
      - "data/v2/staging/traits/open_web_pilot/**"
      - "data/v2/staging/traits/wave35_reproduction_morphology_sources/**"
      - "data/v2/staging/traits/wave36_nhm_reproductive_remine/**"
      - "data/v2/staging/traits/wave39_floraweb_synonym_recovery/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-wave40-reviewed-source-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WAVE33_RUN_ID: "32932103226"
      WAVE33_ARTIFACT: "integrated-trait-coverage-32932103226"
      WAVE33_ARTIFACT_ID: "9593698966"
      WAVE33_ARTIFACT_DIGEST: "sha256:d6405d520414b802fe75b2e450f45b8e74295f95049f20fb7ce61f57471326d1"
      PUBLIC_WEB_RUN_ID: "30141880859"
      PUBLIC_WEB_ARTIFACT: "broad-web-medium-full-30141880859"
      PUBLIC_WEB_ARTIFACT_ID: "8614792912"
      PUBLIC_WEB_ARTIFACT_DIGEST: "sha256:e4059b90ab54334fde9fcb5b160be825131561cb3d0d9dc628e063ecd63fe9b1"
      WAVE37_RUN_ID: "33143109604"
      WAVE37_ARTIFACT: "wave37-europe-pmc-reproduction-33143109604"
      WAVE37_ARTIFACT_ID: "9674790380"
      WAVE37_ARTIFACT_DIGEST: "sha256:dc1f4820d98b06dd928aee8d6725dcc24de7121bf0fb9917553629970ea64a6d"
      WAVE38_RUN_ID: "33149235490"
      WAVE38_ARTIFACT: "wave38-source-locked-llm-33149235490"
      WAVE38_ARTIFACT_ID: "9677027199"
      WAVE38_ARTIFACT_DIGEST: "sha256:7a7b322e7ab8a43477245ddb405779b186008850070711bd4d23bc782e81a4de"
      WAVE39_RUN_ID: "33149998400"
      WAVE39_ARTIFACT: "wave39-floraweb-synonym-recovery-33149998400"
      WAVE39_ARTIFACT_ID: "9677327835"
      WAVE39_ARTIFACT_DIGEST: "sha256:3b6dbd4dbd1143ae79e79ff16990e881f5371dac5671a2c5d732a4cffe5f00d5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Verify reviewed source-package contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          from island_v2.all_evidence_trait_audit import (
              load_reviewed_direct_supplements,
          )

          paths = tuple(Path(path) for path in (
              "data/v2/staging/traits/open_web_pilot/goal_scale_source_package_20260811/goal_scale_source_package_20260811_evidence.csv.gz",
              "data/v2/staging/traits/open_web_pilot/efloras_medium_checkpoint_20260811/efloras_medium_evidence_20260811.csv.gz",
              "data/v2/staging/traits/open_web_pilot/pngtrees_source_package_20260813/pngtrees_source_package_evidence_20260813.csv.gz",
              "data/v2/staging/traits/open_web_pilot/iospe_orchid_colour_checkpoint_20260812/iospe_orchid_colour_evidence_20260812.csv.gz",
              "data/v2/staging/traits/open_web_pilot/official_flora_colour_recovery_checkpoint_20260811/official_flora_colour_evidence_20260811.csv.gz",
              "data/v2/staging/traits/open_web_pilot/wfo_kew_africa_recovery_checkpoint_20260811/wfo_kew_africa_recovery_evidence_20260811.csv.gz",
              "data/v2/staging/traits/open_web_pilot/rodger_2021_autofertility_checkpoint_20260811/rodger_2021_autofertility_evidence_20260811.csv.gz",
              "data/v2/staging/traits/open_web_pilot/florml_size_recovery_checkpoint_20260812/florml_size_evidence_20260812.csv.gz",
              "data/v2/staging/traits/open_web_pilot/palmpedia_archive_checkpoint_20260813/palmpedia_archive_source_package_evidence_20260813.csv.gz",
              "data/v2/staging/traits/open_web_pilot/cached_evidence_recovery_checkpoint_20260813/cached_evidence_recovery_evidence_20260813.csv.gz",
          ))
          evidence = load_reviewed_direct_supplements(paths)
          assert len(paths) == 10
          assert len(evidence) == 38513
          assert len(evidence[["accepted_species", "trait_name"]].drop_duplicates()) == 37676
          assert not evidence["source_lineage"].eq("").any()
          assert not evidence["source_excerpt"].eq("").any()
          assert not evidence["trait_name"].isin(
              ["pollen_vector_mode", "reward_type"]
          ).any()
          PY

      - name: Download and verify pinned formal artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "$WAVE33_RUN_ID|$WAVE33_ARTIFACT_ID|$WAVE33_ARTIFACT|$WAVE33_ARTIFACT_DIGEST|wave33" \
            "$PUBLIC_WEB_RUN_ID|$PUBLIC_WEB_ARTIFACT_ID|$PUBLIC_WEB_ARTIFACT|$PUBLIC_WEB_ARTIFACT_DIGEST|public-web" \
            "$WAVE37_RUN_ID|$WAVE37_ARTIFACT_ID|$WAVE37_ARTIFACT|$WAVE37_ARTIFACT_DIGEST|wave37" \
            "$WAVE38_RUN_ID|$WAVE38_ARTIFACT_ID|$WAVE38_ARTIFACT|$WAVE38_ARTIFACT_DIGEST|wave38" \
            "$WAVE39_RUN_ID|$WAVE39_ARTIFACT_ID|$WAVE39_ARTIFACT|$WAVE39_ARTIFACT_DIGEST|wave39"; do
            IFS='|' read -r run_id artifact_id artifact_name artifact_digest target <<<"$spec"
            test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")
            test "$(jq -r .name <<<"$metadata")" = "$artifact_name"
            test "$(jq -r .expired <<<"$metadata")" = false
            test "$(jq -r .digest <<<"$metadata")" = "$artifact_digest"
            mkdir -p "/tmp/$target"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "/tmp/$target"
          done

          wave33_resolved=$(find /tmp/wave33 -type f -name resolved_direct_species_trait.csv.gz -print -quit)
          public_web_evidence=$(find /tmp/public-web -type f -name broad_web_medium_evidence.csv.gz -print -quit)
          wave37_direct=$(find /tmp/wave37 -type f -name wave37_reviewed_direct_evidence.csv.gz -print -quit)
          wave37_rules=$(find /tmp/wave37 -type f -name trait_specific_genus_rule_audit.csv.gz -print -quit)
          wave38_direct=$(find /tmp/wave38 -type f -name wave38_reviewed_direct_evidence.csv.gz -print -quit)
          wave38_rules=$(find /tmp/wave38 -type f -name trait_specific_genus_rule_audit.csv.gz -print -quit)
          wave39_direct=$(find /tmp/wave39 -type f -name floraweb_synonym_reviewed_direct_evidence.csv.gz -print -quit)
          wave39_coverage=$(find /tmp/wave39 -type f -name wave39_species_axis_coverage.csv.gz -print -quit)
          wave39_rules=$(find /tmp/wave39 -type f -name wave39_new_trait_specific_genus_rule_audit.csv.gz -print -quit)
          for required in "$wave33_resolved" "$public_web_evidence" "$wave37_direct" "$wave37_rules" "$wave38_direct" "$wave38_rules" "$wave39_direct" "$wave39_coverage" "$wave39_rules"; do
            test -n "$required"
          done
          wave33_base=$(dirname "$wave33_resolved")
          test -f "$wave33_base/source_run_manifest.json"
          test -f "$wave33_base/trait_specific_genus_rule_audit.csv.gz"
          echo "WAVE33_BASE=$wave33_base" >> "$GITHUB_ENV"
          echo "PUBLIC_WEB_DIR=/tmp/public-web" >> "$GITHUB_ENV"
          echo "WAVE37_DIRECT=$wave37_direct" >> "$GITHUB_ENV"
          echo "WAVE37_RULES=$wave37_rules" >> "$GITHUB_ENV"
          echo "WAVE38_DIRECT=$wave38_direct" >> "$GITHUB_ENV"
          echo "WAVE38_RULES=$wave38_rules" >> "$GITHUB_ENV"
          echo "WAVE39_DIRECT=$wave39_direct" >> "$GITHUB_ENV"
          echo "WAVE39_COVERAGE=$wave39_coverage" >> "$GITHUB_ENV"
          echo "WAVE39_RULES=$wave39_rules" >> "$GITHUB_ENV"

      - name: Rebuild all direct evidence and trait-specific Validated Low
        run: |
          set -euo pipefail
          mkdir -p wave40-empty-low
          rm -rf wave40-all-evidence-audit
          python -m island_v2.all_evidence_trait_audit \
            --integrated-dir "$WAVE33_BASE" \
            --latest-public-web-dir "$PUBLIC_WEB_DIR" \
            --validated-low-dir wave40-empty-low \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --island-occurrences-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --source-manifest-json "$WAVE33_BASE/source_run_manifest.json" \
            --ontology-yaml config/trait_ontology.yml \
            --angiosperm-scope-yaml config/angiosperm_scope.yml \
            --sensitivity-lock-json config/trait_cascade_artifact_lock.json \
            --direct-evidence-exclusions-csv data/v2/staging/traits/open_web_pilot/direct_evidence_exclusions_20260811.csv \
            --output-dir wave40-all-evidence-audit \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave35_reproduction_morphology_sources/floraweb_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave35_reproduction_morphology_sources/glopl_2025_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave35_reproduction_morphology_sources/useful_plants_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave36_nhm_reproductive_remine/nhm_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave36_nhm_reproductive_remine/useful_plants_remine_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv "$WAVE37_DIRECT" \
            --supplemental-direct-evidence-csv "$WAVE38_DIRECT" \
            --supplemental-direct-evidence-csv "$WAVE39_DIRECT" \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/goal_scale_source_package_20260811/goal_scale_source_package_20260811_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/efloras_medium_checkpoint_20260811/efloras_medium_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/pngtrees_source_package_20260813/pngtrees_source_package_evidence_20260813.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/iospe_orchid_colour_checkpoint_20260812/iospe_orchid_colour_evidence_20260812.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/official_flora_colour_recovery_checkpoint_20260811/official_flora_colour_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/wfo_kew_africa_recovery_checkpoint_20260811/wfo_kew_africa_recovery_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/rodger_2021_autofertility_checkpoint_20260811/rodger_2021_autofertility_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/florml_size_recovery_checkpoint_20260812/florml_size_evidence_20260812.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/palmpedia_archive_checkpoint_20260813/palmpedia_archive_source_package_evidence_20260813.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/cached_evidence_recovery_checkpoint_20260813/cached_evidence_recovery_evidence_20260813.csv.gz \
            > wave40-all-evidence-audit-stdout.json

      - name: Build lossless formal Wave40 overlay
        run: |
          set -euo pipefail
          rm -rf wave40-trait-coverage
          python -m island_v2.wave40_source_recovery_overlay \
            --baseline-csv "$WAVE39_COVERAGE" \
            --all-evidence-dir wave40-all-evidence-audit \
            --reviewed-direct-csv data/v2/staging/traits/open_web_pilot/goal_scale_source_package_20260811/goal_scale_source_package_20260811_evidence.csv.gz \
            --reviewed-direct-csv data/v2/staging/traits/open_web_pilot/efloras_medium_checkpoint_20260811/efloras_medium_evidence_20260811.csv.gz \
            --reviewed-direct-csv data/v2/staging/traits/open_web_pilot/pngtrees_source_package_20260813/pngtrees_source_package_evidence_20260813.csv.gz \
            --reviewed-direct-csv data/v2/staging/traits/open_web_pilot/iospe_orchid_colour_checkpoint_20260812/iospe_orchid_colour_evidence_20260812.csv.gz \
            --reviewed-direct-csv data/v2/staging/traits/open_web_pilot/official_flora_colour_recovery_checkpoint_20260811/official_flora_colour_evidence_20260811.csv.gz \
            --reviewed-direct-csv data/v2/staging/traits/open_web_pilot/wfo_kew_africa_recovery_checkpoint_20260811/wfo_kew_africa_recovery_evidence_20260811.csv.gz \
            --reviewed-direct-csv data/v2/staging/traits/open_web_pilot/rodger_2021_autofertility_checkpoint_20260811/rodger_2021_autofertility_evidence_20260811.csv.gz \
            --reviewed-direct-csv data/v2/staging/traits/open_web_pilot/florml_size_recovery_checkpoint_20260812/florml_size_evidence_20260812.csv.gz \
            --reviewed-direct-csv data/v2/staging/traits/open_web_pilot/palmpedia_archive_checkpoint_20260813/palmpedia_archive_source_package_evidence_20260813.csv.gz \
            --reviewed-direct-csv data/v2/staging/traits/open_web_pilot/cached_evidence_recovery_checkpoint_20260813/cached_evidence_recovery_evidence_20260813.csv.gz \
            --previous-rule-audit-csv "$WAVE33_BASE/trait_specific_genus_rule_audit.csv.gz" \
            --previous-rule-audit-csv data/v2/staging/traits/wave35_reproduction_morphology_sources/wave35_provider_touched_new_rule_audit.csv.gz \
            --previous-rule-audit-csv data/v2/staging/traits/wave36_nhm_reproductive_remine/wave36_provider_touched_new_rule_audit.csv.gz \
            --previous-rule-audit-csv "$WAVE37_RULES" \
            --previous-rule-audit-csv "$WAVE38_RULES" \
            --previous-rule-audit-csv "$WAVE39_RULES" \
            --output-dir wave40-trait-coverage \
            --expected-species 106295 \
            > wave40-trait-coverage-stdout.json

      - name: Verify exact artifact-backed Wave40 gain
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("wave40-trait-coverage/wave40_coverage_summary.json").read_text()
          )
          assert summary["delta"] == {
              "action_counts": {
                  "direct_enrichment": 34964,
                  "direct_fill": 9,
                  "direct_upgrade": 8,
                  "validated_low_fill": 74,
              },
              "by_axis_net_gain": {
                  "floral_structural_complexity": 79,
                  "flower_colour": 1,
                  "reproductive_assurance": 3,
              },
              "gross_gain_species_axis": 83,
              "loss_species_axis": 0,
              "net_gain_species_axis": 83,
              "new_validated_low_species_trait": 9428,
              "resolved_target_direct_species_trait": 37101,
              "reviewed_direct_rows": 38513,
              "reviewed_direct_species_trait": 37676,
          }
          after = summary["after"]
          assert after["filled_species_axis"] == 219987
          assert after["unresolved_species_axis"] == 98898
          assert after["quality_counts"] == {
              "high": 55531,
              "medium": 46754,
              "low": 117702,
          }
          assert after["by_axis"]["floral_structural_complexity"]["filled_species"] == 91531
          assert after["by_axis"]["flower_colour"]["filled_species"] == 82381
          assert after["by_axis"]["reproductive_assurance"]["filled_species"] == 46075
          assert after["species_by_filled_axis_count"] == {
              "0": 9509,
              "1": 14387,
              "2": 41597,
              "3": 40802,
          }
          assert len(summary["new_eligible_rules"]) == 85
          assert len(summary["shadow_invalidated_prior_rules"]) == 302
          assert summary["shadow_changed_prior_rule_states"] == []
          assert summary["remaining_to_campaign_target"] == {
              "floral_structural_complexity": 422,
              "flower_colour": 2655,
              "reproductive_assurance": 17702,
          }
          assert all(summary["checks"].values()), summary["checks"]
          PY

      - name: Run rule, exact-species query, and overlay tests
        env:
          PYTHONPATH: src:.
        run: |
          pytest -q \
            tests/test_all_evidence_trait_audit.py \
            tests/test_source_scale_trait_acquisition_20260807.py \
            tests/test_wave40_source_recovery_overlay.py \
            --basetemp=.pytest-wave40

      - name: Upload immutable Wave40 audit and formal coverage
        uses: actions/upload-artifact@v4
        with:
          name: wave40-reviewed-source-recovery-${{ github.run_id }}
          path: |
            wave40-all-evidence-audit/**
            wave40-all-evidence-audit-stdout.json
            wave40-trait-coverage/**
            wave40-trait-coverage-stdout.json
          if-no-files-found: error
          retention-days: 90
