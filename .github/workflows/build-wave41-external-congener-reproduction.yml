name: Build Wave41 external congener reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-wave41-external-congener-reproduction.yml"
      - "src/island_v2/all_evidence_trait_audit.py"
      - "src/island_v2/external_congener_reproduction_checkpoint.py"
      - "src/island_v2/wave41_external_congener_overlay.py"
      - "tests/test_all_evidence_trait_audit.py"
      - "tests/test_external_congener_reproduction_checkpoint.py"
      - "tests/test_wave41_external_congener_overlay.py"
      - "data/v2/external/traits/rodger_2021_pollinator_contribution/**"
      - "data/v2/staging/traits/wave41_external_congener_reproduction/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-wave41-external-congener-reproduction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAVE33_RUN_ID: "32932103226"
      WAVE33_ARTIFACT: "integrated-trait-coverage-32932103226"
      WAVE33_ARTIFACT_ID: "9593698966"
      WAVE33_ARTIFACT_DIGEST: "sha256:d6405d520414b802fe75b2e450f45b8e74295f95049f20fb7ce61f57471326d1"
      PUBLIC_WEB_RUN_ID: "30141880859"
      PUBLIC_WEB_ARTIFACT: "broad-web-medium-full-30141880859"
      PUBLIC_WEB_ARTIFACT_ID: "8614792912"
      PUBLIC_WEB_ARTIFACT_DIGEST: "sha256:e4059b90ab54334fde9fcb5b160be825131561cb3d0d9dc628e063ecd63fe9b1"
      WAVE37_RUN_ID: "33143109604"
      WAVE37_ARTIFACT: "wave37-europe-pmc-reproduction-33143109604"
      WAVE37_ARTIFACT_ID: "9674790380"
      WAVE37_ARTIFACT_DIGEST: "sha256:dc1f4820d98b06dd928aee8d6725dcc24de7121bf0fb9917553629970ea64a6d"
      WAVE38_RUN_ID: "33149235490"
      WAVE38_ARTIFACT: "wave38-source-locked-llm-33149235490"
      WAVE38_ARTIFACT_ID: "9677027199"
      WAVE38_ARTIFACT_DIGEST: "sha256:7a7b322e7ab8a43477245ddb405779b186008850070711bd4d23bc782e81a4de"
      WAVE39_RUN_ID: "33149998400"
      WAVE39_ARTIFACT: "wave39-floraweb-synonym-recovery-33149998400"
      WAVE39_ARTIFACT_ID: "9677327835"
      WAVE39_ARTIFACT_DIGEST: "sha256:3b6dbd4dbd1143ae79e79ff16990e881f5371dac5671a2c5d732a4cffe5f00d5"
      WAVE40_RUN_ID: "33155408805"
      WAVE40_ARTIFACT: "wave40-reviewed-source-recovery-33155408805"
      WAVE40_ARTIFACT_ID: "9679520443"
      WAVE40_ARTIFACT_DIGEST: "sha256:a6a9a2ca28abf44d6fc1ef3b3bba07cecce567d203e6e28db6048ad7b523ee0a"
      BSDB_COMMIT: "9e87946d1e3121d39e657b702cf9f92ccc10936e"
      BSDB_SHA256: "f935c8150b3d719aba5f62f14335c1a185304155403bf50db1e3ef1393fc55f4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Download and verify pinned formal artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "$WAVE33_RUN_ID|$WAVE33_ARTIFACT_ID|$WAVE33_ARTIFACT|$WAVE33_ARTIFACT_DIGEST|wave33" \
            "$PUBLIC_WEB_RUN_ID|$PUBLIC_WEB_ARTIFACT_ID|$PUBLIC_WEB_ARTIFACT|$PUBLIC_WEB_ARTIFACT_DIGEST|public-web" \
            "$WAVE37_RUN_ID|$WAVE37_ARTIFACT_ID|$WAVE37_ARTIFACT|$WAVE37_ARTIFACT_DIGEST|wave37" \
            "$WAVE38_RUN_ID|$WAVE38_ARTIFACT_ID|$WAVE38_ARTIFACT|$WAVE38_ARTIFACT_DIGEST|wave38" \
            "$WAVE39_RUN_ID|$WAVE39_ARTIFACT_ID|$WAVE39_ARTIFACT|$WAVE39_ARTIFACT_DIGEST|wave39" \
            "$WAVE40_RUN_ID|$WAVE40_ARTIFACT_ID|$WAVE40_ARTIFACT|$WAVE40_ARTIFACT_DIGEST|wave40"; do
            IFS='|' read -r run_id artifact_id artifact_name artifact_digest target <<<"$spec"
            test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")
            test "$(jq -r .name <<<"$metadata")" = "$artifact_name"
            test "$(jq -r .expired <<<"$metadata")" = false
            test "$(jq -r .digest <<<"$metadata")" = "$artifact_digest"
            mkdir -p "/tmp/$target"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "/tmp/$target"
          done

          wave33_resolved=$(find /tmp/wave33 -type f -name resolved_direct_species_trait.csv.gz -print -quit)
          public_web_evidence=$(find /tmp/public-web -type f -name broad_web_medium_evidence.csv.gz -print -quit)
          wave37_direct=$(find /tmp/wave37 -type f -name wave37_reviewed_direct_evidence.csv.gz -print -quit)
          wave38_direct=$(find /tmp/wave38 -type f -name wave38_reviewed_direct_evidence.csv.gz -print -quit)
          wave39_direct=$(find /tmp/wave39 -type f -name floraweb_synonym_reviewed_direct_evidence.csv.gz -print -quit)
          wave40_coverage=$(find /tmp/wave40 -type f -path '*/wave40-trait-coverage/wave40_species_axis_coverage.csv.gz' -print -quit)
          wave40_rules=$(find /tmp/wave40 -type f -path '*/wave40-all-evidence-audit/trait_specific_genus_rule_audit.csv.gz' -print -quit)
          for required in "$wave33_resolved" "$public_web_evidence" "$wave37_direct" "$wave38_direct" "$wave39_direct" "$wave40_coverage" "$wave40_rules"; do
            test -n "$required"
          done
          wave33_base=$(dirname "$wave33_resolved")
          test -f "$wave33_base/source_run_manifest.json"
          test -f "$wave33_base/trait_specific_genus_rule_audit.csv.gz"
          test "$(sha256sum "$wave40_coverage" | cut -d' ' -f1)" = "8f559bb0c2cab209e74915fa4304f09d352bc4409a53ae6254ca64d9b6a15e70"
          test "$(sha256sum "$wave40_rules" | cut -d' ' -f1)" = "bb9e693af76ed033f89f01e2600124e3a8212dafb5f907d3d6af464c82edfe19"
          echo "WAVE33_BASE=$wave33_base" >> "$GITHUB_ENV"
          echo "PUBLIC_WEB_DIR=/tmp/public-web" >> "$GITHUB_ENV"
          echo "WAVE37_DIRECT=$wave37_direct" >> "$GITHUB_ENV"
          echo "WAVE38_DIRECT=$wave38_direct" >> "$GITHUB_ENV"
          echo "WAVE39_DIRECT=$wave39_direct" >> "$GITHUB_ENV"
          echo "WAVE40_COVERAGE=$wave40_coverage" >> "$GITHUB_ENV"
          echo "WAVE40_RULES=$wave40_rules" >> "$GITHUB_ENV"

      - name: Rebuild the frozen two-backbone checkpoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/bsdb
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/dirtyplants/BSdb/$BSDB_COMMIT/Zell_df_12_29_23.csv" \
            --output /tmp/bsdb/Zell_df_12_29_23.csv
          test "$(sha256sum /tmp/bsdb/Zell_df_12_29_23.csv | cut -d' ' -f1)" = "$BSDB_SHA256"
          rm -rf wave41-checkpoint
          python -m island_v2.external_congener_reproduction_checkpoint \
            --bsdb-source-csv /tmp/bsdb/Zell_df_12_29_23.csv \
            --bsdb-responses-jsonl data/v2/staging/traits/wave41_external_congener_reproduction/bsdb_external_two_backbone_responses_20260828.jsonl.gz \
            --rodger-source-csv data/v2/external/traits/rodger_2021_pollinator_contribution/rodger_2021_pollinator_contribution_snapshot.csv.gz \
            --rodger-responses-jsonl data/v2/staging/traits/wave41_external_congener_reproduction/rodger_external_two_backbone_responses_20260828.jsonl.gz \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --angiosperm-scope-yaml config/angiosperm_scope.yml \
            --output-dir wave41-checkpoint \
            --expected-species 106295 \
            > wave41-checkpoint-stdout.json
          for name in \
            wave41_external_congener_reproductive_evidence.csv.gz \
            wave41_external_congener_mapping_audit.csv.gz \
            wave41_external_congener_selection_audit.csv.gz; do
            cmp \
              "wave41-checkpoint/$name" \
              "data/v2/staging/traits/wave41_external_congener_reproduction/$name"
          done

      - name: Verify external-evidence checkpoint contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("wave41-checkpoint/wave41_external_congener_checkpoint_summary.json").read_text()
          )
          assert summary["fixed_target_species"] == 106295
          assert summary["queries"] == {"gbif": 2001, "total": 4002, "wfo": 2001}
          assert summary["query_cost_usd"] == 0
          assert summary["evidence"] == {
              "by_trait": {
                  "autonomous_selfing_capacity": 439,
                  "self_incompatibility": 1152,
              },
              "by_value": {"SC": 569, "SI": 583, "absent": 189, "autonomous": 250},
              "entered_fixed_target_direct_coverage": 0,
              "rows": 1591,
              "source_lineages": 726,
              "species": 1391,
              "species_trait": 1541,
          }
          assert summary["output_sha256"] == {
              "wave41_external_congener_mapping_audit.csv.gz": "4967dcc4fdd7ebbf33adf1c3c4d0d1e3a8fec6e67ac6abe669a4c1652f4d0ec1",
              "wave41_external_congener_reproductive_evidence.csv.gz": "0e3e709e18105e81996231580042837a48f62f19c84468bb00d26e8c8cef4514",
              "wave41_external_congener_selection_audit.csv.gz": "c21d9c1fc02e04c83d5f67f5318a9759dbeda4c9566e46a8c58b296c47a72757",
          }
          assert all(summary["checks"].values()), summary["checks"]
          PY

      - name: Rebuild all direct evidence and trait-specific Validated Low
        run: |
          set -euo pipefail
          mkdir -p wave41-empty-low
          rm -rf wave41-all-evidence-audit
          python -m island_v2.all_evidence_trait_audit \
            --integrated-dir "$WAVE33_BASE" \
            --latest-public-web-dir "$PUBLIC_WEB_DIR" \
            --validated-low-dir wave41-empty-low \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --island-occurrences-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --source-manifest-json "$WAVE33_BASE/source_run_manifest.json" \
            --ontology-yaml config/trait_ontology.yml \
            --angiosperm-scope-yaml config/angiosperm_scope.yml \
            --sensitivity-lock-json config/trait_cascade_artifact_lock.json \
            --direct-evidence-exclusions-csv data/v2/staging/traits/open_web_pilot/direct_evidence_exclusions_20260811.csv \
            --output-dir wave41-all-evidence-audit \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave35_reproduction_morphology_sources/floraweb_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave35_reproduction_morphology_sources/glopl_2025_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave35_reproduction_morphology_sources/useful_plants_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave36_nhm_reproductive_remine/nhm_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave36_nhm_reproductive_remine/useful_plants_remine_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv "$WAVE37_DIRECT" \
            --supplemental-direct-evidence-csv "$WAVE38_DIRECT" \
            --supplemental-direct-evidence-csv "$WAVE39_DIRECT" \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/goal_scale_source_package_20260811/goal_scale_source_package_20260811_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/efloras_medium_checkpoint_20260811/efloras_medium_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/pngtrees_source_package_20260813/pngtrees_source_package_evidence_20260813.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/iospe_orchid_colour_checkpoint_20260812/iospe_orchid_colour_evidence_20260812.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/official_flora_colour_recovery_checkpoint_20260811/official_flora_colour_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/wfo_kew_africa_recovery_checkpoint_20260811/wfo_kew_africa_recovery_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/rodger_2021_autofertility_checkpoint_20260811/rodger_2021_autofertility_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/florml_size_recovery_checkpoint_20260812/florml_size_evidence_20260812.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/palmpedia_archive_checkpoint_20260813/palmpedia_archive_source_package_evidence_20260813.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/cached_evidence_recovery_checkpoint_20260813/cached_evidence_recovery_evidence_20260813.csv.gz \
            --external-congener-evidence-csv wave41-checkpoint/wave41_external_congener_reproductive_evidence.csv.gz \
            > wave41-all-evidence-audit-stdout.json

      - name: Build lossless formal Wave41 overlay
        run: |
          set -euo pipefail
          rm -rf wave41-trait-coverage
          python -m island_v2.wave41_external_congener_overlay \
            --baseline-csv "$WAVE40_COVERAGE" \
            --previous-rule-audit-csv "$WAVE40_RULES" \
            --all-evidence-dir wave41-all-evidence-audit \
            --external-evidence-csv wave41-checkpoint/wave41_external_congener_reproductive_evidence.csv.gz \
            --checkpoint-summary-json wave41-checkpoint/wave41_external_congener_checkpoint_summary.json \
            --output-dir wave41-trait-coverage \
            --expected-species 106295 \
            > wave41-trait-coverage-stdout.json

      - name: Verify exact artifact-backed Wave41 gain
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          audit = json.loads(
              Path("wave41-all-evidence-audit/all_evidence_trait_coverage_summary.json").read_text()
          )
          external = audit["source_lineage_audit"]["external_congener_support"]
          assert external == {
              "cell_resolution_classification_counts": {
                  "independent_source_agreement": 21,
                  "single_independent_lineage": 1502,
                  "unresolved_direct_conflict": 18,
              },
              "duplicate_rows": 47,
              "entered_confirmatory_direct_coverage": 0,
              "files": 1,
              "lineages_after_trait_specific_dedup": 1567,
              "resolved_species": 1378,
              "resolved_species_trait": 1523,
              "rows": 1591,
          }

          summary = json.loads(
              Path("wave41-trait-coverage/wave41_coverage_summary.json").read_text()
          )
          assert summary["delta"] == {
              "action_counts": {"validated_low_fill": 390},
              "by_axis_net_gain": {
                  "floral_structural_complexity": 0,
                  "flower_colour": 0,
                  "reproductive_assurance": 390,
              },
              "external_direct_conflicts": 18,
              "external_evidence_rows": 1591,
              "external_resolved_species_trait": 1523,
              "gross_gain_species_axis": 390,
              "loss_species_axis": 0,
              "net_gain_species_axis": 390,
              "new_validated_low_species_trait": 764,
          }
          after = summary["after"]
          assert after["filled_species_axis"] == 220377
          assert after["unresolved_species_axis"] == 98508
          assert after["quality_counts"] == {
              "high": 55531,
              "medium": 46754,
              "low": 118092,
          }
          assert after["by_axis"]["floral_structural_complexity"]["filled_species"] == 91531
          assert after["by_axis"]["flower_colour"]["filled_species"] == 82381
          assert after["by_axis"]["reproductive_assurance"]["filled_species"] == 46465
          assert after["species_by_filled_axis_count"] == {
              "0": 9500,
              "1": 14344,
              "2": 41320,
              "3": 41131,
          }
          assert len(summary["new_eligible_rules"]) == 56
          assert len(summary["shadow_invalidated_prior_rules"]) == 11
          assert summary["shadow_changed_prior_rule_states"] == []
          assert summary["remaining_to_campaign_target"] == {
              "floral_structural_complexity": 422,
              "flower_colour": 2655,
              "reproductive_assurance": 17312,
          }
          assert all(summary["checks"].values()), summary["checks"]

          before = pd.read_csv(Path(__import__("os").environ["WAVE40_COVERAGE"]), dtype=str).fillna("")
          after_frame = pd.read_csv(
              "wave41-trait-coverage/wave41_species_axis_coverage.csv.gz", dtype=str
          ).fillna("")
          keys = ["accepted_species", "axis"]
          assert len(before) == len(after_frame) == 318885
          assert not before[keys].duplicated().any()
          assert not after_frame[keys].duplicated().any()
          compared = before[keys + ["quality"]].merge(
              after_frame[keys + ["quality"]],
              on=keys,
              suffixes=("_before", "_after"),
              validate="one_to_one",
          )
          assert not (compared["quality_before"].ne("") & compared["quality_after"].eq("")).any()
          assert int((compared["quality_before"].eq("") & compared["quality_after"].ne("")).sum()) == 390
          PY

      - name: Run strict-scope, genus-rule, and overlay tests
        env:
          PYTHONPATH: src:.
        run: |
          pytest -q \
            tests/test_all_evidence_trait_audit.py \
            tests/test_external_congener_reproduction_checkpoint.py \
            tests/test_wave41_external_congener_overlay.py \
            --basetemp=.pytest-wave41
          ruff check \
            src/island_v2/all_evidence_trait_audit.py \
            src/island_v2/external_congener_reproduction_checkpoint.py \
            src/island_v2/wave41_external_congener_overlay.py \
            tests/test_all_evidence_trait_audit.py \
            tests/test_external_congener_reproduction_checkpoint.py \
            tests/test_wave41_external_congener_overlay.py

      - name: Upload immutable Wave41 checkpoint, audit, and formal coverage
        uses: actions/upload-artifact@v4
        with:
          name: wave41-external-congener-reproduction-${{ github.run_id }}
          path: |
            wave41-checkpoint/**
            wave41-checkpoint-stdout.json
            wave41-all-evidence-audit/**
            wave41-all-evidence-audit-stdout.json
            wave41-trait-coverage/**
            wave41-trait-coverage-stdout.json
          if-no-files-found: error
          retention-days: 90
