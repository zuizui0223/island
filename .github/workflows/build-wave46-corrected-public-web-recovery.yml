name: Build Wave46 corrected public-Web recovery

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-integrated-trait-coverage.yml"
      - ".github/workflows/build-wave46-corrected-public-web-recovery.yml"
      - "config/integrated_trait_coverage_sources.json"
      - "src/island_v2/all_evidence_trait_audit.py"
      - "src/island_v2/wave46_corrected_public_web_checkpoint.py"
      - "src/island_v2/wave46_corrected_public_web_overlay.py"
      - "tests/test_all_evidence_trait_audit.py"
      - "tests/test_wave46_corrected_public_web.py"
      - "data/v2/staging/traits/wave46_corrected_public_web_recovery/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-wave46-corrected-public-web-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WAVE33_RUN_ID: "32932103226"
      WAVE33_ARTIFACT: "integrated-trait-coverage-32932103226"
      WAVE33_ARTIFACT_ID: "9593698966"
      WAVE33_ARTIFACT_DIGEST: "sha256:d6405d520414b802fe75b2e450f45b8e74295f95049f20fb7ce61f57471326d1"
      PUBLIC_WEB_RUN_ID: "32710232989"
      PUBLIC_WEB_ARTIFACT: "reviewed-open-web-evidence-32710232989"
      PUBLIC_WEB_ARTIFACT_ID: "9514635137"
      PUBLIC_WEB_ARTIFACT_DIGEST: "sha256:54c2249e829f2df0f8bb970cdf9fe3dc001a1f3dcbf045a76eae5c5e6102806f"
      WAVE37_RUN_ID: "33143109604"
      WAVE37_ARTIFACT: "wave37-europe-pmc-reproduction-33143109604"
      WAVE37_ARTIFACT_ID: "9674790380"
      WAVE37_ARTIFACT_DIGEST: "sha256:dc1f4820d98b06dd928aee8d6725dcc24de7121bf0fb9917553629970ea64a6d"
      WAVE38_RUN_ID: "33149235490"
      WAVE38_ARTIFACT: "wave38-source-locked-llm-33149235490"
      WAVE38_ARTIFACT_ID: "9677027199"
      WAVE38_ARTIFACT_DIGEST: "sha256:7a7b322e7ab8a43477245ddb405779b186008850070711bd4d23bc782e81a4de"
      WAVE39_RUN_ID: "33149998400"
      WAVE39_ARTIFACT: "wave39-floraweb-synonym-recovery-33149998400"
      WAVE39_ARTIFACT_ID: "9677327835"
      WAVE39_ARTIFACT_DIGEST: "sha256:3b6dbd4dbd1143ae79e79ff16990e881f5371dac5671a2c5d732a4cffe5f00d5"
      WAVE41_RUN_ID: "33355297355"
      WAVE41_ARTIFACT: "wave41-external-congener-reproduction-33355297355"
      WAVE41_ARTIFACT_ID: "9744976429"
      WAVE41_ARTIFACT_DIGEST: "sha256:2c42f30df358c682119d921c4963939a8a2f4f571912cdcacf100068d2b71803"
      WAVE42_RUN_ID: "33357283159"
      WAVE42_ARTIFACT: "wave42-external-bulk-reproduction-33357283159"
      WAVE42_ARTIFACT_ID: "9745623568"
      WAVE42_ARTIFACT_DIGEST: "sha256:9b70274b169d241b329eb7fc0c660a3b37329822200c63ba2d26675860348e4d"
      WAVE43_RUN_ID: "33359673472"
      WAVE43_ARTIFACT: "wave43-austraits-external-morphology-33359673472"
      WAVE43_ARTIFACT_ID: "9746369275"
      WAVE43_ARTIFACT_DIGEST: "sha256:b9ee209ecb7483b9d74fdfe177aacbfd5359cbab38d1349684716ac4945c700b"
      WAVE44_RUN_ID: "33362634097"
      WAVE44_ARTIFACT: "wave44-floraweb-glopl-external-reproduction-33362634097"
      WAVE44_ARTIFACT_ID: "9747294512"
      WAVE44_ARTIFACT_DIGEST: "sha256:fd42feb15bca68bbe11d57c2fe65c66b99177c88b46cb56555d6dc02c1d0aff9"
      WAVE45_RUN_ID: "33370692122"
      WAVE45_ARTIFACT: "wave45-promoted-reproductive-evidence-33370692122"
      WAVE45_ARTIFACT_ID: "9750073314"
      WAVE45_ARTIFACT_DIGEST: "sha256:aea119548f0a01e0df886f0e6f5180210a469e808fd0af116b8476207b6212b7"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Download and verify every pinned formal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "$WAVE33_RUN_ID|$WAVE33_ARTIFACT_ID|$WAVE33_ARTIFACT|$WAVE33_ARTIFACT_DIGEST|wave33" \
            "$PUBLIC_WEB_RUN_ID|$PUBLIC_WEB_ARTIFACT_ID|$PUBLIC_WEB_ARTIFACT|$PUBLIC_WEB_ARTIFACT_DIGEST|public-web" \
            "$WAVE37_RUN_ID|$WAVE37_ARTIFACT_ID|$WAVE37_ARTIFACT|$WAVE37_ARTIFACT_DIGEST|wave37" \
            "$WAVE38_RUN_ID|$WAVE38_ARTIFACT_ID|$WAVE38_ARTIFACT|$WAVE38_ARTIFACT_DIGEST|wave38" \
            "$WAVE39_RUN_ID|$WAVE39_ARTIFACT_ID|$WAVE39_ARTIFACT|$WAVE39_ARTIFACT_DIGEST|wave39" \
            "$WAVE41_RUN_ID|$WAVE41_ARTIFACT_ID|$WAVE41_ARTIFACT|$WAVE41_ARTIFACT_DIGEST|wave41" \
            "$WAVE42_RUN_ID|$WAVE42_ARTIFACT_ID|$WAVE42_ARTIFACT|$WAVE42_ARTIFACT_DIGEST|wave42" \
            "$WAVE43_RUN_ID|$WAVE43_ARTIFACT_ID|$WAVE43_ARTIFACT|$WAVE43_ARTIFACT_DIGEST|wave43" \
            "$WAVE44_RUN_ID|$WAVE44_ARTIFACT_ID|$WAVE44_ARTIFACT|$WAVE44_ARTIFACT_DIGEST|wave44" \
            "$WAVE45_RUN_ID|$WAVE45_ARTIFACT_ID|$WAVE45_ARTIFACT|$WAVE45_ARTIFACT_DIGEST|wave45"; do
            IFS='|' read -r run_id artifact_id artifact_name artifact_digest target <<<"$spec"
            test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")
            test "$(jq -r .name <<<"$metadata")" = "$artifact_name"
            test "$(jq -r .expired <<<"$metadata")" = false
            test "$(jq -r .digest <<<"$metadata")" = "$artifact_digest"
            mkdir -p "/tmp/$target"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "/tmp/$target"
          done

          wave33_resolved=$(find /tmp/wave33 -type f -name resolved_direct_species_trait.csv.gz -print -quit)
          public_web_evidence=$(find /tmp/public-web -type f -name broad_web_medium_evidence.csv.gz -print -quit)
          wave37_direct=$(find /tmp/wave37 -type f -name wave37_reviewed_direct_evidence.csv.gz -print -quit)
          wave38_direct=$(find /tmp/wave38 -type f -name wave38_reviewed_direct_evidence.csv.gz -print -quit)
          wave39_direct=$(find /tmp/wave39 -type f -name floraweb_synonym_reviewed_direct_evidence.csv.gz -print -quit)
          wave41_external=$(find /tmp/wave41 -type f -name wave41_external_congener_reproductive_evidence.csv.gz -print -quit)
          wave42_external=$(find /tmp/wave42 -type f -name wave42_external_reproductive_evidence.csv.gz -print -quit)
          wave43_external=$(find /tmp/wave43 -type f -name wave43_austraits_external_morphology_evidence.csv.gz -print -quit)
          wave44_direct=$(find /tmp/wave44 -type f -name wave44_synonym_direct_reproductive_evidence.csv.gz -print -quit)
          wave44_external=$(find /tmp/wave44 -type f -name wave44_external_congener_reproductive_evidence.csv.gz -print -quit)
          wave45_coverage=$(find /tmp/wave45 -type f -path '*/wave45-trait-coverage/wave45_species_axis_coverage.csv.gz' -print -quit)
          wave45_rules=$(find /tmp/wave45 -type f -path '*/wave45-all-evidence-audit/trait_specific_genus_rule_audit.csv.gz' -print -quit)
          wave45_direct=$(find /tmp/wave45 -type f -name wave45_combined_reviewed_direct_evidence.csv.gz -print -quit)
          wave45_external=$(find /tmp/wave45 -type f -name wave45_external_congener_evidence.csv.gz -print -quit)
          for required in "$wave33_resolved" "$public_web_evidence" "$wave37_direct" "$wave38_direct" "$wave39_direct" "$wave41_external" "$wave42_external" "$wave43_external" "$wave44_direct" "$wave44_external" "$wave45_coverage" "$wave45_rules" "$wave45_direct" "$wave45_external"; do
            test -n "$required"
          done
          wave33_base=$(dirname "$wave33_resolved")
          test -f "$wave33_base/source_run_manifest.json"
          test "$(sha256sum "$public_web_evidence" | cut -d' ' -f1)" = "88c14139d8221001472748124e81775d2688549e979076177a6a6e6fd5cba857"
          test "$(sha256sum "$wave45_coverage" | cut -d' ' -f1)" = "2a1a047060a9734702dcdfdad80e92c61fdc4feea4c73305724db449aeb1c376"
          test "$(sha256sum "$wave45_rules" | cut -d' ' -f1)" = "6821ffb902acc6f61c12482707db3f003d77c1b28847132b4fd6bc2eb895ebb1"
          test "$(sha256sum "$wave45_direct" | cut -d' ' -f1)" = "979c7c3b28660217158288dceaaee3a601af066f07a7a4b5559024408cda8a96"
          test "$(sha256sum "$wave45_external" | cut -d' ' -f1)" = "48ec00e130d6bd44bc147d5543425ee181c451817cbf0a9b1a682f898440f35a"
          echo "WAVE33_BASE=$wave33_base" >> "$GITHUB_ENV"
          echo "PUBLIC_WEB_DIR=/tmp/public-web" >> "$GITHUB_ENV"
          echo "PUBLIC_WEB_EVIDENCE=$public_web_evidence" >> "$GITHUB_ENV"
          echo "WAVE37_DIRECT=$wave37_direct" >> "$GITHUB_ENV"
          echo "WAVE38_DIRECT=$wave38_direct" >> "$GITHUB_ENV"
          echo "WAVE39_DIRECT=$wave39_direct" >> "$GITHUB_ENV"
          echo "WAVE41_EXTERNAL=$wave41_external" >> "$GITHUB_ENV"
          echo "WAVE42_EXTERNAL=$wave42_external" >> "$GITHUB_ENV"
          echo "WAVE43_EXTERNAL=$wave43_external" >> "$GITHUB_ENV"
          echo "WAVE44_DIRECT=$wave44_direct" >> "$GITHUB_ENV"
          echo "WAVE44_EXTERNAL=$wave44_external" >> "$GITHUB_ENV"
          echo "WAVE45_COVERAGE=$wave45_coverage" >> "$GITHUB_ENV"
          echo "WAVE45_RULES=$wave45_rules" >> "$GITHUB_ENV"
          echo "WAVE45_DIRECT=$wave45_direct" >> "$GITHUB_ENV"
          echo "WAVE45_EXTERNAL=$wave45_external" >> "$GITHUB_ENV"

      - name: Validate corrected public-Web and new reproductive packet
        run: |
          set -euo pipefail
          mkdir -p wave46-checkpoint/source-packet
          cp -a data/v2/staging/traits/wave46_corrected_public_web_recovery/. wave46-checkpoint/source-packet/
          python -m island_v2.wave46_corrected_public_web_checkpoint \
            --packet-dir wave46-checkpoint/source-packet \
            --latest-public-web-csv "$PUBLIC_WEB_EVIDENCE" \
            --target-coverage-csv "$WAVE45_COVERAGE" \
            --output-dir wave46-checkpoint \
            --output-json wave46-checkpoint/wave46_checkpoint_validation.json \
            --expected-species 106295

      - name: Verify exact Wave46 checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("wave46-checkpoint/wave46_checkpoint_validation.json").read_text()
          )
          assert summary["fixed_target_species"] == 106295
          assert summary["evidence"] == {
              "combined_direct_rows": 118886,
              "identity_rows": 1,
              "latest_public_web_rows": 118884,
              "latest_public_web_species": 55158,
              "latest_public_web_species_trait": 96264,
              "new_direct_rows": 2,
              "new_direct_species": 1,
              "new_direct_species_trait": 2,
              "new_external_species_trait": 0,
              "review_rows": 2,
          }
          assert summary["query_cost_usd"] == 0
          assert summary["artifact_sha256"] == {
              "wave46_corrected_public_web_direct_packet.csv.gz": (
                  "a17d8c1e94e96d206e4df2b20f5ddbc512c15fb7890417b3fbab9978fa93683e"
              )
          }
          assert all(summary["checks"].values()), summary["checks"]
          PY

      - name: Rebuild all direct evidence and trait-specific Validated Low
        run: |
          set -euo pipefail
          mkdir -p wave46-empty-low
          python -m island_v2.all_evidence_trait_audit \
            --integrated-dir "$WAVE33_BASE" \
            --latest-public-web-dir "$PUBLIC_WEB_DIR" \
            --validated-low-dir wave46-empty-low \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --island-occurrences-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --source-manifest-json "$WAVE33_BASE/source_run_manifest.json" \
            --ontology-yaml config/trait_ontology.yml \
            --angiosperm-scope-yaml config/angiosperm_scope.yml \
            --sensitivity-lock-json config/trait_cascade_artifact_lock.json \
            --direct-evidence-exclusions-csv data/v2/staging/traits/open_web_pilot/direct_evidence_exclusions_20260811.csv \
            --output-dir wave46-all-evidence-audit \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave35_reproduction_morphology_sources/floraweb_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave35_reproduction_morphology_sources/glopl_2025_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave35_reproduction_morphology_sources/useful_plants_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave36_nhm_reproductive_remine/nhm_reviewed_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave36_nhm_reproductive_remine/useful_plants_remine_direct_evidence.csv.gz \
            --supplemental-direct-evidence-csv "$WAVE37_DIRECT" \
            --supplemental-direct-evidence-csv "$WAVE38_DIRECT" \
            --supplemental-direct-evidence-csv "$WAVE39_DIRECT" \
            --supplemental-direct-evidence-csv "$WAVE44_DIRECT" \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/goal_scale_source_package_20260811/goal_scale_source_package_20260811_evidence.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/efloras_medium_checkpoint_20260811/efloras_medium_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/pngtrees_source_package_20260813/pngtrees_source_package_evidence_20260813.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/iospe_orchid_colour_checkpoint_20260812/iospe_orchid_colour_evidence_20260812.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/official_flora_colour_recovery_checkpoint_20260811/official_flora_colour_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/wfo_kew_africa_recovery_checkpoint_20260811/wfo_kew_africa_recovery_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/rodger_2021_autofertility_checkpoint_20260811/rodger_2021_autofertility_evidence_20260811.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/florml_size_recovery_checkpoint_20260812/florml_size_evidence_20260812.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/palmpedia_archive_checkpoint_20260813/palmpedia_archive_source_package_evidence_20260813.csv.gz \
            --supplemental-direct-evidence-csv data/v2/staging/traits/open_web_pilot/cached_evidence_recovery_checkpoint_20260813/cached_evidence_recovery_evidence_20260813.csv.gz \
            --supplemental-direct-evidence-csv "$WAVE45_DIRECT" \
            --supplemental-direct-evidence-csv data/v2/staging/traits/wave46_corrected_public_web_recovery/wave46_reviewed_direct_evidence.csv \
            --external-congener-evidence-csv "$WAVE41_EXTERNAL" \
            --external-congener-evidence-csv "$WAVE42_EXTERNAL" \
            --external-congener-evidence-csv "$WAVE43_EXTERNAL" \
            --external-congener-evidence-csv "$WAVE44_EXTERNAL" \
            --external-congener-evidence-csv "$WAVE45_EXTERNAL"

      - name: Build lossless formal Wave46 overlay
        run: |
          set -euo pipefail
          python -m island_v2.wave46_corrected_public_web_overlay \
            --baseline-csv "$WAVE45_COVERAGE" \
            --previous-rule-audit-csv "$WAVE45_RULES" \
            --all-evidence-dir wave46-all-evidence-audit \
            --direct-evidence-csv wave46-checkpoint/wave46_corrected_public_web_direct_packet.csv.gz \
            --external-evidence-csv "$WAVE45_EXTERNAL" \
            --checkpoint-summary-json wave46-checkpoint/wave46_checkpoint_validation.json \
            --output-dir wave46-trait-coverage \
            --expected-species 106295

      - name: Verify artifact-backed Wave46 gain
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd

          summary = json.loads(
              Path("wave46-trait-coverage/wave46_coverage_summary.json").read_text()
          )
          assert summary["formal_wave33_run_id"] == 32932103226
          assert summary["baseline_formal_run_id"] == 33370692122
          assert summary["correct_public_web_run_id"] == 32710232989
          assert summary["fixed_denominator"] == {
              "species": 106295,
              "species_axis": 318885,
          }
          assert summary["delta"]["gross_gain_species_axis"] == 73
          assert summary["delta"]["net_gain_species_axis"] == 73
          assert summary["delta"]["loss_species_axis"] == 0
          assert summary["delta"]["by_axis_net_gain"] == {
              "floral_structural_complexity": 18,
              "flower_colour": 3,
              "reproductive_assurance": 52,
          }
          assert summary["delta"]["action_counts"] == {
              "direct_enrichment": 72494,
              "direct_fill": 1,
              "direct_upgrade": 6,
              "validated_low_fill": 72,
          }
          assert summary["after"]["filled_species_axis"] == 221370
          assert summary["after"]["unresolved_species_axis"] == 97515
          assert summary["after"]["quality_counts"] == {
              "high": 55551,
              "low": 119071,
              "medium": 46748,
          }
          assert {
              axis: values["filled_species"]
              for axis, values in summary["after"]["by_axis"].items()
          } == {
              "floral_structural_complexity": 91577,
              "flower_colour": 82392,
              "reproductive_assurance": 47401,
          }
          assert summary["after"]["species_by_filled_axis_count"] == {
              "0": 9458,
              "1": 14232,
              "2": 40677,
              "3": 41928,
          }
          assert summary["remaining_to_campaign_target"] == {
              "floral_structural_complexity": 376,
              "flower_colour": 2644,
              "reproductive_assurance": 16376,
          }
          assert summary["artifact_sha256"] == {
              "wave46_change_audit.csv.gz": (
                  "cafd1f736b7e1bd024380f85613ce109c7ec59a9aaacba5867ca1a3d1e09660b"
              ),
              "wave46_external_congener_resolved_species_trait.csv.gz": (
                  "2179f7213964ff31d08c8c5bc253dd26593973123f2e1a12cd15d555e5a43ce1"
              ),
              "wave46_external_congener_source_conflicts.csv.gz": (
                  "54978f5f770655646f7bb4740ea08e59d05808b4883416e8eb60bd6803738e7b"
              ),
              "wave46_new_trait_specific_genus_rule_audit.csv.gz": (
                  "b262bb4f801dc71344e8bfe47efa00874f13204fdca8ed6757cc1bb1cf4563b2"
              ),
              "wave46_new_validated_low_species_trait.csv.gz": (
                  "a6b899a2f6560a50e8511a10e95cfdea489e0b5d589318b6d52a1349795a446a"
              ),
              "wave46_resolved_direct_species_trait.csv.gz": (
                  "38e923f596e2f36e570ae2aa61302230c06ec594d8c4b580c0e0116db7492337"
              ),
              "wave46_species_axis_coverage.csv.gz": (
                  "53d2948781d23e1350a7acfdabb4861e6603e034e5dd74d6eea149748de42b12"
              ),
          }
          assert all(summary["checks"].values()), summary["checks"]

          before = pd.read_csv(os.environ["WAVE45_COVERAGE"], dtype=str).fillna("")
          after = pd.read_csv(
              "wave46-trait-coverage/wave46_species_axis_coverage.csv.gz", dtype=str
          ).fillna("")
          keys = ["accepted_species", "axis"]
          assert len(before) == len(after) == 318885
          assert not before[keys].duplicated().any()
          assert not after[keys].duplicated().any()
          compared = before[keys + ["quality"]].merge(
              after[keys + ["quality"]],
              on=keys,
              suffixes=("_before", "_after"),
              validate="one_to_one",
          )
          assert not (
              compared["quality_before"].ne("")
              & compared["quality_after"].eq("")
          ).any()
          assert int(
              (
                  compared["quality_before"].eq("")
                  & compared["quality_after"].ne("")
              ).sum()
          ) == summary["delta"]["gross_gain_species_axis"]
          PY

      - name: Run strict-scope, checkpoint, and overlay tests
        env:
          PYTHONPATH: src:.
        run: |
          pytest -q \
            tests/test_all_evidence_trait_audit.py \
            tests/test_wave45_promoted_reproductive_checkpoint.py \
            tests/test_wave45_promoted_reproductive_overlay.py \
            tests/test_wave46_corrected_public_web.py \
            --basetemp=.pytest-wave46
          ruff check \
            src/island_v2/all_evidence_trait_audit.py \
            src/island_v2/wave46_corrected_public_web_checkpoint.py \
            src/island_v2/wave46_corrected_public_web_overlay.py \
            tests/test_all_evidence_trait_audit.py \
            tests/test_wave46_corrected_public_web.py

      - name: Upload immutable Wave46 checkpoint, audit, and formal coverage
        uses: actions/upload-artifact@v4
        with:
          name: wave46-corrected-public-web-recovery-${{ github.run_id }}
          path: |
            wave46-checkpoint/**
            wave46-all-evidence-audit/**
            wave46-trait-coverage/**
          if-no-files-found: error
          retention-days: 90
