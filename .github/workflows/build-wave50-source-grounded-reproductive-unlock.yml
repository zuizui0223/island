name: Build Wave50 source-grounded reproductive unlock

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-wave50-source-grounded-reproductive-unlock.yml"
      - "src/island_v2/wave45_promoted_reproductive_checkpoint.py"
      - "src/island_v2/wave48_reproductive_checkpoint.py"
      - "src/island_v2/wave48_incremental_all_evidence.py"
      - "src/island_v2/wave50_reproductive_checkpoint.py"
      - "src/island_v2/wave50_incremental_all_evidence.py"
      - "src/island_v2/wave50_reproductive_overlay.py"
      - "tests/test_wave50_reproductive_unlock.py"
      - "data/v2/staging/traits/wave50_source_grounded_reproductive_unlock/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-wave50-source-grounded-reproductive-unlock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAVE33_RUN_ID: "32932103226"
      WAVE33_ARTIFACT: "integrated-trait-coverage-32932103226"
      WAVE33_ARTIFACT_ID: "9593698966"
      WAVE33_ARTIFACT_DIGEST: "sha256:d6405d520414b802fe75b2e450f45b8e74295f95049f20fb7ce61f57471326d1"
      WAVE49_RUN_ID: "33397671718"
      WAVE49_ARTIFACT: "wave49-reviewed-gap-recovery-33397671718"
      WAVE49_ARTIFACT_ID: "9759996045"
      WAVE49_ARTIFACT_DIGEST: "sha256:9e450d2350b5a2c62f1157bacc00553b74f9a5dd2d701091bb3cc3465baab90f"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Verify formal GitHub pins and download Wave49
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view "$WAVE33_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          wave33_metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$WAVE33_ARTIFACT_ID")
          test "$(jq -r .name <<<"$wave33_metadata")" = "$WAVE33_ARTIFACT"
          test "$(jq -r .expired <<<"$wave33_metadata")" = false
          test "$(jq -r .digest <<<"$wave33_metadata")" = "$WAVE33_ARTIFACT_DIGEST"

          test "$(gh run view "$WAVE49_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          wave49_metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$WAVE49_ARTIFACT_ID")
          test "$(jq -r .name <<<"$wave49_metadata")" = "$WAVE49_ARTIFACT"
          test "$(jq -r .expired <<<"$wave49_metadata")" = false
          test "$(jq -r .digest <<<"$wave49_metadata")" = "$WAVE49_ARTIFACT_DIGEST"
          mkdir -p /tmp/wave49
          gh run download "$WAVE49_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$WAVE49_ARTIFACT" --dir /tmp/wave49

          wave49_coverage=$(find /tmp/wave49 -type f -path '*/wave49-trait-coverage/wave49_species_axis_coverage.csv.gz' -print -quit)
          wave49_rules=$(find /tmp/wave49 -type f -path '*/wave49-all-evidence-audit/trait_specific_genus_rule_audit.csv.gz' -print -quit)
          wave49_direct=$(find /tmp/wave49 -type f -path '*/wave49-all-evidence-audit/resolved_direct_species_trait.csv.gz' -print -quit)
          wave49_external=$(find /tmp/wave49 -type f -path '*/wave49-all-evidence-audit/external_congener_resolved_species_trait.csv.gz' -print -quit)
          wave49_conflicts=$(find /tmp/wave49 -type f -path '*/wave49-all-evidence-audit/external_congener_source_lineage_conflicts.csv.gz' -print -quit)
          wave49_low=$(find /tmp/wave49 -type f -path '*/wave49-all-evidence-audit/rebuilt_all_evidence_validated_low.csv.gz' -print -quit)
          for required in "$wave49_coverage" "$wave49_rules" "$wave49_direct" "$wave49_external" "$wave49_conflicts" "$wave49_low"; do
            test -n "$required"
          done
          test "$(sha256sum "$wave49_coverage" | cut -d' ' -f1)" = "1f29d3712563fe44225ca18d3d2f0a88d6d878e9b3db8c4e0bf257aac9a312fc"
          test "$(sha256sum "$wave49_rules" | cut -d' ' -f1)" = "a9d0686f356a5ec18d3013985ee166709a7bb39437cf0e918b965c6417c7af59"
          test "$(sha256sum "$wave49_direct" | cut -d' ' -f1)" = "544f1f253524452f799776a875c445aa255e38003516867f0bdace6cab1f7303"
          test "$(sha256sum "$wave49_external" | cut -d' ' -f1)" = "0217608319b72167ccdf8e7103723b373f6814e6aa443e8a2d1918d6293720f9"
          test "$(sha256sum "$wave49_conflicts" | cut -d' ' -f1)" = "e4014bad74289e9c0c535c06dbfc8cf216f7ae23a4d173f5888a617ef265f02f"
          test "$(sha256sum "$wave49_low" | cut -d' ' -f1)" = "08232ace8609210068248634f752f314545552dded1f67b3d8599f3e67550231"
          echo "WAVE49_COVERAGE=$wave49_coverage" >> "$GITHUB_ENV"
          echo "WAVE49_RULES=$wave49_rules" >> "$GITHUB_ENV"
          echo "WAVE49_DIRECT=$wave49_direct" >> "$GITHUB_ENV"
          echo "WAVE49_EXTERNAL=$wave49_external" >> "$GITHUB_ENV"
          echo "WAVE49_CONFLICTS=$wave49_conflicts" >> "$GITHUB_ENV"
          echo "WAVE49_LOW=$wave49_low" >> "$GITHUB_ENV"

      - name: Retrieve and verify five reviewed original sources
        run: |
          set -euo pipefail
          manifest=data/v2/staging/traits/wave50_source_grounded_reproductive_unlock/source_manifest.json
          mkdir -p wave50-source
          jq -r '.sources[] | [.retrieval_url, .retrieved_filename] | @tsv' "$manifest" |
            while IFS=$'\t' read -r url filename; do
              curl --location --fail --retry 3 --connect-timeout 30 --max-time 600 \
                --user-agent 'island-trait-audit/1.0' "$url" \
                --output "wave50-source/$filename"
            done
          jq -r '.sources[] | [.retrieved_content_sha256, .retrieved_filename] | @tsv' "$manifest" |
            while IFS=$'\t' read -r expected filename; do
              test "$(sha256sum "wave50-source/$filename" | cut -d' ' -f1)" = "$expected"
            done

      - name: Validate frozen source-grounded packet
        run: |
          set -euo pipefail
          python -m island_v2.wave50_reproductive_checkpoint \
            --packet-dir data/v2/staging/traits/wave50_source_grounded_reproductive_unlock \
            --target-coverage-csv "$WAVE49_COVERAGE" \
            --retrieved-source-dir wave50-source \
            --output-dir wave50-checkpoint \
            --output-json wave50-checkpoint/wave50_checkpoint_summary.json \
            --expected-species 106295

      - name: Rebuild only touched trait-specific genus rules
        run: |
          set -euo pipefail
          python -m island_v2.wave50_incremental_all_evidence \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --ontology-yaml config/trait_ontology.yml \
            --baseline-coverage-csv "$WAVE49_COVERAGE" \
            --previous-rule-audit-csv "$WAVE49_RULES" \
            --previous-resolved-direct-csv "$WAVE49_DIRECT" \
            --previous-external-resolved-csv "$WAVE49_EXTERNAL" \
            --previous-external-conflicts-csv "$WAVE49_CONFLICTS" \
            --previous-rebuilt-low-csv "$WAVE49_LOW" \
            --new-direct-evidence-csv wave50-checkpoint/wave50_reviewed_direct_evidence.csv.gz \
            --new-external-evidence-csv wave50-checkpoint/wave50_external_congener_evidence.csv.gz \
            --output-dir wave50-all-evidence-audit \
            --expected-species 106295

      - name: Build lossless Wave50 overlay
        run: |
          set -euo pipefail
          python -m island_v2.wave50_reproductive_overlay \
            --baseline-csv "$WAVE49_COVERAGE" \
            --previous-rule-audit-csv "$WAVE49_RULES" \
            --all-evidence-dir wave50-all-evidence-audit \
            --direct-evidence-csv wave50-checkpoint/wave50_reviewed_direct_evidence.csv.gz \
            --external-evidence-csv wave50-checkpoint/wave50_external_congener_evidence.csv.gz \
            --checkpoint-summary-json wave50-checkpoint/wave50_checkpoint_summary.json \
            --output-dir wave50-trait-coverage \
            --expected-species 106295

      - name: Independently verify exact gain and scientific contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd

          audit = json.loads(Path("wave50-all-evidence-audit/all_evidence_trait_coverage_summary.json").read_text())
          summary = json.loads(Path("wave50-trait-coverage/wave50_coverage_summary.json").read_text())
          checkpoint = json.loads(Path("wave50-checkpoint/wave50_checkpoint_summary.json").read_text())
          assert checkpoint["baseline_formal_run_id"] == 33397671718
          assert checkpoint["evidence"]["new_direct_species_trait"] == 5
          assert checkpoint["queries"]["formal_search_api_queries"] == 779
          assert checkpoint["query_cost_usd"] == 0.0
          assert all(checkpoint["checks"].values()), checkpoint["checks"]
          assert audit["new_eligible_rules"] == [
              "Miscanthus x self_incompatibility",
              "Pultenaea x autonomous_selfing_capacity",
          ]
          assert audit["counterexample_blocked_rules"] == [
              "Polystachya x autonomous_selfing_capacity",
              "Portulaca x self_incompatibility",
          ]
          assert audit["new_validated_low_species_trait"] == 48
          assert audit["invalidated_prior_rules"] == []
          assert all(audit["checks"].values()), audit["checks"]
          assert summary["fixed_denominator"] == {"species": 106295, "species_axis": 318885}
          assert summary["delta"]["gross_gain_species_axis"] == 53
          assert summary["delta"]["loss_species_axis"] == 0
          assert summary["delta"]["by_axis_net_gain"] == {
              "floral_structural_complexity": 0,
              "flower_colour": 0,
              "reproductive_assurance": 53,
          }
          assert summary["delta"]["action_counts"] == {
              "direct_fill": 5,
              "validated_low_fill": 48,
          }
          assert summary["after"]["filled_species_axis"] == 221722
          assert summary["after"]["unresolved_species_axis"] == 97163
          assert summary["after"]["quality_counts"] == {
              "high": 55578,
              "low": 119110,
              "medium": 47034,
          }
          assert {axis: values["filled_species"] for axis, values in summary["after"]["by_axis"].items()} == {
              "floral_structural_complexity": 91613,
              "flower_colour": 82502,
              "reproductive_assurance": 47607,
          }
          assert summary["after"]["species_by_filled_axis_count"] == {
              "0": 9431,
              "1": 14149,
              "2": 40572,
              "3": 42143,
          }
          assert summary["remaining_to_campaign_target"] == {
              "floral_structural_complexity": 340,
              "flower_colour": 2534,
              "reproductive_assurance": 16170,
          }
          assert all(summary["checks"].values()), summary["checks"]

          low = pd.read_csv(
              "wave50-trait-coverage/wave50_new_validated_low_species_trait.csv.gz",
              dtype=str,
          ).fillna("")
          assert low.groupby(["genus", "trait_name", "normalized_value"]).size().to_dict() == {
              ("Miscanthus", "self_incompatibility", "SI"): 8,
              ("Pultenaea", "autonomous_selfing_capacity", "absent"): 40,
          }

          before = pd.read_csv(os.environ["WAVE49_COVERAGE"], dtype=str).fillna("")
          after = pd.read_csv(
              "wave50-trait-coverage/wave50_species_axis_coverage.csv.gz", dtype=str
          ).fillna("")
          compared = before.merge(
              after,
              on=["accepted_species", "axis"],
              suffixes=("_before", "_after"),
              validate="one_to_one",
          )
          assert len(compared) == 318885
          gained = compared["quality_before"].eq("") & compared["quality_after"].ne("")
          assert int(gained.sum()) == 53
          assert compared.loc[gained, "axis"].eq("reproductive_assurance").all()
          assert compared.loc[gained, "quality_after"].value_counts().to_dict() == {
              "low": 48,
              "high": 3,
              "medium": 2,
          }
          rank = {"": 0, "low": 1, "medium": 2, "high": 3}
          assert not (
              compared["quality_after"].map(rank)
              < compared["quality_before"].map(rank)
          ).any()
          PY

      - name: Run focused tests and lint
        env:
          PYTHONPATH: src:.
        run: |
          pytest -q \
            tests/test_wave50_reproductive_unlock.py \
            tests/test_wave48_reproductive_unlock.py \
            tests/test_wave45_promoted_reproductive_overlay.py \
            --basetemp=.pytest-wave50
          ruff check \
            src/island_v2/wave45_promoted_reproductive_checkpoint.py \
            src/island_v2/wave48_reproductive_checkpoint.py \
            src/island_v2/wave48_incremental_all_evidence.py \
            src/island_v2/wave50_reproductive_checkpoint.py \
            src/island_v2/wave50_incremental_all_evidence.py \
            src/island_v2/wave50_reproductive_overlay.py \
            tests/test_wave50_reproductive_unlock.py

      - name: Upload immutable Wave50 sources, audit, and coverage
        uses: actions/upload-artifact@v4
        with:
          name: wave50-source-grounded-reproductive-unlock-${{ github.run_id }}
          path: |
            wave50-source/**
            wave50-checkpoint/**
            wave50-all-evidence-audit/**
            wave50-trait-coverage/**
          if-no-files-found: error
          retention-days: 90
