name: Build Wave52 support-two reproductive unlock

on:
  pull_request:
    paths:
      - ".github/workflows/build-wave52-support-two-reproductive-unlock.yml"
      - "src/island_v2/wave48_reproductive_checkpoint.py"
      - "src/island_v2/wave52_reproductive_checkpoint.py"
      - "src/island_v2/wave52_incremental_all_evidence.py"
      - "src/island_v2/wave52_reproductive_overlay.py"
      - "tests/test_wave48_reproductive_unlock.py"
      - "tests/test_wave52_support_two_reproductive_unlock.py"
      - "data/v2/staging/traits/wave52_support_two_reproductive_unlock/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-wave52-support-two-reproductive-unlock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAVE33_RUN_ID: "32932103226"
      WAVE33_ARTIFACT: "integrated-trait-coverage-32932103226"
      WAVE33_ARTIFACT_ID: "9593698966"
      WAVE33_ARTIFACT_DIGEST: "sha256:d6405d520414b802fe75b2e450f45b8e74295f95049f20fb7ce61f57471326d1"
      WAVE51_RUN_ID: "33467582475"
      WAVE51_ARTIFACT: "wave51-peperomia-reproductive-unlock-33467582475"
      WAVE51_ARTIFACT_ID: "9785412422"
      WAVE51_ARTIFACT_DIGEST: "sha256:8e7b5da8e92dfefcab78fc99ca7d88555401f53b4435a3b6737b409dfba3eac7"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Verify formal GitHub pins and download Wave51
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view "$WAVE33_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          wave33_metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$WAVE33_ARTIFACT_ID")
          test "$(jq -r .name <<<"$wave33_metadata")" = "$WAVE33_ARTIFACT"
          test "$(jq -r .expired <<<"$wave33_metadata")" = false
          test "$(jq -r .digest <<<"$wave33_metadata")" = "$WAVE33_ARTIFACT_DIGEST"

          test "$(gh run view "$WAVE51_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          wave51_metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$WAVE51_ARTIFACT_ID")
          test "$(jq -r .name <<<"$wave51_metadata")" = "$WAVE51_ARTIFACT"
          test "$(jq -r .expired <<<"$wave51_metadata")" = false
          test "$(jq -r .digest <<<"$wave51_metadata")" = "$WAVE51_ARTIFACT_DIGEST"
          mkdir -p /tmp/wave51
          gh run download "$WAVE51_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$WAVE51_ARTIFACT" --dir /tmp/wave51

          wave51_coverage=$(find /tmp/wave51 -type f -path '*/wave51-trait-coverage/wave51_species_axis_coverage.csv.gz' -print -quit)
          wave51_rules=$(find /tmp/wave51 -type f -path '*/wave51-all-evidence-audit/trait_specific_genus_rule_audit.csv.gz' -print -quit)
          wave51_direct=$(find /tmp/wave51 -type f -path '*/wave51-all-evidence-audit/resolved_direct_species_trait.csv.gz' -print -quit)
          wave51_external=$(find /tmp/wave51 -type f -path '*/wave51-all-evidence-audit/external_congener_resolved_species_trait.csv.gz' -print -quit)
          wave51_conflicts=$(find /tmp/wave51 -type f -path '*/wave51-all-evidence-audit/external_congener_source_lineage_conflicts.csv.gz' -print -quit)
          wave51_low=$(find /tmp/wave51 -type f -path '*/wave51-all-evidence-audit/rebuilt_all_evidence_validated_low.csv.gz' -print -quit)
          for required in "$wave51_coverage" "$wave51_rules" "$wave51_direct" "$wave51_external" "$wave51_conflicts" "$wave51_low"; do test -n "$required"; done
          test "$(sha256sum "$wave51_coverage" | cut -d' ' -f1)" = "09379346a89823014c008ffc888fc8fae16e27d7eef0e6c6322e294dcb936701"
          test "$(sha256sum "$wave51_rules" | cut -d' ' -f1)" = "5aadfafcb107adf91c184daa9870e0fbdbf102d78f4c52c3b223161e154de82a"
          test "$(sha256sum "$wave51_direct" | cut -d' ' -f1)" = "8386e1c72585a9362ad109e250247b145cb9f0fa388c49b6dd579d29c65537d0"
          test "$(sha256sum "$wave51_external" | cut -d' ' -f1)" = "f93943b6b1d23e6d43b61ab793352a9ed35e72a151c5813b9928acd78d5bbcbf"
          test "$(sha256sum "$wave51_conflicts" | cut -d' ' -f1)" = "a8be7dceab223e9ce28ab243e3b80908af0334dae9e3c6941d1290220e61c669"
          test "$(sha256sum "$wave51_low" | cut -d' ' -f1)" = "f86fa48188ea774850568185820d3cdc955bfb8267b271ef141a86aa3473f052"
          echo "WAVE51_COVERAGE=$wave51_coverage" >> "$GITHUB_ENV"
          echo "WAVE51_RULES=$wave51_rules" >> "$GITHUB_ENV"
          echo "WAVE51_DIRECT=$wave51_direct" >> "$GITHUB_ENV"
          echo "WAVE51_EXTERNAL=$wave51_external" >> "$GITHUB_ENV"
          echo "WAVE51_CONFLICTS=$wave51_conflicts" >> "$GITHUB_ENV"
          echo "WAVE51_LOW=$wave51_low" >> "$GITHUB_ENV"

      - name: Retrieve quote-verifiable web sources
        run: |
          set -euo pipefail
          manifest=data/v2/staging/traits/wave52_support_two_reproductive_unlock/source_manifest.json
          mkdir -p wave52-source
          jq -r '.sources[] | [.retrieval_url, .retrieved_filename] | @tsv' "$manifest" |
            while IFS=$'\t' read -r url filename; do
              curl --location --fail --retry 3 --connect-timeout 30 --max-time 600 \
                --user-agent 'island-trait-audit/1.0' "$url" \
                --output "wave52-source/$filename"
            done

      - name: Validate frozen evidence and source receipts
        run: |
          python -m island_v2.wave52_reproductive_checkpoint \
            --packet-dir data/v2/staging/traits/wave52_support_two_reproductive_unlock \
            --target-coverage-csv "$WAVE51_COVERAGE" \
            --retrieved-source-dir wave52-source \
            --output-dir wave52-checkpoint \
            --output-json wave52-checkpoint/wave52_checkpoint_summary.json \
            --expected-species 106295

      - name: Rebuild only touched trait-specific genus rules
        run: |
          python -m island_v2.wave52_incremental_all_evidence \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --ontology-yaml config/trait_ontology.yml \
            --baseline-coverage-csv "$WAVE51_COVERAGE" \
            --previous-rule-audit-csv "$WAVE51_RULES" \
            --previous-resolved-direct-csv "$WAVE51_DIRECT" \
            --previous-external-resolved-csv "$WAVE51_EXTERNAL" \
            --previous-external-conflicts-csv "$WAVE51_CONFLICTS" \
            --previous-rebuilt-low-csv "$WAVE51_LOW" \
            --new-direct-evidence-csv wave52-checkpoint/wave52_reviewed_direct_evidence.csv.gz \
            --new-external-evidence-csv wave52-checkpoint/wave52_external_congener_evidence.csv.gz \
            --output-dir wave52-all-evidence-audit \
            --expected-species 106295

      - name: Build lossless Wave52 overlay
        run: |
          python -m island_v2.wave52_reproductive_overlay \
            --baseline-csv "$WAVE51_COVERAGE" \
            --previous-rule-audit-csv "$WAVE51_RULES" \
            --all-evidence-dir wave52-all-evidence-audit \
            --direct-evidence-csv wave52-checkpoint/wave52_reviewed_direct_evidence.csv.gz \
            --external-evidence-csv wave52-checkpoint/wave52_external_congener_evidence.csv.gz \
            --checkpoint-summary-json wave52-checkpoint/wave52_checkpoint_summary.json \
            --output-dir wave52-trait-coverage \
            --expected-species 106295

      - name: Independently verify exact gain and scientific contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          audit = json.loads(Path("wave52-all-evidence-audit/all_evidence_trait_coverage_summary.json").read_text())
          summary = json.loads(Path("wave52-trait-coverage/wave52_coverage_summary.json").read_text())
          checkpoint = json.loads(Path("wave52-checkpoint/wave52_checkpoint_summary.json").read_text())
          assert checkpoint["baseline_formal_run_id"] == 33467582475
          assert checkpoint["evidence"]["new_direct_species_trait"] == 3
          assert checkpoint["evidence"]["new_direct_unresolved_species_axis"] == 2
          assert checkpoint["evidence"]["completed_direct_axis_enrichments"] == 1
          assert checkpoint["source_binary_coverage"] == {"verified_in_run": 3, "manual_receipt_only": 0}
          assert all(checkpoint["checks"].values()), checkpoint["checks"]
          assert audit["new_eligible_rules"] == [
              "Helichrysum x self_incompatibility",
              "Mammillaria x self_incompatibility",
              "Triumfetta x self_incompatibility",
          ]
          assert audit["new_validated_low_species_trait"] == 261
          assert audit["invalidated_prior_rules"] == []
          assert all(rule["n_direct_species"] == 3 for rule in audit["new_rules"])
          assert all(rule["dominance"] == 1.0 for rule in audit["new_rules"])
          assert all(rule["species_loo_accuracy"] == 1.0 for rule in audit["new_rules"])
          assert all(rule["lineage_loo_accuracy"] == 1.0 for rule in audit["new_rules"])
          assert all(audit["checks"].values()), audit["checks"]
          assert summary["fixed_denominator"] == {"species": 106295, "species_axis": 318885}
          assert summary["delta"]["gross_gain_species_axis"] == 262
          assert summary["delta"]["loss_species_axis"] == 0
          assert summary["delta"]["by_axis_net_gain"] == {
              "floral_structural_complexity": 0,
              "flower_colour": 0,
              "reproductive_assurance": 262,
          }
          assert summary["delta"]["action_counts"] == {
              "direct_enrichment": 1,
              "direct_fill": 2,
              "validated_low_fill": 260,
          }
          assert summary["after"]["filled_species_axis"] == 222326
          assert summary["after"]["unresolved_species_axis"] == 96559
          assert summary["after"]["quality_counts"] == {"high": 55582, "low": 119708, "medium": 47036}
          assert {axis: values["filled_species"] for axis, values in summary["after"]["by_axis"].items()} == {
              "floral_structural_complexity": 91613,
              "flower_colour": 82502,
              "reproductive_assurance": 48211,
          }
          assert summary["after"]["species_by_filled_axis_count"] == {"0": 9431, "1": 14149, "2": 39968, "3": 42747}
          assert summary["remaining_to_campaign_target"] == {
              "floral_structural_complexity": 340,
              "flower_colour": 2534,
              "reproductive_assurance": 15566,
          }
          assert all(summary["checks"].values()), summary["checks"]

          before = pd.read_csv(os.environ["WAVE51_COVERAGE"], dtype=str).fillna("")
          after = pd.read_csv("wave52-trait-coverage/wave52_species_axis_coverage.csv.gz", dtype=str).fillna("")
          compared = before.merge(after, on=["accepted_species", "axis"], suffixes=("_before", "_after"), validate="one_to_one")
          assert len(compared) == 318885
          gained = compared["quality_before"].eq("") & compared["quality_after"].ne("")
          assert int(gained.sum()) == 262
          assert compared.loc[gained, "axis"].eq("reproductive_assurance").all()
          assert compared.loc[gained, "quality_after"].value_counts().to_dict() == {"low": 260, "medium": 2}
          rank = {"": 0, "low": 1, "medium": 2, "high": 3}
          assert not (compared["quality_after"].map(rank) < compared["quality_before"].map(rank)).any()
          enriched = pd.read_csv("wave52-trait-coverage/wave52_change_audit.csv.gz", dtype=str).fillna("")
          assert enriched.loc[enriched["action"].eq("direct_enrichment"), "accepted_species"].tolist() == ["Helichrysum italicum"]
          PY

      - name: Run focused tests and lint
        env:
          PYTHONPATH: src:.
        run: |
          pytest -q tests/test_wave52_support_two_reproductive_unlock.py tests/test_wave51_peperomia_reproductive_unlock.py tests/test_wave48_reproductive_unlock.py --basetemp=.pytest-wave52
          ruff check src/island_v2/wave48_reproductive_checkpoint.py src/island_v2/wave52_reproductive_checkpoint.py src/island_v2/wave52_incremental_all_evidence.py src/island_v2/wave52_reproductive_overlay.py tests/test_wave48_reproductive_unlock.py tests/test_wave52_support_two_reproductive_unlock.py

      - name: Upload immutable Wave52 receipts, audit, and coverage
        uses: actions/upload-artifact@v4
        with:
          name: wave52-support-two-reproductive-unlock-${{ github.run_id }}
          path: |
            wave52-source/**
            wave52-checkpoint/**
            wave52-all-evidence-audit/**
            wave52-trait-coverage/**
          if-no-files-found: error
          retention-days: 90
