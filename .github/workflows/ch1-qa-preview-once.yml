name: One-shot Chapter 1 review visual QA preview

on:
  push:
    branches: [submission/chapter1-reviewpack-20261112]
    paths: [".github/workflows/ch1-qa-preview-once.yml"]

permissions:
  contents: write
  actions: read

jobs:
  qa-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Bring approved CI-generated review page previews to branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-qa
          gh run download 43213985261 -n chapter1-review-qa-43213985261 -D /tmp/ch1-qa
          for f in QA_Manuscript_FirstPage.png QA_Manuscript_LastPage.png QA_SI_FirstPage.png; do
            test -s "/tmp/ch1-qa/$f"
          done
          mkdir -p submission/chapter1_current/_qa_temporary
          cp /tmp/ch1-qa/*.png submission/chapter1_current/_qa_temporary/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/chapter1_current/_qa_temporary
          git commit -m "qa(ch1): temporary document previews for visual audit"
          git push origin HEAD:submission/chapter1-reviewpack-20261112
