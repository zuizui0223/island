name: Temporary first-page review QA

on:
  push:
    branches: [submission/chapter1-reviewpack-20261112]
    paths: [".github/workflows/ch1-qa-preview-once.yml"]

permissions:
  contents: write
  actions: read

jobs:
  qa-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy review QA previews for visual audit
        run: |
          set -euo pipefail
          mkdir -p /tmp/qa
          gh run download 43214515134 -n chapter1-review-qa-43214515134 -D /tmp/qa
          mkdir -p submission/chapter1_current/_qa_temporary
          cp /tmp/qa/QA_Manuscript_FirstPage.png /tmp/qa/QA_SI_FirstPage.png submission/chapter1_current/_qa_temporary/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/chapter1_current/_qa_temporary
          git commit -m "qa(ch1): revised first-page visual previews"
          git push origin HEAD:submission/chapter1-reviewpack-20261112
