name: Result input provenance
on:
  pull_request:
    paths:
      - 'research/result_input_provenance_20261125.json'
      - 'scripts/check_result_input_provenance.py'
      - 'tests/test_result_input_provenance.py'
      - '.github/workflows/check-result-input-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: python scripts/check_result_input_provenance.py
      - run: python -m pytest tests/test_result_input_provenance.py -q
