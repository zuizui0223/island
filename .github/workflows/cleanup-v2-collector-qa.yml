name: cleanup_v2_collector_qa

on:
  push:
    branches: [codex/v2-gbif-collector-hardening]
    paths:
      - "config/run_v2_collector_cleanup.json"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'clean v2 collector QA byproducts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated bytecode and install ignore rules
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          EOF
          git rm -r --ignore-unmatch src/island_v2/__pycache__ tests/__pycache__
          git rm config/run_v2_collector_cleanup.json .github/workflows/cleanup-v2-collector-qa.yml
          git add .gitignore
          git commit -m "chore: remove generated collector QA bytecode"
          git push
