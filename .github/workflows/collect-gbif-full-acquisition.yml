name: collect_gbif_full_acquisition

# Stage 3: manual GBIF exact-island collection. Automatic cron and self-chain
# dispatch are disabled so the workflow only runs when explicitly dispatched.
on:
  workflow_dispatch:
    inputs:
      max_blocks:
        description: "Succeeded GBIF blocks to process in this run."
        required: false
        default: "1"
  push:
    branches: [main]
    paths:
      - "config/gbif_collection_trigger.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: gbif-collect
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.head_commit.message == 'run GBIF collection')
    runs-on: ubuntu-latest
    env:
      FROZEN_ARTIFACT_ID: "8066083419"
      FROZEN_ARTIFACT_SHA256: "bee33e14672ec7ff4ed1f7acaea36b32cc6170a45c3d14b2caeb5f43bfaa623b"
      MAX_BLOCKS: ${{ inputs.max_blocks || '1' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record collected count before this run
        id: prior
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p = "data/v2/staging/gbif/collected/collection_status.json"
          n = json.load(open(p)).get("n_collected_succeeded_blocks", 0) if os.path.exists(p) else 0
          print(f"collected={n}")
          PY
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test collection logic
        run: pytest -q tests/test_gbif_collect.py tests/test_gbif_collect_incremental.py
      - name: Fetch and verify frozen island universe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen data/v2/external/islands/frozen_pilot
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ARTIFACT_ID}/zip" \
            --output /tmp/frozen.zip
          actual="$(sha256sum /tmp/frozen.zip | awk '{print $1}')"
          test "$actual" = "$FROZEN_ARTIFACT_SHA256" || { echo "Frozen artifact digest mismatch: $actual" >&2; exit 2; }
          unzip -q /tmp/frozen.zip -d /tmp/frozen
          cp /tmp/frozen/islands/gshhg/prepared/islands_v2.gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg
      - name: Regenerate block members from the frozen universe
        run: |
          island-v2-gbif-blocks prepare \
            --islands-gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg \
            --output-dir data/v2/external/gbif/full \
            --taxon-name Tracheophyta \
            --taxon-rank PHYLUM \
            --target-scope angiosperms \
            --grid-degrees 30 \
            --max-wkt-chars 120000 \
            --max-islands-per-block 125 \
            --query-buffer-m 2000 \
            --query-simplify-m 500
      - name: Cache downloaded GBIF block archives
        uses: actions/cache@v4
        with:
          path: data/v2/staging/gbif/archives
          key: gbif-archives-${{ hashFiles('config/gbif_full_acquisition_v2.json') }}
          restore-keys: |
            gbif-archives-
      - name: Collect resumable exact-island batch
        run: |
          echo "Before collection:"; date -u; free -h
          island-v2-gbif-collect collect \
            --campaign-json config/gbif_full_acquisition_v2.json \
            --block-members-csv data/v2/external/gbif/full/gbif_block_members.csv \
            --islands-gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg \
            --download-dir data/v2/staging/gbif/archives \
            --output-dir data/v2/staging/gbif/collected \
            --max-blocks "$MAX_BLOCKS" \
            --chunksize 50000
          echo "After collection:"; date -u; free -h
      - name: Commit cumulative collection outputs
        if: always()
        run: |
          set -euo pipefail
          outputs=(
            data/v2/staging/gbif/collected/island_species_occurrences.csv.gz
            data/v2/staging/gbif/collected/island_observation_effort.csv
            data/v2/staging/gbif/collected/island_taxa.csv
            data/v2/staging/gbif/collected/collection_manifest.csv
            data/v2/staging/gbif/collected/collection_status.json
          )
          existing=()
          for path in "${outputs[@]}"; do
            if [ -f "$path" ]; then existing+=("$path"); fi
          done
          [ "${#existing[@]}" -gt 0 ] || exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Include removal of the legacy uncompressed snapshot in the same commit.
          git add -A -- data/v2/staging/gbif/collected
          git diff --cached --quiet && exit 0
          git commit -m "chore: update GBIF island-level collection outputs"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "Could not push GBIF outputs after five retries." >&2
          exit 1
      - name: Self-chain disabled
        if: success()
        run: |
          echo "GBIF self-chain dispatch is disabled. Use workflow_dispatch manually if more blocks are needed."
      - name: Summarize collection
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          status_path = Path('data/v2/staging/gbif/collected/collection_status.json')
          print('## GBIF collection status')
          if status_path.exists():
              for key, value in json.loads(status_path.read_text(encoding='utf-8')).items():
                  print(f"- {key}: {value}")
          else:
              print('- No collection output produced yet.')
          PY
      - name: Upload collection outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-collection-${{ github.run_id }}
          path: data/v2/staging/gbif/collected/
          if-no-files-found: warn
          retention-days: 90
