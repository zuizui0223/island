name: collect_gbif_full_acquisition

# Stage 3 of the reproducible pipeline: take blocks the poll workflow has marked
# `succeeded`, download their SIMPLE_CSV archives, and assign every occurrence
# coordinate back to the original exact island polygon (never the buffered query
# catchment). Runs read-only against GBIF's public download archives, so it needs
# no credentials. Re-running preserves a block-level archive/assignment audit.
on:
  workflow_dispatch:
  schedule:
    # Collection is intentionally less frequent than status polling; it can be
    # manually dispatched after a large batch of GBIF archives completes.
    - cron: "41 */6 * * *"
  push:
    branches: [main]
    paths:
      - "config/gbif_collection_trigger.json"

permissions:
  contents: write

concurrency:
  group: gbif-collect
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.event.head_commit.message == 'run GBIF collection')
    runs-on: ubuntu-latest
    env:
      FROZEN_ARTIFACT_ID: "8066083419"
      FROZEN_ARTIFACT_SHA256: "bee33e14672ec7ff4ed1f7acaea36b32cc6170a45c3d14b2caeb5f43bfaa623b"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test collect assignment logic
        run: pytest -q tests/test_gbif_collect.py
      - name: Fetch and verify frozen island universe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen data/v2/external/islands/frozen_pilot
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ARTIFACT_ID}/zip" \
            --output /tmp/frozen.zip
          actual="$(sha256sum /tmp/frozen.zip | awk '{print $1}')"
          test "$actual" = "$FROZEN_ARTIFACT_SHA256" || { echo "Frozen artifact digest mismatch: $actual" >&2; exit 2; }
          unzip -q /tmp/frozen.zip -d /tmp/frozen
          cp /tmp/frozen/islands/gshhg/prepared/islands_v2.gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg
      - name: Regenerate block members from the frozen universe
        run: |
          island-v2-gbif-blocks prepare \
            --islands-gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg \
            --output-dir data/v2/external/gbif/full \
            --taxon-name Tracheophyta \
            --taxon-rank PHYLUM \
            --target-scope angiosperms \
            --grid-degrees 30 \
            --max-wkt-chars 120000 \
            --max-islands-per-block 125 \
            --query-buffer-m 2000 \
            --query-simplify-m 500
      - name: Cache downloaded GBIF block archives
        uses: actions/cache@v4
        with:
          path: data/v2/staging/gbif/archives
          key: gbif-archives-${{ hashFiles('config/gbif_full_acquisition_v2.json') }}
          restore-keys: |
            gbif-archives-
      - name: Collect succeeded blocks into exact-island occurrences
        run: |
          island-v2-gbif-collect collect \
            --campaign-json config/gbif_full_acquisition_v2.json \
            --block-members-csv data/v2/external/gbif/full/gbif_block_members.csv \
            --islands-gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg \
            --download-dir data/v2/staging/gbif/archives \
            --output-dir data/v2/staging/gbif/collected \
            --chunksize 250000
      - name: Commit island-level collection outputs and block audit
        if: always()
        run: |
          python - <<'PY'
          import subprocess
          import time
          from pathlib import Path
          outputs = [
              'data/v2/staging/gbif/collected/island_species_occurrences.csv',
              'data/v2/staging/gbif/collected/island_observation_effort.csv',
              'data/v2/staging/gbif/collected/island_taxa.csv',
              'data/v2/staging/gbif/collected/collection_manifest.csv',
              'data/v2/staging/gbif/collected/collection_status.json',
          ]
          if not any(Path(path).exists() for path in outputs):
              raise SystemExit(0)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)

          def commit_and_push() -> bool:
              """Commit the collection outputs onto the freshest main, then push.

              submit/poll push to main every few minutes while the campaign
              drains, so a plain `git pull --rebase` here loses the race and
              aborts the whole collect run (leaving no committed output). The
              outputs are untracked, so `git reset --hard origin/main` preserves
              them and lets us re-commit cleanly on top of whatever just landed --
              the same conflict-proof pattern used by submit and poll.
              """
              present = [path for path in outputs if Path(path).exists()]
              if not present:
                  return True
              subprocess.run(['git', 'add', *present], check=True)
              if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
                  return True
              subprocess.run(['git', 'commit', '-m', 'chore: update GBIF island-level collection outputs'], check=True)
              return subprocess.run(['git', 'push']).returncode == 0

          for attempt in range(6):
              subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
              subprocess.run(['git', 'reset', '--hard', 'origin/main'], check=True)
              if commit_and_push():
                  break
              time.sleep(2 ** attempt)
          else:
              raise SystemExit('Could not push collection outputs after repeated retries')
          PY
      - name: Summarize collection
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          status_path = Path('data/v2/staging/gbif/collected/collection_status.json')
          print('## GBIF collection status')
          if status_path.exists():
              status = json.loads(status_path.read_text(encoding='utf-8'))
              for key, value in status.items():
                  print(f"- {key}: {value}")
          else:
              print('- No collection output produced yet.')
          PY
      - name: Upload collection outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-collection-${{ github.run_id }}
          path: data/v2/staging/gbif/collected/
          if-no-files-found: warn
          retention-days: 90
