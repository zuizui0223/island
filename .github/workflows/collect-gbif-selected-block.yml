name: collect_gbif_selected_block

# Operational override for one already-succeeded GBIF block. The supplied
# rationale must be geographic/source-region coverage only; this workflow does
# not accept or inspect traits, pollinator records, reproduction, or model results.
on:
  workflow_dispatch:
    inputs:
      block_id:
        description: "Exact succeeded and uncollected GBIF block ID."
        required: true
        type: string
      selection_rationale:
        description: "Predeclared geographic/source-region coverage rationale; not trait/outcome based."
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "config/gbif_selected_collection_request_001.json"

permissions:
  contents: write

concurrency:
  group: gbif-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FROZEN_ARTIFACT_ID: "8066083419"
      FROZEN_ARTIFACT_SHA256: "bee33e14672ec7ff4ed1f7acaea36b32cc6170a45c3d14b2caeb5f43bfaa623b"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test selected-block collection guard
        run: pytest -q tests/test_gbif_collect.py tests/test_gbif_collect_incremental.py tests/test_gbif_collect_selected.py
      - name: Resolve selected block request
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "SELECTED_BLOCK_ID=${{ inputs.block_id }}"
              echo "SELECTED_RATIONALE=${{ inputs.selection_rationale }}"
            } >> "$GITHUB_ENV"
          else
            python - <<'PY' >> "$GITHUB_ENV"
            import json
            from pathlib import Path
            request = json.loads(Path('config/gbif_selected_collection_request_001.json').read_text(encoding='utf-8'))
            assert request['rationale_category'] == 'geographic_source_region_coverage'
            print(f"SELECTED_BLOCK_ID={request['block_id']}")
            print(f"SELECTED_RATIONALE={request['selection_rationale']}")
            PY
          fi
      - name: Fetch and verify frozen island universe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen data/v2/external/islands/frozen_pilot
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ARTIFACT_ID}/zip" \
            --output /tmp/frozen.zip
          actual="$(sha256sum /tmp/frozen.zip | awk '{print $1}')"
          test "$actual" = "$FROZEN_ARTIFACT_SHA256" || { echo "Frozen artifact digest mismatch: $actual" >&2; exit 2; }
          unzip -q /tmp/frozen.zip -d /tmp/frozen
          cp /tmp/frozen/islands/gshhg/prepared/islands_v2.gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg
      - name: Regenerate block members from frozen universe
        run: |
          island-v2-gbif-blocks prepare \
            --islands-gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg \
            --output-dir data/v2/external/gbif/full \
            --taxon-name Tracheophyta \
            --taxon-rank PHYLUM \
            --target-scope angiosperms \
            --grid-degrees 30 \
            --max-wkt-chars 120000 \
            --max-islands-per-block 125 \
            --query-buffer-m 2000 \
            --query-simplify-m 500
      - name: Cache downloaded GBIF block archives
        uses: actions/cache@v4
        with:
          path: data/v2/staging/gbif/archives
          key: gbif-archives-${{ hashFiles('config/gbif_full_acquisition_v2.json') }}
          restore-keys: |
            gbif-archives-
      - name: Collect selected exact-island block
        run: |
          python -m island_v2.gbif_collect_selected collect \
            --campaign-json config/gbif_full_acquisition_v2.json \
            --block-members-csv data/v2/external/gbif/full/gbif_block_members.csv \
            --islands-gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg \
            --download-dir data/v2/staging/gbif/archives \
            --output-dir data/v2/staging/gbif/collected \
            --block-id "$SELECTED_BLOCK_ID" \
            --selection-rationale "$SELECTED_RATIONALE" \
            --chunksize 250000
      - name: Commit cumulative collection outputs
        if: always()
        run: |
          set -euo pipefail
          outputs=(
            data/v2/staging/gbif/collected/island_species_occurrences.csv
            data/v2/staging/gbif/collected/island_observation_effort.csv
            data/v2/staging/gbif/collected/island_taxa.csv
            data/v2/staging/gbif/collected/collection_manifest.csv
            data/v2/staging/gbif/collected/collection_status.json
          )
          existing=()
          for path in "${outputs[@]}"; do
            if [ -f "$path" ]; then existing+=("$path"); fi
          done
          [ "${#existing[@]}" -gt 0 ] || exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${existing[@]}"
          git diff --cached --quiet && exit 0
          git commit -m "chore: update GBIF island-level collection outputs"

          # A long-running collection can finish while an unrelated commit lands on
          # main. Rebase and retry the push so an ordinary non-fast-forward race does
          # not discard a completed collection. Stop on a genuine data conflict.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Could not rebase GBIF outputs onto current main; preserving the run artifact for manual conflict resolution." >&2
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Pushed GBIF outputs on attempt ${attempt}."
              exit 0
            fi
            echo "main changed during push attempt ${attempt}; retrying." >&2
            sleep "$((attempt * 2))"
          done
          echo "Could not push GBIF outputs after five concurrent-main retries." >&2
          exit 1
      - name: Summarize selected collection
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          status_path = Path('data/v2/staging/gbif/collected/collection_status.json')
          print('## Explicit succeeded-block collection')
          if status_path.exists():
              for key, value in json.loads(status_path.read_text(encoding='utf-8')).items():
                  print(f"- {key}: {value}")
          else:
              print('- No collection output produced yet.')
          PY
      - name: Upload collection outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-gbif-collection-${{ github.run_id }}
          path: data/v2/staging/gbif/collected/
          if-no-files-found: warn
          retention-days: 90
