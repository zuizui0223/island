name: collect_validation_pilot_globi_evidence

# Stage-1C: bounded GloBI interaction evidence for the validation pilot. Explicit
# flower-visit / pollination claims only; missing records are not absence and
# visitor records are not effectiveness.
on:
  workflow_dispatch:
    inputs:
      taxa_csv:
        description: "Repository path to the pilot species CSV."
        required: false
        default: "data/v2/staging/traits/validation_pilot/validation_pilot_species.csv"
        type: string
      max_taxa:
        description: "Bounded number of taxa to query (<= 100)."
        required: false
        default: "50"
        type: string
      pause_seconds:
        description: "Pause between GloBI query calls."
        required: false
        default: "0.2"
        type: string

permissions:
  contents: read

concurrency:
  group: validation-pilot-globi-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test interaction-evidence boundaries
        run: pytest -q tests/test_interaction_evidence.py
      - name: Verify pilot input exists
        run: test -f "${{ inputs.taxa_csv }}"
      - name: Collect explicit GloBI interaction evidence
        run: |
          python -m island_v2.interaction_evidence collect \
            --taxa-csv "${{ inputs.taxa_csv }}" \
            --output-dir /tmp/globi_interaction_evidence \
            --max-taxa "${{ inputs.max_taxa }}" \
            --pause-seconds "${{ inputs.pause_seconds }}"
      - name: Summarize GloBI evidence subset
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/globi_interaction_evidence/globi_interaction_evidence_summary.json').read_text())
          print('## Validation-pilot GloBI interaction evidence')
          for key, value in report.items():
              print(f'- {key}: {value}')
          print('- decision boundary: explicit interaction claims only; no guild/effectiveness/absence inference')
          PY
      - name: Upload GloBI interaction evidence
        uses: actions/upload-artifact@v4
        with:
          name: validation-pilot-globi-evidence-${{ github.run_id }}
          path: /tmp/globi_interaction_evidence/
          if-no-files-found: error
          retention-days: 90
