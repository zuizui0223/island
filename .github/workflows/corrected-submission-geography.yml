name: Corrected submission geography
on:
  push:
    branches: [main, 'fix/geography-distance-*']
    paths: ['src/island_v2/gshhg_source.py', 'src/island_v2/spherical_coast_distance.py', 'src/island_v2/corrected_submission.py', 'scripts/geography_correction/**', 'results/geography_20260924/**', 'config/chapter1_submission_current.json', 'submission/chapter1_current/**', 'README.md', 'docs/PAPER_PIPELINE.md', 'docs/DATABASE_BUILD.md', 'docs/CHAPTER1_HISTORY.md', 'docs/chapter1_manuscript_full_v14_reordered_hypotheses_20260918.md', 'docs/chapter1_submission_freeze_v14_20260918.md', 'docs/chapter1_manuscript_full_v13_global_pollination_constraint_20260917.md', 'docs/chapter1_submission_freeze_v13_20260917.md', 'tests/test_gshhg.py', 'tests/test_spherical_coast_distance.py', 'tests/test_corrected_submission.py', 'tests/test_chapter1_submission_surface.py', 'tests/test_chapter1_historical_workflows_manual_only.py', '.github/workflows/*chapter1-v*.yml', '.github/workflows/corrected-submission-geography.yml']
  pull_request:
    paths: ['src/island_v2/gshhg_source.py', 'src/island_v2/spherical_coast_distance.py', 'src/island_v2/corrected_submission.py', 'scripts/geography_correction/**', 'results/geography_20260924/**', 'config/chapter1_submission_current.json', 'submission/chapter1_current/**', 'README.md', 'docs/PAPER_PIPELINE.md', 'docs/DATABASE_BUILD.md', 'docs/CHAPTER1_HISTORY.md', 'docs/chapter1_manuscript_full_v14_reordered_hypotheses_20260918.md', 'docs/chapter1_submission_freeze_v14_20260918.md', 'docs/chapter1_manuscript_full_v13_global_pollination_constraint_20260917.md', 'docs/chapter1_submission_freeze_v13_20260917.md', 'tests/test_gshhg.py', 'tests/test_spherical_coast_distance.py', 'tests/test_corrected_submission.py', 'tests/test_chapter1_submission_surface.py', '.github/workflows/corrected-submission-geography.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e . pytest ruff
      - run: ruff check src/island_v2/gshhg_source.py src/island_v2/spherical_coast_distance.py src/island_v2/corrected_submission.py scripts/geography_correction tests/test_gshhg.py tests/test_spherical_coast_distance.py tests/test_corrected_submission.py tests/test_chapter1_submission_surface.py tests/test_chapter1_historical_workflows_manual_only.py
      - run: pytest tests/test_gshhg.py tests/test_spherical_coast_distance.py tests/test_corrected_submission.py tests/test_chapter1_submission_surface.py tests/test_chapter1_historical_workflows_manual_only.py -q
