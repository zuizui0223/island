name: Delete verified merged Chapter 1 cleanup branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-verified-chapter1-cleanup-branches.yml"

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only verified merged cleanup branches
        env:
          KEEP_BRANCH: cleanup/chapter1-retire-remaining-auto-20260926
        run: |
          set -euo pipefail

          branches=(
            "cleanup/chapter1-banner-remaining-historical-docs-20260927"
            "cleanup/chapter1-corrected-surface"
            "cleanup/chapter1-current-20260925"
            "cleanup/chapter1-current-science-20260926"
            "cleanup/chapter1-dynamic-historical-runner-guard-20260927"
            "cleanup/chapter1-final-history-marking"
            "cleanup/chapter1-historical-workflows"
            "cleanup/chapter1-normalize-final-historical-preflight-20260926"
            "cleanup/chapter1-pre-v13-figure-workflows"
            "cleanup/chapter1-remove-legacy-current-wording-20260927"
            "cleanup/chapter1-remove-stale-canonical-labels-20260926"
            "cleanup/chapter1-retire-database-analysis-dispatch-20260927"
            "cleanup/chapter1-retire-final-auto-workflows"
            "cleanup/chapter1-retire-old-analysis-20260926"
            "cleanup/chapter1-retire-remaining-nee-runners-20260926"
          )

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "$KEEP_BRANCH" ]]; then
              echo "Refusing to delete protected branch: $branch" >&2
              exit 1
            fi

            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

          if ! git ls-remote --exit-code --heads origin "refs/heads/$KEEP_BRANCH" >/dev/null 2>&1; then
            echo "Protected branch is missing: $KEEP_BRANCH" >&2
            exit 1
          fi

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deletion verification failed: $branch still exists" >&2
              exit 1
            fi
          done

          echo "Verified: 15 merged cleanup branches deleted."
          echo "Verified preserved: $KEEP_BRANCH"
