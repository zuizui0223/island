name: diagnose_bombus_score_lint

on:
  push:
    branches:
      - agent/bombus-channel-continuous-score

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Capture lint output
        run: |
          set +e
          ruff check src/island_v2/bombus_channel_score.py src/island_v2/bombus_niche_hypervolume.py tests/test_bombus_channel_score.py tests/test_bombus_niche_hypervolume.py --output-format=concise > ruff-output.txt 2>&1
          cat ruff-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: bombus-score-ruff-output
          path: ruff-output.txt
          if-no-files-found: error
