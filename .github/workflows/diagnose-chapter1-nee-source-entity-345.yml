name: Diagnose Chapter 1 NEE source entity 345

on:
  push:
    branches:
      - "nee/source-positive-scan-run"
    paths:
      - ".github/workflows/diagnose-chapter1-nee-source-entity-345.yml"

permissions:
  contents: read

jobs:
  diagnose-entity-345:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify exact component polygons avoid whole-MultiPolygon HTTP 400
        run: |
          python - <<'PY'
          import httpx
          from shapely.geometry import shape
          from island_v2.gbif_blocks import canonical_gbif_polygon, resolve_query_taxon, stable_wkt

          entity='345'
          gift=f'https://gift.uni-goettingen.de/geojson/geojson_smaller3.2/{entity}.geojson'
          with httpx.Client(timeout=90, follow_redirects=True) as client:
              r=client.get(gift)
              r.raise_for_status()
              geom=canonical_gbif_polygon(shape(r.json()['features'][0]['geometry']))
              whole=stable_wkt(geom)
              parts=list(geom.geoms) if geom.geom_type == 'MultiPolygon' else [geom]
              print('whole_wkt_chars',len(whole),'n_parts',len(parts))
              resolved=resolve_query_taxon(client,'Bombus','GENUS',None,None)
              key=str(resolved['usage_key'])
              whole_req=client.build_request(
                  'GET','https://api.gbif.org/v1/occurrence/search',
                  params={'taxon_key':key,'geometry':whole,'has_coordinate':'true','limit':1,'offset':0},
              )
              whole_resp=client.send(whole_req)
              print('whole_status',whole_resp.status_code,'whole_url_chars',len(str(whole_req.url)))
              assert whole_resp.status_code == 400

              statuses=[]
              for index,part in enumerate(parts[:10],start=1):
                  wkt=stable_wkt(part)
                  req=client.build_request(
                      'GET','https://api.gbif.org/v1/occurrence/search',
                      params={'taxon_key':key,'geometry':wkt,'has_coordinate':'true','limit':1,'offset':0},
                  )
                  resp=client.send(req)
                  statuses.append(resp.status_code)
                  print('part',index,'wkt_chars',len(wkt),'url_chars',len(str(req.url)),'status',resp.status_code)
              assert statuses and all(status == 200 for status in statuses), statuses
              print('component_query_strategy_validated=true')
          PY
