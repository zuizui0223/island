name: diagnose_multilingual_recovery_tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/multilingual_wikimedia_recovery.py"
      - "tests/test_multilingual_wikimedia_recovery.py"
      - ".github/workflows/diagnose-multilingual-recovery-tests.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run focused tests and preserve output
        run: |
          set +e
          pytest -vv tests/test_multilingual_wikimedia_recovery.py \
            --junitxml=/tmp/recovery-tests.xml \
            2>&1 | tee /tmp/recovery-tests.txt
          echo "${PIPESTATUS[0]}" > /tmp/recovery-tests-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: multilingual-recovery-tests-${{ github.run_id }}
          path: |
            /tmp/recovery-tests.xml
            /tmp/recovery-tests.txt
            /tmp/recovery-tests-exit.txt
          if-no-files-found: error
          retention-days: 7
