name: diagnose_multilingual_recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/multilingual_wikimedia_recovery.py"
      - "tests/test_multilingual_wikimedia_recovery.py"
      - ".github/workflows/diagnose-multilingual-recovery.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Capture diagnostics
        run: |
          ruff check \
            src/island_v2/multilingual_wikimedia_recovery.py \
            tests/test_multilingual_wikimedia_recovery.py \
            --output-format json > /tmp/ruff-diagnostics.json || true
          cat /tmp/ruff-diagnostics.json
      - uses: actions/upload-artifact@v4
        with:
          name: multilingual-recovery-ruff-${{ github.run_id }}
          path: /tmp/ruff-diagnostics.json
          if-no-files-found: error
          retention-days: 7
