name: diagnose_v1_category_traits

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-v1-category-traits.yml"
      - "src/island_v2/v1_category_traits.py"
      - "tests/test_v1_category_traits.py"
      - "config/v1_category_trait_prompt.txt"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Capture each validation command
        run: |
          set +e
          pytest -vv tests/test_v1_category_traits.py \
            > /tmp/pytest.txt 2>&1
          echo "$?" > /tmp/pytest.exit
          island-v2-v1-category-traits --help \
            > /tmp/cli.txt 2>&1
          echo "$?" > /tmp/cli.exit
          python scripts/validate_workflows.py \
            > /tmp/workflows.txt 2>&1
          echo "$?" > /tmp/workflows.exit
          ruff check \
            src/island_v2/v1_category_traits.py \
            tests/test_v1_category_traits.py \
            > /tmp/ruff.txt 2>&1
          echo "$?" > /tmp/ruff.exit
          cat /tmp/*.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: v1-category-diagnostics-${{ github.run_id }}
          path: |
            /tmp/pytest.txt
            /tmp/pytest.exit
            /tmp/cli.txt
            /tmp/cli.exit
            /tmp/workflows.txt
            /tmp/workflows.exit
            /tmp/ruff.txt
            /tmp/ruff.exit
          if-no-files-found: error
          retention-days: 7
