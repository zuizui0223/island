name: discover_core_pilot_trait_sources

# Free, post-nomination source discovery. It uses public OpenAlex/Crossref/
# Unpaywall endpoints and optional public PDFs only. It never calls an LLM or
# writes trait values, establishment decisions, applicability, or analysis flags.
on:
  workflow_dispatch:
    inputs:
      island_id:
        description: "Nominated Core-pilot island ID."
        required: true
        type: string
      staged_taxa_csv:
        description: "Repository path to one-island staged taxa CSV."
        required: true
        type: string
      nomination_report:
        description: "Repository path to core_pilot_nomination_report.json."
        required: true
        type: string
      contact_email:
        description: "Contact email for OpenAlex/Unpaywall polite pools; not stored in outputs."
        required: true
        type: string
      max_taxa:
        description: "Bounded number of staged taxa."
        required: false
        default: "5"
        type: string
      max_pdfs:
        description: "Bounded number of declared public PDFs to page-locate."
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: core-pilot-trait-source-discovery-${{ inputs.island_id }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test source-discovery and PDF locator boundaries
        run: pytest -q tests/test_trait_source_discovery.py tests/test_trait_source_discovery_guarded.py tests/test_trait_pdf_locator.py
      - name: Verify declared post-nomination inputs
        run: |
          set -euo pipefail
          test -f "${{ inputs.staged_taxa_csv }}"
          test -f "${{ inputs.nomination_report }}"
      - name: Discover unreviewed literature and public-access leads
        run: |
          python -m island_v2.trait_source_discovery_guarded discover \
            --staged-taxa-csv "${{ inputs.staged_taxa_csv }}" \
            --nomination-report "${{ inputs.nomination_report }}" \
            --island-id "${{ inputs.island_id }}" \
            --contact-email "${{ inputs.contact_email }}" \
            --output-dir /tmp/trait_source_discovery \
            --max-taxa "${{ inputs.max_taxa }}" \
            --max-seeds-per-taxon 5
      - name: Locate public-PDF candidate pages without retaining PDFs
        run: |
          python -m island_v2.trait_pdf_locator locate-pages \
            --leads-csv /tmp/trait_source_discovery/trait_source_leads.csv \
            --output-csv /tmp/trait_source_discovery/trait_pdf_page_locators.csv \
            --max-pdfs "${{ inputs.max_pdfs }}"
      - name: Summarize non-curated source discovery
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/trait_source_discovery/trait_source_discovery_report.json').read_text())
          print('## Core-pilot trait source discovery')
          for key, value in report.items():
              if key != 'lookup_errors':
                  print(f'- {key}: {value}')
          print('- trait status: unreviewed M0 literature/access leads only')
          print('- PDFs retained: none; artifact contains only source rows and page locator metadata')
          PY
      - name: Upload source leads and page locators
        uses: actions/upload-artifact@v4
        with:
          name: core-pilot-trait-source-discovery-${{ github.run_id }}
          path: /tmp/trait_source_discovery/
          if-no-files-found: error
          retention-days: 90
