name: discover_validation_pilot_trait_sources

# Free, cross-family source discovery for the stratified trait-evidence VALIDATION
# PILOT (Stage 6). It spans many islands, so unlike the per-island Core-pilot
# discovery it is not gated on a single-island nomination. It uses public
# OpenAlex/Crossref/Unpaywall endpoints only, never calls an LLM, and writes
# unreviewed literature/access leads only -- no trait value, native/establishment
# status, Bombus applicability, or analysis flag is decided.
on:
  workflow_dispatch:
    inputs:
      pilot_csv:
        description: "Repository path to the validation-pilot species CSV."
        required: false
        default: "data/v2/staging/traits/validation_pilot/validation_pilot_species.csv"
        type: string
      contact_email:
        description: "Contact email for OpenAlex/Unpaywall polite pools; not stored in outputs."
        required: true
        type: string
      max_taxa:
        description: "Bounded number of pilot taxa to query (<= 50)."
        required: false
        default: "50"
        type: string
      max_seeds_per_taxon:
        description: "Bounded seeds per trait group per API."
        required: false
        default: "5"
        type: string
      max_pdfs:
        description: "Bounded number of declared public PDFs to page-locate."
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: validation-pilot-trait-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test source-discovery boundaries
        run: pytest -q tests/test_trait_source_discovery.py tests/test_trait_source_discovery_guarded.py tests/test_trait_pdf_locator.py
      - name: Verify pilot input exists
        run: test -f "${{ inputs.pilot_csv }}"
      - name: Discover unreviewed validation-pilot literature and access leads
        run: |
          python -m island_v2.trait_source_discovery_guarded discover-pilot \
            --pilot-csv "${{ inputs.pilot_csv }}" \
            --contact-email "${{ inputs.contact_email }}" \
            --output-dir /tmp/validation_pilot_discovery \
            --max-taxa "${{ inputs.max_taxa }}" \
            --max-seeds-per-taxon "${{ inputs.max_seeds_per_taxon }}"
      - name: Locate public-PDF candidate pages without retaining PDFs
        run: |
          python -m island_v2.trait_pdf_locator locate-pages \
            --leads-csv /tmp/validation_pilot_discovery/trait_source_leads.csv \
            --output-csv /tmp/validation_pilot_discovery/trait_pdf_page_locators.csv \
            --max-pdfs "${{ inputs.max_pdfs }}"
      - name: Summarize non-curated validation-pilot discovery
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/validation_pilot_discovery/validation_pilot_source_discovery_report.json').read_text())
          print('## Validation-pilot trait source discovery')
          for key, value in report.items():
              if key != 'lookup_errors':
                  print(f'- {key}: {value}')
          print('- trait status: unreviewed M0/M1/M2 literature/access leads only')
          print('- PDFs retained: none; artifact contains only source rows and page-locator metadata')
          PY
      - name: Upload validation-pilot source leads and page locators
        uses: actions/upload-artifact@v4
        with:
          name: validation-pilot-trait-source-discovery-${{ github.run_id }}
          path: /tmp/validation_pilot_discovery/
          if-no-files-found: error
          retention-days: 90
