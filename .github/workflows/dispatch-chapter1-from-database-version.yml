name: Historical replay — Validate Chapter 1 database version (analysis dispatch retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate frozen Database 1.0 manifest
        run: >-
          python -m island_v2.chapter1_database_manifest validate
          --manifest config/chapter1_database_versions/current.yml
      - name: Confirm scientific analysis dispatch is retired
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/island_v2/chapter1_database_manifest.py').read_text()
          assert 'run-chapter1-progressive-trait-analysis.yml' not in text
          assert 'database manifests are provenance-only' in text
          print('Database manifest validation remains available; scientific analysis dispatch is retired.')
          PY
