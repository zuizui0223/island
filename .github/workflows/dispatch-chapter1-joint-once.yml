name: Dispatch joint-Wald Chapter 1 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-chapter1-joint-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical joint-Wald Chapter 1 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run run-chapter1-context-main.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f trait_run_id=32702160934 \
            -f null_draws=1000
