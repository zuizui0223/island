name: Dispatch PR142 progressive analysis on latest traits

on:
  push:
    branches: [ch1-progressive-trait-analysis]
    paths:
      - .github/workflows/dispatch-pr142-latest-traits.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact PR142 progressive workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run run-chapter1-progressive-trait-analysis.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref ch1-progressive-trait-analysis \
            -f trait_run_id=34191508045 \
            -f trait_artifact_name=source-scale-batch-integration-34191508045 \
            -f species_axis_relative_path=species_axis_coverage.csv.gz \
            -f previous_run_id= \
            -f previous_artifact_name= \
            -f previous_species_axis_relative_path=chapter1_trait_snapshot_species_axis.csv.gz \
            -f allow_evidence_revision=false
