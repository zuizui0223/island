name: drive_gbif_full_acquisition

# Authoritative five-minute orchestrator for the v2 GBIF campaign.
# Do not depend on pushes made with GITHUB_TOKEN to trigger the next workflow:
# every heartbeat explicitly dispatches poll first, then submit. Both target
# workflows share `gbif-full-acquisition` concurrency, so their ledger writes
# remain serial even when GBIF or GitHub is slow.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: gbif-full-acquisition-driver
  cancel-in-progress: false

jobs:
  dispatch-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one status poll
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/poll-gbif-full-acquisition.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "Dispatched poll_gbif_full_acquisition."
      - name: Let poll enter the shared ledger lock
        run: sleep 75
      - name: Dispatch one capacity-aware submission pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/submit-gbif-frozen-full-acquisition.yml/dispatches" \
            --data '{"ref":"main","inputs":{"batch_size":"3"}}'
          echo "Dispatched submit_gbif_frozen_full_acquisition."
      - name: Resume GBIF collect if blocks remain and none is running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          collect="collect-gbif-full-acquisition.yml"
          # Fetch the committed collection status from the public raw endpoint.
          remaining="$(curl --fail --silent \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data/v2/staging/gbif/collected/collection_status.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("n_succeeded_blocks_remaining", 0))' 2>/dev/null || echo 0)"
          if [ "${remaining:-0}" -le 0 ]; then
            echo "No collect resume needed (remaining=${remaining})."
            exit 0
          fi
          # The self-chain is the primary driver; only step in when it has
          # stalled, i.e. no collect run is in_progress or queued.
          in_progress="$(curl --fail --silent --header "Authorization: Bearer ${GH_TOKEN}" \
            "${api}/actions/workflows/${collect}/runs?status=in_progress&per_page=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total_count", 0))')"
          queued="$(curl --fail --silent --header "Authorization: Bearer ${GH_TOKEN}" \
            "${api}/actions/workflows/${collect}/runs?status=queued&per_page=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total_count", 0))')"
          if [ "${in_progress:-0}" -gt 0 ] || [ "${queued:-0}" -gt 0 ]; then
            echo "Collect already active (in_progress=${in_progress}, queued=${queued}); no resume."
            exit 0
          fi
          echo "Collect stalled with ${remaining} block(s) left; dispatching a bounded batch."
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "${api}/actions/workflows/${collect}/dispatches" \
            --data '{"ref":"main","inputs":{"max_blocks":"3"}}'
          echo "Resumed collect_gbif_full_acquisition."
