name: drive_global_trait_campaign

# Global-first, resumable trait acquisition. Each run advances a bounded
# family-balanced bundle across the four evidence stages. Machine outputs remain
# unreviewed and never define flora membership or biological absence.
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Wikimedia species attempted per streaming bundle (1-2000)."
        required: false
        default: "1000"
        type: string
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/drive-global-trait-campaign.yml"
      - "src/island_v2/global_trait_campaign.py"
      - "src/island_v2/global_candidate_index.py"
      - "config/global_trait_campaign.yml"
      - "config/global_floral_access_keywords.yml"
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: global-trait-campaign
  cancel-in-progress: false

jobs:
  advance-streaming-bundle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BATCH_SIZE: ${{ inputs.batch_size || '1000' }}
      OPENALEX_BATCH_SIZE: "250"
      FLORAL_BATCH_SIZE: "150"
      GUILD_BATCH_SIZE: "100"
      CAMPAIGN_DIR: data/v2/staging/traits/global_campaign
      CAMPAIGN_RUN_LOG: /tmp/global_trait_campaign_run.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Guard global campaign logic and CLI contracts
        run: |
          pytest -q \
            tests/test_global_trait_campaign.py \
            tests/test_global_candidate_index.py \
            tests/test_reported_ecology_machine.py
          island-v2-global-trait-campaign --help >/dev/null
          island-v2-global-candidate-index --help >/dev/null
      - name: Validate bounded Wikimedia batch size
        run: |
          python - <<'PY'
          import os

          value = int(os.environ["BATCH_SIZE"])
          if not 1 <= value <= 2000:
              raise SystemExit("batch_size must be between 1 and 2000")
          PY
      - name: Advance one global streaming bundle
        id: advance
        continue-on-error: true
        run: |
          set -eo pipefail
          : > "${CAMPAIGN_RUN_LOG}"
          run_task() {
            local task="$1"
            local size="$2"
            echo "===== ${task}: batch ${size} =====" | tee -a "${CAMPAIGN_RUN_LOG}"
            island-v2-global-trait-campaign \
              --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
              --campaign-dir "${CAMPAIGN_DIR}" \
              --config-path config/global_trait_campaign.yml \
              --task "${task}" \
              --batch-size "${size}" \
              2>&1 | tee -a "${CAMPAIGN_RUN_LOG}"
          }
          run_task reproductive_wikimedia "${BATCH_SIZE}"
          run_task reproductive_openalex "${OPENALEX_BATCH_SIZE}"
          run_task floral_access_wikimedia "${FLORAL_BATCH_SIZE}"
          run_task alternative_guild_openalex "${GUILD_BATCH_SIZE}"
      - name: Record failed bundle for retry
        if: steps.advance.outcome == 'failure'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "${CAMPAIGN_DIR}"
          tail -n 200 "${CAMPAIGN_RUN_LOG}" > "${CAMPAIGN_DIR}/campaign_failure.log" || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["CAMPAIGN_DIR"])
          log_path = directory / "campaign_failure.log"
          payload = {
              "status": "streaming_bundle_failed",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "source_sha": os.environ["SOURCE_SHA"],
              "batch_plan": {
                  "reproductive_wikimedia": int(os.environ["BATCH_SIZE"]),
                  "reproductive_openalex": int(os.environ["OPENALEX_BATCH_SIZE"]),
                  "floral_access_wikimedia": int(os.environ["FLORAL_BATCH_SIZE"]),
                  "alternative_guild_openalex": int(os.environ["GUILD_BATCH_SIZE"]),
              },
              "failure_log": str(log_path),
              "retry_policy": (
                  "Any preceding task waves completed in this bundle remain in the ledger. "
                  "The next scheduled bundle retries only rows still pending or marked retry; "
                  "no execution failure is interpreted as a trait absence."
              ),
          }
          (directory / "campaign_failure.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Clear stale failure marker
        if: steps.advance.outcome == 'success'
        run: rm -f "${CAMPAIGN_DIR}/campaign_failure.json" "${CAMPAIGN_DIR}/campaign_failure.log"
      - name: Rebuild cumulative machine-candidate indexes
        if: always()
        run: |
          if test -f "${CAMPAIGN_DIR}/campaign_ledger.csv.gz"; then
            island-v2-global-candidate-index --campaign-dir "${CAMPAIGN_DIR}"
          else
            echo "No campaign ledger yet; candidate index skipped."
          fi
      - name: Publish campaign status
        if: steps.advance.outcome == 'success'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("data/v2/staging/traits/global_campaign/campaign_status.json")
          status = json.loads(path.read_text(encoding="utf-8"))
          index_path = Path("data/v2/staging/traits/global_campaign/candidate_index_status.json")
          index_status = json.loads(index_path.read_text(encoding="utf-8")) if index_path.exists() else {}
          print("## Global trait campaign")
          print(f"- global species master: {status['n_global_species']}")
          print(f"- families: {status['n_families']}")
          print(f"- machine biotic-vector candidates: {status['n_machine_biotic_candidates']}")
          print(f"- cumulative candidate rows: {index_status.get('n_unique_candidate_rows', 0)}")
          print(
              "- counterfactual screening species: "
              f"{index_status.get('n_machine_biotic_screening_species', 0)}"
          )
          print(f"- default next task: {status['active_task']}")
          for task, details in status["tasks"].items():
              counts = details["status_counts"]
              print(
                  f"- {task}: processed={counts.get('processed', 0)}, "
                  f"eligible_pending={details.get('n_eligible_pending', 0)}, "
                  f"candidates={details['n_candidates']}"
              )
          if "last_wave" in status:
              wave = status["last_wave"]
              print(f"- last wave: {wave['wave_id']}")
              print(f"- species attempted: {wave['n_species_attempted']}")
              print(f"- target candidates: {wave['n_target_candidates']}")
              print(f"- lookup errors: {wave['n_lookup_errors']}")
          print("")
          print(status["interpretation"])
          if index_status:
              print(index_status["interpretation"])
          PY
      - name: Publish failure status
        if: steps.advance.outcome == 'failure'
        run: |
          echo "## Global trait campaign bundle failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Successful preceding stages are retained; pending rows will retry." >> "$GITHUB_STEP_SUMMARY"
          cat "${CAMPAIGN_DIR}/campaign_failure.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat "${CAMPAIGN_DIR}/campaign_failure.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit campaign status
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # pandas/gzip may rewrite an identical completed ledger with a new gzip
          # timestamp. Ignore that binary-only change once no task remains active.
          if test -f "${CAMPAIGN_DIR}/campaign_status.json" && \
             jq -e '.active_task == "complete"' "${CAMPAIGN_DIR}/campaign_status.json" >/dev/null; then
            git restore --worktree "${CAMPAIGN_DIR}/campaign_ledger.csv.gz" 2>/dev/null || true
          fi
          git add "${CAMPAIGN_DIR}"
          if git diff --cached --quiet; then
            echo "No campaign status change."
          else
            if test -f "${CAMPAIGN_DIR}/campaign_failure.json"; then
              git commit -m "chore: record global trait campaign failure"
            else
              git commit -m "chore: advance global trait campaign"
            fi
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail job after status is persisted
        if: steps.advance.outcome == 'failure'
        run: exit 1
