name: build_pilot_trait_review_packet

# This workflow performs no model call and uses no paid API. It regenerates the
# current exact-island pilot staging, writes a blank evidence-first review packet,
# and can also harvest bounded unreviewed literature/access leads plus public-PDF
# page locators for one staged pilot island. It never writes trait values,
# establishment decisions, applicability, Bombus records, or analysis flags.
on:
  workflow_dispatch:
    inputs:
      max_taxa:
        description: "Maximum staged pilot taxa to include in the blank review packet."
        required: false
        default: "25"
      source_harvest_island_id:
        description: "Staged pilot island_id for bounded source harvest; Annobón by default."
        required: false
        default: "gshhg_2.3.7_h_abdf97ccd87beceb55f6"
      source_harvest_max_taxa:
        description: "Maximum staged taxa to query for literature/access leads."
        required: false
        default: "5"
      source_harvest_max_pdfs:
        description: "Maximum explicitly open public PDFs to page-locate."
        required: false
        default: "20"
      contact_email:
        description: "Contact email for public API polite pools; not written to artifacts."
        required: true

permissions:
  contents: read

concurrency:
  group: pilot-trait-review-packet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FROZEN_ARTIFACT_ID: "8066083419"
      FROZEN_ARTIFACT_SHA256: "bee33e14672ec7ff4ed1f7acaea36b32cc6170a45c3d14b2caeb5f43bfaa623b"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test review-packet and source-harvest boundaries
        run: pytest -q tests/test_pilot_curation.py tests/test_trait_review_packet.py tests/test_trait_source_discovery.py tests/test_trait_source_discovery_guarded.py tests/test_trait_pdf_locator.py
      - name: Fetch and verify frozen island manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ARTIFACT_ID}/zip" \
            --output /tmp/frozen.zip
          actual="$(sha256sum /tmp/frozen.zip | awk '{print $1}')"
          test "$actual" = "$FROZEN_ARTIFACT_SHA256" || { echo "Frozen artifact digest mismatch: $actual" >&2; exit 2; }
          unzip -q /tmp/frozen.zip -d /tmp/frozen
      - name: Rebuild taxonomy and establishment review queues
        run: |
          island-v2-taxon-intake build \
            --taxa-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --island-species-csv data/v2/staging/gbif/collected/island_species_occurrences.csv \
            --output-dir /tmp/taxon_intake \
            --pause-seconds 0.05
      - name: Rebuild exact-island pilot staging
        run: |
          island-v2-pilot-curation build \
            --island-manifest-csv /tmp/frozen/islands/gshhg/prepared/island_manifest.csv \
            --taxon-intake-csv /tmp/taxon_intake/taxon_intake_review_queue.csv \
            --establishment-queue-csv /tmp/taxon_intake/island_establishment_review_queue.csv \
            --pilot-registry-csv data/v2/curation/pilot_island_registry.csv \
            --output-dir /tmp/pilot_curation \
            --max-trait-candidates-per-island "${{ inputs.max_taxa }}" \
            --restrict-to-pilot-registry
      - name: Build API-free trait evidence review packet
        run: |
          island-v2-trait-review-packet build \
            --taxa-csv /tmp/pilot_curation/trait_candidate_pilot.csv \
            --output-dir data/v2/staging/pilot_trait_review_packet
      - name: Harvest unreviewed literature/access leads for staged Annobón taxa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          from island_v2 import trait_source_discovery as discovery

          island_id = "${{ inputs.source_harvest_island_id }}"
          contact_email = "${{ inputs.contact_email }}"
          max_taxa = int("${{ inputs.source_harvest_max_taxa }}")
          max_seeds = 5
          output_dir = Path("/tmp/trait_source_discovery")
          output_dir.mkdir(parents=True, exist_ok=True)

          candidates = pd.read_csv("/tmp/pilot_curation/trait_candidate_pilot.csv", dtype=str).fillna("")
          staged = candidates.loc[candidates["island_id"].eq(island_id)].copy()
          if staged.empty:
              raise SystemExit(f"No staged taxa found for source_harvest_island_id={island_id!r}")

          # This out-of-domain machinery-validation harvest starts only from staged pilot taxa
          # and deliberately writes only unreviewed source-navigation rows.
          leads, report = discovery.discover_sources(
              staged_taxa=staged,
              getter=discovery._httpx_getter(),
              contact_email=contact_email,
              max_taxa=max_taxa,
              max_seeds_per_taxon=max_seeds,
          )
          if "release_gate" in staged.columns:
              gate = staged[["accepted_species", "release_gate"]].drop_duplicates("accepted_species").set_index("accepted_species")["release_gate"].to_dict()
              leads["release_gate"] = leads["query_taxon"].map(gate).fillna("")

          leads["pilot_context"] = "annobon_out_of_domain_trait_evidence_pilot"
          leads["review_status"] = "unreviewed_m0_source_lead"
          leads["decision_boundary"] = (
              "Literature/access leads only. Do not infer trait values, taxon scope, island establishment, "
              "Bombus applicability, or analysis inclusion from this artifact."
          )

          staged.to_csv(output_dir / "annobon_staged_taxa.csv", index=False)
          leads.to_csv(output_dir / "trait_literature_seeds.csv", index=False)
          leads.to_csv(output_dir / "trait_source_leads.csv", index=False)
          receipt_columns = [
              column for column in [
                  "query_taxon", "island_id", "doi", "source_api", "is_open_access", "oa_status",
                  "open_access_url", "candidate_pdf_url", "lead_status", "provenance_note",
                  "release_gate", "pilot_context", "review_status", "decision_boundary",
              ] if column in leads.columns
          ]
          leads.loc[:, receipt_columns].to_csv(output_dir / "trait_public_source_receipts.csv", index=False)
          report.update({
              "island_id": island_id,
              "pilot_context": "annobon_out_of_domain_trait_evidence_pilot",
              "n_staged_taxa_in_island": int(len(staged)),
              "source_harvest_boundary": "unreviewed M0 leads only; no biological decision columns are emitted",
          })
          (output_dir / "trait_source_discovery_report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Locate public-PDF candidate pages without retaining PDFs
        run: |
          python -m island_v2.trait_pdf_locator locate-pages \
            --leads-csv /tmp/trait_source_discovery/trait_source_leads.csv \
            --output-csv /tmp/trait_source_discovery/trait_pdf_page_locators.csv \
            --max-pdfs "${{ inputs.source_harvest_max_pdfs }}"
      - name: Summarize review packet and unreviewed source harvest
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print('## API-free pilot trait review packet')
          packet = Path('data/v2/staging/pilot_trait_review_packet/trait_evidence_review_packet_summary.json')
          if packet.exists():
              for key, value in json.loads(packet.read_text(encoding='utf-8')).items():
                  print(f'- {key}: {value}')
          else:
              print('- No review packet produced.')

          print('\n## Annobón source-harvest artifact')
          report_path = Path('/tmp/trait_source_discovery/trait_source_discovery_report.json')
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding='utf-8'))
              for key, value in report.items():
                  if key != 'lookup_errors':
                      print(f'- {key}: {value}')
          pages = Path('/tmp/trait_source_discovery/trait_pdf_page_locators.csv')
          if pages.exists():
              import pandas as pd
              locators = pd.read_csv(pages, dtype=str).fillna('')
              print(f'- n_pdf_locator_rows: {len(locators)}')
              print(f'- n_candidate_page_locators: {(locators["locator_status"] == "candidate_pages_located").sum()}')
          print('- trait status: unreviewed M0 literature/access leads and page locators only')
          print('- PDFs retained: none; artifact contains only source rows and page locator metadata')
          PY
      - name: Upload pilot staging, review packet, source leads, and page locators
        uses: actions/upload-artifact@v4
        with:
          name: pilot-trait-review-packet-and-annobon-source-harvest-${{ github.run_id }}
          path: |
            /tmp/pilot_curation/
            data/v2/staging/pilot_trait_review_packet/
            /tmp/trait_source_discovery/
          if-no-files-found: error
          retention-days: 90
