name: build_pilot_trait_review_packet

# This workflow performs no model call and uses no paid API. It regenerates the
# current exact-island pilot staging and writes a blank, evidence-first review
# packet for literature and web research performed outside GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      max_taxa:
        description: "Maximum staged pilot taxa to include."
        required: false
        default: "25"

permissions:
  contents: read

concurrency:
  group: pilot-trait-review-packet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FROZEN_ARTIFACT_ID: "8066083419"
      FROZEN_ARTIFACT_SHA256: "bee33e14672ec7ff4ed1f7acaea36b32cc6170a45c3d14b2caeb5f43bfaa623b"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test review-packet logic
        run: pytest -q tests/test_pilot_curation.py tests/test_trait_review_packet.py
      - name: Fetch and verify frozen island manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ARTIFACT_ID}/zip" \
            --output /tmp/frozen.zip
          actual="$(sha256sum /tmp/frozen.zip | awk '{print $1}')"
          test "$actual" = "$FROZEN_ARTIFACT_SHA256" || { echo "Frozen artifact digest mismatch: $actual" >&2; exit 2; }
          unzip -q /tmp/frozen.zip -d /tmp/frozen
      - name: Rebuild taxonomy and establishment review queues
        run: |
          island-v2-taxon-intake build \
            --taxa-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --island-species-csv data/v2/staging/gbif/collected/island_species_occurrences.csv \
            --output-dir /tmp/taxon_intake \
            --pause-seconds 0.05
      - name: Rebuild exact-island pilot staging
        run: |
          island-v2-pilot-curation build \
            --island-manifest-csv /tmp/frozen/islands/gshhg/prepared/island_manifest.csv \
            --taxon-intake-csv /tmp/taxon_intake/taxon_intake_review_queue.csv \
            --establishment-queue-csv /tmp/taxon_intake/island_establishment_review_queue.csv \
            --pilot-registry-csv data/v2/curation/pilot_island_registry.csv \
            --output-dir /tmp/pilot_curation \
            --max-trait-candidates-per-island "${{ inputs.max_taxa }}"
      - name: Build API-free trait evidence review packet
        run: |
          island-v2-trait-review-packet build \
            --taxa-csv /tmp/pilot_curation/trait_candidate_pilot.csv \
            --output-dir data/v2/staging/pilot_trait_review_packet
      - name: Summarize review packet
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('data/v2/staging/pilot_trait_review_packet/trait_evidence_review_packet_summary.json')
          print('## API-free pilot trait review packet')
          if path.exists():
              for key, value in json.loads(path.read_text(encoding='utf-8')).items():
                  print(f'- {key}: {value}')
          else:
              print('- No review packet produced.')
          PY
      - name: Upload pilot staging and review packet
        uses: actions/upload-artifact@v4
        with:
          name: pilot-trait-review-packet-${{ github.run_id }}
          path: |
            /tmp/pilot_curation/
            data/v2/staging/pilot_trait_review_packet/
          if-no-files-found: error
          retention-days: 90
