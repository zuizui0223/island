name: Extract Zenodo selfing source at source scale

on:
  push:
    branches: [codex/recover-verified-checkpoint]
    paths:
      - scripts/extract_zenodo_selfing_source.py
      - .github/workflows/extract-zenodo-selfing-source.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Source extraction only. No canonical/restart coverage integration occurs here.
concurrency:
  group: zenodo-selfing-source-scale
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_SOURCE_BATCH_RUN: "34177316926"
      ZENODO_FILE_URL: "https://zenodo.org/records/15288584/files/results_selfing_estimates_per_species.zip?download=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas openpyxl xlrd

      - name: Download current public source-batch checkpoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          gh run download "$CURRENT_SOURCE_BATCH_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "source-scale-batch-integration-${CURRENT_SOURCE_BATCH_RUN}" \
            --dir /tmp/current
          CURRENT_COVERAGE=$(find /tmp/current -name species_axis_coverage.csv.gz -print -quit)
          test -n "$CURRENT_COVERAGE" && test -f "$CURRENT_COVERAGE"
          echo "CURRENT_COVERAGE=$CURRENT_COVERAGE" >> "$GITHUB_ENV"

      - name: Download complete Zenodo selfing archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/zenodo
          curl -L --fail --retry 3 --retry-delay 2 \
            -A 'island-source-scale-acquisition/1.0' \
            "$ZENODO_FILE_URL" -o /tmp/zenodo/results_selfing_estimates_per_species.zip
          test -s /tmp/zenodo/results_selfing_estimates_per_species.zip
          sha256sum /tmp/zenodo/results_selfing_estimates_per_species.zip | tee /tmp/zenodo/source_archive.sha256

      - name: Extract and intersect complete source with unresolved reproduction cells
        run: |
          python scripts/extract_zenodo_selfing_source.py \
            --source-zip /tmp/zenodo/results_selfing_estimates_per_species.zip \
            --coverage "$CURRENT_COVERAGE" \
            --output artifacts/zenodo-selfing-source
          cp /tmp/zenodo/source_archive.sha256 artifacts/zenodo-selfing-source/
          cat artifacts/zenodo-selfing-source/zenodo_selfing_source_summary.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: zenodo-selfing-source-scale-${{ github.run_id }}
          path: artifacts/zenodo-selfing-source/
          if-no-files-found: error
          retention-days: 90
