name: fd_original_GIFT4505_direct_quality_genus_stratified_sensitivity
on:
  workflow_dispatch:
  pull_request:
    branches: [analysis/fd-stage2-floral-forecast-20261119]
  push:
    branches: [analysis/fd-gift-direct-evidence-quality-20261121]
    paths:
      - ".github/workflows/fd-original-direct-quality-audit.yml"
      - "scripts/fd_original_gift_direct_evidence_quality_audit.py"
      - "tests/test_fd_original_gift_direct_evidence_quality_audit.py"
permissions:
  actions: read
  contents: read
concurrency:
  group: fd-gift-direct-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original_4505_GIFT_geography_genus_flower:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-original-gift4505-stage2-namedisjoint
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: 828f4b76760209d9276db2ffdc0cd9b1440c408f
          path: work/fd-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sparse genus and proper-scoring numerical runtime
        run: python -m pip install -q numpy pandas scipy pytest
      - name: Test non-oracle full-name donor ban and scoring guards
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd-reference/src" python -m pytest -q \
            tests/test_fd_original_gift_direct_evidence_quality_audit.py \
            work/fd-reference/tests/test_two_stage_floral_forecast.py
          PYTHONPATH="scripts:work/fd-reference/src" python -m compileall -q \
            scripts/fd_original_gift_direct_evidence_quality_audit.py
      - name: Restore SHA-locked original GIFT botanical flora and flower observations
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 \
            --dir "$STAGE/original"
          ORIGINAL_FLORA="$(find "$STAGE/original" \
            -path '*/fixed/canonical/input/chapter1_status_flora.csv.gz' \
            -type f -print -quit)"
          test -s "$ORIGINAL_FLORA"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_FLORA" | sha256sum --check --strict
          ORIGINAL_ROOT="$(printf '%s' "$ORIGINAL_FLORA" | sed 's@/fixed/canonical/input/chapter1_status_flora.csv.gz$@@')"
          echo "8a9d79c698afa20e611663adb884c8caf648e1a3836853fad94e6a0cd6facb44  $ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz" | sha256sum --check --strict
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $ORIGINAL_ROOT/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Recreate independent GSHHG 8264-island geospatial covariates
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c \
            'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Assess original Direct species evidence high vs medium within certified genera
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd-reference/src" python -u \
            scripts/fd_original_gift_direct_evidence_quality_audit.py \
            --original-root "$ORIGINAL_ROOT" \
            --geography "$STAGE/geography/island_origin_crosswalk.csv" \
            --nperm 199 \
            --output "$STAGE/anonymous_gift4505_direct_evidence_quality_genus_null.json"
      - name: Check original GIFT source quality panel completeness and botanical identifier privacy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=(Path(os.environ["STAGE"])/"anonymous_gift4505_direct_evidence_quality_genus_null.json").read_text()
          x=json.loads(s)
          assert x["status"]=="ORIGINAL_GIFT4505_SPECIES_DIRECT_QUALITY_WITHIN_GENUS_NULL"
          assert x["original_parent_GIFT_botanical_island_floras"]==4505
          assert x["original_parent_geography_islands"]==8264
          assert x["n_genuine_Direct_endpoints"]==13
          assert len(x["panels"])==78
          assert len({(y["scope"],y["region"],y["trait_endpoint"]) for y in x["panels"]})==78
          assert all(y["high_vs_medium_are_different_plant_species_not_repeated_measurements"] for y in x["panels"])
          assert all(y["biological_within_genus_variation_vs_annotation_not_identifiable"] for y in x["panels"])
          for key in ("island_id","accepted_species","entity_ID","spatial_block","first_source","genus_name","latitude","longitude"):
              assert '"'+key+'":' not in s, "Private botanical/source identifier exported"
          print("Source original 4505-stage two-panel output integrity PASS")
          PY
      - name: Archive anonymous original regional loss and attrition panels only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gift4505-original-direct-quality-genus-conditioned-anonymous
          path: /tmp/fd-original-gift4505-stage2-namedisjoint/anonymous_gift4505_direct_evidence_quality_genus_null.json
          retention-days: 90
          if-no-files-found: warn
