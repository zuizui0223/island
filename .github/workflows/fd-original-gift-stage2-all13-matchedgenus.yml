name: fd_original_GIFT4505_all13_genus_matched_source_reference
on:
  workflow_dispatch:
  pull_request:
    branches: [analysis/fd-count-matched-local-external-priors-20261120]
  push:
    branches: [analysis/fd-genus-count-matched-source-priors-20261120]
    paths:
      - ".github/workflows/fd-original-gift-stage2-all13-matchedgenus.yml"
      - "scripts/fd_original_stage2_name_disjoint_flower_forecast.py"
      - "tests/test_fd_original_stage2_name_disjoint_flower_forecast.py"
      - "tests/test_fd_stage2_count_matched_donor_priors.py"
      - "tests/test_fd_original_genus_matched_source_priors.py"
permissions:
  actions: read
  contents: read
concurrency:
  group: fd-gift-stage2-all13-matchedgenus-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original_4505_GIFT_geography_genus_flower:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-original-gift4505-stage2-namedisjoint
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: 828f4b76760209d9276db2ffdc0cd9b1440c408f
          path: work/fd-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sparse genus and proper-scoring numerical runtime
        run: python -m pip install -q numpy pandas scipy pytest
      - name: Test non-oracle full-name donor ban and scoring guards
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd-reference/src" python -m pytest -q \
            tests/test_fd_original_stage2_name_disjoint_flower_forecast.py \
            tests/test_fd_stage2_count_matched_donor_priors.py \
            tests/test_fd_original_genus_matched_source_priors.py \
            work/fd-reference/tests/test_two_stage_floral_forecast.py
          PYTHONPATH="scripts:work/fd-reference/src" python -m compileall -q \
            scripts/fd_original_stage2_name_disjoint_flower_forecast.py
      - name: Restore SHA-locked original GIFT botanical flora and flower observations
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 \
            --dir "$STAGE/original"
          ORIGINAL_FLORA="$(find "$STAGE/original" \
            -path '*/fixed/canonical/input/chapter1_status_flora.csv.gz' \
            -type f -print -quit)"
          test -s "$ORIGINAL_FLORA"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_FLORA" | sha256sum --check --strict
          ORIGINAL_ROOT="$(printf '%s' "$ORIGINAL_FLORA" | sed 's@/fixed/canonical/input/chapter1_status_flora.csv.gz$@@')"
          echo "8a9d79c698afa20e611663adb884c8caf648e1a3836853fad94e6a0cd6facb44  $ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz" | sha256sum --check --strict
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $ORIGINAL_ROOT/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Recreate independent GSHHG 8264-island geospatial covariates
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c \
            'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Fit name-disjoint genus stage and two same-species Direct floral endpoints
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd-reference/src" python -u \
            scripts/fd_original_stage2_name_disjoint_flower_forecast.py \
            --original-root "$ORIGINAL_ROOT" \
            --geography "$STAGE/geography/island_origin_crosswalk.csv" \
            --endpoints flower_primary_color floral_form floral_symmetry flower_size_class tube_depth_class inflorescence_display self_incompatibility autonomous_selfing_capacity mating_system cleistogamy flower_primary_color__floral_form flower_primary_color__floral_symmetry floral_form__floral_symmetry \
            --nboot 499 \
            --output "$STAGE/anonymous_gift4505_stage2_all13_genus_matched_reference.json"
      - name: Check source output and forbidden identifier leakage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=(Path(os.environ["STAGE"])/"anonymous_gift4505_stage2_all13_genus_matched_reference.json").read_text()
          x=json.loads(s)
          assert x["original_parent_GIFT_botanical_floras"]==4505
          assert len(x["regional_source_heldout_results"])==78
          assert len(x["frozen_pilot_endpoints"])==13
          assert x["direct_local_vs_external_blind_losses_bootstrapped_on_identical_source_carriers"]
          assert x["status"]=="ORIGINAL_GIFT_STAGE2_GENUS_AND_COUNT_MATCHED_SOURCE_REFERENCE_SENSITIVITY"
          assert x["genus_matched_prior_same_genus_weights_and_same_source_names_count_per_genus"]
          assert x["matched_source_eligibility_is_an_explicit_subset_not_original_model_redefinition"]
          assert x["genus_matched_min_common_direct_genera"]==5
          assert x["genus_matched_min_direct_names_each_side"]==20
          assert x["genus_matched_max_direct_names_per_common_genus_each_side"]==20
          assert all("n_original_target_islands_scored_with_genus_matched_source" in y for y in x["regional_source_heldout_results"])
          assert all(y["n_original_target_islands_scored_with_genus_matched_source"]<=y["n_original_target_islands_scored"] for y in x["regional_source_heldout_results"])
          assert x["matched_source_direct_name_sample_seeds"]==[0,1,2]
          assert x["matched_source_direct_name_per_side_cap"]==2000
          assert all("balanced_external_better_all_three_source_samples_both_losses_groups" in y for y in x["regional_source_heldout_results"])
          assert all("balanced_local_better_all_three_source_samples_both_losses_groups" in y for y in x["regional_source_heldout_results"])
          assert all("external_blind_better_than_local_blind_both_scores_and_groups" in y for y in x["regional_source_heldout_results"])
          assert all("local_blind_better_than_external_blind_both_scores_and_groups" in y for y in x["regional_source_heldout_results"])
          assert all(
              not (y["external_blind_better_than_local_blind_both_scores_and_groups"]
                   and y["local_blind_better_than_external_blind_both_scores_and_groups"])
              for y in x["regional_source_heldout_results"])
          assert all(y["original_full_accepted_name_group_ban_on_both_models"] for y in x["regional_source_heldout_results"])
          for key in ("island_id","accepted_species","entity_ID","spatial_block","first_source","genus_name","latitude","longitude"):
              assert '"'+key+'":' not in s, "Private botanical/source identifier exported"
          print("Source original 4505-stage two-panel output integrity PASS")
          PY
      - name: Archive anonymous original regional loss and attrition panels only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gift4505-stage2-all13-genusmatched-local-external-anonymous
          path: /tmp/fd-original-gift4505-stage2-namedisjoint/anonymous_gift4505_stage2_all13_genus_matched_reference.json
          retention-days: 90
          if-no-files-found: warn
