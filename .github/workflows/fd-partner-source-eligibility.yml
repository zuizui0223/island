name: Protected partner E2 source eligibility
on:
  push:
    branches: [analysis/fd-original-tropical-pollinator-bridge-20261124]
    paths:
      - scripts/fd_partner_source_eligibility.py
      - .github/workflows/fd-partner-source-eligibility.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-partner-eligibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy
      - name: Restore original protected botanical sources
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          ORIGINAL_FLORA="$(find "$STAGE/original" -path '*/fixed/canonical/input/chapter1_status_flora.csv.gz' -type f -print -quit)"
          test -s "$ORIGINAL_FLORA"
          ORIGINAL_ROOT="$(printf '%s' "$ORIGINAL_FLORA" | sed 's@/fixed/canonical/input/chapter1_status_flora.csv.gz$@@')"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/zuizui0223/island/d4a5dafab5f0737ea6c1c1c0263fc20decf6035c/results/geography_20260924/corrected_geography_covariates.csv' -o "$STAGE/geography.csv"
      - name: Audit frozen source availability only
        run: |
          set -euo pipefail
          python -u scripts/fd_partner_source_eligibility.py --original-root "$ORIGINAL_ROOT" --geography "$STAGE/geography.csv" --bridge config/fd_public_animal_bridge_20261124.json --out "$STAGE/anonymous_partner_source_eligibility.json"
          python - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ["STAGE"])/"anonymous_partner_source_eligibility.json").read_text())
          assert x["botanical_parent"]==4505 and x["geography_parent"]==8264 and x["status"]=="source_eligibility_only"
          assert "fruit_and_growth" in x and "bombus" in x
          assert not any(k in x for k in ("island_id","accepted_species","bee_id","E1","E2"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: anonymous-partner-source-eligibility
          path: /tmp/fd-partner-eligibility/anonymous_partner_source_eligibility.json
