name: fix_search_recovery_once

on:
  push:
    branches: [codex/literature-recovery-pilot]
    paths:
      - ".github/workflows/fix-search-recovery-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/literature-recovery-pilot
          fetch-depth: 0
      - name: Patch search recovery policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/island_v2/search_engine_trait_recovery.py")
          text = path.read_text(encoding="utf-8")

          old_queries = '''# Two broad first-pass queries keep the request budget bounded for 100k taxa.
          PRIMARY_QUERIES = {
              "phenotype": '\"{name}\" flowers flower color colour corolla petals shape symmetry',
              "reproduction": (
                  '\"{name}\" pollination pollinator pollinated self-compatible self-incompatible '
                  'selfing outcrossing autogamy mating system breeding system'
              ),
          }

          # Only unresolved fields trigger these narrower fallback queries.
          FALLBACK_QUERIES = {
              "flower_color": '\"{name}\" flower color colour flowers corolla petals',
              "flower_shape": '\"{name}\" flower shape floral morphology corolla symmetry',
              "pollination_guild": '\"{name}\" pollinated by pollinator bees flies butterflies moths birds wind',
              "mating_system": '\"{name}\" mating system breeding system selfing outcrossing autogamy',
              "self_incompatibility": (
                  '\"{name}\" self-compatible self-incompatible self-fertile self-sterile '
                  'self compatibility self incompatibility'
              ),
          }
          '''
          new_queries = '''# Short first-pass queries work better than keyword-stuffed queries in search snippets.
          PRIMARY_QUERIES = {
              "phenotype": '\"{name}\" flower',
              "reproduction": '\"{name}\" pollination',
          }

          # Only unresolved fields trigger these short exact-phrase variants. The expensive
          # variants are gap-only, so well-described taxa still finish after two searches.
          FALLBACK_QUERY_VARIANTS = {
              "flower_color": (
                  '\"{name}\" flower color',
                  '\"{name}\" flower colour',
                  '\"{name}\" flowers are',
              ),
              "flower_shape": (
                  '\"{name}\" flower shape',
                  '\"{name}\" floral morphology',
                  '\"{name}\" corolla',
              ),
              "pollination_guild": (
                  '\"{name}\" pollinated by',
                  '\"{name}\" pollinator',
                  '\"{name}\" pollination biology',
              ),
              "mating_system": (
                  '\"{name}\" mating system',
                  '\"{name}\" breeding system',
                  '\"{name}\" selfing outcrossing',
                  '\"{name}\" autogamy',
              ),
              "self_incompatibility": (
                  '\"{name}\" self-compatible',
                  '\"{name}\" self-incompatible',
                  '\"{name}\" self-fertile',
                  '\"{name}\" self-sterile',
              ),
          }
          '''
          if old_queries not in text:
              raise SystemExit("query block not found")
          text = text.replace(old_queries, new_queries)

          old_collect = '''        combined = f"{title}. {snippet}".strip()
                  if not url or not taxon_present(combined, query_taxon, scope):
                      continue
                  for trait, value in extract_traits(combined).items():
                      if scope == "genus" and trait == "self_incompatibility":
                          value = "likely_SI" if value == "SI" else "likely_SC"
                      rows.append(
                          {
                              "accepted_species": species,
                              "trait": trait,
                              "value": value,
                              "inference_status": "reported" if scope == "species" else "likely",
                              "confidence": "medium" if scope == "species" else "low",
          '''
          new_collect = '''        combined = f"{title}. {snippet}".strip()
                  if not url:
                      continue
                  explicit_taxon = taxon_present(combined, query_taxon, scope)
                  # Search engines often omit the queried scientific name from the rendered
                  # snippet. Exact-name query provenance is therefore retained as low-confidence
                  # likely evidence instead of being discarded outright.
                  status = "reported" if scope == "species" and explicit_taxon else "likely"
                  confidence = "medium" if status == "reported" else "low"
                  target_trait = ""
                  if query_family.startswith("gap_"):
                      target_trait = query_family.removeprefix("gap_")
                  elif query_family.startswith("genus_"):
                      target_trait = query_family.removeprefix("genus_")
                  for trait, value in extract_traits(combined).items():
                      if target_trait and trait != target_trait:
                          continue
                      if status == "likely" and trait == "self_incompatibility":
                          value = "likely_SI" if value == "SI" else "likely_SC"
                      rows.append(
                          {
                              "accepted_species": species,
                              "trait": trait,
                              "value": value,
                              "inference_status": status,
                              "confidence": confidence,
          '''
          if old_collect not in text:
              raise SystemExit("collect block not found")
          text = text.replace(old_collect, new_collect)

          old_species_gap = '''        # Narrow species-level search only for unresolved fields.
                  for trait in TRAITS:
                      if trait in resolved:
                          continue
                      query = FALLBACK_QUERIES[trait].format(name=species)
                      evidence.extend(
                          collect_query(
                              client,
                              species=species,
                              query_taxon=species,
                              scope="species",
                              query_family=f"gap_{trait}",
                              query=query,
                              limit=result_limit,
                          )
                      )
          '''
          new_species_gap = '''        # Short exact species-level variants only for unresolved fields. Stop as soon
                  # as a variant resolves the target trait.
                  for trait in TRAITS:
                      if trait in resolved:
                          continue
                      for template in FALLBACK_QUERY_VARIANTS[trait]:
                          query = template.format(name=species)
                          evidence.extend(
                              collect_query(
                                  client,
                                  species=species,
                                  query_taxon=species,
                                  scope="species",
                                  query_family=f"gap_{trait}",
                                  query=query,
                                  limit=result_limit,
                              )
                          )
                          if any(row["trait"] == trait for row in evidence):
                              break
          '''
          if old_species_gap not in text:
              raise SystemExit("species gap block not found")
          text = text.replace(old_species_gap, new_species_gap)

          old_genus = '''                query = FALLBACK_QUERIES[trait].format(name=genus_name)
                          evidence.extend(
                              collect_query(
                                  client,
                                  species=species,
                                  query_taxon=genus_name,
                                  scope="genus",
                                  query_family=f"genus_{trait}",
                                  query=query,
                                  limit=result_limit,
                              )
                          )
          '''
          new_genus = '''                for template in FALLBACK_QUERY_VARIANTS[trait]:
                              query = template.format(name=genus_name)
                              evidence.extend(
                                  collect_query(
                                      client,
                                      species=species,
                                      query_taxon=genus_name,
                                      scope="genus",
                                      query_family=f"genus_{trait}",
                                      query=query,
                                      limit=result_limit,
                                  )
                              )
                              if any(row["trait"] == trait for row in evidence):
                                  break
          '''
          if old_genus not in text:
              raise SystemExit("genus block not found")
          text = text.replace(old_genus, new_genus)

          text = text.replace(
              '"2 broad exact-name queries per species; unresolved fields only trigger narrow species queries; "\n            "remaining gaps optionally trigger genus-level likely fallback; Bing RSS primary, DuckDuckGo fallback"',
              '"2 short exact-name queries per species; unresolved fields trigger short exact-phrase variants; "\n            "query-bound snippets without repeated taxon names are retained as low-confidence likely evidence; "\n            "remaining gaps optionally trigger genus-level likely fallback; Bing RSS primary, DuckDuckGo fallback"',
          )

          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/fix-search-recovery-once.yml
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/island_v2/search_engine_trait_recovery.py .github/workflows/fix-search-recovery-once.yml
          git commit -m "fix: recover query-bound snippets as likely evidence"
          git push origin HEAD:codex/literature-recovery-pilot
