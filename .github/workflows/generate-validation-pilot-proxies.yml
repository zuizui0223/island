name: generate_validation_pilot_trait_proxies

# Runs the reported source scouts, then generates separated *_proxy candidates
# only for reported-evidence gaps. Proxies are unreviewed candidates, not decided
# trait values and not confirmed pollinator / breeding-system records.
on:
  workflow_dispatch:
    inputs:
      species_csv:
        description: "Repository path to the pilot species CSV."
        required: false
        default: "data/v2/staging/traits/validation_pilot/validation_pilot_species.csv"
        type: string
      max_taxa:
        description: "Bounded number of species to query (<= 500)."
        required: false
        default: "50"
        type: string

permissions:
  contents: read

concurrency:
  group: validation-pilot-trait-proxies
  cancel-in-progress: false

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test proxy and reported-source boundaries
        run: |
          pytest -q \
            tests/test_trait_proxy_generator.py \
            tests/test_trait_web_reported_scout.py \
            tests/test_trait_descriptive_scout.py \
            tests/test_trait_candidate_review_queue.py \
            tests/test_v1_category_search.py
      - name: Verify pilot input exists
        run: test -f "${{ inputs.species_csv }}"
      - name: Scout Wikipedia/Wikidata reported candidates
        run: |
          python -m island_v2.trait_web_reported_scout scout \
            --species-csv "${{ inputs.species_csv }}" \
            --output-dir /tmp/web_reported_scout \
            --max-taxa "${{ inputs.max_taxa }}"
      - name: Scout GBIF descriptive reported candidates
        run: |
          python -m island_v2.trait_descriptive_scout scout \
            --species-csv "${{ inputs.species_csv }}" \
            --output-dir /tmp/m0_descriptive_scout \
            --max-taxa "${{ inputs.max_taxa }}"
      - name: Scout public flora and descriptive websites
        run: |
          island-v2-v1-category-search search \
            --species-csv "${{ inputs.species_csv }}" \
            --output-dir /tmp/public_flora_scout \
            --max-taxa "${{ inputs.max_taxa }}"
      - name: Generate reported-gap proxy candidates
        run: |
          python -m island_v2.trait_proxy_generator generate \
            --species-csv "${{ inputs.species_csv }}" \
            --reported-csv /tmp/web_reported_scout/web_reported_candidates.csv \
            --reported-csv /tmp/m0_descriptive_scout/m0_descriptive_candidates.csv \
            --reported-csv /tmp/public_flora_scout/v2_reported_candidates.csv \
            --output-dir /tmp/trait_proxies
      - name: Build candidate review queue
        run: |
          python -m island_v2.trait_candidate_review_queue build \
            --web-reported-csv /tmp/web_reported_scout/web_reported_candidates.csv \
            --web-reported-csv /tmp/public_flora_scout/v2_reported_candidates.csv \
            --trait-proxy-csv /tmp/trait_proxies/trait_proxy_candidates.csv \
            --descriptive-csv /tmp/m0_descriptive_scout/m0_descriptive_candidates.csv \
            --output-dir /tmp/candidate_review_queue
      - name: Validate candidate review queue
        run: |
          python -m island_v2.trait_candidate_review_queue validate \
            --review-queue-csv /tmp/candidate_review_queue/trait_candidate_review_queue.csv \
            --output-dir /tmp/candidate_review_queue
      - name: Summarize proxy generation
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          web = json.loads(Path('/tmp/web_reported_scout/web_reported_scout_report.json').read_text())
          desc = json.loads(Path('/tmp/m0_descriptive_scout/m0_descriptive_scout_report.json').read_text())
          public = json.loads(Path('/tmp/public_flora_scout/v1_category_search_manifest.json').read_text())
          proxy = json.loads(Path('/tmp/trait_proxies/trait_proxy_report.json').read_text())
          queue = json.loads(Path('/tmp/candidate_review_queue/trait_candidate_review_queue_summary.json').read_text())
          print('## Validation-pilot reported + proxy generation')
          print(f"- web reported species: {web['n_species_with_reported']}/{web['n_taxa_queried']}")
          print(f"- GBIF descriptive species: {desc['n_species_with_candidates']}/{desc['n_taxa_queried']}")
          print(f"- public flora v2 candidate rows: {public['n_v2_reported_candidate_rows']}")
          print(f"- proxy candidates: {proxy['n_proxy_candidates']}")
          print(f"- species with proxy: {proxy['n_species_with_proxy']}/{proxy['n_species_input']}")
          print(f"- review queue rows: {queue['n_review_candidates']}")
          print('- status: unreviewed reported/proxy candidates only; no value decided')
          PY
      - name: Upload reported and proxy candidates
        uses: actions/upload-artifact@v4
        with:
          name: validation-pilot-reported-and-proxy-${{ github.run_id }}
          path: |
            /tmp/web_reported_scout/
            /tmp/m0_descriptive_scout/
            /tmp/public_flora_scout/
            /tmp/trait_proxies/
            /tmp/candidate_review_queue/
          if-no-files-found: error
          retention-days: 90
