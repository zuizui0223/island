name: Ingest all AusTraits target floral traits

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ingest-austraits-all-floral-bulk.yml"
      - "config/acquisition_rate.yml"
      - "config/angiosperm_scope.yml"
      - "config/bulk_trait_sources.yml"
      - "config/trait_ontology.yml"
      - "src/island_v2/acquisition_rate_report.py"
      - "src/island_v2/bulk_trait_ingest.py"
      - "src/island_v2/fetch_austraits_bulk.py"
      - "tests/test_acquisition_rate_report.py"
      - "tests/test_bulk_trait_ingest.py"
      - "tests/test_fetch_austraits_bulk.py"

permissions:
  contents: read

concurrency:
  group: austraits-all-floral-bulk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused dependencies
        run: pip install -e ".[dev]"
      - name: Validate all-AusTraits mappings and ledger contract
        run: |
          pytest -q \
            tests/test_fetch_austraits_bulk.py \
            tests/test_bulk_trait_ingest.py \
            tests/test_acquisition_rate_report.py

  ingest:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Fetch selected target traits from checksum-verified full AusTraits
        run: |
          set -euo pipefail
          mkdir -p /tmp/austraits_all_bulk/prepared
          python -m island_v2.fetch_austraits_bulk \
            --dataset-key= \
            --trait-name flower_colour \
            --trait-name perianth_colour \
            --trait-name flower_perianth_symmetry \
            --trait-name sex_type \
            --trait-name pollination_syndrome \
            --trait-name pollination_system \
            --output-csv /tmp/austraits_all_bulk/prepared/selected_traits.csv \
            --manifest-json /tmp/austraits_all_bulk/fetch_manifest.json
      - name: Prepare pollination-only view and release provenance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd

          root = Path("/tmp/austraits_all_bulk")
          source = pd.read_csv(root / "prepared" / "selected_traits.csv", dtype=str).fillna("")
          source.loc[
              source["trait_name"].isin({"pollination_syndrome", "pollination_system"})
          ].to_csv(root / "prepared" / "pollination_traits.csv", index=False)

          manifest = json.loads((root / "fetch_manifest.json").read_text(encoding="utf-8"))
          version = str(manifest.get("release_version") or "unknown")
          doi = str(manifest.get("doi") or "")
          release_url = str(manifest.get("release_page_url") or "")
          if doi:
              release_url = f"https://doi.org/{doi}"
          source_name = f"austraits_all_target_floral_{version}"
          citation = f"AusTraits {version}, selected categorical floral traits"
          if doi:
              citation += f", DOI {doi}"
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"SOURCE_NAME={source_name}\n")
              handle.write(f"SOURCE_CITATION={citation}\n")
              handle.write(f"SOURCE_URL={release_url}\n")
          PY
      - name: Ingest colour, symmetry, sex system, and pollen vector
        run: |
          set -euo pipefail
          island-v2-bulk-traits ingest \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --source-csv /tmp/austraits_all_bulk/prepared/selected_traits.csv \
            --output-dir /tmp/austraits_all_bulk/primary \
            --profiles-path config/bulk_trait_sources.yml \
            --profile-name austraits_all_primary \
            --source-name "$SOURCE_NAME" \
            --source-citation "$SOURCE_CITATION" \
            --source-url "$SOURCE_URL" | tee /tmp/austraits_all_bulk/primary_report.json
      - name: Ingest pollination functional guild separately
        run: |
          set -euo pipefail
          island-v2-bulk-traits ingest \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --source-csv /tmp/austraits_all_bulk/prepared/pollination_traits.csv \
            --output-dir /tmp/austraits_all_bulk/guild \
            --profiles-path config/bulk_trait_sources.yml \
            --profile-name austraits_all_pollinator_guild \
            --source-name "$SOURCE_NAME" \
            --source-citation "$SOURCE_CITATION" \
            --source-url "$SOURCE_URL" | tee /tmp/austraits_all_bulk/guild_report.json
      - name: Build combined compact candidate contract
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          import pandas as pd

          root = Path("/tmp/austraits_all_bulk")
          target = Path("data/v2/staging/traits/bulk/austraits_all")
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)

          fetch = json.loads((root / "fetch_manifest.json").read_text(encoding="utf-8"))
          reports = [
              json.loads((root / "primary_report.json").read_text(encoding="utf-8")),
              json.loads((root / "guild_report.json").read_text(encoding="utf-8")),
          ]
          candidates = pd.concat(
              [pd.read_csv(report["candidate_csv"], dtype=str).fillna("") for report in reports],
              ignore_index=True,
          ).drop_duplicates(
              subset=[
                  "accepted_species",
                  "trait_name",
                  "standardized_value",
                  "source_name",
                  "source_record_id",
              ],
              keep="first",
          )
          candidate_path = target / "trait_candidates.csv.gz"
          candidates.to_csv(candidate_path, index=False, compression="gzip")
          shutil.copy2(root / "fetch_manifest.json", target / "fetch_manifest.json")

          coverage = (
              candidates.groupby("trait_name")["accepted_species"]
              .nunique()
              .sort_values(ascending=False)
              .rename("n_species_with_direct_evidence")
              .reset_index()
          )
          coverage.to_csv(target / "coverage_by_trait.csv", index=False)
          candidate_species_by_trait = {
              str(row.trait_name): int(row.n_species_with_direct_evidence)
              for row in coverage.itertuples(index=False)
          }
          summary = {
              "version": "1.0",
              "source_name": reports[0]["source_name"],
              "release_version": fetch["release_version"],
              "release_doi": fetch["doi"],
              "archive_declared_checksum": fetch["archive_declared_checksum"],
              "archive_checksum_verified": fetch["archive_checksum_verified"],
              "archive_sha256": fetch["archive_sha256"],
              "n_selected_source_rows": fetch["standardized_rows"],
              "n_candidate_rows": int(len(candidates)),
              "n_species_with_any_direct_evidence": int(
                  candidates["accepted_species"].nunique()
              ),
              "candidate_species_by_trait": candidate_species_by_trait,
              "curation_rule": reports[0]["curation_rule"],
              "non_inference_rule": reports[0]["non_inference_rule"],
          }
          (target / "coverage_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Build all-master acquisition ledger
        run: |
          island-v2-acquisition-rate run \
            --config-path config/acquisition_rate.yml \
            --output-dir /tmp/austraits_all_bulk/acquisition_rate
      - name: Verify provenance, target semantics, and exhaustive accounting
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd

          root = Path("/tmp/austraits_all_bulk")
          target = Path("data/v2/staging/traits/bulk/austraits_all")
          fetch = json.loads((root / "fetch_manifest.json").read_text(encoding="utf-8"))
          summary = json.loads((target / "coverage_summary.json").read_text(encoding="utf-8"))
          ledger = json.loads(
              (root / "acquisition_rate" / "acquisition_rate_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          candidates = pd.read_csv(target / "trait_candidates.csv.gz", dtype=str).fillna("")

          assert fetch["archive_checksum_verified"] is True
          assert fetch["archive_sha256"]
          assert set(fetch["requested_trait_names"]) == {
              "flower_colour",
              "perianth_colour",
              "flower_perianth_symmetry",
              "sex_type",
              "pollination_syndrome",
              "pollination_system",
          }
          assert not candidates.empty
          assert set(candidates["trait_name"]) <= {
              "flower_primary_color",
              "floral_symmetry",
              "sex_system",
              "pollen_vector_mode",
              "pollination_functional_guild",
          }
          for column in ("source_record_id", "source_url", "evidence_excerpt"):
              assert candidates[column].ne("").all(), f"empty provenance column: {column}"
          assert ledger["n_master_species_accounted"] == 115_328
          assert ledger["n_species_trait_cells_accounted"] == 1_499_264

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## All-AusTraits target floral production\n\n")
              handle.write(f"- release: {fetch['release_version']} ({fetch['doi']})\n")
              handle.write(f"- selected source rows: {summary['n_selected_source_rows']:,}\n")
              handle.write(f"- candidate rows: {summary['n_candidate_rows']:,}\n")
              handle.write(
                  "- species with direct evidence: "
                  f"{summary['n_species_with_any_direct_evidence']:,}\n"
              )
              for trait, count in summary["candidate_species_by_trait"].items():
                  handle.write(f"- {trait}: {count:,} species\n")
              handle.write(
                  f"- master species accounted: {ledger['n_master_species_accounted']:,}\n"
              )
              handle.write(
                  "- species-trait cells accounted: "
                  f"{ledger['n_species_trait_cells_accounted']:,}\n"
              )
          PY
      - name: Upload candidates, audits, and all-master ledger
        uses: actions/upload-artifact@v4
        with:
          name: austraits-all-floral-bulk-${{ github.run_id }}
          path: |
            /tmp/austraits_all_bulk/
            data/v2/staging/traits/bulk/austraits_all/
          if-no-files-found: error
          retention-days: 90
