name: ingest_eol_traitbank_bulk

# Free high-throughput EOL path: PRs run focused fixture tests without downloading
# the full archive. Merging a workflow change to main runs the complete archive
# and records a compact, reviewable evidence bundle in the repository. Manual
# dispatch remains available for targeted reruns.
on:
  workflow_dispatch:
    inputs:
      eol_zip_url:
        description: "Direct EOL traits_all.zip URL."
        required: true
        default: "https://zenodo.org/records/13305577/files/traits_all.zip?download=1"
        type: string
      source_name:
        description: "Stable source/release name."
        required: true
        default: "eol_traitbank_all_zenodo_13305577"
        type: string
      expected_md5:
        description: "Expected MD5 from the Zenodo file record."
        required: true
        default: "17c8e3a9de5d3299d6151c16bb17600f"
        type: string
      chunksize:
        description: "traits.csv rows streamed per chunk."
        required: true
        default: 200000
        type: number
      max_trait_rows:
        description: "Smoke-test cap; 0 means full archive."
        required: true
        default: 0
        type: number
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ingest-eol-traitbank-bulk.yml"
      - "config/eol_traitbank_terms.yml"
      - "config/bulk_trait_sources.yml"
      - "config/acquisition_rate.yml"
      - "config/trait_ontology.yml"
      - "src/island_v2/acquisition_rate_report.py"
      - "src/island_v2/eol_traitbank.py"
      - "src/island_v2/bulk_trait_ingest.py"
      - "tests/test_acquisition_rate_report.py"
      - "tests/test_eol_traitbank.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-eol-traitbank-bulk.yml"

permissions:
  contents: write

concurrency:
  group: eol-traitbank-bulk-ingest-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      EOL_ZIP_URL: ${{ github.event.inputs.eol_zip_url || 'https://zenodo.org/records/13305577/files/traits_all.zip?download=1' }}
      SOURCE_NAME: ${{ github.event.inputs.source_name || 'eol_traitbank_all_zenodo_13305577' }}
      EXPECTED_MD5: ${{ github.event.inputs.expected_md5 || '17c8e3a9de5d3299d6151c16bb17600f' }}
      CHUNKSIZE: ${{ github.event.inputs.chunksize || '200000' }}
      MAX_TRAIT_ROWS: ${{ github.event_name == 'pull_request' && '500000' || github.event_name == 'push' && '0' || github.event.inputs.max_trait_rows || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Validate EOL inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          url = os.environ["EOL_ZIP_URL"].strip()
          if not re.match(r"^https?://", url):
              raise SystemExit("eol_zip_url must be an http(s) URL.")
          if not os.environ["SOURCE_NAME"].strip():
              raise SystemExit("source_name is required.")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", os.environ["EXPECTED_MD5"].strip()):
              raise SystemExit("expected_md5 must be 32 hexadecimal characters.")
          if int(os.environ["CHUNKSIZE"]) < 1:
              raise SystemExit("chunksize must be positive.")
          if int(os.environ["MAX_TRAIT_ROWS"]) < 0:
              raise SystemExit("max_trait_rows must be zero or positive.")
          PY
      - name: Run focused EOL tests
        run: |
          pytest -q \
            tests/test_eol_traitbank.py \
            tests/test_bulk_trait_ingest.py \
            tests/test_acquisition_rate_report.py
      - name: Restore EOL archive cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: /tmp/traits_all.zip
          key: eol-traits-all-${{ env.SOURCE_NAME }}-${{ env.EXPECTED_MD5 }}-verified-v1
      - name: Download EOL all-traits archive
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/eol_traitbank_bulk/download_sha
          df -h
          validate_archive() {
            local archive="$1"
            [[ -s "$archive" ]] || return 1
            printf '%s  %s\n' "$EXPECTED_MD5" "$archive" | md5sum --check --status || return 1
            unzip -tq "$archive" >/dev/null
          }
          if validate_archive /tmp/traits_all.zip; then
            echo "Using checksum- and CRC-verified cached EOL archive."
          else
            echo "Cached archive is absent or corrupt; downloading a clean temporary file."
            rm -f /tmp/traits_all.zip /tmp/traits_all.zip.part
            for attempt in 1 2 3; do
              rm -f /tmp/traits_all.zip.part
              if curl --fail --location --retry 3 --retry-delay 5 --max-time 3600 \
                --output /tmp/traits_all.zip.part "$EOL_ZIP_URL" \
                && validate_archive /tmp/traits_all.zip.part; then
                mv /tmp/traits_all.zip.part /tmp/traits_all.zip
                break
              fi
              echo "EOL archive download or integrity check failed (attempt ${attempt}/3)." >&2
            done
          fi
          validate_archive /tmp/traits_all.zip
          md5sum /tmp/traits_all.zip \
            | tee /tmp/eol_traitbank_bulk/download_sha/download_md5.txt
          sha256sum /tmp/traits_all.zip \
            | tee /tmp/eol_traitbank_bulk/download_sha/download_sha256.txt
          du -h /tmp/traits_all.zip
          df -h
      - name: Extract CRC-verified EOL archive
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          rm -rf /tmp/eol_traitbank_archive
          mkdir -p /tmp/eol_traitbank_archive
          unzip -q /tmp/traits_all.zip -d /tmp/eol_traitbank_archive
          TRAITS_CSV=$(find /tmp/eol_traitbank_archive -type f -name traits.csv -print -quit)
          test -n "$TRAITS_CSV"
          test -s "$TRAITS_CSV"
          du -sh /tmp/eol_traitbank_archive
          df -h
      - name: Convert EOL TraitBank terms to v2 long CSV
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          MAX_ARGS=()
          if [[ "$MAX_TRAIT_ROWS" != "0" ]]; then
            MAX_ARGS=(--max-trait-rows "$MAX_TRAIT_ROWS")
          fi
          island-v2-bulk-traits prepare-eol \
            --eol-archive /tmp/traits_all.zip \
            --eol-content-dir /tmp/eol_traitbank_archive \
            --output-dir /tmp/eol_traitbank_bulk/prepared \
            --config-path config/eol_traitbank_terms.yml \
            --ontology-path config/trait_ontology.yml \
            --source-name "$SOURCE_NAME" \
            --chunksize "$CHUNKSIZE" \
            "${MAX_ARGS[@]}" | tee /tmp/eol_traitbank_bulk/prepare_report.json
      - name: Join EOL long rows to island master and calculate coverage
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          island-v2-bulk-traits ingest \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --source-csv /tmp/eol_traitbank_bulk/prepared/eol_traitbank_v2_long.csv \
            --output-dir /tmp/eol_traitbank_bulk/ingested \
            --profiles-path config/bulk_trait_sources.yml \
            --profile-name v2_canonical_long_csv \
            --source-name "$SOURCE_NAME" \
            --source-citation "Encyclopedia of Life. All trait data. Zenodo record 13305577." \
            --source-url "https://zenodo.org/records/13305577" \
            | tee /tmp/eol_traitbank_bulk/ingest_report.json
      - name: Summarize EOL coverage
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          prepare = json.loads(Path("/tmp/eol_traitbank_bulk/prepare_report.json").read_text(encoding="utf-8"))
          ingest = json.loads(Path("/tmp/eol_traitbank_bulk/ingest_report.json").read_text(encoding="utf-8"))
          print("## EOL TraitBank bulk ingest")
          print(f"- event: {__import__('os').environ.get('GITHUB_EVENT_NAME', '')}")
          print(f"- max_trait_rows: {__import__('os').environ.get('MAX_TRAIT_ROWS', '')}")
          for key in (
              "n_trait_rows_scanned",
              "n_rows_with_mapped_predicate",
              "n_unmapped_predicate_rows",
              "n_unmapped_value_rows",
              "n_long_rows",
          ):
              print(f"- prepare.{key}: {prepare[key]}")
          for key in (
              "n_name_matched_rows",
              "n_unmatched_taxon_rows",
              "n_unmapped_value_rows",
              "n_candidate_rows",
              "n_species_with_any_direct_evidence",
              "n_master_species",
          ):
              print(f"- ingest.{key}: {ingest[key]}")
          coverage = pd.read_csv(ingest["coverage_by_trait_csv"])
          covered = coverage.loc[coverage["n_species_with_direct_evidence"].gt(0)].copy()
          print("\n### Covered mapped traits")
          if covered.empty:
              print("No mapped EOL rows matched the island master. Inspect the unmapped-term and name-match audits.")
          else:
              for _, row in covered.sort_values("n_species_with_direct_evidence", ascending=False).iterrows():
                  print(
                      f"- {row['trait_name']} ({row['analysis_role']}): "
                      f"{int(row['n_species_with_direct_evidence'])} species, "
                      f"{float(row['pct_master_species_covered']):.3f}% of master"
                  )
          PY
      - name: Build compact repository evidence bundle
        if: github.event_name != 'pull_request' && env.MAX_TRAIT_ROWS == '0'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git fetch origin main
            git checkout -B main origin/main
          fi
          python - <<'PY'
          import gzip
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path("/tmp/eol_traitbank_bulk")
          target = Path("data/v2/staging/traits/eol_traitbank")
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True, exist_ok=True)

          prepare = json.loads((root / "prepare_report.json").read_text(encoding="utf-8"))
          ingest = json.loads((root / "ingest_report.json").read_text(encoding="utf-8"))

          shutil.copy2(ingest["coverage_by_trait_csv"], target / "coverage_by_trait.csv")
          shutil.copy2(root / "download_sha" / "download_sha256.txt", target / "download_sha256.txt")

          bundle = {}
          max_bytes = 90 * 1024 * 1024
          files = {
              "trait_candidates.csv.gz": ingest["candidate_csv"],
              "coverage_by_family.csv.gz": ingest["coverage_by_family_csv"],
              "unmatched_taxa.csv.gz": ingest["unmatched_taxa_csv"],
              "unmapped_values.csv.gz": ingest["unmapped_values_csv"],
              "unmapped_eol_terms.csv.gz": prepare["unmapped_terms_csv"],
          }
          for output_name, source_name in files.items():
              source = Path(source_name)
              output = target / output_name
              with source.open("rb") as src, gzip.open(output, "wb", compresslevel=9) as dst:
                  shutil.copyfileobj(src, dst)
              size = output.stat().st_size
              if size > max_bytes:
                  output.unlink()
                  bundle[output_name] = {"persisted": False, "reason": "compressed file exceeded 90 MiB", "bytes": size}
              else:
                  bundle[output_name] = {"persisted": True, "bytes": size}

          summary = {
              "version": "1.0",
              "source_name": ingest["source_name"],
              "dataset_url": prepare["dataset_url"],
              "archive_sha256": prepare["eol_archive_sha256"],
              "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "github_sha": os.environ.get("GITHUB_SHA", ""),
              "n_trait_rows_scanned": prepare["n_trait_rows_scanned"],
              "n_rows_with_mapped_predicate": prepare["n_rows_with_mapped_predicate"],
              "n_unmapped_predicate_rows": prepare["n_unmapped_predicate_rows"],
              "n_unmapped_value_rows_prepare": prepare["n_unmapped_value_rows"],
              "n_long_rows": prepare["n_long_rows"],
              "n_name_matched_rows": ingest["n_name_matched_rows"],
              "n_unmatched_taxon_rows": ingest["n_unmatched_taxon_rows"],
              "n_unmapped_value_rows_ingest": ingest["n_unmapped_value_rows"],
              "n_candidate_rows": ingest["n_candidate_rows"],
              "n_species_with_any_direct_evidence": ingest["n_species_with_any_direct_evidence"],
              "n_master_species": ingest["n_master_species"],
              "bundle_files": bundle,
              "curation_rule": ingest["curation_rule"],
              "non_inference_rule": ingest["non_inference_rule"],
          }
          (target / "coverage_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Build all-master acquisition ledger
        if: github.event_name != 'pull_request' && env.MAX_TRAIT_ROWS == '0'
        run: |
          set -euo pipefail
          island-v2-acquisition-rate run \
            --config-path config/acquisition_rate.yml \
            --output-dir /tmp/eol_traitbank_bulk/acquisition_rate
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          summary = json.loads(
              Path("/tmp/eol_traitbank_bulk/acquisition_rate/acquisition_rate_summary.json")
              .read_text(encoding="utf-8")
          )
          print("\n### All-master acquisition ledger")
          print(f"- master species accounted: {summary['n_master_species_accounted']}")
          print(f"- species-trait cells accounted: {summary['n_species_trait_cells_accounted']}")
          for status, count in summary["species_acquisition_status_counts"].items():
              print(f"- {status}: {count}")
          PY
      - name: Commit full-run coverage bundle
        if: github.event_name == 'push' && env.MAX_TRAIT_ROWS == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v2/staging/traits/eol_traitbank
          if git diff --cached --quiet; then
            echo "No EOL evidence-bundle changes to commit."
            exit 0
          fi
          git commit -m "chore: record EOL TraitBank coverage [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update; rebasing attempt ${attempt}."
            git pull --rebase origin main
          done
          echo "Could not push EOL coverage bundle after three attempts." >&2
          exit 1
      - name: Upload EOL candidates and audits
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: eol-traitbank-bulk-${{ github.run_id }}
          path: /tmp/eol_traitbank_bulk/
          if-no-files-found: error
          retention-days: 90
