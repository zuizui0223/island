name: Acquire GIFT direct floral traits

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ingest-gift-direct-traits.yml"
      - "config/bulk_trait_sources.yml"
      - "config/trait_ontology.yml"
      - "src/island_v2/fetch_gift_traits.py"
      - "src/island_v2/bulk_trait_ingest.py"
      - "tests/test_fetch_gift_traits.py"
      - "tests/test_bulk_trait_ingest.py"

permissions:
  contents: read

concurrency:
  group: gift-direct-traits-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused dependencies
        run: pip install -e ".[dev]"
      - name: Test GIFT mapping, evidence, and bulk-ingest contracts
        run: |
          pytest -q \
            tests/test_fetch_gift_traits.py \
            tests/test_bulk_trait_ingest.py

  acquire:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Fetch version-pinned public non-derived GIFT records
        run: |
          island-v2-fetch-gift-traits run \
            --output-dir /tmp/gift/prepared \
            --version 3.2 \
            --max-workers 4 \
            | tee /tmp/gift/fetch_stdout.json
      - name: Match canonical rows to the complete Island master
        run: |
          island-v2-bulk-traits ingest \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --source-csv /tmp/gift/prepared/gift_prepared_canonical_long.csv.gz \
            --output-dir data/v2/staging/traits/bulk/gift_v3_2 \
            --profiles-path config/bulk_trait_sources.yml \
            --profile-name v2_canonical_long_csv \
            --source-name gift_v3_2_direct \
            | tee /tmp/gift/ingest_stdout.json
      - name: Verify evidence completeness and report production coverage
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd

          root = Path("/tmp/gift/prepared")
          manifest = json.loads((root / "gift_fetch_manifest.json").read_text(encoding="utf-8"))
          ingest = json.loads(Path("/tmp/gift/ingest_stdout.json").read_text(encoding="utf-8"))
          candidates = pd.read_csv(ingest["candidate_csv"], dtype=str).fillna("")

          assert manifest["gift_version"] == "3.2"
          assert manifest["n_raw_api_rows"] > 0
          assert manifest["n_prepared_canonical_rows"] > 0
          assert ingest["n_master_species"] == 115_328
          assert ingest["n_candidate_rows"] == len(candidates) > 0
          required = [
              "accepted_species",
              "trait_name",
              "standardized_value",
              "source_url",
              "source_record_id",
              "evidence_excerpt",
          ]
          assert not candidates[required].apply(lambda column: column.str.strip().eq("").any()).any()

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## GIFT 3.2 direct public traits\n\n")
              handle.write(f"- raw API records archived: {manifest['n_raw_api_rows']:,}\n")
              handle.write(f"- Island-matched candidate rows: {len(candidates):,}\n")
              handle.write(
                  f"- Island species with direct evidence: "
                  f"{candidates['accepted_species'].nunique():,} / 115,328\n"
              )
              for trait, count in (
                  candidates.groupby("trait_name")["accepted_species"]
                  .nunique()
                  .sort_values(ascending=False)
                  .items()
              ):
                  handle.write(f"- {trait}: {count:,} species\n")
              handle.write("\nExcluded records remain in the uploaded audit; no missing value is inferred.\n")
          PY
      - name: Upload exact API records, audits, metadata, and Island candidates
        uses: actions/upload-artifact@v4
        with:
          name: gift-direct-traits-${{ github.run_id }}
          path: |
            /tmp/gift/
            data/v2/staging/traits/bulk/gift_v3_2/
          if-no-files-found: error
          retention-days: 90
