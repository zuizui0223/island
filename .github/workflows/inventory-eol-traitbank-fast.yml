name: inventory_eol_traitbank_fast

on:
  # Auto-triggers paused: manual dispatch only while the final
  # cross-source trait pilot is being stabilized.
  workflow_dispatch:
permissions:
  contents: write

# Supersede a slower all-column inventory run with the column-pruned scanner.
concurrency:
  group: inventory-eol-traitbank
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test fast inventory and contracts
        run: |
          pytest -q \
            tests/test_eol_traitbank_inventory_fast.py \
            tests/test_eol_traitbank_inventory.py
          python -m island_v2.eol_traitbank_inventory_fast --help >/dev/null
          python scripts/validate_workflows.py
          ruff check \
            src/island_v2/eol_traitbank_inventory_fast.py \
            tests/test_eol_traitbank_inventory_fast.py

  full-inventory:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EOL_ZIP_URL: "https://zenodo.org/records/13305577/files/traits_all.zip?download=1"
      MAX_TRAIT_ROWS: ${{ github.event.inputs.max_trait_rows || '0' }}
      INVENTORY_DIR: /tmp/eol_traitbank_inventory_fast
      REPO_OUTPUT_DIR: data/v2/staging/traits/eol_traitbank_inventory
      INVENTORY_LOG: /tmp/eol_traitbank_inventory_fast.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Restore EOL archive cache
        uses: actions/cache@v4
        with:
          path: /tmp/traits_all.zip
          key: eol-traits-all-zenodo-13305577-v2
      - name: Download EOL all-traits archive
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/traits_all.zip ]]; then
            curl --fail --location --retry 3 --retry-delay 5 --max-time 3600 \
              --output /tmp/traits_all.zip "$EOL_ZIP_URL"
          else
            echo "Using cached EOL archive."
          fi
          test -s /tmp/traits_all.zip
          sha256sum /tmp/traits_all.zip
          du -h /tmp/traits_all.zip
      - name: Scan selected EOL columns
        id: scan
        continue-on-error: true
        run: |
          set -o pipefail
          : > "$INVENTORY_LOG"
          MAX_ARGS=()
          if [[ "$MAX_TRAIT_ROWS" != "0" ]]; then
            MAX_ARGS=(--max-trait-rows "$MAX_TRAIT_ROWS")
          fi
          python -m island_v2.eol_traitbank_inventory_fast \
            --eol-archive /tmp/traits_all.zip \
            --output-dir "$INVENTORY_DIR" \
            --config-path config/eol_traitbank_terms.yml \
            --chunksize 100000 \
            --max-values-per-predicate 250 \
            "${MAX_ARGS[@]}" \
            2>&1 | tee "$INVENTORY_LOG" | tee /tmp/eol_fast_inventory_report.json
      - name: Build successful repository inventory
        if: steps.scan.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf "$REPO_OUTPUT_DIR"
          mkdir -p "$REPO_OUTPUT_DIR"
          cp "$INVENTORY_DIR"/eol_predicate_inventory.csv "$REPO_OUTPUT_DIR"/
          cp "$INVENTORY_DIR"/eol_relevant_value_inventory.csv "$REPO_OUTPUT_DIR"/
          cp "$INVENTORY_DIR"/eol_relevant_terms.csv "$REPO_OUTPUT_DIR"/
          cp "$INVENTORY_DIR"/eol_inventory_manifest.json "$REPO_OUTPUT_DIR"/
          sha256sum /tmp/traits_all.zip > "$REPO_OUTPUT_DIR"/download_sha256.txt
          rm -f \
            data/v2/staging/traits/eol_traitbank_inventory_failure.json \
            data/v2/staging/traits/eol_traitbank_inventory_failure.log
      - name: Record failed fast inventory
        if: steps.scan.outcome == 'failure'
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p data/v2/staging/traits
          tail -n 300 "$INVENTORY_LOG" \
            > data/v2/staging/traits/eol_traitbank_inventory_failure.log || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "status": "eol_traitbank_fast_inventory_failed",
              "run_id": os.environ["RUN_ID"],
              "source_sha": os.environ["SOURCE_SHA"],
              "max_trait_rows": int(os.environ["MAX_TRAIT_ROWS"]),
              "chunksize": 100000,
              "failure_log": (
                  "data/v2/staging/traits/"
                  "eol_traitbank_inventory_failure.log"
              ),
              "interpretation": (
                  "Pipeline failure is not evidence that EOL lacks target traits."
              ),
          }
          Path(
              "data/v2/staging/traits/eol_traitbank_inventory_failure.json"
          ).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Publish inventory summary
        if: steps.scan.outcome == 'success'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "/tmp/eol_traitbank_inventory_fast/"
                  "eol_inventory_manifest.json"
              ).read_text(encoding="utf-8")
          )
          print("## Column-pruned EOL predicate inventory")
          for key, value in report.items():
              if not key.endswith("_csv") and key != "interpretation":
                  print(f"- {key}: {value}")
          print("")
          print(report["interpretation"])
          PY
      - name: Commit inventory state
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/v2/staging/traits/eol_traitbank_inventory \
            data/v2/staging/traits/eol_traitbank_inventory_failure.json \
            data/v2/staging/traits/eol_traitbank_inventory_failure.log \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No fast EOL inventory state change."
            exit 0
          fi
          if test -f data/v2/staging/traits/eol_traitbank_inventory_failure.json; then
            git commit -m "chore: record EOL predicate inventory failure"
          else
            git commit -m "chore: record EOL predicate inventory [skip ci]"
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
      - name: Upload fast inventory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eol-traitbank-fast-inventory-${{ github.run_id }}
          path: |
            /tmp/eol_traitbank_inventory_fast/
            /tmp/eol_traitbank_inventory_fast.log
          if-no-files-found: warn
          retention-days: 90
      - name: Fail after diagnostic state is persisted
        if: steps.scan.outcome == 'failure'
        run: exit 1
