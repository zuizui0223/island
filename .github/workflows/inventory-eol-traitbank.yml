name: inventory_eol_traitbank

on:
  workflow_dispatch:
    inputs:
      eol_zip_url:
        description: "Direct EOL traits_all.zip URL."
        required: true
        default: "https://zenodo.org/records/13305577/files/traits_all.zip?download=1"
        type: string
      max_trait_rows:
        description: "Optional row cap; 0 scans the full traits table."
        required: true
        default: 0
        type: number
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/inventory-eol-traitbank.yml"
      - "src/island_v2/eol_traitbank_inventory.py"
      - "tests/test_eol_traitbank_inventory.py"
      - "config/eol_traitbank_terms.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-eol-traitbank.yml"
      - "src/island_v2/eol_traitbank_inventory.py"
      - "tests/test_eol_traitbank_inventory.py"
      - "config/eol_traitbank_terms.yml"

permissions:
  contents: write

concurrency:
  group: inventory-eol-traitbank
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test bounded-memory predicate inventory
        run: pytest -q tests/test_eol_traitbank_inventory.py tests/test_eol_traitbank.py
      - name: Validate workflow and lint contracts
        run: |
          python scripts/validate_workflows.py
          ruff check \
            src/island_v2/eol_traitbank_inventory.py \
            tests/test_eol_traitbank_inventory.py

  full-inventory:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EOL_ZIP_URL: ${{ github.event.inputs.eol_zip_url || 'https://zenodo.org/records/13305577/files/traits_all.zip?download=1' }}
      MAX_TRAIT_ROWS: ${{ github.event.inputs.max_trait_rows || '0' }}
      INVENTORY_DIR: /tmp/eol_traitbank_inventory
      REPO_OUTPUT_DIR: data/v2/staging/traits/eol_traitbank_inventory
      INVENTORY_LOG: /tmp/eol_traitbank_inventory.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Restore EOL archive cache
        uses: actions/cache@v4
        with:
          path: /tmp/traits_all.zip
          key: eol-traits-all-zenodo-13305577-v2
      - name: Download EOL all-traits archive
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/traits_all.zip ]]; then
            curl --fail --location --retry 3 --retry-delay 5 --max-time 3600 \
              --output /tmp/traits_all.zip "$EOL_ZIP_URL"
          else
            echo "Using cached EOL archive."
          fi
          test -s /tmp/traits_all.zip
          sha256sum /tmp/traits_all.zip
          du -h /tmp/traits_all.zip
          df -h
      - name: Scan EOL predicates and relevant values
        id: scan
        continue-on-error: true
        run: |
          set -o pipefail
          : > "$INVENTORY_LOG"
          MAX_ARGS=()
          if [[ "$MAX_TRAIT_ROWS" != "0" ]]; then
            MAX_ARGS=(--max-trait-rows "$MAX_TRAIT_ROWS")
          fi
          # The EOL table expands to roughly 1.9 GB. A 500k-row all-column
          # pandas chunk can exceed hosted-runner memory, so use 100k chunks.
          python -m island_v2.eol_traitbank_inventory scan \
            --eol-archive /tmp/traits_all.zip \
            --output-dir "$INVENTORY_DIR" \
            --config-path config/eol_traitbank_terms.yml \
            --chunksize 100000 \
            --max-values-per-predicate 250 \
            "${MAX_ARGS[@]}" \
            2>&1 | tee "$INVENTORY_LOG" | tee /tmp/eol_inventory_report.json
      - name: Publish EOL inventory summary
        if: steps.scan.outcome == 'success'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          manifest = json.loads(
              Path("/tmp/eol_traitbank_inventory/eol_inventory_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          predicates = pd.read_csv(
              "/tmp/eol_traitbank_inventory/eol_predicate_inventory.csv"
          )
          print("## EOL TraitBank full predicate inventory")
          for key in (
              "n_trait_rows_scanned",
              "n_terms",
              "n_observed_predicates",
              "n_currently_mapped_predicates_observed",
              "n_relevant_predicates_observed",
              "n_relevant_value_rows_retained",
          ):
              print(f"- {key}: {manifest[key]}")
          relevant = predicates.loc[
              predicates["currently_mapped"].astype(bool)
              | predicates["discovery_keyword_match"].astype(bool)
          ].sort_values("n_rows", ascending=False)
          print("\n### Relevant observed predicates")
          if relevant.empty:
              print(
                  "No relevant predicate was observed; inspect the complete "
                  "inventory before changing mappings."
              )
          else:
              for _, row in relevant.head(100).iterrows():
                  print(
                      f"- {row['predicate_label']} — {row['predicate']}: "
                      f"{int(row['n_rows'])} rows; "
                      f"mapped={bool(row['currently_mapped'])}"
                  )
          PY
      - name: Build successful repository inventory
        if: steps.scan.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf "$REPO_OUTPUT_DIR"
          mkdir -p "$REPO_OUTPUT_DIR"
          cp "$INVENTORY_DIR"/eol_predicate_inventory.csv "$REPO_OUTPUT_DIR"/
          cp "$INVENTORY_DIR"/eol_relevant_value_inventory.csv "$REPO_OUTPUT_DIR"/
          cp "$INVENTORY_DIR"/eol_relevant_terms.csv "$REPO_OUTPUT_DIR"/
          cp "$INVENTORY_DIR"/eol_inventory_manifest.json "$REPO_OUTPUT_DIR"/
          sha256sum /tmp/traits_all.zip > "$REPO_OUTPUT_DIR"/download_sha256.txt
          rm -f \
            data/v2/staging/traits/eol_traitbank_inventory_failure.json \
            data/v2/staging/traits/eol_traitbank_inventory_failure.log
      - name: Record failed inventory for diagnosis
        if: steps.scan.outcome == 'failure'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p data/v2/staging/traits
          tail -n 300 "$INVENTORY_LOG" \
            > data/v2/staging/traits/eol_traitbank_inventory_failure.log || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path("data/v2/staging/traits/eol_traitbank_inventory_failure.json")
          payload = {
              "status": "eol_traitbank_inventory_failed",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "source_sha": os.environ["SOURCE_SHA"],
              "max_trait_rows": int(os.environ["MAX_TRAIT_ROWS"]),
              "chunksize": 100000,
              "failure_log": (
                  "data/v2/staging/traits/"
                  "eol_traitbank_inventory_failure.log"
              ),
              "interpretation": (
                  "This is an acquisition-pipeline failure, not evidence that "
                  "EOL lacks reproductive, floral, or pollination traits."
              ),
          }
          target.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Publish failed inventory summary
        if: steps.scan.outcome == 'failure'
        run: |
          echo "## EOL TraitBank inventory failed" >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/traits/eol_traitbank_inventory_failure.json \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/traits/eol_traitbank_inventory_failure.log \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit inventory state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/v2/staging/traits/eol_traitbank_inventory \
            data/v2/staging/traits/eol_traitbank_inventory_failure.json \
            data/v2/staging/traits/eol_traitbank_inventory_failure.log \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No EOL predicate inventory state change."
            exit 0
          fi
          if test -f data/v2/staging/traits/eol_traitbank_inventory_failure.json; then
            git commit -m "chore: record EOL predicate inventory failure"
          else
            git commit -m "chore: record EOL predicate inventory [skip ci]"
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced; rebasing inventory commit (attempt ${attempt})."
            git pull --rebase origin main
          done
          exit 1
      - name: Upload complete predicate inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eol-traitbank-inventory-${{ github.run_id }}
          path: |
            /tmp/eol_traitbank_inventory/
            /tmp/eol_traitbank_inventory.log
          if-no-files-found: warn
          retention-days: 90
      - name: Fail after inventory state is persisted
        if: steps.scan.outcome == 'failure'
        run: exit 1
