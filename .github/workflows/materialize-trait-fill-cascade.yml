name: materialize_trait_fill_cascade

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-trait-fill-cascade.yml"
      - "src/island_v2/trait_fill_cascade.py"
      - "src/island_v2/angiosperm_scope.py"
      - "config/trait_fill_cascade.yml"
      - "config/trait_ontology.yml"
      - "config/angiosperm_scope.yml"
      - "data/v2/staging/traits/llm_evidence_extracted/**"
  workflow_dispatch:
    inputs:
      allmaster_run_id:
        description: Successful all-master run whose exact artifact must be materialized
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: materialize-trait-fill-cascade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Restore newest durable source-backed ledger
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ inputs.allmaster_run_id || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_HEAD_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
        run: |
          set -euo pipefail
          download=/tmp/latest_allmaster
          rm -rf "$download"
          mkdir -p "$download"

          source_run_id="$TRIGGER_RUN_ID"
          source_branch=""

          find_usable_run() {
            local branch="$1"
            while IFS= read -r candidate; do
              [[ "$candidate" =~ ^[0-9]+$ ]] || continue
              expected="all-master-trait-ledger-$candidate"
              if gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.expired == false and .name == \"$expected\") | .id" \
                | grep -Eq '^[0-9]+$'; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done < <(
              gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow build-all-master-trait-ledger.yml \
                --branch "$branch" --status success --limit 100 \
                --json databaseId --jq '.[].databaseId'
            )
            return 1
          }

          if [[ -z "$source_run_id" && -n "$PR_HEAD_BRANCH" ]]; then
            source_run_id="$(find_usable_run "$PR_HEAD_BRANCH" || true)"
            if [[ -n "$source_run_id" ]]; then
              source_branch="$PR_HEAD_BRANCH"
            fi
          fi

          if [[ -z "$source_run_id" ]]; then
            source_run_id="$(find_usable_run "$DEFAULT_BRANCH" || true)"
            if [[ -n "$source_run_id" ]]; then
              source_branch="$DEFAULT_BRANCH"
              echo "Using latest durable all-master artifact from default branch $DEFAULT_BRANCH." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [[ -z "$source_run_id" ]]; then
            echo "No successful all-master ledger artifact is available on PR head or $DEFAULT_BRANCH." >&2
            exit 1
          fi

          run_metadata="$(gh run view "$source_run_id" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headBranch,workflowName)"
          test "$(jq -r .conclusion <<<"$run_metadata")" = "success"
          actual_branch="$(jq -r .headBranch <<<"$run_metadata")"
          if [[ -n "$source_branch" ]]; then
            test "$actual_branch" = "$source_branch"
          fi

          artifact_name="all-master-trait-ledger-$source_run_id"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .name == \"$artifact_name\") | .id" \
            | grep -Eq '^[0-9]+$'
          gh run download "$source_run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir "$download"

          source_root=$(find "$download" -type d -path '*/data/v2/staging/traits' | sed -n '1p')
          evidence_file=$(find "$download" -type f \
            -path '*/all_master_trait_ledger/all_species_trait_evidence.csv.gz' | sed -n '1p')
          test -n "$source_root"
          test -n "$evidence_file"

          SOURCE_ROOT="$source_root" EVIDENCE_FILE="$evidence_file" python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          source_root = Path(os.environ["SOURCE_ROOT"])
          config = yaml.safe_load(Path("config/trait_fill_cascade.yml").read_text())
          sources = config["evidence_sources"]
          sources["durable_allmaster_reported"]["glob"] = os.environ["EVIDENCE_FILE"]
          sources["efloras_direct"]["glob"] = str(source_root / "efloras" / "**" / "trait_candidates.csv*")
          sources["eol_traitbank_direct"]["glob"] = str(source_root / "eol_traitbank" / "**" / "trait_candidates.csv*")
          sources["bulk_trait"]["glob"] = str(source_root / "bulk" / "**" / "trait_candidates.csv*")
          Path("/tmp/trait_fill_cascade_resolved.yml").write_text(
              yaml.safe_dump(config, sort_keys=False), encoding="utf-8"
          )
          PY

          echo "CASCADE_CONFIG_PATH=/tmp/trait_fill_cascade_resolved.yml" >> "$GITHUB_ENV"
          echo "ISLAND_ALLMASTER_SOURCE_RUN_ID=$source_run_id" >> "$GITHUB_ENV"
          echo "Restored all-master source run $source_run_id from branch $actual_branch." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Normalize legacy LLM extraction bundle IDs
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path("data/v2/staging/traits/llm_evidence_extracted")
          updated = []
          for bundle in sorted(path for path in root.glob("**/llm_ingest_manifest.json")):
              bundle_dir = bundle.parent
              manifest = json.loads(bundle.read_text(encoding="utf-8"))
              candidates_path = bundle_dir / manifest["accepted_csv_filename"]
              if not candidates_path.is_file():
                  continue

              run_material = "|".join(
                  str(manifest.get(key, ""))
                  for key in (
                      "model_provider",
                      "model_id",
                      "prompt_sha256",
                      "packet_input_sha256",
                      "result_jsonl_sha256",
                  )
              )
              expected_run_id = "llm_" + hashlib.sha256(
                  run_material.encode("utf-8")
              ).hexdigest()[:20]
              if manifest.get("extraction_run_id") == expected_run_id:
                  continue

              with candidates_path.open(newline="", encoding="utf-8") as handle:
                  rows = list(csv.DictReader(handle))
                  fieldnames = list(rows[0].keys()) if rows else []
              if "extraction_run_id" not in fieldnames:
                  raise RuntimeError(f"missing extraction_run_id column: {candidates_path}")
              for row in rows:
                  row["extraction_run_id"] = expected_run_id

              temporary = candidates_path.with_suffix(candidates_path.suffix + ".tmp")
              with temporary.open("w", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator="\n")
                  writer.writeheader()
                  writer.writerows(rows)
              temporary.replace(candidates_path)

              manifest["extraction_run_id"] = expected_run_id
              manifest["accepted_csv_sha256"] = hashlib.sha256(
                  candidates_path.read_bytes()
              ).hexdigest()
              bundle.write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              updated.append(str(bundle_dir))

          print(json.dumps({"normalized_bundles": updated}, indent=2))
          PY

      - name: Materialize all current shards
        run: |
          set -euo pipefail
          OUT="data/v2/staging/traits/fill_cascade"
          island-v2-trait-fill-cascade run \
            --config-path "$CASCADE_CONFIG_PATH" --output-dir "$OUT"
          island-v2-trait-fill-cascade status \
            --config-path "$CASCADE_CONFIG_PATH" --output-dir "$OUT"

      - name: Verify evidence-grounded matrix
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd
          import yaml

          out = Path("data/v2/staging/traits/fill_cascade")
          summary = json.loads((out / "fill_coverage_summary.json").read_text())
          manifest = json.loads((out / "cascade_manifest.json").read_text())
          config = yaml.safe_load(Path(os.environ["CASCADE_CONFIG_PATH"]).read_text())

          assert manifest["shards_complete"] is True, manifest
          assert manifest["n_shards_current"] == manifest["shard_count"] == 128, manifest
          assert summary["n_angiosperm_eligible"] == 106295, summary
          assert set(summary["by_trait"]) == set(config["target_traits"]), summary
          assert summary["n_target_traits"] == len(config["target_traits"]), summary
          assert summary["direct_evidence_audit"]["n_ontology_invalid"] == 0, summary
          assert manifest["upstream_allmaster_run_id"], manifest
          assert "global_fallback" not in summary["fills_by_tier"], summary

          shard_files = sorted(out.glob("shards/shard_*/fills.csv.gz"))
          assert len(shard_files) == 128, len(shard_files)
          allowed_tiers = {
              "species_direct",
              "synonym_direct",
              "genus_inference",
              "family_inference",
              "unresolved_no_evidence",
          }
          all_species = set()
          total_rows = 0
          for shard_file in shard_files:
              frame = pd.read_csv(shard_file, dtype=str).fillna("")
              assert not frame.duplicated(["accepted_species", "trait_name"]).any()
              assert set(frame["fill_tier"]).issubset(allowed_tiers), set(frame["fill_tier"])
              all_species.update(frame["accepted_species"])
              total_rows += len(frame)
          assert len(all_species) == 106295, len(all_species)
          assert total_rows == 106295 * len(config["target_traits"]), total_rows
          PY

      - name: Build checksums and archive
        run: |
          set -euo pipefail
          OUT="data/v2/staging/traits/fill_cascade"
          (
            cd "$OUT"
            find shards -type f \( -name 'fills.csv.gz' -o -name 'shard_checkpoint.json' \) -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum fill_coverage_summary.json cascade_manifest.json benchmark_sample.csv angiosperm_scope_by_species.csv >> SHA256SUMS
          )
          tar -C data/v2/staging/traits -czf trait-fill-cascade-full.tgz fill_cascade
          sha256sum trait-fill-cascade-full.tgz > trait-fill-cascade-full.tgz.sha256

      - name: Upload full materialized dataset
        uses: actions/upload-artifact@v4
        with:
          name: trait-fill-cascade-full-${{ github.sha }}
          path: |
            trait-fill-cascade-full.tgz
            trait-fill-cascade-full.tgz.sha256
            data/v2/staging/traits/fill_cascade/SHA256SUMS
            data/v2/staging/traits/fill_cascade/cascade_manifest.json
            data/v2/staging/traits/fill_cascade/fill_coverage_summary.json
          if-no-files-found: error
          retention-days: 90
