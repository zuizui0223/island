name: Measure island-weighted acquisition value

# Two jobs, deliberately split:
#
# `validate` runs on every pull request and needs no network beyond pip. It
# proves the tooling is correct and rebuilds the planning frontier from the
# frozen flora artifacts already in the repository.
#
# `measure` is dispatch-only because it must download a pinned evidence
# artifact. It answers the question the strategy actually turns on: how many
# islands are analysis-ready right now, under direct evidence only.

on:
  pull_request:
    paths:
      - ".github/workflows/measure-island-weighted-acquisition.yml"
      - "config/island_weighted_acquisition.yml"
      - "src/island_v2/island_weighted_acquisition_value.py"
      - "src/island_v2/anemophilous_clade_rule.py"
      - "tests/test_island_weighted_acquisition_value.py"
      - "tests/test_anemophilous_clade_rule.py"
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "Run ID of the integrated coverage artifact to score"
        required: true
      evidence_artifact_name:
        description: "Artifact name containing the accepted evidence ledger"
        required: true
      evidence_member:
        description: "Path inside the artifact to the accepted evidence CSV"
        required: false
        default: "accepted_lineage_ledger.csv.gz"

permissions:
  actions: read
  contents: read

concurrency:
  group: island-weighted-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint and test
        run: |
          ruff check \
            src/island_v2/island_weighted_acquisition_value.py \
            src/island_v2/anemophilous_clade_rule.py \
            tests/test_island_weighted_acquisition_value.py \
            tests/test_anemophilous_clade_rule.py
          pytest -q \
            tests/test_island_weighted_acquisition_value.py \
            tests/test_anemophilous_clade_rule.py

      - name: Rebuild the planning frontier from frozen flora artifacts
        run: |
          island-v2-acquisition-value run \
            --config config/island_weighted_acquisition.yml \
            --output-dir /tmp/acquisition-value

      - uses: actions/upload-artifact@v4
        with:
          name: island-weighted-acquisition-frontier-${{ github.run_id }}
          path: /tmp/acquisition-value
          retention-days: 90

  measure:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Resolve and download the pinned evidence artifact
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api \
            "/repos/${GH_REPO}/actions/runs/${{ inputs.evidence_run_id }}/artifacts" \
            --jq ".artifacts[] | select(.name==\"${{ inputs.evidence_artifact_name }}\") | .id" \
            | head -n 1)
          test -n "$ARTIFACT_ID"
          echo "resolved artifact id: $ARTIFACT_ID"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/evidence.zip
          sha256sum /tmp/evidence.zip
          mkdir -p /tmp/evidence
          unzip -q /tmp/evidence.zip -d /tmp/evidence

      - name: Locate the accepted evidence ledger
        run: |
          set -euo pipefail
          LEDGER=$(find /tmp/evidence -name "${{ inputs.evidence_member }}" -print -quit)
          test -n "$LEDGER"
          echo "EVIDENCE_LEDGER=$LEDGER" >> "$GITHUB_ENV"

      - name: Score analysis-ready islands, direct-only against sensitivity
        run: |
          island-v2-acquisition-value evaluate \
            --config config/island_weighted_acquisition.yml \
            --evidence-csv "$EVIDENCE_LEDGER" \
            --output-dir /tmp/island-readiness

      - name: Score declared anemophilous clade rules
        run: |
          island-v2-anemophilous-clade-rule build \
            --config config/island_weighted_acquisition.yml \
            --evidence-csv "$EVIDENCE_LEDGER" \
            --output-dir /tmp/clade-rules

      - uses: actions/upload-artifact@v4
        with:
          name: island-weighted-acquisition-measurement-${{ github.run_id }}
          path: |
            /tmp/island-readiness
            /tmp/clade-rules
          retention-days: 90
