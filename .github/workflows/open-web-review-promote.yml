      - name: Download baseline and the exact acquisition artifact
        run: |
          mkdir -p \
            /tmp/open-web-baseline \
            /tmp/open-web-pilot \
            /tmp/open-web-prior
          gh run download "$BASELINE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "integrated-trait-coverage-$BASELINE_RUN_ID" \
            --dir /tmp/open-web-baseline
          gh run download "$PILOT_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$PILOT_ARTIFACT_NAME" \
            --dir /tmp/open-web-pilot
          gh run download "$PRIOR_PUBLIC_WEB_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$PRIOR_PUBLIC_WEB_ARTIFACT" \
            --dir /tmp/open-web-prior
          test -f "/tmp/open-web-pilot/$CANDIDATE_FILE_NAME"
          test -f "/tmp/open-web-prior/$PRIOR_PUBLIC_WEB_FILE_NAME"
          test -f "/tmp/open-web-prior/$PRIOR_PUBLIC_WEB_SUPPLEMENT_FILE_NAME"
          test -f "$AUDIT_CSV_PATH"
          test -f "$DIRECT_EVIDENCE_EXCLUSIONS_CSV_PATH"
          if [[ -n "$CURATED_EVIDENCE_CSV_PATH" ]]; then
            test -n "$CURATED_AUDIT_CSV_PATH"
            test -f "$CURATED_EVIDENCE_CSV_PATH"
            test -f "$CURATED_AUDIT_CSV_PATH"
          elif [[ -n "$CURATED_AUDIT_CSV_PATH" ]]; then
            echo "curated audit was supplied without curated evidence" >&2
            exit 1
          fi
          if [[ -n "$SOURCE_PACKAGE_EVIDENCE_CSV_PATH" ]]; then
            test -n "$SOURCE_PACKAGE_AUDIT_CSV_PATH"
            test -f "$SOURCE_PACKAGE_EVIDENCE_CSV_PATH"
            test -f "$SOURCE_PACKAGE_AUDIT_CSV_PATH"
          elif [[ -n "$SOURCE_PACKAGE_AUDIT_CSV_PATH" ]]; then
            echo "source-package audit was supplied without evidence" >&2
            exit 1
          fi
      - name: Promote approved domain-trait scopes and recalculate coverage
        run: |
          mkdir -p outputs/reviewed_open_web
          curated_args=()
          if [[ -n "$CURATED_EVIDENCE_CSV_PATH" ]]; then
            curated_args=(
              --curated-evidence-csv "$CURATED_EVIDENCE_CSV_PATH"
              --curated-audit-csv "$CURATED_AUDIT_CSV_PATH"
              --curated-source-run-id "$CURATED_SOURCE_RUN_ID"
              --curated-source-artifact "$CURATED_SOURCE_ARTIFACT"
            )
          fi
          source_package_args=()
          if [[ -n "$SOURCE_PACKAGE_EVIDENCE_CSV_PATH" ]]; then
            source_package_args=(
              --source-package-evidence-csv "$SOURCE_PACKAGE_EVIDENCE_CSV_PATH"
              --source-package-audit-csv "$SOURCE_PACKAGE_AUDIT_CSV_PATH"
              --source-package-run-id "$SOURCE_PACKAGE_RUN_ID"
              --source-package-artifact "$SOURCE_PACKAGE_ARTIFACT"
            )
          fi
          python -m island_v2.open_web_finalize \
            --baseline-dir /tmp/open-web-baseline \
            --candidates-csv \
              "/tmp/open-web-pilot/$CANDIDATE_FILE_NAME" \
            --audit-csv "$AUDIT_CSV_PATH" \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --output-dir outputs/reviewed_open_web \
            --source-run-id "$PILOT_RUN_ID" \
            --source-artifact "$PILOT_ARTIFACT_NAME" \
            --prior-public-web-csv \
              "/tmp/open-web-prior/$PRIOR_PUBLIC_WEB_FILE_NAME" \
            --prior-public-web-supplement-csv \
              "/tmp/open-web-prior/$PRIOR_PUBLIC_WEB_SUPPLEMENT_FILE_NAME" \
            --prior-public-web-run-id "$PRIOR_PUBLIC_WEB_RUN_ID" \
            --prior-public-web-artifact "$PRIOR_PUBLIC_WEB_ARTIFACT" \
            --direct-evidence-exclusions-csv \
              "$DIRECT_EVIDENCE_EXCLUSIONS_CSV_PATH" \
            "${curated_args[@]}" \
            "${source_package_args[@]}"
          jq -e '
            (
              .promoted_reviewed_evidence_rows == 0
              or (
                .audit.pilot_gate_passed == true
                and .audit.reviewed_pages_or_candidates >= 200
                and .audit.reviewed_domains >= 5
                and .audit.precision >= 0.95
                and .audit.cultivar_contamination_rate <= 0.02
              )
            )
            and .shared_all_evidence.denominator.species == 106295
            and .shared_all_evidence.denominator.species_axis == 318885
            and .shared_all_evidence.axis_join_for_inference == false
            and .shared_all_evidence.family_inference == false
            and .shared_all_evidence.global_fallback == false
            and .direct_evidence_exclusions.configured_records >= 1
            and .direct_evidence_exclusions.matched_rows >= 1
            and .prior_formal_public_web_evidence_rows > 0
            and (
              .shared_all_evidence.prior_formal_public_web_evidence_rows
              == .prior_formal_public_web_evidence_rows
            )
            and (.shared_all_evidence.pilot_validated_low_change.added >= 0)
            and (.shared_all_evidence.pilot_validated_low_change.invalidated >= 0)
            and (.shared_all_evidence.pilot_validated_low_change.upgraded_to_direct >= 0)
            and (
              .combined_formal_public_web_evidence_rows
              >= .prior_formal_public_web_evidence_rows
            )
            and (
              .shared_all_evidence.coverage_increment_species_axis
              == (
                .shared_all_evidence.coverage_after.filled_species_axis
                - .shared_all_evidence.coverage_before.filled_species_axis
              )
            )
            and (
              .shared_all_evidence.coverage_change_species_axis.net_change
              == .shared_all_evidence.coverage_increment_species_axis
            )
          ' outputs/reviewed_open_web/open_web_formalization_summary.json
          if [[ -n "$SOURCE_PACKAGE_EVIDENCE_CSV_PATH" ]]; then
            jq -e '
              .source_package.package_gate_passed == true
              and .source_package.reviewed >= 200
              and .source_package.approval_unit == "trait_name"
              and .source_package.overall_precision_gate_applied == false
              and .source_package.approved_trait_count > 0
              and .source_package.cultivar_contamination_rate <= 0.02
              and .source_package.novelty_rate >= 0.50
              and .source_package.selected_evidence_rows > 0
            ' outputs/reviewed_open_web/open_web_formalization_summary.json
          fi
          cat outputs/reviewed_open_web/open_web_formalization_summary.json \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Build uncertainty-aware genus Low analysis inputs
        run: |
          python analysis/build_secondary_probabilistic_genus_low_20260809.py \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --direct-csv outputs/reviewed_open_web/direct_species_trait_ledger.csv.gz \
            --rules-csv outputs/reviewed_open_web/trait_specific_genus_rule_audit.csv.gz \
            --strict-coverage-csv outputs/reviewed_open_web/strict_species_axis_coverage.csv.gz \
            --strict-low-csv outputs/reviewed_open_web/rebuilt_all_evidence_validated_low.csv.gz \
            --output-dir outputs/reviewed_open_web
          jq -e '
            .denominator.species == 106295
            and .denominator.species_axis == 318885
            and .strict_coverage.changed_by_this_artifact == false
            and .guardrails.trait_specific_join == "genus_x_trait_name"
            and .guardrails.axis_only_join == false
            and .guardrails.family_inference == false
            and .guardrails.global_fallback == false
            and .guardrails.strict_coverage_modified == false
            and .relaxed_min3_secondary.additional_species_trait > 0
            and .relaxed_min3_secondary.potential_new_species_axis > 0
          ' outputs/reviewed_open_web/secondary_probabilistic_genus_low_summary.json
          cat outputs/reviewed_open_web/secondary_probabilistic_genus_low_summary.json \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-open-web-evidence-${{ github.run_id }}
          path: outputs/reviewed_open_web/
          retention-days: 90
          if-no-files-found: error
