name: Review, promote, and recalculate open-Web trait evidence

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Successful formal integrated-coverage run
        required: true
      pilot_run_id:
        description: Multi-domain acquisition run containing the candidates
        required: true
      pilot_artifact_name:
        description: Exact combined pilot artifact name
        required: true
      audit_csv_path:
        description: Reviewed audit CSV committed on this ref
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: open-web-review-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate the shared implementation and open-Web adapters
        run: |
          ruff check \
            src/island_v2/open_web_common.py \
            src/island_v2/open_web_finalize.py \
            tests/test_open_web_common.py
          pytest -q \
            tests/test_open_web_common.py \
            tests/test_all_evidence_trait_audit.py
      - name: Download baseline and the exact acquisition artifact
        run: |
          mkdir -p /tmp/open-web-baseline /tmp/open-web-pilot
          gh run download "${{ inputs.baseline_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "integrated-trait-coverage-${{ inputs.baseline_run_id }}" \
            --dir /tmp/open-web-baseline
          gh run download "${{ inputs.pilot_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.pilot_artifact_name }}" \
            --dir /tmp/open-web-pilot
          test -f /tmp/open-web-pilot/open_web_multidomain_candidates.csv
          test -f "${{ inputs.audit_csv_path }}"
      - name: Promote approved domain-trait scopes and recalculate coverage
        run: |
          mkdir -p outputs/reviewed_open_web
          python -m island_v2.open_web_finalize \
            --baseline-dir /tmp/open-web-baseline \
            --candidates-csv \
              /tmp/open-web-pilot/open_web_multidomain_candidates.csv \
            --audit-csv "${{ inputs.audit_csv_path }}" \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --output-dir outputs/reviewed_open_web \
            --source-run-id "${{ inputs.pilot_run_id }}" \
            --source-artifact "${{ inputs.pilot_artifact_name }}"
          jq -e '
            .audit.pilot_gate_passed == true
            and .audit.reviewed_pages_or_candidates >= 200
            and .audit.reviewed_domains >= 5
            and .audit.precision >= 0.90
            and .audit.cultivar_contamination_rate <= 0.02
            and .shared_all_evidence.denominator.species == 106295
            and .shared_all_evidence.denominator.species_axis == 318885
            and .shared_all_evidence.axis_join_for_inference == false
            and .shared_all_evidence.family_inference == false
            and .shared_all_evidence.global_fallback == false
          ' outputs/reviewed_open_web/open_web_formalization_summary.json
          cat outputs/reviewed_open_web/open_web_formalization_summary.json \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-open-web-evidence-${{ github.run_id }}
          path: outputs/reviewed_open_web/
          retention-days: 90
          if-no-files-found: error
