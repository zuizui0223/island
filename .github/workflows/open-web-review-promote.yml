        required: false
        default: "reviewed-open-web-evidence-31771437676"
      prior_public_web_file_name:
        description: Evidence CSV path inside the previous artifact
        required: false
        default: "broad_web_medium_evidence.csv.gz"
      prior_public_web_supplement_file_name:
