name: Review, promote, and recalculate open-Web trait evidence

on:
  pull_request:
    paths:
      - ".github/workflows/open-web-review-promote.yml"
      - "data/v2/staging/traits/open_web_pilot/multidomain_manual_audit_*.csv"
      - "data/v2/staging/traits/open_web_pilot/ncstate_inventory_manual_audit_*.csv"
      - "src/island_v2/open_web_common.py"
      - "src/island_v2/open_web_finalize.py"
      - "src/island_v2/review_inventory_artifact.py"
      - "tests/test_open_web_common.py"
      - "tests/test_review_inventory_artifact.py"
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Successful formal integrated-coverage run
        required: true
      pilot_run_id:
        description: Multi-domain acquisition run containing the candidates
        required: true
      pilot_artifact_name:
        description: Exact combined pilot artifact name
        required: true
      audit_csv_path:
        description: Reviewed audit CSV committed on this ref
        required: true
      candidate_file_name:
        description: Candidate CSV inside the exact acquisition artifact
        required: true
        default: "open_web_multidomain_candidates.csv"

permissions:
  actions: read
  contents: read

concurrency:
  group: open-web-review-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id || '30433986432' }}
      PILOT_RUN_ID: ${{ inputs.pilot_run_id || '30434418380' }}
      PILOT_ARTIFACT_NAME: >-
        ${{ inputs.pilot_artifact_name ||
        'open-web-multidomain-pilot-30434418380' }}
      PRIOR_PUBLIC_WEB_RUN_ID: "30141880859"
      PRIOR_PUBLIC_WEB_ARTIFACT: "broad-web-medium-full-30141880859"
      AUDIT_CSV_PATH: >-
        ${{ inputs.audit_csv_path ||
        'data/v2/staging/traits/open_web_pilot/multidomain_manual_audit_200_30434418380.csv' }}
      CANDIDATE_FILE_NAME: >-
        ${{ inputs.candidate_file_name || 'open_web_multidomain_candidates.csv' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate the shared implementation and open-Web adapters
        run: |
          ruff check \
            src/island_v2/open_web_common.py \
            src/island_v2/open_web_finalize.py \
            src/island_v2/review_inventory_artifact.py \
            tests/test_review_inventory_artifact.py \
            tests/test_open_web_common.py
          pytest -q \
            tests/test_open_web_common.py \
            tests/test_review_inventory_artifact.py \
            tests/test_all_evidence_trait_audit.py
      - name: Download baseline and the exact acquisition artifact
        run: |
          mkdir -p \
            /tmp/open-web-baseline \
            /tmp/open-web-pilot \
            /tmp/open-web-prior
          gh run download "$BASELINE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "integrated-trait-coverage-$BASELINE_RUN_ID" \
            --dir /tmp/open-web-baseline
          gh run download "$PILOT_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$PILOT_ARTIFACT_NAME" \
            --dir /tmp/open-web-pilot
          gh run download "$PRIOR_PUBLIC_WEB_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$PRIOR_PUBLIC_WEB_ARTIFACT" \
            --dir /tmp/open-web-prior
          test -f "/tmp/open-web-pilot/$CANDIDATE_FILE_NAME"
          test -f \
            /tmp/open-web-prior/full/broad_web_medium_evidence.csv.gz
          test -f "$AUDIT_CSV_PATH"
      - name: Promote approved domain-trait scopes and recalculate coverage
        run: |
          mkdir -p outputs/reviewed_open_web
          python -m island_v2.open_web_finalize \
            --baseline-dir /tmp/open-web-baseline \
            --candidates-csv \
              "/tmp/open-web-pilot/$CANDIDATE_FILE_NAME" \
            --audit-csv "$AUDIT_CSV_PATH" \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --output-dir outputs/reviewed_open_web \
            --source-run-id "$PILOT_RUN_ID" \
            --source-artifact "$PILOT_ARTIFACT_NAME" \
            --prior-public-web-csv \
              /tmp/open-web-prior/full/broad_web_medium_evidence.csv.gz \
            --prior-public-web-run-id "$PRIOR_PUBLIC_WEB_RUN_ID" \
            --prior-public-web-artifact "$PRIOR_PUBLIC_WEB_ARTIFACT"
          jq -e '
            .audit.pilot_gate_passed == true
            and .audit.reviewed_pages_or_candidates >= 200
            and .audit.reviewed_domains >= 5
            and .audit.precision >= 0.90
            and .audit.cultivar_contamination_rate <= 0.02
            and .shared_all_evidence.denominator.species == 106295
            and .shared_all_evidence.denominator.species_axis == 318885
            and .shared_all_evidence.axis_join_for_inference == false
            and .shared_all_evidence.family_inference == false
            and .shared_all_evidence.global_fallback == false
            and .prior_formal_public_web_evidence_rows > 0
            and (
              .shared_all_evidence.prior_formal_public_web_evidence_rows
              == .prior_formal_public_web_evidence_rows
            )
            and (.shared_all_evidence.pilot_validated_low_change.added >= 0)
            and (.shared_all_evidence.pilot_validated_low_change.invalidated >= 0)
            and (.shared_all_evidence.pilot_validated_low_change.upgraded_to_direct >= 0)
            and (
              .combined_formal_public_web_evidence_rows
              > .prior_formal_public_web_evidence_rows
            )
            and (
              .shared_all_evidence.coverage_increment_species_axis
              == (
                .shared_all_evidence.coverage_after.filled_species_axis
                - .shared_all_evidence.coverage_before.filled_species_axis
              )
            )
            and (
              .shared_all_evidence.coverage_change_species_axis.net_change
              == .shared_all_evidence.coverage_increment_species_axis
            )
          ' outputs/reviewed_open_web/open_web_formalization_summary.json
          cat outputs/reviewed_open_web/open_web_formalization_summary.json \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-open-web-evidence-${{ github.run_id }}
          path: outputs/reviewed_open_web/
          retention-days: 90
          if-no-files-found: error
