        required: false
        default: ""
      source_package_audit_csv_path:
        description: Deterministic audit sample for the source package
        required: false
        default: ""
      source_package_run_id:
        description: Original acquisition run or immutable package identifier
        required: false
        default: ""
      source_package_artifact_name:
        description: Original source-package artifact name
        required: false
        default: ""
      direct_evidence_exclusions_csv_path:
        description: Reviewed exact-record exclusions committed on this ref
        required: false
        default: "data/v2/staging/traits/open_web_pilot/direct_evidence_exclusions_20260811.csv"

permissions:
  actions: read
  contents: read

concurrency:
  group: open-web-review-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id || '31245813999' }}
      PILOT_RUN_ID: ${{ inputs.pilot_run_id || '30434418380' }}
      PILOT_ARTIFACT_NAME: >-
        ${{ inputs.pilot_artifact_name ||
        'open-web-multidomain-pilot-30434418380' }}
      PRIOR_PUBLIC_WEB_RUN_ID: ${{ inputs.prior_public_web_run_id || '31771437676' }}
      PRIOR_PUBLIC_WEB_ARTIFACT: >-
        ${{ inputs.prior_public_web_artifact_name ||
        'reviewed-open-web-evidence-31771437676' }}
      PRIOR_PUBLIC_WEB_FILE_NAME: >-
        ${{ inputs.prior_public_web_file_name ||
        'broad_web_medium_evidence.csv.gz' }}
      PRIOR_PUBLIC_WEB_SUPPLEMENT_FILE_NAME: >-
        ${{ inputs.prior_public_web_supplement_file_name ||
        'reviewed_source_lineages.csv.gz' }}
      AUDIT_CSV_PATH: >-
        ${{ inputs.audit_csv_path ||
        'data/v2/staging/traits/open_web_pilot/multidomain_manual_audit_200_30434418380.csv' }}
      CANDIDATE_FILE_NAME: >-
        ${{ inputs.candidate_file_name || 'open_web_multidomain_candidates.csv' }}
      CURATED_EVIDENCE_CSV_PATH: >-
        ${{ inputs.curated_evidence_csv_path ||
        'data/v2/staging/traits/open_web_pilot/targeted_support2_wave15_checkpoint_20260820/combined_curated_evidence_20260820.csv' }}
      CURATED_AUDIT_CSV_PATH: >-
        ${{ inputs.curated_audit_csv_path ||
        'data/v2/staging/traits/open_web_pilot/targeted_support2_wave15_checkpoint_20260820/combined_curated_manual_audit_20260820.csv' }}
      CURATED_SOURCE_RUN_ID: >-
        ${{ inputs.curated_source_run_id || 'manual-open-web-wave15-20260820' }}
      CURATED_SOURCE_ARTIFACT: >-
        ${{ inputs.curated_source_artifact_name ||
        'targeted-support2-wave15-source-snapshot' }}
      SOURCE_PACKAGE_EVIDENCE_CSV_PATH: >-
        ${{ inputs.source_package_evidence_csv_path || '' }}
      SOURCE_PACKAGE_AUDIT_CSV_PATH: >-
        ${{ inputs.source_package_audit_csv_path || '' }}
      SOURCE_PACKAGE_RUN_ID: >-
        ${{ inputs.source_package_run_id || '' }}
      SOURCE_PACKAGE_ARTIFACT: >-
        ${{ inputs.source_package_artifact_name || '' }}
      DIRECT_EVIDENCE_EXCLUSIONS_CSV_PATH: >-
        ${{ inputs.direct_evidence_exclusions_csv_path ||
        'data/v2/staging/traits/open_web_pilot/direct_evidence_exclusions_20260811.csv' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate the shared implementation and open-Web adapters
        run: |
          ruff check \
