name: Production resumable open-Web trait acquisition

on:
  workflow_dispatch:
    inputs:
      pilot_run_id:
        description: Pilot run containing manual_audit_gain_report.json
        required: true
      offset:
        description: Start row in prioritized species-trait task queue
        required: true
        default: "0"
      limit:
        description: Maximum task rows in this resumable shard
        required: true
        default: "1000"
      search_backend:
        description: brave or google
        required: true
        default: "brave"
      max_queries:
        description: Hard request cap for this shard
        required: true
        default: "3000"
      resume_run_id:
        description: Optional prior production run whose checkpoint is resumed
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: open-web-production-${{ github.ref }}-${{ inputs.offset }}-${{ inputs.limit }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      GOOGLE_CUSTOM_SEARCH_API_KEY: ${{ secrets.GOOGLE_CUSTOM_SEARCH_API_KEY }}
      GOOGLE_CUSTOM_SEARCH_CX: ${{ secrets.GOOGLE_CUSTOM_SEARCH_CX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Download and enforce the audited pilot gate
        run: |
          mkdir -p /tmp/open-web-pilot
          gh run download "${{ inputs.pilot_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "open-web-trait-pilot-${{ inputs.pilot_run_id }}" \
            --dir /tmp/open-web-pilot
          test -f /tmp/open-web-pilot/reviewed/manual_audit_gain_report.json
          jq -e '
            .production_approved == true
            and .audited_pages_or_candidates >= 100
            and .precision >= 0.90
            and .cultivar_contamination_rate <= 0.02
            and (.production_approved_traits | length > 0)
          ' /tmp/open-web-pilot/reviewed/manual_audit_gain_report.json
      - name: Require an official-search credential
        run: |
          if [ "${{ inputs.search_backend }}" = "brave" ]; then
            test -n "$BRAVE_SEARCH_API_KEY"
          elif [ "${{ inputs.search_backend }}" = "google" ]; then
            test -n "$GOOGLE_CUSTOM_SEARCH_API_KEY"
            test -n "$GOOGLE_CUSTOM_SEARCH_CX"
          else
            echo "production backend must be brave or google" >&2
            exit 2
          fi
      - name: Restore the immutable pilot queue and optional checkpoint
        run: |
          mkdir -p outputs/open_web_production
          cp /tmp/open-web-pilot/prioritized_search_queue.csv outputs/open_web_production/
          cp /tmp/open-web-pilot/search_tasks.csv outputs/open_web_production/
          if [ -n "${{ inputs.resume_run_id }}" ]; then
            mkdir -p /tmp/open-web-resume
            gh run download "${{ inputs.resume_run_id }}" \
              --repo "${{ github.repository }}" \
              --name "open-web-trait-production-${{ inputs.resume_run_id }}" \
              --dir /tmp/open-web-resume
            cp -R /tmp/open-web-resume/. outputs/open_web_production/
          fi
      - name: Select an exact non-overlapping task range
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          src = Path("outputs/open_web_production/search_tasks.csv")
          table = pd.read_csv(src, dtype=str).fillna("")
          pilot_report = json.loads(
              Path("/tmp/open-web-pilot/reviewed/manual_audit_gain_report.json").read_text(
                  encoding="utf-8"
              )
          )
          approved_traits = set(pilot_report["production_approved_traits"])
          table = table.loc[table["trait_name"].isin(approved_traits)].copy()
          offset = int("${{ inputs.offset }}")
          limit = int("${{ inputs.limit }}")
          if offset < 0 or limit <= 0 or offset > len(table):
              raise SystemExit("invalid offset/limit")
          shard = table.iloc[offset : offset + limit].copy()
          shard.to_csv("outputs/open_web_production/search_tasks_shard.csv", index=False)
          Path("outputs/open_web_production/range.txt").write_text(
              f"[{offset},{offset + len(shard)})\n", encoding="utf-8"
          )
          Path("outputs/open_web_production/production_approved_traits.json").write_text(
              json.dumps(sorted(approved_traits), indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Discover official result URLs
        run: |
          island-v2-open-web-search discover \
            --tasks-csv outputs/open_web_production/search_tasks_shard.csv \
            --output-dir outputs/open_web_production/discovery \
            --backend "${{ inputs.search_backend }}" \
            --max-queries "${{ inputs.max_queries }}"
      - name: Fetch source pages and create review-only evidence
        run: |
          identity_args=()
          if [ -f /tmp/open-web-pilot/strict_synonyms.csv ]; then
            identity_args+=(--synonym-csv /tmp/open-web-pilot/strict_synonyms.csv)
          fi
          island-v2-open-web-evidence extract \
            --leads-csv outputs/open_web_production/discovery/search_hits.csv \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --output-dir outputs/open_web_production/evidence \
            "${identity_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: open-web-trait-production-${{ github.run_id }}
          path: outputs/open_web_production/
          retention-days: 90
          if-no-files-found: error
