name: patch_global_campaign_json_status

on:
  push:
    branches: [fix/global-campaign-json-status]
    paths:
      - ".github/workflows/patch-global-campaign-json-status.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-campaign-json-status
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch bool serialization and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/island_v2/global_trait_campaign.py")
          text = source.read_text(encoding="utf-8")
          old = 'return ledger[f"{task}_status"].isin(TERMINAL_STATUSES).all()'
          new = 'return bool(ledger[f"{task}_status"].isin(TERMINAL_STATUSES).all())'
          if old not in text:
              raise SystemExit("Expected task_is_terminal implementation not found")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/test_global_trait_campaign.py")
          test_text = test.read_text(encoding="utf-8")
          if "import json\n" not in test_text:
              test_text = test_text.replace("from pathlib import Path\n", "import json\nfrom pathlib import Path\n", 1)
          marker = "def test_campaign_summary_is_json_serializable():"
          if marker not in test_text:
              test_text += '''\n\ndef test_campaign_summary_is_json_serializable():\n    config = _config()\n    ledger = campaign.reconcile_ledger(_master(), None, config)\n    summary = campaign.campaign_summary(ledger, config)\n\n    encoded = json.dumps(summary)\n\n    assert "reproductive_wikimedia" in encoded\n'''
          test.write_text(test_text, encoding="utf-8")
          PY
      - name: Validate and format
        run: |
          pip install -e ".[dev]"
          ruff check --fix src/island_v2/global_trait_campaign.py tests/test_global_trait_campaign.py
          ruff format src/island_v2/global_trait_campaign.py tests/test_global_trait_campaign.py
          pytest -q tests/test_global_trait_campaign.py tests/test_reported_ecology_machine.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/island_v2/global_trait_campaign.py tests/test_global_trait_campaign.py
          git diff --cached --quiet && { echo "No patch required."; exit 0; }
          git commit -m "fix: normalize campaign status booleans"
          git push origin HEAD:fix/global-campaign-json-status
