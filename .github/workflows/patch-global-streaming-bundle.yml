name: patch_global_streaming_bundle

on:
  push:
    branches: [feat/global-streaming-bundle]
    paths:
      - ".github/workflows/patch-global-streaming-bundle.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-streaming-bundle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch per-species streaming scheduler
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("src/island_v2/global_trait_campaign.py")
          source = source_path.read_text(encoding="utf-8")

          block_pattern = re.compile(
              r"def task_is_terminal\(.*?(?=def _next_wave_id)",
              re.DOTALL,
          )
          replacement = '''def task_is_terminal(ledger: pd.DataFrame, task: str) -> bool:
              return bool(ledger[f"{task}_status"].isin(TERMINAL_STATUSES).all())


          def task_eligible_mask(
              ledger: pd.DataFrame,
              task: str,
              config: dict[str, Any],
          ) -> pd.Series:
              """Return rows eligible to advance now under per-species dependencies."""
              if task not in config["tasks"]:
                  raise typer.BadParameter(f"unknown global campaign task: {task}")
              mask = ledger[f"{task}_status"].isin({"pending", "retry"})
              dependencies = [
                  str(value) for value in config["tasks"][task].get("depends_on") or []
              ]
              for dependency in dependencies:
                  mask &= ledger[f"{dependency}_status"].isin(TERMINAL_STATUSES)
              rule = str(config["tasks"][task].get("eligibility", "all"))
              if rule == "machine_biotic_candidate":
                  mask &= ledger["machine_biotic_candidate"].astype(bool)
              elif rule != "all":
                  raise typer.BadParameter(
                      f"unsupported eligibility rule for {task}: {rule}"
                  )
              return mask.astype(bool)


          def prepare_dependent_statuses(
              ledger: pd.DataFrame,
              config: dict[str, Any],
          ) -> pd.DataFrame:
              """Close gated rows only when that species' dependencies are terminal."""
              result = ledger.copy()
              for task_value in config["task_order"]:
                  task = str(task_value)
                  rule = str(config["tasks"][task].get("eligibility", "all"))
                  if rule != "machine_biotic_candidate":
                      continue
                  dependencies_ready = pd.Series(True, index=result.index, dtype=bool)
                  dependencies = [
                      str(value)
                      for value in config["tasks"][task].get("depends_on") or []
                  ]
                  for dependency in dependencies:
                      dependencies_ready &= result[f"{dependency}_status"].isin(
                          TERMINAL_STATUSES
                      )
                  status_column = f"{task}_status"
                  mask = (
                      dependencies_ready
                      & ~result["machine_biotic_candidate"].astype(bool)
                      & result[status_column].isin({"pending", "retry"})
                  )
                  result.loc[mask, status_column] = "not_applicable"
              return result


          def choose_active_task(ledger: pd.DataFrame, config: dict[str, Any]) -> str:
              """Choose the first task with at least one currently eligible species."""
              for task_value in config["task_order"]:
                  task = str(task_value)
                  if task_eligible_mask(ledger, task, config).any():
                      return task
              return "complete"


          def family_balanced_batch(
              ledger: pd.DataFrame,
              task: str,
              batch_size: int,
              config: dict[str, Any] | None = None,
          ) -> pd.DataFrame:
              if batch_size < 1:
                  raise typer.BadParameter("batch_size must be at least 1")
              if config is None:
                  eligible = ledger[f"{task}_status"].isin({"pending", "retry"})
              else:
                  eligible = task_eligible_mask(ledger, task, config)
              pending = ledger.loc[eligible].copy()
              if pending.empty:
                  return pending
              pending = pending.sort_values(
                  ["family", "n_islands", "n_records", "accepted_species"],
                  ascending=[True, False, False, True],
              )
              groups = {
                  str(family): group.reset_index(drop=True)
                  for family, group in pending.groupby("family", sort=True)
              }
              family_order = sorted(groups, key=lambda family: (-len(groups[family]), family))
              rows: list[pd.Series] = []
              round_index = 0
              while len(rows) < batch_size:
                  added = False
                  for family in family_order:
                      group = groups[family]
                      if round_index < len(group):
                          rows.append(group.iloc[round_index])
                          added = True
                          if len(rows) >= batch_size:
                              break
                  if not added:
                      break
                  round_index += 1
              if not rows:
                  return pending.head(0)
              batch = pd.DataFrame(rows).reset_index(drop=True)
              return batch[
                  ["accepted_species", "genus", "family", "n_islands", "n_records"]
              ]


          '''
          source, count = block_pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"scheduler block replacement count={count}")

          old_signature = '''    batch_size: int | None = typer.Option(None, min=1, max=500),
          ) -> None:'''
          new_signature = '''    batch_size: int | None = typer.Option(None, min=1, max=2000),
              task: str | None = typer.Option(
                  None,
                  "--task",
                  help="Advance one named task using per-species dependency eligibility.",
              ),
          ) -> None:'''
          if old_signature not in source:
              raise SystemExit("run signature marker not found")
          source = source.replace(old_signature, new_signature, 1)

          old_setup = '''    ledger = reconcile_ledger(master, existing, config)
              ledger = prepare_dependent_statuses(ledger, config)
              task = choose_active_task(ledger, config)
              campaign_dir.mkdir(parents=True, exist_ok=True)

              if task == "complete":'''
          new_setup = '''    ledger = reconcile_ledger(master, existing, config)
              ledger = prepare_dependent_statuses(ledger, config)
              requested_task = _text(task)
              if requested_task and requested_task not in config["tasks"]:
                  raise typer.BadParameter(f"unknown global campaign task: {requested_task}")
              task = requested_task or choose_active_task(ledger, config)
              campaign_dir.mkdir(parents=True, exist_ok=True)

              if requested_task and not task_eligible_mask(ledger, task, config).any():
                  _write_frame_gzip(ledger, ledger_path)
                  summary = campaign_summary(ledger, config)
                  status_path = campaign_dir / "campaign_status.json"
                  if status_path.exists():
                      previous = json.loads(status_path.read_text(encoding="utf-8"))
                      if "last_wave" in previous:
                          summary["last_wave"] = previous["last_wave"]
                  status_path.write_text(
                      json.dumps(summary, ensure_ascii=False, indent=2) + "\\n",
                      encoding="utf-8",
                  )
                  typer.echo(f"No currently eligible species for requested task {task}.")
                  return

              if task == "complete":'''
          if old_setup not in source:
              raise SystemExit("run setup marker not found")
          source = source.replace(old_setup, new_setup, 1)
          source = source.replace(
              "batch = family_balanced_batch(ledger, task, size)",
              "batch = family_balanced_batch(ledger, task, size, config)",
              1,
          )

          old_summary = '''            "n_candidates": int(ledger[f"{task}_candidate_count"].sum()),
                      "terminal": task_is_terminal(ledger, task),'''
          new_summary = '''            "n_candidates": int(ledger[f"{task}_candidate_count"].sum()),
                      "n_eligible_pending": int(task_eligible_mask(ledger, task, config).sum()),
                      "terminal": task_is_terminal(ledger, task),'''
          if old_summary not in source:
              raise SystemExit("summary marker not found")
          source = source.replace(old_summary, new_summary, 1)
          source_path.write_text(source, encoding="utf-8")

          config_path = Path("config/global_trait_campaign.yml")
          config_text = config_path.read_text(encoding="utf-8")
          config_text = config_text.replace("default_batch_size: 250", "default_batch_size: 1000", 1)
          config_path.write_text(config_text, encoding="utf-8")

          workflow_path = Path(".github/workflows/drive-global-trait-campaign.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace('description: "Species attempted in this bounded wave (1-500)."', 'description: "Wikimedia species attempted per streaming bundle (1-2000)."', 1)
          workflow = workflow.replace('default: "250"', 'default: "1000"', 1)
          workflow = workflow.replace('- cron: "17 * * * *"', '- cron: "17,47 * * * *"', 1)
          workflow = workflow.replace('timeout-minutes: 45', 'timeout-minutes: 55', 1)
          workflow = workflow.replace(
              '      BATCH_SIZE: ${{ inputs.batch_size || \'250\' }}\n      CAMPAIGN_DIR:',
              '      BATCH_SIZE: ${{ inputs.batch_size || \'1000\' }}\n      OPENALEX_BATCH_SIZE: "250"\n      FLORAL_BATCH_SIZE: "150"\n      GUILD_BATCH_SIZE: "100"\n      CAMPAIGN_DIR:',
              1,
          )
          workflow = workflow.replace('if not 1 <= value <= 500:', 'if not 1 <= value <= 2000:', 1)
          workflow = workflow.replace('batch_size must be between 1 and 500', 'batch_size must be between 1 and 2000', 1)
          advance_pattern = re.compile(
              r"      - name: Advance one global machine-evidence wave\n.*?(?=      - name: Record failed wave for retry)",
              re.DOTALL,
          )
          advance_replacement = '''      - name: Advance one global streaming bundle
              id: advance
              continue-on-error: true
              run: |
                set -o pipefail
                : > "${CAMPAIGN_RUN_LOG}"
                run_task() {
                  local task="$1"
                  local size="$2"
                  echo "===== ${task}: batch ${size} =====" | tee -a "${CAMPAIGN_RUN_LOG}"
                  island-v2-global-trait-campaign \\
                    --master-csv data/v2/staging/gbif/collected/island_taxa.csv \\
                    --campaign-dir "${CAMPAIGN_DIR}" \\
                    --config-path config/global_trait_campaign.yml \\
                    --task "${task}" \\
                    --batch-size "${size}" \\
                    2>&1 | tee -a "${CAMPAIGN_RUN_LOG}"
                }
                run_task reproductive_wikimedia "${BATCH_SIZE}"
                run_task reproductive_openalex "${OPENALEX_BATCH_SIZE}"
                run_task floral_access_wikimedia "${FLORAL_BATCH_SIZE}"
                run_task alternative_guild_openalex "${GUILD_BATCH_SIZE}"
          '''
          workflow, count = advance_pattern.subn(advance_replacement, workflow, count=1)
          if count != 1:
              raise SystemExit(f"advance workflow replacement count={count}")
          workflow = workflow.replace(
              '              "batch_size": int(os.environ["BATCH_SIZE"]),',
              '              "batch_plan": {\n                  "reproductive_wikimedia": int(os.environ["BATCH_SIZE"]),\n                  "reproductive_openalex": int(os.environ["OPENALEX_BATCH_SIZE"]),\n                  "floral_access_wikimedia": int(os.environ["FLORAL_BATCH_SIZE"]),\n                  "alternative_guild_openalex": int(os.environ["GUILD_BATCH_SIZE"]),\n              },',
              1,
          )
          workflow_path.write_text(workflow, encoding="utf-8")

          test_path = Path("tests/test_global_trait_campaign.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_per_species_streaming_dependencies_allow_early_downstream():"
          if marker not in tests:
              tests += '''

          def test_per_species_streaming_dependencies_allow_early_downstream():
              config = _config()
              ledger = campaign.reconcile_ledger(_master(), None, config)
              first = ledger["accepted_species"].eq("Alpha one")
              second = ledger["accepted_species"].eq("Alpha two")
              ledger.loc[first, "reproductive_wikimedia_status"] = "processed"
              ledger.loc[first, "reproductive_openalex_status"] = "processed"
              ledger.loc[first, "machine_biotic_candidate"] = True
              ledger.loc[second, "reproductive_wikimedia_status"] = "processed"
              ledger.loc[second, "machine_biotic_candidate"] = True

              prepared = campaign.prepare_dependent_statuses(ledger, config)
              eligible = campaign.task_eligible_mask(
                  prepared, "floral_access_wikimedia", config
              )
              batch = campaign.family_balanced_batch(
                  prepared, "floral_access_wikimedia", 10, config
              )

              assert prepared.loc[first, "floral_access_wikimedia_status"].iloc[0] == "pending"
              assert prepared.loc[second, "floral_access_wikimedia_status"].iloc[0] == "pending"
              assert prepared.loc[eligible, "accepted_species"].tolist() == ["Alpha one"]
              assert batch["accepted_species"].tolist() == ["Alpha one"]


          def test_nonbiotic_gate_closes_only_after_species_dependencies_finish():
              config = _config()
              ledger = campaign.reconcile_ledger(_master(), None, config)
              first = ledger["accepted_species"].eq("Alpha one")
              second = ledger["accepted_species"].eq("Alpha two")
              for task in ("reproductive_wikimedia", "reproductive_openalex"):
                  ledger.loc[first, f"{task}_status"] = "processed"
              ledger.loc[second, "reproductive_wikimedia_status"] = "processed"

              prepared = campaign.prepare_dependent_statuses(ledger, config)

              assert (
                  prepared.loc[first, "floral_access_wikimedia_status"].iloc[0]
                  == "not_applicable"
              )
              assert prepared.loc[second, "floral_access_wikimedia_status"].iloc[0] == "pending"
          '''
          test_path.write_text(tests, encoding="utf-8")

          docs_path = Path("docs/global_trait_campaign.md")
          docs = docs_path.read_text(encoding="utf-8")
          heading = "## Per-species streaming scheduler"
          if heading not in docs:
              docs += '''

          ## Per-species streaming scheduler

          The scheduled workflow advances a bounded bundle every 30 minutes: a broad
          family-balanced Wikimedia wave followed by smaller OpenAlex, floral-access,
          and alternative-guild waves. Dependencies are evaluated per species, not as
          a global phase barrier. A species can therefore reach floral-access and
          alternative-pollinator extraction as soon as its own upstream rows are
          terminal, while the remaining global master continues through the first
          source. The default task selector remains outcome-blind and family-balanced;
          the forced task option only selects a measurement stage, never a region,
          island, trait outcome, or Bombus result.
          '''
          docs_path.write_text(docs, encoding="utf-8")
          PY
      - name: Validate patched campaign
        run: |
          pip install -e ".[dev]"
          ruff check --fix src/island_v2/global_trait_campaign.py tests/test_global_trait_campaign.py
          ruff format src/island_v2/global_trait_campaign.py tests/test_global_trait_campaign.py
          pytest -q tests/test_global_trait_campaign.py tests/test_reported_ecology_machine.py
          python scripts/validate_workflow_contracts.py
      - name: Commit streaming implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/island_v2/global_trait_campaign.py tests/test_global_trait_campaign.py \
            config/global_trait_campaign.yml .github/workflows/drive-global-trait-campaign.yml \
            docs/global_trait_campaign.md
          git diff --cached --quiet && { echo "No streaming changes."; exit 0; }
          git commit -m "feat: stream global trait stages per species"
          git push origin HEAD:feat/global-streaming-bundle
