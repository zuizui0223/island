name: patch_gzip_snapshot_consumers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/patch_gzip_snapshot_consumers.json"

permissions:
  contents: write

concurrency:
  group: gbif-consumer-patch
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.head_commit.message == 'patch gzip snapshot consumers')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace legacy snapshot references
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = "data/v2/staging/gbif/collected/island_species_occurrences.csv"
          new = f"{old}.gz"
          targets = [
              Path(".github/workflows/build-pilot-island-curation.yml"),
              Path(".github/workflows/extract-pilot-trait-evidence.yml"),
          ]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one legacy reference in {path}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
              print(f"Updated {path}")
          PY
      - name: Commit patched consumers
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-pilot-island-curation.yml .github/workflows/extract-pilot-trait-evidence.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): read compressed GBIF species snapshot"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Could not rebase workflow patch onto current main." >&2
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "Could not push workflow patch after five retries." >&2
          exit 1
