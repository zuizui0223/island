name: Pilot Chapter 1 H4 strict-title Methods support

concurrency:
  group: h4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "scripts/pilot_chapter1_h4_title_strict_methods.py"
      - ".github/workflows/pilot-chapter1-h4-title-strict-methods.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      META_ARTIFACT_ID: "10527672011"
      META_ARTIFACT_SHA256: "80b549d883ec1b43d03232a00609c8711c3171f1bafc5424acdc7ff1dfd77a60"
      TRAIT_ARTIFACT_ID: "10527906374"
      TRAIT_ARTIFACT_SHA256: "a3e96eaf78dcd98196a7e017a12191ac2d817b9d9ec39362f9e65604c06b4d08"
      ROOT: /tmp/chapter1-h4-strict-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download frozen outcome-blind artifacts
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/meta" "$ROOT/traits" "$ROOT/out"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${META_ARTIFACT_ID}/zip" \
            > "$ROOT/meta.zip"
          echo "$META_ARTIFACT_SHA256  $ROOT/meta.zip" | sha256sum --check --strict
          unzip -q "$ROOT/meta.zip" -d "$ROOT/meta"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TRAIT_ARTIFACT_ID}/zip" \
            > "$ROOT/traits.zip"
          echo "$TRAIT_ARTIFACT_SHA256  $ROOT/traits.zip" | sha256sum --check --strict
          unzip -q "$ROOT/traits.zip" -d "$ROOT/traits"
      - name: Run strict-title Methods lower-bound pilot
        run: |
          python scripts/pilot_chapter1_h4_title_strict_methods.py \
            --metadata-csv "$ROOT/meta/post2015_h4_metadata_candidates.csv" \
            --trait-states-csv "$ROOT/traits/prospective_h4_frozen_trait_states.csv" \
            --config-path config/chapter1_h4_prospective_methods_preflight_v1.yml \
            --output-csv "$ROOT/out/strict_title_methods_screen.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-h4-strict-title-pilot-${{ github.run_id }}
          path: /tmp/chapter1-h4-strict-pilot/out
          if-no-files-found: error
          retention-days: 30
