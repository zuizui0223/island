name: poll_gbif_block_pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/gbif_block_pilot_downloads_v2.json"

permissions:
  contents: read

jobs:
  poll:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'poll GBIF pilot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Materialize pilot request manifest from accepted keys
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          config_path = Path('config/gbif_block_pilot_downloads_v2.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          rows = []
          for request in config['requests']:
              rows.append({
                  'island_id': request['block_id'],
                  'block_id': request['block_id'],
                  'regional_cell': request['regional_cell'],
                  'n_islands': request['n_islands'],
                  'payload_json': '{}',
                  'request_status': 'submitted',
                  'download_key': request['download_key'],
                  'error': '',
              })
          output = Path('data/v2/external/gbif/pilot_status')
          output.mkdir(parents=True, exist_ok=True)
          pd.DataFrame(rows).to_csv(output / 'gbif_pilot_download_manifest.csv', index=False)
          PY
      - name: Poll accepted GBIF downloads
        run: |
          island-v2-gbif-flora poll \
            --request-manifest data/v2/external/gbif/pilot_status/gbif_pilot_download_manifest.csv
      - name: Summarize GBIF pilot download state
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import pandas as pd

          manifest = Path('data/v2/external/gbif/pilot_status/gbif_pilot_download_manifest.csv')
          if not manifest.exists():
              print('## GBIF pilot download poll')
              print('Status manifest was not created.')
              raise SystemExit(0)
          table = pd.read_csv(manifest, dtype=str).fillna('')
          print('## GBIF pilot download state')
          print(table['request_status'].value_counts().rename_axis('status').to_frame('n').to_csv())
          columns = [
              'block_id', 'regional_cell', 'n_islands', 'request_status',
              'download_key', 'doi', 'error',
          ]
          columns = [column for column in columns if column in table.columns]
          print('```csv')
          print(table[columns].to_csv(index=False), end='')
          print('```')
          PY
      - name: Upload GBIF pilot download status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-three-block-pilot-status-${{ github.run_id }}
          path: |
            config/gbif_block_pilot_downloads_v2.json
            data/v2/external/gbif/pilot_status/gbif_pilot_download_manifest.csv
          if-no-files-found: warn
          retention-days: 90
