name: poll_gbif_full_acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"
  push:
    branches: [main]
    paths:
      - "config/gbif_full_acquisition_v2.json"

permissions:
  contents: write

concurrency:
  group: gbif-full-acquisition
  cancel-in-progress: false

jobs:
  poll-downloads:
    if: github.event_name != 'push' || github.event.head_commit.message == 'poll GBIF full acquisition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Materialize active GBIF requests from persistent ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          ledger_path = Path('config/gbif_full_acquisition_v2.json')
          output = Path('data/v2/external/gbif/full_status')
          output.mkdir(parents=True, exist_ok=True)
          campaign = json.loads(ledger_path.read_text(encoding='utf-8'))
          active = {'submitted', 'preparing', 'running'}
          rows = []
          for entry in campaign.get('ledger', []):
              if entry.get('request_status') not in active:
                  continue
              key = str(entry.get('download_key', '')).strip()
              if not key:
                  continue
              rows.append({
                  'island_id': entry['block_id'],
                  'block_id': entry['block_id'],
                  'regional_cell': entry['regional_cell'],
                  'n_islands': entry['n_islands'],
                  'payload_json': '{}',
                  # The legacy poll command polls submitted/running.  Normalize
                  # transient preparing state to submitted only in this temporary file.
                  'request_status': 'submitted',
                  'download_key': key,
                  'error': '',
              })
          pd.DataFrame(rows).to_csv(output / 'gbif_active_download_manifest.csv', index=False)
          PY
      - name: Poll all active GBIF download keys
        run: |
          island-v2-gbif-flora poll \
            --request-manifest data/v2/external/gbif/full_status/gbif_active_download_manifest.csv
      - name: Merge GBIF states into persistent ledger
        if: always()
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          import pandas as pd

          ledger_path = Path('config/gbif_full_acquisition_v2.json')
          status_path = Path('data/v2/external/gbif/full_status/gbif_active_download_manifest.csv')
          campaign = json.loads(ledger_path.read_text(encoding='utf-8'))
          now = datetime.now(UTC).isoformat()
          if status_path.exists() and status_path.stat().st_size:
              statuses = pd.read_csv(status_path, dtype=str).fillna('').set_index('block_id', drop=False)
              for entry in campaign.get('ledger', []):
                  block_id = str(entry['block_id'])
                  if block_id not in statuses.index:
                      continue
                  row = statuses.loc[block_id]
                  entry['request_status'] = str(row.get('request_status', entry['request_status']))
                  entry['doi'] = str(row.get('doi', entry.get('doi', '')))
                  entry['last_polled_at_utc'] = now
                  entry['last_poll_error'] = str(row.get('error', ''))
                  # downloadLink is retained in the workflow artifact, not committed.
          counts = {}
          for entry in campaign.get('ledger', []):
              counts[entry['request_status']] = counts.get(entry['request_status'], 0) + 1
          campaign['last_poll'] = {
              'polled_at_utc': now,
              'ledger_status_counts': counts,
          }
          ledger_path.write_text(json.dumps(campaign, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', str(ledger_path)], check=True)
          diff = subprocess.run(['git', 'diff', '--cached', '--quiet'])
          if diff.returncode:
              subprocess.run(['git', 'commit', '-m', 'chore: update GBIF download statuses'], check=True)
              subprocess.run(['git', 'push'], check=True)
          PY
      - name: Summarize GBIF download state
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          campaign = json.loads(Path('config/gbif_full_acquisition_v2.json').read_text(encoding='utf-8'))
          table = pd.DataFrame(campaign.get('ledger', []))
          print('## GBIF full-acquisition download state')
          if table.empty:
              print('No submitted blocks are recorded yet.')
          else:
              print(table['request_status'].value_counts().rename_axis('status').to_frame('n').to_csv())
              columns = ['block_id', 'regional_cell', 'n_islands', 'request_status', 'download_key', 'doi', 'last_poll_error']
              columns = [column for column in columns if column in table.columns]
              print('```csv')
              print(table[columns].to_csv(index=False), end='')
              print('```')
          PY
      - name: Upload GBIF status provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-full-acquisition-status-${{ github.run_id }}
          path: |
            config/gbif_full_acquisition_v2.json
            data/v2/external/gbif/full_status/gbif_active_download_manifest.csv
          if-no-files-found: warn
          retention-days: 90
