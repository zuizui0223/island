name: Pollination-syndrome far-tail block leaveout

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_pollination_syndrome_far_tail_block_leaveout.py"
      - "scripts/audit_pollination_syndrome_far_tail_genera.py"
      - ".github/workflows/pollination-syndrome-far-tail-block-leaveout.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RAW_RUN_ID: "35216672430"
      RAW_ARTIFACT: "chapter1-v13-raw-colour-audit-35216672430"
      ALL_DATA_RUN_ID: "35100991898"
      ALL_DATA_ARTIFACT: "chapter1-all-data-primary-35100991898"
      TRAIT_RUN_ID: "34191508045"
      TRAIT_ARTIFACT: "source-scale-batch-integration-34191508045"
      CANONICAL_RUN_ID: "32845980788"
      CANONICAL_ARTIFACT: "chapter1-when-where-main-32845980788"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/far-tail-leaveout/{raw,all-data,trait,canonical,results}
          gh run download "$RAW_RUN_ID" -n "$RAW_ARTIFACT" -D /tmp/far-tail-leaveout/raw
          gh run download "$ALL_DATA_RUN_ID" -n "$ALL_DATA_ARTIFACT" -D /tmp/far-tail-leaveout/all-data
          gh run download "$TRAIT_RUN_ID" -n "$TRAIT_ARTIFACT" -D /tmp/far-tail-leaveout/trait
          gh run download "$CANONICAL_RUN_ID" -n "$CANONICAL_ARTIFACT" -D /tmp/far-tail-leaveout/canonical
          test -s /tmp/far-tail-leaveout/raw/results/all/coupling/raw_colour_conditioned_architecture_counts.csv.gz
          test -s /tmp/far-tail-leaveout/raw/results/direct/coupling/raw_colour_conditioned_architecture_counts.csv.gz
          test -s /tmp/far-tail-leaveout/all-data/syndrome/all/island_syndrome_scores.csv.gz
          test -s /tmp/far-tail-leaveout/all-data/syndrome/direct/island_syndrome_scores.csv.gz
          test -s /tmp/far-tail-leaveout/trait/species_axis_coverage.csv.gz
          test -s /tmp/far-tail-leaveout/canonical/input/chapter1_status_flora.csv.gz
          test -s results/geography_20260924/corrected_geography_covariates.csv
          test -s results/h1_regional_common_support_20261005/common_support_windows.csv

      - name: Validate scripts
        run: |
          ruff check \
            scripts/audit_pollination_syndrome_far_tail_block_leaveout.py \
            scripts/audit_pollination_syndrome_far_tail_genera.py
          python -m py_compile \
            scripts/audit_pollination_syndrome_far_tail_block_leaveout.py \
            scripts/audit_pollination_syndrome_far_tail_genera.py

      - name: Run block leaveout diagnostic
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/audit_pollination_syndrome_far_tail_block_leaveout.py \
            --all-counts /tmp/far-tail-leaveout/raw/results/all/coupling/raw_colour_conditioned_architecture_counts.csv.gz \
            --direct-counts /tmp/far-tail-leaveout/raw/results/direct/coupling/raw_colour_conditioned_architecture_counts.csv.gz \
            --all-scores /tmp/far-tail-leaveout/all-data/syndrome/all/island_syndrome_scores.csv.gz \
            --direct-scores /tmp/far-tail-leaveout/all-data/syndrome/direct/island_syndrome_scores.csv.gz \
            --covariates results/geography_20260924/corrected_geography_covariates.csv \
            --config config/chapter1_all_data_biogeographic_pattern.yml \
            --windows results/h1_regional_common_support_20261005/common_support_windows.csv \
            --output /tmp/far-tail-leaveout/results

      - name: Run genus attribution diagnostic
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/audit_pollination_syndrome_far_tail_genera.py \
            --species-axis /tmp/far-tail-leaveout/trait/species_axis_coverage.csv.gz \
            --status-flora /tmp/far-tail-leaveout/canonical/input/chapter1_status_flora.csv.gz \
            --all-counts /tmp/far-tail-leaveout/raw/results/all/coupling/raw_colour_conditioned_architecture_counts.csv.gz \
            --direct-counts /tmp/far-tail-leaveout/raw/results/direct/coupling/raw_colour_conditioned_architecture_counts.csv.gz \
            --all-scores /tmp/far-tail-leaveout/all-data/syndrome/all/island_syndrome_scores.csv.gz \
            --direct-scores /tmp/far-tail-leaveout/all-data/syndrome/direct/island_syndrome_scores.csv.gz \
            --covariates results/geography_20260924/corrected_geography_covariates.csv \
            --config config/chapter1_all_data_biogeographic_pattern.yml \
            --windows results/h1_regional_common_support_20261005/common_support_windows.csv \
            --output /tmp/far-tail-leaveout/results

      - name: Write summary
        run: |
          {
            echo "## Far-tail spatial-block leaveout"
            cat /tmp/far-tail-leaveout/results/far_tail_block_leaveout_summary.csv
            echo
            echo "## Far-tail genus attribution headline"
            cat /tmp/far-tail-leaveout/results/far_tail_genus_headline.csv
            echo
            echo "## Direct far-tail top genera"
            python - <<'PY'
          import pandas as pd
          p = "/tmp/far-tail-leaveout/results/far_tail_genus_ranked_direct.csv"
          d = pd.read_csv(p)
          keep = [
              "context", "genus", "n_deep_occurrences", "n_trial_occurrences",
              "n_deep_islands", "n_deep_species", "share_of_all_deep_occurrences",
          ]
          for context in ("northern_midlatitude", "tropical"):
              print(f"### {context}")
              print(d.loc[d["context"].eq(context), keep].head(20).to_csv(index=False))
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-pollination-syndrome-far-tail-leaveout-${{ github.run_id }}
          path: /tmp/far-tail-leaveout/results
          if-no-files-found: error
          retention-days: 30
