name: Pollination-syndrome hinge diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_pollination_syndrome_nonlinearity.py"
      - ".github/workflows/pollination-syndrome-hinge-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RAW_RUN_ID: "35216672430"
      RAW_ARTIFACT: "chapter1-v13-raw-colour-audit-35216672430"
      ALL_DATA_RUN_ID: "35100991898"
      ALL_DATA_ARTIFACT: "chapter1-all-data-primary-35100991898"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/syndrome-hinge/raw /tmp/syndrome-hinge/all-data /tmp/syndrome-hinge/results
          gh run download "$RAW_RUN_ID" -n "$RAW_ARTIFACT" -D /tmp/syndrome-hinge/raw
          gh run download "$ALL_DATA_RUN_ID" -n "$ALL_DATA_ARTIFACT" -D /tmp/syndrome-hinge/all-data
          test -s /tmp/syndrome-hinge/raw/results/all/coupling/raw_colour_conditioned_architecture_counts.csv.gz
          test -s /tmp/syndrome-hinge/raw/results/direct/coupling/raw_colour_conditioned_architecture_counts.csv.gz
          test -s /tmp/syndrome-hinge/all-data/syndrome/all/island_syndrome_scores.csv.gz
          test -s /tmp/syndrome-hinge/all-data/syndrome/direct/island_syndrome_scores.csv.gz
          test -s results/geography_20260924/corrected_geography_covariates.csv
          test -s results/h1_regional_common_support_20261005/common_support_windows.csv

      - name: Validate script
        run: |
          ruff check scripts/audit_pollination_syndrome_nonlinearity.py
          python -m py_compile scripts/audit_pollination_syndrome_nonlinearity.py

      - name: Run hinge diagnostic
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/audit_pollination_syndrome_nonlinearity.py             --all-counts /tmp/syndrome-hinge/raw/results/all/coupling/raw_colour_conditioned_architecture_counts.csv.gz             --direct-counts /tmp/syndrome-hinge/raw/results/direct/coupling/raw_colour_conditioned_architecture_counts.csv.gz             --all-scores /tmp/syndrome-hinge/all-data/syndrome/all/island_syndrome_scores.csv.gz             --direct-scores /tmp/syndrome-hinge/all-data/syndrome/direct/island_syndrome_scores.csv.gz             --covariates results/geography_20260924/corrected_geography_covariates.csv             --config config/chapter1_all_data_biogeographic_pattern.yml             --windows results/h1_regional_common_support_20261005/common_support_windows.csv             --reference-all results/geography_20260924/all/raw_patterns/raw_colour_conditioned_architecture_model_results.csv             --reference-direct results/geography_20260924/direct/raw_patterns/raw_colour_conditioned_architecture_model_results.csv             --output /tmp/syndrome-hinge/results

      - name: Write summary
        run: |
          {
            echo "## Pollination-syndrome hinge diagnostic"
            cat /tmp/syndrome-hinge/results/syndrome_hinge_summary.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-pollination-syndrome-hinge-${{ github.run_id }}
          path: /tmp/syndrome-hinge/results
          if-no-files-found: error
          retention-days: 30
