name: Pollination-syndrome region-scale interaction diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_pollination_syndrome_region_scale_interaction.py"
      - ".github/workflows/pollination-syndrome-region-scale-interaction.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RAW_RUN_ID: "35216672430"
      RAW_ARTIFACT: "chapter1-v13-raw-colour-audit-35216672430"
      ALL_DATA_RUN_ID: "35100991898"
      ALL_DATA_ARTIFACT: "chapter1-all-data-primary-35100991898"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/syndrome-region/raw /tmp/syndrome-region/all-data /tmp/syndrome-region/results
          gh run download "$RAW_RUN_ID" -n "$RAW_ARTIFACT" -D /tmp/syndrome-region/raw
          gh run download "$ALL_DATA_RUN_ID" -n "$ALL_DATA_ARTIFACT" -D /tmp/syndrome-region/all-data
          test -s /tmp/syndrome-region/raw/results/all/coupling/raw_colour_conditioned_architecture_counts.csv.gz
          test -s /tmp/syndrome-region/raw/results/direct/coupling/raw_colour_conditioned_architecture_counts.csv.gz
          test -s /tmp/syndrome-region/all-data/syndrome/all/island_syndrome_scores.csv.gz
          test -s /tmp/syndrome-region/all-data/syndrome/direct/island_syndrome_scores.csv.gz
          test -s results/geography_20260924/corrected_geography_covariates.csv
          test -s results/h1_regional_common_support_20261005/common_support_windows.csv

      - name: Validate diagnostic
        run: |
          ruff check scripts/audit_pollination_syndrome_region_scale_interaction.py
          python -m py_compile scripts/audit_pollination_syndrome_region_scale_interaction.py

      - name: Run region-scale interaction diagnostic
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/audit_pollination_syndrome_region_scale_interaction.py \
            --all-counts /tmp/syndrome-region/raw/results/all/coupling/raw_colour_conditioned_architecture_counts.csv.gz \
            --direct-counts /tmp/syndrome-region/raw/results/direct/coupling/raw_colour_conditioned_architecture_counts.csv.gz \
            --all-scores /tmp/syndrome-region/all-data/syndrome/all/island_syndrome_scores.csv.gz \
            --direct-scores /tmp/syndrome-region/all-data/syndrome/direct/island_syndrome_scores.csv.gz \
            --covariates results/geography_20260924/corrected_geography_covariates.csv \
            --config config/chapter1_all_data_biogeographic_pattern.yml \
            --windows results/h1_regional_common_support_20261005/common_support_windows.csv \
            --output /tmp/syndrome-region/results

      - name: Write summary
        run: |
          {
            echo "## Common-support region interaction"
            cat /tmp/syndrome-region/results/common_support_region_interaction.csv
            echo
            echo "## Full-support hinge region interaction"
            cat /tmp/syndrome-region/results/full_support_hinge_region_interaction.csv
            echo
            echo "## Focus pairwise contrasts"
            cat /tmp/syndrome-region/results/focus_region_contrasts.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-pollination-syndrome-region-scale-${{ github.run_id }}
          path: /tmp/syndrome-region/results
          if-no-files-found: error
          retention-days: 30
