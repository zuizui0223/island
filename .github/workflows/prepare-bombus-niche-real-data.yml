name: prepare_bombus_niche_real_data

on:
  workflow_dispatch:
    inputs:
      min_occurrence_records:
        description: "Minimum coordinate-bearing GBIF records required for a Bombus species"
        required: false
        default: "50"
      max_species:
        description: "Maximum globally discovered Bombus species retained"
        required: false
        default: "300"
      max_occurrences_per_species:
        description: "Maximum GBIF occurrence records retained per species"
        required: false
        default: "5000"
      spatial_thin_degrees:
        description: "Geographic grid-cell width used to thin occurrence records"
        required: false
        default: "0.25"
  push:
    branches:
      - feat/bombus-hypervolume-real-data
    paths:
      - ".github/workflows/prepare-bombus-niche-real-data.yml"

permissions:
  contents: read

jobs:
  acquire-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Verify Bombus production contract
        run: |
          pytest -q \
            tests/test_bombus_global_production_contract.py \
            tests/test_bombus_island_analysis.py \
            tests/test_bombus_species_discovery_production.py

      - name: Rebuild the declared global island universe
        run: |
          set -euo pipefail
          island-v2-gshhg build --output-dir data/v2/external/islands/gshhg
          test -f data/v2/external/islands/gshhg/prepared/islands_v2.gpkg

      - name: Build outcome-blind Bombus applicability registry
        run: |
          set -euo pipefail
          python - <<'PY'
          import geopandas as gpd
          from pathlib import Path

          gpkg = Path("data/v2/external/islands/gshhg/prepared/islands_v2.gpkg")
          out = Path("data/v2/staging/bombus/applicability")
          out.mkdir(parents=True, exist_ok=True)
          islands = gpd.read_file(gpkg)
          islands[["island_id"]].drop_duplicates().sort_values("island_id").to_csv(
              out / "global_island_manifest.csv", index=False
          )
          PY
          island-v2-bombus-applicability build \
            --island-manifest-csv data/v2/staging/bombus/applicability/global_island_manifest.csv \
            --island-source-assignment-csv data/v2/curation/island_source_region_assignments.csv \
            --source-region-registry-csv data/v2/curation/source_region_bombus_registry.csv \
            --source-region-evidence-csv data/v2/curation/source_region_evidence.csv \
            --island-assignment-evidence-csv data/v2/curation/island_assignment_evidence.csv \
            --output-dir data/v2/staging/bombus/applicability

      - name: Acquire global Bombus occurrence environments and island climates
        env:
          MIN_RECORDS: ${{ inputs.min_occurrence_records || '50' }}
          MAX_SPECIES: ${{ inputs.max_species || '300' }}
          MAX_OCCURRENCES: ${{ inputs.max_occurrences_per_species || '5000' }}
        run: |
          set -euo pipefail
          island-v2-bombus-niche-inputs \
            --islands-gpkg data/v2/external/islands/gshhg/prepared/islands_v2.gpkg \
            --min-occurrence-records "$MIN_RECORDS" \
            --max-species "$MAX_SPECIES" \
            --max-occurrences-per-species "$MAX_OCCURRENCES" \
            --output-dir data/v2/staging/bombus/niche_global

      - name: Reject truncated global species registry
        run: |
          python - <<'PY'
          import pandas as pd
          path = "data/v2/staging/bombus/niche_global/bombus_global_species_registry.csv"
          species = pd.read_csv(path)
          if len(species) <= 10:
              raise SystemExit(f"Truncated Bombus registry: only {len(species)} species")
          print({"n_bombus_species": int(len(species))})
          PY

      - name: Spatially thin Bombus occurrence environments
        env:
          THIN_DEGREES: ${{ inputs.spatial_thin_degrees || '0.25' }}
        run: |
          set -euo pipefail
          mv data/v2/staging/bombus/niche_global/bombus_occurrence_environment.csv \
             data/v2/staging/bombus/niche_global/bombus_occurrence_environment_unthinned.csv
          island-v2-bombus-spatial-thin \
            --input-csv data/v2/staging/bombus/niche_global/bombus_occurrence_environment_unthinned.csv \
            --output-csv data/v2/staging/bombus/niche_global/bombus_occurrence_environment.csv \
            --manifest-json data/v2/staging/bombus/niche_global/bombus_spatial_thinning_manifest.json \
            --cell-size-degrees "$THIN_DEGREES"

      - name: Fit global species hypervolumes
        run: |
          set -euo pipefail
          island-v2-bombus-niche-hypervolume run \
            --occurrence-environment-csv data/v2/staging/bombus/niche_global/bombus_occurrence_environment.csv \
            --island-source-pool-environment-csv data/v2/staging/bombus/niche_global/island_source_pool_environment.csv \
            --environment-columns bio1,bio4,bio5,bio6,bio12,bio15,bio18,bio19,elevation \
            --min-occurrences 50 \
            --output-dir data/v2/staging/bombus/niche_global/scored

      - name: Attach predeclared Bombus applicability regime
        run: |
          set -euo pipefail
          island-v2-bombus-regime \
            --compatibility-csv data/v2/staging/bombus/niche_global/scored/bombus_species_environmental_compatibility.csv \
            --applicability-csv data/v2/staging/bombus/applicability/bombus_applicability_by_island.csv \
            --output-dir data/v2/staging/bombus/niche_global/regime

      - name: Build island-level Bombus analysis input
        run: |
          set -euo pipefail
          island-v2-bombus-island-analysis \
            --regime-scores-csv data/v2/staging/bombus/niche_global/regime/bombus_environmental_compatibility_with_regime.csv.gz \
            --output-dir data/v2/staging/bombus/niche_global/island_analysis

      - name: Summarize global result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("data/v2/staging/bombus/niche_global")
          scores = pd.read_csv(root / "scored" / "bombus_species_environmental_compatibility.csv")
          thinning = json.loads((root / "bombus_spatial_thinning_manifest.json").read_text())
          regime = json.loads((root / "regime" / "bombus_regime_summary.json").read_text())
          island_analysis = json.loads((root / "island_analysis" / "bombus_island_analysis_summary.json").read_text())
          applicability = json.loads(
              Path("data/v2/staging/bombus/applicability/bombus_applicability_summary.json").read_text()
          )
          scored = scores.loc[scores["model_status"].eq("scored")].copy()
          graded = pd.to_numeric(scored["univariate_extrapolation_fraction"], errors="coerce")
          summary = {
              "scope": "global_environmental_screen_not_source_pool",
              "n_rows": int(len(scores)),
              "n_islands": int(scores["island_id"].nunique()),
              "n_species": int(scores["bombus_species"].nunique()),
              "status_counts": scores["model_status"].value_counts(dropna=False).to_dict(),
              "inside_hypervolume": int(scores["inside_hypervolume"].fillna(False).astype(bool).sum()),
              "environmental_extrapolation": int(scores["environmental_extrapolation"].fillna(False).astype(bool).sum()),
              "mean_univariate_extrapolation_fraction": float(graded.mean()),
              "median_univariate_extrapolation_fraction": float(graded.median()),
              "environment_columns": ["bio1", "bio4", "bio5", "bio6", "bio12", "bio15", "bio18", "bio19", "elevation"],
              "spatial_thinning": thinning,
              "applicability": applicability,
              "regime": regime,
              "island_analysis": island_analysis,
          }
          (root / "global_real_data_summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload global real-data niche products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bombus-niche-global-real-data-${{ github.run_id }}
          path: |
            config/bombus_hypervolume_artifact_lock.json
            data/v2/external/islands/gshhg/prepared/source_policy.json
            data/v2/staging/bombus/applicability/
            data/v2/staging/bombus/niche_global/
          if-no-files-found: warn
          retention-days: 90
