name: prepare_bombus_niche_real_data

on:
  workflow_dispatch:
    inputs:
      min_occurrence_records:
        description: "Minimum coordinate-bearing GBIF records required for a Bombus species"
        required: false
        default: "50"
      max_species:
        description: "Maximum globally discovered Bombus species retained"
        required: false
        default: "300"
      max_occurrences_per_species:
        description: "Maximum GBIF occurrence records retained per species"
        required: false
        default: "5000"
      spatial_thin_degrees:
        description: "Geographic grid-cell width used to thin occurrence records"
        required: false
        default: "0.25"
      applicability_csv_path:
        description: "Optional repo-relative frozen Bombus applicability registry"
        required: false
        default: "data/v2/curated/bombus_applicability_registry.csv"

permissions:
  contents: read

jobs:
  acquire-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Verify Bombus production contract
        run: pytest -q tests/test_bombus_global_production_contract.py

      - name: Rebuild the declared global island universe
        run: |
          set -euo pipefail
          island-v2-gshhg build --output-dir data/v2/external/islands/gshhg
          test -f data/v2/external/islands/gshhg/prepared/islands_v2.gpkg

      - name: Acquire global Bombus occurrence environments and island climates
        env:
          MIN_RECORDS: ${{ inputs.min_occurrence_records || '50' }}
          MAX_SPECIES: ${{ inputs.max_species || '300' }}
          MAX_OCCURRENCES: ${{ inputs.max_occurrences_per_species || '5000' }}
        run: |
          set -euo pipefail
          island-v2-bombus-niche-inputs acquire-global \
            --islands-gpkg data/v2/external/islands/gshhg/prepared/islands_v2.gpkg \
            --min-occurrence-records "$MIN_RECORDS" \
            --max-species "$MAX_SPECIES" \
            --max-occurrences-per-species "$MAX_OCCURRENCES" \
            --output-dir data/v2/staging/bombus/niche_global

      - name: Spatially thin Bombus occurrence environments
        env:
          THIN_DEGREES: ${{ inputs.spatial_thin_degrees || '0.25' }}
        run: |
          set -euo pipefail
          mv data/v2/staging/bombus/niche_global/bombus_occurrence_environment.csv \
             data/v2/staging/bombus/niche_global/bombus_occurrence_environment_unthinned.csv
          island-v2-bombus-spatial-thin run \
            --input-csv data/v2/staging/bombus/niche_global/bombus_occurrence_environment_unthinned.csv \
            --output-csv data/v2/staging/bombus/niche_global/bombus_occurrence_environment.csv \
            --manifest-json data/v2/staging/bombus/niche_global/bombus_spatial_thinning_manifest.json \
            --cell-size-degrees "$THIN_DEGREES"

      - name: Fit global species hypervolumes
        run: |
          set -euo pipefail
          island-v2-bombus-niche-hypervolume run \
            --occurrence-environment-csv data/v2/staging/bombus/niche_global/bombus_occurrence_environment.csv \
            --island-source-pool-environment-csv data/v2/staging/bombus/niche_global/island_source_pool_environment.csv \
            --environment-columns bio1,bio4,bio5,bio6,bio12,bio15,bio18,bio19,elevation \
            --min-occurrences 50 \
            --output-dir data/v2/staging/bombus/niche_global/scored

      - name: Attach predeclared Bombus applicability regime
        env:
          APPLICABILITY_PATH: ${{ inputs.applicability_csv_path || 'data/v2/curated/bombus_applicability_registry.csv' }}
        run: |
          set -euo pipefail
          SCORE="data/v2/staging/bombus/niche_global/scored/bombus_species_environmental_compatibility.csv"
          OUT="data/v2/staging/bombus/niche_global/regime"
          if [[ -f "$APPLICABILITY_PATH" ]]; then
            island-v2-bombus-regime run \
              --compatibility-csv "$SCORE" \
              --applicability-csv "$APPLICABILITY_PATH" \
              --output-dir "$OUT"
          else
            python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          score_path = Path("data/v2/staging/bombus/niche_global/scored/bombus_species_environmental_compatibility.csv")
          out = Path("data/v2/staging/bombus/niche_global/regime")
          out.mkdir(parents=True, exist_ok=True)
          scores = pd.read_csv(score_path)
          scores["applicability"] = "unresolved"
          scores["native_bombus_status"] = "uncertain"
          scores["bombus_regime"] = "applicability_unresolved"
          scores["primary_bombus_channel_analysis"] = False
          scores["global_comparison_only"] = True
          scores.to_csv(out / "bombus_environmental_compatibility_with_regime.csv.gz", index=False, compression="gzip")
          summary = {
              "contract": "bombus_regime_join_v1",
              "n_rows": int(len(scores)),
              "n_islands": int(scores["island_id"].nunique()),
              "regime_counts": {"applicability_unresolved": int(len(scores))},
              "applicability_registry_found": False,
          }
          (out / "bombus_regime_summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY
          fi

      - name: Summarize global result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("data/v2/staging/bombus/niche_global")
          scores = pd.read_csv(root / "scored" / "bombus_species_environmental_compatibility.csv")
          thinning = json.loads((root / "bombus_spatial_thinning_manifest.json").read_text())
          regime = json.loads((root / "regime" / "bombus_regime_summary.json").read_text())
          summary = {
              "scope": "global_environmental_screen_not_source_pool",
              "n_rows": int(len(scores)),
              "n_islands": int(scores["island_id"].nunique()),
              "n_species": int(scores["bombus_species"].nunique()),
              "status_counts": scores["model_status"].value_counts(dropna=False).to_dict(),
              "inside_hypervolume": int(scores["inside_hypervolume"].fillna(False).astype(bool).sum()),
              "environmental_extrapolation": int(scores["environmental_extrapolation"].fillna(False).astype(bool).sum()),
              "environment_columns": ["bio1", "bio4", "bio5", "bio6", "bio12", "bio15", "bio18", "bio19", "elevation"],
              "spatial_thinning": thinning,
              "regime": regime,
          }
          (root / "global_real_data_summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload global real-data niche products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bombus-niche-global-real-data-${{ github.run_id }}
          path: |
            data/v2/external/islands/gshhg/prepared/source_policy.json
            data/v2/staging/bombus/niche_global/
          if-no-files-found: warn
          retention-days: 90
