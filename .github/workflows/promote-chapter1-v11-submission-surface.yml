name: Promote Chapter 1 v11 submission surface

on:
  push:
    branches: ["ch1/p3-joint-observation-bias"]
    paths:
      - "config/chapter1_v11_figure4_result_lock.json"
      - "config/chapter1_p3_joint_observation_bias_result_lock.json"
      - "docs/chapter1_manuscript_full_v11_island_first_p1_p2_p3_defended_20260915.md"
      - "scripts/promote_chapter1_v11_submission_surface.py"
      - ".github/workflows/promote-chapter1-v11-submission-surface.yml"

permissions:
  contents: write

jobs:
  promote-v11-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ch1/p3-joint-observation-bias
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Promote canonical submission surface
        run: |
          python scripts/promote_chapter1_v11_submission_surface.py

      - name: Validate v11 canonical pointers and P3 boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          readme = Path('README.md').read_text()
          pipeline = Path('docs/PAPER_PIPELINE.md').read_text()
          freeze = Path('docs/chapter1_submission_freeze_20260915_p1_p2_p3_defended.md').read_text()
          sync = Path('docs/chapter1_v11_submission_figure_sync_20260915.md').read_text()
          manuscript = Path('docs/chapter1_manuscript_full_v11_island_first_p1_p2_p3_defended_20260915.md').read_text()
          fig4 = json.loads(Path('config/chapter1_v11_figure4_result_lock.json').read_text())

          required = [
              '1,541/1,575',
              '1,575/1,575',
              '1,269/1,575',
              'finite-domain robust',
              'observation-fragile',
          ]
          for text in (readme, pipeline, freeze, manuscript):
              for token in required[:3]:
                  assert token in text or token.replace(',', '') in text, (token, text[:80])
          assert 'chapter1_manuscript_full_v11_island_first_p1_p2_p3_defended_20260915.md' in readme
          assert 'config/chapter1_v11_figure4_result_lock.json' in readme
          assert 'config/chapter1_p3_joint_observation_bias_result_lock.json' in readme
          assert 'chapter1_p3_joint_observation_bias_result_lock.json' in sync
          assert '34959336481' in sync
          assert fig4['visual_review']['performed'] is True
          assert fig4['grid_fraction_is_probability'] is False
          assert '## Claim ceiling for v11' in manuscript
          assert 'observation-fragile' in manuscript
          PY

      - name: Commit v11 submission surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/PAPER_PIPELINE.md \
            docs/chapter1_v11_submission_figure_sync_20260915.md \
            docs/chapter1_submission_freeze_20260915_p1_p2_p3_defended.md
          if git diff --cached --quiet; then
            echo "No submission-surface changes to commit"
          else
            git commit -m "Promote P3-defended Chapter 1 v11 submission surface [skip ci]"
            git push origin HEAD:ch1/p3-joint-observation-bias
          fi
