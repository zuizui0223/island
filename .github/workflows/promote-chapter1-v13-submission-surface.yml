name: Historical replay — Promote Chapter 1 v13 submission surface

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Promote v13 global-only entry points
        run: python scripts/promote_chapter1_v13_submission_surface.py
      - name: Verify promoted surface before commit
        run: |
          pytest -q tests/test_chapter1_v13_*.py
          ruff check \
            src/island_v2/chapter1_v13_*.py \
            tests/test_chapter1_v13_*.py \
            scripts/promote_chapter1_v13_submission_surface.py
          git diff --check
      - name: Commit promoted submission surface
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md docs/PAPER_PIPELINE.md; then
            echo "Submission surface already promoted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PAPER_PIPELINE.md
          git commit -m "docs: promote Chapter 1 v13 global-only surface"
          git push origin HEAD:ch1-v13-global-only
