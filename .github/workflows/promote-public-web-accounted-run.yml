name: Promote accounted public-web shard run

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed 128-shard public-web workflow run ID
        required: true
        type: string
      expected_species:
        description: Exact source checkpoint denominator
        required: true
        default: "106295"
        type: string
      expected_contract:
        description: Exact shard contract version
        required: true
        default: "public_web_9col_shards_v6"
        type: string
  pull_request:
    paths:
      - ".github/workflows/promote-public-web-accounted-run.yml"
      - "src/island_v2/combine_public_web_artifacts.py"
      - "src/island_v2/web_trait_shard_campaign.py"
      - "tests/test_combine_public_web_artifacts.py"
      - "pyproject.toml"

permissions:
  actions: read
  contents: read

concurrency:
  group: promote-public-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_combine_public_web_artifacts.py

  promote:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      EXPECTED_SPECIES: ${{ inputs.expected_species }}
      EXPECTED_CONTRACT: ${{ inputs.expected_contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download all immutable shard artifacts and metadata
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SPECIES" =~ ^[0-9]+$ ]]
          mkdir -p /tmp/public_web_source /tmp/public_web_combined
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "public-web-trait-shard-*-$SOURCE_RUN_ID" \
            --dir /tmp/public_web_source
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[]' > /tmp/public_web_source_artifacts.jsonl
      - name: Validate and combine all 128 shards
        run: |
          island-v2-combine-public-web \
            --artifact-root /tmp/public_web_source \
            --output-dir /tmp/public_web_combined \
            --source-run-id "$SOURCE_RUN_ID" \
            --expected-shards 128 \
            --expected-species "$EXPECTED_SPECIES" \
            --expected-contract "$EXPECTED_CONTRACT" \
            --artifact-metadata-jsonl /tmp/public_web_source_artifacts.jsonl
          cp /tmp/public_web_source_artifacts.jsonl \
            /tmp/public_web_combined/source_artifacts.jsonl
      - name: Publish verified source-backed counts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("/tmp/public_web_combined/combined_public_web_manifest.json")
              .read_text(encoding="utf-8")
          )
          assert manifest["shard_count"] == 128
          assert manifest["source_denominator"] == int(os.environ["EXPECTED_SPECIES"])
          assert manifest["source_contract"] == os.environ["EXPECTED_CONTRACT"]
          assert manifest["source_artifact_count"] == 128
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("## Promoted public-web evidence\n\n")
              out.write(f"- source run: {manifest['source_run_id']}\n")
              out.write(f"- checkpoint statuses: {manifest['checkpoint_status_counts']}\n")
              out.write(f"- result species: {manifest['n_result_species']:,}\n")
              out.write(
                  f"- species with any requested value: "
                  f"{manifest['n_species_any_requested_value']:,}\n"
              )
              out.write(f"- evidence rows: {manifest['n_trait_evidence_rows']:,}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-web-traits-combined
          path: /tmp/public_web_combined/
          if-no-files-found: error
          retention-days: 90
