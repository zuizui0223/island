name: Publish Chapter 1 Database 1.0 public subset to Zenodo

on:
  pull_request:
    paths:
      - ".github/workflows/publish-chapter1-database-zenodo.yml"
      - "scripts/publish_chapter1_dataset_zenodo.py"
      - "zenodo/chapter1_database_v1_metadata.json"
      - "zenodo/PUBLIC_SUBSET_README.md"
      - "config/chapter1_database_release_source_policy.yml"
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type PUBLISH to irreversibly publish Database 1.0 public subset on Zenodo"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate-publication-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate publisher and Zenodo metadata
        run: |
          python -m py_compile scripts/publish_chapter1_dataset_zenodo.py
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          metadata = json.loads(Path('zenodo/chapter1_database_v1_metadata.json').read_text())
          assert set(metadata) == {'metadata'}
          m = metadata['metadata']
          assert m['upload_type'] == 'dataset'
          assert m['access_right'] == 'open'
          assert m['license'] == 'cc-by-sa-4.0'
          assert m['version'] == '1.0.0'
          assert m['creators'] == [{'name': 'Zhang, Ruiqi'}]
          assert '46,274' in m['description']
          assert '222,688' in m['description']

          policy = yaml.safe_load(Path('config/chapter1_database_release_source_policy.yml').read_text())
          assert policy['public_release_license'] == 'CC-BY-SA-4.0'
          PY

  publish-zenodo:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_publish == 'PUBLISH'
    needs: validate-publication-contract
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      PUBLIC_RUN_ID: "34573211261"
      PUBLIC_ARTIFACT_ID: "10188594170"
      PUBLIC_ARTIFACT_NAME: "chapter1-database-v1-public-subset-34573211261"
      PUBLIC_ARTIFACT_DIGEST: "sha256:c5636cd4ccc650e19182da179fa596b1f64ddfbcd7a495e46826580d1e2c6aa2"
      PUBLIC_SOURCE_COMMIT: "de2250cf984eac6aec3146e1e19ed06dd1017a17"
      PUBLIC_DATA_SHA256: "5bfe3ff4a7417fc73fff67e67915db2300c0102a6c3af5e09821302aa553da12"
      RIGHTS_RUN_ID: "34566271397"
      RIGHTS_ARTIFACT_NAME: "chapter1-database-v1-cell-rights-34566271397"
      IMMUTABLE_DB_SHA256: "a6eef8d731b2730a99e388ddd0683d7ac9b2af30d43f1f9569c857f89f664b2a"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Require Zenodo production credential
        run: |
          if [ -z "${ZENODO_TOKEN:-}" ]; then
            echo "ZENODO_TOKEN repository secret is required; do not paste the token into logs." >&2
            exit 1
          fi

      - name: Verify canonical merged-main public artifact
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLIC_RUN_ID")
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_branch <<<"$run")" = main
          test "$(jq -r .head_sha <<<"$run")" = "$PUBLIC_SOURCE_COMMIT"
          test "$(jq -r .path <<<"$run")" = ".github/workflows/build-chapter1-database-public-subset.yml"

          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLIC_ARTIFACT_ID")
          test "$(jq -r .name <<<"$artifact")" = "$PUBLIC_ARTIFACT_NAME"
          test "$(jq -r .expired <<<"$artifact")" = false
          test "$(jq -r .digest <<<"$artifact")" = "$PUBLIC_ARTIFACT_DIGEST"

          rm -rf /tmp/ch1-public-subset
          mkdir -p /tmp/ch1-public-subset
          gh run download "$PUBLIC_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$PUBLIC_ARTIFACT_NAME" --dir /tmp/ch1-public-subset

      - name: Verify public subset manifest and bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/ch1-public-subset')
          manifest = json.loads((root / 'PUBLIC_SUBSET_MANIFEST.json').read_text())
          assert manifest['resolved_cells'] == 222688
          assert manifest['redistributable_cells'] == 46274
          assert manifest['blocked_or_review_cells'] == 176414
          assert manifest['scientific_values_modified'] is False
          assert manifest['public_release_license'] == 'CC-BY-SA-4.0'
          assert manifest['source_database_species_axis_sha256'] == os.environ['IMMUTABLE_DB_SHA256']
          assert manifest['rights_audit_run_id'] == int(os.environ['RIGHTS_RUN_ID'])

          data = root / 'species_axis_coverage.public.csv.gz'
          h = hashlib.sha256(data.read_bytes()).hexdigest()
          assert h == os.environ['PUBLIC_DATA_SHA256']
          frame = pd.read_csv(data, dtype=str)
          assert len(frame) == 46274
          assert frame['quality'].str.lower().isin({'high', 'medium', 'low'}).all()
          PY

      - name: Add public rights receipts and release documentation
        run: |
          set -euo pipefail
          rm -rf /tmp/ch1-rights
          mkdir -p /tmp/ch1-rights
          gh run download "$RIGHTS_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$RIGHTS_ARTIFACT_NAME" --dir /tmp/ch1-rights

          cp config/chapter1_database_release_source_policy.yml \
            /tmp/ch1-public-subset/SOURCE_RIGHTS_POLICY.yml
          cp zenodo/PUBLIC_SUBSET_README.md \
            /tmp/ch1-public-subset/RELEASE_NOTES.md
          cp zenodo/chapter1_database_v1_metadata.json \
            /tmp/ch1-public-subset/ZENODO_METADATA.json
          cp /tmp/ch1-rights/FINAL_RELEASE_GATE.json \
            /tmp/ch1-public-subset/SOURCE_RELEASE_GATE.json

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          src = Path('/tmp/ch1-rights/CELL_RELEASE_RIGHTS.csv.gz')
          out = Path('/tmp/ch1-public-subset/CELL_RELEASE_RIGHTS.public.csv.gz')
          rights = pd.read_csv(src, dtype=str).fillna('')
          public = rights[rights['release_status'].eq('redistributable')].copy()
          assert len(public) == 46274
          assert public['blocked_source_family_count'].astype(int).eq(0).all()
          public.to_csv(out, index=False, compression='gzip')
          PY

      - name: Publish immutable package to Zenodo
        run: |
          set -euo pipefail
          python scripts/publish_chapter1_dataset_zenodo.py \
            --package-dir /tmp/ch1-public-subset \
            --metadata zenodo/chapter1_database_v1_metadata.json \
            --publish > /tmp/zenodo-publish-result.json
          cat /tmp/zenodo-publish-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/zenodo-publish-result.json').read_text())
          assert result['published'] is True
          assert result.get('doi')
          print(f"Published DOI: {result['doi']}")
          print(f"Record: {result.get('record_url') or result.get('doi_url')}")
          PY

      - name: Record DOI in job summary
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/zenodo-publish-result.json').read_text())
          print('## Chapter 1 Database 1.0 Zenodo publication')
          print()
          print(f"- DOI: `{r['doi']}`")
          print(f"- Record: {r.get('record_url') or r.get('doi_url')}")
          print('- Published object: rights-filtered public derivative (46,274 / 222,688 resolved cells)')
          print('- Scientific analysis database remains the immutable full Database 1.0.')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-database-v1-zenodo-publish-receipt-${{ github.run_id }}
          path: /tmp/zenodo-publish-result.json
          if-no-files-found: warn
          retention-days: 90
