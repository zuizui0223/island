name: qa_v2_collector_hardening

on:
  push:
    branches: [codex/v2-gbif-collector-hardening]
    paths:
      - "config/run_v2_collector_qa.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'run v2 collector QA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package and QA tools
        run: pip install -e ".[dev]"
      - name: Apply safe Ruff fixes and run all tests
        id: checks
        run: |
          set +e
          ruff check --fix src/island_v2 tests
          ruff_status=$?
          pytest -q
          test_status=$?
          echo "ruff_status=$ruff_status" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit safe lint fixes and remove one-shot QA files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm config/run_v2_collector_qa.json .github/workflows/qa-v2-collector-hardening.yml || true
          git add src/island_v2 tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: validate v2 collector hardening"
          git push
      - name: Propagate QA result
        run: |
          test "${{ steps.checks.outputs.ruff_status }}" = "0"
          test "${{ steps.checks.outputs.test_status }}" = "0"
