name: Recover discarded bulk evidence

# Two jobs.
#
# `audit` runs on every pull request and needs no network. It re-reads the
# rejection ledgers the pipeline itself wrote and reports how much of each
# rejection population is a genuine rejection versus a gap in our own matching
# or extraction.
#
# `resolve` is dispatch-only because it calls the GBIF species API. It turns the
# queued usage keys into accepted names and reports how many land on the frozen
# island master. Recovered rows are a review queue, never accepted evidence.

on:
  pull_request:
    paths:
      - ".github/workflows/recover-discarded-bulk-evidence.yml"
      - "config/bulk_recovery.yml"
      - "src/island_v2/bulk_recovery_audit.py"
      - "tests/test_bulk_recovery_audit.py"
  workflow_dispatch:
    inputs:
      max_keys:
        description: "Maximum distinct GBIF usage keys to resolve in one run"
        required: false
        default: "2000"

permissions:
  contents: read

concurrency:
  group: bulk-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Lint and test
        run: |
          ruff check \
            src/island_v2/bulk_recovery_audit.py \
            tests/test_bulk_recovery_audit.py
          pytest -q tests/test_bulk_recovery_audit.py

      - name: Fetch the rejection ledgers from the acquisition branch
        run: |
          set -euo pipefail
          git fetch origin codex/open-web-evidence-pilot --depth=1
          mkdir -p /tmp/ledgers
          for path in \
            data/v2/staging/traits/bulk/meyer_2026_reproductive_traits/name_match_audit.csv.gz \
            data/v2/staging/traits/bulk/razanajatovo_2016_reproductive_traits/name_match_audit.csv.gz \
            data/v2/staging/traits/direct_llm_pilot/20260807_wfo_round2_context_gated_integrated/rejected_wfo_bulk_candidates.csv.gz
          do
            out="/tmp/ledgers/$(echo "$path" | tr '/' '_')"
            git show "origin/codex/open-web-evidence-pilot:$path" > "$out"
            test -s "$out"
          done
          ls -la /tmp/ledgers

      - name: Classify both rejection lanes
        run: |
          set -euo pipefail
          island-v2-bulk-recovery run \
            --config config/bulk_recovery.yml \
            --output-dir /tmp/bulk-recovery \
            --name-match-audit /tmp/ledgers/*meyer_2026*name_match_audit.csv.gz \
            --name-match-audit /tmp/ledgers/*razanajatovo*name_match_audit.csv.gz \
            --rejected-candidates /tmp/ledgers/*rejected_wfo_bulk_candidates.csv.gz

      - uses: actions/upload-artifact@v4
        with:
          name: bulk-recovery-audit-${{ github.run_id }}
          path: /tmp/bulk-recovery
          if-no-files-found: error
          retention-days: 90

  resolve:
    if: github.event_name == 'workflow_dispatch'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          name: bulk-recovery-audit-${{ github.run_id }}
          path: /tmp/bulk-recovery

      - name: Resolve queued GBIF usage keys to accepted island-master names
        env:
          MAX_KEYS: ${{ inputs.max_keys || '2000' }}
        run: |
          python - <<'PY'
          import csv, json, os, time
          from pathlib import Path

          import pandas as pd
          import requests

          from island_v2 import bulk_recovery_audit as recovery

          queue = pd.read_csv("/tmp/bulk-recovery/name_match_recovery_queue.csv", dtype=str)
          queue["n_rows"] = pd.to_numeric(queue["n_rows"], errors="coerce").fillna(0).astype(int)
          queue = queue.head(int(os.environ["MAX_KEYS"]))

          master = set()
          with open("data/v2/staging/gbif/collected/island_taxa.csv", encoding="utf-8") as handle:
              for row in csv.DictReader(handle):
                  master.add(row["accepted_species"].strip())

          session = requests.Session()
          session.headers["User-Agent"] = "island-floral-v2 bulk-recovery (github actions)"
          cache: dict[str, dict | None] = {}

          def fetch(key: str):
              if key in cache:
                  return cache[key]
              record = None
              for attempt in range(4):
                  try:
                      response = session.get(
                          f"https://api.gbif.org/v1/species/{key}", timeout=30
                      )
                      if response.status_code == 200:
                          record = response.json()
                          break
                      if response.status_code == 404:
                          break
                  except requests.RequestException:
                      pass
                  time.sleep(2 ** attempt)
              cache[key] = record
              return record

          resolved = recovery.resolve_name_match_queue(queue, master, fetch)
          resolved.to_csv("/tmp/bulk-recovery/name_match_resolved.csv", index=False)

          recovered = resolved.loc[resolved["outcome"] == "recovered"]
          summary = {
              "n_keys_attempted": int(len(resolved)),
              "outcomes": {
                  str(k): int(v) for k, v in resolved["outcome"].value_counts().items()
              },
              "n_keys_recovered": int(len(recovered)),
              "n_source_rows_recovered": int(recovered["n_rows"].sum()),
              "n_distinct_master_species_recovered": int(
                  recovered["resolved_accepted_species"].nunique()
              ),
              "interpretation": (
                  "Recovered rows are a review queue tagged gbif_usage_key_resolved. "
                  "They are not accepted evidence and do not enter the strict ledger "
                  "without the normal review gate."
              ),
          }
          Path("/tmp/bulk-recovery/name_match_resolution_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bulk-recovery-resolved-${{ github.run_id }}
          path: /tmp/bulk-recovery
          if-no-files-found: error
          retention-days: 90
