name: recover_multilingual_wikimedia

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Previously primary-screened species to recover (1-2000)."
        required: false
        default: "1000"
        type: string
      languages:
        description: "Comma-separated Wikipedia language codes."
        required: false
        default: "ja,zh,ru"
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/recover-multilingual-wikimedia.yml"
      - "src/island_v2/multilingual_wikimedia_recovery.py"
      - "tests/test_multilingual_wikimedia_recovery.py"
      - "src/island_v2/global_candidate_index.py"
      - "config/trait_ontology.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-multilingual-wikimedia.yml"
      - "src/island_v2/multilingual_wikimedia_recovery.py"
      - "tests/test_multilingual_wikimedia_recovery.py"
      - "config/trait_ontology.yml"
  workflow_run:
    workflows: ["drive_global_trait_campaign"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: global-trait-campaign
  cancel-in-progress: false

jobs:
  tests:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Validate recovery implementation and CLI
        run: |
          pytest -q \
            tests/test_multilingual_wikimedia_recovery.py \
            tests/test_global_candidate_index.py
          python -m island_v2.multilingual_wikimedia_recovery --help >/dev/null
      - name: Validate workflow and lint contracts
        run: |
          python scripts/validate_workflows.py
          ruff check \
            src/island_v2/multilingual_wikimedia_recovery.py \
            tests/test_multilingual_wikimedia_recovery.py

  recover:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CAMPAIGN_DIR: data/v2/staging/traits/global_campaign
      BATCH_SIZE: ${{ inputs.batch_size || '1000' }}
      LANGUAGES: ${{ inputs.languages || 'ja,zh,ru' }}
      RECOVERY_LOG: /tmp/multilingual_recovery.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Validate bounded inputs
        run: |
          python - <<'PY'
          import os
          import re

          size = int(os.environ["BATCH_SIZE"])
          if not 1 <= size <= 2000:
              raise SystemExit("batch_size must be between 1 and 2000")
          languages = [
              value.strip()
              for value in os.environ["LANGUAGES"].split(",")
              if value.strip()
          ]
          if not languages or any(
              not re.fullmatch(r"[a-z][a-z0-9]{1,14}", value)
              for value in languages
          ):
              raise SystemExit(
                  "languages must be comma-separated Wikipedia language codes"
              )
          PY
      - name: Recover explicit multilingual statements
        id: recovery
        continue-on-error: true
        run: |
          set -o pipefail
          : > "$RECOVERY_LOG"
          python -m island_v2.multilingual_wikimedia_recovery \
            --campaign-dir "$CAMPAIGN_DIR" \
            --batch-size "$BATCH_SIZE" \
            --languages "$LANGUAGES" \
            2>&1 | tee "$RECOVERY_LOG" | tee /tmp/multilingual_recovery_summary.json
      - name: Record recovery failure for diagnosis and retry
        if: steps.recovery.outcome == 'failure'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p "$CAMPAIGN_DIR"
          tail -n 250 "$RECOVERY_LOG" > "$CAMPAIGN_DIR/multilingual_recovery_failure.log" || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["CAMPAIGN_DIR"])
          payload = {
              "status": "multilingual_recovery_failed",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "source_sha": os.environ["SOURCE_SHA"],
              "event_name": os.environ["EVENT_NAME"],
              "batch_size": int(os.environ["BATCH_SIZE"]),
              "languages": [
                  value.strip()
                  for value in os.environ["LANGUAGES"].split(",")
                  if value.strip()
              ],
              "failure_log": str(
                  directory / "multilingual_recovery_failure.log"
              ),
              "retry_policy": (
                  "No zero hit or infrastructure failure is treated as biological "
                  "absence. The next chained or manual recovery reruns species still "
                  "pending or marked retry."
              ),
          }
          (directory / "multilingual_recovery_failure.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Clear stale recovery failure marker
        if: steps.recovery.outcome == 'success'
        run: |
          rm -f \
            "$CAMPAIGN_DIR/multilingual_recovery_failure.json" \
            "$CAMPAIGN_DIR/multilingual_recovery_failure.log"
      - name: Rebuild cumulative candidate indexes
        if: always()
        run: |
          if test -f "$CAMPAIGN_DIR/campaign_ledger.csv.gz"; then
            island-v2-global-candidate-index --campaign-dir "$CAMPAIGN_DIR"
          else
            echo "No campaign ledger; candidate index rebuild skipped."
          fi
      - name: Publish recovery summary
        if: steps.recovery.outcome == 'success'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          summary = json.loads(
              Path("/tmp/multilingual_recovery_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          print("## Multilingual Wikimedia recovery")
          for key in (
              "status",
              "wave_id",
              "languages",
              "n_species_attempted",
              "n_species_with_source_text",
              "n_candidates_total",
              "n_species_with_candidates",
              "n_new_biotic_species",
              "n_lookup_errors",
          ):
              if key in summary:
                  print(f"- {key}: {summary[key]}")
          print("")
          print(
              "All rows remain machine-only source-backed candidates; "
              "zero hits are not biological absences."
          )
          PY
      - name: Publish recovery failure summary
        if: steps.recovery.outcome == 'failure'
        run: |
          echo "## Multilingual Wikimedia recovery failed" >> "$GITHUB_STEP_SUMMARY"
          cat "$CAMPAIGN_DIR/multilingual_recovery_failure.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat "$CAMPAIGN_DIR/multilingual_recovery_failure.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit recovery state
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$CAMPAIGN_DIR"
          if git diff --cached --quiet; then
            echo "No multilingual recovery state change."
            exit 0
          fi
          if test -f "$CAMPAIGN_DIR/multilingual_recovery_failure.json"; then
            git commit -m "chore: record multilingual recovery failure"
          else
            git commit -m "chore: recover multilingual trait candidates"
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced; rebasing recovery commit (attempt ${attempt})."
            git pull --rebase origin main
          done
          echo "Could not publish multilingual recovery after three attempts." >&2
          exit 1
      - name: Fail after recovery state is persisted
        if: steps.recovery.outcome == 'failure'
        run: exit 1
