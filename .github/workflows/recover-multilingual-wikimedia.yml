name: recover_multilingual_wikimedia

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Previously primary-screened species to recover (1-2000)."
        required: false
        default: "1000"
        type: string
      languages:
        description: "Comma-separated Wikipedia language codes."
        required: false
        default: "ja,zh,ru"
        type: string
  schedule:
    # Share the primary campaign's concurrency group and run between its :17/:47 slots.
    - cron: "10,40 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-multilingual-wikimedia.yml"
      - "src/island_v2/multilingual_wikimedia_recovery.py"
      - "tests/test_multilingual_wikimedia_recovery.py"
      - "config/trait_ontology.yml"

permissions:
  contents: write

concurrency:
  group: global-trait-campaign
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CAMPAIGN_DIR: data/v2/staging/traits/global_campaign
      BATCH_SIZE: ${{ inputs.batch_size || '1000' }}
      LANGUAGES: ${{ inputs.languages || 'ja,zh,ru' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Validate recovery implementation
        run: |
          pytest -q \
            tests/test_multilingual_wikimedia_recovery.py \
            tests/test_global_candidate_index.py
      - name: Validate bounded inputs
        run: |
          python - <<'PY'
          import os
          import re

          size = int(os.environ["BATCH_SIZE"])
          if not 1 <= size <= 2000:
              raise SystemExit("batch_size must be between 1 and 2000")
          languages = [value.strip() for value in os.environ["LANGUAGES"].split(",") if value.strip()]
          if not languages or any(not re.fullmatch(r"[a-z][a-z0-9]{1,14}", value) for value in languages):
              raise SystemExit("languages must be comma-separated Wikipedia language codes")
          PY
      - name: Recover explicit multilingual statements
        id: recovery
        run: |
          set -euo pipefail
          python -m island_v2.multilingual_wikimedia_recovery run \
            --campaign-dir "$CAMPAIGN_DIR" \
            --batch-size "$BATCH_SIZE" \
            --languages "$LANGUAGES" \
            | tee /tmp/multilingual_recovery_summary.json
      - name: Rebuild cumulative candidate indexes
        run: island-v2-global-candidate-index --campaign-dir "$CAMPAIGN_DIR"
      - name: Publish recovery summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          summary = json.loads(
              Path("/tmp/multilingual_recovery_summary.json").read_text(encoding="utf-8")
          )
          print("## Multilingual Wikimedia recovery")
          for key in (
              "status",
              "wave_id",
              "languages",
              "n_species_attempted",
              "n_species_with_source_text",
              "n_candidates_total",
              "n_species_with_candidates",
              "n_new_biotic_species",
              "n_lookup_errors",
          ):
              if key in summary:
                  print(f"- {key}: {summary[key]}")
          print("")
          print("All rows remain machine-only source-backed candidates; zero hits are not biological absences.")
          PY
      - name: Commit recovery wave and ledger
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$CAMPAIGN_DIR"
          if git diff --cached --quiet; then
            echo "No multilingual recovery change."
            exit 0
          fi
          git commit -m "chore: recover multilingual trait candidates"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced; rebasing recovery commit (attempt ${attempt})."
            git pull --rebase origin main
          done
          echo "Could not publish multilingual recovery after three attempts." >&2
          exit 1
