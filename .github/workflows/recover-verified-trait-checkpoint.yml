name: Recover verified public trait checkpoint
on:
  workflow_dispatch:
  push:
    branches: [codex/recover-verified-checkpoint]
    paths:
      - scripts/recover_verified_trait_checkpoint.py
      - .github/workflows/recover-verified-trait-checkpoint.yml
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Recover immutable public inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33605098044 --repo "$GITHUB_REPOSITORY" --name wave53-support-two-reproductive-unlock-v2-33605098044 --dir /tmp/source
          python scripts/recover_verified_trait_checkpoint.py --source /tmp/source --output artifacts/recovered-checkpoint
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-public-trait-checkpoint-${{ github.run_id }}
          path: artifacts/recovered-checkpoint/
          if-no-files-found: error
          retention-days: 90
