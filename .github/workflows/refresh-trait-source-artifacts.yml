name: Refresh durable trait source artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: refresh-durable-trait-source-artifacts
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [eol, austraits, efloras, gift, usda]
    steps:
      - name: Dispatch ${{ matrix.source }} refresh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          case "$SOURCE" in
            eol)
              gh workflow run ingest-eol-traitbank-bulk.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
              ;;
            austraits)
              gh workflow run ingest-austraits-all-floral-bulk.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
              ;;
            efloras)
              gh workflow run fetch-efloras-all.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
                -f run_mode=production \
                -f shard_index=all \
                -f shard_count=4 \
                -f save_html=false
              ;;
            gift)
              gh workflow run ingest-gift-direct-traits.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
              ;;
            usda)
              gh workflow run ingest-usda-plants-direct-traits.yml \
                --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
              ;;
            *)
              echo "Unknown source: $SOURCE" >&2
              exit 1
              ;;
          esac
          echo "Dispatched $SOURCE refresh." >> "$GITHUB_STEP_SUMMARY"
