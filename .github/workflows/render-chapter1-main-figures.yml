name: Render corrected Chapter 1 main figures

on:
  push:
    branches:
      - paper/main-figures-20260927
    paths:
      - "scripts/submission/render_chapter1_main_figures.py"
      - ".github/workflows/render-chapter1-main-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[figures]" ruff
      - name: Lint renderer
        run: ruff check scripts/submission/render_chapter1_main_figures.py
      - name: Render Figures 1, 2, 4, 5 and 6
        run: python scripts/submission/render_chapter1_main_figures.py
      - name: Verify six-figure package
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          root = Path("submission/chapter1_current/figures")
          manifest = json.loads((root / "FIGURE_MANIFEST.json").read_text())
          assert len(manifest["figures"]) == 6
          for item in manifest["figures"]:
              svg = root / item["svg"]
              assert svg.stat().st_size > 1000
              assert ET.parse(svg).getroot().tag.endswith("svg")
              if item["figure"] != 3:
                  pdf = root / item["pdf"]
                  assert pdf.stat().st_size > 1000
          print("Verified current main Figures 1-6.")
          PY
      - name: Commit rendered figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/chapter1_current/figures
          if git diff --cached --quiet; then
            echo "No figure changes"
            exit 0
          fi
          git commit -m "Render corrected Chapter 1 main figures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
