name: Render Chapter 1 publication figures

on:
  push:
    branches: [chore/chapter1-publication-figures]
    paths:
      - "src/island_v2/chapter1_publication_*.py"
      - "tests/test_chapter1_publication_figures.py"
      - "docs/superpowers/specs/2026-09-17-chapter1-publication-figures-design.md"
      - "docs/superpowers/plans/2026-09-17-chapter1-publication-figures.md"
      - ".github/workflows/render-chapter1-publication-figures.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/chapter1_publication_*.py"
      - "tests/test_chapter1_publication_figures.py"
      - "docs/chapter1_v13_submission_figure_sync_20260917.md"
      - "docs/chapter1_manuscript_full_v13_global_pollination_constraint_20260917.md"
      - ".github/workflows/render-chapter1-publication-figures.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CH1_PUBLICATION_INPUT_ROOT: /tmp/ch1-publication-inputs
      PURPOSE_RUN_ID: "29228212586"
      PURPOSE_ARTIFACT: "purpose-shortest-distance-regime-29228212586"
      ATOMIC_RUN_ID: "34961775336"
      ATOMIC_ARTIFACT: "chapter1-all-data-probability-34961775336"
      GLOPL_OVERLAP_RUN_ID: "35085378171"
      GLOPL_OVERLAP_ARTIFACT: "chapter1-h5-glopl-island-overlap-preflight-35085378171"
      GLOPL_GLOBAL_RUN_ID: "35090599662"
      GLOPL_GLOBAL_ARTIFACT: "chapter1-h5-glopl-global-distance-35090599662"
      GLOPL_SHAPE_RUN_ID: "35091385147"
      GLOPL_SHAPE_ARTIFACT: "chapter1-h5-glopl-global-shape-audit-35091385147"
      FUNCTIONAL_RUN_ID: "35141624253"
      FUNCTIONAL_ARTIFACT: "chapter1-v13-functional-bridge-35141624253"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install figure dependencies
        run: pip install -e ".[dev,figures]"

      - name: Download frozen publication inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$CH1_PUBLICATION_INPUT_ROOT"
          mkdir -p "$root"/{isolation,atomic,glopl_overlap,glopl_global,glopl_shape,functional_bridge}
          gh run download "$PURPOSE_RUN_ID" -n "$PURPOSE_ARTIFACT" -D "$root/isolation"
          gh run download "$ATOMIC_RUN_ID" -n "$ATOMIC_ARTIFACT" -D "$root/atomic"
          gh run download "$GLOPL_OVERLAP_RUN_ID" -n "$GLOPL_OVERLAP_ARTIFACT" -D "$root/glopl_overlap"
          gh run download "$GLOPL_GLOBAL_RUN_ID" -n "$GLOPL_GLOBAL_ARTIFACT" -D "$root/glopl_global"
          gh run download "$GLOPL_SHAPE_RUN_ID" -n "$GLOPL_SHAPE_ARTIFACT" -D "$root/glopl_shape"
          gh run download "$FUNCTIONAL_RUN_ID" -n "$FUNCTIONAL_ARTIFACT" -D "$root/functional_bridge"
          test -s "$root/isolation/results/purpose_shortest_island_data.csv"
          test -s "$root/atomic/all/beta_binomial_within_slopes.csv"
          test -s "$root/atomic/direct/beta_binomial_within_slopes.csv"
          test -s "$root/glopl_overlap/GLOPL_METADATA_ISLAND_MATCH.csv.gz"
          test -s "$root/glopl_global/out/RESULT.json"
          test -s "$root/glopl_shape/RESULT.json"
          test -s "$root/functional_bridge/functional_bridge_trait_results.csv"

      - name: Run publication contract tests
        run: pytest -q tests/test_chapter1_publication_figures.py

      - name: Lint publication modules
        run: ruff check tests/test_chapter1_publication_figures.py src/island_v2/chapter1_publication_data.py src/island_v2/chapter1_publication_figures.py

      - name: Render publication bundle
        run: |
          python -m island_v2.chapter1_publication_data \
            --input-root "$CH1_PUBLICATION_INPUT_ROOT" \
            --output-dir figures/chapter1/source_data
          python -m island_v2.chapter1_publication_figures \
            --source-dir figures/chapter1/source_data \
            --output-dir figures/chapter1

      - name: Verify required outputs
        run: |
          set -euo pipefail
          for stem in \
            figure1_global_coverage \
            figure2_recurrent_plant_response \
            figure3_pollen_limitation_bridge; do
            for ext in pdf svg png; do
              test -s "figures/chapter1/main/${stem}.${ext}"
            done
          done
          for stem in \
            extended_data_figure1_atomic_support \
            extended_data_figure2_sampling_overlap \
            extended_data_figure3_glopl_sensitivity \
            extended_data_figure4_functional_bridge_sensitivity; do
            for ext in pdf svg png; do
              test -s "figures/chapter1/extended_data/${stem}.${ext}"
            done
          done
          test -s figures/chapter1/source_data/publication_figure_manifest.json

      - name: Upload publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-publication-figures-${{ github.run_id }}
          path: figures/chapter1
          if-no-files-found: error
          retention-days: 30
