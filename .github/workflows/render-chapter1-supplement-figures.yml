name: Render Chapter 1 supplementary figures

on:
  push:
    branches:
      - paper/supplement-figures-20260927
    paths:
      - "scripts/submission/render_chapter1_supplement_figures.py"
      - ".github/workflows/render-chapter1-supplement-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[figures]" ruff
      - name: Lint renderer
        run: ruff check scripts/submission/render_chapter1_supplement_figures.py
      - name: Render S1-S7
        run: |
          rm -rf submission/chapter1_current/supplement/figures
          python scripts/submission/render_chapter1_supplement_figures.py
      - name: Verify outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          root = Path("submission/chapter1_current/supplement/figures")
          manifest = json.loads((root / "FIGURE_MANIFEST.json").read_text())
          assert manifest["n_figures"] == 7
          for idx in range(1, 8):
              svg = next(root.glob(f"Figure_S{idx}_*.svg"))
              pdf = next(root.glob(f"Figure_S{idx}_*.pdf"))
              assert svg.stat().st_size > 1000
              assert pdf.stat().st_size > 1000
              assert ET.parse(svg).getroot().tag.endswith("svg")
          print("Verified seven SVG/PDF supplement figures.")
          PY
      - name: Commit rendered figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/chapter1_current/supplement/figures
          if git diff --cached --quiet; then
            echo "No figure changes"
            exit 0
          fi
          git commit -m "Render Chapter 1 supplementary figures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
