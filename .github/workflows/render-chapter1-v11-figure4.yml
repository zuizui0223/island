name: Historical replay — Render Chapter 1 v11 Figure 4 joint observation boundaries

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render-v11-figure4:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      JOINT_RUN: "34949880409"
      JOINT_ID: "10389197309"
      JOINT_NAME: "chapter1-joint-observation-bias-34949880409"
      JOINT_DIGEST: "sha256:b5cfe366686f83975dd989275904d2e0ddfbf43be27ffbd503dd05439a5264b2"
      GEOM_RUN: "34765070227"
      GEOM_ID: "10320630085"
      GEOM_NAME: "chapter1-observed-response-geometry-34765070227"
      GEOM_DIGEST: "sha256:5ac34231b0cfa4acc1d536ab798a574a3cbcdd9423b6f0f2995195aab78a2f23"
      H5C_RUN: "34803837463"
      H5C_ID: "10332871066"
      H5C_NAME: "chapter1-h5c-observed-specificity-34803837463"
      H5C_DIGEST: "sha256:fb8927bcf2b6e1c762b3ecbe59c42360faac679cf37b1ad0ed31386631a0f405"
      H5D_RUN: "34803545574"
      H5D_ID: "10332671123"
      H5D_NAME: "chapter1-h5d-identifiability-34803545574"
      H5D_DIGEST: "sha256:13ea1c3cd0066950d37fa3399f771d41ea2755c9746d02ac18594e224d895539"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,figures]"

      - name: Test and lint Figure 4
        run: |
          pytest -q tests/test_chapter1_v11_figure4_joint_observation_boundaries.py
          ruff check \
            src/island_v2/chapter1_v11_figure4_joint_observation_boundaries.py \
            tests/test_chapter1_v11_figure4_joint_observation_boundaries.py

      - name: Verify and download frozen artifacts
        run: |
          set -euo pipefail
          fetch_one () {
            run=$1; id=$2; name=$3; digest=$4; dir=$5
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100")
            observed_id=$(jq -r ".artifacts[] | select(.name == \"$name\" and .expired == false) | .id" <<<"$metadata")
            observed_digest=$(jq -r ".artifacts[] | select(.name == \"$name\" and .expired == false) | .digest" <<<"$metadata")
            test "$observed_id" = "$id"
            test "$observed_digest" = "$digest"
            mkdir -p "$dir"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$dir"
          }
          rm -rf /tmp/v11fig4
          fetch_one "$JOINT_RUN" "$JOINT_ID" "$JOINT_NAME" "$JOINT_DIGEST" /tmp/v11fig4/joint
          fetch_one "$GEOM_RUN" "$GEOM_ID" "$GEOM_NAME" "$GEOM_DIGEST" /tmp/v11fig4/geom
          fetch_one "$H5C_RUN" "$H5C_ID" "$H5C_NAME" "$H5C_DIGEST" /tmp/v11fig4/h5c
          fetch_one "$H5D_RUN" "$H5D_ID" "$H5D_NAME" "$H5D_DIGEST" /tmp/v11fig4/h5d
          cat > /tmp/v11fig4/sources.json <<JSON
          {"joint":{"run":$JOINT_RUN,"artifact":$JOINT_ID,"digest":"$JOINT_DIGEST"},"geometry":{"run":$GEOM_RUN,"artifact":$GEOM_ID,"digest":"$GEOM_DIGEST"},"h5c":{"run":$H5C_RUN,"artifact":$H5C_ID,"digest":"$H5C_DIGEST"},"h5d":{"run":$H5D_RUN,"artifact":$H5D_ID,"digest":"$H5D_DIGEST"}}
          JSON

      - name: Render Figure 4
        run: |
          python -m island_v2.chapter1_v11_figure4_joint_observation_boundaries \
            --joint-root /tmp/v11fig4/joint/joint-observation-bias \
            --geometry-root /tmp/v11fig4/geom \
            --h5c-root /tmp/v11fig4/h5c \
            --h5d-root /tmp/v11fig4/h5d \
            --output-dir /tmp/v11fig4/out \
            --source-receipts-json /tmp/v11fig4/sources.json

      - name: Validate Figure 4 outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('/tmp/v11fig4/out')
          manifest = json.loads((root/'chapter1_v11_figure4_manifest.json').read_text())
          assert manifest['contract'] == 'chapter1_v11_figure4_joint_observation_boundaries_v1'
          assert manifest['grid_fraction_is_probability'] is False
          assert manifest['new_biological_models_fitted'] is False
          assert manifest['new_p_values_generated'] is False
          assert manifest['claim_boundaries']['geometry_promoted'] == 0
          assert manifest['claim_boundaries']['h5d_qualified'] == 0
          png = root/'chapter1_v11_figure4_joint_observation_boundaries.png'
          with Image.open(png) as im:
              width, height = im.size
          assert width >= 3000 and height >= 1800
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-v11-figure4-${{ github.run_id }}
          path: /tmp/v11fig4/out/
          if-no-files-found: error
          retention-days: 90
