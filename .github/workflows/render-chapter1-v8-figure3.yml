name: Render Chapter 1 v8 Figure 3 assembly depth

on:
  push:
    branches: ["ch1/v8-figure-architecture"]
    paths:
      - "src/island_v2/chapter1_v8_figure3_assembly_depth.py"
      - "tests/test_chapter1_v8_figure3_assembly_depth.py"
      - ".github/workflows/render-chapter1-v8-figure3.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render-v8-figure3:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EFFECT_RUN_ID: "34796763611"
      EFFECT_ARTIFACT_ID: "10330230959"
      EFFECT_ARTIFACT_NAME: "chapter1-effect-fingerprint-34796763611"
      EFFECT_ARTIFACT_DIGEST: "sha256:a2db683b6d46ca09d4eae6d9a3bfcaf85a4f172b5589227958bc388df8edba60"
      PRIMARY_RUN_ID: "34232450884"
      PRIMARY_ARTIFACT_ID: "10058653212"
      PRIMARY_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PRIMARY_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository with figure dependencies
        run: pip install -e ".[dev,figures]"

      - name: Test and lint v8 Figure 3 renderer
        run: |
          pytest -q tests/test_chapter1_v8_figure3_assembly_depth.py
          ruff check \
            src/island_v2/chapter1_v8_figure3_assembly_depth.py \
            tests/test_chapter1_v8_figure3_assembly_depth.py

      - name: Verify and download frozen effect-fingerprint artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EFFECT_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$EFFECT_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$EFFECT_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$EFFECT_ARTIFACT_ID"
          test "$observed_digest" = "$EFFECT_ARTIFACT_DIGEST"
          rm -rf /tmp/v8-figure3-effect
          mkdir -p /tmp/v8-figure3-effect
          gh run download "$EFFECT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$EFFECT_ARTIFACT_NAME" --dir /tmp/v8-figure3-effect

      - name: Verify and download frozen PR142 artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIMARY_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$PRIMARY_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$PRIMARY_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$PRIMARY_ARTIFACT_ID"
          test "$observed_digest" = "$PRIMARY_ARTIFACT_DIGEST"
          rm -rf /tmp/v8-figure3-primary
          mkdir -p /tmp/v8-figure3-primary
          gh run download "$PRIMARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PRIMARY_ARTIFACT_NAME" --dir /tmp/v8-figure3-primary

      - name: Render v8 Figure 3
        run: |
          rm -rf /tmp/v8-figure3
          python -m island_v2.chapter1_v8_figure3_assembly_depth \
            --effect-root /tmp/v8-figure3-effect \
            --pr142-root /tmp/v8-figure3-primary \
            --output-dir /tmp/v8-figure3 \
            --effect-run-id "$EFFECT_RUN_ID" \
            --effect-artifact-id "$EFFECT_ARTIFACT_ID" \
            --effect-artifact-digest "$EFFECT_ARTIFACT_DIGEST" \
            --primary-run-id "$PRIMARY_RUN_ID" \
            --primary-artifact-id "$PRIMARY_ARTIFACT_ID" \
            --primary-artifact-digest "$PRIMARY_ARTIFACT_DIGEST"

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('/tmp/v8-figure3')
          m = json.loads((root/'chapter1_v8_figure3_manifest.json').read_text())
          assert m['contract'] == 'chapter1_v8_figure3_assembly_depth_v1'
          assert m['n_attenuation_profiles'] == 16
          assert m['n_canonical_stage_effect_rows'] == 24
          assert m['n_classification_cells'] == 4
          assert m['frozen_support_ladder'] == '4/4 -> 4/4 -> 0/4'
          assert m['new_biological_models_fitted'] is False
          assert m['new_p_values_generated'] is False
          assert 0.19 <= m['family_attenuation_fraction_range'][0] <= 0.34
          assert 0.78 <= m['genus_attenuation_fraction_range'][0] <= 0.87
          png = root/'chapter1_v8_figure3_assembly_depth.png'
          svg = root/'chapter1_v8_figure3_assembly_depth.svg'
          pdf = root/'chapter1_v8_figure3_assembly_depth.pdf'
          for path in (png, svg, pdf):
              assert path.is_file() and path.stat().st_size > 5_000
          with Image.open(png) as image:
              width, height = image.size
          assert width >= 2800 and height >= 1800
          print(f'v8 Figure 3 PNG: {width} x {height}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-v8-figure3-${{ github.run_id }}
          path: /tmp/v8-figure3/
          if-no-files-found: error
          retention-days: 90
