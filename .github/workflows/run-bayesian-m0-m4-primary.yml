name: run_bayesian_m0_m4_primary

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-bayesian-m0-m4-primary.yml"
      - "src/island_v2/bayesian_m0_m4_input.py"
      - "analysis/v2/run_bayesian_m0_m4_primary.R"
      - "config/integrated_trait_bombus_artifact_lock.json"

permissions:
  actions: read
  contents: read

jobs:
  bayesian-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python package
        run: pip install -e .

      - name: Download locked integrated island-trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/integrated_trait_bombus_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/integrated_trait_bombus_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/integrated.zip
          test "$(sha256sum /tmp/integrated.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download fixed purpose-shortest distance/covariate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=8270544465
          EXPECTED=695f35b97bae07e81b05deab537dd73fa687b2d99e9efdb1cb3babd2fa12dfb6
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/purpose.zip
          test "$(sha256sum /tmp/purpose.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/purpose
          unzip -q /tmp/purpose.zip -d /tmp/purpose

      - name: Build Bayesian M0-M4 analysis input from island×species traits
        run: |
          set -euo pipefail
          MASTER=$(find /tmp/integrated -path '*/bombus_join/sensitivity_all/island_species_trait_bombus_master.csv.gz' -print -quit)
          COV=$(find /tmp/purpose -name purpose_shortest_island_data.csv -print -quit)
          test -f "$MASTER"
          test -f "$COV"
          python -m island_v2.bayesian_m0_m4_input \
            --master-csv "$MASTER" \
            --island-covariates-csv "$COV" \
            --output-dir data/v2/staging/analysis/bayesian_m0_m4/input

      - name: Install R and Bayesian dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base r-cran-brms r-cran-loo r-cran-posterior r-cran-readr r-cran-dplyr
          Rscript -e 'stopifnot(requireNamespace("brms"), requireNamespace("loo"), requireNamespace("posterior"))'

      - name: Run Bayesian M0-M4 primary analysis
        run: |
          set -euo pipefail
          Rscript analysis/v2/run_bayesian_m0_m4_primary.R \
            data/v2/staging/analysis/bayesian_m0_m4/input/bayesian_m0_m4_island_input.csv \
            data/v2/staging/analysis/bayesian_m0_m4/results

      - name: Print primary results
        if: always()
        run: |
          set -euo pipefail
          find data/v2/staging/analysis/bayesian_m0_m4 -maxdepth 2 -type f -printf '%p\n' || true
          if test -f data/v2/staging/analysis/bayesian_m0_m4/results/bayesian_m0_m4_scenario_comparison.csv; then
            cat data/v2/staging/analysis/bayesian_m0_m4/results/bayesian_m0_m4_scenario_comparison.csv
          fi
          if test -f data/v2/staging/analysis/bayesian_m0_m4/results/bayesian_m3_indirect_effects.csv; then
            cat data/v2/staging/analysis/bayesian_m0_m4/results/bayesian_m3_indirect_effects.csv
          fi

      - name: Upload Bayesian primary result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayesian-m0-m4-primary-${{ github.run_id }}
          path: data/v2/staging/analysis/bayesian_m0_m4/
          if-no-files-found: error
          retention-days: 90
