name: run_bombus_occurrence_evidence

on:
  workflow_dispatch:
    inputs:
      occurrences_csv:
        description: "Repo-relative exact-island pollinator occurrence CSV. Leave blank to collect from a GBIF pollinator campaign first."
        required: false
        default: ""
      campaign_json:
        description: "Repo-relative GBIF pollinator campaign ledger JSON, required when occurrences_csv is blank."
        required: false
        default: ""
      block_members_csv:
        description: "Repo-relative pollinator block-members CSV, required when occurrences_csv is blank."
        required: false
        default: ""
      islands_gpkg:
        description: "Repo-relative frozen exact-island polygons GeoPackage, required when occurrences_csv is blank."
        required: false
        default: ""
      environmental_scores_csv:
        description: "Optional precomputed repo-relative island x source-pool Bombus environmental compatibility CSV."
        required: false
        default: ""
      occurrence_environment_csv:
        description: "Optional repo-relative Bombus occurrence-site environmental CSV for fitting species niches."
        required: false
        default: ""
      island_source_pool_environment_csv:
        description: "Optional repo-relative island x source-pool Bombus environmental CSV to score."
        required: false
        default: ""
      environment_columns:
        description: "Comma-separated, predeclared environmental columns; required with the two raw environmental tables."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Resolve or collect exact-island Apidae occurrences
        env:
          INPUT_OCCURRENCES: ${{ inputs.occurrences_csv }}
          INPUT_CAMPAIGN: ${{ inputs.campaign_json }}
          INPUT_MEMBERS: ${{ inputs.block_members_csv }}
          INPUT_ISLANDS: ${{ inputs.islands_gpkg }}
        run: |
          set -euo pipefail
          mkdir -p data/v2/staging/bombus/occurrence_evidence
          if [[ -n "$INPUT_OCCURRENCES" ]]; then
            test -f "$INPUT_OCCURRENCES"
            cp "$INPUT_OCCURRENCES" data/v2/staging/bombus/occurrence_evidence/island_pollinator_occurrences.csv
          else
            for p in "$INPUT_CAMPAIGN" "$INPUT_MEMBERS" "$INPUT_ISLANDS"; do
              if [[ -z "$p" || ! -f "$p" ]]; then
                echo "Provide an existing occurrences_csv, or all of campaign_json, block_members_csv, and islands_gpkg." >&2
                exit 2
              fi
            done
            island-v2-gbif-pollinator-collect collect \
              --campaign-json "$INPUT_CAMPAIGN" \
              --block-members-csv "$INPUT_MEMBERS" \
              --islands-gpkg "$INPUT_ISLANDS" \
              --download-dir data/v2/staging/bombus/gbif_downloads \
              --output-dir data/v2/staging/bombus/occurrence_evidence \
              --expected-family Apidae
          fi

      - name: Run effort-aware Bombus occurrence evidence
        run: |
          set -euo pipefail
          island-v2-bombus-diagnostics run \
            --occurrences-csv data/v2/staging/bombus/occurrence_evidence/island_pollinator_occurrences.csv \
            --output-dir data/v2/staging/bombus/occurrence_evidence/base
          island-v2-bombus-absence-evidence run \
            --occurrences-csv data/v2/staging/bombus/occurrence_evidence/island_pollinator_occurrences.csv \
            --output-dir data/v2/staging/bombus/occurrence_evidence/final

      - name: Resolve Bombus environmental compatibility scores
        env:
          INPUT_PRECOMPUTED: ${{ inputs.environmental_scores_csv }}
          INPUT_OCCURRENCE_ENV: ${{ inputs.occurrence_environment_csv }}
          INPUT_ISLAND_ENV: ${{ inputs.island_source_pool_environment_csv }}
          INPUT_ENV_COLUMNS: ${{ inputs.environment_columns }}
        run: |
          set -euo pipefail
          resolved=""
          if [[ -n "$INPUT_PRECOMPUTED" ]]; then
            if [[ -n "$INPUT_OCCURRENCE_ENV" || -n "$INPUT_ISLAND_ENV" ]]; then
              echo "Provide either environmental_scores_csv or the two raw environmental tables, not both." >&2
              exit 2
            fi
            test -f "$INPUT_PRECOMPUTED"
            resolved="$INPUT_PRECOMPUTED"
          elif [[ -n "$INPUT_OCCURRENCE_ENV" || -n "$INPUT_ISLAND_ENV" ]]; then
            if [[ -z "$INPUT_OCCURRENCE_ENV" || -z "$INPUT_ISLAND_ENV" ]]; then
              echo "Both occurrence_environment_csv and island_source_pool_environment_csv are required." >&2
              exit 2
            fi
            if [[ -z "$INPUT_ENV_COLUMNS" ]]; then
              echo "environment_columns is required when fitting the niche estimator in production." >&2
              exit 2
            fi
            test -f "$INPUT_OCCURRENCE_ENV"
            test -f "$INPUT_ISLAND_ENV"
            island-v2-bombus-niche-hypervolume run \
              --occurrence-environment-csv "$INPUT_OCCURRENCE_ENV" \
              --island-source-pool-environment-csv "$INPUT_ISLAND_ENV" \
              --environment-columns "$INPUT_ENV_COLUMNS" \
              --output-dir data/v2/staging/bombus/niche_hypervolume
            resolved="data/v2/staging/bombus/niche_hypervolume/bombus_species_environmental_compatibility.csv"
          elif [[ -n "$INPUT_ENV_COLUMNS" ]]; then
            echo "environment_columns has no effect without the two raw environmental tables." >&2
            exit 2
          fi
          echo "BOMBUS_ENVIRONMENTAL_SCORES=$resolved" >> "$GITHUB_ENV"

      - name: Build continuous Bombus channel scores
        run: |
          set -euo pipefail
          args=(
            --diagnostics-csv data/v2/staging/bombus/occurrence_evidence/final/island_bombus_occurrence_evidence.csv
            --output-dir data/v2/staging/bombus/occurrence_evidence/continuous
          )
          if [[ -n "${BOMBUS_ENVIRONMENTAL_SCORES:-}" ]]; then
            test -f "$BOMBUS_ENVIRONMENTAL_SCORES"
            args+=(--environmental-scores-csv "$BOMBUS_ENVIRONMENTAL_SCORES")
          fi
          island-v2-bombus-channel-score run "${args[@]}"

      - name: Summarize result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("data/v2/staging/bombus/occurrence_evidence")
          table = pd.read_csv(root / "final" / "island_bombus_occurrence_evidence.csv")
          scores = pd.read_csv(root / "continuous" / "bombus_channel_continuous_scores.csv")
          counts = table["bombus_occurrence_evidence"].value_counts(dropna=False).to_dict()
          summary = {
              "n_islands": int(len(table)),
              "n_evaluable": int(table["bombus_channel_evaluable"].astype(bool).sum()),
              "occurrence_evidence_counts": {str(k): int(v) for k, v in counts.items()},
              "mean_observation_availability": float(scores["observation_availability"].mean()),
              "mean_observation_deficit": float(scores["observation_deficit"].mean()),
              "n_environmental_scores": int(scores["environmental_compatibility"].notna().sum()),
          }
          (root / "bombus_occurrence_evidence_run_summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload Bombus occurrence-evidence products
        uses: actions/upload-artifact@v4
        with:
          name: bombus-occurrence-evidence-${{ github.run_id }}
          path: data/v2/staging/bombus/occurrence_evidence/
          if-no-files-found: error
          retention-days: 90
