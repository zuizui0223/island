name: Run Chapter 1 all-data model-form sensitivity

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - "config/chapter1_all_data_grouped_binomial.yml"
      - ".github/workflows/run-chapter1-all-data-model-form.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download frozen Chapter 1 inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-model-form
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/ch1-model-form
          test -s /tmp/ch1-model-form/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/ch1-model-form/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/ch1-model-form/snapshot/chapter1_trait_state_audit_all.csv.gz
          test -s /tmp/ch1-model-form/snapshot/chapter1_trait_state_audit_direct.csv.gz
      - name: Fit matched grouped-binomial all-evidence model
        run: |
          python -m island_v2.chapter1_pr138_biogeographic_pattern \
            --status-flora-csv /tmp/ch1-model-form/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-model-form/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv /tmp/ch1-model-form/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_all_data_grouped_binomial.yml \
            --output-dir /tmp/results/all
      - name: Fit matched grouped-binomial direct-only sensitivity
        run: |
          python -m island_v2.chapter1_pr138_biogeographic_pattern \
            --status-flora-csv /tmp/ch1-model-form/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-model-form/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv /tmp/ch1-model-form/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_all_data_grouped_binomial.yml \
            --output-dir /tmp/results/direct
      - name: Extract matched North-Tropical comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          lines = ['# Matched grouped-binomial sensitivity', '']
          rows = []
          for scope in ('all','direct'):
              root = Path('/tmp/results') / scope
              x = pd.read_csv(root / 'observed_between_region_omnibus.csv')
              hit = x.loc[
                  x['stratum'].eq('all_observed')
                  & x['support_tier'].eq('confirmatory')
                  & x['context_a'].eq('northern_midlatitude')
                  & x['context_b'].eq('tropical')
              ].copy()
              hit['evidence_scope'] = scope
              rows.append(hit)
              lines += [f'## {scope}', '', '```csv', hit.to_csv(index=False).strip(), '```', '']
          out = pd.concat(rows, ignore_index=True)
          out.to_csv('/tmp/results/matched_north_tropical.csv', index=False)
          Path('/tmp/results/summary.md').write_text('\n'.join(lines), encoding='utf-8')
          print(out.to_string(index=False))
          PY
          cat /tmp/results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-all-data-model-form-${{ github.run_id }}
          path: /tmp/results
          if-no-files-found: error
          retention-days: 30
