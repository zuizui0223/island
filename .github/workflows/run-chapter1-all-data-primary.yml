name: Run Chapter 1 all-data primary candidate

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - "src/island_v2/flora_status_support.py"
      - "config/chapter1_all_data_biogeographic_pattern.yml"
      - "config/chapter1_all_data_progressive_analysis.yml"
      - "tests/test_flora_status_support_all_observed.py"
      - ".github/workflows/run-chapter1-all-data-primary.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TRAIT_RUN_ID: "34191508045"
      TRAIT_ARTIFACT: "source-scale-batch-integration-34191508045"
      ISOLATION_RUN_ID: "29228212586"
      ISOLATION_ARTIFACT: "purpose-shortest-distance-regime-29228212586"
      CANONICAL_RUN_ID: "32845980788"
      CANONICAL_ARTIFACT: "chapter1-when-where-main-32845980788"
      REALM_RUN_ID: "32927060210"
      REALM_ARTIFACT: "pr138-realm-sensitivity-32927060210"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and validate all-observed stratum
        run: |
          pip install -e ".[dev]"
          pytest -q tests/test_flora_status_support_all_observed.py tests/test_chapter1_pr138_syndrome_analysis.py
          ruff check src/island_v2/flora_status_support.py tests/test_flora_status_support_all_observed.py

      - name: Download frozen trait and non-trait inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/all-data/{trait-source,isolation,canonical,realm}
          gh run download "$TRAIT_RUN_ID" -n "$TRAIT_ARTIFACT" -D /tmp/all-data/trait-source
          gh run download "$ISOLATION_RUN_ID" -n "$ISOLATION_ARTIFACT" -D /tmp/all-data/isolation
          gh run download "$CANONICAL_RUN_ID" -n "$CANONICAL_ARTIFACT" -D /tmp/all-data/canonical
          gh run download "$REALM_RUN_ID" -n "$REALM_ARTIFACT" -D /tmp/all-data/realm
          TRAIT_AXIS=$(find /tmp/all-data/trait-source -type f -name 'species_axis_coverage.csv.gz' -print -quit)
          test -n "$TRAIT_AXIS"
          test -s "$TRAIT_AXIS"
          echo "TRAIT_AXIS=$TRAIT_AXIS" >> "$GITHUB_ENV"
          test -s /tmp/all-data/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/all-data/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/all-data/realm/realm/island_biogeographic_realm_assignment.csv

      - name: Materialize final trait snapshot
        run: |
          set -euo pipefail
          python -m island_v2.chapter1_trait_snapshot \
            --species-axis-csv "$TRAIT_AXIS" \
            --output-dir /tmp/all-data/snapshot \
            --expected-species 106295 \
            --source-run-id "$TRAIT_RUN_ID" \
            --source-artifact-name "$TRAIT_ARTIFACT"

      - name: Build atomic state audits
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root = Path('/tmp/all-data/snapshot')
          for scope, filename in (
              ('all', 'chapter1_trait_ledger_all_analysis.csv.gz'),
              ('direct', 'chapter1_trait_ledger_direct_only.csv.gz'),
          ):
              x = pd.read_csv(root / filename, dtype=str).fillna('')
              audit = x[['accepted_species','trait_name','normalized_value']].copy()
              audit['resolved_for_primary'] = True
              audit['canonical_signature'] = audit['normalized_value']
              audit[['accepted_species','trait_name','resolved_for_primary','canonical_signature']].to_csv(
                  root / f'chapter1_trait_state_audit_{scope}.csv.gz', index=False, compression='gzip'
              )
          PY

      - name: Refit all-observed atomic probability models
        run: |
          set -euo pipefail
          for scope in all direct; do
            mkdir -p /tmp/all-data/atomic/$scope
            python -m island_v2.chapter1_pr138_biogeographic_pattern \
              --status-flora-csv /tmp/all-data/canonical/input/chapter1_status_flora.csv.gz \
              --state-audit-csv /tmp/all-data/snapshot/chapter1_trait_state_audit_${scope}.csv.gz \
              --covariates-csv /tmp/all-data/isolation/results/purpose_shortest_island_data.csv \
              --config-path config/chapter1_all_data_biogeographic_pattern.yml \
              --output-dir /tmp/all-data/atomic/$scope
          done

      - name: Rebuild composite plant-response scores and branching
        run: |
          set -euo pipefail
          for scope in all direct; do
            ledger="chapter1_trait_ledger_all_analysis.csv.gz"
            if [ "$scope" = "direct" ]; then ledger="chapter1_trait_ledger_direct_only.csv.gz"; fi
            mkdir -p /tmp/all-data/syndrome/$scope /tmp/all-data/branching/$scope
            python -m island_v2.chapter1_pr138_syndrome_analysis \
              --trait-ledger-csv /tmp/all-data/snapshot/$ledger \
              --status-flora-csv /tmp/all-data/canonical/input/chapter1_status_flora.csv.gz \
              --covariates-csv /tmp/all-data/isolation/results/purpose_shortest_island_data.csv \
              --pattern-config-path config/chapter1_all_data_biogeographic_pattern.yml \
              --syndrome-config-path config/chapter1_pr138_pollination_syndromes.yml \
              --output-dir /tmp/all-data/syndrome/$scope
            python -m island_v2.chapter1_global_branching \
              --island-scores-csv /tmp/all-data/syndrome/$scope/island_syndrome_scores.csv.gz \
              --covariates-csv /tmp/all-data/isolation/results/purpose_shortest_island_data.csv \
              --realm-assignment-csv /tmp/all-data/realm/realm/island_biogeographic_realm_assignment.csv \
              --pattern-config-path config/chapter1_all_data_biogeographic_pattern.yml \
              --branching-config-path config/chapter1_global_branching.yml \
              --output-dir /tmp/all-data/branching/$scope
          done

      - name: Summarize actual support and headline comparisons
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root = Path('/tmp/all-data')
          out = root / 'summary'
          out.mkdir(parents=True, exist_ok=True)

          rows = []
          for scope in ('all', 'direct'):
              counts = pd.read_csv(root / 'atomic' / scope / 'observed_broad_syndrome_counts.csv.gz')
              for (stratum, outcome), part in counts.groupby(['stratum','outcome']):
                  rows.append({
                      'analysis_family': 'atomic_probability',
                      'evidence_scope': scope,
                      'stratum': stratum,
                      'response': outcome,
                      'n_islands': int(part['island_id'].nunique()),
                      'median_trait_species': float(part['trials'].median()),
                  })
              scores = pd.read_csv(root / 'syndrome' / scope / 'island_syndrome_scores.csv.gz')
              for (stratum, syndrome), part in scores.groupby(['stratum','syndrome']):
                  rows.append({
                      'analysis_family': 'composite_branch',
                      'evidence_scope': scope,
                      'stratum': stratum,
                      'response': syndrome,
                      'n_islands': int(part['island_id'].nunique()),
                      'median_trait_species': float(part['n_species'].median()),
                  })
          support = pd.DataFrame(rows).sort_values(
              ['analysis_family','evidence_scope','stratum','response']
          )
          support.to_csv(out / 'all_data_support_counts.csv', index=False)

          headline = []
          for scope in ('all', 'direct'):
              slopes = pd.read_csv(root / 'branching' / scope / 'global_branch_distance_slopes.csv')
              keep = slopes.loc[
                  slopes['stratum'].astype(str).isin(['all_observed','all_native','native_nonendemic'])
                  & slopes['syndrome'].astype(str).isin(['accessibility_generalization','reproductive_assurance'])
              ].copy()
              keep['evidence_scope'] = scope
              headline.append(keep)
          pd.concat(headline, ignore_index=True).to_csv(out / 'headline_branch_slopes.csv', index=False)

          between = []
          for scope in ('all', 'direct'):
              x = pd.read_csv(root / 'branching' / scope / 'global_branch_between_context_omnibus.csv')
              x = x.loc[x['stratum'].astype(str).isin(['all_observed','all_native','native_nonendemic'])].copy()
              x['evidence_scope'] = scope
              between.append(x)
          pd.concat(between, ignore_index=True).to_csv(out / 'between_context_tests.csv', index=False)

          md = [
              '# Chapter 1 all-data primary candidate',
              '',
              'Primary data scope: all observed island floras + all-analysis-eligible trait evidence.',
              'Sensitivity 1: direct High/Medium trait evidence on the same all-observed flora scope.',
              'Sensitivity 2: status-resolved all-native / native-nonendemic strata.',
              '',
              'No minimum species-per-island cutoff is imposed by this candidate workflow.',
              'Atomic proportions are fit with the existing grouped-binomial logit + spatial-block cluster-robust covariance.',
              'Composite accessibility/reproductive-assurance scores retain the existing weighted linear + spatial-block cluster-robust model.',
              '',
              'See all_data_support_counts.csv, headline_branch_slopes.csv and between_context_tests.csv.',
          ]
          (out / 'README.md').write_text('\n'.join(md) + '\n')
          print(support.loc[support['stratum'].eq('all_observed')].to_string(index=False))
          PY

      - name: Upload candidate results
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-all-data-primary-${{ github.run_id }}
          path: |
            /tmp/all-data/atomic
            /tmp/all-data/syndrome
            /tmp/all-data/branching
            /tmp/all-data/summary
          if-no-files-found: error
          retention-days: 30
