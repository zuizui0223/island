name: Run Chapter 1 all-data probability analysis

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - "config/chapter1_all_data_probability.yml"
      - "src/island_v2/chapter1_all_data_probability.py"
      - "src/island_v2/chapter1_status_scope_diagnostic.py"
      - "tests/test_chapter1_all_data_probability.py"
      - ".github/workflows/run-chapter1-all-data-probability.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate probability analysis implementation
        run: |
          pytest -q tests/test_chapter1_all_data_probability.py
          ruff check \
            src/island_v2/chapter1_all_data_probability.py \
            src/island_v2/chapter1_status_scope_diagnostic.py \
            tests/test_chapter1_all_data_probability.py

  analyse:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download frozen Chapter 1 primary artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-probability
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/ch1-probability
          test -s /tmp/ch1-probability/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/ch1-probability/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/ch1-probability/snapshot/chapter1_trait_state_audit_all.csv.gz
          test -s /tmp/ch1-probability/snapshot/chapter1_trait_state_audit_direct.csv.gz
      - name: Run all-analysis-eligible primary model
        run: |
          python -m island_v2.chapter1_all_data_probability \
            --status-flora-csv /tmp/ch1-probability/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-probability/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv /tmp/ch1-probability/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_all_data_probability.yml \
            --evidence-scope all_analysis_eligible \
            --output-dir /tmp/results/all
      - name: Run direct-only sensitivity
        run: |
          python -m island_v2.chapter1_all_data_probability \
            --status-flora-csv /tmp/ch1-probability/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-probability/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv /tmp/ch1-probability/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_all_data_probability.yml \
            --evidence-scope direct_only \
            --output-dir /tmp/results/direct
      - name: Diagnose floristic-status scope
        run: |
          python -m island_v2.chapter1_status_scope_diagnostic \
            --status-flora-csv /tmp/ch1-probability/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-probability/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv /tmp/ch1-probability/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_all_data_probability.yml \
            --evidence-scope all_analysis_eligible \
            --output-csv /tmp/results/all/status_scope_diagnostic.csv
          python -m island_v2.chapter1_status_scope_diagnostic \
            --status-flora-csv /tmp/ch1-probability/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-probability/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv /tmp/ch1-probability/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_all_data_probability.yml \
            --evidence-scope direct_only \
            --output-csv /tmp/results/direct/status_scope_diagnostic.csv
      - name: Write run summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          lines = ["# Chapter 1 all-data probability analysis", ""]
          for scope in ("all", "direct"):
              root = Path("/tmp/results") / scope
              within = pd.read_csv(root / "beta_binomial_within_omnibus.csv")
              between = pd.read_csv(root / "beta_binomial_between_omnibus.csv")
              status = pd.read_csv(root / "status_scope_diagnostic.csv")
              lines += [f"## {scope}", "", "### Within-context omnibus", "", "```csv"]
              lines.append(within.to_csv(index=False).strip())
              lines += ["```", "", "### North-Tropical direct contrast", "", "```csv"]
              lines.append(between.to_csv(index=False).strip())
              lines += ["```", "", "### Floristic-status diagnostic", "", "```csv"]
              lines.append(status.to_csv(index=False).strip())
              lines += ["```", ""]
          Path("/tmp/results/summary.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          cat /tmp/results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-all-data-probability-${{ github.run_id }}
          path: /tmp/results
          if-no-files-found: error
          retention-days: 30
