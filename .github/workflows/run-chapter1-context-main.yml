name: Run Chapter 1 when-where main analysis

on:
  workflow_dispatch:
    inputs:
      trait_run_id:
        description: "Formal reviewed direct-trait run"
        required: false
        default: "32702160934"
      null_draws:
        description: "Genus-fixed null draws for M3"
        required: false
        default: "1000"

permissions:
  contents: read
  actions: read

jobs:
  chapter1-main:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TRAIT_RUN_ID: ${{ inputs.trait_run_id || '32702160934' }}
      NULL_DRAWS: ${{ inputs.null_draws || '1000' }}
      STATUS_RUN_ID: "32559322028"
      STATUS_ARTIFACT: "official-wcvp-corroborated-status-32559322028"
      ISOLATION_RUN_ID: "29228212586"
      ISOLATION_ARTIFACT: "purpose-shortest-distance-regime-29228212586"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and validate canonical code
        run: |
          pip install -e ".[dev]"
          ruff check \
            src/island_v2/chapter1_context_input.py \
            src/island_v2/chapter1_context_analysis.py \
            src/island_v2/chapter1_trait_vector_freeze.py \
            src/island_v2/chapter1_when_where_omnibus.py \
            src/island_v2/chapter1_when_where_classification.py \
            src/island_v2/chapter1_when_where_sensitivity.py \
            src/island_v2/chapter1_when_where_domain_omnibus.py \
            src/island_v2/chapter1_when_where_block_deletion.py \
            src/island_v2/chapter1_observation_bias.py \
            src/island_v2/chapter1_trait_probability.py \
            src/island_v2/chapter1_information_weight_sensitivity.py \
            src/island_v2/chapter1_trait_resolution_bias.py \
            src/island_v2/flora_status_support.py \
            src/island_v2/genus_fixed_trait_null.py \
            src/island_v2/status_stratified_lineage_analysis.py \
            tests/test_chapter1_context_workflow.py \
            tests/test_chapter1_multistate_normalization.py \
            tests/test_chapter1_trait_vector_freeze.py \
            tests/test_chapter1_when_where_omnibus.py \
            tests/test_chapter1_when_where_classification.py \
            tests/test_chapter1_when_where_sensitivity.py \
            tests/test_chapter1_when_where_domain_omnibus.py \
            tests/test_chapter1_when_where_block_deletion.py \
            tests/test_chapter1_observation_bias.py \
            tests/test_chapter1_trait_probability.py \
            tests/test_chapter1_information_weight_sensitivity.py \
            tests/test_chapter1_trait_resolution_bias.py
          pytest -q \
            tests/test_chapter1_context_workflow.py \
            tests/test_chapter1_multistate_normalization.py \
            tests/test_chapter1_trait_vector_freeze.py \
            tests/test_chapter1_when_where_omnibus.py \
            tests/test_chapter1_when_where_classification.py \
            tests/test_chapter1_when_where_sensitivity.py \
            tests/test_chapter1_when_where_domain_omnibus.py \
            tests/test_chapter1_when_where_block_deletion.py \
            tests/test_chapter1_observation_bias.py \
            tests/test_chapter1_trait_probability.py \
            tests/test_chapter1_information_weight_sensitivity.py \
            tests/test_chapter1_trait_resolution_bias.py

      - name: Download locked trait, status, and geographic inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/traits /tmp/status /tmp/isolation
          gh run download "$TRAIT_RUN_ID" \
            -n "reviewed-open-web-evidence-${TRAIT_RUN_ID}" \
            -D /tmp/traits
          gh run download "$STATUS_RUN_ID" \
            -n "$STATUS_ARTIFACT" \
            -D /tmp/status
          gh run download "$ISOLATION_RUN_ID" \
            -n "$ISOLATION_ARTIFACT" \
            -D /tmp/isolation
          test -s /tmp/traits/direct_species_trait_ledger.csv.gz
          test -s /tmp/status/resolved/resolved_floristic_status_ledger.csv.gz
          test -s /tmp/isolation/results/purpose_shortest_island_data.csv
          test -s data/v2/staging/gbif/collected/island_species_occurrences.csv.gz
          test -s data/v2/staging/gbif/collected/island_taxa.csv

      - name: Build Bombus-free status-aware atomic trait composition
        run: |
          python -m island_v2.chapter1_context_input \
            --island-species-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --status-ledger-csv /tmp/status/resolved/resolved_floristic_status_ledger.csv.gz \
            --direct-evidence-csv /tmp/traits/direct_species_trait_ledger.csv.gz \
            --output-dir /tmp/ch1/input
          test -s /tmp/ch1/input/chapter1_trait_composition_long.csv.gz
          test -s /tmp/ch1/input/chapter1_status_flora.csv.gz
          test -s /tmp/ch1/input/chapter1_direct_trait_state_audit.csv.gz

      - name: Audit required all-island geographic covariates
        run: |
          python - <<'PY'
          import pandas as pd
          p='/tmp/isolation/results/purpose_shortest_island_data.csv'
          d=pd.read_csv(p)
          required={
              'island_id','analysis_regime','spatial_block','island_latitude',
              'distance_to_continent_km','log_distance_to_continent_km',
              'log_island_area_km2','climate_pc1','climate_pc2','climate_pc3','climate_pc4'
          }
          missing=sorted(required-set(d.columns))
          if missing:
              raise SystemExit(f'missing required covariates: {missing}')
          if d['island_id'].duplicated().any():
              raise SystemExit('all-island geographic universe has duplicate island_id')
          print('full_island_universe_n=', d['island_id'].nunique())
          print(d['analysis_regime'].value_counts(dropna=False).to_string())
          PY

      - name: Model observation process across the full island universe
        run: |
          python -m island_v2.chapter1_observation_bias \
            --all-islands-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --island-species-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --composition-csv /tmp/ch1/input/chapter1_trait_composition_long.csv.gz \
            --config-path config/chapter1_observation_bias.yml \
            --output-dir /tmp/ch1/observation_bias
          test -s /tmp/ch1/observation_bias/all_island_observation_support.csv.gz
          test -s /tmp/ch1/observation_bias/observation_support_by_context.csv
          test -s /tmp/ch1/observation_bias/observation_selection_coefficients.csv
          python - <<'PY'
          import json
          import pandas as pd
          m=json.load(open('/tmp/ch1/observation_bias/chapter1_observation_bias_manifest.json'))
          d=pd.read_csv('/tmp/ch1/observation_bias/all_island_observation_support.csv.gz')
          if len(d) != m['n_full_islands'] or d['island_id'].nunique() != m['n_full_islands']:
              raise SystemExit('full-island observation audit dropped or duplicated islands')
          if bool(d.loc[~d['flora_recorded'], 'direct_trait_any'].any()):
              raise SystemExit('direct trait evidence cannot appear on a no-flora-record island')
          print(json.dumps(m, indent=2))
          PY

      - name: Fit trait-centric probability surfaces
        run: |
          python -m island_v2.chapter1_trait_probability \
            --composition-csv /tmp/ch1/input/chapter1_trait_composition_long.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_trait_probability.yml \
            --output-dir /tmp/ch1/trait_probability
          test -s /tmp/ch1/trait_probability/trait_probability_coefficients.csv
          test -s /tmp/ch1/trait_probability/trait_probability_curves.csv
          test -s /tmp/ch1/trait_probability/trait_probability_fit_support.csv

      - name: Run information-weight robustness
        run: |
          python -m island_v2.chapter1_information_weight_sensitivity \
            --composition-csv /tmp/ch1/input/chapter1_trait_composition_long.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_information_weight_sensitivity.yml \
            --output-dir /tmp/ch1/information_weight
          test -s /tmp/ch1/information_weight/information_weight_headline_summary.csv
          test -s /tmp/ch1/information_weight/chapter1_information_weight_manifest.json

      - name: Model trait-resolution bias and run coverage-adjusted when-where
        run: |
          python -m island_v2.chapter1_trait_resolution_bias \
            --status-flora-csv /tmp/ch1/input/chapter1_status_flora.csv.gz \
            --trait-audit-csv /tmp/ch1/input/chapter1_direct_trait_state_audit.csv.gz \
            --composition-csv /tmp/ch1/input/chapter1_trait_composition_long.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_trait_resolution_bias.yml \
            --output-dir /tmp/ch1/trait_resolution_bias
          test -s /tmp/ch1/trait_resolution_bias/trait_resolution_coverage.csv.gz
          test -s /tmp/ch1/trait_resolution_bias/trait_resolution_selection_coefficients.csv
          test -s /tmp/ch1/trait_resolution_bias/coverage_adjusted_headline_summary.csv
          test -s /tmp/ch1/trait_resolution_bias/chapter1_trait_resolution_bias_manifest.json

      - name: Fit atomic M0-M2 diagnostic layer
        run: |
          python -m island_v2.chapter1_context_analysis \
            --composition-csv /tmp/ch1/input/chapter1_trait_composition_long.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_context_analysis.yml \
            --output-dir /tmp/ch1/context
          test -s /tmp/ch1/context/chapter1_model_support.csv
          test -s /tmp/ch1/context/chapter1_context_analysis_manifest.json

      - name: Fit primary when-where response-vector omnibus tests
        run: |
          python -m island_v2.chapter1_when_where_omnibus \
            --composition-csv /tmp/ch1/input/chapter1_trait_composition_long.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_when_where_omnibus.yml \
            --output-dir /tmp/ch1/when_where
          python -m island_v2.chapter1_when_where_classification \
            --within-csv /tmp/ch1/when_where/when_where_within_context_omnibus.csv \
            --output-csv /tmp/ch1/when_where/when_where_status_persistence.csv
          test -s /tmp/ch1/when_where/when_where_within_context_omnibus.csv
          test -s /tmp/ch1/when_where/when_where_between_context_omnibus.csv
          test -s /tmp/ch1/when_where/when_where_status_persistence.csv

      - name: Run lower-dimensional trait-domain omnibus sensitivity
        run: |
          python -m island_v2.chapter1_when_where_domain_omnibus \
            --composition-csv /tmp/ch1/input/chapter1_trait_composition_long.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_when_where_omnibus.yml \
            --output-dir /tmp/ch1/when_where_domain
          test -s /tmp/ch1/when_where_domain/when_where_domain_within.csv
          test -s /tmp/ch1/when_where_domain/when_where_domain_between.csv

      - name: Run all-island distance-gradient robustness scenarios
        run: |
          python -m island_v2.chapter1_when_where_sensitivity \
            --composition-csv /tmp/ch1/input/chapter1_trait_composition_long.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_when_where_sensitivity.yml \
            --output-dir /tmp/ch1/when_where_sensitivity
          test -s /tmp/ch1/when_where_sensitivity/when_where_sensitivity_summary.csv
          test -s /tmp/ch1/when_where_sensitivity/chapter1_when_where_sensitivity_manifest.json

      - name: Run leave-one-spatial-block leverage sensitivity
        run: |
          python -m island_v2.chapter1_when_where_block_deletion \
            --composition-csv /tmp/ch1/input/chapter1_trait_composition_long.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_when_where_block_deletion.yml \
            --output-dir /tmp/ch1/when_where_block
          test -s /tmp/ch1/when_where_block/when_where_leave_one_block_summary.csv
          test -s /tmp/ch1/when_where_block/chapter1_when_where_leave_one_block_manifest.json

      - name: Build genus-fixed M3 lineage residual
        run: |
          python -m island_v2.genus_fixed_trait_null \
            --island-species-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --status-ledger-csv /tmp/status/resolved/resolved_floristic_status_ledger.csv.gz \
            --direct-evidence-csv /tmp/traits/direct_species_trait_ledger.csv.gz \
            --master-taxa-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --config-path config/flora_status_support.yml \
            --n-draws "$NULL_DRAWS" \
            --seed 20260825 \
            --min-species-per-island 1 \
            --output-dir /tmp/ch1/null
          python -m island_v2.status_stratified_lineage_analysis \
            --genus-null-csv /tmp/ch1/null/genus_fixed_null_by_island.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --context-column analysis_regime \
            --cluster-column spatial_block \
            --output-dir /tmp/ch1/lineage
          test -s /tmp/ch1/lineage/status_stratified_lineage_support.csv
          test -s /tmp/ch1/lineage/status_stratified_lineage_isolation.csv

      - name: Freeze atomic trait vectors for interpretation only
        run: |
          python -m island_v2.chapter1_trait_vector_freeze \
            --slopes-csv /tmp/ch1/context/chapter1_context_isolation_slopes.csv \
            --coefficients-csv /tmp/ch1/context/chapter1_m0_m2_coefficients.csv \
            --lineage-csv /tmp/ch1/lineage/status_stratified_lineage_isolation.csv \
            --output-dir /tmp/ch1/freeze
          test -s /tmp/ch1/freeze/regional_trait_vector_frozen.csv
          test -s /tmp/ch1/freeze/regional_pattern_classification_frozen.csv

      - name: Enforce Chapter 1 when-where claim boundary and write checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          coef = pd.read_csv('/tmp/ch1/context/chapter1_m0_m2_coefficients.csv')
          if not coef.empty and coef['predictor'].astype(str).str.contains('bombus', case=False, regex=False).any():
              raise SystemExit('Bombus predictor leaked into canonical Chapter 1 coefficient table')
          within = pd.read_csv('/tmp/ch1/when_where/when_where_within_context_omnibus.csv')
          between = pd.read_csv('/tmp/ch1/when_where/when_where_between_context_omnibus.csv')
          persistence = pd.read_csv('/tmp/ch1/when_where/when_where_status_persistence.csv')
          sensitivity = pd.read_csv('/tmp/ch1/when_where_sensitivity/when_where_sensitivity_summary.csv')
          domain_within = pd.read_csv('/tmp/ch1/when_where_domain/when_where_domain_within.csv')
          domain_between = pd.read_csv('/tmp/ch1/when_where_domain/when_where_domain_between.csv')
          block_summary = pd.read_csv('/tmp/ch1/when_where_block/when_where_leave_one_block_summary.csv')
          info_weight = pd.read_csv('/tmp/ch1/information_weight/information_weight_headline_summary.csv')
          coverage_adjusted = pd.read_csv('/tmp/ch1/trait_resolution_bias/coverage_adjusted_headline_summary.csv')
          obs = json.load(open('/tmp/ch1/observation_bias/chapter1_observation_bias_manifest.json'))
          trait_prob = json.load(open('/tmp/ch1/trait_probability/chapter1_trait_probability_manifest.json'))
          lineage = pd.read_csv('/tmp/ch1/lineage/status_stratified_lineage_isolation.csv')
          if lineage.empty:
              raise SystemExit('Required M3 lineage safeguard is missing')

          confirmatory_within = within.loc[within['support_tier'].eq('confirmatory')]
          confirmatory_between = between.loc[between['support_tier'].eq('confirmatory')]
          primary_sensitivity = sensitivity.loc[sensitivity['stratum'].isin(['all_native','native_nonendemic'])]
          testable_sensitivity = primary_sensitivity.loc[primary_sensitivity['headline_testable'].fillna(False)]
          conf_domain_within = domain_within.loc[domain_within['support_tier'].eq('confirmatory')]
          conf_domain_between = domain_between.loc[domain_between['support_tier'].eq('confirmatory')]
          iw_testable = info_weight.loc[info_weight['headline_testable'].fillna(False)]
          ca_testable = coverage_adjusted.copy()
          iw_all_replicate = bool(len(iw_testable) > 0 and iw_testable['headline_replication'].fillna(False).all())
          ca_all_replicate = bool(len(ca_testable) > 0 and ca_testable['headline_replication'].fillna(False).all())

          payload = {
              'contract': 'chapter1_when_where_checkpoint_v7_observation_robust',
              'primary_question': 'when_and_where_do_trait_probabilities_change_along_geographic_source_pool_gradients',
              'ecological_estimand': 'P(trait_state | directly_trait_resolved_observed_realised_flora, geography)',
              'primary_where_test': 'within_context_response_vector_joint_wald',
              'primary_between_where_test': 'pairwise_response_vector_difference_joint_wald',
              'when_definition': 'persistence_across_floristic_status_strata_with_testability_audit',
              'distance_gradient_interpretation': 'dispersal_limitation_plus_mainland_source_pool_accessibility',
              'all_islands_retained_in_observation_layer': True,
              'missing_flora_interpreted_as_trait_zero': False,
              'missing_trait_interpreted_as_trait_zero': False,
              'bombus_primary_predictor': False,
              'n_full_islands_observation_layer': int(obs['n_full_islands']),
              'n_no_flora_record_islands': int(obs['n_no_flora_record']),
              'n_flora_recorded_islands': int(obs['n_flora_recorded']),
              'n_direct_trait_any_islands': int(obs['n_direct_trait_any']),
              'n_direct_trait_all_three_islands': int(obs['n_direct_trait_all_three']),
              'n_confirmatory_trait_probability_curves': int(trait_prob['n_confirmatory_curves']),
              'n_confirmatory_where_tests': int(len(confirmatory_within)),
              'n_confirmatory_supported_where_tests': int(confirmatory_within['where_supported'].fillna(False).sum()),
              'n_confirmatory_between_where_tests': int(len(confirmatory_between)),
              'n_confirmatory_supported_between_where_tests': int(confirmatory_between['between_where_supported'].fillna(False).sum()),
              'status_persistence_rows': persistence.to_dict(orient='records'),
              'sensitivity_scenarios': sorted(primary_sensitivity['scenario'].unique().tolist()),
              'sensitivity_headline_replications': int(testable_sensitivity['headline_replication'].fillna(False).sum()),
              'sensitivity_headline_testable_opportunities': int(len(testable_sensitivity)),
              'domain_confirmatory_within_rows': conf_domain_within.to_dict(orient='records'),
              'domain_confirmatory_between_rows': conf_domain_between.to_dict(orient='records'),
              'leave_one_block_rows': block_summary.to_dict(orient='records'),
              'information_weight_rows': info_weight.to_dict(orient='records'),
              'information_weight_all_testable_replications': iw_all_replicate,
              'coverage_adjusted_rows': coverage_adjusted.to_dict(orient='records'),
              'coverage_adjusted_all_headline_replications': ca_all_replicate,
              'observation_robust_headline': bool(iw_all_replicate and ca_all_replicate),
              'lineage_safeguard_present': True,
              'pollination_syndrome_role': 'discussion_only_after_when_where_freeze',
          }
          Path('/tmp/ch1/chapter1_checkpoint.json').write_text(json.dumps(payload, indent=2)+'\n')
          print(json.dumps(payload, indent=2))
          PY

      - name: Summarize Chapter 1 results
        run: |
          echo '## Chapter 1 observation / trait probability / when-where analysis' >> "$GITHUB_STEP_SUMMARY"
          echo '### Observation process across all islands' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1/observation_bias/observation_support_by_context.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Trait-centric probability curves: first rows' >> "$GITHUB_STEP_SUMMARY"
          head -40 /tmp/ch1/trait_probability/trait_probability_curves.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Information-weight robustness' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1/information_weight/information_weight_headline_summary.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Trait-resolution coverage-adjusted headline' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1/trait_resolution_bias/coverage_adjusted_headline_summary.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Trait-resolution support by context' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1/trait_resolution_bias/trait_resolution_support_by_context.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### WHERE: within-context response-vector omnibus' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1/when_where/when_where_within_context_omnibus.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### BETWEEN-WHERE: pairwise response-vector differences' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1/when_where/when_where_between_context_omnibus.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### WHEN: floristic-status persistence with testability audit' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1/when_where/when_where_status_persistence.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### All-island distance-gradient robustness scenarios' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1/when_where_sensitivity/when_where_sensitivity_summary.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Leave-one-spatial-block leverage sensitivity' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ch1/when_where_block/when_where_leave_one_block_summary.csv >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-when-where-main-${{ github.run_id }}
          path: |
            /tmp/ch1/input/
            /tmp/ch1/observation_bias/
            /tmp/ch1/trait_probability/
            /tmp/ch1/information_weight/
            /tmp/ch1/trait_resolution_bias/
            /tmp/ch1/context/
            /tmp/ch1/when_where/
            /tmp/ch1/when_where_domain/
            /tmp/ch1/when_where_sensitivity/
            /tmp/ch1/when_where_block/
            /tmp/ch1/null/
            /tmp/ch1/lineage/
            /tmp/ch1/freeze/
            /tmp/ch1/chapter1_checkpoint.json
          if-no-files-found: error
          retention-days: 90
