name: Run Chapter 1 GloBI source breadth V2

on:
  push:
    branches: ["ch1/fingerprint-and-globi-breadth"]
    paths:
      - "config/chapter1_globi_source_breadth_v2.yml"
      - "src/island_v2/chapter1_globi_source_breadth_v2.py"
      - "tests/test_chapter1_globi_source_breadth_v2.py"
      - ".github/workflows/run-chapter1-globi-source-breadth-v2.yml"

permissions:
  contents: read
  actions: read

jobs:
  effort-matched-source-breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      INTERACTIONS_SHA256: "095e57398420d1e0746e61233c796beedcfb8e03bd0c6a732aa17ae62043bd17"
      REFUTED_SHA256: "674e5b069992ab8a7fe98d76d0b9eb531c90c3ca267f434d14aa44a72ebbf8d6"
      ISOLATION_RUN_ID: "29228212586"
      ISOLATION_ARTIFACT: "purpose-shortest-distance-regime-29228212586"
      ISOLATION_ARTIFACT_ID: "8270544465"
      ISOLATION_DIGEST: "sha256:695f35b97bae07e81b05deab537dd73fa687b2d99e9efdb1cb3babd2fa12dfb6"
      STATUS_RUN_ID: "32845980788"
      STATUS_ARTIFACT: "chapter1-when-where-main-32845980788"
      STATUS_ARTIFACT_ID: "9562465057"
      STATUS_DIGEST: "sha256:d4cd8ad0eea9cd2bda879af14f54c549e130de365faf1b56bebddad38b24f1c2"
      SOURCE_RUN_ID: "32954909953"
      SOURCE_ARTIFACT: "pr138-source-pool-sensitivity-32954909953"
      SOURCE_ARTIFACT_ID: "9601703747"
      SOURCE_DIGEST: "sha256:51cff9087a40b76655ff043d59aceabf25800a6029ed005a77b8db30e78345d2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Test and lint effort-matched analysis
        run: |
          pytest -q tests/test_chapter1_globi_source_breadth.py tests/test_chapter1_globi_source_breadth_v2.py
          ruff check \
            src/island_v2/chapter1_globi_source_breadth.py \
            src/island_v2/chapter1_globi_source_breadth_v2.py \
            tests/test_chapter1_globi_source_breadth.py \
            tests/test_chapter1_globi_source_breadth_v2.py

      - name: Download and verify pinned GloBI archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/globi-v09
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/globi-v09/interactions.tsv.gz \
            "https://zenodo.org/records/20546682/files/interactions.tsv.gz?download=1"
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/globi-v09/refuted-interactions.tsv.gz \
            "https://zenodo.org/records/20546682/files/refuted-interactions.tsv.gz?download=1"
          echo "$INTERACTIONS_SHA256  /tmp/globi-v09/interactions.tsv.gz" | sha256sum --check --strict
          echo "$REFUTED_SHA256  /tmp/globi-v09/refuted-interactions.tsv.gz" | sha256sum --check --strict

      - name: Build identical outcome-blind V1 genus predictor
        run: |
          set -euo pipefail
          rm -rf /tmp/globi-breadth-predictor
          python -m island_v2.chapter1_globi_source_breadth predictor \
            --interactions-tsv-gz /tmp/globi-v09/interactions.tsv.gz \
            --refuted-tsv-gz /tmp/globi-v09/refuted-interactions.tsv.gz \
            --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --config-path config/chapter1_globi_source_breadth.yml \
            --channel-config-path config/chapter1_nee_channel_taxon_catalog.yml \
            --output-dir /tmp/globi-breadth-predictor \
            --chunksize 200000
          predictor_sha=$(sha256sum /tmp/globi-breadth-predictor/globi_source_genus_breadth.csv | awk '{print $1}')
          echo "PREDICTOR_SHA256=$predictor_sha" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('/tmp/globi-breadth-predictor/globi_source_genus_breadth_receipt.json').read_text())
          assert receipt['island_outcomes_or_distance_loaded'] is False
          assert receipt['support_refute_cross_subtraction_applied'] is False
          print(json.dumps(receipt, indent=2))
          PY

      - name: Verify and download frozen island inputs after predictor SHA freeze
        run: |
          set -euo pipefail
          verify_artifact () {
            run_id="$1"; name="$2"; expected_id="$3"; expected_digest="$4"
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")
            observed_id=$(jq -r ".artifacts[] | select(.name == \"$name\" and .expired == false) | .id" <<<"$metadata")
            observed_digest=$(jq -r ".artifacts[] | select(.name == \"$name\" and .expired == false) | .digest" <<<"$metadata")
            test "$observed_id" = "$expected_id"
            test "$observed_digest" = "$expected_digest"
          }
          verify_artifact "$ISOLATION_RUN_ID" "$ISOLATION_ARTIFACT" "$ISOLATION_ARTIFACT_ID" "$ISOLATION_DIGEST"
          verify_artifact "$STATUS_RUN_ID" "$STATUS_ARTIFACT" "$STATUS_ARTIFACT_ID" "$STATUS_DIGEST"
          verify_artifact "$SOURCE_RUN_ID" "$SOURCE_ARTIFACT" "$SOURCE_ARTIFACT_ID" "$SOURCE_DIGEST"
          mkdir -p /tmp/fixed/{isolation,status,source}
          gh run download "$ISOLATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ISOLATION_ARTIFACT" --dir /tmp/fixed/isolation
          gh run download "$STATUS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$STATUS_ARTIFACT" --dir /tmp/fixed/status
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir /tmp/fixed/source

      - name: Run final effort-matched H3 breadth analysis
        run: |
          set -euo pipefail
          rm -rf /tmp/globi-breadth-v2
          python -m island_v2.chapter1_globi_source_breadth_v2 \
            --genus-breadth-csv /tmp/globi-breadth-predictor/globi_source_genus_breadth.csv \
            --gift-flora-csv /tmp/fixed/source/source/gift_native_mainland_flora.csv.gz \
            --assignments-csv /tmp/fixed/source/result/island_source_assignments.csv.gz \
            --status-flora-csv /tmp/fixed/status/input/chapter1_status_flora.csv.gz \
            --covariates-csv /tmp/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_globi_source_breadth_v2.yml \
            --output-dir /tmp/globi-breadth-v2 \
            --predictor-sha256 "$PREDICTOR_SHA256"

      - name: Validate and summarize V2 result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/globi-breadth-v2')
          manifest=json.loads((root/'globi_source_breadth_v2_manifest.json').read_text())
          slopes=pd.read_csv(root/'globi_source_breadth_v2_context_slopes.csv')
          classes=pd.read_csv(root/'globi_source_breadth_v2_primary_classification.csv')
          assert manifest['predictor_sha256'] == os.environ['PREDICTOR_SHA256']
          assert manifest['N1_rescued'] is False and manifest['N2_opened'] is False
          primary=slopes.loc[
              slopes['metric'].eq('effective_channel_number')
              & slopes['outcome'].eq('entry_enrichment')
              & slopes['source_matching'].eq('prevalence_richness_effort')
              & slopes['min_independent_references'].eq(3)
          ].copy()
          lines=['# Chapter 1 GloBI source breadth V2', '', '## Primary classification', '',
                 '| context | stratum | modes | all positive | all q<=.05 | effort sensitivity | matching sensitivity | classification |',
                 '|---|---|---:|---|---|---|---|---|']
          for row in classes.itertuples(index=False):
              lines.append(
                  f'| {row.context} | {row.stratum} | {row.n_primary_source_modes} | '
                  f'{row.primary_all_positive} | {row.primary_all_q_le_005} | '
                  f'{row.effort_sensitivity_no_sign_reversal} | {row.matching_sensitivity_no_sign_reversal} | '
                  f'{row.classification} |'
              )
          lines += ['', '## Effort-matched primary slopes', '',
                    '| context | stratum | source mode | n | slope | 95% CI | q |',
                    '|---|---|---|---:|---:|---|---:|']
          for row in primary.itertuples(index=False):
              lines.append(
                  f'| {row.context} | {row.stratum} | {row.source_mode} | {row.n_islands} | '
                  f'{row.distance_slope:.4f} | [{row.ci_low:.4f}, {row.ci_high:.4f}] | {row.q_value:.4g} |'
              )
          lines += ['', manifest['claim_boundary'], '']
          (root/'RESULT_SUMMARY.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
          cat /tmp/globi-breadth-v2/RESULT_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-globi-source-breadth-v2-${{ github.run_id }}
          path: |
            /tmp/globi-breadth-predictor/
            /tmp/globi-breadth-v2/
          if-no-files-found: error
          retention-days: 90
