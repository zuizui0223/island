name: Validate Chapter 1 H2 complete-selfing sensitivity

on:
  push:
    branches:
      - analysis/wcvp-native-corrected
    paths:
      - ".github/workflows/run-chapter1-h2-complete-selfing.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate script
        run: |
          python -m py_compile src/island_v2/chapter1_h2_complete_selfing_sensitivity.py
          ruff check src/island_v2/chapter1_h2_complete_selfing_sensitivity.py

      - name: Download frozen Chapter 1 inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/h2/source
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/h2/source
          test -s /tmp/h2/source/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/h2/source/snapshot/chapter1_trait_state_audit_direct.csv.gz
          test -s results/geography_20260924/corrected_geography_covariates.csv

      - name: Run complete-selfing sensitivity
        run: |
          python -m island_v2.chapter1_h2_complete_selfing_sensitivity \
            --status-flora-csv /tmp/h2/source/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/h2/source/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --syndrome-config-path config/chapter1_pr138_pollination_syndromes.yml \
            --h2-config-path config/chapter1_v14_h2_decomposition.yml \
            --output-dir /tmp/h2/results

      - name: Validate reconstructed Direct baseline against official H2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          new = pd.read_csv("/tmp/h2/results/h2_complete_selfing_sensitivity.csv")
          official = pd.read_csv("results/geography_20260924/direct/h2_decomposition_models.csv")
          baseline = new.loc[new["variant"].eq("direct_min2_baseline_reconstruction")].copy()
          official = official.loc[official["response"].eq("generalized_accessible")].copy()
          merged = baseline.merge(official[["context","distance_estimate","distance_se","distance_p"]], on="context", suffixes=("_reconstructed","_official"))
          merged["abs_estimate_diff"] = (merged["distance_estimate_reconstructed"] - merged["distance_estimate_official"]).abs()
          merged["abs_se_diff"] = (merged["distance_se_reconstructed"] - merged["distance_se_official"]).abs()
          max_est = float(merged["abs_estimate_diff"].max())
          max_se = float(merged["abs_se_diff"].max())
          gate = max_est <= 1e-10 and max_se <= 1e-10
          out = {
            "gate": "pass" if gate else "fail",
            "max_abs_estimate_diff": max_est,
            "max_abs_se_diff": max_se,
            "rows": merged.to_dict(orient="records"),
          }
          Path("/tmp/h2/results/baseline_reconstruction_gate.json").write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          if not gate:
              raise SystemExit("reconstructed Direct baseline does not match official corrected H2")
          PY

      - name: Persist sensitivity results
        run: |
          set -euo pipefail
          target=results/h2_complete_selfing_corrected_20261003
          rm -rf "$target"
          mkdir -p "$target"
          cp /tmp/h2/results/* "$target/"
          python - <<'PY'
          from pathlib import Path
          Path("results/h2_complete_selfing_corrected_20261003/README.md").write_text(
              """# H2 complete-selfing Direct-only sensitivity

This sensitivity rebuilds selfing_core from Direct-only evidence and requires all three
reproductive components (self-incompatibility/compatibility, mating system, and autonomous
selfing capacity) to be observed and informative for every species contributing to the
complete mediator score. generalized_accessible retains the preregistered minimum-two-trait
definition. Models use the 24 September 2026 corrected geography.

The direct_min2_baseline_reconstruction rows must reproduce the official Direct-only
H2 generalized-accessibility estimates before the complete-three-component rows are interpreted.
This is a missing-component reliability sensitivity, not a formal errors-in-variables correction.
"""
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Persist H2 complete-selfing sensitivity"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-h2-complete-selfing-${{ github.run_id }}
          path: /tmp/h2/results
          if-no-files-found: error
          retention-days: 30
