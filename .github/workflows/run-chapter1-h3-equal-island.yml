name: Run Chapter 1 H3 equal-island sensitivity

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - "src/island_v2/chapter1_h3_equal_island_sensitivity.py"
      - ".github/workflows/run-chapter1-h3-equal-island.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate equal-island sensitivity
        run: ruff check src/island_v2/chapter1_h3_equal_island_sensitivity.py
      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-h3e
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/ch1-h3e
      - name: Run all-analysis equal-island sensitivity
        run: |
          python -m island_v2.chapter1_h3_equal_island_sensitivity \
            --status-flora-csv /tmp/ch1-h3e/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-h3e/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv /tmp/ch1-h3e/fixed/isolation/results/purpose_shortest_island_data.csv \
            --probability-config-path config/chapter1_all_data_probability.yml \
            --ladder-config-path config/chapter1_hypothesis_ladder_v2.yml \
            --evidence-scope all_analysis_eligible \
            --output-csv /tmp/results/all_equal_island.csv
      - name: Run direct equal-island sensitivity
        run: |
          python -m island_v2.chapter1_h3_equal_island_sensitivity \
            --status-flora-csv /tmp/ch1-h3e/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-h3e/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv /tmp/ch1-h3e/fixed/isolation/results/purpose_shortest_island_data.csv \
            --probability-config-path config/chapter1_all_data_probability.yml \
            --ladder-config-path config/chapter1_hypothesis_ladder_v2.yml \
            --evidence-scope direct_only \
            --output-csv /tmp/results/direct_equal_island.csv
      - name: Write summary
        run: |
          echo '# H3 equal-island information-weight sensitivity' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/results/all_equal_island.csv >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/results/direct_equal_island.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-h3-equal-island-${{ github.run_id }}
          path: /tmp/results
          if-no-files-found: error
          retention-days: 30
