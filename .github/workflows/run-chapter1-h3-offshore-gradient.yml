name: Validate Chapter 1 H3 offshore-gradient sensitivity

on:
  push:
    branches:
      - analysis/wcvp-native-corrected
    paths:
      - ".github/workflows/run-chapter1-h3-offshore-gradient.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate implementation
        run: |
          python -m py_compile src/island_v2/chapter1_h3_offshore_gradient_sensitivity.py
          ruff check src/island_v2/chapter1_h3_offshore_gradient_sensitivity.py

      - name: Run H3 robustness analysis
        run: |
          python -m island_v2.chapter1_h3_offshore_gradient_sensitivity \
            --measurement-cells-csv results/geography_20260924/h3_corrected_measurement_cells.csv.gz \
            --output-dir /tmp/h3

      - name: Persist results
        run: |
          set -euo pipefail
          target=results/h3_offshore_gradient_20261003
          rm -rf "$target"
          mkdir -p "$target"
          cp /tmp/h3/* "$target/"
          printf "%s\\n" \
            "# H3 offshore-gradient robustness" \
            "" \
            "Post-hoc robustness checks using the corrected GloPL measurement cells." \
            "The continuous model is re-fit after removing all zero-distance mainland cells;" \
            "a separate binary mainland/offshore model tests whether a simple step is sufficient;" \
            "and the offshore model is repeated after deleting each publication in turn." \
            > "$target/README.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Persist H3 offshore-gradient robustness results"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-h3-offshore-gradient-${{ github.run_id }}
          path: /tmp/h3
          if-no-files-found: error
          retention-days: 30
