name: Historical replay — Run Chapter 1 H3 support guardrail

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate support guardrail
        run: ruff check src/island_v2/chapter1_h3_support_guardrail.py
      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-h3s
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/ch1-h3s
      - name: Run all-analysis support guardrail
        run: |
          python -m island_v2.chapter1_h3_support_guardrail \
            --status-flora-csv /tmp/ch1-h3s/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-h3s/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv /tmp/ch1-h3s/fixed/isolation/results/purpose_shortest_island_data.csv \
            --probability-config-path config/chapter1_all_data_probability.yml \
            --ladder-config-path config/chapter1_hypothesis_ladder_v2.yml \
            --evidence-scope all_analysis_eligible \
            --output-dir /tmp/results/all
      - name: Run direct support guardrail
        run: |
          python -m island_v2.chapter1_h3_support_guardrail \
            --status-flora-csv /tmp/ch1-h3s/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-h3s/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv /tmp/ch1-h3s/fixed/isolation/results/purpose_shortest_island_data.csv \
            --probability-config-path config/chapter1_all_data_probability.yml \
            --ladder-config-path config/chapter1_hypothesis_ladder_v2.yml \
            --evidence-scope direct_only \
            --output-dir /tmp/results/direct
      - name: Write summary
        run: |
          echo '# H3 support-weight and common-support guardrail' >> "$GITHUB_STEP_SUMMARY"
          echo '## all-analysis' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/results/all/h3_support_guardrail_results.csv >> "$GITHUB_STEP_SUMMARY"
          echo '## direct' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/results/direct/h3_support_guardrail_results.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-h3-support-guardrail-${{ github.run_id }}
          path: /tmp/results
          if-no-files-found: error
          retention-days: 30
