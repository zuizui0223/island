name: Run Chapter 1 H5 architecture common-support H2 gate

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - "config/chapter1_h5_architecture_common_support_h2_v1.yml"
      - "src/island_v2/chapter1_h5_architecture_common_support_h2.py"
      - "tests/test_chapter1_h5_architecture_common_support_h2.py"
      - ".github/workflows/run-chapter1-h5-architecture-common-support-h2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TRAIT_ARTIFACT_ID: "10042377593"
      ALL_DATA_ARTIFACT_ID: "10393997800"
      CANONICAL_ARTIFACT_ID: "9562465057"
      ISOLATION_ARTIFACT_ID: "8270544465"
      ARCHITECTURE_V2_ARTIFACT_ID: "10433982600"
      ROOT: /tmp/ch1-h5-architecture-common-support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate common-support implementation
        run: |
          pytest -q tests/test_chapter1_h5_architecture_common_support_h2.py
          ruff check \
            src/island_v2/chapter1_h5_architecture_common_support_h2.py \
            tests/test_chapter1_h5_architecture_common_support_h2.py

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"/{trait,all-data,canonical,isolation,architecture,snapshot,out}
          for spec in \
            "trait:$TRAIT_ARTIFACT_ID" \
            "all-data:$ALL_DATA_ARTIFACT_ID" \
            "canonical:$CANONICAL_ARTIFACT_ID" \
            "isolation:$ISOLATION_ARTIFACT_ID" \
            "architecture:$ARCHITECTURE_V2_ARTIFACT_ID"; do
            name=${spec%%:*}; id=${spec##*:}
            gh api -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$ROOT/$name.zip"
            unzip -q "$ROOT/$name.zip" -d "$ROOT/$name"
          done
          test -s "$ROOT/trait/species_axis_coverage.csv.gz"
          test -s "$ROOT/all-data/syndrome/all/species_syndrome_concordance.csv.gz"
          test -s "$ROOT/all-data/syndrome/direct/species_syndrome_concordance.csv.gz"
          test -s "$ROOT/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ROOT/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ROOT/architecture/strict_support_architecture_components.csv.gz"

      - name: Materialize all-analysis and Direct trait ledgers
        run: |
          python -m island_v2.chapter1_trait_snapshot \
            --species-axis-csv "$ROOT/trait/species_axis_coverage.csv.gz" \
            --output-dir "$ROOT/snapshot" \
            --expected-species 106295 \
            --source-run-id 34191508045 \
            --source-artifact-name source-scale-batch-integration-34191508045
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          root=Path(os.environ['ROOT'])/'snapshot'
          for scope, filename in (
              ('all', 'chapter1_trait_ledger_all_analysis.csv.gz'),
              ('direct', 'chapter1_trait_ledger_direct_only.csv.gz'),
          ):
              x=pd.read_csv(root/filename,dtype=str).fillna('')
              audit=x[['accepted_species','trait_name','normalized_value']].copy()
              audit['resolved_for_primary']=True
              audit['canonical_signature']=audit['normalized_value']
              audit[['accepted_species','trait_name','resolved_for_primary','canonical_signature']].to_csv(
                  root/f'chapter1_trait_state_audit_{scope}.csv.gz',index=False,compression='gzip'
              )
          PY

      - name: Run exact architecture common-support H2 gate
        run: |
          python -m island_v2.chapter1_h5_architecture_common_support_h2 \
            --all-species-scores-csv "$ROOT/all-data/syndrome/all/species_syndrome_concordance.csv.gz" \
            --direct-species-scores-csv "$ROOT/all-data/syndrome/direct/species_syndrome_concordance.csv.gz" \
            --all-state-audit-csv "$ROOT/snapshot/chapter1_trait_state_audit_all.csv.gz" \
            --direct-state-audit-csv "$ROOT/snapshot/chapter1_trait_state_audit_direct.csv.gz" \
            --status-flora-csv "$ROOT/canonical/input/chapter1_status_flora.csv.gz" \
            --strict-support-csv "$ROOT/architecture/strict_support_architecture_components.csv.gz" \
            --covariates-csv "$ROOT/isolation/results/purpose_shortest_island_data.csv" \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --config-path config/chapter1_h5_architecture_common_support_h2_v1.yml \
            --output-dir "$ROOT/out"
          cat "$ROOT/out/RESULT_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-h5-architecture-common-support-${{ github.run_id }}
          path: /tmp/ch1-h5-architecture-common-support/out
          if-no-files-found: error
          retention-days: 30
