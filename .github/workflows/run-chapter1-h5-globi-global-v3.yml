name: Run Chapter 1 H5 global GloBI v3

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - "config/chapter1_h5_globi_global_v3.yml"
      - "src/island_v2/chapter1_h5_globi_global_v3.py"
      - "tests/test_chapter1_h5_globi_global_v3.py"
      - ".github/workflows/run-chapter1-h5-globi-global-v3.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PRIMARY_RUN_ID: "34232450884"
      PRIMARY_ARTIFACT: "chapter1-progressive-analysis-34232450884"
      GLOBI_RUN_ID: "34790842133"
      GLOBI_ARTIFACT: "chapter1-globi-source-breadth-v2-34790842133"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate global GloBI implementation
        run: |
          pytest -q tests/test_chapter1_h5_globi_global_v3.py
          ruff check \
            src/island_v2/chapter1_h5_globi_global_v3.py \
            tests/test_chapter1_h5_globi_global_v3.py

      - name: Download frozen Chapter 1 and GloBI inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/globi-global/primary /tmp/globi-global/globi /tmp/globi-global/out
          gh run download "$PRIMARY_RUN_ID" -n "$PRIMARY_ARTIFACT" -D /tmp/globi-global/primary
          gh run download "$GLOBI_RUN_ID" -n "$GLOBI_ARTIFACT" -D /tmp/globi-global/globi
          test -s /tmp/globi-global/primary/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/globi-global/primary/fixed/source/source/gift_native_mainland_flora.csv.gz
          test -s /tmp/globi-global/primary/fixed/source/result/island_source_assignments.csv.gz
          test -s /tmp/globi-global/primary/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/globi-global/globi/globi-breadth-predictor/globi_source_genus_breadth.csv
          test -s /tmp/globi-global/globi/globi-breadth-v2/globi_source_breadth_v2_island_enrichment.csv.gz

      - name: Run four-context global GloBI analysis
        run: |
          python -m island_v2.chapter1_h5_globi_global_v3 run \
            --genus-breadth-csv /tmp/globi-global/globi/globi-breadth-predictor/globi_source_genus_breadth.csv \
            --native-enrichment-csv /tmp/globi-global/globi/globi-breadth-v2/globi_source_breadth_v2_island_enrichment.csv.gz \
            --gift-flora-csv /tmp/globi-global/primary/fixed/source/source/gift_native_mainland_flora.csv.gz \
            --source-assignments-csv /tmp/globi-global/primary/fixed/source/result/island_source_assignments.csv.gz \
            --status-flora-csv /tmp/globi-global/primary/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --covariates-csv /tmp/globi-global/primary/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_h5_globi_global_v3.yml \
            --output-dir /tmp/globi-global/out
          test -s /tmp/globi-global/out/within_context.csv
          test -s /tmp/globi-global/out/global_tests.csv
          test -s /tmp/globi-global/out/context_classification.csv
          test -s /tmp/globi-global/out/overall_classification.csv

      - name: Write summary
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          root = Path('/tmp/globi-global/out')
          within = pd.read_csv(root/'within_context.csv')
          global_tests = pd.read_csv(root/'global_tests.csv')
          context = pd.read_csv(root/'context_classification.csv')
          overall = pd.read_csv(root/'overall_classification.csv')
          primary = within.loc[
              within['stratum'].eq('all_observed')
              & within['source_matching'].eq('prevalence_richness_effort')
              & within['min_independent_references'].eq(3)
          ]
          print('## Global GloBI H5 v3')
          print('\n### Overall classification')
          print(overall.to_markdown(index=False))
          print('\n### Context classification')
          print(context.to_markdown(index=False))
          print('\n### Primary all-observed coefficients')
          cols = ['analysis_regime','source_mode','n_islands','distance_slope','distance_q','distance_by_area','distance_by_area_q']
          print(primary[cols].sort_values(['analysis_regime','source_mode']).to_markdown(index=False))
          print('\n### Global heterogeneity')
          gt = global_tests.loc[
              global_tests['stratum'].eq('all_observed')
              & global_tests['source_matching'].eq('prevalence_richness_effort')
              & global_tests['min_independent_references'].eq(3)
          ]
          cols2 = ['source_mode','distance_heterogeneity_p','distance_heterogeneity_q','moderation_heterogeneity_p','moderation_heterogeneity_q']
          print(gt[cols2].to_markdown(index=False))
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          from pathlib import Path
          root = Path('/tmp/globi-global/out')
          print('## Global GloBI H5 v3')
          print(pd.read_csv(root/'overall_classification.csv').to_markdown(index=False))
          print('\n### Context classification')
          print(pd.read_csv(root/'context_classification.csv').to_markdown(index=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-h5-globi-global-v3-${{ github.run_id }}
          path: /tmp/globi-global/out
          if-no-files-found: error
          retention-days: 30
