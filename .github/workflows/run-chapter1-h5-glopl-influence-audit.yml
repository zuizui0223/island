name: Historical replay — Run Chapter 1 H5 GloPL influence audit

on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PARENT_ARTIFACT_ID: "10442910503"
      PARENT_ARTIFACT_SHA256: "5d39d3658100edabcbb9a7f6b5e6d7130ffc7d32e643e7900fcebfbd137efaa0"
      ROOT: /tmp/ch1-h5-glopl-influence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate influence audit implementation
        run: |
          pytest -q tests/test_chapter1_h5_glopl_influence_audit.py tests/test_chapter1_h5_glopl_pollen_limitation.py
          ruff check \
            src/island_v2/chapter1_h5_glopl_influence_audit.py \
            tests/test_chapter1_h5_glopl_influence_audit.py

      - name: Download frozen parent GloPL result
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/parent" "$ROOT/out"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip" \
            > "$ROOT/parent.zip"
          echo "$PARENT_ARTIFACT_SHA256  $ROOT/parent.zip" | sha256sum --check --strict
          unzip -q "$ROOT/parent.zip" -d "$ROOT/parent"
          test -s "$ROOT/parent/primary_publication_island_cells.csv"
          test -s "$ROOT/parent/RESULT.json"

      - name: Run frozen posthoc influence audit
        run: |
          python -m island_v2.chapter1_h5_glopl_influence_audit \
            --cells-csv "$ROOT/parent/primary_publication_island_cells.csv" \
            --parent-result-json "$ROOT/parent/RESULT.json" \
            --parent-model-config config/chapter1_h5_glopl_pollen_limitation_v1.yml \
            --config-path config/chapter1_h5_glopl_influence_audit_v1.yml \
            --output-dir "$ROOT/out"
          cat "$ROOT/out/RESULT_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-h5-glopl-influence-audit-${{ github.run_id }}
          path: /tmp/ch1-h5-glopl-influence/out
          if-no-files-found: error
          retention-days: 30
