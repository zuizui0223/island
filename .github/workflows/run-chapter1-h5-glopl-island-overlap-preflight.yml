name: Run Chapter 1 H5 GloPL island-overlap preflight

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - "config/chapter1_h5_glopl_island_overlap_preflight_v1.yml"
      - "src/island_v2/chapter1_h5_glopl_island_overlap_preflight.py"
      - "tests/test_chapter1_h5_glopl_island_overlap_preflight.py"
      - ".github/workflows/run-chapter1-h5-glopl-island-overlap-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      FROZEN_ISLAND_ARTIFACT_ID: "8066083419"
      FROZEN_ISLAND_ZIP_SHA256: "bee33e14672ec7ff4ed1f7acaea36b32cc6170a45c3d14b2caeb5f43bfaa623b"
      CONTEXT_ARTIFACT_ID: "8270544465"
      CONTEXT_ARTIFACT_SHA256: "695f35b97bae07e81b05deab537dd73fa687b2d99e9efdb1cb3babd2fa12dfb6"
      GLOPL_URL: "https://raw.githubusercontent.com/idiv-biodiversity/pollen-limitation-data-descriptor/abbe193770981b2c61713e75a0f01e004bdded8e/Output/GloPL.csv"
      ROOT: /tmp/ch1-h5-glopl-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate outcome-blind preflight implementation
        run: |
          pytest -q tests/test_chapter1_h5_glopl_island_overlap_preflight.py
          ruff check \
            src/island_v2/chapter1_h5_glopl_island_overlap_preflight.py \
            tests/test_chapter1_h5_glopl_island_overlap_preflight.py

      - name: Download frozen island universe and context table
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/islands" "$ROOT/context" "$ROOT/input" "$ROOT/out"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ISLAND_ARTIFACT_ID}/zip" \
            > "$ROOT/islands.zip"
          echo "$FROZEN_ISLAND_ZIP_SHA256  $ROOT/islands.zip" | sha256sum --check --strict
          unzip -q "$ROOT/islands.zip" -d "$ROOT/islands"
          test -s "$ROOT/islands/islands/gshhg/prepared/islands_v2.gpkg"
          test -s "$ROOT/islands/islands/gshhg/prepared/source_policy.json"

          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CONTEXT_ARTIFACT_ID}/zip" \
            > "$ROOT/context.zip"
          echo "$CONTEXT_ARTIFACT_SHA256  $ROOT/context.zip" | sha256sum --check --strict
          unzip -q "$ROOT/context.zip" -d "$ROOT/context"
          test -s "$ROOT/context/results/purpose_shortest_island_data.csv"

      - name: Download pinned public GloPL data without inspecting outcomes
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$ROOT/input/GloPL.csv" "$GLOPL_URL"
          test -s "$ROOT/input/GloPL.csv"
          sha256sum "$ROOT/input/GloPL.csv" | tee "$ROOT/input/GLOPL_SHA256.txt"

      - name: Run coordinate-only exact-island preflight
        run: |
          python -m island_v2.chapter1_h5_glopl_island_overlap_preflight \
            --glopl-csv "$ROOT/input/GloPL.csv" \
            --islands-gpkg "$ROOT/islands/islands/gshhg/prepared/islands_v2.gpkg" \
            --covariates-csv "$ROOT/context/results/purpose_shortest_island_data.csv" \
            --config-path config/chapter1_h5_glopl_island_overlap_preflight_v1.yml \
            --output-dir "$ROOT/out"
          cat "$ROOT/out/RESULT_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-h5-glopl-island-overlap-preflight-${{ github.run_id }}
          path: /tmp/ch1-h5-glopl-preflight/out
          if-no-files-found: error
          retention-days: 30
