name: Historical replay — Run Chapter 1 H5c observed specificity

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  observed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PR142_RUN_ID: "34232450884"
      PR142_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PR142_ARTIFACT_ID: "10058653212"
      PR142_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
      QUAL_RUN_ID: "34803493307"
      QUAL_ARTIFACT_NAME: "chapter1-h5c-pollination-mode-qualification-34803493307"
      QUAL_ARTIFACT_ID: "10332810251"
      QUAL_DIGEST: "sha256:074a52323ba835201043a3a5980cc2b2d0ff79878e83bc9be19511ae83a1c0e8"
      MODE_SHA256: "cddb8bb02feede8fbb45e80bc62cb25384a8899d05312843eef0d56dee57ab65"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Test and lint observed fitter
        run: |
          pytest -q tests/test_chapter1_h5c_observed_specificity.py
          ruff check src/island_v2/chapter1_h5c_observed_specificity.py tests/test_chapter1_h5c_observed_specificity.py

      - name: Verify qualification lock before opening outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('config/chapter1_h5c_qualification_result_lock.json').read_text())
          assert lock['observed_effect_opened'] is False
          cell=lock['only_observed_cell_allowed_to_open']
          assert cell == {
              'evidence_scope':'direct_only',
              'stratum':'native_nonendemic',
              'context_layer':'biogeographic_realm',
              'context':'Palearctic',
              'n_islands_biotic':132,
              'n_islands_abiotic_wind':60,
              'n_blocks_biotic':22,
              'n_blocks_abiotic_wind':18,
              'species_support_sum_biotic':8773,
              'species_support_sum_abiotic_wind':131,
              'type1_error':0.088,
              'target_effect_sd':0.5,
              'target_recovery':1.0,
          }
          PY

      - name: Verify and download qualification artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUAL_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$QUAL_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$QUAL_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$QUAL_ARTIFACT_ID"
          test "$observed_digest" = "$QUAL_DIGEST"
          rm -rf /tmp/h5c-qual
          mkdir -p /tmp/h5c-qual
          gh run download "$QUAL_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$QUAL_ARTIFACT_NAME" --dir /tmp/h5c-qual
          mode=/tmp/h5c-qual/h5c-qualification/h5c_independent_pollination_mode_species.csv.gz
          test -s "$mode"
          echo "$MODE_SHA256  $mode" | sha256sum -c -
          echo "MODE_SPECIES=$mode" >> "$GITHUB_ENV"

      - name: Verify and download frozen PR142 artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR142_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$PR142_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$PR142_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$PR142_ARTIFACT_ID"
          test "$observed_digest" = "$PR142_DIGEST"
          rm -rf /tmp/h5c-pr142
          mkdir -p /tmp/h5c-pr142
          gh run download "$PR142_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PR142_ARTIFACT_NAME" --dir /tmp/h5c-pr142

      - name: Open the single prequalified H5c observed cell once
        run: |
          rm -rf /tmp/h5c-observed
          python -m island_v2.chapter1_h5c_observed_specificity \
            --artifact-root /tmp/h5c-pr142 \
            --mode-species-csv "$MODE_SPECIES" \
            --config-path config/chapter1_h5c_observed_specificity.yml \
            --output-dir /tmp/h5c-observed

      - name: Validate support identity and summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/h5c-observed/h5c_observed_result.json').read_text())
          assert r['qualified_cell']['evidence_scope']=='direct_only'
          assert r['qualified_cell']['stratum']=='native_nonendemic'
          assert r['qualified_cell']['context']=='Palearctic'
          assert r['n_islands_biotic']==132
          assert r['n_islands_wind']==60
          assert r['n_species_sum_biotic']==8773
          assert r['n_species_sum_wind']==131
          assert r['N1_N2_reopened'] is False
          lines=['# H5c observed independent pollination-mode specificity','',
                 f"Classification: **{r['classification']}**",'',
                 f"distance × biotic interaction = **{r['interaction_estimate']:.4f}** ",
                 f"(95% CI {r['interaction_ci_low']:.4f} to {r['interaction_ci_high']:.4f}; p={r['interaction_p_value']:.6g})",'',
                 f"Wind slope: **{r['wind_distance_slope']:.4f}** (95% CI {r['wind_distance_ci_low']:.4f} to {r['wind_distance_ci_high']:.4f})",'',
                 f"Biotic slope: **{r['biotic_distance_slope']:.4f}** (95% CI {r['biotic_distance_ci_low']:.4f} to {r['biotic_distance_ci_high']:.4f})",'',
                 f"Islands biotic/wind: {r['n_islands_biotic']}/{r['n_islands_wind']}; clusters {r['n_clusters']}"]
          Path('/tmp/h5c-observed/RESULT_SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
          cat /tmp/h5c-observed/RESULT_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-h5c-observed-specificity-${{ github.run_id }}
          path: /tmp/h5c-observed/
          if-no-files-found: error
          retention-days: 90
