name: Historical replay — Run Chapter 1 H5c pollination-mode qualification

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: "34232450884"
      PINNED_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PINNED_ARTIFACT_ID: "10058653212"
      PINNED_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Test and lint H5c qualification
        run: |
          pytest -q tests/test_chapter1_h5c_pollination_mode_qualification.py
          ruff check \
            src/island_v2/chapter1_h5c_pollination_mode_qualification.py \
            tests/test_chapter1_h5c_pollination_mode_qualification.py

      - name: Fetch independent public GIFT pollination-mode evidence
        run: |
          rm -rf /tmp/h5c-gift
          python -m island_v2.fetch_gift_traits run \
            --output-dir /tmp/h5c-gift \
            --version 3.2 \
            --max-workers 4
          test -s /tmp/h5c-gift/gift_prepared_canonical_long.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/h5c-gift/gift_fetch_manifest.json').read_text())
          assert m['gift_version']=='3.2'
          assert m['prepared_species_by_trait'].get('pollen_vector_mode',0)>0
          print('pollen_vector_mode species', m['prepared_species_by_trait']['pollen_vector_mode'])
          PY

      - name: Verify and download frozen PR142 design artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$PINNED_ARTIFACT_ID"
          test "$observed_digest" = "$PINNED_ARTIFACT_DIGEST"
          rm -rf /tmp/h5c-pr142
          mkdir -p /tmp/h5c-pr142
          gh run download "$PINNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PINNED_ARTIFACT_NAME" --dir /tmp/h5c-pr142
          test -s /tmp/h5c-pr142/syndrome/all/species_syndrome_concordance.csv.gz
          test -s /tmp/h5c-pr142/syndrome/direct/species_syndrome_concordance.csv.gz
          test -s /tmp/h5c-pr142/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/h5c-pr142/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/h5c-pr142/fixed/realm/realm/island_biogeographic_realm_assignment.csv

      - name: Run outcome-blind support and power qualification
        run: |
          rm -rf /tmp/h5c-qualification
          python -m island_v2.chapter1_h5c_pollination_mode_qualification \
            --artifact-root /tmp/h5c-pr142 \
            --gift-prepared-csv /tmp/h5c-gift/gift_prepared_canonical_long.csv.gz \
            --config-path config/chapter1_h5c_pollination_mode_qualification.yml \
            --output-dir /tmp/h5c-qualification

      - name: Enforce qualification boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/h5c-qualification')
          m=json.loads((root/'h5c_pollination_mode_qualification_manifest.json').read_text())
          q=pd.read_csv(root/'h5c_pollination_mode_qualification.csv')
          assert m['contract']=='chapter1_h5c_pollination_mode_specificity_qualification_v1'
          assert m['observed_effect_opened'] is False
          assert len(q)==8
          lines=['# H5c independent pollination-mode qualification','',
                 f"Independent mode species: **{m['n_independent_mode_species']}** ",
                 f"(biotic {m['n_biotic_species']}, wind {m['n_wind_species']})",'',
                 f"Support-qualified cells: **{m['n_support_qualified_cells']}/8**",'',
                 f"Fully power-qualified cells: **{m['n_fully_qualified_cells']}/8**",'',
                 '| scope | stratum | context | islands biotic | islands wind | blocks biotic | blocks wind | type-I | power@0.5 | qualified |',
                 '|---|---|---|---:|---:|---:|---:|---:|---:|---|']
          support=pd.read_csv(root/'h5c_pollination_mode_support.csv')
          merged=q.merge(support,on=['evidence_scope','stratum','context_layer','context','support_gate_pass'],how='left')
          for r in merged.itertuples(index=False):
              lines.append(f"| {r.evidence_scope} | {r.stratum} | {r.context} | {r.n_islands_biotic} | {r.n_islands_abiotic_wind} | {r.n_blocks_biotic} | {r.n_blocks_abiotic_wind} | {r.type1_error:.3f} | {r.target_recovery:.3f} | {bool(r.qualified)} |")
          (root/'RESULT_SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
          cat /tmp/h5c-qualification/RESULT_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-h5c-pollination-mode-qualification-${{ github.run_id }}
          path: |
            /tmp/h5c-qualification/
            /tmp/h5c-gift/gift_fetch_manifest.json
          if-no-files-found: error
          retention-days: 90
