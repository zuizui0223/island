name: Historical replay — Run Chapter 1 redesigned H1-H3 ladder

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate redesigned ladder
        run: |
          pytest -q tests/test_chapter1_all_data_ladder.py tests/test_chapter1_all_data_probability.py
          ruff check src/island_v2/chapter1_all_data_ladder.py tests/test_chapter1_all_data_ladder.py
      - name: Download frozen Chapter 1 inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-ladder
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/ch1-ladder
          test -s /tmp/ch1-ladder/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/ch1-ladder/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/ch1-ladder/snapshot/chapter1_trait_state_audit_all.csv.gz
          test -s /tmp/ch1-ladder/snapshot/chapter1_trait_state_audit_direct.csv.gz
      - name: Run all-analysis primary ladder
        run: |
          python -m island_v2.chapter1_all_data_ladder \
            --status-flora-csv /tmp/ch1-ladder/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-ladder/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv /tmp/ch1-ladder/fixed/isolation/results/purpose_shortest_island_data.csv \
            --probability-config-path config/chapter1_all_data_probability.yml \
            --ladder-config-path config/chapter1_hypothesis_ladder_v2.yml \
            --evidence-scope all_analysis_eligible \
            --output-dir /tmp/results/all
      - name: Run direct High-Medium sensitivity ladder
        run: |
          python -m island_v2.chapter1_all_data_ladder \
            --status-flora-csv /tmp/ch1-ladder/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-ladder/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv /tmp/ch1-ladder/fixed/isolation/results/purpose_shortest_island_data.csv \
            --probability-config-path config/chapter1_all_data_probability.yml \
            --ladder-config-path config/chapter1_hypothesis_ladder_v2.yml \
            --evidence-scope direct_only \
            --output-dir /tmp/results/direct
      - name: Write H1-H3 summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          lines = ["# Redesigned Chapter 1 H1-H3 ladder", ""]
          for scope in ("all", "direct"):
              root = Path("/tmp/results") / scope
              h1 = pd.read_csv(root / "h1_global_omnibus.csv")
              h2 = pd.read_csv(root / "h2_between_omnibus.csv")
              h3w = pd.read_csv(root / "h3_within_omnibus.csv")
              h3b = pd.read_csv(root / "h3_between_omnibus.csv")
              lines += [f"## {scope}", "", "### H1 global context heterogeneity", "", "```csv"]
              lines.append(h1.to_csv(index=False).strip())
              lines += ["```", "", "### H2 planned North-Tropical", "", "```csv"]
              lines.append(h2.to_csv(index=False).strip())
              lines += ["```", "", "### H3 within-context area moderation", "", "```csv"]
              lines.append(h3w.to_csv(index=False).strip())
              lines += ["```", "", "### H3 North-Tropical moderation difference", "", "```csv"]
              lines.append(h3b.to_csv(index=False).strip())
              lines += ["```", ""]
          Path("/tmp/results/summary.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          cat /tmp/results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-hypothesis-ladder-v2-${{ github.run_id }}
          path: /tmp/results
          if-no-files-found: error
          retention-days: 30
