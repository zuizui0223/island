name: Run Chapter 1 P3 joint observation-bias surface

on:
  push:
    branches: ["ch1/p3-joint-observation-bias"]
    paths:
      - "config/chapter1_joint_observation_bias.yml"
      - "src/island_v2/chapter1_joint_observation_bias.py"
      - "tests/test_chapter1_joint_observation_bias.py"
      - ".github/workflows/run-chapter1-joint-observation-bias.yml"

permissions:
  contents: read
  actions: read

jobs:
  joint-observation-bias:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: "34232450884"
      PINNED_ARTIFACT_ID: "10058653212"
      PINNED_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PINNED_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Test and lint P3 implementation
        run: |
          pytest -q \
            tests/test_chapter1_trait_resolution_mnar.py \
            tests/test_chapter1_species_detection_tipping.py \
            tests/test_chapter1_joint_observation_bias.py
          ruff check \
            src/island_v2/chapter1_joint_observation_bias.py \
            tests/test_chapter1_joint_observation_bias.py

      - name: Verify and download frozen PR142 artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$PINNED_ARTIFACT_ID"
          test "$observed_digest" = "$PINNED_ARTIFACT_DIGEST"
          rm -rf /tmp/pr142-final
          mkdir -p /tmp/pr142-final
          gh run download "$PINNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PINNED_ARTIFACT_NAME" --dir /tmp/pr142-final
          test -s /tmp/pr142-final/syndrome/all/island_syndrome_scores.csv.gz
          test -s /tmp/pr142-final/syndrome/direct/island_syndrome_scores.csv.gz
          test -s /tmp/pr142-final/branching/all/global_branch_distance_slopes.csv
          test -s /tmp/pr142-final/branching/direct/global_branch_distance_slopes.csv
          test -s /tmp/pr142-final/branching/all/global_branch_between_context_omnibus.csv
          test -s /tmp/pr142-final/branching/direct/global_branch_between_context_omnibus.csv
          test -s /tmp/pr142-final/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/pr142-final/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/pr142-final/fixed/realm/realm/island_biogeographic_realm_assignment.csv

      - name: Reproduce V5 separately on frozen PR142 input
        run: |
          rm -rf /tmp/v5-reproduction
          mkdir -p /tmp/v5-reproduction/all /tmp/v5-reproduction/direct
          python -m island_v2.chapter1_trait_resolution_mnar \
            --island-scores-csv /tmp/pr142-final/syndrome/all/island_syndrome_scores.csv.gz \
            --status-flora-csv /tmp/pr142-final/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --covariates-csv /tmp/pr142-final/fixed/isolation/results/purpose_shortest_island_data.csv \
            --realm-assignment-csv /tmp/pr142-final/fixed/realm/realm/island_biogeographic_realm_assignment.csv \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --branching-config-path config/chapter1_global_branching.yml \
            --explanation-config-path config/chapter1_explanation_gap_validation.yml \
            --output-dir /tmp/v5-reproduction/all \
            --evidence-scope all_analysis_eligible
          python -m island_v2.chapter1_trait_resolution_mnar \
            --island-scores-csv /tmp/pr142-final/syndrome/direct/island_syndrome_scores.csv.gz \
            --status-flora-csv /tmp/pr142-final/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --covariates-csv /tmp/pr142-final/fixed/isolation/results/purpose_shortest_island_data.csv \
            --realm-assignment-csv /tmp/pr142-final/fixed/realm/realm/island_biogeographic_realm_assignment.csv \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --branching-config-path config/chapter1_global_branching.yml \
            --explanation-config-path config/chapter1_explanation_gap_validation.yml \
            --output-dir /tmp/v5-reproduction/direct \
            --evidence-scope direct_only

      - name: Reproduce V6 separately on frozen PR142 input
        run: |
          rm -rf /tmp/v6-reproduction
          python -m island_v2.chapter1_species_detection_tipping_runner \
            --artifact-root /tmp/pr142-final \
            --config-path config/chapter1_species_detection_tipping.yml \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --branching-config-path config/chapter1_global_branching.yml \
            --output-dir /tmp/v6-reproduction

      - name: Validate parent reproductions before joint execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          for scope in ('all', 'direct'):
              root = Path('/tmp/v5-reproduction') / scope
              manifest = json.loads((root/'chapter1_trait_resolution_mnar_manifest.json').read_text())
              assert manifest['contract'] == 'chapter1_trait_resolution_mnar_tipping_v1'
              assert manifest['maximum_OR1_score_difference'] <= 1e-12
              slopes = pd.read_csv(root/'mnar_branch_slopes.csv.gz')
              base = slopes.loc[
                  slopes['scenario_type'].astype(str).eq('selection_grid')
                  & slopes['scenario_family'].astype(str).eq('shared_state_dependent_resolution')
                  & np.isclose(pd.to_numeric(slopes['resolution_odds_ratio']), 1.0)
              ].copy()
              frozen = pd.read_csv(
                  f'/tmp/pr142-final/branching/{scope}/global_branch_distance_slopes.csv'
              )
              key = ['context_layer','axis_set','stratum','support_tier','context','syndrome']
              check = base.merge(
                  frozen[key + ['distance_slope','q_axis_family']],
                  on=key,
                  how='inner',
                  suffixes=('_v5','_frozen'),
              )
              assert len(check) > 0
              assert np.max(np.abs(check['distance_slope_v5'] - check['distance_slope_frozen'])) <= 1e-10
              assert np.max(np.abs(check['q_axis_family_v5'] - check['q_axis_family_frozen'])) <= 1e-10

          v6 = json.loads(Path('/tmp/v6-reproduction/chapter1_species_detection_tipping_manifest.json').read_text())
          assert v6['contract'] == 'chapter1_species_detection_tipping_v1'
          assert v6['maximum_OR_D_1_score_difference'] <= 1e-12
          assert v6['hypothetical_species_increase_regression_precision'] is False

          receipt = {
              'V5_reproduced_on_PR142': True,
              'V6_reproduced_on_PR142': True,
              'V5_max_OR1_score_difference': max(
                  json.loads(Path(f'/tmp/v5-reproduction/{scope}/chapter1_trait_resolution_mnar_manifest.json').read_text())['maximum_OR1_score_difference']
                  for scope in ('all','direct')
              ),
              'V6_max_OR_D_1_score_difference': v6['maximum_OR_D_1_score_difference'],
          }
          Path('/tmp/parent_reproduction_receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PY

      - name: Run frozen joint observation-bias surface and envelope
        run: |
          rm -rf /tmp/joint-observation-bias
          python -m island_v2.chapter1_joint_observation_bias \
            --artifact-root /tmp/pr142-final \
            --config-path config/chapter1_joint_observation_bias.yml \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --branching-config-path config/chapter1_global_branching.yml \
            --explanation-config-path config/chapter1_explanation_gap_validation.yml \
            --output-dir /tmp/joint-observation-bias

      - name: Validate and summarize joint result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/joint-observation-bias')
          manifest = json.loads((root/'joint_observation_bias_manifest.json').read_text())
          assert manifest['contract'] == 'chapter1_joint_observation_bias_v1'
          assert manifest['n_primary_parameter_surfaces_per_scope'] == 1575
          assert manifest['n_partial_identification_surfaces_per_scope'] == 48
          assert manifest['maximum_no_differential_score_difference'] <= 1e-12
          assert manifest['hypothetical_or_imputed_species_increase_regression_precision'] is False
          assert manifest['grid_fraction_is_probability'] is False
          assert manifest['pollinator_mechanism_promoted'] is False

          summary = pd.read_csv(root/'joint_robustness_summary.csv')
          envelope = pd.read_csv(root/'partial_identification_envelope.csv')
          assert len(summary) > 0 and len(envelope) > 0
          lines = [
              '# Chapter 1 P3 joint observation-bias result', '',
              'V5 and V6 were reproduced separately before the joint surface.', '',
              '## Frozen joint surface', '',
              '| scope | target | stratum | robust cells | fit cells | robust fraction | all robust |',
              '|---|---|---|---:|---:|---:|---|',
          ]
          for row in summary.itertuples(index=False):
              frac = '--' if pd.isna(row.robust_fraction_of_fit_grid) else f'{row.robust_fraction_of_fit_grid:.3f}'
              lines.append(
                  f'| {row.evidence_scope} | {row.target} | {row.stratum} | '
                  f'{row.n_robust_cells} | {row.n_fit_cells} | {frac} | {row.all_fit_cells_robust} |'
              )
          lines += ['', '## Partial-identification envelope', '',
                    '| scope | target | stratum | estimate lower | estimate upper | sign identified | support identified | envelope robust |',
                    '|---|---|---|---:|---:|---|---|---|']
          for row in envelope.itertuples(index=False):
              lo = '--' if pd.isna(row.estimate_lower) else f'{row.estimate_lower:.4g}'
              hi = '--' if pd.isna(row.estimate_upper) else f'{row.estimate_upper:.4g}'
              lines.append(
                  f'| {row.evidence_scope} | {row.target} | {row.stratum} | {lo} | {hi} | '
                  f'{row.expected_sign_identified} | {row.support_identified_across_envelope} | {row.envelope_robust} |'
              )
          lines += ['', manifest['claim_ceiling'], '']
          (root/'RESULT_SUMMARY.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
          cat /tmp/joint-observation-bias/RESULT_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-joint-observation-bias-${{ github.run_id }}
          path: |
            /tmp/parent_reproduction_receipt.json
            /tmp/v5-reproduction/
            /tmp/v6-reproduction/
            /tmp/joint-observation-bias/
          if-no-files-found: error
          retention-days: 90
