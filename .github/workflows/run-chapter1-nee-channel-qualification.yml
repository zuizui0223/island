name: Run Chapter 1 NEE channel qualification

on:
  push:
    branches:
      - "nee/double-filter-n1-qualification-runner"
    paths:
      - "data/v2/control/run_nee_channel_qualification.trigger"
      - ".github/workflows/run-chapter1-nee-channel-qualification.yml"

permissions:
  actions: read
  contents: read

jobs:
  qualify-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT: /tmp/chapter1-nee-channel-qualification
    steps:
      - uses: actions/checkout@v4
      - name: Resolve frozen upstream run IDs
        id: trigger
        run: |
          set -euo pipefail
          trigger=data/v2/control/run_nee_channel_qualification.trigger
          if ! test -f "$trigger"; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "source_proxy_run_id=" >> "$GITHUB_OUTPUT"
            echo "island_observation_run_id=" >> "$GITHUB_OUTPUT"
            echo "Channel qualification trigger absent; no-op run."
            exit 0
          fi
          source_run=$(awk -F= '$1=="source_proxy_run_id" {print $2}' "$trigger" | tr -d '[:space:]')
          obs_run=$(awk -F= '$1=="island_observation_run_id" {print $2}' "$trigger" | tr -d '[:space:]')
          for value in "$source_run" "$obs_run"; do
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "Invalid upstream run ID in $trigger" >&2
              exit 1
            fi
          done
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "source_proxy_run_id=$source_run" >> "$GITHUB_OUTPUT"
          echo "island_observation_run_id=$obs_run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.trigger.outputs.active == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.trigger.outputs.active == 'true'
        run: pip install -e ".[dev]"
      - name: Download primary geo_k5 source-proxy artifact
        if: steps.trigger.outputs.active == 'true'
        env:
          SOURCE_PROXY_RUN_ID: ${{ steps.trigger.outputs.source_proxy_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/source" "$ROOT/observations" "$ROOT/output"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_PROXY_RUN_ID}/artifacts?per_page=100" \
            > "$ROOT/source_artifacts.json"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root=Path(os.environ['ROOT'])
          run_id=os.environ['SOURCE_PROXY_RUN_ID']
          payload=json.loads((root/'source_artifacts.json').read_text())
          expected=f'chapter1-nee-source-proxies-from-full-scan-{run_id}'
          matches=[item for item in payload.get('artifacts',[]) if item.get('name') == expected]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one source-proxy artifact {expected}, found {len(matches)}')
          artifact_id=str(matches[0]['id'])
          zip_path=root/'source.zip'
          with zip_path.open('wb') as handle:
              subprocess.run([
                  'gh','api','-H','Accept: application/vnd.github+json',
                  f'/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{artifact_id}/zip',
              ],check=True,stdout=handle)
          subprocess.run(['unzip','-q',str(zip_path),'-d',str(root/'source')],check=True)
          target=root/'source'/'output'/'geo_k5'/'geo_k5_island_channel_source_availability.csv'
          if not target.exists():
              raise SystemExit(f'missing primary source table: {target}')
          print({'source_proxy_run_id':run_id,'artifact_id':artifact_id})
          PY
      - name: Download five frozen island-observation artifacts
        if: steps.trigger.outputs.active == 'true'
        env:
          ISLAND_OBSERVATION_RUN_ID: ${{ steps.trigger.outputs.island_observation_run_id }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${ISLAND_OBSERVATION_RUN_ID}/artifacts?per_page=100" \
            > "$ROOT/observation_artifacts.json"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root=Path(os.environ['ROOT'])
          run_id=os.environ['ISLAND_OBSERVATION_RUN_ID']
          payload=json.loads((root/'observation_artifacts.json').read_text())
          artifacts={item['name']:item for item in payload.get('artifacts',[])}
          channels=['bombus','non_bombus_bees','lepidoptera','flower_visiting_birds','diptera']
          expected=[f'chapter1-nee-island-search-observation-{channel}-{run_id}' for channel in channels]
          missing=[name for name in expected if name not in artifacts]
          if missing:
              raise SystemExit(f'island-observation artifacts incomplete: {missing}')
          for channel,name in zip(channels,expected,strict=True):
              artifact_id=str(artifacts[name]['id'])
              zip_path=root/'observations'/f'{channel}.zip'
              out=root/'observations'/channel
              out.mkdir(parents=True,exist_ok=True)
              with zip_path.open('wb') as handle:
                  subprocess.run([
                      'gh','api','-H','Accept: application/vnd.github+json',
                      f'/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{artifact_id}/zip',
                  ],check=True,stdout=handle)
              subprocess.run(['unzip','-q',str(zip_path),'-d',str(out)],check=True)
              target=out/f'{channel}_island_search_observation.csv'
              if not target.exists():
                  raise SystemExit(f'missing island observation table: {target}')
          print({'island_observation_run_id':run_id,'n_channel_artifacts':len(expected)})
          PY
      - name: Combine observations and audit Search completeness boundary
        if: steps.trigger.outputs.active == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd

          root=Path(os.environ['ROOT'])
          source=pd.read_csv(
              root/'source'/'output'/'geo_k5'/'geo_k5_island_channel_source_availability.csv',
              dtype=str,
          ).fillna('')
          assert len(source) == 8265 * 5
          assert not source[['island_id','channel_id']].duplicated().any()
          channels=['bombus','non_bombus_bees','lepidoptera','flower_visiting_birds','diptera']
          tables=[]
          for channel in channels:
              path=root/'observations'/channel/f'{channel}_island_search_observation.csv'
              table=pd.read_csv(path,dtype=str).fillna('')
              assert not table[['island_id','channel_id']].duplicated().any()
              assert set(table.channel_id) <= {channel}
              if not table.empty:
                  joined=table[['island_id','channel_id']].merge(
                      source[['island_id','channel_id','source_state']],
                      on=['island_id','channel_id'],how='left',validate='one_to_one'
                  )
                  assert joined.source_state.eq('available').all(), 'observation row outside geo_k5 source-available support'
                  complete=table.search_complete.str.lower().eq('true')
                  assert not (table.observation_state.eq('adequate_non_detection') & ~complete).any()
              tables.append(table)
          combined=pd.concat(tables,ignore_index=True)
          assert not combined[['island_id','channel_id']].duplicated().any()
          combined.to_csv(root/'combined_island_observation.csv',index=False)
          print({
              'n_observation_rows':len(combined),
              'by_channel':combined.groupby('channel_id').size().to_dict(),
              'states':combined.observation_state.value_counts().to_dict(),
          })
          PY
      - name: Project retained/disrupted states and write frozen support qualification
        if: steps.trigger.outputs.active == 'true'
        run: |
          set -euo pipefail
          python -m island_v2.chapter1_nee_channel_inputs validate \
            --source-csv "$ROOT/source/output/geo_k5/geo_k5_island_channel_source_availability.csv" \
            --observation-csv "$ROOT/combined_island_observation.csv" \
            --output-dir "$ROOT/output"
      - name: Assert qualification is reporting-only and cannot rescue channels
        if: steps.trigger.outputs.active == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          root=Path(os.environ['ROOT'])/'output'
          projected=pd.read_csv(root/'nee_projected_channel_state.csv',dtype=str).fillna('')
          receipt=pd.read_csv(root/'nee_channel_qualification_receipt.csv',dtype=str).fillna('')
          summary=json.loads((root/'nee_channel_qualification_receipt.json').read_text())
          assert len(projected) == 8265 * 5
          assert projected.island_id.nunique() == 8265
          assert projected.channel_id.nunique() == 5
          assert len(receipt) == 5
          assert set(receipt.channel_id) == {'bombus','non_bombus_bees','lepidoptera','flower_visiting_birds','diptera'}
          assert set(receipt.support_tier).issubset({'confirmatory','pilot','not_qualified'})
          assert set(projected.channel_state).issubset({'retained','disrupted','structurally_absent','unresolved'})
          assert not projected.channel_state.eq('structurally_absent').any(), 'positive-only source scanner must not create structural absence'
          eligible=receipt.N1_gate_eligible.str.lower().isin({'true','1','yes','y'})
          print({
              'n_confirmatory_N1_channels':int(eligible.sum()),
              'qualification':receipt[['channel_id','n_retained','n_disrupted','n_evaluable_source_available','support_tier','N1_gate_eligible','exclusion_reason']].to_dict('records'),
              'summary_rows':summary['n_projected_rows'],
          })
          PY
      - uses: actions/upload-artifact@v4
        if: steps.trigger.outputs.active == 'true'
        with:
          name: chapter1-nee-channel-qualification-${{ github.run_id }}
          path: |
            /tmp/chapter1-nee-channel-qualification/combined_island_observation.csv
            /tmp/chapter1-nee-channel-qualification/output
          if-no-files-found: error
          retention-days: 90
