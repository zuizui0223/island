name: Run Chapter 1 NEE island Search observations

on:
  push:
    branches:
      - "nee/island-observation-search-fallback"
    paths:
      - "data/v2/control/run_nee_island_search_observations.trigger"
      - ".github/workflows/run-chapter1-nee-island-search-observations.yml"

permissions:
  actions: read
  contents: read

jobs:
  prepare-search-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      active: ${{ steps.trigger.outputs.active }}
      source_proxy_run_id: ${{ steps.trigger.outputs.source_proxy_run_id }}
    env:
      CATALOG_ARTIFACT_ID: "10291643834"
      CATALOG_ARTIFACT_SHA256: "c946e36cd04cb319fc63a5bde90534c1cf3c7f41480fc672638f85f5b2a89b02"
      GH_TOKEN: ${{ github.token }}
      ROOT: /tmp/chapter1-nee-island-search
    steps:
      - uses: actions/checkout@v4
      - name: Resolve frozen run trigger
        id: trigger
        run: |
          set -euo pipefail
          trigger=data/v2/control/run_nee_island_search_observations.trigger
          if ! test -f "$trigger"; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "source_proxy_run_id=" >> "$GITHUB_OUTPUT"
            echo "Island Search observation trigger absent; no-op run."
            exit 0
          fi
          run_id=$(awk -F= '$1=="source_proxy_run_id" {print $2}' "$trigger" | tr -d '[:space:]')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid or missing source_proxy_run_id in $trigger" >&2
            exit 1
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "source_proxy_run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.trigger.outputs.active == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.trigger.outputs.active == 'true'
        run: pip install -e ".[dev]"
      - name: Rebuild exact frozen GSHHG island universe
        if: steps.trigger.outputs.active == 'true'
        run: |
          set -euo pipefail
          island-v2-gshhg build --output-dir data/v2/external/islands/gshhg
          test -f data/v2/external/islands/gshhg/prepared/islands_v2.gpkg
      - name: Download canonical GloBI channel catalog
        if: steps.trigger.outputs.active == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/catalog" "$ROOT/source-proxy" "$ROOT/inputs"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATALOG_ARTIFACT_ID}/zip" \
            > "$ROOT/catalog.zip"
          echo "$CATALOG_ARTIFACT_SHA256  $ROOT/catalog.zip" | sha256sum --check --strict
          unzip -q "$ROOT/catalog.zip" -d "$ROOT/catalog"
          test -f "$ROOT/catalog/channel_taxon_catalog.csv"
      - name: Download completed geo_k5 source proxy artifact
        if: steps.trigger.outputs.active == 'true'
        env:
          SOURCE_PROXY_RUN_ID: ${{ steps.trigger.outputs.source_proxy_run_id }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_PROXY_RUN_ID}/artifacts?per_page=100" \
            > "$ROOT/source_proxy_artifacts.json"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root=Path(os.environ['ROOT'])
          run_id=os.environ['SOURCE_PROXY_RUN_ID']
          payload=json.loads((root/'source_proxy_artifacts.json').read_text())
          expected=f'chapter1-nee-source-proxies-from-full-scan-{run_id}'
          matches=[item for item in payload.get('artifacts',[]) if item.get('name') == expected]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one source-proxy artifact {expected}, found {len(matches)}')
          artifact_id=str(matches[0]['id'])
          zip_path=root/'source-proxy.zip'
          with zip_path.open('wb') as handle:
              subprocess.run([
                  'gh','api','-H','Accept: application/vnd.github+json',
                  f'/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{artifact_id}/zip',
              ],check=True,stdout=handle)
          subprocess.run(['unzip','-q',str(zip_path),'-d',str(root/'source-proxy')],check=True)
          target=root/'source-proxy'/'output'/'geo_k5'/'geo_k5_island_channel_source_availability.csv'
          if not target.exists():
              raise SystemExit(f'missing primary source availability: {target}')
          print({'source_proxy_run_id':run_id,'artifact_id':artifact_id})
          PY
      - name: Freeze primary eligible island x channel universe
        if: steps.trigger.outputs.active == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          import geopandas as gpd

          root=Path(os.environ['ROOT'])
          source=pd.read_csv(root/'source-proxy'/'output'/'geo_k5'/'geo_k5_island_channel_source_availability.csv',dtype=str).fillna('')
          channels=['bombus','non_bombus_bees','lepidoptera','flower_visiting_birds','diptera']
          assert len(source) == 8265 * 5
          assert source.island_id.nunique() == 8265
          assert set(source.channel_id) == set(channels)
          assert set(source.source_state).issubset({'available','unresolved'})
          islands=gpd.read_file('data/v2/external/islands/gshhg/prepared/islands_v2.gpkg',layer='islands')
          island_ids=set(islands.island_id.astype(str))
          missing=sorted(set(source.loc[source.source_state.eq('available'),'island_id'])-island_ids)
          if missing:
              raise SystemExit(f'source-available islands missing from exact GSHHG universe: {missing[:10]}')
          source.to_csv(root/'inputs'/'geo_k5_island_channel_source_availability.csv',index=False)
          (root/'inputs'/'channel_taxon_catalog.csv').write_bytes((root/'catalog'/'channel_taxon_catalog.csv').read_bytes())
          Path(root/'inputs'/'eligibility_summary.txt').write_text('\n'.join(
              f"{channel}={int(((source.channel_id==channel)&(source.source_state=='available')).sum())}"
              for channel in channels
          )+'\n')
          print(source.loc[source.source_state.eq('available')].groupby('channel_id').size().to_dict())
          PY
          cp data/v2/external/islands/gshhg/prepared/islands_v2.gpkg "$ROOT/inputs/islands_v2.gpkg"
      - uses: actions/upload-artifact@v4
        if: steps.trigger.outputs.active == 'true'
        with:
          name: chapter1-nee-island-search-inputs-${{ github.run_id }}
          path: /tmp/chapter1-nee-island-search/inputs
          if-no-files-found: error
          retention-days: 7

  scan-search-observation:
    needs: prepare-search-inputs
    if: needs.prepare-search-inputs.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        channel:
          - bombus
          - lepidoptera
          - flower_visiting_birds
          - diptera
          - non_bombus_bees
    env:
      CHANNEL: ${{ matrix.channel }}
      OUT_DIR: /tmp/chapter1-nee-island-search-output/${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: chapter1-nee-island-search-inputs-${{ github.run_id }}
          path: /tmp/island-search-inputs
      - name: Run conservative exact-island Search observation scan
        run: |
          set -euo pipefail
          python -m island_v2.chapter1_nee_island_search_observation \
            --islands-gpkg /tmp/island-search-inputs/islands_v2.gpkg \
            --source-availability-csv /tmp/island-search-inputs/geo_k5_island_channel_source_availability.csv \
            --catalog-csv /tmp/island-search-inputs/channel_taxon_catalog.csv \
            --channel-id "$CHANNEL" \
            --output-dir "$OUT_DIR"
      - name: Assert fail-closed non-detection boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          channel=os.environ['CHANNEL']
          root=Path(os.environ['OUT_DIR'])
          table=pd.read_csv(root/f'{channel}_island_search_observation.csv',dtype=str).fillna('')
          receipt=json.loads((root/f'{channel}_island_search_observation_receipt.json').read_text())
          assert receipt['N1_fitted'] is False
          assert receipt['uses_focal_plant_traits'] is False
          assert receipt['uses_N1_effects'] is False
          assert receipt['adequate_non_detection_requires_exhaustive_search'] is True
          assert receipt['max_records_per_island_channel'] == 900
          assert set(table.observation_state).issubset({'detected','adequate_non_detection','insufficient_effort','unresolved'})
          if not table.empty:
              assert pd.to_numeric(table.raw_records_examined).le(900).all()
              bad=table.observation_state.eq('adequate_non_detection') & ~table.search_complete.astype(str).str.lower().eq('true')
              assert not bad.any(), 'non-exhaustive search promoted to adequate_non_detection'
              truncated_negative=table.search_truncated.astype(str).str.lower().eq('true') & ~table.observation_state.eq('detected')
              assert table.loc[truncated_negative,'observation_state'].eq('insufficient_effort').all()
          print({
              'channel':channel,
              'source_available':receipt['n_source_available_islands'],
              'detected':receipt['n_detected'],
              'adequate_non_detection':receipt['n_adequate_non_detection'],
              'insufficient_effort':receipt['n_insufficient_effort'],
              'unresolved':receipt['n_unresolved'],
              'complete':receipt['n_complete_searches'],
              'truncated':receipt['n_truncated_searches'],
              'errors':receipt['n_search_errors'],
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-nee-island-search-observation-${{ matrix.channel }}-${{ github.run_id }}
          path: /tmp/chapter1-nee-island-search-output/${{ matrix.channel }}
          if-no-files-found: error
          retention-days: 90
