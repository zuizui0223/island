name: Run Chapter 1 NEE N1

on:
  push:
    branches:
      - "nee/double-filter-n1-production-runner"
    paths:
      - "data/v2/control/run_nee_n1.trigger"
      - ".github/workflows/run-chapter1-nee-n1.yml"

permissions:
  actions: read
  contents: read

jobs:
  run-frozen-n1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT: /tmp/chapter1-nee-n1
      COVARIATE_ARTIFACT_ID: "8270544465"
      COVARIATE_ARTIFACT_SHA256: "695f35b97bae07e81b05deab537dd73fa687b2d99e9efdb1cb3babd2fa12dfb6"
    steps:
      - uses: actions/checkout@v4
      - name: Resolve frozen qualification run ID
        id: trigger
        run: |
          set -euo pipefail
          trigger=data/v2/control/run_nee_n1.trigger
          if ! test -f "$trigger"; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "qualification_run_id=" >> "$GITHUB_OUTPUT"
            echo "N1 trigger absent; no-op run."
            exit 0
          fi
          run_id=$(awk -F= '$1=="qualification_run_id" {print $2}' "$trigger" | tr -d '[:space:]')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid or missing qualification_run_id in $trigger" >&2
            exit 1
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "qualification_run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.trigger.outputs.active == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.trigger.outputs.active == 'true'
        run: pip install -e ".[dev]"
      - name: Download frozen channel-qualification artifact
        if: steps.trigger.outputs.active == 'true'
        env:
          QUALIFICATION_RUN_ID: ${{ steps.trigger.outputs.qualification_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/qualification" "$ROOT/covariates" "$ROOT/output"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}/artifacts?per_page=100" \
            > "$ROOT/qualification_artifacts.json"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root=Path(os.environ['ROOT'])
          run_id=os.environ['QUALIFICATION_RUN_ID']
          payload=json.loads((root/'qualification_artifacts.json').read_text())
          expected=f'chapter1-nee-channel-qualification-{run_id}'
          matches=[item for item in payload.get('artifacts',[]) if item.get('name') == expected]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one qualification artifact {expected}, found {len(matches)}')
          artifact_id=str(matches[0]['id'])
          zip_path=root/'qualification.zip'
          with zip_path.open('wb') as handle:
              subprocess.run([
                  'gh','api','-H','Accept: application/vnd.github+json',
                  f'/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{artifact_id}/zip',
              ],check=True,stdout=handle)
          subprocess.run(['unzip','-q',str(zip_path),'-d',str(root/'qualification')],check=True)
          required=[
              root/'qualification'/'output'/'nee_projected_channel_state.csv',
              root/'qualification'/'output'/'nee_channel_qualification_receipt.csv',
          ]
          missing=[str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'qualification artifact missing required files: {missing}')
          print({'qualification_run_id':run_id,'artifact_id':artifact_id})
          PY
      - name: Hash-verify canonical Chapter 1 covariate artifact
        if: steps.trigger.outputs.active == 'true'
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${COVARIATE_ARTIFACT_ID}/zip" \
            > "$ROOT/covariates.zip"
          echo "$COVARIATE_ARTIFACT_SHA256  $ROOT/covariates.zip" | sha256sum --check --strict
          unzip -q "$ROOT/covariates.zip" -d "$ROOT/covariates"
          test -s "$ROOT/covariates/results/purpose_shortest_island_data.csv"
      - name: Record qualification support before N1
        if: steps.trigger.outputs.active == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd

          root=Path(os.environ['ROOT'])/'qualification'/'output'
          receipt=pd.read_csv(root/'nee_channel_qualification_receipt.csv',dtype=str).fillna('')
          assert len(receipt) == 5
          eligible=receipt.N1_gate_eligible.str.lower().isin({'true','1','yes','y'})
          print({
              'n_N1_gate_eligible_channels':int(eligible.sum()),
              'channels':receipt[['channel_id','support_tier','N1_gate_eligible','n_retained','n_disrupted','n_evaluable_source_available','exclusion_reason']].to_dict('records'),
          })
          PY
      - name: Run the frozen N1 wrapper once
        if: steps.trigger.outputs.active == 'true'
        run: |
          set -euo pipefail
          python -m island_v2.chapter1_nee_n1_run run \
            --projected-csv "$ROOT/qualification/output/nee_projected_channel_state.csv" \
            --qualification-csv "$ROOT/qualification/output/nee_channel_qualification_receipt.csv" \
            --canonical-covariates-csv "$ROOT/covariates/results/purpose_shortest_island_data.csv" \
            --output-dir "$ROOT/output" \
            --expected-islands 8265
      - name: Enforce frozen stop/pass action without auto-opening N2
        if: steps.trigger.outputs.active == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root=Path(os.environ['ROOT'])/'output'
          gate=json.loads((root/'N1_gate_receipt.json').read_text())
          required={
              True:'N2_may_open',
              False:'stop_before_N2_and_keep_frozen_Chapter1',
          }
          assert gate['failure_action'] == required[bool(gate['N1_pass'])]
          if gate['N1_pass']:
              assert gate['claim_ceiling'] == 'independently_measured_pollination_channels_have_different_isolation_retention_curves'
          else:
              assert gate['claim_ceiling'] == 'N1_not_promoted'
          print(gate)
          print('N2 is not triggered automatically by this workflow.')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.trigger.outputs.active == 'true'
        with:
          name: chapter1-nee-n1-${{ github.run_id }}
          path: /tmp/chapter1-nee-n1/output
          if-no-files-found: error
          retention-days: 90
