name: Run Chapter 1 NEE full source positive scan

on:
  push:
    branches:
      - "nee/source-positive-scan-run"
    paths:
      - "data/v2/control/run_nee_source_positive_scan_full.trigger"
      - ".github/workflows/run-chapter1-nee-source-positive-scan-full.yml"

permissions:
  actions: read
  contents: read

jobs:
  prepare-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      active: ${{ steps.trigger.outputs.active }}
    env:
      SOURCE_ARTIFACT_ID: "9601703747"
      SOURCE_ARTIFACT_SHA256: "51cff9087a40b76655ff043d59aceabf25800a6029ed005a77b8db30e78345d2"
      CATALOG_ARTIFACT_ID: "10291643834"
      CATALOG_ARTIFACT_SHA256: "c946e36cd04cb319fc63a5bde90534c1cf3c7f41480fc672638f85f5b2a89b02"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve full-scan trigger state
        id: trigger
        run: |
          if test -f data/v2/control/run_nee_source_positive_scan_full.trigger; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Full source-scan trigger absent; no-op run."
          fi
      - uses: actions/setup-python@v5
        if: steps.trigger.outputs.active == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.trigger.outputs.active == 'true'
        run: pip install -e ".[dev]"
      - name: Download pinned source and canonical channel catalog artifacts
        if: steps.trigger.outputs.active == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/source /tmp/catalog /tmp/full-inputs
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            > /tmp/source.zip
          echo "$SOURCE_ARTIFACT_SHA256  /tmp/source.zip" | sha256sum --check --strict
          unzip -q /tmp/source.zip -d /tmp/source

          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATALOG_ARTIFACT_ID}/zip" \
            > /tmp/catalog.zip
          echo "$CATALOG_ARTIFACT_SHA256  /tmp/catalog.zip" | sha256sum --check --strict
          unzip -q /tmp/catalog.zip -d /tmp/catalog

          test -f /tmp/source/result/island_source_assignments.csv.gz
          test -f /tmp/catalog/channel_taxon_catalog.csv
          cp /tmp/source/result/island_source_assignments.csv.gz /tmp/full-inputs/island_source_assignments.csv.gz
          cp /tmp/catalog/channel_taxon_catalog.csv /tmp/full-inputs/channel_taxon_catalog.csv
      - name: Assert frozen full source universe before scanning
        if: steps.trigger.outputs.active == 'true'
        run: |
          python - <<'PY'
          import pandas as pd

          source=pd.read_csv('/tmp/full-inputs/island_source_assignments.csv.gz',dtype=str).fillna('')
          assert source.island_id.nunique() == 8265
          assert source.entity_ID.nunique() == 730
          assert source.loc[source.source_mode.eq('geo_k5'),'entity_ID'].nunique() == 481
          assert set(source.source_mode) == {'geo_k5','geo_k10','geo_k20','geo50_climate10'}
          print({
              'n_islands':int(source.island_id.nunique()),
              'n_union_source_entities':int(source.entity_ID.nunique()),
              'n_geo_k5_entities':int(source.loc[source.source_mode.eq('geo_k5'),'entity_ID'].nunique()),
          })
          PY
      - uses: actions/upload-artifact@v4
        if: steps.trigger.outputs.active == 'true'
        with:
          name: chapter1-nee-source-scan-full-inputs-${{ github.run_id }}
          path: /tmp/full-inputs
          if-no-files-found: error
          retention-days: 7

  scan-full:
    needs: prepare-full
    if: needs.prepare-full.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        channel:
          - bombus
          - non_bombus_bees
          - lepidoptera
          - flower_visiting_birds
          - diptera
    env:
      CHANNEL: ${{ matrix.channel }}
      OUT_DIR: /tmp/source-scan-full/${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: chapter1-nee-source-scan-full-inputs-${{ github.run_id }}
          path: /tmp/full-inputs
      - name: Run frozen positive-only source scan
        run: |
          set -euo pipefail
          python -m island_v2.chapter1_nee_source_positive_scan \
            --source-assignments-csv /tmp/full-inputs/island_source_assignments.csv.gz \
            --catalog-csv /tmp/full-inputs/channel_taxon_catalog.csv \
            --channel-id "$CHANNEL" \
            --output-dir "$OUT_DIR"
      - name: Assert full fail-closed boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          channel=os.environ['CHANNEL']
          root=Path(os.environ['OUT_DIR'])
          receipt=json.loads((root/f'{channel}_source_positive_scan_receipt.json').read_text())
          states=pd.read_csv(root/f'{channel}_source_entity_states.csv',dtype=str).fillna('')
          assert receipt['n_source_entities'] == 730
          assert receipt['n_structurally_absent'] == 0
          assert receipt['n_available'] + receipt['n_unresolved'] == 730
          assert receipt['no_hit_means'] == 'unresolved'
          assert receipt['multipart_query_strategy'] == 'exact_component_polygons'
          assert receipt['max_records_per_entity_channel'] == 900
          assert receipt['uses_focal_plant_traits'] is False
          assert receipt['uses_island_channel_outcomes'] is False
          assert set(states.source_state).issubset({'available','unresolved'})
          assert pd.to_numeric(states.n_records_examined).max() <= 900
          print({
              'channel':channel,
              'available':receipt['n_available'],
              'unresolved':receipt['n_unresolved'],
              'geometry_failures':receipt['n_geometry_failures'],
              'query_error_entities':receipt['n_query_error_entities'],
              'multipart_entities':receipt['n_multipart_entities'],
              'records_examined_total':int(pd.to_numeric(states.n_records_examined).sum()),
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-nee-source-positive-scan-full-${{ matrix.channel }}-${{ github.run_id }}
          path: /tmp/source-scan-full/${{ matrix.channel }}
          if-no-files-found: error
          retention-days: 90
