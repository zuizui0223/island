# Re-run from the lint-repaired P2 source; scientific contract unchanged.
name: Run Chapter 1 P2 component non-concordance

on:
  push:
    branches: ["ch1/p2-component-nonconcordance"]
    paths:
      - "config/chapter1_p2_component_nonconcordance.yml"
      - "config/chapter1_p2_component_nonconcordance_numerical_spec.yml"
      - "src/island_v2/chapter1_p2_component_nonconcordance.py"
      - "tests/test_chapter1_p2_component_nonconcordance.py"
      - ".github/workflows/run-chapter1-p2-component-nonconcordance.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  p2:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT_ID: "10058653212"
      SOURCE_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      SOURCE_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Test and lint P2
        run: |
          pytest -q tests/test_chapter1_p2_component_nonconcordance.py
          ruff check src/island_v2/chapter1_p2_component_nonconcordance.py tests/test_chapter1_p2_component_nonconcordance.py

      - name: Verify and download immutable PR142 artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$SOURCE_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$SOURCE_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$SOURCE_ARTIFACT_ID"
          test "$observed_digest" = "$SOURCE_ARTIFACT_DIGEST"
          rm -rf /tmp/p2-input
          mkdir -p /tmp/p2-input
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT_NAME" --dir /tmp/p2-input

      - name: Run frozen P2 audit
        run: |
          rm -rf /tmp/p2-output
          python -m island_v2.chapter1_p2_component_nonconcordance \
            --artifact-root /tmp/p2-input \
            --p2-config-path config/chapter1_p2_component_nonconcordance.yml \
            --numerical-spec-path config/chapter1_p2_component_nonconcordance_numerical_spec.yml \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --output-dir /tmp/p2-output

      - name: Validate P2 result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('/tmp/p2-output')
          result=json.loads((root/'chapter1_p2_component_nonconcordance_result.json').read_text())
          assert result['contract']=='chapter1_p2_component_nonconcordance_result_v1'
          assert result['source_primary_analysis']['workflow_run_id']==34232450884
          assert result['source_primary_analysis']['artifact_id']==10058653212
          assert result['primary_profile']=='direct_only__native_nonendemic'
          assert result['p2a_primary_valid_bootstrap_draws'] >= 1900
          support=pd.read_csv(root/'p2a_common_island_support.csv')
          for (_,_,context),g in support.groupby(['evidence_scope','stratum','context']):
              assert g['common_island_support'].nunique()==1
          co=pd.read_csv(root/'p2b_coobserved_species_support.csv')
          assert co['same_island_denominator'].all()
          assert (root/'p2c_realm_boundary_audit.csv').is_file()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-p2-component-nonconcordance-${{ github.run_id }}
          path: /tmp/p2-output/
          if-no-files-found: error
          retention-days: 90
