name: Historical replay — Run Chapter 1 response compression audit

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate compression audit
        run: |
          pytest -q tests/test_chapter1_response_compression_audit.py tests/test_chapter1_all_data_probability.py
          ruff check src/island_v2/chapter1_response_compression_audit.py tests/test_chapter1_response_compression_audit.py
      - name: Download frozen Chapter 1 inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-compress
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/ch1-compress
          test -s /tmp/ch1-compress/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/ch1-compress/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/ch1-compress/snapshot/chapter1_trait_state_audit_all.csv.gz
          test -s /tmp/ch1-compress/snapshot/chapter1_trait_state_audit_direct.csv.gz
      - name: Fit compression audit for all-analysis evidence
        run: |
          python -m island_v2.chapter1_response_compression_audit \
            --status-flora-csv /tmp/ch1-compress/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-compress/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv /tmp/ch1-compress/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_all_data_probability.yml \
            --evidence-scope all_analysis_eligible \
            --output-dir /tmp/results/all
      - name: Fit compression audit for direct evidence
        run: |
          python -m island_v2.chapter1_response_compression_audit \
            --status-flora-csv /tmp/ch1-compress/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-compress/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv /tmp/ch1-compress/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_all_data_probability.yml \
            --evidence-scope direct_only \
            --output-dir /tmp/results/direct
      - name: Write summary
        run: |
          cat /tmp/results/all/compression_audit_summary.csv >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/results/direct/compression_audit_summary.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-response-compression-${{ github.run_id }}
          path: /tmp/results
          if-no-files-found: error
          retention-days: 30
