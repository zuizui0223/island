name: Run Chapter 1 route-config separation guard

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - "config/chapter1_progressive_analysis.yml"
      - "config/chapter1_pr136_biogeographic_pattern.yml"
      - "config/chapter1_all_data_progressive_analysis.yml"
      - "config/chapter1_all_data_biogeographic_pattern.yml"
      - "config/chapter1_route_config_separation_lock.json"
      - "tests/test_chapter1_route_config_separation.py"
      - ".github/workflows/run-chapter1-all-data-primary.yml"
      - ".github/workflows/run-chapter1-h5-architecture-common-support-h2.yml"
      - ".github/workflows/run-chapter1-h5-orthogonalized-architecture-specificity.yml"
      - ".github/workflows/run-chapter1-h5-orthogonalized-architecture-structural-correction.yml"
      - ".github/workflows/run-chapter1-syndrome-support-audit.yml"
      - ".github/workflows/run-chapter1-route-config-separation-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify canonical surface and route separation
        run: |
          pytest -q tests/test_chapter1_route_config_separation.py
          ruff check tests/test_chapter1_route_config_separation.py
