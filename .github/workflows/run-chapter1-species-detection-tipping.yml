name: Run Chapter 1 species-detection tipping sensitivity

on:
  push:
    branches: ["ch1/species-detection-tipping"]
    paths:
      - "config/chapter1_species_detection_tipping.yml"
      - "src/island_v2/chapter1_species_detection_tipping.py"
      - "tests/test_chapter1_species_detection_tipping.py"
      - ".github/workflows/run-chapter1-species-detection-tipping.yml"

permissions:
  contents: read
  actions: read

jobs:
  species-detection-tipping:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: "34232450884"
      PINNED_ARTIFACT_ID: "10058653212"
      PINNED_ARTIFACT_NAME: "chapter1-progressive-analysis-34232450884"
      PINNED_ARTIFACT_DIGEST: "sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Test and lint V6 implementation
        run: |
          pytest -q tests/test_chapter1_species_detection_tipping.py
          ruff check \
            src/island_v2/chapter1_species_detection_tipping.py \
            tests/test_chapter1_species_detection_tipping.py

      - name: Verify and download frozen PR142 artifact
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/artifacts?per_page=100")
          observed_id=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .id" <<<"$metadata")
          observed_digest=$(jq -r ".artifacts[] | select(.name == \"$PINNED_ARTIFACT_NAME\" and .expired == false) | .digest" <<<"$metadata")
          test "$observed_id" = "$PINNED_ARTIFACT_ID"
          test "$observed_digest" = "$PINNED_ARTIFACT_DIGEST"
          rm -rf /tmp/pr142-final
          mkdir -p /tmp/pr142-final
          gh run download "$PINNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PINNED_ARTIFACT_NAME" --dir /tmp/pr142-final
          test -s /tmp/pr142-final/syndrome/all/island_syndrome_scores.csv.gz
          test -s /tmp/pr142-final/syndrome/direct/island_syndrome_scores.csv.gz
          test -s /tmp/pr142-final/branching/all/global_branch_distance_slopes.csv
          test -s /tmp/pr142-final/branching/direct/global_branch_distance_slopes.csv
          test -s /tmp/pr142-final/branching/all/global_branch_between_context_omnibus.csv
          test -s /tmp/pr142-final/branching/direct/global_branch_between_context_omnibus.csv
          test -s /tmp/pr142-final/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/pr142-final/fixed/canonical/observation_bias/observation_selection_coefficients.csv
          test -s /tmp/pr142-final/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/pr142-final/fixed/realm/realm/island_biogeographic_realm_assignment.csv

      - name: Run frozen species-detection tipping surface
        run: |
          rm -rf /tmp/species-detection-tipping
          python -m island_v2.chapter1_species_detection_tipping \
            --artifact-root /tmp/pr142-final \
            --config-path config/chapter1_species_detection_tipping.yml \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --branching-config-path config/chapter1_global_branching.yml \
            --output-dir /tmp/species-detection-tipping

      - name: Validate baseline reproduction and summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path('/tmp/species-detection-tipping')
          manifest = json.loads((root/'chapter1_species_detection_tipping_manifest.json').read_text())
          headline = pd.read_csv(root/'species_detection_headline_scenarios.csv.gz')
          tipping = pd.read_csv(root/'species_detection_tipping_surface.csv')
          assert manifest['contract'] == 'chapter1_species_detection_tipping_v1'
          assert manifest['maximum_OR_D_1_score_difference'] <= 1e-12
          assert manifest['hypothetical_species_increase_regression_precision'] is False

          # OR_D=1 must be invariant to the assumed completeness surface.
          baseline = headline.loc[np.isclose(headline['state_recording_odds_ratio'], 1.0)].copy()
          keys = ['evidence_scope','target','stratum']
          for _, group in baseline.groupby(keys, dropna=False):
              if group['status'].astype(str).eq('fit').any():
                  fit = group.loc[group['status'].astype(str).eq('fit')]
                  estimates = pd.to_numeric(fit['estimate'], errors='coerce').dropna()
                  qvals = pd.to_numeric(fit['q_value'], errors='coerce').dropna()
                  if len(estimates):
                      assert estimates.max() - estimates.min() <= 1e-10
                  if len(qvals):
                      assert qvals.max() - qvals.min() <= 1e-10

          # Compare the OR_D=1 estimates with the frozen branching outputs.
          scope_short = {'all_analysis_eligible':'all', 'direct_only':'direct'}
          for scope, short in scope_short.items():
              frozen_slopes = pd.read_csv(
                  f'/tmp/pr142-final/branching/{short}/global_branch_distance_slopes.csv'
              )
              frozen_between = pd.read_csv(
                  f'/tmp/pr142-final/branching/{short}/global_branch_between_context_omnibus.csv'
              )
              current = baseline.loc[baseline['evidence_scope'].eq(scope)].copy()
              for stratum in ('all_native','native_nonendemic'):
                  # Palearctic accessibility.
                  old = frozen_slopes.loc[
                      frozen_slopes['context_layer'].astype(str).eq('biogeographic_realm')
                      & frozen_slopes['axis_set'].astype(str).eq('universal_plant_response')
                      & frozen_slopes['stratum'].astype(str).eq(stratum)
                      & frozen_slopes['support_tier'].astype(str).eq('confirmatory')
                      & frozen_slopes['context'].astype(str).eq('Palearctic')
                      & frozen_slopes['syndrome'].astype(str).eq('accessibility_generalization')
                  ]
                  new = current.loc[
                      current['target'].astype(str).eq('Palearctic_accessibility')
                      & current['stratum'].astype(str).eq(stratum)
                      & current['status'].astype(str).eq('fit')
                  ].iloc[0]
                  assert len(old) == 1
                  assert abs(float(new['estimate']) - float(old.iloc[0]['distance_slope'])) <= 1e-10
                  assert abs(float(new['q_value']) - float(old.iloc[0]['q_axis_family'])) <= 1e-10

                  # Tropical accessibility.
                  old = frozen_slopes.loc[
                      frozen_slopes['context_layer'].astype(str).eq('analysis_regime')
                      & frozen_slopes['axis_set'].astype(str).eq('universal_plant_response')
                      & frozen_slopes['stratum'].astype(str).eq(stratum)
                      & frozen_slopes['support_tier'].astype(str).eq('confirmatory')
                      & frozen_slopes['context'].astype(str).eq('tropical')
                      & frozen_slopes['syndrome'].astype(str).eq('accessibility_generalization')
                  ]
                  new = current.loc[
                      current['target'].astype(str).eq('tropical_accessibility')
                      & current['stratum'].astype(str).eq(stratum)
                      & current['status'].astype(str).eq('fit')
                  ].iloc[0]
                  assert len(old) == 1
                  assert abs(float(new['estimate']) - float(old.iloc[0]['distance_slope'])) <= 1e-10
                  assert abs(float(new['q_value']) - float(old.iloc[0]['q_axis_family'])) <= 1e-10

                  # North--Tropical direct vector difference.
                  old = frozen_between.loc[
                      frozen_between['context_layer'].astype(str).eq('analysis_regime')
                      & frozen_between['axis_set'].astype(str).eq('universal_plant_response')
                      & frozen_between['stratum'].astype(str).eq(stratum)
                      & frozen_between['support_tier'].astype(str).eq('confirmatory')
                      & frozen_between['context_a'].astype(str).eq('northern_midlatitude')
                      & frozen_between['context_b'].astype(str).eq('tropical')
                  ]
                  new = current.loc[
                      current['target'].astype(str).eq('north_tropical_vector_difference')
                      & current['stratum'].astype(str).eq(stratum)
                  ].iloc[0]
                  assert len(old) == 1
                  assert abs(float(new['q_value']) - float(old.iloc[0]['q_between_context_family'])) <= 1e-10

          # Produce a compact run summary without selecting the most favourable sensitivity cell.
          lines = [
              '# Chapter 1 V6 species-detection tipping surface', '',
              f"Scenarios: **{manifest['n_headline_rows']} headline rows**", '',
              '## Tipping surface', '',
              '| scope | target | stratum | C0 | OR_C | OR_D tipping | nonfocal/focal recording advantage | event |',
              '|---|---|---|---:|---:|---:|---|---|',
          ]
          for row in tipping.itertuples(index=False):
              tip = '--' if pd.isna(row.tipping_state_recording_odds_ratio) else f'{row.tipping_state_recording_odds_ratio:.3g}'
              lines.append(
                  f'| {row.evidence_scope} | {row.target} | {row.stratum} | '
                  f'{row.median_distance_completeness:.2f} | {row.distance_completeness_odds_ratio:.3g} | '
                  f'{tip} | {row.recording_advantage_nonfocal_over_focal} | {row.tipping_event} |'
              )
          lines += ['', '## Existing observation-process directional diagnostic', '',
                    '```json', json.dumps(manifest['observation_direction_diagnostic'], indent=2), '```', '',
                    manifest['claim_ceiling'], '']
          (root/'RESULT_SUMMARY.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
          cat /tmp/species-detection-tipping/RESULT_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-species-detection-tipping-${{ github.run_id }}
          path: /tmp/species-detection-tipping/
          if-no-files-found: error
          retention-days: 90
