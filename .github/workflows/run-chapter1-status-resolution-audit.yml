name: Run Chapter 1 floristic-status resolution audit

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - "src/island_v2/chapter1_status_resolution_process.py"
      - "tests/test_chapter1_status_resolution_process.py"
      - ".github/workflows/run-chapter1-status-resolution-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate status-resolution audit
        run: |
          pytest -q tests/test_chapter1_status_resolution_process.py tests/test_chapter1_all_data_probability.py
          ruff check src/island_v2/chapter1_status_resolution_process.py tests/test_chapter1_status_resolution_process.py
      - name: Download frozen Chapter 1 inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-status
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/ch1-status
          test -s /tmp/ch1-status/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/ch1-status/fixed/isolation/results/purpose_shortest_island_data.csv
      - name: Fit status-resolution observation-process model
        run: |
          python -m island_v2.chapter1_status_resolution_process \
            --status-flora-csv /tmp/ch1-status/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --covariates-csv /tmp/ch1-status/fixed/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/chapter1_all_data_probability.yml \
            --output-dir /tmp/results
          cat /tmp/results/status_resolution_by_context.csv >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/results/status_resolution_between_omnibus.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-status-resolution-${{ github.run_id }}
          path: /tmp/results
          if-no-files-found: error
          retention-days: 30
