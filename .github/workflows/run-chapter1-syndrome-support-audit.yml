name: Run Chapter 1 syndrome support-intersection audit

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - ".github/workflows/run-chapter1-syndrome-support-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download frozen Chapter 1 inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-support
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/ch1-support
          test -s /tmp/ch1-support/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/ch1-support/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/ch1-support/fixed/realm/realm/island_biogeographic_realm_assignment.csv
          test -s /tmp/ch1-support/snapshot/chapter1_trait_ledger_all_analysis.csv.gz
          test -s /tmp/ch1-support/snapshot/chapter1_trait_ledger_direct_only.csv.gz
      - name: Freeze one-trait diagnostic config
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          src=Path('config/chapter1_pr138_pollination_syndromes.yml')
          cfg=yaml.safe_load(src.read_text())
          assert int(cfg['score_definition']['minimum_informative_traits']) == 2
          cfg['score_definition']['minimum_informative_traits'] = 1
          Path('/tmp/min1_syndromes.yml').write_text(yaml.safe_dump(cfg, sort_keys=False))
          PY
      - name: Run original and min1 syndrome routes
        run: |
          set -euo pipefail
          mkdir -p /tmp/results
          for scope in all direct; do
            if [ "$scope" = "all" ]; then ledger=/tmp/ch1-support/snapshot/chapter1_trait_ledger_all_analysis.csv.gz; else ledger=/tmp/ch1-support/snapshot/chapter1_trait_ledger_direct_only.csv.gz; fi
            for variant in min2 min1; do
              if [ "$variant" = "min2" ]; then syndrome_cfg=config/chapter1_pr138_pollination_syndromes.yml; else syndrome_cfg=/tmp/min1_syndromes.yml; fi
              out=/tmp/results/${scope}_${variant}
              python -m island_v2.chapter1_pr138_syndrome_analysis \
                --trait-ledger-csv "$ledger" \
                --status-flora-csv /tmp/ch1-support/fixed/canonical/input/chapter1_status_flora.csv.gz \
                --covariates-csv /tmp/ch1-support/fixed/isolation/results/purpose_shortest_island_data.csv \
                --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
                --syndrome-config-path "$syndrome_cfg" \
                --output-dir "$out/syndrome"
              python -m island_v2.chapter1_global_branching \
                --island-scores-csv "$out/syndrome/island_syndrome_scores.csv.gz" \
                --covariates-csv /tmp/ch1-support/fixed/isolation/results/purpose_shortest_island_data.csv \
                --realm-assignment-csv /tmp/ch1-support/fixed/realm/realm/island_biogeographic_realm_assignment.csv \
                --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
                --branching-config-path config/chapter1_global_branching.yml \
                --output-dir "$out/branching"
            done
          done
      - name: Extract matched all-observed North-Tropical comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          rows=[]
          for scope in ('all','direct'):
              for variant in ('min2','min1'):
                  root=Path('/tmp/results')/f'{scope}_{variant}'
                  b=pd.read_csv(root/'branching/global_branch_between_context_omnibus.csv')
                  x=b[
                      b['context_layer'].astype(str).eq('analysis_regime') &
                      b['axis_set'].astype(str).eq('universal_plant_response') &
                      b['stratum'].astype(str).eq('all_observed') &
                      b['support_tier'].astype(str).eq('confirmatory') &
                      b['context_a'].astype(str).eq('northern_midlatitude') &
                      b['context_b'].astype(str).eq('tropical')
                  ].copy()
                  if len(x)!=1:
                      raise SystemExit(f'expected one row for {scope}/{variant}; got {len(x)}')
                  r=x.iloc[0].to_dict()
                  rows.append({
                      'evidence_scope': 'all_analysis_eligible' if scope=='all' else 'direct_only',
                      'minimum_informative_traits': 2 if variant=='min2' else 1,
                      'n_unique_islands': r.get('n_unique_islands'),
                      'n_clusters': r.get('n_clusters'),
                      'p_value': r.get('p_value'),
                      'q_value': r.get('q_between_context_family'),
                      'supported': r.get('context_vector_difference_supported'),
                  })
          out=pd.DataFrame(rows)
          out.to_csv('/tmp/results/support_intersection_audit.csv',index=False)
          print(out.to_string(index=False))
          PY
          cat /tmp/results/support_intersection_audit.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-syndrome-support-audit-${{ github.run_id }}
          path: /tmp/results
          if-no-files-found: error
          retention-days: 30
