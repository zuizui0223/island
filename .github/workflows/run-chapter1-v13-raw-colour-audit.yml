name: Historical replay — Chapter 1 v13 raw-colour audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TRAIT_RUN_ID: "34191508045"
      TRAIT_ARTIFACT: "source-scale-batch-integration-34191508045"
      ISOLATION_RUN_ID: "29228212586"
      ISOLATION_ARTIFACT: "purpose-shortest-distance-regime-29228212586"
      CANONICAL_RUN_ID: "32845980788"
      CANONICAL_ARTIFACT: "chapter1-when-where-main-32845980788"
      ALL_DATA_RUN_ID: "35100991898"
      ALL_DATA_ARTIFACT: "chapter1-all-data-primary-35100991898"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and test raw-colour audits
        run: |
          pip install -e ".[dev]"
          pytest -q \
            tests/test_chapter1_v13_raw_colour_audit.py \
            tests/test_chapter1_v13_colour_architecture_audit.py \
            tests/test_chapter1_v13_raw_colour_coupling_audit.py
          ruff check \
            src/island_v2/chapter1_v13_raw_colour_audit.py \
            src/island_v2/chapter1_v13_colour_architecture_audit.py \
            src/island_v2/chapter1_v13_raw_colour_coupling_audit.py \
            tests/test_chapter1_v13_raw_colour_audit.py \
            tests/test_chapter1_v13_colour_architecture_audit.py \
            tests/test_chapter1_v13_raw_colour_coupling_audit.py

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw-colour/{trait,isolation,canonical,all-data}
          gh run download "$TRAIT_RUN_ID" -n "$TRAIT_ARTIFACT" -D /tmp/raw-colour/trait
          gh run download "$ISOLATION_RUN_ID" -n "$ISOLATION_ARTIFACT" -D /tmp/raw-colour/isolation
          gh run download "$CANONICAL_RUN_ID" -n "$CANONICAL_ARTIFACT" -D /tmp/raw-colour/canonical
          gh run download "$ALL_DATA_RUN_ID" -n "$ALL_DATA_ARTIFACT" -D /tmp/raw-colour/all-data
          test -s /tmp/raw-colour/trait/species_axis_coverage.csv.gz
          test -s /tmp/raw-colour/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/raw-colour/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/raw-colour/all-data/syndrome/all/island_syndrome_scores.csv.gz
          test -s /tmp/raw-colour/all-data/syndrome/direct/island_syndrome_scores.csv.gz

      - name: Run raw colours and raw colour-by-architecture audits
        run: |
          set -euo pipefail
          for scope in all direct; do
            mkdir -p /tmp/raw-colour/results/$scope/colour
            mkdir -p /tmp/raw-colour/results/$scope/architecture
            mkdir -p /tmp/raw-colour/results/$scope/coupling
            python -m island_v2.chapter1_v13_raw_colour_audit \
              --species-axis-csv /tmp/raw-colour/trait/species_axis_coverage.csv.gz \
              --status-flora-csv /tmp/raw-colour/canonical/input/chapter1_status_flora.csv.gz \
              --island-scores-csv /tmp/raw-colour/all-data/syndrome/$scope/island_syndrome_scores.csv.gz \
              --covariates-csv /tmp/raw-colour/isolation/results/purpose_shortest_island_data.csv \
              --pattern-config-path config/chapter1_all_data_biogeographic_pattern.yml \
              --evidence-scope $scope \
              --stratum all_observed \
              --output-dir /tmp/raw-colour/results/$scope/colour
            python -m island_v2.chapter1_v13_colour_architecture_audit \
              --species-axis-csv /tmp/raw-colour/trait/species_axis_coverage.csv.gz \
              --status-flora-csv /tmp/raw-colour/canonical/input/chapter1_status_flora.csv.gz \
              --island-scores-csv /tmp/raw-colour/all-data/syndrome/$scope/island_syndrome_scores.csv.gz \
              --covariates-csv /tmp/raw-colour/isolation/results/purpose_shortest_island_data.csv \
              --pattern-config-path config/chapter1_all_data_biogeographic_pattern.yml \
              --evidence-scope $scope \
              --stratum all_observed \
              --output-dir /tmp/raw-colour/results/$scope/architecture
            python -m island_v2.chapter1_v13_raw_colour_coupling_audit \
              --species-axis-csv /tmp/raw-colour/trait/species_axis_coverage.csv.gz \
              --status-flora-csv /tmp/raw-colour/canonical/input/chapter1_status_flora.csv.gz \
              --island-scores-csv /tmp/raw-colour/all-data/syndrome/$scope/island_syndrome_scores.csv.gz \
              --covariates-csv /tmp/raw-colour/isolation/results/purpose_shortest_island_data.csv \
              --pattern-config-path config/chapter1_all_data_biogeographic_pattern.yml \
              --evidence-scope $scope \
              --stratum all_observed \
              --output-dir /tmp/raw-colour/results/$scope/coupling
          done

      - name: Summarize raw-colour result
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/raw-colour/results')
          lines = ['# Chapter 1 v13 raw flower-colour audit', '']
          for scope in ('all', 'direct'):
              models = pd.read_csv(root / scope / 'colour' / 'raw_colour_model_results.csv')
              focus = models.loc[
                  models['status'].eq('fit')
                  & models['support_tier'].eq('confirmatory')
                  & models['model'].eq('conditional_selfing')
              ].copy()
              lines += [f'## {scope}', '', 'Conditional on selfing_core:', '', '```text']
              cols = ['context','colour','n_unique_islands','distance_estimate','distance_p','distance_q']
              lines.append(focus[cols].to_string(index=False))
              lines += ['```', '']
              omnibus = pd.read_csv(root / scope / 'colour' / 'raw_colour_joint_omnibus.csv')
              omnibus = omnibus.loc[
                  omnibus['status'].eq('fit')
                  & omnibus['support_tier'].eq('confirmatory')
                  & omnibus['model'].eq('conditional_selfing')
              ]
              lines += ['Five-colour joint Wald:', '', '```text']
              lines.append(omnibus[['context','n_unique_islands','wald_chisq','df','p_value','distance_slopes']].to_string(index=False))
              lines += ['```', '']

              pairs = pd.read_csv(
                  root / scope / 'architecture' / 'raw_colour_architecture_model_results.csv'
              )
              pairs = pairs.loc[
                  pairs['status'].eq('fit')
                  & pairs['support_tier'].eq('confirmatory')
                  & pairs['model'].eq('conditional_selfing')
              ].copy()
              supported = pairs.loc[pairs['distance_q'].lt(0.05)].copy()
              lines += ['Raw colour × raw form joint-prevalence pairs with q < 0.05:', '', '```text']
              show = ['context','combination','n_unique_islands','distance_estimate','distance_p','distance_q']
              lines.append(supported[show].to_string(index=False) if not supported.empty else 'none')
              lines += ['```', '']

              coupling = pd.read_csv(
                  root / scope / 'coupling' / 'raw_colour_conditioned_architecture_model_results.csv'
              )
              coupling = coupling.loc[
                  coupling['status'].eq('fit')
                  & coupling['support_tier'].eq('confirmatory')
                  & coupling['model'].eq('conditional_selfing')
              ].copy()
              coupling_supported = coupling.loc[coupling['distance_q'].lt(0.05)].copy()
              lines += [
                  'Raw architecture | raw colour coupling with q < 0.05:',
                  '',
                  '```text',
              ]
              cshow = [
                  'context','combination','trait_name','n_unique_islands',
                  'distance_estimate','distance_p','distance_q'
              ]
              lines.append(
                  coupling_supported[cshow].to_string(index=False)
                  if not coupling_supported.empty else 'none'
              )
              lines += ['```', '']

          Path('/tmp/raw-colour/summary.md').write_text('\n'.join(lines) + '\n')
          PY
          cat /tmp/raw-colour/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chapter1-v13-raw-colour-audit-${{ github.run_id }}
          path: |
            /tmp/raw-colour/results
            /tmp/raw-colour/summary.md
          if-no-files-found: error
          retention-days: 30
