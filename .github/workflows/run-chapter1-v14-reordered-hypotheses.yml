name: Run Chapter 1 v14 reordered hypotheses

on:
  push:
    branches:
      - "feature/chapter1-v14-reordered-hypotheses"
  pull_request:
    paths:
      - "config/chapter1_v14_hypothesis_architecture.yml"
      - "config/chapter1_v14_all_data_probability.yml"
      - "config/chapter1_v14_h2_decomposition.yml"
      - "src/island_v2/chapter1_v14_h2_decomposition.py"
      - "tests/test_chapter1_v14_h2_decomposition.py"
      - "tests/test_chapter1_v14_contract.py"
      - ".github/workflows/run-chapter1-v14-reordered-hypotheses.yml"
      - "docs/chapter1_v14_hypothesis_reorder_20260918.md"
      - "docs/chapter1_v14_preflight_results_20260918.md"
      - "docs/PAPER_PIPELINE.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter1-v14-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
      ALL_DATA_RUN_ID: "35100991898"
      ALL_DATA_ARTIFACT: "chapter1-all-data-primary-35100991898"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and validate v14 code
        run: |
          pip install -e ".[dev]"
          pytest -q \
            tests/test_chapter1_all_data_probability.py \
            tests/test_chapter1_v14_h2_decomposition.py \
            tests/test_chapter1_v14_contract.py
          ruff check \
            src/island_v2/chapter1_v14_h2_decomposition.py \
            tests/test_chapter1_v14_h2_decomposition.py \
            tests/test_chapter1_v14_contract.py

      - name: Download frozen v13-era inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/v14/source /tmp/v14/all-data
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/v14/source
          gh run download "$ALL_DATA_RUN_ID" -n "$ALL_DATA_ARTIFACT" -D /tmp/v14/all-data
          test -s /tmp/v14/source/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/v14/source/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/v14/source/snapshot/chapter1_trait_state_audit_all.csv.gz
          test -s /tmp/v14/source/snapshot/chapter1_trait_state_audit_direct.csv.gz
          test -s /tmp/v14/all-data/syndrome/all/island_syndrome_scores.csv.gz
          test -s /tmp/v14/all-data/syndrome/direct/island_syndrome_scores.csv.gz

      - name: Refit H1 with seven atomic responses
        run: |
          set -euo pipefail
          for scope in all direct; do
            if [ "$scope" = "all" ]; then
              audit=/tmp/v14/source/snapshot/chapter1_trait_state_audit_all.csv.gz
              evidence=all_analysis_eligible
            else
              audit=/tmp/v14/source/snapshot/chapter1_trait_state_audit_direct.csv.gz
              evidence=direct_only
            fi
            mkdir -p /tmp/v14/results/$scope/h1
            python -m island_v2.chapter1_all_data_probability \
              --status-flora-csv /tmp/v14/source/fixed/canonical/input/chapter1_status_flora.csv.gz \
              --state-audit-csv "$audit" \
              --covariates-csv /tmp/v14/source/fixed/isolation/results/purpose_shortest_island_data.csv \
              --config-path config/chapter1_v14_all_data_probability.yml \
              --evidence-scope "$evidence" \
              --output-dir /tmp/v14/results/$scope/h1
          done

      - name: Run H2 selfing-versus-floral decomposition
        run: |
          set -euo pipefail
          for scope in all direct; do
            if [ "$scope" = "all" ]; then
              evidence=all_analysis_eligible
            else
              evidence=direct_only
            fi
            mkdir -p /tmp/v14/results/$scope/h2
            python -m island_v2.chapter1_v14_h2_decomposition \
              --counts-csv /tmp/v14/results/$scope/h1/all_data_probability_counts.csv.gz \
              --syndrome-scores-csv /tmp/v14/all-data/syndrome/$scope/island_syndrome_scores.csv.gz \
              --covariates-csv /tmp/v14/source/fixed/isolation/results/purpose_shortest_island_data.csv \
              --config-path config/chapter1_v14_h2_decomposition.yml \
              --evidence-scope "$evidence" \
              --output-dir /tmp/v14/results/$scope/h2
          done

      - name: Assemble v14 result summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          import yaml

          root = Path("/tmp/v14/results")
          config = yaml.safe_load(Path("config/chapter1_v14_all_data_probability.yml").read_text())
          families = config["response_families"]
          lines = ["# Chapter 1 v14 reordered-hypothesis refit", ""]
          result = {"contract": "chapter1_v14_reordered_hypotheses_result_v1", "scopes": {}}

          for scope in ("all", "direct"):
              slopes = pd.read_csv(root / scope / "h1" / "beta_binomial_within_slopes.csv")
              omnibus = pd.read_csv(root / scope / "h1" / "beta_binomial_within_omnibus.csv")
              h2 = pd.read_csv(root / scope / "h2" / "h2_decomposition_models.csv")
              h2_summary = json.loads(
                  (root / scope / "h2" / "h2_decomposition_summary.json").read_text()
              )
              s = slopes.loc[slopes["stratum"].eq("all_observed")].copy()
              o = omnibus.loc[omnibus["stratum"].eq("all_observed")].copy()
              family_rows = []
              for context in config["contexts"]:
                  part = s.loc[s["context"].eq(context)]
                  for family, members in families.items():
                      vals = part.loc[part["outcome"].isin(members), "geography_slope_log_odds"]
                      family_rows.append(
                          {
                              "context": context,
                              "family": family,
                              "mean_slope": float(vals.mean()) if len(vals) else None,
                              "n_atomic": int(len(vals)),
                          }
                      )
              family = pd.DataFrame(family_rows)
              orientation = (
                  family.groupby("context", as_index=False)["mean_slope"]
                  .mean()
                  .rename(columns={"mean_slope": "equal_domain_orientation"})
              )
              result["scopes"][scope] = {
                  "H1_all_observed_omnibus": json.loads(o.to_json(orient="records")),
                  "H1_family_means": json.loads(family.to_json(orient="records")),
                  "H1_equal_domain_orientation": json.loads(
                      orientation.to_json(orient="records")
                  ),
                  "H2_summary": h2_summary,
                  "H2_models": json.loads(h2.to_json(orient="records")),
              }

              lines += [f"## {scope}", "", "### H1 seven-response omnibus", "", "CSV:"]
              lines.append(
                  o[
                      [
                          "context",
                          "n_retained_outcomes",
                          "retained_outcomes",
                          "joint_wald_chisq",
                          "joint_df",
                          "p_value",
                          "q_value",
                          "vector_supported",
                      ]
                  ].to_csv(index=False).strip()
              )
              lines += ["", "### H1 three-domain descriptive means", "", "CSV:"]
              lines.append(family.to_csv(index=False).strip())
              lines += ["", "### H1 equal-domain descriptive orientation", "", "CSV:"]
              lines.append(orientation.to_csv(index=False).strip())
              lines += ["", "### H2 conditional decomposition", "", "CSV:"]
              show = [
                  "context",
                  "response",
                  "analysis_role",
                  "model_family",
                  "n_islands",
                  "distance_estimate",
                  "distance_p",
                  "primary_H2b_q",
              ]
              lines.append(h2[show].to_csv(index=False).strip())
              lines += [""]

          Path("/tmp/v14/results/chapter1_v14_result_summary.json").write_text(
              json.dumps(result, indent=2, allow_nan=False) + "\n"
          )
          Path("/tmp/v14/results/RESULT_SUMMARY.md").write_text("\n".join(lines) + "\n")
          PY
          cat /tmp/v14/results/RESULT_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-v14-reordered-hypotheses-${{ github.run_id }}
          path: /tmp/v14/results
          if-no-files-found: error
          retention-days: 30
