name: Run Chapter 1 WCVP regional-native compatibility

on:
  push:
    branches: [ch1-all-data-primary]
    paths:
      - "scripts/export_wcvp_native_ranges.py"
      - "src/island_v2/chapter1_wcvp_native_compatibility.py"
      - "tests/test_chapter1_wcvp_native_compatibility.py"
      - ".github/workflows/run-chapter1-wcvp-native-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
      STATUS_RUN_ID: "32559322028"
      STATUS_ARTIFACT: "official-wcvp-corroborated-status-32559322028"
      WCVP_SHA256: "d32ea2b3a85e489b14e83bcc9eae7274532e1d113753f7be290d4b2dfde573fa"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate regional-native sensitivity
        run: |
          pytest -q tests/test_chapter1_wcvp_native_compatibility.py tests/test_chapter1_all_data_probability.py
          ruff check scripts/export_wcvp_native_ranges.py src/island_v2/chapter1_wcvp_native_compatibility.py tests/test_chapter1_wcvp_native_compatibility.py
      - name: Download frozen Chapter 1 and status inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-wcvp/primary /tmp/ch1-wcvp/status
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/ch1-wcvp/primary
          gh run download "$STATUS_RUN_ID" -n "$STATUS_ARTIFACT" -D /tmp/ch1-wcvp/status
          test -s /tmp/ch1-wcvp/primary/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/ch1-wcvp/primary/fixed/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/ch1-wcvp/status/resolved/island_tdwg_l3_mapping.csv
      - name: Re-materialize hash-pinned WCVP native ranges
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://sftp.kew.org/pub/data-repositories/WCVP/wcvp.zip -o /tmp/ch1-wcvp/wcvp.zip
          observed=$(sha256sum /tmp/ch1-wcvp/wcvp.zip | awk '{print $1}')
          test "$observed" = "$WCVP_SHA256"
          python scripts/export_wcvp_native_ranges.py \
            data/v2/staging/gbif/collected/island_taxa.csv \
            /tmp/ch1-wcvp/wcvp.zip \
            /tmp/ch1-wcvp/ranges
          test -s /tmp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz
      - name: Run all-analysis regional-native sensitivity
        run: |
          python -m island_v2.chapter1_wcvp_native_compatibility \
            --status-flora-csv /tmp/ch1-wcvp/primary/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-wcvp/primary/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv /tmp/ch1-wcvp/primary/fixed/isolation/results/purpose_shortest_island_data.csv \
            --wcvp-ranges-csv /tmp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz \
            --island-tdwg-csv /tmp/ch1-wcvp/status/resolved/island_tdwg_l3_mapping.csv \
            --config-path config/chapter1_all_data_probability.yml \
            --evidence-scope all_analysis_eligible \
            --output-dir /tmp/results/all
      - name: Run direct regional-native sensitivity
        run: |
          python -m island_v2.chapter1_wcvp_native_compatibility \
            --status-flora-csv /tmp/ch1-wcvp/primary/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-wcvp/primary/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv /tmp/ch1-wcvp/primary/fixed/isolation/results/purpose_shortest_island_data.csv \
            --wcvp-ranges-csv /tmp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz \
            --island-tdwg-csv /tmp/ch1-wcvp/status/resolved/island_tdwg_l3_mapping.csv \
            --config-path config/chapter1_all_data_probability.yml \
            --evidence-scope direct_only \
            --output-dir /tmp/results/direct
      - name: Write summary
        run: |
          cat /tmp/results/all/regional_native_coverage.csv >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/results/all/regional_native_between_omnibus.csv >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/results/direct/regional_native_coverage.csv >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/results/direct/regional_native_between_omnibus.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-wcvp-native-compatibility-${{ github.run_id }}
          path: |
            /tmp/results
            /tmp/ch1-wcvp/ranges/wcvp_native_range_manifest.json
          if-no-files-found: error
          retention-days: 30
