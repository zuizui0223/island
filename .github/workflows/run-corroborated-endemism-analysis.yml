name: Run corroborated endemism and endemic-trait support

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Download corrected status, direct traits, and covariates
        run: |
          mkdir -p /tmp/status /tmp/traits /tmp/isolation
          gh run download 32559322028 \
            -n official-wcvp-corroborated-status-32559322028 \
            -D /tmp/status
          gh run download 32551742699 \
            -n reviewed-open-web-evidence-32551742699 \
            -D /tmp/traits
          gh run download 29228212586 \
            -n purpose-shortest-distance-regime-29228212586 \
            -D /tmp/isolation
          test -s /tmp/status/resolved/resolved_floristic_status_ledger.csv.gz
          test -s /tmp/traits/direct_species_trait_ledger.csv.gz
          test -s /tmp/isolation/results/purpose_shortest_island_data.csv

      - name: Build corrected status counts and direct support
        run: |
          python -m island_v2.flora_status_support \
            --island-species-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --status-ledger-csv /tmp/status/resolved/resolved_floristic_status_ledger.csv.gz \
            --direct-evidence-csv /tmp/traits/direct_species_trait_ledger.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --config-path config/flora_status_support.yml \
            --output-dir /tmp/support
          test -s /tmp/support/status_counts_by_island.csv.gz

      - name: Fit Isolation to endemism
        run: |
          python -m island_v2.flora_endemism_analysis \
            --endemism-input-csv /tmp/support/status_counts_by_island.csv.gz \
            --config-path config/flora_endemism_analysis.yml \
            --output-dir /tmp/endemism
          test -s /tmp/endemism/endemism_coefficients.csv

      - name: Run endemism-resolution sensitivity
        run: |
          python -m island_v2.flora_endemism_resolution_sensitivity \
            --endemism-input-csv /tmp/support/status_counts_by_island.csv.gz \
            --config-path config/flora_endemism_analysis.yml \
            --output-dir /tmp/endemism-sensitivity
          test -s /tmp/endemism-sensitivity/endemism_resolution_isolation_coefficients.csv

      - name: Separate status ceilings from trait gaps
        run: |
          python -m island_v2.flora_status_support_decision \
            --support-summary-csv /tmp/support/direct_trait_support_summary.csv \
            --island-support-csv /tmp/support/direct_trait_support_by_island.csv.gz \
            --output-dir /tmp/decision

      - name: Rank endemic-only acquisition targets
        run: |
          python -m island_v2.endemic_trait_support_targets \
            --status-ledger-csv /tmp/status/resolved/resolved_floristic_status_ledger.csv.gz \
            --direct-evidence-csv /tmp/traits/direct_species_trait_ledger.csv.gz \
            --island-taxa-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --output-dir /tmp/targets
          test -s /tmp/targets/endemic_trait_support_decisions.csv

      - name: Summarize key result
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          endemism = pd.read_csv('/tmp/endemism/endemism_coefficients.csv')
          endo_iso = endemism[endemism['predictor'].eq('log_distance_to_continent_km')].copy()
          sensitivity = pd.read_csv('/tmp/endemism-sensitivity/endemism_resolution_isolation_coefficients.csv')
          decisions = pd.read_csv('/tmp/targets/endemic_trait_support_decisions.csv')
          targets = pd.read_csv('/tmp/targets/endemic_trait_acquisition_targets.csv')
          key_targets = targets.loc[targets['priority_rank'].le(25)].copy() if len(targets) else targets
          payload = {
              'contract': 'corroborated_endemism_support_checkpoint_v1',
              'status_run': 32559322028,
              'trait_run': 32551742699,
              'covariate_run': 29228212586,
              'endemism_isolation': endo_iso.to_dict('records'),
              'endemic_trait_decisions': decisions.to_dict('records'),
              'top_target_rows': key_targets.to_dict('records'),
          }
          Path('/tmp/corroborated_endemism_checkpoint.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8'
          )
          print('ISOLATION -> ENDEMISM')
          print(endo_iso[['regime','estimate_log_odds','cluster_robust_se','z_value','nominally_supported']].to_string(index=False))
          print('\nENDEMIC TRAIT DECISIONS')
          print(decisions.to_string(index=False))
          print('\nRESOLUTION SENSITIVITY')
          print(sensitivity[sensitivity['predictor'].eq('log_distance_to_continent_km')][
              ['minimum_endemism_resolution_fraction','regime','estimate_log_odds','z_value','nominally_supported']
          ].to_string(index=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: corroborated-endemism-support-${{ github.run_id }}
          path: |
            /tmp/corroborated_endemism_checkpoint.json
            /tmp/support/flora_status_support_manifest.json
            /tmp/support/status_counts_by_island.csv.gz
            /tmp/support/direct_trait_support_by_island.csv.gz
            /tmp/support/direct_trait_support_summary.csv
            /tmp/endemism/endemism_analysis_manifest.json
            /tmp/endemism/endemism_coefficients.csv
            /tmp/endemism/endemism_support.csv
            /tmp/endemism-sensitivity/endemism_resolution_sensitivity_manifest.json
            /tmp/endemism-sensitivity/endemism_resolution_isolation_coefficients.csv
            /tmp/decision/support_decisions.csv
            /tmp/decision/direct_species_threshold_robustness.csv
            /tmp/targets/endemic_trait_support_decisions.csv
            /tmp/targets/endemic_unsupported_islands.csv
            /tmp/targets/endemic_trait_acquisition_targets.csv
            /tmp/targets/endemic_trait_target_manifest.json
          if-no-files-found: error
          retention-days: 90
