name: run_direct_expanded_trait_pilot

on:
  pull_request:
    paths:
      - ".github/workflows/run-direct-expanded-trait-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: direct-expanded-trait-pilot-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.freeze.outputs.shards }}
      shard_count: ${{ steps.freeze.outputs.shard_count }}
      expected_species: ${{ steps.freeze.outputs.expected_species }}
      batch_size: ${{ steps.freeze.outputs.batch_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - id: freeze
        name: Select direct pilot species from repository data
        run: |
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          import pandas as pd

          master_path = Path('data/v2/staging/gbif/collected/island_taxa.csv')
          candidate_path = Path('data/v2/staging/traits/global_campaign/machine_candidate_index.csv.gz')
          master = pd.read_csv(master_path, dtype=str).fillna('')
          candidates = pd.read_csv(candidate_path, dtype=str).fillna('')

          species_col = next((c for c in ('accepted_species', 'species') if c in candidates.columns), None)
          trait_col = next((c for c in ('trait_name', 'trait', 'field') if c in candidates.columns), None)
          if species_col is None:
              raise SystemExit(f'candidate index lacks species column: {list(candidates.columns)}')

          target_traits = {
              'flower_primary_color', 'flower_color', 'floral_form', 'flower_shape',
              'floral_symmetry', 'tube_depth_class', 'flower_size_class',
              'inflorescence_display', 'self_incompatibility',
              'autonomous_selfing_capacity', 'mating_system', 'cleistogamy'
          }
          selected = candidates.copy()
          if trait_col is not None:
              selected = selected.loc[selected[trait_col].isin(target_traits)].copy()
          selected[species_col] = selected[species_col].astype(str).str.strip()
          species = sorted(set(selected[species_col]) - {''})[:300]
          if not species:
              species = sorted(set(master['accepted_species'].astype(str).str.strip()) - {''})[:300]

          targeted = master.loc[master['accepted_species'].isin(species)].drop_duplicates('accepted_species').copy()
          if targeted.empty:
              raise SystemExit('no pilot species matched island master')

          out = Path('/tmp/direct-pilot')
          out.mkdir(parents=True, exist_ok=True)
          targeted.to_csv(out / 'targeted_master.csv.gz', index=False)
          n = len(targeted)
          shard_count = min(16, n)
          batch_size = min(100, math.ceil(n / shard_count))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              print('shards=' + json.dumps(list(range(shard_count))), file=fh)
              print(f'shard_count={shard_count}', file=fh)
              print(f'expected_species={n}', file=fh)
              print(f'batch_size={batch_size}', file=fh)
          print(json.dumps({'target_species': n, 'shards': shard_count, 'batch_size': batch_size}, indent=2))
          PY
      - name: Build direct pilot plan and web index
        run: |
          set -euo pipefail
          island-v2-web-trait-shards plan \
            --master-csv /tmp/direct-pilot/targeted_master.csv.gz \
            --scope-config-path config/angiosperm_scope.yml \
            --output-dir /tmp/direct-pilot/plan \
            --shard-count '${{ steps.freeze.outputs.shard_count }}' \
            --expected-species '${{ steps.freeze.outputs.expected_species }}'
          if ! island-v2-v1-category-search build-web-index \
            --output-json /tmp/direct-pilot/plan/web_description_index.json; then
            test -s /tmp/direct-pilot/plan/web_description_index.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: direct-expanded-trait-pilot-input-${{ github.run_id }}
          path: /tmp/direct-pilot/
          if-no-files-found: error
          retention-days: 90

  acquire:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CAMPAIGN_DIR: /tmp/direct-expanded-trait-pilot/shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: direct-expanded-trait-pilot-input-${{ github.run_id }}
          path: /tmp/direct-pilot
      - run: pip install -e ".[dev]"
      - name: Query expanded real providers
        run: |
          set -euo pipefail
          mkdir -p "$CAMPAIGN_DIR"
          island-v2-web-trait-shards run \
            --master-csv /tmp/direct-pilot/targeted_master.csv.gz \
            --scope-config-path config/angiosperm_scope.yml \
            --campaign-dir "$CAMPAIGN_DIR" \
            --candidate-csv data/v2/staging/traits/global_campaign/machine_candidate_index.csv.gz \
            --shard-index '${{ matrix.shard }}' \
            --shard-count '${{ needs.prepare.outputs.shard_count }}' \
            --batch-size '${{ needs.prepare.outputs.batch_size }}' \
            --max-attempts 3 \
            --expected-species '${{ needs.prepare.outputs.expected_species }}' \
            --web-description-index /tmp/direct-pilot/plan/web_description_index.json \
            --pause-seconds 1.0 \
            --europe-pmc \
            --openalex \
            --world-flora \
            --migrate-v4
      - name: Normalize evidence
        run: |
          python -m island_v2.real_acquisition_ledger \
            --campaign-root "$CAMPAIGN_DIR" \
            --output-dir "$CAMPAIGN_DIR/ledger"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-expanded-trait-pilot-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ env.CAMPAIGN_DIR }}/campaign_status.json
            ${{ env.CAMPAIGN_DIR }}/checkpoint.csv
            ${{ env.CAMPAIGN_DIR }}/provider_checkpoint.csv
            ${{ env.CAMPAIGN_DIR }}/cumulative/
            ${{ env.CAMPAIGN_DIR }}/ledger/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: acquire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: direct-expanded-trait-pilot-shard-*
          path: /tmp/results
      - name: Aggregate pilot evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          files = list(Path('/tmp/results').glob('**/ledger/all_master_evidence.csv.gz'))
          if not files:
              raise SystemExit('no direct pilot evidence ledgers found')
          evidence = pd.concat([pd.read_csv(p, dtype=str).fillna('') for p in files], ignore_index=True).drop_duplicates()
          out = Path('/tmp/final')
          out.mkdir(parents=True, exist_ok=True)
          evidence.to_csv(out / 'direct_expanded_trait_pilot_evidence.csv.gz', index=False)
          summary = {
              'contract': 'direct_expanded_trait_pilot_v1',
              'shards': len(files),
              'records': int(len(evidence)),
              'species_with_any_evidence': int(evidence['accepted_species'].nunique()) if len(evidence) else 0,
              'records_by_provider': evidence['provider'].replace('', 'unknown').value_counts().sort_index().astype(int).to_dict() if len(evidence) and 'provider' in evidence.columns else {},
              'records_by_trait': evidence['trait_name'].replace('', 'unknown').value_counts().sort_index().astype(int).to_dict() if len(evidence) and 'trait_name' in evidence.columns else {},
          }
          (out / 'direct_expanded_trait_pilot_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: direct-expanded-trait-pilot-final-${{ github.run_id }}
          path: /tmp/final/
          if-no-files-found: error
          retention-days: 90
