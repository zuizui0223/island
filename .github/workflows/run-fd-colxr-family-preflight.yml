name: fd strict CoL XR family candidacy and 928-island source matching audit
on:
  push:
    branches:
      - analysis/fd-discrete-functional-volume-20261113
    paths:
      - 'scripts/run_fd_colxr_family_preflight.py'
      - '.github/workflows/run-fd-colxr-family-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  taxonomy-positivity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      STAGE: /tmp/fd-colxr-family-preflight
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout original source-only island pipeline
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source and taxonomy runtime
        run: python -m pip install pandas numpy pytest
      - name: Checkout fd Draft exact family candidate verification and tests
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Verify syntax and taxonomy source admissibility logic
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_colxr_family_opportunity.py
          PYTHONPATH=work/fd/src python -m compileall -q \
            work/fd/src/fd/colxr_family_opportunity.py scripts/run_fd_colxr_family_preflight.py
          git -C work/fd rev-parse HEAD
      - name: Recover original protected 2234 Direct plant family-missing input
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/unpacked"
              unzip -q "$NESTED" -d "$STAGE/unpacked"
              LEDGER="$(find "$STAGE/unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER" && test -s "$LEDGER"
          ORIGINAL_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$LEDGER")")")")")"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Restore frozen alpha2 crosswalk from source taxonomy workflow
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/colxr"
          gh run download 34668274725 --repo zuizui0223/island \
            --name island-plant-database-2.0.0-alpha2-taxonomy-34668274725 \
            --dir "$STAGE/colxr"
          COLXR="$(find "$STAGE/colxr" -name 'taxonomy_crosswalk.csv.gz' -type f -print -quit)"
          test -n "$COLXR" && test -s "$COLXR"
          echo '079d9c27b0ca3aa51f0c7310f43ad4901b07a319d6063eab5a7d62b291bdd9e3  '"$COLXR" | sha256sum --check --strict
          echo "COLXR=$COLXR" >> "$GITHUB_ENV"
          echo "Source-pinned crosswalk candidates retrieved; none automatically promoted"
      - name: Check exact accepted original COL XR family mapping and source geography positivity
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_colxr_family_preflight.py \
            --original-root "$ORIGINAL_ROOT" --colxr-crosswalk "$COLXR" \
            --output "$STAGE/anonymous_colxr_family_source_opportunity.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"anonymous_colxr_family_source_opportunity.json"
          r=json.loads(p.read_text())
          assert r["original_source_support"]["n_original_eligible_islands"]==928
          assert r["mapping_quality"]["n_original_species"]==2234
          assert r["no_original_family_taxon_island_or_source_identity_exported"]
          assert r["no_fitted_family_effect_or_evolutionary_tree"]
          assert r["original_source_support"]["family_accepted_only_as_unreviewed_original_source_taxonomy_candidate"]
          assert all('"'+key+'"' not in p.read_text() for key in (
            "island_id","accepted_species","family","genus","entity_ID",
            "work_species","candidate_family","submitted_name","spatial_block"))
          print("Family mapping feasibility, not evolutionary selection, verified")
          PY
      - name: Upload ONLY anonymous family mapping/source opportunity summary
        uses: actions/upload-artifact@v4
        with:
          name: fd-colxr-family-availability-${{ github.run_id }}
          path: /tmp/fd-colxr-family-preflight/anonymous_colxr_family_source_opportunity.json
          if-no-files-found: error
          retention-days: 90
