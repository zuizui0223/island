name: fd original direct floristic source-breadth and genus turnover exact partition
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-direct-source-genus-accounting.yml, scripts/fd_direct_source_genus_accounting.py, tests/test_fd_direct_source_genus_accounting.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest
      - name: Test exact source native-vs-mainland genus turnover algebra and unchanged breadth matched originals
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_direct_source_genus_accounting.py tests/test_fd_direct_source_breadth_matched.py tests/test_fd_direct_three_stage_floristic_comparison.py
          python -m compileall -q scripts/fd_direct_source_genus_accounting.py scripts/fd_direct_source_breadth_matched.py scripts/fd_direct_three_stage_floristic_comparison.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Rebuild independently published geological source crosswalk
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Verify original same-cohort direct GIFT source floristic trait difference partition into four signed genus terms
        run: |
          set -euo pipefail
          python scripts/fd_direct_source_genus_accounting.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology "$STAGE/geography/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_fd_direct_genus_source_partition.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["STAGE"])/"anonymous_fd_direct_genus_source_partition.json").read_text())
          assert q["status"]=="ORIGINAL_4505_SOURCE_BREADTH_MATCHED_EXACT_GENUS_FLORISTIC_PARTITION"
          assert q["n_original_GIFT_botanical_island_floras"]==4505
          assert q["n_original_real_binary_source_trait_sectors"]==7
          assert q["n_original_typed_gift_native_mainland_region_entities"]==748
          assert sum(r["n_original_botanical_floras"] for r in q["original_4505_botanical_flora_source_region_census"])==4505
          assert len(q["original_real_genus_partition_direct_flora_differences"])==35
          assert q["claims"]["four_exact_signed_components_sum_to_observed_island_frequency_difference"]
          assert q["claims"]["actual_original_same_island_GIFT_listing_breadth_balance_preserved"]
          assert q["claims"]["no_genus_prediction_accuracy_fitted_as_primary_response"]
          print("Source Direct native-to-mainland difference EXACT signed genus turnover algebra validated")
          PY
      - name: Export only anonymous descriptive regional/profile aggregate
        uses: actions/upload-artifact@v4
        with:
          name: fd-direct-three-stage-floristic-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_fd_direct_genus_source_partition.json
          if-no-files-found: error
          retention-days: 30
