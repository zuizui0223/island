name: fd direct three-stage island native endemic introduced floral sector source contrasts
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-direct-three-stage-floristic-comparison.yml, scripts/fd_direct_three_stage_floristic_comparison.py, tests/test_fd_direct_three_stage_floristic_comparison.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest
      - name: Guard independent endemic native introduced status and direct same-genus source comparisons
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_direct_three_stage_floristic_comparison.py
          python -m compileall -q scripts/fd_direct_three_stage_floristic_comparison.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Rebuild independently published geological source crosswalk
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Original all-4505 separate candidate mainland, nonendemic, endemic and introduced Direct flora comparisons
        run: |
          set -euo pipefail
          python scripts/fd_direct_three_stage_floristic_comparison.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology "$STAGE/geography/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_fd_direct_three_stage_floristic.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["STAGE"])/"anonymous_fd_direct_three_stage_floristic.json").read_text())
          assert q["status"]=="ORIGINAL_DIRECT_THREE_STAGE_FLORAL_STATUS_SOURCE_COMPARISONS"
          assert q["n_original_botanical_island_floras"]==4505
          assert q["n_original_source_direct_sectors"]==7
          assert sum(x["n_original_botanical_floras"] for x in q["original_region_population"])==4505
          assert q["claims"]["native_endemic_label_requires_concordant_original_three_status_fields"]
          assert q["claims"]["strict_native_nonendemic_GIFT_source_shared_subset_separately_computed"]
          assert len(q["original_direct_three_stage_comparisons"])==(
              q["n_original_geographic_regimes_including_unresolved"]*7*5)
          assert q["claims"]["source_only_species_are_absent_from_recorded_full_flora_not_true_failed_arrivals"]
          assert q["claims"]["genus_invariant_zero_not_evidence_against_adaptive_evolution"]
          print("Original actual 4505 GIFT plant status and source morphology direct comparisons completed")
          PY
      - name: Export only anonymous descriptive regional/profile aggregate
        uses: actions/upload-artifact@v4
        with:
          name: fd-direct-three-stage-floristic-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_fd_direct_three_stage_floristic.json
          if-no-files-found: error
          retention-days: 30
