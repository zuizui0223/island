name: fd oceanic and continental endemic versus GIFT mainland congener photo original pilot
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_endemic_GIFT_mainland_photo_pilot.py
      - .github/workflows/run-fd-endemic-gift-mainland-photo-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-wcvp-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGE: /tmp/fd-original-wcvp-native
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original endemic to GIFT native mainland congener public-photo audit
        run: python -m pip install pandas numpy scipy pytest
      - name: Checkout unmerged fd analytical module and original tests
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Test immutable original source botanical genus matching independent of photo outcomes
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_oceanic_endemic_mainland_congener_photo.py work/fd/tests/test_oceanic_endemic_inat_photo_pilot.py
          python -m compileall -q work/fd/src/fd/oceanic_endemic_mainland_congener_photo.py scripts/run_fd_endemic_GIFT_mainland_photo_pilot.py
          git -C work/fd rev-parse HEAD
      - name: Restore original frozen Direct 2234 flora and GIFT candidate mainland sources
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Build independently published geological-origin source crosswalk inside protected workflow
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geology_private"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geology_private")'
          test -s "$STAGE/geology_private/island_origin_crosswalk.csv"
          test -s "$STAGE/geology_private/crosswalk_audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["STAGE"])/"geology_private/crosswalk_audit.json").read_text())
          assert a["target_gshhg"] >= 8264
          assert a["roeble_2024_geological_records"] >= 500
          assert a["geological_counts"]["continental"]>=150
          assert a["geological_counts"]["oceanic"]>=200
          assert a["interpretation_limit"] == "LGM-unconnected does not imply geologically oceanic"
          print("Audited independent Roeble/Zizka geology source counts only",a["geological_counts"])
          PY
      - name: Audit exact accepted island endemic and frozen GIFT native mainland source congener public photographs
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_endemic_GIFT_mainland_photo_pilot.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geology_private/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_island_endemic_mainland_photo_pilot.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"anonymous_island_endemic_mainland_photo_pilot.json"
          z=json.loads(p.read_text())
          assert z["status"]=="ORIGINAL_13_GENUS_MAINLAND_CONGENER_AND_ISLAND_ENDEMIC_PHOTO_PREFLIGHT"
          assert z["n_original_geologically_typed_islands"]==434
          assert z["n_frozen_endemic_to_GIFT_native_mainland_congener_pairs"]==26
          assert z["original_qualified_island_endemic_13_genus_source"]["n_selected_original_distinct_genera"]==13
          assert z["frozen_original_source_tips"]["n_original_same_genus_pairings"]==26
          assert z["frozen_original_source_tips"]["all_source_controls_are_independently_accepted_name_not_focal_island_species"]
          assert z["source_scope"]["GIFT_nearest_mainland_list_is_not_ancestral_population"]
          assert z["source_scope"]["source_photo_is_GLOBAL_not_confirmed_mainland_locality"]
          assert z["source_scope"]["endemic_photo_is_GLOBAL_not_confirmed_source_island_locality"]
          assert z["source_scope"]["no_original_photo_pixels_fetched"]
          assert z["source_scope"]["no_original_flower_colour_ROI_measured"]
          assert z["source_scope"]["no_botanical_endemic_source_or_public_taxon_identifiers_exported"]
          assert not any('"'+key+'"' in p.read_text() for key in (
              "accepted_species","island_id","entity_ID","work_species",
              "source_signature","spatial_block","source_genus","photo_id",
              "observation_id","latitude","longitude","inat_taxon_id",
              "photo_url","taxon_name","species","genus"))
          print("Original GIFT mainland candidate accepted congener photo availability audited")
          PY
      - name: Upload only anonymous island endemic and mainland candidate congener global photo opportunity
        uses: actions/upload-artifact@v4
        with:
          name: fd-endemic-mainland-GIFT-congener-photo-${{ github.run_id }}
          path: /tmp/fd-original-wcvp-native/anonymous_island_endemic_mainland_photo_pilot.json
          if-no-files-found: error
          retention-days: 90
