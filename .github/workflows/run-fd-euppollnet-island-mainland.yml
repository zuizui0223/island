name: fd same-plant European island vs actual mainland visit feasibility

on:
  push:
    branches:
      - analysis/fd-functional-guild-impact-20261113
    paths:
      - 'scripts/run_fd_euppollnet_island_mainland_preflight.py'
      - '.github/workflows/run-fd-euppollnet-island-mainland.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-mainland-positive:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      STAGE: /tmp/fd-island-mainland-v130
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: 'src:work/fd/src'
    steps:
      - name: Check out original historical GSHHG source methods
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact landmass geometry and unit-test dependencies
        run: |
          python -m pip install pandas numpy pytest pyyaml typer httpx "geopandas>=1.0" "shapely>=2" "pyogrio>=0.9"
      - name: Check out unmerged fd scientific analysis
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/pollinator-loss-functional-assembly-20261113
          path: work/fd
          persist-credentials: false
      - name: Check out verified corrected original European visits
        uses: actions/checkout@v4
        with:
          repository: joseblanuza/EuPPollNet
          ref: v1.3.0
          path: work/euppollnet
          persist-credentials: false
          lfs: false
      - name: Test strict matching and source evidence first
        run: |
          set -euo pipefail
          test "$(git hash-object work/euppollnet/Data/3_Final_data/Interaction_data.csv.gz)" = "6e639d4af81feee76eefa6804622f8b901c39feb"
          test "$(git hash-object work/euppollnet/Data/3_Final_data/Metadata.csv)" = "f9708e2f2b142ab2437a8be9d16e33aaefdef0ed"
          python -m pytest -q work/fd/tests/test_euppollnet_island_mainland.py
          python -m compileall -q scripts/run_fd_euppollnet_island_mainland_preflight.py work/fd/src/fd/euppollnet_island_mainland.py
      - name: Recover source-pinned original rights-protected fd Direct flora
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/unpacked"
              unzip -q "$NESTED" -d "$STAGE/unpacked"
              LEDGER="$(find "$STAGE/unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER" && test -s "$LEDGER"
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Reuse exact original island WKB-based source geometry
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/verified"
          gh run download 43162949729 --repo zuizui0223/island \
            --name fd-globi-revalidated-exact-gshhg-43162949729 \
            --dir "$STAGE/verified"
          GPKG="$(find "$STAGE/verified" -name 'original_gshhg_v237_h_candidate21_exact_shared_ids.gpkg' -type f -print -quit)"
          RECEIPT="$(find "$STAGE/verified" -name 'original_gshhg_geometry_receipt.json' -type f -print -quit)"
          test -n "$GPKG" && test -s "$GPKG"
          test -n "$RECEIPT" && test -s "$RECEIPT"
          echo "ORIGINAL_GPKG=$GPKG" >> "$GITHUB_ENV"
          echo "ORIGINAL_RECEIPT=$RECEIPT" >> "$GITHUB_ENV"
      - name: Independently verify actual continental landmass from original GSHHG
        run: |
          set -euo pipefail
          python scripts/run_fd_euppollnet_island_mainland_preflight.py \
            --euppollnet-interactions work/euppollnet/Data/3_Final_data/Interaction_data.csv.gz \
            --euppollnet-metadata work/euppollnet/Data/3_Final_data/Metadata.csv \
            --original-progressive-root "$ORIGINAL_ROOT" \
            --verified-gshhg-gpkg "$ORIGINAL_GPKG" \
            --verified-gshhg-receipt "$ORIGINAL_RECEIPT" \
            --source-cache "$STAGE/gshhg-original" \
            --output "$STAGE/anonymous_island_mainland_plant_study_year_coverage.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['STAGE'])/'anonymous_island_mainland_plant_study_year_coverage.json').read_text())
          assert r['original_928_fd_islands']==928
          assert r['original_full_interaction_rows']==623476
          assert r['original_flora_islands_exact_GSHHG_geometry']==927
          assert r['no_fake_mainland_from_island_record_absence'] is True
          assert r['actual_pollinator_replacement_measured'] is False
          assert r['original_plant_study_island_identity_never_released'] is True
          assert r['original_island_study_species_names_or_coordinates_exported'] is False
          s=json.dumps(r)
          assert all('"'+k+'"' not in s for k in ('island_id','Plant_accepted_name',
            'Pollinator_accepted_name','Network_id','Study_id','Latitude','Longitude',
            'accepted_species','study_id','plant'))
          print('Source-cited same-plant visit overlap feasibility, no invented mainland or shift')
          PY
      - name: Publish anonymous aggregate ONLY
        uses: actions/upload-artifact@v4
        with:
          name: fd-euppollnet-island-mainland-gate-${{ github.run_id }}
          path: /tmp/fd-island-mainland-v130/anonymous_island_mainland_plant_study_year_coverage.json
          if-no-files-found: error
          retention-days: 90
