name: fd original 928-island CoL candidate-family trait coverage and matched-genus test
on:
  push:
    branches:
      - analysis/fd-discrete-functional-volume-20261113
    paths:
      - 'scripts/run_fd_family_conditioned_rare_volume.py'
      - '.github/workflows/run-fd-family-conditioned-rare-volume.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-candidate-family:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      STAGE: /tmp/fd-colxr-family-volume
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen source Python analysis dependencies
        run: python -m pip install pandas numpy pytest
      - name: Checkout separate unmerged fd family-sensitive morphology research
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Test synthetic same family matching, different within-family genera and exact Shapley additivity
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q \
            work/fd/tests/test_colxr_family_opportunity.py \
            work/fd/tests/test_family_conditioned_rare_volume.py
          PYTHONPATH=work/fd/src python -m compileall -q \
            work/fd/src/fd/colxr_family_opportunity.py \
            work/fd/src/fd/family_conditioned_rare_volume.py \
            scripts/run_fd_family_conditioned_rare_volume.py
          git -C work/fd rev-parse HEAD
      - name: Recover frozen original protected Direct flora and source pools
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/unpacked"
              unzip -q "$NESTED" -d "$STAGE/unpacked"
              LEDGER="$(find "$STAGE/unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER" && test -s "$LEDGER"
          ORIGINAL_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$LEDGER")")")")")"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Recover original exact CoL XR alpha2 taxonomy candidate archive
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/colxr"
          gh run download 34668274725 --repo zuizui0223/island \
            --name island-plant-database-2.0.0-alpha2-taxonomy-34668274725 \
            --dir "$STAGE/colxr"
          COLXR="$(find "$STAGE/colxr" -name taxonomy_crosswalk.csv.gz -type f -print -quit)"
          test -n "$COLXR" && test -s "$COLXR"
          echo "079d9c27b0ca3aa51f0c7310f43ad4901b07a319d6063eab5a7d62b291bdd9e3  $COLXR" | sha256sum --check --strict
          echo "COLXR=$COLXR" >> "$GITHUB_ENV"
      - name: Run protected 928-island family Shapley and same family with different genera tests
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_family_conditioned_rare_volume.py \
            --original-progressive-root "$ORIGINAL_ROOT" \
            --colxr-crosswalk "$COLXR" \
            --rarefactions 40 --reference-null 399 \
            --output "$STAGE/anonymous_family_conditioned_source_flora_volume.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"anonymous_family_conditioned_source_flora_volume.json"
          r=json.loads(p.read_text())
          assert r["n_original_eligible_island_flora"]==928
          assert r["n_original_Direct_species"]==2234
          assert r["n_strict_candidate_family_species"]>=1900
          ascertain=r["original_source_family_mapping_ascertainment_by_global_profile_rarity"]
          assert sum(z["n_original_reference_profiles"] for z in ascertain.values())==100
          assert sum(z["n_original_species_carriers"] for z in ascertain.values())==2234
          assert sum(z["n_original_carriers_lacking_strict_family"] for z in ascertain.values())==44
          assert len(r["posthoc_paired_exact_family_identity_vs_family_count_panels"])>0
          assert sum(p["n_family_matched_islands"]>=10 for p in
                     r["same_family_island_mainland_matched_panels"])>=4
          assert all(p["n_blocks"]>=5 and p["n_first_GIFT_source_signatures"]>=5
                     for p in r["same_family_island_mainland_matched_panels"]
                     if p["reportable_under_10island_5block_5source_gate"])
          assert r["inference"]["family_labels_are_unreviewed_exact_accepted_COL_XR_candidates"]
          assert r["inference"]["equal_5_family_one_plant_each_source_and_island_primary"]
          assert r["inference"]["different_genus_condition_restricts_to_different_genus_in_same_family"]
          assert r["no_original_species_family_source_island_or_coordinates_exported"]
          assert not r["inference"]["not_causal_selection_or_phylogenetic_effect"] is False
          assert not any('"'+x+'"' in p.read_text() for x in (
            'island_id','accepted_species','family','genus','family_map',
            'work_species','entity_ID','source_signature','spatial_block',
            'longitude','latitude','candidate_family','submitted_name'))
          print("CoL original family conditional floral category support source-only and anonymous")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fd-colxr-family-matched-928-${{ github.run_id }}
          path: /tmp/fd-colxr-family-volume/anonymous_family_conditioned_source_flora_volume.json
          if-no-files-found: error
          retention-days: 90
