name: fd original FCP 4475 photo species overlap geologically typed island endemics
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_fcp_geological_endemic_overlap.py
      - .github/workflows/run-fd-fcp-island-endemic-photo-opportunity.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-wcvp-native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      STAGE: /tmp/fd-original-wcvp-native
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FCP 4475 photo species and original GIFT provenance auditors
        run: python -m pip install pandas numpy scipy pytest
      - name: Checkout unmerged fd analytical module and original tests
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Test original photographic registry vs protected endemic status guards
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_fcp_geological_endemic_opportunity.py
          python -m compileall -q work/fd/src/fd/fcp_geological_endemic_opportunity.py scripts/run_fd_fcp_geological_endemic_overlap.py
          git -C work/fd rev-parse HEAD
      - name: Restore original frozen Direct 2234 flora and GIFT candidate mainland sources
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Build independently published geological-origin source crosswalk inside protected workflow
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geology_private"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geology_private")'
          test -s "$STAGE/geology_private/island_origin_crosswalk.csv"
          test -s "$STAGE/geology_private/crosswalk_audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["STAGE"])/"geology_private/crosswalk_audit.json").read_text())
          assert a["target_gshhg"] >= 8264
          assert a["roeble_2024_geological_records"] >= 500
          assert a["geological_counts"]["continental"]>=150
          assert a["geological_counts"]["oceanic"]>=200
          assert a["interpretation_limit"] == "LGM-unconnected does not imply geologically oceanic"
          print("Audited independent Roeble/Zizka geology source counts only",a["geological_counts"])
          PY
      - name: Fetch original public 4475 species-wide FCP photo ledger with frozen checksum
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/zuizui0223/fcp/c45a95420a96abfb3fdb8e9ad1a37c75288c63fb/results/fcp_np_all4475_unified_species_ledger_20261021.csv' \
            --output "$STAGE/fcp_all4475_verified.csv"
          echo '23d3daadc9799c2e7b5867d54ccc1ed98369ba79a81b72dc7f831e5197e63c49  '"$STAGE/fcp_all4475_verified.csv" | sha256sum --check --strict
      - name: Audit measured FCP source taxa against independently typed original native endemic island floras
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_fcp_geological_endemic_overlap.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geology_private/island_origin_crosswalk.csv" \
            --fcp-ledger "$STAGE/fcp_all4475_verified.csv" \
            --output "$STAGE/anonymous_fcp_geological_endemic_overlap.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"anonymous_fcp_geological_endemic_overlap.json"
          d=json.loads(p.read_text())
          assert d["status"]=="SOURCE_VERIFIED_FCP_4475_GEOLOGY_ENDEMIC_PHOTOGRAPHIC_OPPORTUNITY"
          assert d["n_original_geologically_typed_islands"]==434
          assert d["n_FCP_species_original"]==4475
          assert d["n_FCP_original_photo_measurements"]==447500
          assert d["n_FCP_colour_classifiable_original"]==227107
          assert d["scope"]["FCP_species_wide_photo_colour_is_not_island_local_photo_trait"]
          assert d["scope"]["FCP_photo_colour_not_genetic_polymorphism_or_adaptive_selection"]
          assert len(d["original_regional_photo_opportunity"])>=16
          assert not any('"'+k+'"' in p.read_text() for k in (
              "island_id","accepted_species","endemic_status","origin_status",
              "floristic_status","entity_ID","work_species","spatial_block",
              "latitude","longitude","inat_taxon_id"))
          print("FCP 4475 photo species geological endemic phenotype-opportunity counts verified")
          PY
      - name: Upload only anonymous geological original FCP-photo species opportunity counts
        uses: actions/upload-artifact@v4
        with:
          name: fd-fcp-geological-endemic-overlap-${{ github.run_id }}
          path: /tmp/fd-original-wcvp-native/anonymous_fcp_geological_endemic_overlap.json
          if-no-files-found: error
          retention-days: 90
