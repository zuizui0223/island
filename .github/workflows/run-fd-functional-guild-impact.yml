name: fd source-conditioned floral FD and guild opportunity
on:
  push:
    branches:
      - analysis/fd-functional-guild-impact-20261113
    paths:
      - '.github/workflows/run-fd-functional-guild-impact.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verified-original:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STAGE: /tmp/fd-original-functional
    steps:
      - name: Check out pinned island original-source pipeline branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source analysis dependencies
        run: python -m pip install pandas numpy pytest
      - name: Check out fd's separate unmerged analysis branch
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/pollinator-loss-functional-assembly-20261113
          path: work/fd
          persist-credentials: false
      - name: Run exact fixed-margin diversity tests on synthetic data only
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_pollinator_functional_diversity.py work/fd/tests/test_reproductive_assurance_functional_diversity.py
          PYTHONPATH=work/fd/src python -m compileall -q work/fd/src/fd/pollinator_functional_diversity.py work/fd/scripts/run_pollinator_functional_diversity.py
          git -C work/fd rev-parse HEAD
      - name: Recover rights-restricted original progressive source from locked artifact
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/original-unpacked"
              unzip -q "$NESTED" -d "$STAGE/original-unpacked"
              LEDGER="$(find "$STAGE/original-unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER" && test -s "$LEDGER"
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          echo "Original rights-restricted species, source and island records recovered locally"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Reuse original independently qualified five-channel GBIF evidence
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/channels"
          gh run download 34750153702 --repo zuizui0223/island \
            --name chapter1-nee-channel-qualification-34750153702 \
            --dir "$STAGE/channels"
          CHANNEL_CSV="$(find "$STAGE/channels" -name nee_projected_channel_state.csv -type f -print -quit)"
          test -n "$CHANNEL_CSV" && test -s "$CHANNEL_CSV"
          echo "CHANNEL_CSV=$CHANNEL_CSV" >> "$GITHUB_ENV"
          echo "Original GBIF five-channel documentation recovered"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Evaluate fixed-size floral FD and source-qualified guild observation opportunity
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python work/fd/scripts/run_pollinator_functional_diversity.py \
            --progressive-root "$ORIGINAL_ROOT" \
            --qualified-channel-csv "$CHANNEL_CSV" \
            --rarefactions 30 \
            --output "$STAGE/floral_functional_guild_impact_aggregate.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"floral_functional_guild_impact_aggregate.json"
          r=json.loads(p.read_text())
          assert r["n_original_qualifying_islands"]==928
          assert len(r["support_by_guild_regime"])==20
          assert r["same_island_direct_native_status_sensitivity"]
          assert all(x["same_islands_and_fixed_30_species_each"] for x in r["same_island_direct_native_status_sensitivity"])
          assert r["raw_island_taxon_or_source_identifiers_exported"] is False
          assert r["real_local_visitor_shift_measured"] is False
          assert r["biological_guild_absence_from_unresolved"] is False
          assert not any(k in p.read_text() for k in ('accepted_species','island_id','work_species','entity_ID','reference_id'))
          print("Rights-safe source-qualified functional-diversity aggregate and null gate verified")
          PY
      - name: Evaluate Direct reproductive-assurance and paired floral joint FD
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python work/fd/scripts/run_reproductive_assurance_functional_diversity.py \
            --progressive-root "$ORIGINAL_ROOT" \
            --qualified-channel-csv "$CHANNEL_CSV" \
            --output "$STAGE/reproductive_assurance_functional_aggregate.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"reproductive_assurance_functional_aggregate.json"
          d=json.loads(p.read_text())
          assert d["n_original_direct_triple_flora_islands"]==928
          assert d["n_original_focal_Bombus_nondetection_bird_detection_candidates"]==21
          assert d["carrier_specific_support_min"]==20
          assert d["same_carrier_morphology_and_assurance_scoring"]
          assert d["unknown_reproductive_trait_is_not_state_zero"]
          assert d["no_actual_pollinator_loss_or_shift_measured"]
          assert d["no_species_island_or_source_level_data_exported"]
          assert d["same_island_native_vs_all_assurance_sensitivity"]
          assert isinstance(d["same_plant_carrier_SC_and_mating_system_source_control"],list)
          assert all(x["same_carrier_both_traits_and_same_source"] for x in d["same_plant_carrier_SC_and_mating_system_source_control"])
          assert any("source_equal_mean_delta_positive_share" in row for row in d["reproductive_assurance_functional_assemblage_by_region"])
          assert len(d["reproductive_assurance_functional_assemblage_by_region"])>0
          assert not any(k in p.read_text() for k in ('accepted_species','island_id','work_species','entity_ID','reference_id'))
          print("Rights-safe Direct reproductive-assurance functional traits verified")
          PY
      - name: Upload only anonymous original-source aggregate, never licensed rows
        uses: actions/upload-artifact@v4
        with:
          name: fd-functional-pollinator-guild-aggregate-${{ github.run_id }}
          path: |
            /tmp/fd-original-functional/floral_functional_guild_impact_aggregate.json
            /tmp/fd-original-functional/reproductive_assurance_functional_aggregate.json
          if-no-files-found: error
          retention-days: 90
