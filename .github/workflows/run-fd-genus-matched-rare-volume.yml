name: fd original same-genus matched categorical rare-volume 15-species
on:
  push:
    branches:
      - analysis/fd-discrete-functional-volume-20261113
    paths:
      - 'scripts/run_fd_genus_matched_rare_volume.py'
      - '.github/workflows/run-fd-genus-matched-rare-volume.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-genus-conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STAGE: /tmp/fd-original-genus-matched-rare
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Original protected island analysis branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install pandas numpy pytest
      - name: Checkout fd independent categorical reference module
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Test exact genus counts, source taxon disjointness, fixed 15 support
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_genus_matched_rare_volume.py
          python -m compileall -q work/fd/src/fd/genus_matched_rare_volume.py scripts/run_fd_genus_matched_rare_volume.py
          git -C work/fd rev-parse HEAD
      - name: Restore rights-protected original Direct and GIFT source checkpoint
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/unpacked"
              unzip -q "$NESTED" -d "$STAGE/unpacked"
              LEDGER="$(find "$STAGE/unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER" && test -s "$LEDGER"
          ORIGINAL_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$LEDGER")")")")")"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Compute matched source genera and distinct source species only
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_genus_matched_rare_volume.py \
            --progressive-root "$ORIGINAL_ROOT" \
            --repeats 40 --reference-null 399 \
            --output "$STAGE/anonymous_genus_matched_rare_15.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"anonymous_genus_matched_rare_15.json"
          d=json.loads(p.read_text())
          assert d["n_original_928_eligible_islands"]==928
          assert d["n_original_complete_Direct_reference_species"]==2234
          assert d["design"]["n_species_exact_per_island_and_mainland"]==15
          assert d["design"]["original_exact_local_plant_names_removed_from_all_candidate_sources"]
          assert d["design"]["identical_genus_counts_per_island_source_draw"]
          assert d["design"]["not_global_full_928_genus_conditional_null"]
          assert d["protected_taxon_species_island_genus_or_GIFT_entity_never_exported"]
          assert d["actual_pollinator_loss_or_evolution_not_measured"]
          assert all('"'+k+'"' not in p.read_text() for k in (
            'island_id','accepted_species','source_signature','spatial_block',
            'work_species','entity_ID','genus','family','species'))
          print("Original genus-conditional cohort and numerical results audited without identity leak")
          PY
      - name: Upload anonymous original Direct genus support and results only
        uses: actions/upload-artifact@v4
        with:
          name: fd-genus-matched-rare-15-${{ github.run_id }}
          path: /tmp/fd-original-genus-matched-rare/anonymous_genus_matched_rare_15.json
          if-no-files-found: error
          retention-days: 90
