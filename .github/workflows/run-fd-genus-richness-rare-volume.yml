name: fd original 928-island floral category source genus-richness normalization
on:
  push:
    branches:
      - analysis/fd-discrete-functional-volume-20261113
    paths:
      - 'scripts/run_fd_genus_richness_rare_volume.py'
      - '.github/workflows/run-fd-genus-richness-rare-volume.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genus-richness-controlled-original:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      STAGE: /tmp/fd-source-genus-richness
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Original island protected analysis
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install pandas numpy pytest
      - name: Check out fd separate original-phenotype source branch
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Check original profile bitmap and distinct-genus null controls
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_genus_richness_rare_volume.py
          python -m compileall -q work/fd/src/fd/genus_richness_rare_volume.py scripts/run_fd_genus_richness_rare_volume.py
          git -C work/fd rev-parse HEAD
      - name: Recover original source-restricted full Direct and native GIFT evidence
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/unpacked"
              unzip -q "$NESTED" -d "$STAGE/unpacked"
              LEDGER="$(find "$STAGE/unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER" && test -s "$LEDGER"
          ORIGINAL_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$LEDGER")")")")")"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Run 10/15 equal-distinct-genus unit island/source morphological support
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_genus_richness_rare_volume.py \
            --progressive-root "$ORIGINAL_ROOT" --repeats 40 --reference-null 399 \
            --output "$STAGE/anonymous_genus_richness_rare_volume.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['STAGE'])/'anonymous_genus_richness_rare_volume.json'
          d=json.loads(p.read_text())
          assert d["n_original_eligible_islands"]==928
          assert d["original_complete_Direct_species"]==2234
          assert d["original_global_profile_count"]==100
          assert d["design"]["one_different_accepted_plant_species_per_genus"]
          assert d["design"]["same_genus_number_but_genus_IDENTITY_NOT_matched"]
          assert d["design"]["all_local_accepted_species_names_excluded_from_candidate_sources"]
          assert d["no_original_source_genus_taxon_island_or_GIFT_name_exported"]
          assert d["no_actual_pollinator_loss_or_fitness_inferred"]
          assert all('"'+x+'"' not in p.read_text() for x in (
             'island_id','accepted_species','genus','family',
             'entity_ID','work_species','spatial_block','source_signature'))
          print("Equal genus-count original source rare category sensitivity completed")
          PY
      - name: Publish anonymized original regional and source support ONLY
        uses: actions/upload-artifact@v4
        with:
          name: fd-genus-richness-15-volume-928-${{ github.run_id }}
          path: /tmp/fd-source-genus-richness/anonymous_genus_richness_rare_volume.json
          if-no-files-found: error
          retention-days: 90
