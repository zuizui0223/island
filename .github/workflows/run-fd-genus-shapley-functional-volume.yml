name: fd source-original genus Shapley categorical-volume 928 islands
on:
  push:
    branches:
      - analysis/fd-discrete-functional-volume-20261113
    paths:
      - 'scripts/run_fd_genus_shapley_functional_volume.py'
      - '.github/workflows/run-fd-genus-shapley-functional-volume.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-taxonomic-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      STAGE: /tmp/fd-original-genus-shapley
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout protected original island source analysis
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install categorical numerical dependencies
        run: python -m pip install pandas numpy pytest
      - name: Checkout unmerged fd source-shapley analysis module
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Validate exact Shapley additivity, source disjointness and fixed genus controls
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_genus_shapley_functional_volume.py
          PYTHONPATH=work/fd/src python -m compileall -q work/fd/src/fd/genus_shapley_functional_volume.py scripts/run_fd_genus_shapley_functional_volume.py
          git -C work/fd rev-parse HEAD
      - name: Recover rights-restricted original Direct flora and native GIFT source
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/unpacked"
              unzip -q "$NESTED" -d "$STAGE/unpacked"
              LEDGER="$(find "$STAGE/unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER" && test -s "$LEDGER"
          ORIGINAL_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$LEDGER")")")")")"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Attribute original global rare-category profile coverage to shared versus unique genera
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_genus_shapley_functional_volume.py \
            --original-progressive-root "$ORIGINAL_ROOT" \
            --rarefactions 40 --reference-null-draws 399 \
            --seed 20261113 \
            --output "$STAGE/anonymous_genus_shapley_categorical_volume.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"anonymous_genus_shapley_categorical_volume.json"
          d=json.loads(p.read_text())
          assert d["n_original_eligible_Direct_islands"]==928
          assert d["n_original_reference_Direct_species"]==2234
          assert d["n_original_reference_triple_profiles"]==100
          assert d["method"]["exact_additive_shapley_coverage_proven"]
          assert d["n_original_island_scope_rows_decomposed"]>=700
          assert len(d["all_source_disjoint_flora_genus_shapley_regions"])>=4
          assert any(p["matched_distinct_genera_per_island"]==5 for p in d["restricted_distinct_genus_source_pairing_panels"])
          assert d["method"]["strict_same_plant_name_source_exclusion"]
          assert d["no_original_island_taxon_species_genus_source_identity_released"]
          assert not d["no_actual_pollinator_service_or_historical_decline_tested"] is False
          assert sum(d["reference_rarity_bins"].values())==100
          assert not any('"'+name+'"' in p.read_text() for name in (
             'island_id','accepted_species','work_species','entity_ID',
             'genus','family','source_signature','spatial_block','longitude','latitude'))
          print("Source-original taxonomic Shapley accounting verified; no protected identities released")
          PY
      - name: Upload ONLY anonymous region, block and source support aggregates
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-genus-shapley-928-${{ github.run_id }}
          path: /tmp/fd-original-genus-shapley/anonymous_genus_shapley_categorical_volume.json
          if-no-files-found: error
          retention-days: 90
