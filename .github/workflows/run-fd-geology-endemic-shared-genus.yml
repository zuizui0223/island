name: fd original oceanic continental same-genus endemic trait contrast
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_endemic_shared_genus_geology.py
      - .github/workflows/run-fd-geology-endemic-shared-genus.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-wcvp-native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: [20261114, 20261115]
    env:
      STAGE: /tmp/fd-original-wcvp-native
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      ANALYSIS_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install species-identity-deduplicated botanical genus shared source runtime
        run: python -m pip install pandas numpy scipy pytest
      - name: Checkout unmerged fd analytical module and original tests
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Validate original Direct trait provenance and cross-geology shared-genus power
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_geological_endemic_shared_genus.py work/fd/tests/test_geological_endemic_trait_divergence.py work/fd/tests/test_geological_endemic_trait_opportunity.py
          python -m compileall -q work/fd/src/fd/geological_endemic_shared_genus.py scripts/run_fd_endemic_shared_genus_geology.py
          git -C work/fd rev-parse HEAD
      - name: Restore original frozen Direct 2234 flora and GIFT candidate mainland sources
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Build independently published geological-origin source crosswalk inside protected workflow
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geology_private"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geology_private")'
          test -s "$STAGE/geology_private/island_origin_crosswalk.csv"
          test -s "$STAGE/geology_private/crosswalk_audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["STAGE"])/"geology_private/crosswalk_audit.json").read_text())
          assert a["target_gshhg"] >= 8264
          assert a["roeble_2024_geological_records"] >= 500
          assert a["geological_counts"]["continental"]>=150
          assert a["geological_counts"]["oceanic"]>=200
          assert a["interpretation_limit"] == "LGM-unconnected does not imply geologically oceanic"
          print("Audited independent Roeble/Zizka geology source counts only",a["geological_counts"])
          PY
      - name: Audit original source-qualified endemic floral phenotype differences among genuinely shared botanical genera
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_endemic_shared_genus_geology.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geology_private/island_origin_crosswalk.csv" \
            --seed "$ANALYSIS_SEED" \
            --output "$STAGE/anonymous_shared_genus_${ANALYSIS_SEED}.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["STAGE"])/("anonymous_shared_genus_"+os.environ["ANALYSIS_SEED"]+".json")
          z=json.loads(p.read_text())
          assert z["status"]=="ORIGINAL_GEOLOGICAL_ENDEMIC_SHARED_GENUS_SOURCE_PAIRING_AUDIT"
          assert z["original_geological_islands_with_valid_labels"]>=430
          assert z["n_original_distinct_endemic_source_qualified_trait_island_plant_rows"]>100
          assert z["method"]["accepted_plant_species_not_island_records_are_taxon_units"]
          assert z["method"]["same_accepted_species_in_both_geological_classes_excluded"]
          assert z["method"]["original_focal_trait_variation_required_for_effect_reporting"]
          trop=next((r for r in z["original_shared_genus_geological_comparisons"]
                     if r["region"]=="tropical"
                     and r["trait"]=="flower_primary_color"),None)
          assert trop is not None
          if trop["qualified_to_compare_source_endemic_discordance_within_shared_genera"]:
              sens=trop["descriptive_exact_genus_sign_and_loo_sensitivity"]
              assert sens["n_exact_sign_reassignments"]==2**trop[
                  "n_same_genus_shared_across_geological_types"]
              assert 0 <= sens["exact_two_sided_genus_label_sign_flip_p"] <= 1
              assert len(sens["leave_one_genus_out_effect_range"])==2
          assert z["method"]["no_privileged_botanical_taxa_or_island_IDs_exported"]
          assert len(z["original_shared_genus_geological_comparisons"])>=20
          assert not any('"'+term+'"' in p.read_text() for term in (
             "island_id","accepted_species","entity_ID","work_species",
             "source_signature","spatial_block","native_l3_codes",
             "source_family","source_genus","genus","family",
             "tip_label","latitude","longitude"))
          print("Original endemic species deduplication and shared-geological-genus analysis passed")
          PY
      - name: Upload only aggregate shared-genus tropical and midlatitude endemic trait source support
        uses: actions/upload-artifact@v4
        with:
          name: fd-geology-endemic-shared-genus-${{ matrix.seed }}-${{ github.run_id }}
          path: /tmp/fd-original-wcvp-native/anonymous_shared_genus_${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90
