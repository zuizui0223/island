name: fd oceanic continental single-trait original endemic evidence audit
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_endemic_singletrait_geology.py
      - .github/workflows/run-fd-geology-endemic-singletrait.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-wcvp-native:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      STAGE: /tmp/fd-original-wcvp-native
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original source Direct/endemic/geology audit runtime
        run: python -m pip install pandas numpy scipy pytest
      - name: Checkout unmerged fd analytical module and original tests
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Verify separate original endemism and 10 source-direct trait single-state integrity
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_geological_endemic_trait_opportunity.py
          python -m compileall -q work/fd/src/fd/geological_endemic_trait_opportunity.py scripts/run_fd_endemic_singletrait_geology.py
          git -C work/fd rev-parse HEAD
      - name: Restore original frozen Direct 2234 flora and GIFT candidate mainland sources
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Build independently published geological-origin source crosswalk inside protected workflow
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geology_private"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geology_private")'
          test -s "$STAGE/geology_private/island_origin_crosswalk.csv"
          test -s "$STAGE/geology_private/crosswalk_audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["STAGE"])/"geology_private/crosswalk_audit.json").read_text())
          assert a["target_gshhg"] >= 8264
          assert a["roeble_2024_geological_records"] >= 500
          assert a["geological_counts"]["continental"]>=150
          assert a["geological_counts"]["oceanic"]>=200
          assert a["interpretation_limit"] == "LGM-unconnected does not imply geologically oceanic"
          print("Audited independent Roeble/Zizka geology source counts only",a["geological_counts"])
          PY
      - name: Audit strict endemic and nonendemic Direct trait support on independently typed islands
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_endemic_singletrait_geology.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geology_private/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_geological_singletrait_endemic.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"anonymous_geological_singletrait_endemic.json"
          q=json.loads(p.read_text())
          assert q["status"]=="INDEPENDENT_GEOLOGICAL_ENDEMIC_FLORAL_DIRECT_SINGLE_TRAIT_SUPPORT"
          assert q["n_original_geological_typed_islands"]>=430
          assert q["n_geologically_typed_islands_with_source_flora"]>=300
          assert len(q["trait_names"])==10
          assert all(t in q["original_global_single_trait_Direct_species_counts"]
                     for t in q["trait_names"])
          assert len(q["strict_original_status_counts_by_region_geology_trait"])>=40
          assert q["measurement_only"] and q["no_actual_colonization_adaptive_selection_or_pollinator_loss_inferred"]
          assert q["no_single_taxon_names_island_source_IDs_or_study_coordinates_exported"]
          assert not any('"'+col+'"' in p.read_text() for col in (
              "island_id","accepted_species","origin_status","endemic_status",
              "floristic_status","entity_ID","work_species","spatial_block",
              "source_signature","family","genus","longitude","latitude"))
          print("ENDOMICITY SOURCE CORRECTED AND TRAITWISE ORIGINAL OPPORTUNITY VERIFIED")
          PY
      - name: Upload only anonymous geological endemic single-trait source opportunity counts
        uses: actions/upload-artifact@v4
        with:
          name: fd-geological-endemic-trait-audit-${{ github.run_id }}
          path: /tmp/fd-original-wcvp-native/anonymous_geological_singletrait_endemic.json
          if-no-files-found: error
          retention-days: 90
