name: fd oceanic continental endemic versus native congener trait discordance
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_endemic_trait_congener_divergence.py
      - .github/workflows/run-fd-geology-endemic-trait-divergence.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-wcvp-native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: [20261114, 20261115]
    env:
      STAGE: /tmp/fd-original-wcvp-native
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      ANALYSIS_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-verified traitwise endemic congener analytical runtime
        run: python -m pip install pandas numpy scipy pytest
      - name: Checkout unmerged fd analytical module and original tests
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Verify original endemic source/native and congener sampling guards
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_geological_endemic_trait_divergence.py work/fd/tests/test_geological_endemic_trait_opportunity.py
          python -m compileall -q work/fd/src/fd/geological_endemic_trait_divergence.py scripts/run_fd_endemic_trait_congener_divergence.py
          git -C work/fd rev-parse HEAD
      - name: Restore original frozen Direct 2234 flora and GIFT candidate mainland sources
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Build independently published geological-origin source crosswalk inside protected workflow
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geology_private"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geology_private")'
          test -s "$STAGE/geology_private/island_origin_crosswalk.csv"
          test -s "$STAGE/geology_private/crosswalk_audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["STAGE"])/"geology_private/crosswalk_audit.json").read_text())
          assert a["target_gshhg"] >= 8264
          assert a["roeble_2024_geological_records"] >= 500
          assert a["geological_counts"]["continental"]>=150
          assert a["geological_counts"]["oceanic"]>=200
          assert a["interpretation_limit"] == "LGM-unconnected does not imply geologically oceanic"
          print("Audited independent Roeble/Zizka geology source counts only",a["geological_counts"])
          PY
      - name: Compute source-congener categorical trait discordance on original island endemics
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_endemic_trait_congener_divergence.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geology_private/island_origin_crosswalk.csv" \
            --seed "$ANALYSIS_SEED" \
            --output "$STAGE/anonymous_endemic_congener_${ANALYSIS_SEED}.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["STAGE"])/("anonymous_endemic_congener_"+os.environ["ANALYSIS_SEED"]+".json")
          q=json.loads(p.read_text())
          assert q["status"]=="ORIGINAL_GEOLOGICAL_ENDEMIC_SINGLE_TRAIT_CONGENER_DISCORDANCE"
          assert q["n_geology_typed_islands"]>=430
          assert q["source_provenance"]["original_endemic_status_separate_from_native"]
          assert q["source_provenance"]["source_genus_congeners_selected_without_trait_outcome_matching"]
          assert q["source_provenance"]["donor_state_frequency_discordance_is_not_adaptation"]
          assert len(q["primary_single_trait_hypotheses"])==2
          assert len(q["endemic_vs_native_same_island_congener_support"])>=40
          assert all("n_islands_with_at_least_two_same_genus_endemic_nonendemic_pairs" in row
                     for row in q["endemic_vs_native_same_island_congener_support"])
          assert q["no_raw_species_island_genus_or_source_id_exported"]
          assert not any('"'+col+'"' in p.read_text() for col in (
              "island_id","accepted_species","origin_status","endemic_status",
              "floristic_status","entity_ID","work_species","spatial_block",
              "source_signature","family","genus","longitude","latitude"))
          print("Original separate native/endemic categorical species states and source opportunity verified")
          PY
      - name: Upload only anonymous endemic/nonendemic source congener comparison summary
        uses: actions/upload-artifact@v4
        with:
          name: fd-geological-endemic-congener-${{ matrix.seed }}-${{ github.run_id }}
          path: /tmp/fd-original-wcvp-native/anonymous_endemic_congener_${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90
