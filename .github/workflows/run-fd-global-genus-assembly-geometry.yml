name: fd global 4505 island exact genus assembly signed floral beta
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-global-genus-assembly-geometry.yml, scripts/fd_global_genus_assembly_geometry.py, tests/test_fd_global_genus_assembly_geometry.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest
      - name: Check signed exact profile-distance algebra, negative cross terms and 13 real endpoints
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_global_genus_assembly_geometry.py
          python -m compileall -q scripts/fd_global_genus_assembly_geometry.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Rebuild independently published geological source crosswalk
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Decompose protected source original species-disjoint floral beta by region genus algebra
        run: |
          set -euo pipefail
          python scripts/fd_global_genus_assembly_geometry.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology "$STAGE/geography/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_fd_genus_assembly_geometry.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["STAGE"])/"anonymous_fd_genus_assembly_geometry.json").read_text())
          assert q["status"]=="ORIGINAL_GLOBAL_13_ENDPOINT_GENUS_ASSEMBLY_EXACT_BETA_GEOMETRY"
          assert q["n_original_botanical_island_floras"]==4505
          assert sum(r["n_original_botanical_floras"] for r in q["original_4505_botanical_GSHHG_region_universe"])==4505
          assert q["n_actual_single_Direct_traits"]==10
          assert q["n_actual_Direct_joint_two_trait_endpoints"]==3
          assert q["original_endpoint_coverage_n5"]["all_recorded__flower_primary_color__floral_form"]==2324
          assert q["original_endpoint_coverage_n5"]["original_native__flower_primary_color__floral_form"]==327
          assert q["claims"]["pair_additive_squares_and_signed_cross_always_reconcile"]
          assert q["claims"]["genus_source_reference_is_in_sample_and_includes_focal_species"]
          assert q["original_exact_signed_category_distance_decompositions"]
          print("Original protected signed 13-endpoint floral category beta source geometry audited")
          PY
      - name: Export only anonymous descriptive regional/profile aggregate
        uses: actions/upload-artifact@v4
        with:
          name: fd-global-genus-assembly-geometry-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_fd_genus_assembly_geometry.json
          if-no-files-found: error
          retention-days: 30
