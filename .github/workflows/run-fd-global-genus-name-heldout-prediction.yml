name: fd 4505 island 13 endpoint original full-flora-name-heldout genus prediction
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-global-genus-name-heldout-prediction.yml, scripts/fd_global_genus_name_heldout_prediction.py, tests/test_fd_global_genus_name_heldout_prediction.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest
      - name: Validate absolute full original flora name-exclusion and category prediction loss on synthetic botanical source
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_global_genus_name_heldout_prediction.py tests/test_fd_global_genus_assembly_geometry.py
          python -m compileall -q scripts/fd_global_genus_name_heldout_prediction.py scripts/fd_global_genus_assembly_geometry.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Rebuild independently published geological source crosswalk
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Evaluate original 4505 Direct island flora category composition predictions excluding ALL focal accepted plant names
        run: |
          set -euo pipefail
          python scripts/fd_global_genus_name_heldout_prediction.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology "$STAGE/geography/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_fd_genus_name_heldout_predictions.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["STAGE"])/"anonymous_fd_genus_name_heldout_predictions.json").read_text())
          assert q["status"]=="ORIGINAL_GLOBAL_13_ENDPOINT_FULL_FLORA_NAME_HELDOUT_GENUS_PREDICTION"
          assert q["n_original_source_botanical_island_floras"]==4505
          assert q["n_original_direct_trait_endpoints"]==13
          assert q["source_full_4505_island_endpoint_eligibility"]["all_recorded__flower_primary_color__floral_form"]==2324
          assert q["source_full_4505_island_endpoint_eligibility"]["original_native__flower_primary_color__floral_form"]==327
          assert q["claims"]["full_all_status_focal_original_flora_species_names_excluded_from_training"]
          assert q["claims"]["negative_genus_prediction_gains_retained_not_filtered"]
          assert q["original_name_heldout_genus_vs_prior_island_scores"]
          print("Protected 13 endpoint original flora-name-heldout source predictive benefit audited")
          PY
      - name: Export only anonymous descriptive regional/profile aggregate
        uses: actions/upload-artifact@v4
        with:
          name: fd-global-genus-name-heldout-prediction-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_fd_genus_name_heldout_predictions.json
          if-no-files-found: error
          retention-days: 30
