name: fd source-pinned GloBI v0.9 provider/reference coverage

on:
  push:
    branches:
      - analysis/fd-globi-provider-v09-20261111
    paths:
      - 'src/island_v2/fd_globi_provider_v09.py'
      - 'src/island_v2/fd_globi_provider_family_transfer.py'
      - 'src/island_v2/fd_globi_species_shift_v09.py'
      - 'src/island_v2/fd_globi_species_shift_spatial_v09.py'
      - 'src/island_v2/fd_globi_macro_928_locality_v09.py'
      - 'scripts/run_fd_globi_provider_v09_audit.py'
      - 'tests/test_fd_globi_provider_v09.py'
      - 'tests/test_fd_globi_provider_family_transfer.py'
      - 'tests/test_fd_globi_species_shift_v09.py'
      - 'tests/test_fd_globi_species_shift_spatial_v09.py tests/test_fd_globi_macro_928_locality_v09.py'
      - 'tests/test_fd_globi_macro_928_locality_v09.py'
      - '.github/workflows/run-fd-globi-provider-v09-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  provider-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      PIN_SHA256: 095e57398420d1e0746e61233c796beedcfb8e03bd0c6a732aa17ae62043bd17
      GLOBI_VERSION: "10.5281/zenodo.20546682"
      STAGE: /tmp/fd-globi-provider-v09
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal independent test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pytest "geopandas>=1.0" "shapely>=2" "pyogrio>=0.9"

      - name: Verify source orientation, original references and provider collision tests
        run: |
          python -m pytest -q tests/test_fd_globi_provider_v09.py tests/test_fd_globi_provider_family_transfer.py tests/test_fd_globi_species_shift_v09.py tests/test_fd_globi_species_shift_spatial_v09.py
          python -m compileall -q src/island_v2/fd_globi_provider_v09.py src/island_v2/fd_globi_species_shift_v09.py scripts/run_fd_globi_provider_v09_audit.py

      - name: Reuse already frozen pre-outcome GloBI genus list from island artifact
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/source-breadth"
          gh run download 34790842133 \
            --repo zuizui0223/island \
            --name chapter1-globi-source-breadth-v2-34790842133 \
            --dir "$STAGE/source-breadth"
          find "$STAGE/source-breadth" -name globi_source_genus_breadth.csv -type f -print
          GENUS_CSV="$(find "$STAGE/source-breadth" -name globi_source_genus_breadth.csv -type f -print -quit)"
          test -n "$GENUS_CSV"
          export GENUS_CSV
          echo "GENUS_CSV=$GENUS_CSV" >> "$GITHUB_ENV"
          python - <<'PY'
          import os, pandas as pd
          d=pd.read_csv(os.environ['GENUS_CSV'])
          assert len(d)==2228
          assert d.genus.notna().all() and d.genus.is_unique
          assert {'n_independent_references','n_reference_channel_units'}.issubset(d)
          print('Pinned source genus predictor verified:',len(d),'names')
          PY

      - name: Recover the original source-backed Direct flora ledger (fixed artifact)
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island \
            --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/original-unpacked"
              unzip -q "$NESTED" -d "$STAGE/original-unpacked"
              LEDGER="$(find "$STAGE/original-unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER"
          test -s "$LEDGER"
          test -s data/v2/staging/gbif/collected/island_taxa.csv
          export DIRECT_LEDGER="$LEDGER"
          echo "DIRECT_LEDGER=$LEDGER" >> "$GITHUB_ENV"
          echo "FAMILY_TAXONOMY=$GITHUB_WORKSPACE/data/v2/staging/gbif/collected/island_taxa.csv" >> "$GITHUB_ENV"
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          python - <<'PY'
          import gzip, os, pandas as pd
          z=pd.read_csv(os.environ["DIRECT_LEDGER"],
                        usecols=["accepted_species","trait_name","normalized_value",
                                 "evidence_scope","evidence_quality"])
          assert set(z.evidence_scope.dropna()).issubset({"species_direct"})
          assert len(z)>1000
          print("Source Direct trait ledger source-artifact scope/coverage checked:",len(z))
          PY

      - name: Recover frozen independently qualified GBIF five-channel island observation states
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/island-channels"
          gh run download 34750153702 \
            --repo zuizui0223/island \
            --name chapter1-nee-channel-qualification-34750153702 \
            --dir "$STAGE/island-channels"
          CHANNEL_CSV="$(find "$STAGE/island-channels" -name nee_projected_channel_state.csv -type f -print -quit)"
          test -n "$CHANNEL_CSV"
          test -s "$CHANNEL_CSV"
          echo "CHANNEL_CSV=$CHANNEL_CSV" >> "$GITHUB_ENV"
          export CHANNEL_CSV
          python - <<'PY'
          import os, pandas as pd
          d=pd.read_csv(os.environ["CHANNEL_CSV"],
            usecols=["island_id","channel_id","channel_state","source_state"])
          assert not d.duplicated(["island_id","channel_id"]).any()
          assert {"bombus","flower_visiting_birds"}.issubset(set(d.channel_id))
          assert {"retained","disrupted","unresolved"}.issuperset(set(d.channel_state))
          print("Original exact-island evidence cohort checked:",len(d),"channel rows")
          PY

      - name: Recover SHA-verified exact original GSHHG polygons for the 21 frozen focal islands
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/exact-original-geometry"
          gh run download 43162949729 \
            --repo zuizui0223/island \
            --name fd-globi-revalidated-exact-gshhg-43162949729 \
            --dir "$STAGE/exact-original-geometry"
          GSHHG_GPKG="$(find "$STAGE/exact-original-geometry" -name 'original_gshhg_v237_h_candidate21_exact_shared_ids.gpkg' -type f -print -quit)"
          GSHHG_RECEIPT="$(find "$STAGE/exact-original-geometry" -name 'original_gshhg_geometry_receipt.json' -type f -print -quit)"
          test -n "$GSHHG_GPKG" && test -s "$GSHHG_GPKG"
          test -n "$GSHHG_RECEIPT" && test -s "$GSHHG_RECEIPT"
          echo "GSHHG_GPKG=$GSHHG_GPKG" >> "$GITHUB_ENV"
          echo "GSHHG_RECEIPT=$GSHHG_RECEIPT" >> "$GITHUB_ENV"
          export GSHHG_GPKG GSHHG_RECEIPT
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          q=json.loads(Path(os.environ["GSHHG_RECEIPT"]).read_text())
          h=hashlib.sha256(Path(os.environ["GSHHG_GPKG"]).read_bytes()).hexdigest()
          assert q["status"]=="FOCAL_21_POLYGONS_IDENTICAL_BUT_FULL_UNIVERSE_DRIFT"
          assert q["n_original_focal_islands"]==21
          assert q["n_focal_islands_with_exact_historical_polygon"]==21
          assert q["global_full_universe_identity_verified"] is False
          assert q["geometry_file_SHA256"]==h
          print("21 original island polygon IDs verified, NOT a global 8265-ID exact replay")
          PY

      - name: Download and SHA-verify exact original GloBI v0.9 SUPPORTS archive
        run: |
          set -euo pipefail
          mkdir -p "$STAGE"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$STAGE/interactions.tsv.gz" \
            "https://zenodo.org/records/20546682/files/interactions.tsv.gz?download=1"
          printf '%s  %s\n' "$PIN_SHA256" "$STAGE/interactions.tsv.gz" | sha256sum --check --strict

      - name: Reconstruct reference and provider concentration without phenotype data
        run: |
          set -euo pipefail
          python scripts/run_fd_globi_provider_v09_audit.py \
            --interactions "$STAGE/interactions.tsv.gz" \
            --frozen-source-genus-csv "$GENUS_CSV" \
            --original-direct-ledger "$DIRECT_LEDGER" \
            --original-island-taxonomy "$FAMILY_TAXONOMY" \
            --original-progressive-root "$ORIGINAL_ROOT" \
            --qualified-island-channel-states "$CHANNEL_CSV" \
            --original-candidate-island-GSHHG-gpkg "$GSHHG_GPKG" \
            --original-candidate-island-GSHHG-receipt "$GSHHG_RECEIPT" \
            --chunksize 200000 \
            --output "$STAGE/provider_coverage_receipt.json"
          python - <<'PY'
          import os, json
          from pathlib import Path
          d=json.loads((Path(os.environ['STAGE'])/'provider_coverage_receipt.json').read_text())
          assert d['source_sha256']==os.environ['PIN_SHA256']
          assert d['status']=='PROVIDER_COVERAGE_ONLY_NOT_FAMILY_PREDICTION'
          assert d['n_original_interaction_rows']>0
          assert d['n_distinct_source_providers']>=3
          assert d['n_common_genera_3plus_refs']>0
          assert d['source_and_taxon_identifiers_released'] is False
          family=d.get("provider_omitted_family_transfer",{})
          assert family.get("status") in {
              "COMPLETED_EXPLORATORY_PROVIDER_OMITTED_FAMILY_TRANSFER",
              "NOT_IDENTIFIABLE_AFTER_PROVIDER_OMISSION",
          }
          if family["status"]=="COMPLETED_EXPLORATORY_PROVIDER_OMITTED_FAMILY_TRANSFER":
              assert family["n_same_genera_before_after_with_direct_traits_and_unambiguous_family"] >= 50
              assert family["n_same_families"] >= 15
              assert family["heldout_original_provider_prediction_completed"]
              assert family["bootstrap_is_paired_at_family_level"] is True
              assert family["before_after_comparison_is_same_genus_same_family"] is True
              assert family["family_equal_delta_ci025"] < family["family_equal_delta_ci975"]
              assert len(family["per_guild_after_minus_before"]) == 5
          else:
              assert not family["heldout_original_provider_prediction_completed"]
          assert d['provider_heldout_effect_on_flower_morphology_NOT_TESTED'] == (
              not family["heldout_original_provider_prediction_completed"]
          )
          assert d["original_archive_source_granularity_unresolved"] is True
          assert d["provider_family_prediction_rerun_completed"] == (
              not d["provider_heldout_effect_on_flower_morphology_NOT_TESTED"])
          assert d["source_universe_selected_without_flower_traits"] is True
          assert d["direct_flower_traits_used_for_family_prediction"] is True
          assert d["native_same_species_GIFT_source_evidence_audit_completed"] is True
          s=d["species_direct_mainland_island_shift_evidence_coverage"]
          cohort=s["selection"]
          assert cohort["n_islands_with_30plus_species_direct_flower_traits"]==928
          assert cohort["n_candidate_islands_qualified_Bombus_nondetection_bird_recorded"]==21
          assert cohort["n_native_same_name_GIFT_source_island_plant_rows"]==197
          assert cohort["n_distinct_native_same_name_GIFT_source_plant_species"]==54
          assert cohort["n_islands_with_native_same_name_GIFT_source_plant"]==13
          coverage=s["GloBI_exact_species"]
          assert coverage["GloBI_v09_SHA256"]==os.environ["PIN_SHA256"]
          assert coverage["n_fixed_candidate_species"]==54
          assert coverage["n_original_GloBI_rows_read"]==d["n_original_interaction_rows"]
          assert 0<=coverage["n_species_with_at_least_one_exact_cited_flower_interaction"]<=54
          assert len(coverage["per_visitor_guild"])==5
          assert coverage["n_confirmed_evolutionary_pollinator_shifts"]==0
          assert coverage["no_exact_species_or_island_or_provider_id_released"] is True
          assert s["status"].endswith("NOT_ACTUAL_ISLAND_SOURCE_POLLINATOR_SHIFT")
          assert d["macro_928_original_Direct_flora_source_GloBI_preflight_completed"] is True
          macro=d["macro_928_Direct_flora_exact_species_GloBI"]
          assert macro["status"]=="MACRO_SOURCE_EVIDENCE_ONLY_NOT_POLLINATOR_SHIFT"
          cohort_macro=macro["original_Direct_flora_source_cohort"]
          assert cohort_macro["n_original_eligible_islands"]==928
          assert cohort_macro["n_original_complete_plant_species"]>=54
          loc_macro=macro["original_exact_island_locality_coverage"]
          assert loc_macro["status"]=="MACRO_928_FLORA_EXACT_GLOBI_LOCALITY_EVIDENCE_PREFLIGHT"
          assert loc_macro["n_original_Direct_triple_complete_islands"]==928
          assert loc_macro["n_islands_matching_original_GSHHG_geometric_id"]+loc_macro["n_islands_unmatchable_to_original_geometry"]==928
          assert loc_macro["n_islands_unmatchable_to_original_geometry"]<=9
          assert loc_macro["n_biological_pollinator_shifts_demonstrated"]==0
          assert loc_macro["plant_island_geography_provider_reference_IDs_released"] is False
          assert loc_macro["unreproducible_original_polygon_IDs_never_called_absence"] is True
          assert len(loc_macro["per_guild"])==5
          assert loc_macro["global_largest_source_is_selected_before_locality_or_trait_results"] is True
          assert loc_macro["original_archive_first_label_is_not_proven_independent_study"] is True
          assert 0 <= loc_macro["n_native_island_species_pairs_with_2plus_documented_visitor_guilds"] <= loc_macro["n_strict_native_flora_island_species_pairs_with_visitor_relation"]
          assert 0 <= loc_macro["n_unresolved_origin_island_species_pairs_with_2plus_documented_visitor_guilds"] <= loc_macro["n_origin_unresolved_flora_island_species_pairs_with_visitor_relation"]
          assert 0 <= loc_macro["n_island_species_pairs_with_2plus_distinct_archive_first_labels"] <= loc_macro["n_distinct_island_species_pairs_with_record"]
          assert 0 <= loc_macro["n_island_species_pairs_with_record_after_globally_largest_archive_omitted"] <= loc_macro["n_distinct_island_species_pairs_with_record"]
          assert 0 <= loc_macro["n_native_island_species_pairs_with_record_after_globally_largest_archive_omitted"] <= loc_macro["n_strict_native_flora_island_species_pairs_with_visitor_relation"]
          assert 0 <= loc_macro["n_native_island_species_pairs_with_2plus_guilds_after_globally_largest_archive_omitted"] <= loc_macro["n_native_island_species_pairs_with_2plus_documented_visitor_guilds"]
          assert len(loc_macro["per_guild"])==5
          assert all("n_native_island_plant_pairs_with_guild_after_globally_largest_source_removed" in row for row in loc_macro["per_guild"])
          assert d["original_13_candidate_island_GloBI_point_polygon_preflight_completed"] is True
          loc=s["original_island_polygon_locality_overlap"]
          assert loc["status"]=="EXACT_FOCAL_ISLAND_POLYGON_OVERLAP_AUDITED_NOT_VERIFIED_POLLINATOR_SHIFT"
          assert loc["n_approved_original_candidate_island_polygon_IDs"]==21
          assert loc["n_frozen_candidate_species"]==54
          assert loc["n_strict_native_source_matched_plant_island_rows"]==197
          assert loc["n_qualified_focal_islands_with_same_native_source_names"]==13
          assert loc["n_confirmed_same_species_mainland_to_island_pollinator_shifts"]==0
          assert loc["n_original_mainland_GIFT_source_population_visitor_assessments"]==0
          assert len(loc["guilds"])==5
          assert loc["original_species_island_provider_reference_or_geo_coordinates_exported"] is False
          assert d['source_and_taxon_identifiers_released'] is False
          print('Source provider evidence receipt verified (aggregate-only)')
          PY

      - name: Publish ONLY the original-source provider coverage receipt
        uses: actions/upload-artifact@v4
        with:
          name: fd-globi-provider-v09-coverage-${{ github.run_id }}
          path: /tmp/fd-globi-provider-v09/provider_coverage_receipt.json
          if-no-files-found: error
          retention-days: 90
