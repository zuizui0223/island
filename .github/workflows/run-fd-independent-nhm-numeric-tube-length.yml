name: fd original 4505 independent NHM numeric corolla tube depth overlap and source audit
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_independent_nhm_numeric_tube_length.py
      - tests/test_fd_independent_nhm_numeric_tube_length.py
      - .github/workflows/run-fd-independent-nhm-numeric-tube-length.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-NHM-true-numeric-tube-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-original-NHM-numeric-tube
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numeric OCR and source geometry audit runtime
        run: python -m pip install -q pandas numpy scipy networkx pytest
      - name: Checkout source-original FD accepted trait ontology
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Test source numeric unit validity, source-provenance and same-species depth controls
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd/src" python -m pytest -q \
            tests/test_fd_independent_nhm_numeric_tube_length.py \
            tests/test_fd_nhm_original_provider_audit.py \
            work/fd/tests/test_real_joint_syndrome_access.py
          python -m compileall -q scripts/run_fd_independent_nhm_numeric_tube_length.py
      - name: Restore SHA-frozen original GIFT 4505 accepted plant floras and Direct traits
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 \
            --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Restore and SHA-check five original NHM OCR trait corpora including numeric corolla tube min max
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/nhm-corpora"
          while IFS='|' read -r file expected; do
            test -n "$file" || continue
            curl -fLSs --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 300 \
              "https://raw.githubusercontent.com/NaturalHistoryMuseum/plant-traits/4843c22bb2fc91018d9828dcddebf067c83b1097/output/raw/ocr-traits/$file" \
              -o "$STAGE/nhm-corpora/$file"
            actual="$(git hash-object --no-filters "$STAGE/nhm-corpora/$file")"
            test "$actual" = "$expected"
          done <<'NHM_PINS'
          bhl.csv|f46e15b95e92b1daad5c0ebf2145df73173505be
          ecoflora.csv|dbdc6b4469583743b8b35e26912d21d05b550f32
          efloras.flora_of_china.csv|ec87a99eee2cc1bf9a8868e1d5425654e7974897
          efloras.flora_of_north_america.csv|3710b08d7b041205a6cb5e7b811c08de317e006d
          efloras.flora_of_pakistan.csv|7f506417a3ae31fc4daa959a27976ed62c7b1449
          NHM_PINS
      - name: Rebuild independent original GSHHG physical island spatial blocks
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geography"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path;import os;from fd.origin import run_crosswalk;run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Audit original real NHM species-level numeric corolla tube lengths and island source overlap
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd/src" python \
            scripts/run_fd_independent_nhm_numeric_tube_length.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geography/island_origin_crosswalk.csv" \
            --nhm-directory "$STAGE/nhm-corpora" \
            --output "$STAGE/anonymous_NHM_source_numeric_tube_overlap.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"anonymous_NHM_source_numeric_tube_overlap.json"
          raw=p.read_text()
          z=json.loads(raw)
          assert z["status"]=="ORIGINAL_4505_INDEPENDENT_NHM_NUMERIC_COROLLA_TUBE_LENGTH_PREFLIGHT"
          assert z["n_original_botanical_flora_islands"]==4505
          assert z["n_original_mainland_GIFT_source_entities"]==748
          assert len(z["original_five_NHM_raw_provider_tables"])==5
          assert z["n_island_scope_provider_region_panels"]==5*3*2
          assert z["scientific_limits"]["tube_length_cm_not_equipollent_to_original_ordinal_depth_without_calibration"]
          assert z["scientific_limits"]["source_species_absent_from_focal_original_island_checklist"]
          forbid=("island_id","accepted_species","work_species","entity_ID",
                  "spatial_block","source_signature","source_region_id",
                  "source_genus","source_family","latitude","longitude",
                  "GBIF_id","photo_id","taxon_id")
          assert not any('"'+x+'"' in raw for x in forbid)
          print("Original independent numeric tube trait source audit succeeded")
          PY
      - name: Export only non-identifying numeric source quality and region-level eligibility
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-4505-NHM-numeric-tube-source-${{ github.run_id }}
          path: /tmp/fd-original-NHM-numeric-tube/anonymous_NHM_source_numeric_tube_overlap.json
          if-no-files-found: error
          retention-days: 90
