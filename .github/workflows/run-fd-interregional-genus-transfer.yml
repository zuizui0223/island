name: fd global source exclusive interregional genus trait transferability
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-interregional-genus-transfer.yml, scripts/fd_interregional_genus_name_exclusive_transfer.py, tests/test_fd_interregional_genus_name_exclusive_transfer.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest
      - name: Confirm balanced genus source information, region-exclusive accepted names and original negative control
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_interregional_genus_name_exclusive_transfer.py tests/test_fd_global_genus_name_heldout_prediction.py
          python -m compileall -q scripts/fd_interregional_genus_name_exclusive_transfer.py scripts/fd_global_genus_assembly_geometry.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Rebuild independently published geological source crosswalk
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Evaluate original 4505 island exclusive local versus nonlocal name-disjoint matched-genus phenotype transfer
        run: |
          set -euo pipefail
          python scripts/fd_interregional_genus_name_exclusive_transfer.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology "$STAGE/geography/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_fd_interregional_genus_transfer.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["STAGE"])/"anonymous_fd_interregional_genus_transfer.json").read_text())
          assert q["status"]=="ORIGINAL_4505_REGION_EXCLUSIVE_EQUAL_GENUS_DONOR_TRANSFER"
          assert q["n_original_botanical_island_floras"]==4505
          assert q["n_original_accepted_source_trait_endpoints"]==13
          assert sum(v["n_original_botanical_floras"] for v in q["original_complete_botanical_region_universe"])==4505
          assert q["source_original_n5_endpoint_coverage"]["all_recorded__flower_primary_color__floral_form"]==2324
          assert q["source_original_n5_endpoint_coverage"]["original_native__flower_primary_color__floral_form"]==327
          assert q["claims"]["names_occurring_in_target_and_other_regions_removed_from_both_source_sets"]
          assert q["claims"]["local_and_external_same_original_genus_and_exact_equal_donor_species_count"]
          assert q["original_exclusive_training_taxonomic_source_support"]
          print("Source-original region-exclusive shared-genus and category transportability source verified")
          PY
      - name: Export only anonymous descriptive regional/profile aggregate
        uses: actions/upload-artifact@v4
        with:
          name: fd-interregional-genus-transfer-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_fd_interregional_genus_transfer.json
          if-no-files-found: error
          retention-days: 30
