name: fd floral beta geography and genus-null falsification
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-island-beta-geographic-null.yml, scripts/fd_island_functional_beta.py, scripts/fd_island_beta_geographic_null.py, tests/test_fd_island_beta_geographic_null.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest
      - name: Confirm exact synthetic geography and source-mask regressions
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_island_functional_beta.py tests/test_fd_island_beta_geographic_null.py
          python -m compileall -q scripts/fd_island_functional_beta.py scripts/fd_island_beta_geographic_null.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Rebuild independently published geological source crosswalk
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Compute geographic and genus-conditioned floral beta residual strata
        run: |
          set -euo pipefail
          python scripts/fd_island_beta_geographic_null.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology "$STAGE/geography/island_origin_crosswalk.csv" \
            --block-size 96 \
            --output "$STAGE/anonymous_island_beta_geographic_null.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          out=Path(os.environ["STAGE"])/"anonymous_island_beta_geographic_null.json"
          result=json.loads(out.read_text())
          assert result["status"]=="ORIGINAL_GEOGRAPHIC_FLORAL_GENUS_NULL_DESCRIPTIVE"
          assert result["n_original_botanical_islands"]==4505
          assert result["eligible_islands_by_scope"]["all_recorded"]==2324
          assert result["comparisons"]
          assert all(x["n_physical_blocks"]>=10 and x["n_islands"]>=30
                     and x["n_pairs"]>=100 for x in result["comparisons"])
          assert result["claims"]["no_pair_as_independent_replication"]
          assert result["claims"]["no_private_island_species_or_source_ids_exported"]
          print("Original geography/source-agnostic diagnostic gates pass")
          PY
      - name: Export only anonymous descriptive regional/profile aggregate
        uses: actions/upload-artifact@v4
        with:
          name: fd-island-beta-geographic-null-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_island_beta_geographic_null.json
          if-no-files-found: error
          retention-days: 30
