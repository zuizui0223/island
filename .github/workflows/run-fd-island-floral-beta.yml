name: fd 4505 island floral composition beta versus taxonomic turnover
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-island-floral-beta.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-floral-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STAGE: /tmp/fd-island-floral-beta
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original analysis runtime
        run: python -m pip install numpy pandas scipy pytest
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: a678df2c70daddcdfa7695351a698b1edd287a86
          path: work/fd
          persist-credentials: false
      - name: Test beta metrics, unchanged masks, intact-profile permutations and original partial FD
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/checks"
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_island_floral_beta.py work/fd/tests/test_global_partial_trait_flora_fd.py | tee "$STAGE/checks/targeted_tests.txt"
          python -m compileall -q work/fd/src/fd/island_floral_beta.py
          git -C work/fd rev-parse HEAD | tee "$STAGE/checks/code_commit.txt"
      - name: Restore frozen original botanical membership and Direct traits
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Build independently sourced geography within protected runner
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geography"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Compare original island composition with species turnover and profile null references
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -u -m fd.island_floral_beta \
            --original-root "$ORIGINAL_ROOT" \
            --geography "$STAGE/geography/island_origin_crosswalk.csv" \
            --baseline "$BASELINE" --permutations 199 \
            --output "$STAGE/anonymous_island_floral_beta.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ['STAGE'])/'anonymous_island_floral_beta.json').read_text())
          assert q['n_original_flora_islands']==4505
          assert len(q['endpoints'])==26
          assert q['baseline_reconciliation']['n_reconciled_scope_endpoints']==26
          assert q['baseline_reconciliation']['max_raw_rao_difference']<1e-10
          assert len(q['disjoint_flora_profile_permutation_tests'])==6
          assert all(e.get('n_focal_islands_in_uniform_graph',e['n_eligible_islands'])==e['n_eligible_islands'] for e in q['endpoints'])
          assert q['claims']['no_intraspecific_change_estimated']
          assert q['claims']['no_pair_independence_pvalues_or_geology_causal_test']
          print('Original 4505 floras, all 26 per-trait masks and raw Q reconciled; pair IDs stay private')
          PY
      - name: Record bounded full-repository test status without masking unrelated failures
        run: |
          set +e
          (cd work/fd && PYTHONPATH=src timeout 180 python -m pytest -q --maxfail=3) > "$STAGE/checks/full_suite.txt" 2>&1
          CODE=$?
          echo "full_repository_suite_exit_code=$CODE" | tee "$STAGE/checks/full_suite_status.txt"
          tail -45 "$STAGE/checks/full_suite.txt"
          exit 0
      - name: Export anonymous aggregates and code-test receipts only
        uses: actions/upload-artifact@v4
        with:
          name: fd-island-floral-beta-${{ github.run_id }}
          path: |
            /tmp/fd-island-floral-beta/anonymous_island_floral_beta.json
            /tmp/fd-island-floral-beta/checks/
          if-no-files-found: error
          retention-days: 30
