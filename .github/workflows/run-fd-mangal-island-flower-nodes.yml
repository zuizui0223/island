name: fd original 4505 Mangal pollination network positive plant edges and GIFT island traits
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_mangal_island_flower_nodes.py
      - .github/workflows/run-fd-mangal-island-flower-nodes.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-labelled-mangal-network-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-original-mangal-plant-nodes
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original GIFT botanical source geometry and metadata packages
        run: python -m pip install -q pandas numpy scipy pytest requests "geopandas>=1.0" "shapely>=2" "pyogrio>=0.9"
      - name: Checkout original real species/flower and Mangal positive-source link code
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Validate observed interaction type, original plant names, family and no biological nondetections
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python -m pytest -q \
            work/fd/tests/test_independent_mangal_pollination_links.py \
            work/fd/tests/test_gbif_mangal_visitor_taxonomy.py \
            work/fd/tests/test_independent_pollination_networks.py
          python -m compileall -q \
            scripts/run_fd_mangal_island_flower_nodes.py \
            work/fd/src/fd/independent_mangal_pollination_links.py
          git -C work/fd rev-parse HEAD
      - name: Restore original SHA-verified 4505 GIFT accepted botanical island flora and Direct traits
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 \
            --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Restore exact historical source-verified GSHHG polygons for 927 original GIFT observation island sites
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/polygons"
          gh run download 43162949729 --repo zuizui0223/island \
            --name fd-globi-revalidated-exact-gshhg-43162949729 \
            --dir "$STAGE/polygons"
          GSHHG_GPKG="$(find "$STAGE/polygons" -name 'original_gshhg_v237_h_candidate21_exact_shared_ids.gpkg' -type f -print -quit)"
          GSHHG_RECEIPT="$(find "$STAGE/polygons" -name 'original_gshhg_geometry_receipt.json' -type f -print -quit)"
          test -n "$GSHHG_GPKG" && test -s "$GSHHG_GPKG"
          test -n "$GSHHG_RECEIPT" && test -s "$GSHHG_RECEIPT"
          echo "GSHHG_GPKG=$GSHHG_GPKG" >> "$GITHUB_ENV"
          echo "GSHHG_RECEIPT=$GSHHG_RECEIPT" >> "$GITHUB_ENV"
      - name: Examine source-labelled Mangal flower networks, nodes and strictly positive publication edges
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:src:work/fd/src" python \
            scripts/run_fd_mangal_island_flower_nodes.py \
            --original-root "$ORIGINAL_ROOT" \
            --original-gshhg-geometry "$GSHHG_GPKG" \
            --original-geometry-receipt "$GSHHG_RECEIPT" \
            --output "$STAGE/anonymous_Mangal_original_4505_network_flowers.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ["STAGE"])/"anonymous_Mangal_original_4505_network_flowers.json"
          raw=f.read_text()
          z=json.loads(raw)
          assert z["status"]=="ORIGINAL_GIFT_4505_INDEPENDENT_MANGAL_NETWORK_INTERACTION_PREFLIGHT"
          assert z["n_original_botanical_GIFT_island_population"]==4505
          assert z["n_original_geometry_authenticated_island_subset"]==927
          c=z["exact_island_plant_guild_and_real_flower_traits"]
          assert c["status"]=="SOURCE_NETWORK_EXACT_SITE_SAME_SPECIES_FLORAL_TRAIT_SUPPORT"
          assert c["n_original_global_GIFT_botanical_islands"]==4505
          assert len(c["cells"])==4*3*7
          gbif=z["original_Mangal_flower_partner_GBIF_classification"]
          assert gbif["status"]=="ORIGINAL_MANGAL_SAME_PLANT_FLORAL_PAIR_GBIF_TAXONOMY_EVIDENCE"
          assert gbif["n_original_GIFT_botanical_islands"]==4505
          assert gbif["n_source_guild_support_cells"]==4*3*7
          assert gbif["limitations"]["original_Mangal_node_gbif_taxonomy_is_not_independent_visitor_observation"]
          assert gbif["source_lookup_coverage"]["unmatched_or_missing_original_taxon_keys_not_negative_visitors"]
          assert z["epistemic_limits"]["original_source_networks_may_be_in_GloBI_or_Web_of_Life"]
          assert z["epistemic_limits"]["zero_source_edge_strength_never_pseudoabsent_visit"]
          protected=("island_id","accepted_species","reference_id","provider_id",
                 "latitude","longitude","entity_ID","work_species",
                 "source_signature","spatial_block","source_genus",
                 "source_family","visitor_species")
          assert not any('"'+k+'"' in raw for k in protected)
          print("Original GIFT 4505 Mangal source-labelled positive island visitor-guild support protected checks PASS")
          PY
      - name: Upload only anonymous original island-network source metadata and positive plant interaction support
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-4505-mangal-positive-island-network-${{ github.run_id }}
          path: /tmp/fd-original-mangal-plant-nodes/anonymous_Mangal_original_4505_network_flowers.json
          if-no-files-found: error
          retention-days: 90
