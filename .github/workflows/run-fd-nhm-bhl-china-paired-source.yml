name: fd BHL versus China paired global external colour source falsification
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-nhm-bhl-china-paired-source.yml, scripts/fd_nhm_provider_stratified_colour_placebo.py, tests/test_fd_nhm_provider_stratified_colour_placebo.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest networkx
      - name: Verify original NHM cross-provider common-source placebo and no identity leakage
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_nhm_provider_stratified_colour_placebo.py tests/test_fd_nhm_external_flora_preflight.py tests/test_fd_nhm_original_provider_audit.py
          python -m compileall -q scripts/fd_nhm_provider_stratified_colour_placebo.py scripts/fd_nhm_original_provider_audit.py scripts/fd_nhm_global_source_only_colour.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Rebuild independent original GSHHG physical geography
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Verify BHL and Flora of China original published text corpora
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/nhm-corpora"
          while IFS='|' read -r file expected; do
            test -n "$file" || continue
            curl -fLSs --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 300 \
              "https://raw.githubusercontent.com/NaturalHistoryMuseum/plant-traits/4843c22bb2fc91018d9828dcddebf067c83b1097/output/raw/ocr-traits/$file" \
              -o "$STAGE/nhm-corpora/$file"
            actual="$(git hash-object --no-filters "$STAGE/nhm-corpora/$file")"
            test "$actual" = "$expected"
          done <<'NHM_PINS'
          bhl.csv|f46e15b95e92b1daad5c0ebf2145df73173505be
          efloras.flora_of_china.csv|ec87a99eee2cc1bf9a8868e1d5425654e7974897
          NHM_PINS
      - name: Compare independently sourced flower colours on identical global island floras and placebo source assignments
        run: |
          set -euo pipefail
          python scripts/fd_nhm_provider_stratified_colour_placebo.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology "$STAGE/geography/island_origin_crosswalk.csv" \
            --nhm-directory "$STAGE/nhm-corpora" \
            --output "$STAGE/anonymous_nhm_bhl_china_paired.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["STAGE"])/"anonymous_nhm_bhl_china_paired.json").read_text())
          assert q["status"]=="NHM_BHL_VS_CHINA_ORIGINAL_SOURCE_PROVIDER_VALIDATION"
          assert q["n_original_botanical_floras"]==4505
          assert q["n_original_colour_n5_islands"]==3119
          assert q["n_original_native_colour_n5_islands"]==395
          assert q["n_original_selected_pair_endpoints"]==215
          assert len(q["same_island_same_controls_comparisons"])==3
          assert q["claims"]["both_provider_source_controls_identical_for_each_focal_island"]
          assert q["claims"]["original_island_plant_species_names_removed_from_all_source_regions"]
          print("Original BHL/China common target/common placebo provenance macro completed")
          PY
      - name: Export only anonymous provider-matched global source scores
        uses: actions/upload-artifact@v4
        with:
          name: fd-nhm-bhl-china-paired-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_nhm_bhl_china_paired.json
          if-no-files-found: error
          retention-days: 30
