name: fd external NHM descriptions GIFT source-independent colour/form feasibility
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-nhm-external-flora-preflight.yml, scripts/fd_nhm_external_flora_preflight.py, tests/test_fd_nhm_external_flora_preflight.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest networkx
      - name: Validate strict independent floral trait descriptions and privacy tests
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_nhm_external_flora_preflight.py
          python -m compileall -q scripts/fd_nhm_external_flora_preflight.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Rebuild independently published geological source crosswalk
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Download independently published NHM flower traits at immutable Git commit and verify git blob SHA
        run: |
          set -euo pipefail
          curl -fLSs --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 240 \
            "https://raw.githubusercontent.com/NaturalHistoryMuseum/plant-traits/4843c22bb2fc91018d9828dcddebf067c83b1097/output/raw/ocr-traits/combined.csv" \
            -o "$STAGE/nhm-plant-traits-combined.csv"
          test -s "$STAGE/nhm-plant-traits-combined.csv"
          actual="$(git hash-object --no-filters "$STAGE/nhm-plant-traits-combined.csv")"
          test "$actual" = "e1cfd2d5c518c2061ec91d1a9e8b64fc7ca69389"
          echo "NHM independent CC-BY4 floral text source original git blob validated $actual"
      - name: Join original 4505 floral islands to independent NHM flower descriptions without publishing species identities
        run: |
          set -euo pipefail
          python scripts/fd_nhm_external_flora_preflight.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology "$STAGE/geography/island_origin_crosswalk.csv" \
            --nhm-combined "$STAGE/nhm-plant-traits-combined.csv" \
            --output "$STAGE/anonymous_fd_nhm_external_flora.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          o=json.loads((Path(os.environ["STAGE"])/"anonymous_fd_nhm_external_flora.json").read_text())
          assert o["status"]=="FD_EXTERNAL_NHM_BOTANICAL_DESCRIPTION_SOURCE_PREFLIGHT"
          assert o["n_original_botanical_islands"]==4505
          assert o["n_GIFT_native_mainland_source_regions"]==748
          assert o["n_eligible_original_flower_colour_n5_islands"]==3132
          assert o["n_original_posthoc_456_source_candidate_islands"]==215
          assert o["source_metadata"]["NHM_combined_git_blob_sha"]=="e1cfd2d5c518c2061ec91d1a9e8b64fc7ca69389"
          assert o["claims"]["external_source_names_absent_from_ALL_4505_islands_for_independent_donors"]
          print("Original external independent floral source audit passed")
          PY
      - name: Export only anonymous descriptive regional/profile aggregate
        uses: actions/upload-artifact@v4
        with:
          name: fd-nhm-external-flora-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_fd_nhm_external_flora.json
          if-no-files-found: error
          retention-days: 30
