name: fd original 4505 GIFT NHM heldout provider numeric tube source forecast
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_nhm_numeric_provider_disjoint_source.py
      - .github/workflows/run-fd-nhm-numeric-provider-disjoint-source.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-five-provider-disjoint:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-nhm-disjoint-providers
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numeric source and original flora tests
        run: python -m pip install -q pandas numpy scipy pytest networkx
      - name: Checkout unmerged FD source-level provider audit
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Test provider disjoint source and negative calibration gating
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd/src" python -m pytest -q \
            work/fd/tests/test_nhm_numeric_provider_holdout.py \
            work/fd/tests/test_nhm_numeric_source_congener_predict.py \
            tests/test_fd_independent_nhm_numeric_tube_length.py
          python -m compileall -q \
            scripts/run_fd_nhm_numeric_provider_disjoint_source.py \
            work/fd/src/fd/nhm_numeric_provider_holdout.py
          git -C work/fd rev-parse HEAD
      - name: Restore original SHA-frozen 4505 GIFT island flora and native mainland source
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 \
            --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Restore five independently released ORIGINAL NHM numerical corolla tube sources
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/nhm"
          while IFS='|' read -r name expected; do
            test -n "$name" || continue
            curl -fLSs --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 300 \
              "https://raw.githubusercontent.com/NaturalHistoryMuseum/plant-traits/4843c22bb2fc91018d9828dcddebf067c83b1097/output/raw/ocr-traits/$name" \
              -o "$STAGE/nhm/$name"
            test "$(git hash-object --no-filters "$STAGE/nhm/$name")" = "$expected"
          done <<'NHM_PINS'
          bhl.csv|f46e15b95e92b1daad5c0ebf2145df73173505be
          ecoflora.csv|dbdc6b4469583743b8b35e26912d21d05b550f32
          efloras.flora_of_china.csv|ec87a99eee2cc1bf9a8868e1d5425654e7974897
          efloras.flora_of_north_america.csv|3710b08d7b041205a6cb5e7b811c08de317e006d
          efloras.flora_of_pakistan.csv|7f506417a3ae31fc4daa959a27976ed62c7b1449
          NHM_PINS
      - name: Rebuild original independently published GSHHG spatial blocks
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geography"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Execute original 4505 provider disjoint numeric source prediction
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd/src" python \
            scripts/run_fd_nhm_numeric_provider_disjoint_source.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geography/island_origin_crosswalk.csv" \
            --nhm-directory "$STAGE/nhm" \
            --output "$STAGE/anonymous_NHM_provider_disjoint_source_4505.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ["STAGE"])/"anonymous_NHM_provider_disjoint_source_4505.json"
          raw=p.read_text()
          x=json.loads(raw)
          assert x["status"]=="ORIGINAL_4505_NHM_PROVIDER_DISJOINT_TUBE_SOURCE_PREDICTION"
          assert x["n_original_GIFT_island_floras"]==4505
          assert x["n_original_island_scope_provider_rows"]==4505*3*5
          assert x["n_regional_status_source_provider_panels"]==5*3*5
          assert x["n_original_748_mainland_source_regions"]==748
          assert x["n_climate10_covered_original_botanical_floras"]==4485
          assert x["limitations"]["each_NHM_source_donor_length_from_one_heldout_named_corpus"]
          assert x["limitations"]["calibration_numeric_lengths_from_other_four_pinned_corpora"]
          assert x["limitations"]["source_provider_disjoint_not_underlying_publication_independent"]
          forbidden=("island_id","accepted_species","entity_ID","work_species",
                     "spatial_block","source_signature","source_region_id",
                     "source_genus","source_family","genus",
                     "latitude","longitude","GBIF_id","taxon_id","photo_id")
          assert not any('"'+z+'"' in raw for z in forbidden)
          print("Original five NHM named-corpus disjoint source audit passed")
          PY
      - name: Upload only aggregate original named-provider and region-support output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-4505-NHM-heldout-provider-${{ github.run_id }}
          path: /tmp/fd-nhm-disjoint-providers/anonymous_NHM_provider_disjoint_source_4505.json
          if-no-files-found: error
          retention-days: 90
