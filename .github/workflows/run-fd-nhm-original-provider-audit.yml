name: fd NHM independent corpus flower trait provenance and source-only support
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-nhm-original-provider-audit.yml, scripts/fd_nhm_original_provider_audit.py, tests/test_fd_nhm_original_provider_audit.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest networkx
      - name: Test NHM independent text-corpus identity, morphology uncertainty and privacy
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_nhm_original_provider_audit.py tests/test_fd_nhm_external_flora_preflight.py
          python -m compileall -q scripts/fd_nhm_original_provider_audit.py scripts/fd_nhm_external_flora_preflight.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Read five independent NHM text corpora at immutable commit and verify each original Git blob
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/nhm-corpora"
          while IFS='|' read -r file expected; do
            test -n "$file" || continue
            curl -fLSs --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 300 \
              "https://raw.githubusercontent.com/NaturalHistoryMuseum/plant-traits/4843c22bb2fc91018d9828dcddebf067c83b1097/output/raw/ocr-traits/$file" \
              -o "$STAGE/nhm-corpora/$file"
            actual="$(git hash-object --no-filters "$STAGE/nhm-corpora/$file")"
            test "$actual" = "$expected"
            echo "NHM provider $(basename "$file") independent source file validated"
          done <<'NHM_PINS'
          bhl.csv|f46e15b95e92b1daad5c0ebf2145df73173505be
          ecoflora.csv|dbdc6b4469583743b8b35e26912d21d05b550f32
          efloras.flora_of_china.csv|ec87a99eee2cc1bf9a8868e1d5425654e7974897
          efloras.flora_of_north_america.csv|3710b08d7b041205a6cb5e7b811c08de317e006d
          efloras.flora_of_pakistan.csv|7f506417a3ae31fc4daa959a27976ed62c7b1449
          NHM_PINS
      - name: Audit exact original five source names and GIFT island category provenance without releasing names
        run: |
          set -euo pipefail
          python scripts/fd_nhm_original_provider_audit.py \
            --original-root "$ORIGINAL_ROOT" \
            --nhm-directory "$STAGE/nhm-corpora" \
            --output "$STAGE/anonymous_fd_nhm_providers.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["STAGE"])/"anonymous_fd_nhm_providers.json").read_text())
          assert q["status"]=="NHM_PROVIDER_ORIGINAL_TEXT_SOURCE_INDEPENDENCE_AUDIT"
          assert q["n_original_gift_island_flora"]==4505
          assert len(q["provider_source_counts"])==5
          assert q["n_original_mainland_gift_regions"]==748
          assert q["claims"]["distinct_corpora_not_independent_botanical_field_studies"]
          print("Original provider source-specific flower trait independence audit succeeded")
          PY
      - name: Export only anonymous descriptive regional/profile aggregate
        uses: actions/upload-artifact@v4
        with:
          name: fd-nhm-original-providers-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_fd_nhm_providers.json
          if-no-files-found: error
          retention-days: 30
