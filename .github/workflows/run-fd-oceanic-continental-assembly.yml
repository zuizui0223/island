name: fd geological oceanic continental establishment filtering and endemic proxy
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_geological_establishment_adaptation.py
      - .github/workflows/run-fd-oceanic-continental-assembly.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-wcvp-native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: [20261114, 20261115]
    env:
      STAGE: /tmp/fd-original-wcvp-native
      GH_TOKEN: ${{ github.token }}
      RANDOM_SEED: ${{ matrix.seed }}
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install finite categorical Rao and geology original audit runtime
        run: python -m pip install pandas numpy scipy pytest
      - name: Checkout unmerged fd analytical module and original tests
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      # Re-evaluate the same frozen source after excluding missing geography; never impute climate PCs.
      - name: Test source/origin/provenance and strict full-island floral data
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_geological_establishment_adaptation.py work/fd/tests/test_geological_disjoint_matched.py work/fd/tests/test_regional_native_flora_fd.py work/fd/tests/test_regional_native_provenance_volume.py work/fd/tests/test_native_taxon_matched_pairing.py
          python -m compileall -q work/fd/src/fd/geological_establishment_adaptation.py scripts/run_fd_geological_establishment_adaptation.py
          git -C work/fd rev-parse HEAD
      - name: Restore original frozen Direct 2234 flora and GIFT candidate mainland sources
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Restore independent frozen official WCVP original native range and island TDWG status
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/wcvp"
          gh run download 32559322028 --repo zuizui0223/island --name official-wcvp-corroborated-status-32559322028 --dir "$STAGE/wcvp"
          STATUS="$(find "$STAGE/wcvp" -name resolved_floristic_status_ledger.csv.gz -type f -print -quit)"
          TDWG="$(find "$STAGE/wcvp" -name island_tdwg_l3_mapping.csv -type f -print -quit)"
          test -n "$STATUS" && test -s "$STATUS"
          test -n "$TDWG" && test -s "$TDWG"
          echo "10e7c56f1cc98c1fabc43c24cb8c456476f2ae057dacaa61aae9e635e2420ab0  $STATUS" | sha256sum --check --strict
          echo "e28351c297ab1ca7416b50b55a99fafd2c5d4ab6c8b984761fe987e0a57953b3  $TDWG" | sha256sum --check --strict
          echo "WCVP_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "ORIGINAL_TDWG=$TDWG" >> "$GITHUB_ENV"
      - name: Build independently published geological-origin source crosswalk inside protected workflow
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geology_private"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geology_private")'
          test -s "$STAGE/geology_private/island_origin_crosswalk.csv"
          test -s "$STAGE/geology_private/crosswalk_audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["STAGE"])/"geology_private/crosswalk_audit.json").read_text())
          assert a["target_gshhg"] >= 8264
          assert a["roeble_2024_geological_records"] >= 500
          assert a["geological_counts"]["continental"]>=150
          assert a["geological_counts"]["oceanic"]>=200
          assert a["interpretation_limit"] == "LGM-unconnected does not imply geologically oceanic"
          print("Audited independent Roeble/Zizka geology source counts only",a["geological_counts"])
          PY
      - name: Compare oceanic versus continental original floristic filtering and endemic trait divergence proxy
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_geological_establishment_adaptation.py \
            --original-root "$ORIGINAL_ROOT" \
            --wcvp-status "$WCVP_STATUS" --island-tdwg "$ORIGINAL_TDWG" \
            --geology-crosswalk "$STAGE/geology_private/island_origin_crosswalk.csv" \
            --seed "$RANDOM_SEED" \
            --output "$STAGE/anonymous_geology_assembly_$RANDOM_SEED.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["STAGE"])/("anonymous_geology_assembly_"+os.environ["RANDOM_SEED"]+".json")
          d=json.loads(p.read_text())
          assert d["status"]=="GEOLOGICAL_OCEANIC_CONTINENTAL_OBSERVED_FLORAL_ASSEMBLY_AND_ENDEMIC_PROXY"
          assert d["n_original_all_928_Direct_island_floras"]==928
          assert d["original_global_direct_species_complete"]==2234
          assert d["independent_archived_geology_label_counts"]["continental"]>=150
          assert d["independent_archived_geology_label_counts"]["oceanic"]>=200
          assert d["no_raw_island_species_or_geological_row_exported"]
          assert d["analysis"]["candidate_GIFT_native_mainland_checklist_not_actual_propagule_source"]
          assert d["analysis"]["endemic_source_congener_comparison_is_not_adaptation_or_sister_phylogeny"]
          assert d["analysis"]["geography_ancillary_Roeble_vs_Zizka_geology_not_LGM"]
          assert not any('"'+k+'"' in p.read_text() for k in (
            "island_id","accepted_species","entity_ID","work_species",
            "spatial_block","source_signature","native_l3_codes",
            "tdwg_l3_code","source_genus","source_family",
            "geological_reference","geological_record_id",
            "island_latitude","island_longitude"))
          print("ORIGINAL OCEANIC/CONTINENTAL SOURCE ASSEMBLY AUDIT COMPLETE")
          PY
      - name: Upload only rights-safe regional geological origin assembly aggregate (not crosswalk)
        uses: actions/upload-artifact@v4
        with:
          name: fd-geological-assembly-${{ matrix.seed }}-${{ github.run_id }}
          path: /tmp/fd-original-wcvp-native/anonymous_geology_assembly_${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90
