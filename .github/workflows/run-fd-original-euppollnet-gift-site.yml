name: fd original GIFT 4505 EuPPollNet exact European field-network guild source test
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - .github/workflows/run-fd-original-euppollnet-gift-site.yml
      - scripts/run_fd_original_euppollnet_gift_sites.py
permissions:
  contents: read
  actions: read
jobs:
  original_european_field_site:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-original-euppollnet-gift4505
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact GIFT source and original European field network dependencies
        run: python -m pip install -q numpy pandas scipy pytest requests "geopandas>=1.0" "shapely>=2" "pyogrio>=0.9"
      - name: Checkout frozen original EuPPollNet study/site animal and morphological source logic
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/full4505-local-visitor-guild-20261118
          path: work/fd
          persist-credentials: false
      - name: Assert independent source site study taxonomy and accepted GIFT species masks on synthetic data
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src:scripts" python -m pytest -q \
            work/fd/tests/test_euppollnet_public_preflight.py \
            work/fd/tests/test_euppollnet_gift_exact_site_bridge.py \
            work/fd/tests/test_fullframe_wol_network_bridge.py
          python -m compileall -q \
            scripts/run_fd_original_euppollnet_gift_sites.py \
            work/fd/src/fd/euppollnet_gift_exact_site_bridge.py
          git -C work/fd rev-parse HEAD
      - name: Restore original SHA-verified GIFT 4505 botanical flora and high-medium species Direct flower traits
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Restore independently authenticated exact original GIFT GSHHG source island polygons
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/gshhg"
          gh run download 43162949729 --repo zuizui0223/island --name fd-globi-revalidated-exact-gshhg-43162949729 --dir "$STAGE/gshhg"
          GSHHG_GPKG="$(find "$STAGE/gshhg" -name 'original_gshhg_v237_h_candidate21_exact_shared_ids.gpkg' -type f -print -quit)"
          GSHHG_RECEIPT="$(find "$STAGE/gshhg" -name 'original_gshhg_geometry_receipt.json' -type f -print -quit)"
          test -s "$GSHHG_GPKG" && test -s "$GSHHG_RECEIPT"
          echo "GSHHG_GPKG=$GSHHG_GPKG" >> "$GITHUB_ENV"
          echo "GSHHG_RECEIPT=$GSHHG_RECEIPT" >> "$GITHUB_ENV"
      - name: Rebuild source independent GIFT region provenance and original geography
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geography"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Evaluate accepted source European 54 original field study sites on SHA-verified GIFT island polygons
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src:scripts" python scripts/run_fd_original_euppollnet_gift_sites.py \
            --original-root "$ORIGINAL_ROOT" \
            --original-gshhg-geometry "$GSHHG_GPKG" \
            --original-geometry-receipt "$GSHHG_RECEIPT" \
            --original-geography "$STAGE/geography/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_original_euppollnet_gift_field_network.json"
          python - <<'PY'
          from pathlib import Path
          import os,json
          f=Path(os.environ["STAGE"])/"anonymous_original_euppollnet_gift_field_network.json"
          raw=f.read_text();q=json.loads(raw)
          assert q["parent_botanical_source_floras"]==4505
          assert q["original_GIFT_source_geometry_coverage"]["n_original_island_floras_with_exact_hash_rebuilt_polygon"]==4499
          assert q["original_european_source_interaction_count_before_quality_gate"]==623476
          assert q["source_published_positive_visitor_record_not_effective_pollination"]
          assert q["no_cross_provider_duplicate_study_independence_inferred"]
          forbidden=("accepted_species","island_id","network_id","latitude","longitude","reference_id","site_id")
          assert not any('"'+key+'"' in raw for key in forbidden)
          print("Source GIFT 4505 accepted island floras × European original study network-site taxonomy gates COMPLETE")
          PY
      - name: Archive only source-anonymous original European study/site and same-species true flower positive guild support
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-GIFT-euppollnet-study-site-${{ github.run_id }}
          path: /tmp/fd-original-euppollnet-gift4505/anonymous_original_euppollnet_gift_field_network.json
          retention-days: 90
          if-no-files-found: error
