name: fd full GIFT 4505 exact source GloBI two-Direct-axis island visitor audit
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_original_full4505_globi_guild.py
      - .github/workflows/run-fd-original-full4505-globi-locality.yml
permissions:
  contents: read
  actions: read
jobs:
  original-global-source-guild-support:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-GIFT-4505-GloBI-source
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source taxonomic / original GSHHG geometry dependencies
        run: python -m pip install -q numpy pandas scipy pytest requests "geopandas>=1.0" "shapely>=2" "pyogrio>=0.9"
      - name: Retrieve pinned FD original true morphology and exact source-site test implementation
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/full4505-local-visitor-guild-20261118
          path: work/fd
          persist-credentials: false
      - name: Verify independent original plant/site/no-pseudoabsence regression suite
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src:scripts" pytest -q work/fd/tests/test_fullframe_globi_local_support.py work/fd/tests/test_fullframe_wol_network_bridge.py tests/test_fd_globi_macro_928_locality_v09.py tests/test_fd_globi_species_shift_v09.py
          python -m compileall -q scripts/run_fd_original_full4505_globi_guild.py work/fd/src/fd/fullframe_globi_local_support.py
          git -C work/fd rev-parse HEAD
      - name: Reconstruct independent original GIFT full 4505 accepted botanical source evidence
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Recover source-SHA verified original GSHHG exact-hash 4505 botanical polygons
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/gshhg"
          gh run download 43162949729 --repo zuizui0223/island --name fd-globi-revalidated-exact-gshhg-43162949729 --dir "$STAGE/gshhg"
          GSHHG_GPKG="$(find "$STAGE/gshhg" -name 'original_gshhg_v237_h_candidate21_exact_shared_ids.gpkg' -type f -print -quit)"
          GSHHG_RECEIPT="$(find "$STAGE/gshhg" -name 'original_gshhg_geometry_receipt.json' -type f -print -quit)"
          test -s "$GSHHG_GPKG" && test -s "$GSHHG_RECEIPT"
          echo "GSHHG_GPKG=$GSHHG_GPKG" >> "$GITHUB_ENV"
          echo "GSHHG_RECEIPT=$GSHHG_RECEIPT" >> "$GITHUB_ENV"
      - name: Rebuild GIFT published independent geography and original climate regime source
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geography"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Download exactly original archived 2026-06 GloBI v0.9 relationship stream
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/GloBI"
          curl -fLSs --retry 5 --retry-all-errors --max-time 1400 --output "$STAGE/GloBI/interactions.tsv.gz" "https://zenodo.org/records/20546682/files/interactions.tsv.gz?download=1"
          echo "095e57398420d1e0746e61233c796beedcfb8e03bd0c6a732aa17ae62043bd17  $STAGE/GloBI/interactions.tsv.gz" | sha256sum --check --strict
      - name: Source-replay 928/927/552 baseline then evaluate full 4505 island exact positive guild links
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src:scripts" python scripts/run_fd_original_full4505_globi_guild.py --original-root "$ORIGINAL_ROOT" --globi-original-tsv-gz "$STAGE/GloBI/interactions.tsv.gz" --original-gshhg-geometry "$GSHHG_GPKG" --original-geometry-receipt "$GSHHG_RECEIPT" --original-geography "$STAGE/geography/island_origin_crosswalk.csv" --output "$STAGE/anonymous_full4505_GloBI_real_flower_pair_guild.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          raw=(Path(os.environ["STAGE"])/"anonymous_full4505_GloBI_real_flower_pair_guild.json").read_text()
          r=json.loads(raw)
          assert r["status"]=="ORIGINAL_FULL_4505_GIFT_TRUE_PAIR_GLOBI_CITED_LOCAL_GUILD_OPPORTUNITY"
          assert r["n_original_parent_GIFT_botanical_island_floras"]==4505
          assert r["n_original_GloBI_rows_checked"]==24577183
          assert r["geometry_original_biological_source"]["n_original_island_floras_with_exact_hash_rebuilt_polygon"]==4499
          assert r["old_928_locality_species_source_replay"]["replay_passed"]
          assert r["original_site_plant_real_morphological_guild_support"]["n_source_positive_original_island_plant_pairs"]>=552
          assert r["biodiversity_and_pollinator_limitation"]["no_pollination_efficiency_seedset_or_historical_guild_shift"]
          for k in ("accepted_species","island_id","reference_id","provider_id","latitude","longitude","visitor_species"):
              assert '"'+k+'"' not in raw
          print("Source-backed 4505 GloBI site-local positive flower–guild documentary eligibility verified; no pseudoabsences")
          PY
      - name: Archive anonymous source original active flower visitor support only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-full4505-GloBI-real-flower-guild-${{ github.run_id }}
          path: /tmp/fd-GIFT-4505-GloBI-source/anonymous_full4505_GloBI_real_flower_pair_guild.json
          if-no-files-found: error
          retention-days: 90
