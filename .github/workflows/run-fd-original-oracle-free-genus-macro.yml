name: fd original GIFT 4505 genus-oracle-free regional floral profile prediction
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/fd_global_original_oracle_free_genus_mix.py
      - tests/test_fd_global_original_oracle_free_genus_mix.py
      - .github/workflows/run-fd-original-oracle-free-genus-macro.yml
permissions:
  contents: read
  actions: read
jobs:
  original_4505_floral_profile_without_focal_genus:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-GIFT4505-oraclefree-flora-pool
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original botanical source and grouped statistical runtime
        run: python -m pip install -q numpy pandas scipy pytest
      - name: Test no focal genus oracle, source genus weights, source trait disjointness and valid negative scores
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python -m pytest -q \
            tests/test_fd_global_original_oracle_free_genus_mix.py \
            tests/test_fd_global_geo_source_training_holdout.py \
            tests/test_fd_interregional_genus_name_exclusive_transfer.py
          python -m compileall -q scripts/fd_global_original_oracle_free_genus_mix.py
          git rev-parse HEAD
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore original FULL 4505 GIFT flora / species-Direct traits / first candidate mainland source with fixed SHA
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 \
            --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "8a9d79c698afa20e611663adb884c8caf648e1a3836853fad94e6a0cd6facb44  $ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Recreate independent GSHHG 10 degree blocks and GIFT candidate mainland potential source geography
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Predict all 13 original true Direct island floras WITHOUT observing the target island botanical genus roster
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python -u scripts/fd_global_original_oracle_free_genus_mix.py \
            --original-root "$ORIGINAL_ROOT" \
            --geography "$STAGE/geography/island_origin_crosswalk.csv" \
            --nboot 499 \
            --output "$STAGE/anonymous_original_4505_oraclefree_genus_mixture.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["STAGE"])/"anonymous_original_4505_oraclefree_genus_mixture.json"
          raw=p.read_text()
          x=json.loads(raw)
          assert x["status"]=="ORIGINAL_GIFT_4505_NO_FOCAL_GENUS_ORACLE_GEOGRAPHIC_HOLDOUT_FLORAL_PROFILES"
          assert x["n_original_botanical_island_floras"]==4505
          assert x["n_original_direct_endpoint_families"]==13
          assert x["n_actual_original_direct_endpoints_tested"]==13
          assert len(x["region_trait_status_source_group_results"])==312
          assert x["conceptual_limits"]["original_observed_focal_genus_composition_NOT_used_in_no_oracle_predictor"]
          assert x["conceptual_limits"]["original_observed_focal_genus_identity_used_ONLY_in_explicit_oracle_comparator"]
          assert x["conceptual_limits"]["original_training_flora_local_genus_weights_learned_from_source_DIRECT_SPECIES_COUNTS_not_actual_island_colonization"]
          assert x["conceptual_limits"]["source_plant_direct_states_from_other_GIFT_ISLANDS_not_independent_MAINLAND_ancestors"]
          for key in ("island_id","accepted_species","entity_ID","spatial_block",
                      "source_cluster","latitude","longitude","source_genus"):
              assert '"'+key+'"' not in raw
          print("Oracle-free external category donor / region-only prior source comparison on FULL 4505 GIFT original parent PASS")
          PY
      - name: Archive only anonymous GIFT global floral genus-oracle-free study-level predictive score and source dropout
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-4505-oraclefree-genus-pool-${{ github.run_id }}
          path: /tmp/fd-GIFT4505-oraclefree-flora-pool/anonymous_original_4505_oraclefree_genus_mixture.json
          if-no-files-found: error
          retention-days: 90
