name: fd original true paired syndrome architecture genus accounting 4505 GIFT floras
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_real_joint_genus_accounting.py
      - .github/workflows/run-fd-real-joint-genus-accounting.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-sha-locked:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-joint-genus-syndrome
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data and exact genus scientific packages
        run: python -m pip install -q pandas numpy scipy pytest
      - name: Checkout unmerged real two-trait pair and exact genus aggregation library
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Validate real same-species pair and exact genus math tests
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q \
            work/fd/tests/test_real_joint_syndrome_access.py \
            work/fd/tests/test_real_joint_genus_accounting.py
          PYTHONPATH="scripts:work/fd/src" python -m pytest -q \
            tests/test_fd_source_genus_exact_modes.py \
            tests/test_fd_direct_source_genus_accounting.py
          python -m compileall -q \
            scripts/run_fd_real_joint_genus_accounting.py \
            work/fd/src/fd/real_joint_genus_accounting.py
          git -C work/fd rev-parse HEAD
      - name: Restore exact source frozen Direct flower plants and GIFT accepted island native rosters
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 \
            --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Rebuild original independently published GSHHG island region and blocks
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geography"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Execute original all 4505 same-species morphological architecture by genus source modes
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd/src" python \
            scripts/run_fd_real_joint_genus_accounting.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geography/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_joint_syndrome_genus_4505.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ["STAGE"])/"anonymous_joint_syndrome_genus_4505.json"
          raw=f.read_text()
          z=json.loads(raw)
          assert z["status"]=="ORIGINAL_4505_REAL_SYNDROME_PAIR_SOURCE_GENUS_PARTITION"
          assert z["n_original_GIFT_botanical_islands"]==4505
          assert z["mainland_GIFT_native_source_entities"]==748
          assert z["n_original_island_scope_true_pair_rows"]==4505*3*3
          assert z["n_regional_scope_true_pair_panels"]==5*3*3
          assert z["limits"]["same_species_binary_joint_state_only"]
          assert not any('"'+k+'"' in raw for k in (
              "island_id","accepted_species","work_species","entity_ID",
              "spatial_block","source_signature","source_genus","latitude",
              "longitude","taxon_id","GBIF_id","source_family"))
          print("Original non-identifying true syndrome-pair by genus source audit passed")
          PY
      - name: Upload anonymous joint-architecture genus source accounting
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-4505-real-syndrome-genus-${{ github.run_id }}
          path: /tmp/fd-joint-genus-syndrome/anonymous_joint_syndrome_genus_4505.json
          if-no-files-found: error
          retention-days: 90
