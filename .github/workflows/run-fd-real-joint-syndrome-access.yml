name: fd original 4505 true within-species floral syndrome-access pair and coupling source audit
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_real_joint_syndrome_access.py
      - .github/workflows/run-fd-real-joint-syndrome-access.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-direct-true-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-real-true-syndrome-joints
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analytical runtime
        run: python -m pip install -q pandas numpy scipy pytest
      - name: Checkout original fd true-joint code
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Test real plant pair identity, finite fixed-marginal expectation, no invented trait and full island strata
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_real_joint_syndrome_access.py
          python -m compileall -q scripts/run_fd_real_joint_syndrome_access.py work/fd/src/fd/real_joint_syndrome_access.py
          git -C work/fd rev-parse HEAD
      - name: Restore original frozen GIFT botanical floras and species-Direct trait archive
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 \
            --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Rebuild independently published GSHHG island geography
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geography"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Run original source-qualified same-accepted-species flower pairing and colour/architecture audit
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd/src" python scripts/run_fd_real_joint_syndrome_access.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geography/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_original_true_joint_syndrome_access.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          f=Path(os.environ["STAGE"])/"anonymous_original_true_joint_syndrome_access.json"
          raw=f.read_text()
          z=json.loads(raw)
          assert z["status"]=="ORIGINAL_4505_GIFT_REAL_PAIRED_SYNDROME_ACCESS_SOURCE"
          assert z["n_full_original_botanical_islands"]==4505
          assert z["n_original_climate10_covered_botanical_floras"]==4485
          assert z["n_original_748_mainland_source_entities"]==748
          assert z["n_original_island_scope_joint_sector_rows"]==4505*3*9
          assert z["n_source_mode_provenance_region_panels"]==5*3*9
          assert z["limits"]["marginal_flower_traits_never_multiplied_across_different_plants"]
          assert z["limits"]["no_guild_identity_predicted_from_morphology"]
          assert not any('"'+k+'"' in raw for k in (
              "island_id","accepted_species","source_signature","spatial_block",
              "work_species","entity_ID","latitude","longitude","source_genus",
              "source_family","observer_id","GBIF_id","photo_id"))
          print("Original 4505 true flower species pair and independent source modes verified")
          PY
      - name: Upload only anonymous original region and real paired-phenotype source results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-4505-true-floral-syndrome-pairs-${{ github.run_id }}
          path: /tmp/fd-real-true-syndrome-joints/anonymous_original_true_joint_syndrome_access.json
          if-no-files-found: error
          retention-days: 90
