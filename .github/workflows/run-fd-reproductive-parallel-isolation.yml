name: fd original separate SC and autonomous selfing isolation
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-reproductive-parallel-isolation.yml, scripts/fd_reproductive_parallel_isolation.py, tests/test_fd_reproductive_parallel_isolation.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest
      - name: Check original strict SC versus autonomous selfing labels and per-genus opportunity
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_reproductive_parallel_isolation.py tests/test_fd_directional_flower_isolation_gradients.py
          python -m compileall -q scripts/fd_reproductive_parallel_isolation.py scripts/fd_directional_flower_isolation_gradients.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Rebuild independently published geological source crosswalk
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Estimate strict original SC and autonomous selfing source-trait frequencies per isolation doubling
        run: |
          set -euo pipefail
          python scripts/fd_reproductive_parallel_isolation.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology "$STAGE/geography/island_origin_crosswalk.csv" \
            --n-boot 999 \
            --output "$STAGE/anonymous_fd_reproductive_parallel_isolation.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["STAGE"])/"anonymous_fd_reproductive_parallel_isolation.json").read_text())
          assert q["status"]=="ORIGINAL_SEPARATE_SELF_COMPATIBILITY_AND_AUTONOMOUS_SELFING_ISOLATION"
          assert q["n_original_botanical_islands"]==4505
          assert len(q["source_original_strict_binary_ontology"])==2
          assert len(q["original_regional_reproductive_shares_and_genus_isolation"])==16
          assert q["claims"]["self_compatibility_not_equated_to_autonomous_self_fertilization"]
          assert q["claims"]["delayed_and_variable_categories_excluded_not_recoded_as_absent"]
          print("Original SC and autonomous selfing separate category isolation validated")
          PY
      - name: Export only anonymous descriptive regional/profile aggregate
        uses: actions/upload-artifact@v4
        with:
          name: fd-reproductive-parallel-isolation-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_fd_reproductive_parallel_isolation.json
          if-no-files-found: error
          retention-days: 30
