name: FD own GBIF reproductive capacity space
on:
  push:
    branches:
      - analysis/fd-self-db-integration-20261125
    paths:
      - scripts/fd_self_db_capacity_space.py
      - tests/test_fd_self_db_capacity_space.py
      - .github/workflows/run-fd-self-db-capacity-space.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  own-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 660036d934045a885fc129fb8209385de080e4b5
          path: own-occurrence
          sparse-checkout: data/v2/staging/gbif/collected/island_species_occurrences.csv.gz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test own-data metric and exact expectations
        run: |
          pip install -e ".[dev]"
          PYTHONPATH=.:src python -m pytest -q tests/test_fd_self_db_capacity_space.py
      - name: Restore verified trait ledger only
        run: |
          set -euo pipefail
          ROOT=/tmp/fd-capacity
          mkdir -p "$ROOT/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$ROOT/original"
          LEDGER="$(find "$ROOT/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER"
          echo "FD_LEDGER=$LEDGER" >> "$GITHUB_ENV"
          ROSTER=own-occurrence/data/v2/staging/gbif/collected/island_species_occurrences.csv.gz
          test "$(git hash-object "$ROSTER")" = d311557334579a7efbef838cc01f927339d16f77
          echo "FD_ROSTER=$ROSTER" >> "$GITHUB_ENV"
      - name: Own raw GBIF morphology and reproductive-capacity support
        run: |
          PYTHONPATH=.:src python scripts/fd_self_db_capacity_space.py \
            --roster "$FD_ROSTER" \
            --ledger "$FD_LEDGER" \
            --geography results/geography_20260924/corrected_geography_covariates.csv \
            --output /tmp/fd-capacity/anonymous_capacity_space.json
      - uses: actions/upload-artifact@v4
        with:
          name: fd-own-gbif-capacity-space-${{ github.run_id }}
          path: /tmp/fd-capacity/anonymous_capacity_space.json
          if-no-files-found: error
          retention-days: 90
