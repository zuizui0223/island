name: FD own GBIF category and volume atlas
on:
  push:
    branches:
      - analysis/fd-self-db-integration-20261125
    paths:
      - scripts/fd_self_db_category_atlas.py
      - tests/test_fd_self_db_category_atlas.py
      - .github/workflows/run-fd-self-db-category-atlas.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 660036d934045a885fc129fb8209385de080e4b5
          path: own-occurrence
          sparse-checkout: data/v2/staging/gbif/collected/island_species_occurrences.csv.gz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test exact partition and conditional category null
        run: |
          pip install -e ".[dev]"
          PYTHONPATH=.:src python -m pytest -q tests/test_fd_self_db_category_atlas.py tests/test_fd_self_db_capacity_space.py
      - name: Restore verified own Direct ledger only
        run: |
          set -euo pipefail
          mkdir -p /tmp/fd-atlas/original
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir /tmp/fd-atlas/original
          LEDGER="$(find /tmp/fd-atlas/original -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER"
          echo "FD_LEDGER=$LEDGER" >> "$GITHUB_ENV"
          ROSTER=own-occurrence/data/v2/staging/gbif/collected/island_species_occurrences.csv.gz
          test "$(git hash-object "$ROSTER")" = d311557334579a7efbef838cc01f927339d16f77
          echo "FD_ROSTER=$ROSTER" >> "$GITHUB_ENV"
      - name: Run own-DB categorical structure and reproductive partition
        run: |
          PYTHONPATH=.:src python -u scripts/fd_self_db_category_atlas.py \
            --roster "$FD_ROSTER" --ledger "$FD_LEDGER" \
            --geography results/geography_20260924/corrected_geography_covariates.csv \
            --output /tmp/fd-atlas/anonymous_category_atlas.json
      - uses: actions/upload-artifact@v4
        with:
          name: fd-own-gbif-category-atlas-${{ github.run_id }}
          path: /tmp/fd-atlas/anonymous_category_atlas.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive only aggregate result on integration branch
        if: github.ref == 'refs/heads/analysis/fd-self-db-integration-20261125'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          src=Path('/tmp/fd-atlas/anonymous_category_atlas.json')
          raw=src.read_bytes(); d=json.loads(raw)
          assert d['no_row_level_export'] and d['no_GIFT_tables'] and d['roster_rows']==1039757
          forbidden={'island_id','accepted_species','genus_id','latitude','longitude','species_name','spatial_block'}
          def check(x):
              if isinstance(x,dict):
                  assert not (set(x)&forbidden)
                  for v in x.values(): check(v)
              elif isinstance(x,list):
                  for v in x: check(v)
          check(d)
          root=Path('results/fd_self_db_20261125')
          (root/'own_gbif_category_atlas.json').write_bytes(raw)
          (root/'own_gbif_category_atlas_receipt.json').write_text(json.dumps({'run_id':${{ github.run_id }},'source_commit':'${{ github.sha }}','json_sha256':sha256(raw).hexdigest()},indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/fd_self_db_20261125/own_gbif_category_atlas.json results/fd_self_db_20261125/own_gbif_category_atlas_receipt.json
          git commit -m "Archive own GBIF category atlas and exact volume partitions"
          git push origin HEAD:analysis/fd-self-db-integration-20261125
