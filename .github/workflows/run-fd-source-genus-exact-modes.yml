name: fd original 4505 paired geo5 climate10 exact four-term genus flower partition
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_source_genus_exact_modes.py
      - .github/workflows/run-fd-source-genus-exact-modes.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-modes-genus-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-exact-genus-source-modes
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source/finite genus exact reproducibility dependencies
        run: python -m pip install -q pandas numpy scipy pytest
      - name: Checkout separately committed fd four-part signed source accounting
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Validate exact signed genus arithmetic, missing source and 4505 full-frame tests
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q \
            work/fd/tests/test_source_genus_exact_partition_modes.py
          PYTHONPATH=scripts python -m pytest -q \
            tests/test_fd_direct_source_genus_accounting.py
          python -m compileall -q \
            work/fd/src/fd/source_genus_exact_partition_modes.py \
            scripts/run_fd_source_genus_exact_modes.py
          git -C work/fd rev-parse HEAD
      - name: Restore source SHA-verified original 4505 accepted GIFT floras and Direct plant traits
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Rebuild independently sourced original GSHHG island geography and physical blocks
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geography"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Execute original botanical fixed-island signed genus identity and within-state exact decomposition
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd/src" python \
            scripts/run_fd_source_genus_exact_modes.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geography/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_original_exact_four_term_genus.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ["STAGE"])/"anonymous_original_exact_four_term_genus.json"
          raw=f.read_text()
          z=json.loads(raw)
          assert z["status"]=="ORIGINAL_GIFT_4505_GEO5_CLIMATE10_EXACT_SIGNED_GENUS_PARTITION"
          assert z["n_original_botanical_floras"]==4505
          assert z["n_original_private_island_scope_sector_cells"]==4505*4*5
          assert z["n_region_scope_sector_panels"]==100
          assert z["real_original_GIFT_source_entities"]==748
          assert z["scientific_limits"]["signed_terms_can_cancel_and_are_not_causal_shares"]
          protected=("island_id","accepted_species","entity_ID","work_species",
                     "source_signature","spatial_block","source_region_id",
                     "latitude","longitude","GBIF_id","taxon_id",
                     "source_genus","source_family")
          assert not any('"'+k+'"' in raw for k in protected)
          print("Original GIFT source mode genus decomposition and privacy checks SUCCESS")
          PY
      - name: Upload only anonymous signed genus identity and morphology comparisons
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-4505-exact-genus-4parts-${{ github.run_id }}
          path: /tmp/fd-exact-genus-source-modes/anonymous_original_exact_four_term_genus.json
          if-no-files-found: error
          retention-days: 90
