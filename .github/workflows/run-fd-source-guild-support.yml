name: fd original 4505 flower source and GBIF guild interaction support
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_source_guild_support.py
      - .github/workflows/run-fd-source-guild-support.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-guild-support:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-source-guild-support
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original source categorical audit dependencies
        run: python -m pip install -q pandas numpy scipy pytest
      - name: Checkout source-tested unmerged fd support gate
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Test strict original disrupted-nondetection semantics and fail-closed support gates
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_source_guild_support.py
          python -m compileall -q work/fd/src/fd/source_guild_support.py scripts/run_fd_source_guild_support.py
          git -C work/fd rev-parse HEAD
      - name: Restore source-hash-frozen GIFT 4505 original Direct and native mainland flora
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Restore independently published Roeble/Zizka physical 10-degree-block geography
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geography"
          PYTHONPATH=work/fd/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Restore independently qualified exact-island GBIF channel evidence
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/guild"
          gh run download 34750153702 --repo zuizui0223/island --name chapter1-nee-channel-qualification-34750153702 --dir "$STAGE/guild"
          GUILD_EVIDENCE="$(find "$STAGE/guild" -name nee_projected_channel_state.csv -type f -print -quit)"
          test -n "$GUILD_EVIDENCE" && test -s "$GUILD_EVIDENCE"
          echo "GUILD_EVIDENCE=$GUILD_EVIDENCE" >> "$GITHUB_ENV"
      - name: Execute real original source × guild × Direct sector positivity and source-only composition audit
        run: |
          set -euo pipefail
          PYTHONPATH="scripts:work/fd/src" python scripts/run_fd_source_guild_support.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology-crosswalk "$STAGE/geography/island_origin_crosswalk.csv" \
            --channel-evidence-csv "$GUILD_EVIDENCE" \
            --output "$STAGE/anonymous_original_source_guild_support.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ["STAGE"])/"anonymous_original_source_guild_support.json"
          obj=json.loads(f.read_text())
          assert obj["status"]=="SOURCE_GUILD_FUNCTIONAL_SECTOR_POSITIVITY_ORIGINAL_4505"
          assert obj["original_global_botanical_flora_population"]==4505
          assert obj["original_mainland_source_region_entities"]==748
          assert obj["n_original_joint_trait_states_imputed"]==0
          assert obj["guild_support"]["n_unique_islands_in_input"]==4505
          assert obj["guild_support"]["no_guild_effect_estimated"]
          assert obj["n_source_island_guild_sector_rows_private"]==4505*5*5
          text=f.read_text()
          assert not any('"'+k+'"' in text for k in (
            "island_id","accepted_species","entity_ID","work_species","source_signature",
            "spatial_block","source_region_id","longitude","latitude","GBIF_id",
            "taxon_id","source_genus","source_family"))
          print("Protected original source/guild validation passed; anonymized outputs only")
          PY
      - name: Release only aggregated regime × guild × morphological sector support and source-only results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-4505-source-guild-support-${{ github.run_id }}
          path: /tmp/fd-source-guild-support/anonymous_original_source_guild_support.json
          if-no-files-found: error
          retention-days: 90
