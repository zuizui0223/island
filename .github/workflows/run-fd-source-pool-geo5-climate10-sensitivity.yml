name: fd original geo5 versus climate10 native mainland source genus sensitivity
on:
  workflow_dispatch:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths: [.github/workflows/run-fd-source-pool-geo5-climate10-sensitivity.yml, scripts/fd_source_pool_geographic_climate_sensitivity.py, tests/test_fd_source_pool_geographic_climate_sensitivity.py]
permissions:
  contents: read
  actions: read
jobs:
  exact-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: /tmp/fd-floral-beta
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact sparse scientific runtime
        run: python -m pip install -q numpy scipy pandas pytest
      - name: Test actual climate-ranked GIFT source country-km proximity and matched-island source sensitivity
        run: |
          set -euo pipefail
          PYTHONPATH=scripts pytest -q tests/test_fd_source_pool_geographic_climate_sensitivity.py tests/test_fd_direct_source_distance_conditioned_genus_null.py
          python -m compileall -q scripts/fd_source_pool_geographic_climate_sensitivity.py scripts/fd_direct_source_distance_conditioned_genus_null.py
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: c8ad76798fd84635ff5014dc781741c43492e936
          path: work/fd-reference
          persist-credentials: false
      - name: Restore SHA-locked GIFT floral sources and independent saved baseline
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original" "$STAGE/baseline" "$STAGE/geography"
          gh run download 34232450884 --repo zuizui0223/island \
            --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          gh run download 43586977772 --repo zuizui0223/island \
            --name fd-original-full-global-partial-FD-20261114-43586977772 --dir "$STAGE/baseline"
          BASELINE="$(find "$STAGE/baseline" -name anonymous_original_partial_fd_20261114.json -type f -print -quit)"
          test -n "$BASELINE" && test -s "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Rebuild independently published geological source crosswalk
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd-reference/src python -c 'from pathlib import Path; import os; from fd.origin import run_crosswalk; run_crosswalk(Path(os.environ["STAGE"])/"geography")'
          test -s "$STAGE/geography/island_origin_crosswalk.csv"
      - name: Check original 4505 GIFT mainland source geographic-nearest5 vs climate-nearest10 genus null on same islands
        run: |
          set -euo pipefail
          python scripts/fd_source_pool_geographic_climate_sensitivity.py \
            --original-root "$ORIGINAL_ROOT" \
            --geology "$STAGE/geography/island_origin_crosswalk.csv" \
            --output "$STAGE/anonymous_fd_geo5_climate10_source_genus.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["STAGE"])/"anonymous_fd_geo5_climate10_source_genus.json").read_text())
          assert q["status"]=="ORIGINAL_4505_GEOGRAPHIC5_VS_CLIMATE10_GIFT_SOURCE_POOL_SENSITIVITY"
          assert q["n_original_botanical_GIFT_island_floras"]==4505
          assert q["n_original_climate10_source_matched_botanical_island_floras"]==4485
          assert q["n_original_independent_gift_source_assignment_rows_by_mode"]=={
              "geo_k5":41325,"geo50_climate10":82190}
          assert sum(x["n_original_botanical_floras"] for x in q["original_complete_GSHHG_plant_region_population"])==4505
          assert q["n_original_mainland_GIFT_source_entities"]==748
          assert q["n_original_Direct_trait_only_island_eligibility_masks"]==7
          assert len(q["original_alternate_mainland_source_genus_null_results"])==100
          assert len(q["original_same_island_geographic_vs_climate_source_mode_differences"])==50
          assert q["claims"]["paired_source_mode_comparison_uses_same_original_island_ID_but_different_candidate_taxa"]
          assert q["claims"]["no_actual_arrival_success_plant_adaptation_or_pollinator_service_inferred"]
          print("Original true GIFT candidate source mode selection robustness audited")
          PY
      - name: Export only anonymous descriptive regional/profile aggregate
        uses: actions/upload-artifact@v4
        with:
          name: fd-direct-three-stage-floristic-${{ github.run_id }}
          path: /tmp/fd-floral-beta/anonymous_fd_geo5_climate10_source_genus.json
          if-no-files-found: error
          retention-days: 30
