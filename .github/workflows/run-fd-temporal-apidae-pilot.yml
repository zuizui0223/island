name: fd prospective GBIF Apidae two-window exact-island pilot

on:
  push:
    branches:
      - analysis/fd-functional-guild-impact-20261113
    paths:
      - 'scripts/run_fd_gbif_temporal_apidae_pilot.py'
      - '.github/workflows/run-fd-temporal-apidae-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  temporal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STAGE: /tmp/fd-island-temporal
      PYTHONPATH: "src:work/fd/src"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout original source-pinned island analysis branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact geometry and source-safe statistical tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pytest httpx pyyaml typer "geopandas>=1.0" "shapely>=2" "pyogrio>=0.9"
      - name: Checkout related fd pending functional diversity analysis
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/pollinator-loss-functional-assembly-20261113
          path: work/fd
          persist-credentials: false
      - name: Validate pure fixed-cohort, temporal and fail-closed safeguards
        run: |
          set -euo pipefail
          python -m pytest -q work/fd/tests/test_gbif_temporal_opportunity.py
          python -m compileall -q work/fd/src/fd/gbif_temporal_opportunity.py scripts/run_fd_gbif_temporal_apidae_pilot.py
          git -C work/fd rev-parse HEAD
      - name: Restore original rights-restricted Direct flora and geography checkpoint
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/original-unpacked"
              unzip -q "$NESTED" -d "$STAGE/original-unpacked"
              LEDGER="$(find "$STAGE/original-unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER" && test -s "$LEDGER"
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
          echo "Original outcome-blind Direct flora and geography recovered (IDs remain private)"
      - name: Recover original-GSHHG WKB-hash matched polygon source
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/geometry"
          gh run download 43162949729 --repo zuizui0223/island \
            --name fd-globi-revalidated-exact-gshhg-43162949729 \
            --dir "$STAGE/geometry"
          ORIGINAL_GPKG="$(find "$STAGE/geometry" -name 'original_gshhg_v237_h_candidate21_exact_shared_ids.gpkg' -type f -print -quit)"
          ORIGINAL_RECEIPT="$(find "$STAGE/geometry" -name 'original_gshhg_geometry_receipt.json' -type f -print -quit)"
          test -n "$ORIGINAL_GPKG" && test -s "$ORIGINAL_GPKG"
          test -n "$ORIGINAL_RECEIPT" && test -s "$ORIGINAL_RECEIPT"
          echo "ORIGINAL_GPKG=$ORIGINAL_GPKG" >> "$GITHUB_ENV"
          echo "ORIGINAL_RECEIPT=$ORIGINAL_RECEIPT" >> "$GITHUB_ENV"
          echo "Original exact island-GSHHG geometry recovered, no centroid approximations"
      - name: Scan original exact-island Apidae records in two frozen windows
        run: |
          set -euo pipefail
          python scripts/run_fd_gbif_temporal_apidae_pilot.py \
            --original-progressive-root "$ORIGINAL_ROOT" \
            --verified-gpkg "$ORIGINAL_GPKG" \
            --geometry-receipt "$ORIGINAL_RECEIPT" \
            --output "$STAGE/anonymous_gbif_temporal_feasibility.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['STAGE'])/'anonymous_gbif_temporal_feasibility.json'
          j=json.loads(p.read_text())
          assert j["fixed_islands"]==80
          assert j["windows"]=={"early":[2010,2017],"recent":[2018,2025]}
          assert j["max_records_examined_per_island_period"]==900
          assert j["no_population_decline_or_shift_inferred"] is True
          assert j["no_longitudinal_flora_or_fitness_measurement"] is True
          assert j["no_original_island_dataset_gbif_species_coordinates_exported"] is True
          assert j["GBIF_v1_search_live_snapshot_not_DOI_pinned"] is True
          assert len(j["by_regime"])==4
          forbidden=['"island_id"','"gbif_id"','"dataset_key"','"accepted_species"','"longitude"','"latitude"']
          assert all(k not in p.read_text() for k in forbidden)
          print("Original GBIF time-dependent effort feasibility audited without decline claims")
          PY
      - name: Publish ONLY anonymous regional data-support receipt
        uses: actions/upload-artifact@v4
        with:
          name: fd-gbif-temporal-feasibility-${{ github.run_id }}
          path: /tmp/fd-island-temporal/anonymous_gbif_temporal_feasibility.json
          if-no-files-found: error
          retention-days: 90
