name: fd TPL LCVP WP original WCVP true-tip native floral pairing
on:
  push:
    branches:
      - analysis/fd-discrete-functional-volume-20261113
    paths:
      - 'scripts/run_fd_true_tip_native_pairing.py'
      - 'scripts/fd_gbotb_export_private_edges.R'
      - '.github/workflows/run-fd-true-tip-native-pairing.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-dated-tree-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        tree_version: [TPL, LCVP, WP]
        seed: [20261114, 20261115]
    env:
      STAGE: /tmp/fd-original-true-tip-pairing
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      TREE_VERSION: ${{ matrix.tree_version }}
      ANALYSIS_SEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install original SciPy source-verified dated-tip functional diversity dependencies
        run: python -m pip install pandas numpy scipy pytest
      - name: Checkout fd original true-tip pairing algorithm and synthetic/source validation
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Checkout published fixed GBOTB LCVP dated original plant tree
        uses: actions/checkout@v4
        with:
          repository: jinyizju/V.PhyloMaker2
          ref: 7af3fb5152f691af2e4ec9d5e2e467d1b50505e9
          path: work/V.PhyloMaker2
          persist-credentials: false
      - name: Verify immutable phylogeny plus synthetic true-tip matching and source guard tests
        run: |
          set -euo pipefail
          echo '9ac19e04d6016c9e7ee8758524996f40a089271b2fd34371a5dbd607b5dbf2a3  work/V.PhyloMaker2/data/GBOTB.extended.TPL.rda' | sha256sum --check
          echo '30fd7e9e67bdfff427b336d3b35983f63e284ef118e91f76a7f51a884c9b4e5b  work/V.PhyloMaker2/data/GBOTB.extended.LCVP.rda' | sha256sum --check
          echo '7fc97970fcd9e69f6506b0c860b1296f4a797635193a8ce4bcb052a83fd1f965  work/V.PhyloMaker2/data/GBOTB.extended.WP.rda' | sha256sum --check
          PYTHONPATH=work/fd/src python -m pytest -q \
            work/fd/tests/test_true_backbone_phylo_distance.py \
            work/fd/tests/test_true_tip_native_pairing.py \
            work/fd/tests/test_regional_native_flora_fd.py \
            work/fd/tests/test_regional_native_provenance_volume.py
          python -m compileall -q work/fd/src/fd/true_backbone_phylo_distance.py \
            work/fd/src/fd/true_tip_native_pairing.py \
            scripts/run_fd_true_tip_native_pairing.py
      - name: Restore original protected 2234 source Direct flower traits, original GIFT
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          ARTIFACT_ID=10058653212
          SOURCE_RUN="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          SOURCE_NAME="$(gh api "repos/zuizui0223/island/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test -n "$SOURCE_RUN" && test -n "$SOURCE_NAME"
          gh run download "$SOURCE_RUN" --repo zuizui0223/island --name "$SOURCE_NAME" --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          if [ -z "$LEDGER" ]; then
            NESTED="$(find "$STAGE/original" -name '*.zip' -type f -print -quit)"
            if [ -n "$NESTED" ]; then
              mkdir -p "$STAGE/unpacked"
              unzip -q "$NESTED" -d "$STAGE/unpacked"
              LEDGER="$(find "$STAGE/unpacked" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
            fi
          fi
          test -n "$LEDGER" && test -s "$LEDGER"
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Recover independent frozen original CoL XR candidate taxonomy
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/colxr"
          gh run download 34668274725 --repo zuizui0223/island \
            --name island-plant-database-2.0.0-alpha2-taxonomy-34668274725 \
            --dir "$STAGE/colxr"
          COLXR="$(find "$STAGE/colxr" -name taxonomy_crosswalk.csv.gz -type f -print -quit)"
          test -n "$COLXR" && test -s "$COLXR"
          echo "079d9c27b0ca3aa51f0c7310f43ad4901b07a319d6063eab5a7d62b291bdd9e3  $COLXR" | sha256sum --check --strict
          echo "COLXR=$COLXR" >> "$GITHUB_ENV"
      - name: Restore independent 2026 WCVP regional-native and exact island TDWG source
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/wcvp"
          gh run download 32559322028 --repo zuizui0223/island \
            --name official-wcvp-corroborated-status-32559322028 --dir "$STAGE/wcvp"
          WCVP_STATUS="$(find "$STAGE/wcvp" -name resolved_floristic_status_ledger.csv.gz -type f -print -quit)"
          ORIGINAL_TDWG="$(find "$STAGE/wcvp" -name island_tdwg_l3_mapping.csv -type f -print -quit)"
          test -n "$WCVP_STATUS" && test -s "$WCVP_STATUS"
          test -n "$ORIGINAL_TDWG" && test -s "$ORIGINAL_TDWG"
          echo "10e7c56f1cc98c1fabc43c24cb8c456476f2ae057dacaa61aae9e635e2420ab0  $WCVP_STATUS" | sha256sum --check --strict
          echo "e28351c297ab1ca7416b50b55a99fafd2c5d4ab6c8b984761fe987e0a57953b3  $ORIGINAL_TDWG" | sha256sum --check --strict
          echo "WCVP_STATUS=$WCVP_STATUS" >> "$GITHUB_ENV"
          echo "ORIGINAL_TDWG=$ORIGINAL_TDWG" >> "$GITHUB_ENV"
      - name: Calculate exact published plant true-tip bounded colour-architecture pairing
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_true_tip_native_pairing.py \
            --original-root "$ORIGINAL_ROOT" \
            --crosswalk "$COLXR" \
            --backbone work/V.PhyloMaker2 \
            --wcvp-status "$WCVP_STATUS" --island-tdwg "$ORIGINAL_TDWG" \
            --tree-version "$TREE_VERSION" --seed "$ANALYSIS_SEED" \
            --workdir "$STAGE" \
            --output "$STAGE/anonymous_true_tip_pairing_${TREE_VERSION}_${ANALYSIS_SEED}.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["STAGE"])/(
              "anonymous_true_tip_pairing_"+os.environ["TREE_VERSION"]+"_"+
              os.environ["ANALYSIS_SEED"]+".json")
          z=json.loads(p.read_text())
          assert z["status"]=="ORIGINAL_TRUE_TIP_PHYLO_BOUNDED_NATIVE_PAIRING"
          assert z["tree_version"]==os.environ["TREE_VERSION"]
          assert z["original_eligible_islands"]==928
          assert z["n_original_Direct_triple_species"]==2234
          assert z["n_original_strict_native_eligible"]==87
          assert z["n_original_WCVP_compatible_eligible"]==357
          assert z["n_original_true_tip_source_species"]=={
              "TPL":1187,"LCVP":1162,"WP":1160}[os.environ["TREE_VERSION"]]
          assert z["original_family_source_candidate_n"]==2190
          assert z["design"]["exact_original_accepted_tip_species_only"]
          assert z["design"]["same_focal_five_plant_source_near_vs_mid_distance_bands"]
          assert z["design"]["outcome_blind_family_genus_tree_distance_source_selection"]
          assert z["design"]["WCVP_regional_native_does_not_prove_local_island_native"]
          assert z["original_restricted_source_taxa_and_dated_backbone_not_exported"]
          assert len(z["regional_conditional_phylo_pairing"])>=15
          assert any(
              r["exploratory_support_10island_5block_5source"]
              for r in z["regional_conditional_phylo_pairing"])
          assert not any('"'+k+'"' in p.read_text() for k in (
              "accepted_species","island_id","source_family","source_genus",
              "work_species","entity_ID","source_signature","spatial_block",
              "tip_label","tip_node_id","native_l3_codes","candidate_family",
              "tdwg_l3_code","family_map","longitude","latitude"))
          print("ORIGINAL PUBLISHED TRUE-TIP PAIRING SUCCEEDED: "+z["tree_version"])
          PY
      - name: Upload only anonymous true-tip pairing native status summaries
        uses: actions/upload-artifact@v4
        with:
          name: fd-original-true-tip-pairing-${{ matrix.tree_version }}-${{ matrix.seed }}-${{ github.run_id }}
          path: /tmp/fd-original-true-tip-pairing/anonymous_true_tip_pairing_${{ matrix.tree_version }}_${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90
