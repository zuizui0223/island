name: fd exact finite floral volume source-native and WCVP regional-native 928 islands
on:
  push:
    branches: [analysis/fd-discrete-functional-volume-20261113]
    paths:
      - scripts/run_fd_wcvp_regional_native_macro.py
      - .github/workflows/run-fd-wcvp-regional-native-macro.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-wcvp-native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: [20261114, 20261115]
    env:
      STAGE: /tmp/fd-original-wcvp-native
      GH_TOKEN: ${{ github.token }}
      RANDOM_SEED: ${{ matrix.seed }}
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analytic discrete profile reference runtime
        run: python -m pip install pandas numpy scipy pytest
      - name: Checkout unmerged fd analytical module and original tests
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fd
          ref: analysis/discrete-functional-hypervolume-20261113
          path: work/fd
          persist-credentials: false
      - name: Verify WCVP status safeguards and hypergeometric exact-expected volume
        run: |
          set -euo pipefail
          PYTHONPATH=work/fd/src python -m pytest -q work/fd/tests/test_regional_native_provenance_volume.py
          python -m compileall -q work/fd/src/fd/regional_native_provenance_volume.py scripts/run_fd_wcvp_regional_native_macro.py
          git -C work/fd rev-parse HEAD
      - name: Restore original frozen Direct 2234 flora and GIFT candidate mainland sources
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/original"
          gh run download 34232450884 --repo zuizui0223/island --name chapter1-progressive-analysis-34232450884 --dir "$STAGE/original"
          LEDGER="$(find "$STAGE/original" -path '*/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz' -type f -print -quit)"
          test -n "$LEDGER" && test -s "$LEDGER"
          echo "9ddac1cedf2bf6235f3b426f37688550391ee8d96586e8d6a095ea3150bbe745  $LEDGER" | sha256sum --check --strict
          ORIGINAL_ROOT="${LEDGER%/fixed/source/current/evidence/direct_only_trait_ledger.csv.gz}"
          test -s "$ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz"
          echo "6b5006322d15dd87aa3aad3b4dd050d4c6420485521be314ae511f39e05b859a  $ORIGINAL_ROOT/fixed/canonical/input/chapter1_status_flora.csv.gz" | sha256sum --check --strict
          test -s "$ORIGINAL_ROOT/fixed/isolation/results/purpose_shortest_island_data.csv"
          test -s "$ORIGINAL_ROOT/fixed/source/result/island_source_assignments.csv.gz"
          test -s "$ORIGINAL_ROOT/fixed/source/source/gift_native_mainland_flora.csv.gz"
          echo "ORIGINAL_ROOT=$ORIGINAL_ROOT" >> "$GITHUB_ENV"
      - name: Restore independent frozen official WCVP original native range and island TDWG status
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/wcvp"
          gh run download 32559322028 --repo zuizui0223/island --name official-wcvp-corroborated-status-32559322028 --dir "$STAGE/wcvp"
          STATUS="$(find "$STAGE/wcvp" -name resolved_floristic_status_ledger.csv.gz -type f -print -quit)"
          TDWG="$(find "$STAGE/wcvp" -name island_tdwg_l3_mapping.csv -type f -print -quit)"
          test -n "$STATUS" && test -s "$STATUS"
          test -n "$TDWG" && test -s "$TDWG"
          echo "10e7c56f1cc98c1fabc43c24cb8c456476f2ae057dacaa61aae9e635e2420ab0  $STATUS" | sha256sum --check --strict
          echo "e28351c297ab1ca7416b50b55a99fafd2c5d4ab6c8b984761fe987e0a57953b3  $TDWG" | sha256sum --check --strict
          echo "WCVP_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "ORIGINAL_TDWG=$TDWG" >> "$GITHUB_ENV"
      - name: Analyze exactly matched original island and native-compatible floral reference
        run: |
          set -euo pipefail
          PYTHONPATH="src:work/fd/src" python scripts/run_fd_wcvp_regional_native_macro.py \
            --original-root "$ORIGINAL_ROOT" \
            --wcvp-status "$WCVP_STATUS" --island-tdwg "$ORIGINAL_TDWG" \
            --seed "$RANDOM_SEED" --k-draws 2000 \
            --output "$STAGE/anonymous_native_flora_$RANDOM_SEED.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["STAGE"])/("anonymous_native_flora_"+os.environ["RANDOM_SEED"]+".json")
          d=json.loads(p.read_text())
          assert d["n_original_eligible_island_floras"]==928
          assert d["n_original_direct_plant_species_global"]==2234
          assert d["n_original_strict_native_eligible_islands"]==87
          assert d["n_WCVP_region_compatible_candidate_eligible_islands"]==357
          assert d["method"]["expected_reference_coverage_analytically_from_hypergeometric"]
          assert d["method"]["WCVP_TDWG_L3_is_regionally_compatible_not_exact_island_native"]
          assert d["original_source_plant_island_region_taxon_records_not_published"]
          assert not d["no_actual_pollinator_guild_change_or_pollen_service_measured"] is False
          assert not any('"'+k+'"' in p.read_text() for k in (
            "island_id","accepted_species","entity_ID","work_species",
            "spatial_block","source_signature","native_l3_codes",
            "tdwg_l3_code","family","genus","longitude","latitude"))
          print("928 island and 357 WCVP candidate native floral hypervolume source status reviewed")
          PY
      - name: Upload anonymous original regional source/physical-block statistical result only
        uses: actions/upload-artifact@v4
        with:
          name: fd-wcvp-native-flora-${{ matrix.seed }}-${{ github.run_id }}
          path: /tmp/fd-original-wcvp-native/anonymous_native_flora_${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90
