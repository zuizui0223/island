name: run_gbif_block_pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/gbif_block_pilot_v2.yml"

permissions:
  contents: read

jobs:
  submit:
    # A push starts the pilot only when the dedicated launch commit is used.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'run: submit GBIF pilot'
    runs-on: ubuntu-latest
    environment: gbif-downloads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test regional block geometry
        run: pytest -q tests/test_gbif_blocks.py
      - name: Build current five-square-kilometre island universe
        run: island-v2-gshhg build --output-dir data/v2/external/islands/gshhg
      - name: Prepare coordinate-preserving GBIF pilot requests
        run: |
          island-v2-gbif-blocks prepare \
            --islands-gpkg data/v2/external/islands/gshhg/prepared/islands_v2.gpkg \
            --output-dir data/v2/external/gbif/pilot \
            --taxon-name Tracheophyta \
            --taxon-rank PHYLUM \
            --target-scope angiosperms \
            --grid-degrees 30 \
            --max-wkt-chars 120000 \
            --max-islands-per-block 125 \
            --query-buffer-m 2000 \
            --query-simplify-m 500
      - name: Submit first three prepared GBIF block requests
        env:
          GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
          GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
        run: |
          test -n "$GBIF_USERNAME" || { echo 'GBIF_USERNAME secret is missing.' >&2; exit 2; }
          test -n "$GBIF_PASSWORD" || { echo 'GBIF_PASSWORD secret is missing.' >&2; exit 2; }
          island-v2-gbif-flora submit \
            --request-manifest data/v2/external/gbif/pilot/gbif_block_request_manifest.csv \
            --max-requests 3 \
            --sleep-seconds 2
      - name: Report submitted regional blocks
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import pandas as pd

          manifest = Path('data/v2/external/gbif/pilot/gbif_block_request_manifest.csv')
          if not manifest.exists():
              print('## GBIF pilot')
              print('Request manifest was not created.')
              raise SystemExit(0)
          table = pd.read_csv(manifest, dtype=str).fillna('')
          print('## GBIF three-block pilot')
          print(table['request_status'].value_counts().rename_axis('status').to_frame('n').to_csv())
          selected = table.loc[
              table['request_status'].isin(['submitted', 'submit_failed']),
              ['block_id', 'regional_cell', 'n_islands', 'request_status', 'download_key', 'error'],
          ]
          if not selected.empty:
              print('### Submission results')
              print('```csv')
              print(selected.to_csv(index=False), end='')
              print('```')
          PY
      - name: Upload GBIF pilot provenance and request state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-three-block-pilot-${{ github.run_id }}
          path: |
            data/v2/external/islands/gshhg/prepared/islands_v2.gpkg
            data/v2/external/islands/gshhg/prepared/island_manifest.csv
            data/v2/external/islands/gshhg/prepared/source_policy.json
            data/v2/external/gbif/pilot/gbif_block_request_manifest.csv
            data/v2/external/gbif/pilot/gbif_block_members.csv
            data/v2/external/gbif/pilot/gbif_block_taxon_resolution.json
            data/v2/external/gbif/pilot/gbif_block_policy.json
          if-no-files-found: warn
          retention-days: 90
