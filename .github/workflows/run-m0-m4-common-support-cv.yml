name: run_m0_m4_common_support_cv

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-m0-m4-common-support-cv.yml"
      - "config/m0_m4_full_analysis_artifact_lock.json"
      - "config/m0_m4_full_analysis.yml"
      - "src/island_v2/m0_m4_spatial_cv.py"
      - "src/island_v2/m0_m4_spatial_cv_common_support.py"

permissions:
  actions: read
  contents: read

jobs:
  common-support-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Compile common-support CV implementation
        run: |
          python -m py_compile \
            src/island_v2/m0_m4_spatial_cv.py \
            src/island_v2/m0_m4_spatial_cv_common_support.py

      - name: Download locked full-analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/m0_m4_full_analysis_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED=$(jq -r '.artifact_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/full-analysis.zip
          ACTUAL=$(sha256sum /tmp/full-analysis.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/full-analysis
          unzip -q /tmp/full-analysis.zip -d /tmp/full-analysis

      - name: Run identical-island identical-fold spatial CV across tiers
        run: |
          set -euo pipefail
          PRIMARY=$(find /tmp/full-analysis -path "*/primary/full_analysis_island_data.csv" -print -quit)
          BROAD=$(find /tmp/full-analysis -path "*/broad/full_analysis_island_data.csv" -print -quit)
          SENS=$(find /tmp/full-analysis -path "*/sensitivity_all/full_analysis_island_data.csv" -print -quit)
          test -n "$PRIMARY"
          test -n "$BROAD"
          test -n "$SENS"
          python -m island_v2.m0_m4_spatial_cv_common_support \
            --primary-csv "$PRIMARY" \
            --broad-csv "$BROAD" \
            --sensitivity-all-csv "$SENS" \
            --n-folds 10 \
            --repeats 5 \
            --seed 20260713 \
            --output-dir data/v2/staging/analysis/common_support_cv

      - name: Validate common-support result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('data/v2/staging/analysis/common_support_cv')
          manifest = json.loads((root / 'common_support_spatial_cv_manifest.json').read_text())
          summary = pd.read_csv(root / 'common_support_spatial_cv_summary.csv')
          support = pd.read_csv(root / 'common_support_counts.csv')
          if not manifest['same_islands_across_tiers'] or not manifest['same_spatial_fold_assignment_across_tiers']:
              raise SystemExit('common-support contract not satisfied')
          if summary.empty or support.empty:
              raise SystemExit('empty common-support result')
          expected = {'primary', 'broad', 'sensitivity_all'}
          for comparison, group in summary.groupby('comparison'):
              if set(group['tier']) != expected:
                  raise SystemExit(f'{comparison}: missing tiers {set(group["tier"])}')
          print(json.dumps({
              'n_comparisons': int(summary['comparison'].nunique()),
              'support': support.to_dict('records'),
              'results': summary.to_dict('records'),
          }, indent=2))
          PY

      - name: Upload common-support spatial-CV outputs
        uses: actions/upload-artifact@v4
        with:
          name: m0-m4-common-support-cv-${{ github.run_id }}
          path: |
            config/m0_m4_full_analysis_artifact_lock.json
            config/m0_m4_full_analysis.yml
            data/v2/staging/analysis/common_support_cv/
          if-no-files-found: error
          retention-days: 90
