name: run_m0_m4_evidence_layer_diagnostics

on:
  # Auto-triggers paused: manual dispatch only while the final
  # cross-source trait pilot is being stabilized.
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  evidence-layer-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Compile evidence-layer diagnostics
        run: |
          python -m py_compile \
            src/island_v2/m0_m4_evidence_layer_diagnostics.py \
            src/island_v2/m0_m4_spatial_cv.py

      - name: Download locked integrated trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/integrated_trait_bombus_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED=$(jq -r '.artifact_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/integrated.zip
          ACTUAL=$(sha256sum /tmp/integrated.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download locked full-analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/m0_m4_full_analysis_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED=$(jq -r '.artifact_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/full-analysis.zip
          ACTUAL=$(sha256sum /tmp/full-analysis.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/full-analysis
          unzip -q /tmp/full-analysis.zip -d /tmp/full-analysis

      - name: Run evidence-layer and direct-coverage diagnostics
        run: |
          set -euo pipefail
          MASTER=$(find /tmp/integrated -path "*/bombus_join/sensitivity_all/island_species_trait_bombus_master.csv.gz" -print -quit)
          PRIMARY=$(find /tmp/full-analysis -path "*/primary/full_analysis_island_data.csv" -print -quit)
          REFERENCE=$(find /tmp/full-analysis -path "*/sensitivity_all/full_analysis_island_data.csv" -print -quit)
          test -n "$MASTER"
          test -n "$PRIMARY"
          test -n "$REFERENCE"
          python -m island_v2.m0_m4_evidence_layer_diagnostics \
            --species-master-csv "$MASTER" \
            --primary-island-data-csv "$PRIMARY" \
            --reference-island-data-csv "$REFERENCE" \
            --output-dir data/v2/staging/analysis/evidence_layer_diagnostics

      - name: Validate evidence-layer diagnostic outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('data/v2/staging/analysis/evidence_layer_diagnostics')
          manifest = json.loads((root / 'evidence_layer_diagnostics_manifest.json').read_text())
          layers = pd.read_csv(root / 'fill_layer_summary.csv')
          thresholds = pd.read_csv(root / 'primary_coverage_threshold_cv_summary.csv')
          mediator = pd.read_csv(root / 'primary_mediator_direct_evidence_coverage.csv')
          expected_layers = {'species_direct', 'genus_inference', 'family_inference', 'global_fallback'}
          if set(layers['fill_layer']) != expected_layers:
              raise SystemExit(f'fill-layer mismatch: {set(layers["fill_layer"])}')
          if set(thresholds['threshold']) != {1, 3, 5, 10, 20, 30, 50}:
              raise SystemExit('primary coverage threshold grid incomplete')
          if mediator.empty:
              raise SystemExit('mediator coverage audit empty')
          print(json.dumps({
              'layers': layers.to_dict('records'),
              'thresholds': thresholds.to_dict('records'),
              'mediator_coverage': mediator.to_dict('records'),
              'contract': manifest['contract'],
          }, indent=2))
          PY

      - name: Upload evidence-layer diagnostic outputs
        uses: actions/upload-artifact@v4
        with:
          name: m0-m4-evidence-layer-diagnostics-${{ github.run_id }}
          path: |
            config/integrated_trait_bombus_artifact_lock.json
            config/m0_m4_full_analysis_artifact_lock.json
            config/m0_m4_full_analysis.yml
            data/v2/staging/analysis/evidence_layer_diagnostics/
          if-no-files-found: error
          retention-days: 90
