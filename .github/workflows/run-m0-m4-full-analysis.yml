name: run_m0_m4_full_analysis

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-m0-m4-full-analysis.yml"
      - "config/m0_m4_full_analysis.yml"
      - "config/integrated_trait_bombus_artifact_lock.json"
      - "config/bombus_hypervolume_artifact_lock.json"
      - "src/island_v2/full_analysis_covariates.py"
      - "src/island_v2/m0_m4_full_analysis.py"
      - "tests/test_m0_m4_full_analysis.py"
      - "pyproject.toml"

permissions:
  actions: read
  contents: read

jobs:
  full-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test full-analysis contracts
        run: |
          set -euo pipefail
          pytest -q tests/test_m0_m4_full_analysis.py
          ruff check \
            src/island_v2/full_analysis_covariates.py \
            src/island_v2/m0_m4_full_analysis.py \
            tests/test_m0_m4_full_analysis.py

      - name: Download locked integrated trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/integrated_trait_bombus_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED=$(jq -r '.artifact_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/integrated.zip
          ACTUAL=$(sha256sum /tmp/integrated.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download locked PR 112 Bombus environmental artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/bombus_hypervolume_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED=$(jq -r '.artifact_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/bombus.zip
          ACTUAL=$(sha256sum /tmp/bombus.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/bombus
          unzip -q /tmp/bombus.zip -d /tmp/bombus

      - name: Rebuild the frozen island manifest for area covariates
        run: |
          set -euo pipefail
          island-v2-gshhg build --output-dir data/v2/external/islands/gshhg
          test -f data/v2/external/islands/gshhg/prepared/island_manifest.csv

      - name: Build deterministic full-analysis covariates
        run: |
          set -euo pipefail
          ISLAND_ENV=$(find /tmp/bombus -name global_island_environment.csv -print -quit)
          ENV_SAMPLES=$(find /tmp/bombus -name global_island_environment_samples.csv.gz -print -quit)
          test -n "$ISLAND_ENV"
          test -n "$ENV_SAMPLES"
          island-v2-full-analysis-covariates \
            --island-environment-csv "$ISLAND_ENV" \
            --environment-samples-csv "$ENV_SAMPLES" \
            --island-manifest-csv data/v2/external/islands/gshhg/prepared/island_manifest.csv \
            --output-dir data/v2/staging/analysis/full_analysis/covariates

      - name: Fit grouped-binomial M0-M4 models for all tiers
        run: |
          set -euo pipefail
          COV=data/v2/staging/analysis/full_analysis/covariates/full_analysis_covariates.csv
          for TIER in primary broad sensitivity_all; do
            ROOT=$(find /tmp/integrated -type d -path "*/bombus_join/${TIER}" -print -quit)
            test -n "$ROOT"
            COMP="$ROOT/island_trait_composition_with_bombus.csv.gz"
            METRICS="$ROOT/island_bombus_trait_analysis_input.csv"
            test -f "$COMP"
            test -f "$METRICS"
            island-v2-m0-m4-full-analysis \
              --trait-composition-csv "$COMP" \
              --island-metrics-csv "$METRICS" \
              --covariates-csv "$COV" \
              --analysis-tier "$TIER" \
              --output-dir "data/v2/staging/analysis/full_analysis/${TIER}"
          done

      - name: Summarize tier robustness and validate inferential outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from island_v2.m0_m4_full_analysis import summarize_tier_robustness

          root = Path('data/v2/staging/analysis/full_analysis')
          tiers = ('primary', 'broad', 'sensitivity_all')
          tables = {}
          tier_summary = {}
          for tier in tiers:
              d = root / tier
              manifest = json.loads((d / 'full_analysis_manifest.json').read_text())
              coefficients = pd.read_csv(d / 'full_analysis_path_coefficients.csv')
              fits = pd.read_csv(d / 'full_analysis_equation_fit.csv')
              indirect = pd.read_csv(d / 'full_analysis_indirect_effects.csv')
              models = set(coefficients['model'].astype(str))
              if models != {'M0', 'M1', 'M2', 'M3', 'M4'}:
                  raise SystemExit(f'{tier}: incomplete model ladder {models}')
              if not fits['status'].isin(['fitted', 'max_iter_reached']).all():
                  raise SystemExit(f'{tier}: failed equation fit {fits.to_dict("records")}')
              if fits['n_clusters'].min() < 10:
                  raise SystemExit(f'{tier}: too few spatial clusters')
              tables[tier] = coefficients

              def coefficient(model, outcome, predictor):
                  row = coefficients.loc[
                      coefficients['model'].eq(model)
                      & coefficients['outcome'].eq(outcome)
                      & coefficients['predictor'].eq(predictor)
                  ]
                  return None if row.empty else row.iloc[0].to_dict()

              tier_summary[tier] = {
                  'n_islands_input': manifest['n_islands_input'],
                  'n_spatial_blocks_input': manifest['n_spatial_blocks_input'],
                  'm1_minus_m0_total_aic': manifest['m1_minus_m0_total_aic'],
                  'm3_minus_m2_total_aic': manifest['m3_minus_m2_total_aic'],
                  'm1_bombus_path': coefficient('M1', 'floral_phenotype', 'bombus_channel_state'),
                  'm3_direct_bombus_path': coefficient('M3', 'floral_phenotype', 'bombus_channel_state'),
                  'm4_interaction': coefficient('M4', 'floral_phenotype', 'bombus_x_alternative'),
                  'indirect_effects': indirect.to_dict('records'),
              }

          robustness = summarize_tier_robustness(tables)
          robustness.to_csv(root / 'full_analysis_tier_robustness.csv', index=False)
          covariate_manifest = json.loads(
              (root / 'covariates' / 'full_analysis_covariate_manifest.json').read_text()
          )
          if covariate_manifest['pca']['cumulative_explained_variance'] < 0.85:
              raise SystemExit('climate PCA retained less than 85% variance')

          summary = {
              'contract': 'm0_m4_existing_locked_artifacts_full_analysis_v1',
              'input_integrated_artifact': json.loads(
                  Path('config/integrated_trait_bombus_artifact_lock.json').read_text()
              ),
              'input_bombus_artifact': json.loads(
                  Path('config/bombus_hypervolume_artifact_lock.json').read_text()
              ),
              'covariates': covariate_manifest,
              'tiers': tier_summary,
              'robustness': {
                  'n_paths': int(len(robustness)),
                  'n_direction_consistent': int(robustness['direction_consistent_across_tiers'].sum()),
                  'n_all_tiers_nominally_supported': int(robustness['all_tiers_nominally_supported'].sum()),
              },
              'interpretation_guardrail': (
                  'Bombus predictor is environmental compatibility, not observed absence. '
                  'M4 uses pollen_vector_mode wind/mixed and no longer uses the algebraic complement '
                  'of the Bombus-like outcome guild.'
              ),
          }
          (root / 'full_analysis_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload full M0-M4 analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: m0-m4-full-analysis-${{ github.run_id }}
          path: |
            config/m0_m4_full_analysis.yml
            config/integrated_trait_bombus_artifact_lock.json
            config/bombus_hypervolume_artifact_lock.json
            data/v2/staging/analysis/full_analysis/
          if-no-files-found: error
          retention-days: 90
