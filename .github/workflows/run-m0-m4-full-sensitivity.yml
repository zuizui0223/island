name: run_m0_m4_full_sensitivity

on:
  workflow_dispatch:
    inputs:
      bootstrap_replicates:
        description: "Number of 10-degree spatial-block bootstrap replicates per analysis tier"
        required: false
        default: "200"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-m0-m4-full-sensitivity.yml"
      - "config/m0_m4_full_analysis_artifact_lock.json"
      - "config/m0_m4_full_analysis.yml"
      - "src/island_v2/m0_m4_full_sensitivity.py"
      - "tests/test_m0_m4_full_sensitivity.py"
      - "pyproject.toml"

permissions:
  actions: read
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test sensitivity contracts
        run: |
          set -euo pipefail
          pytest -q tests/test_m0_m4_full_sensitivity.py
          ruff check \
            src/island_v2/m0_m4_full_sensitivity.py \
            tests/test_m0_m4_full_sensitivity.py

      - name: Download locked full-analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/m0_m4_full_analysis_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED=$(jq -r '.artifact_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/full-analysis.zip
          ACTUAL=$(sha256sum /tmp/full-analysis.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/full-analysis
          unzip -q /tmp/full-analysis.zip -d /tmp/full-analysis

      - name: Run residualized and spatial-bootstrap sensitivity for all tiers
        env:
          BOOTSTRAP_REPLICATES: ${{ inputs.bootstrap_replicates || '200' }}
        run: |
          set -euo pipefail
          for TIER in primary broad sensitivity_all; do
            INPUT=$(find /tmp/full-analysis -path "*/${TIER}/full_analysis_island_data.csv" -print -quit)
            test -n "$INPUT"
            island-v2-m0-m4-full-sensitivity \
              --island-data-csv "$INPUT" \
              --analysis-tier "$TIER" \
              --bootstrap-replicates "$BOOTSTRAP_REPLICATES" \
              --bootstrap-seed 20260713 \
              --output-dir "data/v2/staging/analysis/full_sensitivity/${TIER}"
          done

      - name: Summarize cross-tier residualized and bootstrap evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('data/v2/staging/analysis/full_sensitivity')
          tiers = ('primary', 'broad', 'sensitivity_all')
          summary = {
              'contract': 'm0_m4_full_sensitivity_cross_tier_v1',
              'input_full_analysis_artifact': json.loads(
                  Path('config/m0_m4_full_analysis_artifact_lock.json').read_text()
              ),
              'tiers': {},
              'cross_tier_metrics': {},
          }
          bootstrap_tables = {}
          for tier in tiers:
              d = root / tier
              manifest = json.loads((d / 'full_sensitivity_manifest.json').read_text())
              coefficients = pd.read_csv(d / 'sensitivity_path_coefficients.csv')
              bootstrap = pd.read_csv(d / 'spatial_block_bootstrap_summary.csv')
              vif = pd.read_csv(d / 'predictor_vif.csv')
              bootstrap_tables[tier] = bootstrap.set_index('metric')

              def target(analysis):
                  rows = coefficients.loc[
                      coefficients['analysis'].eq(analysis)
                      & coefficients['predictor'].eq(coefficients['target_predictor'])
                  ]
                  return None if rows.empty else rows.iloc[0].to_dict()

              summary['tiers'][tier] = {
                  'n_islands': manifest['n_islands_input'],
                  'n_spatial_blocks': manifest['n_spatial_blocks_input'],
                  'bombus_baseline_r2': manifest['residualization']['baseline_r2_for_bombus'],
                  'condition_number': manifest['collinearity']['condition_number_standardized_design'],
                  'max_vif': float(vif['vif'].max()),
                  'M1_raw': target('M1_raw_bombus'),
                  'M1_residualized': target('M1_residualized_bombus'),
                  'M3_raw_direct': target('M3_raw_direct_bombus'),
                  'M3_residualized_direct': target('M3_residualized_direct_bombus'),
                  'M4_raw_interaction': target('M4_raw_interaction'),
                  'M4_residualized_interaction': target('M4_residualized_interaction'),
                  'bootstrap': bootstrap.to_dict('records'),
              }

          metrics = sorted(
              set.intersection(*(set(table.index.astype(str)) for table in bootstrap_tables.values()))
          )
          for metric in metrics:
              per_tier = {}
              signs = set()
              all_ci_excludes_zero = True
              for tier in tiers:
                  row = bootstrap_tables[tier].loc[metric]
                  median = float(row['bootstrap_median'])
                  lower = float(row['ci_2_5'])
                  upper = float(row['ci_97_5'])
                  per_tier[tier] = {
                      'median': median,
                      'ci_2_5': lower,
                      'ci_97_5': upper,
                      'ci_excludes_zero': bool(row['ci_excludes_zero']),
                      'n_valid_replicates': int(row['n_valid_replicates']),
                  }
                  if median != 0:
                      signs.add(1 if median > 0 else -1)
                  all_ci_excludes_zero = all_ci_excludes_zero and bool(row['ci_excludes_zero'])
              summary['cross_tier_metrics'][metric] = {
                  'direction_consistent': len(signs) <= 1,
                  'all_tier_bootstrap_cis_exclude_zero': all_ci_excludes_zero,
                  'tiers': per_tier,
              }

          (root / 'full_sensitivity_summary.json').write_text(
              json.dumps(summary, indent=2) + '\n'
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload full sensitivity outputs
        uses: actions/upload-artifact@v4
        with:
          name: m0-m4-full-sensitivity-${{ github.run_id }}
          path: |
            config/m0_m4_full_analysis_artifact_lock.json
            config/m0_m4_full_analysis.yml
            data/v2/staging/analysis/full_sensitivity/
          if-no-files-found: error
          retention-days: 90
