name: run_m0_m4_spatial_cv

on:
  # Auto-triggers paused: manual dispatch only while the final
  # cross-source trait pilot is being stabilized.
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  spatial-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test spatial-CV contract
        run: |
          set -euo pipefail
          pytest -q tests/test_m0_m4_spatial_cv.py

      - name: Download locked full-analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/m0_m4_full_analysis_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED=$(jq -r '.artifact_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/full-analysis.zip
          ACTUAL=$(sha256sum /tmp/full-analysis.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/full-analysis
          unzip -q /tmp/full-analysis.zip -d /tmp/full-analysis

      - name: Run repeated spatial-block CV for all analysis tiers
        env:
          N_FOLDS: ${{ inputs.folds || '10' }}
          N_REPEATS: ${{ inputs.repeats || '5' }}
        run: |
          set -euo pipefail
          for TIER in primary broad sensitivity_all; do
            INPUT=$(find /tmp/full-analysis -path "*/${TIER}/full_analysis_island_data.csv" -print -quit)
            test -n "$INPUT"
            python -m island_v2.m0_m4_spatial_cv \
              --island-data-csv "$INPUT" \
              --analysis-tier "$TIER" \
              --n-folds "$N_FOLDS" \
              --repeats "$N_REPEATS" \
              --seed 20260713 \
              --output-dir "data/v2/staging/analysis/spatial_cv/${TIER}"
          done

      - name: Summarize cross-tier predictive gains
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('data/v2/staging/analysis/spatial_cv')
          tiers = ('primary', 'broad', 'sensitivity_all')
          tables = {}
          summary = {
              'contract': 'm0_m4_spatial_cv_cross_tier_v1',
              'input_full_analysis_artifact': json.loads(
                  Path('config/m0_m4_full_analysis_artifact_lock.json').read_text()
              ),
              'tiers': {},
              'cross_tier': {},
          }
          for tier in tiers:
              manifest = json.loads((root / tier / 'spatial_cv_manifest.json').read_text())
              table = pd.read_csv(root / tier / 'spatial_cv_summary.csv').set_index('comparison')
              tables[tier] = table
              summary['tiers'][tier] = manifest

          comparisons = sorted(set.intersection(*(set(table.index) for table in tables.values())))
          for comparison in comparisons:
              rows = {tier: tables[tier].loc[comparison] for tier in tiers}
              summary['cross_tier'][comparison] = {
                  'all_tiers_positive_loglik_gain': all(
                      float(row['median_delta_log_likelihood_per_1000_trials']) > 0
                      for row in rows.values()
                  ),
                  'all_tiers_improved_brier': all(
                      float(row['median_delta_brier_full_minus_reduced']) < 0
                      for row in rows.values()
                  ),
                  'all_tiers_predictive_gain_consistent': all(
                      bool(row['predictive_gain_consistent']) for row in rows.values()
                  ),
                  'tiers': {
                      tier: {
                          'median_delta_log_likelihood_per_1000_trials': float(
                              row['median_delta_log_likelihood_per_1000_trials']
                          ),
                          'median_delta_brier_full_minus_reduced': float(
                              row['median_delta_brier_full_minus_reduced']
                          ),
                          'proportion_repeats_full_model_better_loglik': float(
                              row['proportion_repeats_full_model_better_loglik']
                          ),
                          'proportion_repeats_full_model_better_brier': float(
                              row['proportion_repeats_full_model_better_brier']
                          ),
                      }
                      for tier, row in rows.items()
                  },
              }

          (root / 'spatial_cv_cross_tier_summary.json').write_text(
              json.dumps(summary, indent=2) + '\n'
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload spatial-CV outputs
        uses: actions/upload-artifact@v4
        with:
          name: m0-m4-spatial-cv-${{ github.run_id }}
          path: |
            config/m0_m4_full_analysis_artifact_lock.json
            config/m0_m4_full_analysis.yml
            data/v2/staging/analysis/spatial_cv/
          if-no-files-found: error
          retention-days: 90
