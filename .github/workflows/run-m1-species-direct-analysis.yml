name: run_m1_species_direct_analysis

on:
  # Auto-triggers paused: manual dispatch only while the final
  # cross-source trait pilot is being stabilized.
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  species-direct-m1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Test species-direct analysis contract
        run: |
          set -euo pipefail
          pytest -q tests/test_m1_species_direct_analysis.py
          python -m py_compile src/island_v2/m1_species_direct_analysis.py

      - name: Download locked integrated trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/integrated_trait_bombus_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED=$(jq -r '.artifact_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/integrated.zip
          ACTUAL=$(sha256sum /tmp/integrated.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download locked full-analysis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/m0_m4_full_analysis_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED=$(jq -r '.artifact_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/full-analysis.zip
          ACTUAL=$(sha256sum /tmp/full-analysis.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/full-analysis
          unzip -q /tmp/full-analysis.zip -d /tmp/full-analysis

      - name: Run species-direct two-way clustered M1 analysis
        run: |
          set -euo pipefail
          MASTER=$(find /tmp/integrated -path "*/bombus_join/primary/island_species_trait_bombus_master.csv.gz" -print -quit)
          REFERENCE=$(find /tmp/full-analysis -path "*/sensitivity_all/full_analysis_island_data.csv" -print -quit)
          test -n "$MASTER"
          test -n "$REFERENCE"
          python -m island_v2.m1_species_direct_analysis \
            --species-master-csv "$MASTER" \
            --reference-island-data-csv "$REFERENCE" \
            --output-dir data/v2/staging/analysis/m1_species_direct

      - name: Validate and summarize species-direct result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('data/v2/staging/analysis/m1_species_direct')
          manifest = json.loads((root / 'species_direct_analysis_manifest.json').read_text())
          coefficients = pd.read_csv(root / 'species_direct_coefficients.csv')
          cv = pd.read_csv(root / 'species_direct_spatial_cv_summary.csv')
          if manifest['n_rows'] < 40000:
              raise SystemExit(f"unexpectedly few direct rows: {manifest['n_rows']}")
          if manifest['n_species'] < 500:
              raise SystemExit(f"unexpectedly few direct species: {manifest['n_species']}")
          if manifest['n_spatial_blocks'] < 200:
              raise SystemExit(f"unexpectedly few spatial blocks: {manifest['n_spatial_blocks']}")

          primary = coefficients.loc[
              coefficients['model'].eq('M1')
              & coefficients['baseline_spec'].eq('full')
              & coefficients['weight_scheme'].eq('row_weighted')
              & coefficients['covariance_scheme'].eq('species_x_spatial_block')
              & coefficients['predictor'].eq('bombus_channel_state')
          ]
          if len(primary) != 1:
              raise SystemExit('primary Bombus coefficient is missing or duplicated')
          primary_result = primary.iloc[0].to_dict()
          if primary_result['n_cluster_a'] < 500 or primary_result['n_cluster_b'] < 200:
              raise SystemExit(f'insufficient two-way clusters: {primary_result}')

          summary = {
              'contract': manifest['contract'],
              'input_integrated_artifact': json.loads(
                  Path('config/integrated_trait_bombus_artifact_lock.json').read_text()
              ),
              'input_full_analysis_artifact': json.loads(
                  Path('config/m0_m4_full_analysis_artifact_lock.json').read_text()
              ),
              'dimensions': {
                  key: manifest[key]
                  for key in ('n_rows', 'n_islands', 'n_species', 'n_families', 'n_spatial_blocks')
              },
              'primary_two_way_clustered_bombus_path': primary_result,
              'all_bombus_inference_variants': manifest['bombus_coefficients'],
              'spatial_cv': cv.to_dict('records'),
              'interpretation_guardrail': (
                  'This is a species-direct compositional-filtering model. It does not estimate within-species '
                  'trait evolution, and Bombus is environmental compatibility rather than observed absence.'
              ),
          }
          (root / 'species_direct_analysis_summary.json').write_text(
              json.dumps(summary, indent=2) + '\n'
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload species-direct M1 outputs
        uses: actions/upload-artifact@v4
        with:
          name: m1-species-direct-analysis-${{ github.run_id }}
          path: |
            config/m1_species_direct_analysis.yml
            config/integrated_trait_bombus_artifact_lock.json
            config/m0_m4_full_analysis_artifact_lock.json
            data/v2/staging/analysis/m1_species_direct/
          if-no-files-found: error
          retention-days: 90
