name: run_m1_species_direct_family_fe

on:
  # Auto-triggers paused: manual dispatch only while the final
  # cross-source trait pilot is being stabilized.
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  family-fe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Compile family-FE sensitivity
        run: python -m py_compile src/island_v2/m1_species_direct_family_fe.py

      - name: Download locked species-direct M1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/m1_species_direct_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED=$(jq -r '.artifact_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/species-direct.zip
          ACTUAL=$(sha256sum /tmp/species-direct.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/species-direct
          unzip -q /tmp/species-direct.zip -d /tmp/species-direct

      - name: Run informative-family fixed-effect M1 sensitivity
        run: |
          set -euo pipefail
          INPUT=$(find /tmp/species-direct -name species_direct_analysis_rows.csv.gz -print -quit)
          test -n "$INPUT"
          python -m island_v2.m1_species_direct_family_fe \
            --species-direct-rows-csv "$INPUT" \
            --output-dir data/v2/staging/analysis/m1_species_direct_family_fe

      - name: Validate and summarize family-FE result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('data/v2/staging/analysis/m1_species_direct_family_fe')
          manifest = json.loads((root / 'family_fe_analysis_manifest.json').read_text())
          coefficients = pd.read_csv(root / 'family_fe_bombus_coefficients.csv')
          cv = pd.read_csv(root / 'family_fe_spatial_cv_summary.csv')
          if manifest['n_families_informative'] < 10:
              raise SystemExit(f"too few informative families: {manifest['n_families_informative']}")
          if manifest['n_species_informative_families'] < 100:
              raise SystemExit(f"too few informative-family species: {manifest['n_species_informative_families']}")
          if manifest['n_spatial_blocks_informative_families'] < 100:
              raise SystemExit(f"too few informative-family blocks: {manifest['n_spatial_blocks_informative_families']}")
          primary = coefficients.loc[
              coefficients['baseline_spec'].eq('full')
              & coefficients['weight_scheme'].eq('row_weighted')
          ]
          if len(primary) != 1:
              raise SystemExit('primary family-FE Bombus coefficient missing or duplicated')
          summary = {
              'contract': manifest['contract'],
              'input_species_direct_artifact': json.loads(
                  Path('config/m1_species_direct_artifact_lock.json').read_text()
              ),
              'support': {
                  key: manifest[key]
                  for key in (
                      'n_families_total', 'n_families_informative',
                      'n_species_total', 'n_species_informative_families',
                      'n_rows_informative_families', 'n_islands_informative_families',
                      'n_spatial_blocks_informative_families'
                  )
              },
              'primary_family_fe_bombus_path': primary.iloc[0].to_dict(),
              'all_family_fe_bombus_paths': coefficients.to_dict('records'),
              'spatial_cv': cv.to_dict('records'),
              'interpretation_guardrail': (
                  'This sensitivity controls coarse taxonomic composition with family fixed effects and estimates within-informative-family compositional filtering. It is not a full phylogenetic model.'
              ),
          }
          (root / 'family_fe_analysis_summary.json').write_text(
              json.dumps(summary, indent=2) + '\n'
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload family-FE sensitivity outputs
        uses: actions/upload-artifact@v4
        with:
          name: m1-species-direct-family-fe-${{ github.run_id }}
          path: |
            config/m1_species_direct_analysis.yml
            config/m1_species_direct_artifact_lock.json
            data/v2/staging/analysis/m1_species_direct_family_fe/
          if-no-files-found: error
          retention-days: 90
