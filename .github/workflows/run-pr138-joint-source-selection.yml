name: Run PR138 joint source-pool and selection sensitivity

on:
  push:
    branches: [pr136-channel-gated-primary-validation]
    paths:
      - "src/island_v2/chapter1_pr138_source_adjusted_branch_selection.py"
      - "tests/test_chapter1_pr138_source_adjusted_branch_selection.py"
      - "config/chapter1_global_branching.yml"
      - "config/chapter1_global_branch_selection.yml"
      - ".github/workflows/run-pr138-joint-source-selection.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADJUSTED_RUN_ID: "32956197702"
      ADJUSTED_ARTIFACT: "pr138-source-adjusted-pathway-32956197702"
      ISOLATION_RUN_ID: "29228212586"
      ISOLATION_ARTIFACT: "purpose-shortest-distance-regime-29228212586"
      REALM_RUN_ID: "32927060210"
      REALM_ARTIFACT: "pr138-realm-sensitivity-32927060210"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate joint wrapper and upstream selection logic
        run: |
          pytest -q \
            tests/test_chapter1_pr138_source_adjusted_branch_selection.py \
            tests/test_chapter1_global_branch_selection.py \
            tests/test_chapter1_global_branching.py
          ruff check \
            src/island_v2/chapter1_pr138_source_adjusted_branch_selection.py \
            tests/test_chapter1_pr138_source_adjusted_branch_selection.py

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/joint/adjusted /tmp/joint/isolation /tmp/joint/realm /tmp/joint/result
          gh run download "$ADJUSTED_RUN_ID" -n "$ADJUSTED_ARTIFACT" -D /tmp/joint/adjusted
          gh run download "$ISOLATION_RUN_ID" -n "$ISOLATION_ARTIFACT" -D /tmp/joint/isolation
          gh run download "$REALM_RUN_ID" -n "$REALM_ARTIFACT" -D /tmp/joint/realm
          test -s /tmp/joint/adjusted/result/source_adjusted_pathway_island_scores.csv.gz
          test -s /tmp/joint/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/joint/realm/realm/island_biogeographic_realm_assignment.csv

      - name: Run joint source-adjusted observation-selection sensitivity
        run: |
          python -m island_v2.chapter1_pr138_source_adjusted_branch_selection \
            --source-adjusted-scores-csv /tmp/joint/adjusted/result/source_adjusted_pathway_island_scores.csv.gz \
            --covariates-csv /tmp/joint/isolation/results/purpose_shortest_island_data.csv \
            --realm-assignment-csv /tmp/joint/realm/realm/island_biogeographic_realm_assignment.csv \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --branching-config-path config/chapter1_global_branching.yml \
            --selection-config-path config/chapter1_global_branch_selection.yml \
            --output-dir /tmp/joint/result

      - name: Summarize joint robustness result
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          root = Path('/tmp/joint/result')
          headline = pd.read_csv(root/'joint_selection_headline_summary.csv')
          slopes = pd.read_csv(root/'joint_selection_slopes.csv')
          states = pd.read_csv(root/'joint_selection_states.csv')
          diagnostics = pd.read_csv(root/'joint_selection_weight_diagnostics.csv')
          manifest = json.loads((root/'joint_source_selection_manifest.json').read_text())

          focus_headline = headline.loc[
              headline['stratum'].isin(['all_native','native_nonendemic'])
          ].copy()
          focus_states = states.loc[
              states['stratum'].isin(['all_native','native_nonendemic'])
              & states['support_tier'].eq('confirmatory')
              & states['context'].isin([
                  'northern_midlatitude','tropical','Palearctic','Neotropical'
              ])
          ].copy()
          focus_slopes = slopes.loc[
              slopes['stratum'].isin(['all_native','native_nonendemic'])
              & slopes['support_tier'].eq('confirmatory')
              & slopes['context'].isin([
                  'northern_midlatitude','tropical','Palearctic','Neotropical'
              ])
              & slopes['syndrome'].isin([
                  'accessibility_generalization','reproductive_assurance'
              ])
          ].copy()

          out = Path('/tmp/joint/joint_source_selection_summary.md')
          with out.open('w') as f:
              f.write('# PR138 joint source-pool + observation-selection sensitivity\n\n')
              f.write('Source-adjusted accessibility and strict selfing-core responses are analysed under the frozen unweighted and stabilized-IPW modes. Neither source assignment nor propensity fitting uses island branch-score values.\n\n')
              f.write('## Headline direct vector contrasts\n\n```text\n')
              f.write(focus_headline.to_string(index=False))
              f.write('\n```\n\n## Context branch states\n\n```text\n')
              cols = [c for c in [
                  'source_mode','selection_mode','context_layer','stratum','context',
                  'plant_side_branch_state','q_context_vector_family',
                  'accessibility_generalization_slope','accessibility_generalization_q',
                  'reproductive_assurance_slope','reproductive_assurance_q'
              ] if c in focus_states.columns]
              f.write(focus_states[cols].to_string(index=False))
              f.write('\n```\n\n## Axis slopes\n\n```text\n')
              cols = [c for c in [
                  'source_mode','selection_mode','context_layer','stratum','context',
                  'syndrome','distance_slope','q_axis_family','n_islands'
              ] if c in focus_slopes.columns]
              f.write(focus_slopes[cols].to_string(index=False))
              f.write('\n```\n\n## Weight diagnostics extrema\n\n```text\n')
              d = diagnostics.loc[diagnostics['selection_mode'].ne('unweighted')]
              summary = d.groupby(['source_mode','selection_mode']).agg(
                  max_weight=('weight_max','max'),
                  min_ess_fraction=('effective_sample_fraction','min'),
                  max_clipped=('n_propensity_clipped','max'),
              ).reset_index()
              f.write(summary.to_string(index=False))
              f.write('\n```\n\n## Manifest\n\n```json\n')
              f.write(json.dumps(manifest, indent=2))
              f.write('\n```\n')
          PY
          cat /tmp/joint/joint_source_selection_summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pr138-joint-source-selection-${{ github.run_id }}
          path: /tmp/joint/
          if-no-files-found: error
          retention-days: 90
