name: Run PR138 regional lineage decomposition

on:
  push:
    branches: [pr136-channel-gated-primary-validation]
    paths:
      - "src/island_v2/chapter1_pr138_regional_lineage_decomposition.py"
      - "tests/test_chapter1_pr138_regional_lineage_decomposition.py"
      - ".github/workflows/run-pr138-regional-lineage-decomposition.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FROZEN_RUN_ID: "32980009101"
      FROZEN_ARTIFACT: "pr138-palearctic-restricted-ipw-32980009101"
      JOINT_RUN_ID: "32958663810"
      JOINT_ARTIFACT: "pr138-joint-source-selection-32958663810"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate regional lineage decomposition
        run: |
          pytest -q tests/test_chapter1_pr138_regional_lineage_decomposition.py
          ruff check \
            src/island_v2/chapter1_pr138_regional_lineage_decomposition.py \
            tests/test_chapter1_pr138_regional_lineage_decomposition.py

      - name: Download frozen PR138 inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/regional/frozen /tmp/regional/joint /tmp/regional/result
          gh run download "$FROZEN_RUN_ID" -n "$FROZEN_ARTIFACT" -D /tmp/regional/frozen
          gh run download "$JOINT_RUN_ID" -n "$JOINT_ARTIFACT" -D /tmp/regional/joint
          test -s /tmp/regional/frozen/input/input/result/source_adjusted_pathway_island_scores.csv.gz
          test -s /tmp/regional/frozen/input/input/pathway/syndrome/species_syndrome_concordance.csv.gz
          test -s /tmp/regional/frozen/input/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/regional/frozen/input/input/source/source/gift_native_mainland_flora.csv.gz
          test -s /tmp/regional/frozen/input/input/source/result/island_source_assignments.csv.gz
          test -s /tmp/regional/frozen/input/input/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/regional/frozen/input/input/realm/realm/island_biogeographic_realm_assignment.csv
          test -s /tmp/regional/joint/result/joint_selection_weights.csv.gz
          test -s /tmp/regional/joint/result/joint_selection_slopes.csv
          test -s /tmp/regional/joint/result/joint_selection_between_context.csv

      - name: Verify required species-level axes
        run: |
          python - <<'PY'
          import pandas as pd
          path = '/tmp/regional/frozen/input/input/pathway/syndrome/species_syndrome_concordance.csv.gz'
          scores = pd.read_csv(path, usecols=['syndrome'])
          observed = set(scores['syndrome'].astype(str))
          required = {'generalized_accessible', 'selfing_core'}
          missing = sorted(required - observed)
          if missing:
              raise SystemExit(f'missing required species-level lineage axes: {missing}')
          PY

      - name: Run regional lineage decomposition
        run: |
          python -m island_v2.chapter1_pr138_regional_lineage_decomposition run \
            --source-adjusted-scores-csv /tmp/regional/frozen/input/input/result/source_adjusted_pathway_island_scores.csv.gz \
            --species-scores-csv /tmp/regional/frozen/input/input/pathway/syndrome/species_syndrome_concordance.csv.gz \
            --status-flora-csv /tmp/regional/frozen/input/canonical/input/chapter1_status_flora.csv.gz \
            --gift-flora-csv /tmp/regional/frozen/input/input/source/source/gift_native_mainland_flora.csv.gz \
            --source-assignments-csv /tmp/regional/frozen/input/input/source/result/island_source_assignments.csv.gz \
            --covariates-csv /tmp/regional/frozen/input/input/isolation/results/purpose_shortest_island_data.csv \
            --realm-assignment-csv /tmp/regional/frozen/input/input/realm/realm/island_biogeographic_realm_assignment.csv \
            --frozen-weights-csv /tmp/regional/joint/result/joint_selection_weights.csv.gz \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --source-config-path config/chapter1_pr138_source_pool_sensitivity.yml \
            --output-dir /tmp/regional/result

      - name: Verify frozen observed estimand and summarize
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd

          root = Path('/tmp/regional')
          slopes = pd.read_csv(root / 'result/regional_lineage_context_slopes.csv')
          between = pd.read_csv(root / 'result/regional_lineage_between_context.csv')
          original = pd.read_csv(root / 'joint/result/joint_selection_slopes.csv')

          focal = {
              'analysis_regime': {'northern_midlatitude', 'tropical'},
              'biogeographic_realm': {'Palearctic', 'Neotropical'},
          }
          original = original.loc[
              original['axis_set'].eq('universal_plant_response')
              & original['support_tier'].eq('confirmatory')
              & original['stratum'].isin(['all_native', 'native_nonendemic'])
              & original['syndrome'].isin(['accessibility_generalization', 'reproductive_assurance'])
          ].copy()
          original = original.loc[
              [c in focal and x in focal[c] for c, x in zip(original['context_layer'], original['context'])]
          ].copy()
          current = slopes.loc[slopes['outcome'].eq('observed')].copy()
          check = original.merge(
              current,
              left_on=['source_mode','selection_mode','context_layer','stratum','context','syndrome'],
              right_on=['source_mode','selection_mode','context_layer','stratum','context','axis'],
              how='inner',
              validate='one_to_one',
          )
          if len(check) != len(original):
              raise SystemExit(f'observed estimand row mismatch: {len(check)} != {len(original)}')
          delta = np.max(np.abs(check['distance_slope_x'].to_numpy(float) - check['distance_slope_y'].to_numpy(float)))
          if not np.isfinite(delta) or delta > 1e-10:
              raise SystemExit(f'observed slope reproduction failed: max delta={delta}')

          out = root / 'regional_lineage_summary.md'
          with out.open('w') as f:
              f.write('# PR138 regional lineage decomposition\n\n')
              f.write(f'Frozen observed slope reproduction max absolute difference: {delta:.3g}.\n\n')
              for layer in ['analysis_regime', 'biogeographic_realm']:
                  sub = between.loc[between['context_layer'].eq(layer)].copy()
                  f.write(f'## {layer}\n\n')
                  cols = [
                      'stratum','source_mode','selection_mode','context_a','context_b',
                      'observed_p_value','genus_expected_p_value','residual_p_value',
                      'residual_q_across_source_modes','residual_vector_supported',
                      'observed_accessibility_generalization_interaction',
                      'genus_expected_accessibility_generalization_interaction',
                      'residual_accessibility_generalization_interaction',
                      'observed_reproductive_assurance_interaction',
                      'genus_expected_reproductive_assurance_interaction',
                      'residual_reproductive_assurance_interaction',
                  ]
                  f.write('```text\n')
                  f.write(sub[[c for c in cols if c in sub.columns]].to_string(index=False))
                  f.write('\n```\n\n')
              manifest = json.loads((root / 'result/regional_lineage_manifest.json').read_text())
              f.write('## Manifest\n\n```json\n')
              f.write(json.dumps(manifest, indent=2))
              f.write('\n```\n')
          PY
          cat /tmp/regional/regional_lineage_summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pr138-regional-lineage-decomposition-${{ github.run_id }}
          path: /tmp/regional/
          if-no-files-found: error
          retention-days: 90

# Registration push: the workflow is created on the PR branch before this trigger commit.
