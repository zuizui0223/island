name: Run PR138 source-pool feasibility audit

on:
  push:
    paths:
      - ".github/workflows/run-pr138-source-pool-feasibility.yml"
      - "src/island_v2/chapter1_pr138_source_pool_feasibility.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve GIFT metadata
        run: |
          set -euo pipefail
          mkdir -p /tmp/sourcepool/input /tmp/sourcepool/report
          API="https://gift.uni-goettingen.de/api/extended/index3.2.php"
          for query in lists taxonomy regions env_raster env_misc; do
            curl -L --fail --retry 3 "${API}?query=${query}" -o "/tmp/sourcepool/input/${query}.json"
            test -s "/tmp/sourcepool/input/${query}.json"
          done
      - name: Audit source-pool feasibility
        run: |
          python -m island_v2.chapter1_pr138_source_pool_feasibility \
            --lists /tmp/sourcepool/input/lists.json \
            --taxonomy /tmp/sourcepool/input/taxonomy.json \
            --regions /tmp/sourcepool/input/regions.json \
            --raster /tmp/sourcepool/input/env_raster.json \
            --misc /tmp/sourcepool/input/env_misc.json \
            --output-dir /tmp/sourcepool/report
          cat /tmp/sourcepool/report/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pr138-source-pool-feasibility-${{ github.run_id }}
          path: /tmp/sourcepool/report/
          if-no-files-found: error
          retention-days: 90
