name: Run PR138 source-pool sensitivity

on:
  push:
    branches: [pr136-channel-gated-primary-validation]
    paths:
      - "src/island_v2/chapter1_pr138_gift_source_pool.py"
      - "src/island_v2/chapter1_pr138_source_pool_sensitivity.py"
      - "tests/test_chapter1_pr138_source_pool_sensitivity.py"
      - "config/chapter1_pr138_source_pool_sensitivity.yml"
      - ".github/workflows/run-pr138-source-pool-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PR138_RUN_ID: "32922192696"
      PR138_ARTIFACT: "pr138-biogeographic-pattern-32922192696"
      ISOLATION_RUN_ID: "29228212586"
      ISOLATION_ARTIFACT: "purpose-shortest-distance-regime-29228212586"
      REALM_RUN_ID: "32927060210"
      REALM_ARTIFACT: "pr138-realm-sensitivity-32927060210"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate source-pool logic
        run: pytest -q tests/test_chapter1_pr138_source_pool_sensitivity.py

      - name: Download frozen PR138 inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr138/current /tmp/pr138/isolation /tmp/pr138/realm /tmp/pr138/source /tmp/pr138/result
          gh run download "$PR138_RUN_ID" -n "$PR138_ARTIFACT" -D /tmp/pr138/current
          gh run download "$ISOLATION_RUN_ID" -n "$ISOLATION_ARTIFACT" -D /tmp/pr138/isolation
          gh run download "$REALM_RUN_ID" -n "$REALM_ARTIFACT" -D /tmp/pr138/realm
          test -s /tmp/pr138/current/syndrome/all_analysis_eligible/species_syndrome_concordance.csv.gz
          test -s /tmp/pr138/current/syndrome/all_analysis_eligible/island_syndrome_scores.csv.gz
          test -s /tmp/pr138/isolation/results/purpose_shortest_island_data.csv
          test -s /tmp/pr138/isolation/covariates/climate_pca_loadings.csv
          test -s /tmp/pr138/realm/realm/island_biogeographic_realm_assignment.csv

      - name: Build external GIFT mainland source universe
        run: |
          python -m island_v2.chapter1_pr138_gift_source_pool \
            --output-dir /tmp/pr138/source \
            --pca-loadings-csv /tmp/pr138/isolation/covariates/climate_pca_loadings.csv \
            --workers 8

      - name: Run source-pool-standardized sensitivity
        run: |
          python -m island_v2.chapter1_pr138_source_pool_sensitivity \
            --species-scores-csv /tmp/pr138/current/syndrome/all_analysis_eligible/species_syndrome_concordance.csv.gz \
            --island-scores-csv /tmp/pr138/current/syndrome/all_analysis_eligible/island_syndrome_scores.csv.gz \
            --covariates-csv /tmp/pr138/isolation/results/purpose_shortest_island_data.csv \
            --source-regions-csv /tmp/pr138/source/gift_mainland_source_regions.csv \
            --gift-flora-csv /tmp/pr138/source/gift_native_mainland_flora.csv.gz \
            --pattern-config-path config/chapter1_pr136_biogeographic_pattern.yml \
            --source-config-path config/chapter1_pr138_source_pool_sensitivity.yml \
            --realm-assignment-csv /tmp/pr138/realm/realm/island_biogeographic_realm_assignment.csv \
            --output-dir /tmp/pr138/result

      - name: Summarize source-pool result
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          src = Path('/tmp/pr138/source')
          res = Path('/tmp/pr138/result')
          manifest = json.loads((res/'source_pool_sensitivity_manifest.json').read_text())
          gift = json.loads((src/'gift_source_pool_manifest.json').read_text())
          scale = pd.read_csv(src/'gift_frozen_pca_scale_audit.csv')
          match = pd.read_csv(res/'gift_trait_species_match_audit.csv')
          broad = pd.read_csv(res/'source_adjusted_regime_within.csv')
          broad_slopes = pd.read_csv(res/'source_adjusted_regime_slopes.csv')
          broad_between = pd.read_csv(res/'source_adjusted_regime_between.csv')
          realm = pd.read_csv(res/'source_adjusted_realm_within.csv')
          realm_slopes = pd.read_csv(res/'source_adjusted_realm_slopes.csv')
          realm_between = pd.read_csv(res/'source_adjusted_realm_between.csv')

          def confirm(frame):
              return frame.loc[(frame['stratum'] == 'all_native') & (frame['support_tier'] == 'confirmatory')].copy()

          out = Path('/tmp/pr138/source_pool_summary.md')
          with out.open('w') as f:
              f.write('# PR138 external mainland source-pool sensitivity\n\n')
              f.write('## External source universe\n\n```json\n')
              f.write(json.dumps(gift, indent=2))
              f.write('\n```\n\n## GIFT-to-frozen-trait species matching\n\n```text\n')
              f.write(match.to_string(index=False))
              f.write('\n```\n\n## Frozen-PCA scale audit\n\n```text\n')
              f.write(scale.to_string(index=False))
              f.write('\n```\n\n## Broad-region adjusted omnibus / classic projection\n\n```text\n')
              b = confirm(broad)
              b = b.loc[b['context'].isin(['northern_midlatitude','tropical','southern_extratropical'])]
              cols = [c for c in ['source_mode','context','n_unique_islands','p_value','q_within_stratum_tier','syndrome_vector_supported','northern_classic_projection','q_classic_projection','classic_projection_supported'] if c in b.columns]
              f.write(b[cols].to_string(index=False))
              f.write('\n```\n\n## Broad-region adjusted slopes\n\n```text\n')
              s = confirm(broad_slopes)
              s = s.loc[s['context'].isin(['northern_midlatitude','tropical','southern_extratropical'])]
              cols = [c for c in ['source_mode','context','syndrome','distance_slope','cluster_robust_se','p_value','n_islands'] if c in s.columns]
              f.write(s[cols].to_string(index=False))
              f.write('\n```\n\n## North vs tropical direct adjusted vector tests\n\n```text\n')
              bb = confirm(broad_between)
              bb = bb.loc[((bb['context_a'] == 'northern_midlatitude') & (bb['context_b'] == 'tropical')) | ((bb['context_b'] == 'northern_midlatitude') & (bb['context_a'] == 'tropical'))]
              cols = [c for c in ['source_mode','context_a','context_b','n_unique_islands','p_value','q_within_stratum_tier','regional_syndrome_vector_difference_supported'] if c in bb.columns]
              f.write(bb[cols].to_string(index=False))
              f.write('\n```\n\n## Formal-realm adjusted omnibus / classic projection\n\n```text\n')
              r = confirm(realm)
              r = r.loc[r['context'].isin(['Palearctic','Nearctic','Neotropical','Afrotropical','Indomalayan','Australasian','Oceanian'])]
              cols = [c for c in ['source_mode','context','n_unique_islands','p_value','q_within_stratum_tier','syndrome_vector_supported','northern_classic_projection','q_classic_projection','classic_projection_supported'] if c in r.columns]
              f.write(r[cols].to_string(index=False))
              f.write('\n```\n\n## Formal-realm adjusted slopes\n\n```text\n')
              rs = confirm(realm_slopes)
              rs = rs.loc[rs['context'].isin(['Palearctic','Nearctic','Neotropical'])]
              cols = [c for c in ['source_mode','context','syndrome','distance_slope','cluster_robust_se','p_value','n_islands'] if c in rs.columns]
              f.write(rs[cols].to_string(index=False))
              f.write('\n```\n\n## Palearctic vs Neotropical direct adjusted vector tests\n\n```text\n')
              rb = confirm(realm_between)
              rb = rb.loc[((rb['context_a'] == 'Palearctic') & (rb['context_b'] == 'Neotropical')) | ((rb['context_b'] == 'Palearctic') & (rb['context_a'] == 'Neotropical'))]
              cols = [c for c in ['source_mode','context_a','context_b','n_unique_islands','p_value','q_within_stratum_tier','regional_syndrome_vector_difference_supported'] if c in rb.columns]
              f.write(rb[cols].to_string(index=False))
              f.write('\n```\n\n## Analysis manifest\n\n```json\n')
              f.write(json.dumps(manifest, indent=2))
              f.write('\n```\n')
          PY
          cat /tmp/pr138/source_pool_summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pr138-source-pool-sensitivity-${{ github.run_id }}
          path: /tmp/pr138/
          if-no-files-found: error
          retention-days: 90
