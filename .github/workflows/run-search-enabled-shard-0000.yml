name: run_search_enabled_shard_0000

on:
  push:
    branches:
      - run/search-enabled-shard-0000-20260712
    paths:
      - ".github/workflows/run-search-enabled-shard-0000.yml"

permissions:
  contents: read

jobs:
  prepare-shard-0000:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Prepare complete deterministic shard 0
        run: |
          python -m island_v2.search_enabled_llm_campaign prepare \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --campaign-dir /tmp/search_enabled_llm_shard_0000 \
            --shard-index 0 \
            --shard-count 128 \
            --batch-size 10000
          cat /tmp/search_enabled_llm_shard_0000/campaign_status.json >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path

          campaign = Path('/tmp/search_enabled_llm_shard_0000')
          status = json.loads((campaign / 'campaign_status.json').read_text())
          manifest = campaign / 'jobs_shard_0000.jsonl'
          jobs = [json.loads(line) for line in manifest.read_text().splitlines() if line.strip()]
          assert len(jobs) == status['n_species_in_shard']
          assert len({job['job_id'] for job in jobs}) == len(jobs)
          assert len({job['species'] for job in jobs}) == len(jobs)
          print(json.dumps(status, indent=2))
          print(f"validated complete shard 0 with {len(jobs)} unique species jobs")
          PY
      - name: Upload complete shard 0 campaign state
        uses: actions/upload-artifact@v4
        with:
          name: search-enabled-llm-shard-0000-${{ github.run_id }}
          path: /tmp/search_enabled_llm_shard_0000/
          if-no-files-found: error
          retention-days: 90
