name: run_search_enabled_shard_0000

on:
  push:
    branches:
      - run/search-enabled-shard-0000-20260712
    paths:
      - "src/island_v2/search_engine_shard_packet.py"
      - ".github/workflows/run-search-enabled-shard-0000.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/search_engine_shard_packet.py"
      - ".github/workflows/run-search-enabled-shard-0000.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-shard-0000-search-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Prepare complete deterministic shard 0
        run: |
          python -m island_v2.search_enabled_llm_campaign prepare \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --campaign-dir /tmp/shard_0000 \
            --shard-index 0 \
            --shard-count 128 \
            --batch-size 10000
          cat /tmp/shard_0000/campaign_status.json >> "$GITHUB_STEP_SUMMARY"
      - name: Collect raw web search packets for the full shard
        run: |
          python -m island_v2.search_engine_shard_packet \
            --jobs-jsonl /tmp/shard_0000/jobs_shard_0000.jsonl \
            --output-dir /tmp/shard_0000/search_packets \
            --results-per-query 5 \
            --workers 8
          cat /tmp/shard_0000/search_packets/search_packet_status.json >> "$GITHUB_STEP_SUMMARY"
      - name: Validate shard-scale packet output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          campaign = json.loads(Path('/tmp/shard_0000/campaign_status.json').read_text())
          status = json.loads(Path('/tmp/shard_0000/search_packets/search_packet_status.json').read_text())
          packets = [
              json.loads(line)
              for line in Path('/tmp/shard_0000/search_packets/search_packets.jsonl').read_text().splitlines()
              if line.strip()
          ]
          assert campaign['n_jobs_prepared'] == campaign['n_species_in_shard'], campaign
          assert status['n_jobs'] == campaign['n_species_in_shard'], (status, campaign)
          assert status['n_packets'] + status['n_errors'] == status['n_jobs'], status
          assert len({row['species'] for row in packets}) == len(packets)
          print(json.dumps({'campaign': campaign, 'search': status}, indent=2))
          PY
      - name: Upload complete shard 0 search evidence packet
        uses: actions/upload-artifact@v4
        with:
          name: search-enabled-shard-0000-${{ github.run_id }}
          path: /tmp/shard_0000/
          if-no-files-found: error
          retention-days: 90
