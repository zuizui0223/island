name: Run status-stratified genus-fixed lineage analysis

on:
  pull_request:
    paths:
      - ".github/workflows/run-status-stratified-lineage.yml"
      - "src/island_v2/genus_fixed_trait_null.py"
      - "src/island_v2/status_stratified_lineage_analysis.py"
      - "tests/test_status_stratified_lineage_analysis.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Validate lineage model implementation
        run: |
          ruff check src/island_v2/status_stratified_lineage_analysis.py tests/test_status_stratified_lineage_analysis.py
          pytest -q tests/test_status_stratified_lineage_analysis.py

      - name: Download corrected status, direct traits, and covariates
        run: |
          mkdir -p /tmp/status /tmp/traits /tmp/isolation
          gh run download 32559322028 \
            -n official-wcvp-corroborated-status-32559322028 \
            -D /tmp/status
          gh run download 32551742699 \
            -n reviewed-open-web-evidence-32551742699 \
            -D /tmp/traits
          gh run download 29228212586 \
            -n purpose-shortest-distance-regime-29228212586 \
            -D /tmp/isolation
          test -s /tmp/status/resolved/resolved_floristic_status_ledger.csv.gz
          test -s /tmp/traits/direct_species_trait_ledger.csv.gz
          test -s /tmp/isolation/results/purpose_shortest_island_data.csv

      - name: Build genus-composition-preserving null by floristic stratum
        run: |
          python -m island_v2.genus_fixed_trait_null \
            --island-species-csv data/v2/staging/gbif/collected/island_species_occurrences.csv.gz \
            --status-ledger-csv /tmp/status/resolved/resolved_floristic_status_ledger.csv.gz \
            --direct-evidence-csv /tmp/traits/direct_species_trait_ledger.csv.gz \
            --master-taxa-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --config-path config/flora_status_support.yml \
            --n-draws 100 \
            --seed 20260823 \
            --min-species-per-island 1 \
            --output-dir /tmp/null
          test -s /tmp/null/genus_fixed_null_by_island.csv.gz

      - name: Fit residual isolation slopes by status stratum
        run: |
          python -m island_v2.status_stratified_lineage_analysis \
            --genus-null-csv /tmp/null/genus_fixed_null_by_island.csv.gz \
            --covariates-csv /tmp/isolation/results/purpose_shortest_island_data.csv \
            --output-dir /tmp/lineage
          test -s /tmp/lineage/status_stratified_lineage_isolation.csv

      - name: Summarize scientific checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          iso = pd.read_csv('/tmp/lineage/status_stratified_lineage_isolation.csv')
          support = pd.read_csv('/tmp/lineage/status_stratified_lineage_support.csv')
          focus = iso[
              iso['stratum'].isin(['native_nonendemic','endemic'])
              & iso['regime'].isin(['northern_midlatitude','tropical','southern_extratropical'])
          ].copy()
          focus.to_csv('/tmp/lineage/manuscript_status_stratified_lineage_isolation.csv', index=False)
          payload = {
              'contract': 'status_stratified_lineage_checkpoint_v1',
              'status_run': 32559322028,
              'trait_run': 32551742699,
              'covariate_run': 29228212586,
              'null_draws': 100,
              'isolation_coefficients': focus.to_dict('records'),
              'support': support[
                  support['stratum'].isin(['native_nonendemic','endemic'])
              ].to_dict('records'),
              'guardrail': (
                  'Below-pilot endemic coefficients are numerical diagnostics only and are not biological findings.'
              ),
          }
          Path('/tmp/lineage/status_stratified_lineage_checkpoint.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8'
          )
          print(focus[['stratum','regime','outcome','estimate','cluster_robust_se','p_value',
                       'n_islands','n_clusters','support_class']].to_string(index=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: status-stratified-lineage-${{ github.run_id }}
          path: |
            /tmp/null/genus_fixed_null_manifest.json
            /tmp/null/genus_fixed_null_audit.csv
            /tmp/null/genus_fixed_null_by_island.csv.gz
            /tmp/lineage/status_stratified_lineage_manifest.json
            /tmp/lineage/status_stratified_lineage_coefficients.csv
            /tmp/lineage/status_stratified_lineage_support.csv
            /tmp/lineage/status_stratified_lineage_isolation.csv
            /tmp/lineage/manuscript_status_stratified_lineage_isolation.csv
            /tmp/lineage/status_stratified_lineage_checkpoint.json
          if-no-files-found: error
          retention-days: 90
