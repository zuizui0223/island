name: run_targeted_trait_reacquisition

on:
  pull_request:
    paths:
      - ".github/workflows/run-targeted-trait-reacquisition.yml"
      - "src/island_v2/targeted_acquisition_priority.py"
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Completed targeted acquisition planning run"
        required: false
        default: "29895692897"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: targeted-trait-reacquisition-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.freeze.outputs.shards }}
      shard_count: ${{ steps.freeze.outputs.shard_count }}
      expected_species: ${{ steps.freeze.outputs.expected_species }}
      batch_size: ${{ steps.freeze.outputs.batch_size }}
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id || '29895692897' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download targeted acquisition plan
        run: |
          set -euo pipefail
          mkdir -p /tmp/target-plan
          gh run download "$PLAN_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "targeted-trait-acquisition-plan-$PLAN_RUN_ID" \
            --dir /tmp/target-plan
          find /tmp/target-plan -maxdepth 3 -type f -print
      - id: freeze
        name: Build targeted master and matrix
        run: |
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          import pandas as pd

          root = Path('/tmp/target-plan')
          task_files = list(root.glob('**/targeted_acquisition_tasks.csv.gz'))
          if len(task_files) != 1:
              raise SystemExit(f'expected one targeted task file, found {len(task_files)}')
          tasks = pd.read_csv(task_files[0], dtype=str).fillna('')
          species = sorted(set(tasks['accepted_species']) - {''})
          master = pd.read_csv('data/v2/staging/gbif/collected/island_taxa.csv', dtype=str).fillna('')
          targeted = master.loc[master['accepted_species'].isin(species)].copy()
          missing = sorted(set(species) - set(targeted['accepted_species']))
          if missing:
              raise SystemExit(f'{len(missing)} targeted species absent from master; first={missing[:5]}')
          targeted = targeted.drop_duplicates('accepted_species')
          out = Path('/tmp/targeted-input')
          out.mkdir(parents=True, exist_ok=True)
          targeted.to_csv(out / 'targeted_master.csv.gz', index=False)
          tasks.to_csv(out / 'targeted_acquisition_tasks.csv.gz', index=False)

          n = len(targeted)
          if n < 1:
              raise SystemExit('targeted acquisition plan contains no species')
          shard_count = min(32, n)
          batch = min(500, math.ceil(n / shard_count))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              print('shards=' + json.dumps(list(range(shard_count))), file=fh)
              print(f'shard_count={shard_count}', file=fh)
              print(f'expected_species={n}', file=fh)
              print(f'batch_size={batch}', file=fh)
          print(json.dumps({'target_species': n, 'shards': shard_count, 'batch_size': batch}, indent=2))
          PY
      - name: Build targeted plan and web index
        run: |
          set -euo pipefail
          island-v2-web-trait-shards plan \
            --master-csv /tmp/targeted-input/targeted_master.csv.gz \
            --scope-config-path config/angiosperm_scope.yml \
            --output-dir /tmp/targeted-input/plan \
            --shard-count '${{ steps.freeze.outputs.shard_count }}' \
            --expected-species '${{ steps.freeze.outputs.expected_species }}'
          if ! island-v2-v1-category-search build-web-index \
            --output-json /tmp/targeted-input/plan/web_description_index.json; then
            test -s /tmp/targeted-input/plan/web_description_index.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-reacquisition-input-${{ github.run_id }}
          path: /tmp/targeted-input/
          if-no-files-found: error
          retention-days: 90

  acquire:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CAMPAIGN_DIR: /tmp/targeted-campaign/shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: targeted-reacquisition-input-${{ github.run_id }}
          path: /tmp/targeted-input
      - run: pip install -e ".[dev]"
      - name: Query real providers for targeted species
        run: |
          set -euo pipefail
          mkdir -p "$CAMPAIGN_DIR"
          island-v2-web-trait-shards run \
            --master-csv /tmp/targeted-input/targeted_master.csv.gz \
            --scope-config-path config/angiosperm_scope.yml \
            --campaign-dir "$CAMPAIGN_DIR" \
            --candidate-csv data/v2/staging/traits/global_campaign/machine_candidate_index.csv.gz \
            --shard-index '${{ matrix.shard }}' \
            --shard-count '${{ needs.prepare.outputs.shard_count }}' \
            --batch-size '${{ needs.prepare.outputs.batch_size }}' \
            --max-attempts 3 \
            --expected-species '${{ needs.prepare.outputs.expected_species }}' \
            --web-description-index /tmp/targeted-input/plan/web_description_index.json \
            --pause-seconds 1.0 \
            --europe-pmc \
            --no-openalex \
            --no-world-flora \
            --migrate-v4
      - name: Normalize targeted evidence
        run: |
          python -m island_v2.real_acquisition_ledger \
            --campaign-root "$CAMPAIGN_DIR" \
            --output-dir "$CAMPAIGN_DIR/ledger"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-reacquisition-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ env.CAMPAIGN_DIR }}/campaign_status.json
            ${{ env.CAMPAIGN_DIR }}/checkpoint.csv
            ${{ env.CAMPAIGN_DIR }}/provider_checkpoint.csv
            ${{ env.CAMPAIGN_DIR }}/cumulative/
            ${{ env.CAMPAIGN_DIR }}/ledger/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: acquire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: targeted-reacquisition-shard-*
          path: /tmp/results
      - name: Aggregate newly acquired evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          files = list(Path('/tmp/results').glob('**/ledger/all_master_evidence.csv.gz'))
          if not files:
              raise SystemExit('no targeted evidence ledgers found')
          frames = [pd.read_csv(p, dtype=str).fillna('') for p in files]
          evidence = pd.concat(frames, ignore_index=True).drop_duplicates()
          out = Path('/tmp/final')
          out.mkdir(parents=True, exist_ok=True)
          evidence.to_csv(out / 'targeted_new_evidence.csv.gz', index=False)
          summary = {
              'shards': len(files),
              'new_records': int(len(evidence)),
              'species_with_any_evidence': int(evidence['accepted_species'].nunique()) if len(evidence) else 0,
              'high_records': int((evidence['evidence_quality'] == 'high').sum()) if len(evidence) else 0,
              'medium_records': int((evidence['evidence_quality'] == 'medium').sum()) if len(evidence) else 0,
          }
          (out / 'targeted_reacquisition_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-reacquisition-final-${{ github.run_id }}
          path: /tmp/final/
          if-no-files-found: error
          retention-days: 90
