name: run_three_pass_low

on:
  pull_request:
    paths:
      - ".github/workflows/run-three-pass-low.yml"
  workflow_dispatch:
    inputs:
      pass1_seed_run_id:
        description: "Completed 128-shard pass-1 run containing held low evidence"
        required: false
        default: "29814502655"
        type: string
      pass2_seed_run_id:
        description: "Completed 128-shard pass-2 run containing unresolved tasks"
        required: false
        default: "29819475348"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: three-pass-low-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
      pass1_seed_run_id: ${{ steps.matrix.outputs.pass1_seed_run_id }}
      pass2_seed_run_id: ${{ steps.matrix.outputs.pass2_seed_run_id }}
    steps:
      - id: matrix
        env:
          PASS1_SEED: ${{ inputs.pass1_seed_run_id || '29814502655' }}
          PASS2_SEED: ${{ inputs.pass2_seed_run_id || '29819475348' }}
        run: |
          python - <<'PY'
          import json, os
          p1 = os.environ['PASS1_SEED'].strip()
          p2 = os.environ['PASS2_SEED'].strip()
          if not p1.isdigit() or not p2.isdigit():
              raise SystemExit('seed run IDs must be numeric')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print('shards=' + json.dumps(list(range(128))), file=out)
              print(f'pass1_seed_run_id={p1}', file=out)
              print(f'pass2_seed_run_id={p2}', file=out)
          PY

  pass3-low:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PASS1_SEED_RUN_ID: ${{ needs.plan.outputs.pass1_seed_run_id }}
      PASS2_SEED_RUN_ID: ${{ needs.plan.outputs.pass2_seed_run_id }}
      SHARD_DIR: /tmp/pass3/shard-${{ matrix.shard }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas
      - name: Restore pass-one low evidence and pass-two tasks
        run: |
          set -euo pipefail
          mkdir -p "$SHARD_DIR/pass1" "$SHARD_DIR/pass2"
          for attempt in 1 2 3 4 5; do
            rm -rf "$SHARD_DIR/pass1"/*
            if gh run download "$PASS1_SEED_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "three-pass-pass1-shard-${{ matrix.shard }}-$PASS1_SEED_RUN_ID" \
              --dir "$SHARD_DIR/pass1"; then
              test -s "$SHARD_DIR/pass1/passes/pass1_high/held_low_evidence.csv.gz"
              break
            fi
            if [[ "$attempt" == 5 ]]; then exit 1; fi
            sleep $((attempt * 15))
          done
          for attempt in 1 2 3 4 5; do
            rm -rf "$SHARD_DIR/pass2"/*
            if gh run download "$PASS2_SEED_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "three-pass-pass2-shard-${{ matrix.shard }}-$PASS2_SEED_RUN_ID" \
              --dir "$SHARD_DIR/pass2"; then
              test -s "$SHARD_DIR/pass2/pass3_low_tasks.csv.gz"
              break
            fi
            if [[ "$attempt" == 5 ]]; then exit 1; fi
            sleep $((attempt * 15))
          done
      - name: Resolve pass-three genus evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ['SHARD_DIR'])
          tasks = pd.read_csv(root / 'pass2' / 'pass3_low_tasks.csv.gz', dtype=str).fillna('')
          low = pd.read_csv(root / 'pass1' / 'passes' / 'pass1_high' / 'held_low_evidence.csv.gz', dtype=str).fillna('')
          out = root / 'pass3_low'
          out.mkdir(parents=True, exist_ok=True)

          axes = {
              'flower_colour': {'flower_primary_color', 'flower_color'},
              'floral_structural_complexity': {'floral_form', 'floral_symmetry', 'tube_depth_class', 'flower_size_class', 'inflorescence_display', 'flower_shape'},
              'reproductive_assurance': {'self_incompatibility', 'autonomous_selfing_capacity', 'mating_system', 'cleistogamy'},
          }

          accepted_parts = []
          resolved_keys = set()
          for axis, traits in axes.items():
              rows = low.loc[
                  low['trait_name'].isin(traits)
                  & low['evidence_scope'].eq('genus_inference')
              ].copy()
              if not rows.empty:
                  rows['axis'] = axis
                  accepted_parts.append(rows)
                  resolved_keys.update(zip(rows['accepted_species'], rows['axis']))

          accepted = pd.concat(accepted_parts, ignore_index=True) if accepted_parts else low.iloc[0:0].copy()
          if 'axis' not in accepted.columns:
              accepted['axis'] = ''
          accepted.to_csv(out / 'accepted_low_genus_evidence.csv.gz', index=False)

          unresolved_mask = [
              (species, axis) not in resolved_keys
              for species, axis in zip(tasks['accepted_species'], tasks['axis'])
          ]
          unresolved = tasks.loc[unresolved_mask].copy()
          unresolved['state'] = 'unresolved'
          unresolved['reason'] = 'no_high_medium_or_genus_evidence'
          unresolved.to_csv(out / 'unresolved_after_pass3.csv.gz', index=False)

          summary = {
              'campaign_contract': 'three_pass_species_axis_v1',
              'pass': 3,
              'pass1_seed_run_id': int(os.environ['PASS1_SEED_RUN_ID']),
              'pass2_seed_run_id': int(os.environ['PASS2_SEED_RUN_ID']),
              'input_species_axis_tasks': int(len(tasks)),
              'accepted_low_records': int(len(accepted)),
              'species_with_accepted_low': int(accepted['accepted_species'].nunique()),
              'resolved_species_axis_tasks': int(len(set(zip(accepted['accepted_species'], accepted['axis'])))),
              'unresolved_species_axis_tasks': int(len(unresolved)),
              'family_inference_used': False,
              'global_fallback_used': False,
          }
          (out / 'pass3_summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              for key, value in summary.items():
                  print(f'- {key}: {value}', file=fh)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: three-pass-pass3-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ env.SHARD_DIR }}/pass3_low/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: pass3-low
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: three-pass-pass3-shard-*
          path: /tmp/pass3-results
      - name: Aggregate exact pass-three totals
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          files = list(Path('/tmp/pass3-results').glob('**/pass3_summary.json'))
          if len(files) != 128:
              raise SystemExit(f'expected 128 pass3 summaries, found {len(files)}')
          rows = [json.loads(path.read_text()) for path in files]
          keys = [
              'input_species_axis_tasks',
              'accepted_low_records',
              'species_with_accepted_low',
              'resolved_species_axis_tasks',
              'unresolved_species_axis_tasks',
          ]
          total = {
              'shards': 128,
              'pass': 3,
              'pass1_seed_run_id': rows[0]['pass1_seed_run_id'],
              'pass2_seed_run_id': rows[0]['pass2_seed_run_id'],
          }
          for key in keys:
              total[key] = sum(int(row[key]) for row in rows)
          out = Path('/tmp/pass3-summary')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'pass3_round_summary.json').write_text(
              json.dumps(total, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(total, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              print('## Pass 3 genus evidence resolution', file=fh)
              for key, value in total.items():
                  print(f'- {key}: {value}', file=fh)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: three-pass-pass3-summary-${{ github.run_id }}
          path: /tmp/pass3-summary/pass3_round_summary.json
          if-no-files-found: error
          retention-days: 90
