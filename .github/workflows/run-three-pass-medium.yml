name: run_three_pass_medium

on:
  pull_request:
    paths:
      - ".github/workflows/run-three-pass-medium.yml"
  workflow_dispatch:
    inputs:
      seed_run_id:
        description: "Completed 128-shard pass-1 run"
        required: false
        default: "29814502655"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: three-pass-medium-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
      seed_run_id: ${{ steps.matrix.outputs.seed_run_id }}
    steps:
      - id: matrix
        env:
          REQUESTED_SEED: ${{ inputs.seed_run_id || '29814502655' }}
        run: |
          python - <<'PY'
          import json, os
          seed = os.environ['REQUESTED_SEED'].strip()
          if not seed.isdigit():
              raise SystemExit('seed_run_id must be numeric')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print('shards=' + json.dumps(list(range(128))), file=out)
              print(f'seed_run_id={seed}', file=out)
          PY

  pass2-medium:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SEED_RUN_ID: ${{ needs.plan.outputs.seed_run_id }}
      SHARD_DIR: /tmp/pass2/shard-${{ matrix.shard }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas
      - name: Restore pass-one shard
        run: |
          set -euo pipefail
          mkdir -p "$SHARD_DIR"
          artifact="three-pass-pass1-shard-${{ matrix.shard }}-$SEED_RUN_ID"
          for attempt in 1 2 3 4 5; do
            rm -rf "$SHARD_DIR"/*
            if gh run download "$SEED_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" \
              --dir "$SHARD_DIR"; then
              test -s "$SHARD_DIR/passes/pass1_high/pass2_medium_tasks.csv.gz"
              test -s "$SHARD_DIR/passes/pass1_high/held_medium_evidence.csv.gz"
              break
            fi
            if [[ "$attempt" == 5 ]]; then exit 1; fi
            sleep $((attempt * 15))
          done
      - name: Resolve pass-two medium evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ['SHARD_DIR'])
          p1 = root / 'passes' / 'pass1_high'
          p2 = root / 'passes' / 'pass2_medium'
          p2.mkdir(parents=True, exist_ok=True)

          tasks = pd.read_csv(p1 / 'pass2_medium_tasks.csv.gz', dtype=str).fillna('')
          medium = pd.read_csv(p1 / 'held_medium_evidence.csv.gz', dtype=str).fillna('')
          axes = {
              'flower_colour': {'flower_primary_color', 'flower_color'},
              'floral_structural_complexity': {'floral_form', 'floral_symmetry', 'tube_depth_class', 'flower_size_class', 'inflorescence_display', 'flower_shape'},
              'reproductive_assurance': {'self_incompatibility', 'autonomous_selfing_capacity', 'mating_system', 'cleistogamy'},
          }

          accepted_parts = []
          resolved_keys = set()
          for axis, traits in axes.items():
              rows = medium.loc[
                  medium['trait_name'].isin(traits)
                  & medium['evidence_scope'].isin({'species_direct', 'synonym_direct'})
              ].copy()
              if not rows.empty:
                  rows['axis'] = axis
                  accepted_parts.append(rows)
                  resolved_keys.update(zip(rows['accepted_species'], rows['axis']))

          accepted = pd.concat(accepted_parts, ignore_index=True) if accepted_parts else medium.iloc[0:0].copy()
          if 'axis' not in accepted.columns:
              accepted['axis'] = ''
          accepted.to_csv(p2 / 'accepted_medium_evidence.csv.gz', index=False)

          unresolved_mask = [
              (species, axis) not in resolved_keys
              for species, axis in zip(tasks['accepted_species'], tasks['axis'])
          ]
          pass3 = tasks.loc[unresolved_mask].copy()
          pass3['target_quality'] = 'low'
          pass3['next_pass'] = 3
          pass3['reason'] = 'no_high_or_medium_direct_evidence'
          pass3.to_csv(p2 / 'pass3_low_tasks.csv.gz', index=False)

          summary = {
              'campaign_contract': 'three_pass_species_axis_v1',
              'pass': 2,
              'seed_run_id': int(os.environ['SEED_RUN_ID']),
              'input_species_axis_tasks': int(len(tasks)),
              'accepted_medium_records': int(len(accepted)),
              'species_with_accepted_medium': int(accepted['accepted_species'].nunique()),
              'resolved_species_axis_tasks': int(len(set(zip(accepted['accepted_species'], accepted['axis'])))),
              'pass3_species_axis_tasks': int(len(pass3)),
              'family_inference_used': False,
              'global_fallback_used': False,
          }
          (p2 / 'pass2_summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              for key, value in summary.items():
                  print(f'- {key}: {value}', file=out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: three-pass-pass2-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ env.SHARD_DIR }}/passes/pass2_medium/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: pass2-medium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: three-pass-pass2-shard-*
          path: /tmp/pass2-results
      - name: Aggregate exact pass-two totals
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          files = list(Path('/tmp/pass2-results').glob('**/pass2_summary.json'))
          if len(files) != 128:
              raise SystemExit(f'expected 128 pass2 summaries, found {len(files)}')
          rows = [json.loads(path.read_text()) for path in files]
          keys = [
              'input_species_axis_tasks',
              'accepted_medium_records',
              'species_with_accepted_medium',
              'resolved_species_axis_tasks',
              'pass3_species_axis_tasks',
          ]
          total = {'shards': 128, 'pass': 2, 'seed_run_id': rows[0]['seed_run_id']}
          for key in keys:
              total[key] = sum(int(row[key]) for row in rows)
          out = Path('/tmp/pass2-summary')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'pass2_round_summary.json').write_text(
              json.dumps(total, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(total, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              print('## Pass 2 medium evidence resolution', file=fh)
              for key, value in total.items():
                  print(f'- {key}: {value}', file=fh)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: three-pass-pass2-summary-${{ github.run_id }}
          path: /tmp/pass2-summary/pass2_round_summary.json
          if-no-files-found: error
          retention-days: 90
