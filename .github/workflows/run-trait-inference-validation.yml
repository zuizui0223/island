name: run_trait_inference_validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-trait-inference-validation.yml"
      - "config/trait_inference_validation.yml"
      - "config/trait_fill_cascade.yml"
      - "config/trait_cascade_artifact_lock.json"
      - "src/island_v2/trait_inference_validation.py"
      - "src/island_v2/trait_inference_validation_fast.py"

permissions:
  actions: read
  contents: read

jobs:
  validate-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Compile validation implementation
        run: |
          python -m py_compile \
            src/island_v2/trait_inference_validation.py \
            src/island_v2/trait_inference_validation_fast.py

      - name: Check whether the grounded v4 artifact lock is ready
        id: lock
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          lock = json.loads(Path("config/trait_cascade_artifact_lock.json").read_text())
          validation = yaml.safe_load(
              Path("config/trait_inference_validation.yml").read_text()
          )
          expected_traits = list(validation["validate_traits"])
          failures = []
          if len(expected_traits) != 15 or len(set(expected_traits)) != 15:
              failures.append("validation config is not the canonical 15-trait contract")
          if lock.get("contract") != "trait_fill_cascade_artifact_lock_v2":
              failures.append("artifact lock is not v2")
          if lock.get("cascade_contract_version") != "trait_fill_cascade_shards_v4":
              failures.append("cascade artifact is not v4")
          if lock.get("checkpoint_contract_version") != (
              "trait_fill_cascade_artifact_checkpoint_v2"
          ):
              failures.append("artifact checkpoint is not v2")
          if int(lock.get("n_traits", 0)) != 15:
              failures.append("artifact does not contain 15 traits")
          if list(lock.get("target_traits", [])) != expected_traits:
              failures.append("artifact traits do not match validation traits")
          if int(lock.get("fill_tier_counts", {}).get("global_fallback", 0)) != 0:
              failures.append("artifact still contains global fallback rows")

          ready = not failures
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"ready={str(ready).lower()}\n")
          if failures:
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
                  "a", encoding="utf-8"
              ) as out:
                  out.write("## Grounded validation deferred\n\n")
                  out.write(
                      "The repository still pins the historical cascade artifact. "
                      "Validation will start automatically after the materialized v4 "
                      "artifact lock is promoted.\n\n"
                  )
                  for failure in failures:
                      out.write(f"- {failure}\n")
          PY

      - name: Download and verify locked trait cascade artifact
        if: steps.lock.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCK=config/trait_cascade_artifact_lock.json
          ARTIFACT_ID=$(jq -r '.artifact_id' "$LOCK")
          EXPECTED_ZIP=$(jq -r '.artifact_zip_digest' "$LOCK" | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/trait-cascade.zip
          ACTUAL_ZIP=$(sha256sum /tmp/trait-cascade.zip | awk '{print $1}')
          test "$ACTUAL_ZIP" = "$EXPECTED_ZIP"
          mkdir -p /tmp/trait-cascade-download /tmp/trait-cascade-extracted
          unzip -q /tmp/trait-cascade.zip -d /tmp/trait-cascade-download
          ARCHIVE=$(find /tmp/trait-cascade-download -name trait-fill-cascade-full.tgz -print -quit)
          test -n "$ARCHIVE"
          EXPECTED_ARCHIVE=$(jq -r '.archive_sha256' "$LOCK")
          ACTUAL_ARCHIVE=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          test "$ACTUAL_ARCHIVE" = "$EXPECTED_ARCHIVE"
          tar -xzf "$ARCHIVE" -C /tmp/trait-cascade-extracted
          CASCADE_ROOT=$(find /tmp/trait-cascade-extracted -type d -name fill_cascade -print -quit)
          test -n "$CASCADE_ROOT"
          cd "$CASCADE_ROOT"
          sha256sum -c SHA256SUMS
          CASCADE_ROOT="$CASCADE_ROOT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          root = Path(os.environ["CASCADE_ROOT"])
          lock = json.loads(
              Path(os.environ["GITHUB_WORKSPACE"])
              .joinpath("config/trait_cascade_artifact_lock.json")
              .read_text()
          )
          validation = yaml.safe_load(
              Path(os.environ["GITHUB_WORKSPACE"])
              .joinpath("config/trait_inference_validation.yml")
              .read_text()
          )
          checkpoint = json.loads((root / "artifact_checkpoint.json").read_text())
          manifest = json.loads((root / "cascade_manifest.json").read_text())
          summary = json.loads((root / "fill_coverage_summary.json").read_text())
          expected_traits = list(validation["validate_traits"])
          assert checkpoint["contract_version"] == lock["checkpoint_contract_version"]
          assert checkpoint["cascade_contract_version"] == "trait_fill_cascade_shards_v4"
          assert manifest["contract_version"] == "trait_fill_cascade_shards_v4"
          assert checkpoint["workflow_run_id"] == int(lock["workflow_run_id"])
          assert checkpoint["model_fingerprint"] == lock["model_fingerprint"]
          assert checkpoint["target_traits"] == expected_traits
          assert checkpoint["n_traits"] == len(expected_traits) == 15
          assert checkpoint["n_angiosperm_eligible"] == 106295
          assert checkpoint["n_rows"] == 106295 * 15
          assert checkpoint["n_shards"] == 128 and checkpoint["shards_complete"] is True
          assert checkpoint["global_fallback_rows"] == 0
          assert "global_fallback" not in checkpoint["fill_tier_counts"]
          assert "global_fallback" not in summary["fills_by_tier"]
          assert set(summary["by_trait"]) == set(expected_traits)
          PY

      - name: Run leave-one-species-out cascade validation
        if: steps.lock.outputs.ready == 'true'
        run: |
          set -euo pipefail
          CASCADE_ROOT=$(find /tmp/trait-cascade-extracted -type d -name fill_cascade -print -quit)
          python -m island_v2.trait_inference_validation_fast \
            --cascade-root "$CASCADE_ROOT" \
            --output-dir data/v2/staging/analysis/trait_inference_validation

      - name: Validate and summarize inference accuracy
        if: steps.lock.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import yaml

          root = Path('data/v2/staging/analysis/trait_inference_validation')
          manifest = json.loads((root / 'trait_inference_validation_manifest.json').read_text())
          metrics = pd.read_csv(root / 'trait_inference_loo_metrics.csv')
          binary = pd.read_csv(root / 'focused_binary_validation.csv')
          grid = pd.read_csv(root / 'trait_inference_threshold_grid.csv')
          predictions = pd.read_csv(root / 'trait_inference_loo_predictions.csv')
          config = yaml.safe_load(Path('config/trait_inference_validation.yml').read_text())
          expected_traits = set(config['validate_traits'])
          if manifest['contract'] != 'trait_cascade_grounded_leave_one_species_out_validation_v2':
              raise SystemExit(f"unexpected validation contract: {manifest['contract']}")
          if len(expected_traits) != 15:
              raise SystemExit(f'unexpected target-trait count: {len(expected_traits)}')
          if manifest['n_species_direct_cells'] <= 0:
              raise SystemExit('no species-direct cells were validated')
          if set(manifest['trait_direct_counts']) != expected_traits:
              missing = expected_traits.difference(manifest['trait_direct_counts'])
              extra = set(manifest['trait_direct_counts']).difference(expected_traits)
              raise SystemExit(f'validation trait mismatch: missing={missing}, extra={extra}')
          if set(predictions['trait_name']) != expected_traits:
              raise SystemExit('prediction table does not cover all 15 configured traits')
          expected_grid = (
              15
              * len(config['cascade_policy']['genus_support_grid'])
              * len(config['cascade_policy']['family_support_grid'])
          )
          if len(grid) != expected_grid:
              raise SystemExit(f'unexpected threshold-grid size: {len(grid)}')
          if 'n_unresolved_predictions' not in grid.columns:
              raise SystemExit('threshold grid lacks unresolved prediction accounting')
          if predictions['cascade_prediction_tier'].eq('global_fallback').any():
              raise SystemExit('removed global fallback reappeared in validation')
          allowed_prediction_tiers = {
              'genus_inference', 'family_inference', 'unresolved_no_evidence'
          }
          if not set(predictions['cascade_prediction_tier']).issubset(
              allowed_prediction_tiers
          ):
              raise SystemExit('validation emitted an unsupported prediction tier')
          unresolved = predictions['cascade_prediction_tier'].eq('unresolved_no_evidence')
          if predictions.loc[unresolved, 'cascade_prediction'].fillna('').ne('').any():
              raise SystemExit('unresolved validation rows carry a biological value')
          if predictions.loc[~unresolved, 'cascade_prediction'].fillna('').eq('').any():
              raise SystemExit('grounded validation predictions are blank')
          if not (
              grid['n'] + grid['n_unresolved_predictions']
              == grid['trait_name'].map(manifest['trait_direct_counts'])
          ).all():
              raise SystemExit('unresolved predictions leaked into accuracy denominators')
          focused_trait = config['focused_binary_diagnostic']['trait_name']
          focused = binary.loc[binary['trait_name'].eq(focused_trait)]
          if set(focused['validation_layer']) != {
              'genus_all_evaluable', 'family_all_evaluable', 'cascade_policy'
          }:
              raise SystemExit('focused binary validation layers incomplete')

          summary = {
              'contract': manifest['contract'],
              'input_trait_artifact': json.loads(
                  Path('config/trait_cascade_artifact_lock.json').read_text()
              ),
              'dimensions': {
                  'n_species_direct_cells': manifest['n_species_direct_cells'],
                  'n_direct_species': manifest['n_direct_species'],
                  'trait_direct_counts': manifest['trait_direct_counts'],
              },
              'operational_layer_metrics': metrics.to_dict('records'),
              'focused_binary_validation': focused.to_dict('records'),
              'threshold_grid_complete': True,
              'interpretation_guardrail': (
                  'LOO accuracy validates predictive behavior of inference tiers but never converts inferred cells into direct evidence.'
              ),
          }
          (root / 'trait_inference_validation_summary.json').write_text(
              json.dumps(summary, indent=2) + '\n'
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload inference validation outputs
        if: steps.lock.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trait-inference-validation-${{ github.run_id }}
          path: |
            config/trait_inference_validation.yml
            config/trait_fill_cascade.yml
            config/trait_cascade_artifact_lock.json
            data/v2/staging/analysis/trait_inference_validation/
          if-no-files-found: error
          retention-days: 90
