name: REPLICATION -- v2 brms M0-M4

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-v2-bayesian-m0-m4-main.yml"
      - "analysis/v2/run_bayesian_m0_m4_main.R"
      - "src/island_v2/prepare_v2_bayesian_main_input.py"
      - "src/island_v2/validate_analysis_inputs.py"
      - "config/v2_workflow_registry.yml"
      - "config/integrated_trait_bombus_artifact_lock.json"
      - "config/purpose_shortest_artifact_lock.json"

permissions:
  actions: read
  contents: read

jobs:
  bayesian-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python preparation dependency
        run: |
          pip install -e ".[dev]" duckdb
          python -m py_compile \
            src/island_v2/prepare_v2_bayesian_main_input.py \
            src/island_v2/validate_analysis_inputs.py

      - name: Download locked integrated trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/integrated_trait_bombus_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/integrated_trait_bombus_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/integrated.zip
          test "$(sha256sum /tmp/integrated.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download locked geographic-covariate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/purpose_shortest_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/purpose_shortest_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/covariates.zip
          test "$(sha256sum /tmp/covariates.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/covariates
          unzip -q /tmp/covariates.zip -d /tmp/covariates

      - name: Prepare primary-tier replication input
        run: |
          set -euo pipefail
          MASTER=$(find /tmp/integrated -type f -path '*/bombus_join/primary/island_species_trait_bombus_master.csv.gz' -print -quit)
          COV=$(find /tmp/covariates -type f -name purpose_shortest_island_data.csv -print -quit)
          test -f "$MASTER"
          test -f "$COV"
          python src/island_v2/prepare_v2_bayesian_main_input.py \
            --master-csv-gz "$MASTER" \
            --island-covariates-csv "$COV" \
            --analysis-tier primary \
            --output-csv data/v2/staging/analysis/bayesian_replication/v2_bayesian_replication_input.csv
          python src/island_v2/validate_analysis_inputs.py \
            --input-csv data/v2/staging/analysis/bayesian_replication/v2_bayesian_replication_input.csv \
            --expected-tier primary \
            --reference-islands-csv "$COV"

      - name: Install R and precompiled Bayesian packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base r-cran-brms r-cran-bh r-cran-data.table r-cran-posterior r-cran-loo r-cran-jsonlite r-cran-extradistr
          sudo Rscript -e "install.packages(c('BH', 'StanHeaders'), repos='https://cloud.r-project.org', quiet=TRUE)"
          Rscript -e "parse(file='analysis/v2/run_bayesian_m0_m4_main.R'); library(BH); stopifnot(nchar(system.file('include', package='BH')) > 0); packageVersion('brms'); packageVersion('extraDistr')"

      - name: Run brms M0-M4 replication
        run: |
          set -o pipefail
          mkdir -p data/v2/staging/analysis/bayesian_replication/results
          Rscript analysis/v2/run_bayesian_m0_m4_main.R \
            data/v2/staging/analysis/bayesian_replication/v2_bayesian_replication_input.csv \
            data/v2/staging/analysis/bayesian_replication/results \
            2>&1 | tee data/v2/staging/analysis/bayesian_replication/results/run.log

      - name: Summarize replication results
        if: success()
        run: |
          echo '## brms replication of v2 M0-M4 primary analysis' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Role: alternative-engine replication; not a second primary analysis.' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/analysis/bayesian_replication/results/analysis_metadata.json >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### M0-M3 summed component LOO-ELPD comparison' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/analysis/bayesian_replication/results/m0_m3_scenario_comparison_total_elpd.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### M3 indirect effects' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/analysis/bayesian_replication/results/m3_indirect_effects.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### M4 category-preserving effects' >> "$GITHUB_STEP_SUMMARY"
          head -40 data/v2/staging/analysis/bayesian_replication/results/m4_multinomial_fixed_effects.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload brms replication artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-brms-replication-${{ github.run_id }}
          path: data/v2/staging/analysis/bayesian_replication/
          if-no-files-found: error
          retention-days: 90
