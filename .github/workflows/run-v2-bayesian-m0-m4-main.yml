name: run_v2_bayesian_m0_m4_main

on:
  # Auto-triggers paused: manual dispatch only while the final
  # cross-source trait pilot is being stabilized.
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  bayesian-main:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python preparation dependency
        run: |
          pip install -e ".[dev]" duckdb
          python -m py_compile src/island_v2/prepare_v2_bayesian_main_input.py

      - name: Download locked integrated trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/integrated_trait_bombus_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/integrated_trait_bombus_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/integrated.zip
          test "$(sha256sum /tmp/integrated.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download locked geographic-covariate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/purpose_shortest_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/purpose_shortest_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/covariates.zip
          test "$(sha256sum /tmp/covariates.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/covariates
          unzip -q /tmp/covariates.zip -d /tmp/covariates

      - name: Prepare compact island-level Bayesian input
        run: |
          set -euo pipefail
          MASTER=$(find /tmp/integrated -type f -path '*/bombus_join/sensitivity_all/island_species_trait_bombus_master.csv.gz' -print -quit)
          COV=$(find /tmp/covariates -type f -name purpose_shortest_island_data.csv -print -quit)
          test -f "$MASTER"
          test -f "$COV"
          python src/island_v2/prepare_v2_bayesian_main_input.py \
            --master-csv-gz "$MASTER" \
            --island-covariates-csv "$COV" \
            --output-csv data/v2/staging/analysis/bayesian_main/v2_bayesian_main_input.csv
          python - <<'PY'
          import pandas as pd
          p='data/v2/staging/analysis/bayesian_main/v2_bayesian_main_input.csv'
          d=pd.read_csv(p)
          assert d['island_id'].is_unique
          assert len(d)==8265
          assert (d['color_trials'].fillna(0)>=d['color_plain'].fillna(0)).all()
          assert (d['form_trials'].fillna(0)>=d['form_open_generalized'].fillna(0)).all()
          print(d[['analysis_regime','area_km2','distance_to_continent_km','bombus_deficit','color_trials','form_trials','sc_trials']].describe(include='all'))
          PY

      - name: Install R and precompiled Bayesian packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base r-cran-brms r-cran-bh r-cran-data.table r-cran-posterior r-cran-loo r-cran-jsonlite r-cran-extradistr
          sudo Rscript -e "install.packages(c('BH', 'StanHeaders'), repos='https://cloud.r-project.org', quiet=TRUE)"
          sudo Rscript -e "install.packages('brms', repos='https://cloud.r-project.org', quiet=TRUE)"
          Rscript -e "parse(file='analysis/v2/run_bayesian_m0_m4_main.R'); library(BH); stopifnot(nchar(system.file('include', package='BH')) > 0); packageVersion('brms'); packageVersion('extraDistr')"

      - name: Run Bayesian M0-M4 main analysis
        run: |
          set -o pipefail
          mkdir -p data/v2/staging/analysis/bayesian_main/results
          Rscript analysis/v2/run_bayesian_m0_m4_main.R \
            data/v2/staging/analysis/bayesian_main/v2_bayesian_main_input.csv \
            data/v2/staging/analysis/bayesian_main/results \
            2>&1 | tee data/v2/staging/analysis/bayesian_main/results/run.log

      - name: Summarize main results
        if: success()
        run: |
          echo '## Bayesian v2 M0-M4 main analysis' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/analysis/bayesian_main/results/analysis_metadata.json >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### M0-M3 summed component LOO-ELPD comparison' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/analysis/bayesian_main/results/m0_m3_scenario_comparison_total_elpd.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### M3 indirect effects' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/analysis/bayesian_main/results/m3_indirect_effects.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### M4 category-preserving effects' >> "$GITHUB_STEP_SUMMARY"
          head -40 data/v2/staging/analysis/bayesian_main/results/m4_multinomial_fixed_effects.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bayesian main-analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-bayesian-m0-m4-main-${{ github.run_id }}
          path: data/v2/staging/analysis/bayesian_main/
          if-no-files-found: error
          retention-days: 90
