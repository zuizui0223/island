name: run_v2_color_spde_sensitivity

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/recover-global-trait-artifacts
    paths:
      - ".github/workflows/run-v2-color-spde-sensitivity.yml"
      - "analysis/v2/run_inla_color_spde_sensitivity.R"
      - "scripts/add_all_flora_fine_composition.py"
      - "src/island_v2/build_species_trait_states.py"
      - "src/island_v2/aggregate_island_trait_evidence.py"
      - "src/island_v2/prepare_v2_bayesian_main_input.py"
      - "src/island_v2/ontology/flower_color_fine.yml"
      - "config/integrated_trait_bombus_artifact_lock.json"
      - "config/purpose_shortest_artifact_lock.json"

permissions:
  actions: read
  contents: read

jobs:
  color-spde-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python preparation dependencies
        run: pip install -e ".[dev]" duckdb

      - name: Download locked integrated trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/integrated_trait_bombus_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/integrated_trait_bombus_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/integrated.zip
          test "$(sha256sum /tmp/integrated.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download locked geographic-covariate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/purpose_shortest_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/purpose_shortest_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/covariates.zip
          test "$(sha256sum /tmp/covariates.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/covariates
          unzip -q /tmp/covariates.zip -d /tmp/covariates

      - name: Build SPDE colour input
        run: |
          set -euo pipefail
          MASTER=$(find /tmp/integrated -type f -path '*/bombus_join/sensitivity_all/island_species_trait_bombus_master.csv.gz' -print -quit)
          COV=$(find /tmp/covariates -type f -name purpose_shortest_island_data.csv -print -quit)
          DIR=data/v2/staging/analysis/color_spde
          BASE="$DIR/v2_base_input.csv"
          FINAL="$DIR/v2_final_input.csv"
          MODEL="$DIR/v2_model_input.csv"
          mkdir -p "$DIR"
          test -f "$MASTER"
          test -f "$COV"
          python src/island_v2/prepare_v2_bayesian_main_input.py \
            --master-csv-gz "$MASTER" \
            --island-covariates-csv "$COV" \
            --analysis-tier sensitivity_all \
            --output-csv "$BASE"
          python scripts/add_all_flora_fine_composition.py \
            --model-csv "$BASE" \
            --species-states-parquet "$DIR/input_audit/species_trait_states.parquet" \
            --output-csv "$FINAL"
          python - <<'PY'
          import pandas as pd
          p = 'data/v2/staging/analysis/color_spde/v2_final_input.csv'
          d = pd.read_csv(p)
          colors = ['white','blue','yellow','red','green','cream','rare_other']
          required = {
              'island_latitude','island_longitude','analysis_regime',
              'all_fine_color_trials','fine_color_trials',
              *[f'all_fine_color_{x}' for x in colors],
              *[f'fine_color_{x}' for x in colors],
          }
          missing = sorted(required - set(d.columns))
          assert not missing, missing
          model = d.loc[
              (d['distance_to_continent_km'] > 0) &
              d['island_latitude'].notna() & d['island_longitude'].notna()
          ].copy()
          model.to_csv('data/v2/staging/analysis/color_spde/v2_model_input.csv', index=False)
          print({'n_spde_islands': len(model), 'regimes': sorted(model['analysis_regime'].dropna().unique())})
          PY

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::jsonlite
            any::units
            any::sf
            any::fmesher
          cache: true

      - name: Install, load, and parse INLA SPDE sensitivity
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          options(timeout = 600)
          repos <- c(CRAN = "https://cloud.r-project.org", INLA = "https://inla.r-inla-download.org/R/stable")
          install.packages("INLA", repos = repos, dependencies = c("Depends", "Imports", "LinkingTo"))
          suppressPackageStartupMessages(library(INLA))
          parse(file = "analysis/v2/run_inla_color_spde_sensitivity.R")
          RS

      - name: Run colour SPDE sensitivity
        run: |
          set -o pipefail
          OUT=data/v2/staging/analysis/color_spde/results
          mkdir -p "$OUT"
          Rscript analysis/v2/run_inla_color_spde_sensitivity.R \
            data/v2/staging/analysis/color_spde/v2_model_input.csv \
            "$OUT" 2>&1 | tee "$OUT/run.log"

      - name: Summarize colour SPDE sensitivity
        if: success()
        run: |
          set -euo pipefail
          OUT=data/v2/staging/analysis/color_spde/results
          echo '## Flower-colour SPDE sensitivity' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/color_spde_metadata.json" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Model scores' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/color_spde_model_scores.csv" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Key effects' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/color_spde_key_effects.csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload colour SPDE artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-color-spde-sensitivity-${{ github.run_id }}
          path: data/v2/staging/analysis/color_spde/
          if-no-files-found: error
          retention-days: 90
