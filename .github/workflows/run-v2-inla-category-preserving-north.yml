name: run_v2_inla_category_preserving_north

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/recover-global-trait-artifacts
    paths:
      - ".github/workflows/run-v2-inla-category-preserving-north.yml"
      - "analysis/v2/run_inla_category_preserving_north.R"
      - "src/island_v2/prepare_v2_bayesian_main_input.py"
      - "config/integrated_trait_bombus_artifact_lock.json"
      - "config/purpose_shortest_artifact_lock.json"

permissions:
  actions: read
  contents: read

jobs:
  category-north:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python preparation dependency
        run: pip install -e ".[dev]" duckdb

      - name: Download locked integrated trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/integrated_trait_bombus_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/integrated_trait_bombus_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/integrated.zip
          test "$(sha256sum /tmp/integrated.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download locked geographic-covariate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/purpose_shortest_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/purpose_shortest_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/covariates.zip
          test "$(sha256sum /tmp/covariates.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/covariates
          unzip -q /tmp/covariates.zip -d /tmp/covariates

      - name: Prepare maximum-data model input
        run: |
          set -euo pipefail
          MASTER=$(find /tmp/integrated -type f -path '*/bombus_join/sensitivity_all/island_species_trait_bombus_master.csv.gz' -print -quit)
          COV=$(find /tmp/covariates -type f -name purpose_shortest_island_data.csv -print -quit)
          FULL=data/v2/staging/analysis/inla_category_north/v2_full_input.csv
          MODEL=data/v2/staging/analysis/inla_category_north/v2_model_input.csv
          test -f "$MASTER"
          test -f "$COV"
          python src/island_v2/prepare_v2_bayesian_main_input.py \
            --master-csv-gz "$MASTER" \
            --island-covariates-csv "$COV" \
            --analysis-tier sensitivity_all \
            --output-csv "$FULL"
          python - <<'PY'
          import pandas as pd
          full = pd.read_csv('data/v2/staging/analysis/inla_category_north/v2_full_input.csv')
          model = full.loc[full['distance_to_continent_km'] > 0].copy()
          model.to_csv('data/v2/staging/analysis/inla_category_north/v2_model_input.csv', index=False)
          print({'n_full': len(full), 'n_model': len(model)})
          PY

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::jsonlite
            any::units
            any::sf
          cache: true

      - name: Install R-INLA
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          options(timeout = 600)
          repos <- c(CRAN = "https://cloud.r-project.org", INLA = "https://inla.r-inla-download.org/R/stable")
          install.packages("INLA", repos = repos, dependencies = c("Depends", "Imports", "LinkingTo"))
          if (!requireNamespace("INLA", quietly = TRUE)) stop("INLA install failed")
          parse(file = "analysis/v2/run_inla_category_preserving_north.R")
          RS

      - name: Run category-preserving northern-midlatitude M0-M3
        run: |
          set -o pipefail
          OUT=data/v2/staging/analysis/inla_category_north/results
          mkdir -p "$OUT"
          Rscript analysis/v2/run_inla_category_preserving_north.R \
            data/v2/staging/analysis/inla_category_north/v2_model_input.csv \
            "$OUT" 2>&1 | tee "$OUT/run.log"

      - name: Summarize category-preserving results
        if: success()
        run: |
          OUT=data/v2/staging/analysis/inla_category_north/results
          echo '## Category-preserving northern-midlatitude INLA' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/analysis_metadata.json" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Best model by category' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/category_best_models.csv" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### M3 channel effects' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/m3_category_channel_effects.csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload category-preserving analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-inla-category-north-${{ github.run_id }}
          path: data/v2/staging/analysis/inla_category_north/
          if-no-files-found: error
          retention-days: 90
