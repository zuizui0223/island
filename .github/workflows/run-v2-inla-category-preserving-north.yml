name: run_v2_inla_northern_bombus_mediation_falsification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/recover-global-trait-artifacts
    paths:
      - ".github/workflows/run-v2-inla-category-preserving-north.yml"
      - "analysis/v2/run_inla_category_preserving_north.R"
      - "src/island_v2/prepare_v2_bayesian_main_input.py"
      - "config/integrated_trait_bombus_artifact_lock.json"
      - "config/purpose_shortest_artifact_lock.json"

permissions:
  actions: read
  contents: read

jobs:
  northern-bombus-mediation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python preparation dependency
        run: pip install -e ".[dev]" duckdb

      - name: Download locked integrated trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/integrated_trait_bombus_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/integrated_trait_bombus_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/integrated.zip
          test "$(sha256sum /tmp/integrated.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download locked geographic-covariate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/purpose_shortest_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/purpose_shortest_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/covariates.zip
          test "$(sha256sum /tmp/covariates.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/covariates
          unzip -q /tmp/covariates.zip -d /tmp/covariates

      - name: Prepare maximum-data model input
        run: |
          set -euo pipefail
          MASTER=$(find /tmp/integrated -type f -path '*/bombus_join/sensitivity_all/island_species_trait_bombus_master.csv.gz' -print -quit)
          COV=$(find /tmp/covariates -type f -name purpose_shortest_island_data.csv -print -quit)
          FULL=data/v2/staging/analysis/inla_category_north/v2_full_input.csv
          MODEL=data/v2/staging/analysis/inla_category_north/v2_model_input.csv
          test -f "$MASTER"
          test -f "$COV"
          python src/island_v2/prepare_v2_bayesian_main_input.py \
            --master-csv-gz "$MASTER" \
            --island-covariates-csv "$COV" \
            --analysis-tier sensitivity_all \
            --output-csv "$FULL"
          python - <<'PY'
          import pandas as pd

          path = 'data/v2/staging/analysis/inla_category_north/v2_full_input.csv'
          full = pd.read_csv(path)
          colour = [
              'color_plain', 'color_yellow_orange',
              'color_red_pink', 'color_blue_purple',
          ]
          form = [
              'form_open_generalized', 'form_tubular_trumpet',
              'form_zygomorphic_specialized', 'form_composite_brush',
          ]
          required = {'color_trials', 'form_trials', *colour, *form}
          missing = sorted(required - set(full.columns))
          assert not missing, f'missing retained category columns: {missing}'

          for col in colour:
              assert (full[col].fillna(0) <= full['color_trials'].fillna(0)).all(), col
          for col in form:
              assert (full[col].fillna(0) <= full['form_trials'].fillna(0)).all(), col

          colour_sum = full[colour].fillna(0).sum(axis=1)
          form_sum = full[form].fillna(0).sum(axis=1)
          assert colour_sum.equals(full['color_trials'].fillna(0)), 'colour categories do not exhaust color_trials'
          assert form_sum.equals(full['form_trials'].fillna(0)), 'form categories do not exhaust form_trials'

          model = full.loc[full['distance_to_continent_km'] > 0].copy()
          model.to_csv('data/v2/staging/analysis/inla_category_north/v2_model_input.csv', index=False)
          print({
              'n_full': len(full),
              'n_model': len(model),
              'retained_colour_categories': len(colour),
              'retained_form_categories': len(form),
              'colour_totals_verified': True,
              'form_totals_verified': True,
          })
          PY

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::jsonlite
            any::units
            any::sf
          cache: true

      - name: Install R-INLA
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          options(timeout = 600)
          repos <- c(CRAN = "https://cloud.r-project.org", INLA = "https://inla.r-inla-download.org/R/stable")
          install.packages("INLA", repos = repos, dependencies = c("Depends", "Imports", "LinkingTo"))
          if (!requireNamespace("INLA", quietly = TRUE)) stop("INLA install failed")
          parse(file = "analysis/v2/run_inla_category_preserving_north.R")
          RS

      - name: Run all-category northern paths and global falsification
        run: |
          set -o pipefail
          OUT=data/v2/staging/analysis/inla_category_north/results
          mkdir -p "$OUT"
          Rscript analysis/v2/run_inla_category_preserving_north.R \
            data/v2/staging/analysis/inla_category_north/v2_model_input.csv \
            "$OUT" 2>&1 | tee "$OUT/run.log"

      - name: Summarize all-category results
        if: success()
        run: |
          set -euo pipefail
          OUT=data/v2/staging/analysis/inla_category_north/results
          echo '## All-category northern Bombus paths with tropical/southern falsification' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/analysis_metadata.json" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Equation-specific maximum support' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/northern_equation_support.csv" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Northern model comparisons' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/northern_model_comparisons.csv" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Direct, indirect, and total effects for every retained category' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/northern_direct_indirect_total_effects.csv" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Tropical and southern falsification for every retained category' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/cross_regime_isolation_summary.csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload all-category mediation and falsification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-all-category-northern-paths-falsification-${{ github.run_id }}
          path: data/v2/staging/analysis/inla_category_north/
          if-no-files-found: error
          retention-days: 90
