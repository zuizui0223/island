name: run_v2_inla_all_data_layered_analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/recover-global-trait-artifacts
    paths:
      - ".github/workflows/run-v2-inla-category-preserving-north.yml"
      - "analysis/v2/run_inla_category_preserving_north.R"
      - "src/island_v2/prepare_v2_bayesian_main_input.py"
      - "config/integrated_trait_bombus_artifact_lock.json"
      - "config/purpose_shortest_artifact_lock.json"

permissions:
  actions: read
  contents: read

jobs:
  all-data-layered-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python preparation dependency
        run: pip install -e ".[dev]" duckdb

      - name: Download locked integrated trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/integrated_trait_bombus_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/integrated_trait_bombus_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/integrated.zip
          test "$(sha256sum /tmp/integrated.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download locked geographic-covariate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/purpose_shortest_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/purpose_shortest_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/covariates.zip
          test "$(sha256sum /tmp/covariates.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/covariates
          unzip -q /tmp/covariates.zip -d /tmp/covariates

      - name: Prepare and audit complete layered model input
        run: |
          set -euo pipefail
          MASTER=$(find /tmp/integrated -type f -path '*/bombus_join/sensitivity_all/island_species_trait_bombus_master.csv.gz' -print -quit)
          COV=$(find /tmp/covariates -type f -name purpose_shortest_island_data.csv -print -quit)
          FULL=data/v2/staging/analysis/inla_category_north/v2_full_input.csv
          MODEL=data/v2/staging/analysis/inla_category_north/v2_model_input.csv
          test -f "$MASTER"
          test -f "$COV"
          python src/island_v2/prepare_v2_bayesian_main_input.py \
            --master-csv-gz "$MASTER" \
            --island-covariates-csv "$COV" \
            --analysis-tier sensitivity_all \
            --output-csv "$FULL"
          python - <<'PY'
          import pandas as pd

          full = pd.read_csv('data/v2/staging/analysis/inla_category_north/v2_full_input.csv')
          colours = ['color_plain', 'color_yellow_orange', 'color_red_pink', 'color_blue_purple']
          forms = [
              'form_open_generalized', 'form_tubular_trumpet',
              'form_zygomorphic_specialized', 'form_composite_brush',
          ]
          full_flora = [
              'wind_mixed_trials', 'wind_mixed_successes', 'wind_mixed_share',
              'animal_status_observed', 'n_animal_species', 'n_wind_species',
              'sc_trials', 'sc_successes', 'sc_share',
          ]
          bombus = [
              'bombus_deficit', 'bombus_environmental_compatibility',
              'environmental_compatibility_max', 'environmental_compatibility_mean',
              'environmental_extrapolation_share', 'n_bombus_species_total',
              'n_bombus_species_scored', 'n_bombus_species_unscored',
              'n_environmentally_compatible_species',
          ]
          guilds = [
              'showy_alternative_guild_trials', 'showy_alternative_guild_successes',
              'other_bee_guild_trials', 'other_bee_guild_successes',
              'generalist_insect_guild_trials', 'generalist_insect_guild_successes',
          ]
          required = set(['color_trials', 'form_trials', 'analysis_regime'] + colours + forms + full_flora + bombus + guilds)
          missing = sorted(required - set(full.columns))
          assert not missing, f'missing analysis columns: {missing}'
          assert (full[colours].fillna(0).sum(axis=1) == full['color_trials'].fillna(0)).all()
          assert (full[forms].fillna(0).sum(axis=1) == full['form_trials'].fillna(0)).all()
          assert ((full['n_animal_species'] + full['n_wind_species']).fillna(0) == full['animal_status_observed'].fillna(0)).all()
          assert (full['wind_mixed_trials'].fillna(0) == full['animal_status_observed'].fillna(0)).all()
          assert (full['wind_mixed_successes'].fillna(0) == full['n_wind_species'].fillna(0)).all()
          regimes = set(full['analysis_regime'].dropna().unique())
          expected_regimes = {
              'northern_midlatitude', 'northern_high_latitude',
              'tropical', 'southern_extratropical',
          }
          assert expected_regimes.issubset(regimes), regimes
          model = full.loc[full['distance_to_continent_km'] > 0].copy()
          model.to_csv('data/v2/staging/analysis/inla_category_north/v2_model_input.csv', index=False)
          print({
              'n_full': len(full), 'n_model': len(model),
              'colour_categories': colours, 'form_categories': forms,
              'regimes': sorted(regimes),
              'wind_mixed_trials_total': int(full['wind_mixed_trials'].fillna(0).sum()),
              'animal_pollinated_total': int(full['n_animal_species'].fillna(0).sum()),
          })
          PY

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::jsonlite
            any::units
            any::sf
          cache: true

      - name: Install and parse R-INLA analysis
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          options(timeout = 600)
          repos <- c(CRAN = "https://cloud.r-project.org", INLA = "https://inla.r-inla-download.org/R/stable")
          install.packages("INLA", repos = repos, dependencies = c("Depends", "Imports", "LinkingTo"))
          if (!requireNamespace("INLA", quietly = TRUE)) stop("INLA install failed")
          parse(file = "analysis/v2/run_inla_category_preserving_north.R")
          RS

      - name: Run layered all-data INLA analysis
        run: |
          set -o pipefail
          OUT=data/v2/staging/analysis/inla_category_north/results
          mkdir -p "$OUT"
          Rscript analysis/v2/run_inla_category_preserving_north.R \
            data/v2/staging/analysis/inla_category_north/v2_model_input.csv \
            "$OUT" 2>&1 | tee "$OUT/run.log"

      - name: Summarize layered results
        if: success()
        run: |
          set -euo pipefail
          OUT=data/v2/staging/analysis/inla_category_north/results
          echo '## Layered all-data INLA analysis' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/analysis_metadata.json" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Equation support' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/equation_support_all_layers.csv" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Direct, indirect, total effects' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/direct_indirect_total_effects_all_categories.csv" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Four-regime isolation tests' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/cross_regime_isolation_summary_all_outcomes.csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload layered all-data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-layered-all-data-inla-${{ github.run_id }}
          path: data/v2/staging/analysis/inla_category_north/
          if-no-files-found: error
          retention-days: 90
