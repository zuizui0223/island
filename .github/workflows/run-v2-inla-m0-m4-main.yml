name: run_v2_inla_m0_m4_main

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/recover-global-trait-artifacts
    paths:
      - ".github/workflows/run-v2-inla-m0-m4-main.yml"
      - "analysis/v2/run_inla_m0_m4_main.R"
      - "src/island_v2/prepare_v2_bayesian_main_input.py"
      - "src/island_v2/build_species_trait_states.py"
      - "src/island_v2/aggregate_island_trait_evidence.py"
      - "src/island_v2/build_bombus_channel.py"
      - "src/island_v2/build_analysis_contract.py"
      - "src/island_v2/validate_analysis_inputs.py"
      - "src/island_v2/ontology/**"
      - "config/v2_analysis_contract.yml"
      - "config/integrated_trait_bombus_artifact_lock.json"
      - "config/purpose_shortest_artifact_lock.json"

permissions:
  actions: read
  contents: read

jobs:
  inla-main:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python preparation dependency
        run: |
          pip install -e ".[dev]" duckdb
          python -m py_compile \
            src/island_v2/prepare_v2_bayesian_main_input.py \
            src/island_v2/build_species_trait_states.py \
            src/island_v2/aggregate_island_trait_evidence.py \
            src/island_v2/build_bombus_channel.py \
            src/island_v2/build_analysis_contract.py \
            src/island_v2/validate_analysis_inputs.py

      - name: Download locked integrated trait-Bombus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/integrated_trait_bombus_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/integrated_trait_bombus_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/integrated.zip
          test "$(sha256sum /tmp/integrated.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/integrated
          unzip -q /tmp/integrated.zip -d /tmp/integrated

      - name: Download locked geographic-covariate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifact_id' config/purpose_shortest_artifact_lock.json)
          EXPECTED=$(jq -r '.artifact_digest' config/purpose_shortest_artifact_lock.json | sed 's/^sha256://')
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/covariates.zip
          test "$(sha256sum /tmp/covariates.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p /tmp/covariates
          unzip -q /tmp/covariates.zip -d /tmp/covariates

      - name: Prepare auditable all-data INLA input
        run: |
          set -euo pipefail
          MASTER=$(find /tmp/integrated -type f -path '*/bombus_join/sensitivity_all/island_species_trait_bombus_master.csv.gz' -print -quit)
          COV=$(find /tmp/covariates -type f -name purpose_shortest_island_data.csv -print -quit)
          FULL=data/v2/staging/analysis/inla_main/v2_inla_full_universe_input.csv
          MODEL=data/v2/staging/analysis/inla_main/v2_inla_all_data_model_input.csv
          test -f "$MASTER"
          test -f "$COV"
          python src/island_v2/prepare_v2_bayesian_main_input.py \
            --master-csv-gz "$MASTER" \
            --island-covariates-csv "$COV" \
            --analysis-tier sensitivity_all \
            --output-csv "$FULL"
          python src/island_v2/validate_analysis_inputs.py \
            --input-csv "$FULL" \
            --expected-tier sensitivity_all \
            --reference-islands-csv "$COV"
          python - <<'PY'
          import pandas as pd
          full_path = 'data/v2/staging/analysis/inla_main/v2_inla_full_universe_input.csv'
          model_path = 'data/v2/staging/analysis/inla_main/v2_inla_all_data_model_input.csv'
          d = pd.read_csv(full_path)
          zero = d['distance_zero_flag'].astype(bool)
          support = d['primary_distance_support'].astype(bool)
          assert zero.equals(d['distance_to_continent_km'].eq(0))
          assert support.equals(d['distance_to_continent_km'].gt(0))
          d.loc[support].to_csv(model_path, index=False)
          model = pd.read_csv(model_path)
          assert (model['distance_to_continent_km'] > 0).all()
          print({
              'analysis_tier': 'sensitivity_all',
              'n_frozen_universe': int(len(d)),
              'n_distance_zero_audit': int(zero.sum()),
              'n_distance_positive_model_input': int(support.sum()),
          })
          print(d[['analysis_tier', 'analysis_regime', 'area_km2', 'distance_to_continent_km', 'bombus_deficit', 'color_trials', 'form_trials', 'sc_trials']].describe(include='all'))
          PY

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libsqlite3-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::jsonlite
            any::units
            any::sf
          cache: true

      - name: Install R-INLA
        run: |
          set -euo pipefail
          mkdir -p data/v2/staging/analysis/inla_main/results
          Rscript - <<'RS' 2>&1 | tee data/v2/staging/analysis/inla_main/results/install_inla.log
          options(timeout = 600)
          repos <- c(
            CRAN = "https://cloud.r-project.org",
            INLA = "https://inla.r-inla-download.org/R/stable"
          )
          options(repos = repos, download.file.method = "libcurl")

          ok <- FALSE
          for (attempt in seq_len(5)) {
            message("INLA install attempt ", attempt, "/5")
            try(
              install.packages(
                "INLA",
                repos = repos,
                dependencies = c("Depends", "Imports", "LinkingTo")
              ),
              silent = TRUE
            )
            if (requireNamespace("INLA", quietly = TRUE)) {
              ok <- TRUE
              break
            }
            Sys.sleep(15 * attempt)
          }

          if (!ok) {
            stop(
              "Failed to install INLA after 5 attempts. ",
              "The official INLA repository index may be temporarily unavailable."
            )
          }

          parse(file = "analysis/v2/run_inla_m0_m4_main.R")
          INLA::inla.version()
          RS

      - name: Run INLA M0-M4 all-data analysis
        run: |
          set -o pipefail
          mkdir -p data/v2/staging/analysis/inla_main/results
          Rscript analysis/v2/run_inla_m0_m4_main.R \
            data/v2/staging/analysis/inla_main/v2_inla_all_data_model_input.csv \
            data/v2/staging/analysis/inla_main/results \
            2>&1 | tee data/v2/staging/analysis/inla_main/results/run.log

      - name: Summarize INLA all-data results
        if: success()
        run: |
          echo '## INLA v2 M0-M4 all-data analysis' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/analysis/inla_main/results/analysis_metadata.json >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### M0-M3 scenario comparison' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/analysis/inla_main/results/inla_m0_m3_scenario_comparison.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### M3 indirect effects' >> "$GITHUB_STEP_SUMMARY"
          cat data/v2/staging/analysis/inla_main/results/inla_m3_indirect_effects.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload INLA all-data analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-inla-m0-m4-all-data-${{ github.run_id }}
          path: data/v2/staging/analysis/inla_main/
          if-no-files-found: error
          retention-days: 90
