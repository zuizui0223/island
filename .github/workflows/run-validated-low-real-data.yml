name: run_validated_low_real_data

on:
  pull_request:
    paths:
      - ".github/workflows/run-validated-low-real-data.yml"
      - "src/island_v2/validated_low_inference.py"
      - "tests/test_validated_low_inference.py"
  workflow_dispatch:
    inputs:
      pass1_run_id:
        description: "Completed pass-1 run containing accepted high evidence"
        required: false
        default: "29814502655"
        type: string
      pass2_run_id:
        description: "Completed pass-2 run containing accepted medium evidence"
        required: false
        default: "29819475348"
        type: string
      pass3_run_id:
        description: "Completed pass-3 run containing unresolved tasks"
        required: false
        default: "29840507345"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: validated-low-real-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-global-direct-evidence:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PASS1_RUN_ID: ${{ inputs.pass1_run_id || '29814502655' }}
      PASS2_RUN_ID: ${{ inputs.pass2_run_id || '29819475348' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas
      - name: Download all direct-evidence shards
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct/pass1 /tmp/direct/pass2
          gh run download "$PASS1_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "three-pass-pass1-shard-*-$PASS1_RUN_ID" --dir /tmp/direct/pass1
          gh run download "$PASS2_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "three-pass-pass2-shard-*-$PASS2_RUN_ID" --dir /tmp/direct/pass2
      - name: Build global high-medium evidence table
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          high_files = list(Path('/tmp/direct/pass1').glob('**/accepted_high_evidence.csv.gz'))
          medium_files = list(Path('/tmp/direct/pass2').glob('**/accepted_medium_evidence.csv.gz'))
          if len(high_files) != 128:
              raise SystemExit(f'expected 128 high evidence files, found {len(high_files)}')
          if len(medium_files) != 128:
              raise SystemExit(f'expected 128 medium evidence files, found {len(medium_files)}')

          frames = [pd.read_csv(p, dtype=str).fillna('') for p in high_files + medium_files]
          evidence = pd.concat(frames, ignore_index=True)
          evidence = evidence.drop_duplicates()
          out = Path('/tmp/global-evidence')
          out.mkdir(parents=True, exist_ok=True)
          evidence.to_csv(out / 'global_direct_evidence.csv.gz', index=False)
          print(f'high_files={len(high_files)}')
          print(f'medium_files={len(medium_files)}')
          print(f'direct_records={len(evidence)}')
          print(f'direct_species={evidence.accepted_species.nunique()}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validated-low-global-direct-evidence-${{ github.run_id }}
          path: /tmp/global-evidence/global_direct_evidence.csv.gz
          if-no-files-found: error
          retention-days: 90

  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - id: matrix
        run: |
          python - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print('shards=' + json.dumps(list(range(128))), file=out)
          PY

  infer-structural-low:
    needs: [build-global-direct-evidence, plan]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PASS3_RUN_ID: ${{ inputs.pass3_run_id || '29840507345' }}
      WORK_DIR: /tmp/validated-low/shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: validated-low-global-direct-evidence-${{ github.run_id }}
          path: /tmp/global-evidence
      - name: Restore unresolved pass-three shard
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/pass3"
          gh run download "$PASS3_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "three-pass-pass3-shard-${{ matrix.shard }}-$PASS3_RUN_ID" \
            --dir "$WORK_DIR/pass3"
          test -s "$WORK_DIR/pass3/unresolved_after_pass3.csv.gz"
      - name: Restrict first real run to floral structure
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          root = Path(os.environ['WORK_DIR'])
          tasks = pd.read_csv(root / 'pass3' / 'unresolved_after_pass3.csv.gz', dtype=str).fillna('')
          tasks = tasks.loc[tasks['axis'].eq('floral_structural_complexity')].copy()
          tasks.to_csv(root / 'structural_unresolved.csv.gz', index=False)
          print(f'structural_tasks={len(tasks)}')
          PY
      - name: Infer validated genus-level structural evidence
        run: |
          python -m island_v2.validated_low_inference build \
            --unresolved-csv "$WORK_DIR/structural_unresolved.csv.gz" \
            --evidence-csv /tmp/global-evidence/global_direct_evidence.csv.gz \
            --output-dir "$WORK_DIR/output" \
            --min-species 3 \
            --min-dominance 0.80 \
            --min-masked-accuracy 0.75
          cat "$WORK_DIR/output/validated_low_summary.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-low-structure-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ env.WORK_DIR }}/output/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: infer-structural-low
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: validated-low-structure-shard-*
          path: /tmp/results
      - name: Aggregate exact validated-low totals
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd

          summaries = list(Path('/tmp/results').glob('**/validated_low_summary.json'))
          if len(summaries) != 128:
              raise SystemExit(f'expected 128 summaries, found {len(summaries)}')
          rows = [json.loads(p.read_text()) for p in summaries]
          total = {
              'contract': 'validated_low_real_data_v1',
              'axis': 'floral_structural_complexity',
              'shards': 128,
              'input_tasks': sum(int(r['input_tasks']) for r in rows),
              'accepted_low_records': sum(int(r['accepted_low_records']) for r in rows),
              'resolved_species_axis_tasks': sum(int(r['resolved_species_axis_tasks']) for r in rows),
              'remaining_tasks': sum(int(r['remaining_tasks']) for r in rows),
              'family_inference_used': False,
              'global_fallback_used': False,
          }
          accepted_files = list(Path('/tmp/results').glob('**/accepted_validated_low_evidence.csv.gz'))
          accepted = pd.concat([pd.read_csv(p, dtype=str).fillna('') for p in accepted_files], ignore_index=True)
          unresolved_files = list(Path('/tmp/results').glob('**/unresolved_after_validated_low.csv.gz'))
          unresolved = pd.concat([pd.read_csv(p, dtype=str).fillna('') for p in unresolved_files], ignore_index=True)
          rules_files = list(Path('/tmp/results').glob('**/validated_genus_rules.csv.gz'))
          rules = pd.concat([pd.read_csv(p, dtype=str).fillna('') for p in rules_files], ignore_index=True).drop_duplicates()

          out = Path('/tmp/final')
          out.mkdir(parents=True, exist_ok=True)
          accepted.to_csv(out / 'accepted_validated_low_structure.csv.gz', index=False)
          unresolved.to_csv(out / 'unresolved_after_validated_low_structure.csv.gz', index=False)
          rules.to_csv(out / 'validated_structural_genus_rules.csv.gz', index=False)
          (out / 'validated_low_structure_summary.json').write_text(json.dumps(total, indent=2) + '\n')
          print(json.dumps(total, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              print('## Validated low inference on real structural data', file=fh)
              for key, value in total.items():
                  print(f'- {key}: {value}', file=fh)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validated-low-structure-final-${{ github.run_id }}
          path: /tmp/final/
          if-no-files-found: error
          retention-days: 90
