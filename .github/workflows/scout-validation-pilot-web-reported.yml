name: scout_validation_pilot_web_reported

# Stage-1B (A): Wikipedia/Wikidata reported-evidence scout for the validation pilot.
# Resolves each species to its Wikidata item and English Wikipedia article and emits
# unreviewed `reported` M0/M1 candidates where a controlled-vocabulary term appears
# verbatim. Web/DB explicit statements are kept with full provenance. It never calls an
# LLM and decides no value.
on:
  workflow_dispatch:
    inputs:
      species_csv:
        description: "Repository path to the pilot species CSV."
        required: false
        default: "data/v2/staging/traits/validation_pilot/validation_pilot_species.csv"
        type: string
      max_taxa:
        description: "Bounded number of species to query (<= 500)."
        required: false
        default: "50"
        type: string

permissions:
  contents: read

concurrency:
  group: validation-pilot-web-reported-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test web-reported-scout boundaries
        run: pytest -q tests/test_trait_web_reported_scout.py
      - name: Verify pilot input exists
        run: test -f "${{ inputs.species_csv }}"
      - name: Scout Wikipedia/Wikidata for unreviewed reported candidates
        run: |
          python -m island_v2.trait_web_reported_scout scout \
            --species-csv "${{ inputs.species_csv }}" \
            --output-dir /tmp/web_reported_scout \
            --max-taxa "${{ inputs.max_taxa }}"
      - name: Summarize web reported scout
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/web_reported_scout/web_reported_scout_report.json').read_text())
          print('## Stage-1B Wikipedia/Wikidata reported scout')
          for key, value in report.items():
              if key != 'lookup_errors':
                  print(f'- {key}: {value}')
          print('- candidate_class: reported (explicit statements only); no value decided')
          PY
      - name: Upload web reported candidates
        uses: actions/upload-artifact@v4
        with:
          name: validation-pilot-web-reported-${{ github.run_id }}
          path: /tmp/web_reported_scout/
          if-no-files-found: error
          retention-days: 90
