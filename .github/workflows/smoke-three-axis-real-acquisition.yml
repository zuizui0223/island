name: smoke_three_axis_real_acquisition

on:
  push:
    branches: [codex/direct-evidence-continuation]
    paths:
      - ".github/workflows/smoke-three-axis-real-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/direct-evidence-continuation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Build 106295-species shard plan
        run: |
          set -euo pipefail
          island-v2-web-trait-shards plan \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --scope-config-path config/angiosperm_scope.yml \
            --output-dir /tmp/plan \
            --shard-count 128 \
            --expected-species 106295
          if ! island-v2-v1-category-search build-web-index \
            --output-json /tmp/plan/web_description_index.json; then
            test -s /tmp/plan/web_description_index.json
          fi
      - name: Query real providers for 20 species
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke
          island-v2-web-trait-shards run \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --scope-config-path config/angiosperm_scope.yml \
            --campaign-dir /tmp/smoke \
            --candidate-csv data/v2/staging/traits/global_campaign/machine_candidate_index.csv.gz \
            --priority-audit-csv /tmp/plan/acquisition_priority.csv.gz \
            --shard-index 0 \
            --shard-count 128 \
            --batch-size 20 \
            --max-attempts 1 \
            --expected-species 106295 \
            --web-description-index /tmp/plan/web_description_index.json \
            --pause-seconds 0.2 \
            --europe-pmc \
            --no-openalex \
            --no-world-flora \
            --migrate-v4
      - name: Aggregate evidence and progress
        run: |
          set -euo pipefail
          python -m island_v2.full_coverage_trait_campaign build \
            --campaign-root /tmp/smoke \
            --output-dir /tmp/smoke-summary
          cat /tmp/smoke/campaign_status.json >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/smoke-summary/collection_round_summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-axis-real-acquisition-smoke-${{ github.run_id }}
          path: |
            /tmp/smoke/
            /tmp/smoke-summary/
          if-no-files-found: error
          retention-days: 30
