name: submit_gbif_block_pilot

on:
  workflow_dispatch:
    inputs:
      manifest_run_id:
        description: "Run ID of prepare_gbif_block_requests artifact"
        required: true
        type: string
      max_requests:
        description: "Prepared regional blocks to submit in this pilot"
        required: true
        default: "3"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: gbif-downloads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e .
      - name: Restore prepared request manifest
        uses: actions/download-artifact@v4
        with:
          name: gbif-block-requests-${{ inputs.manifest_run_id }}
          run-id: ${{ inputs.manifest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Submit bounded GBIF pilot
        env:
          GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
          GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
        run: |
          test -n "$GBIF_USERNAME" || { echo 'GBIF_USERNAME secret is missing.' >&2; exit 2; }
          test -n "$GBIF_PASSWORD" || { echo 'GBIF_PASSWORD secret is missing.' >&2; exit 2; }
          island-v2-gbif-flora submit \
            --request-manifest input/gbif_block_request_manifest.csv \
            --max-requests "${{ inputs.max_requests }}" \
            --sleep-seconds 2
      - name: Report request-state summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          path = 'input/gbif_block_request_manifest.csv'
          table = pd.read_csv(path, dtype=str).fillna('')
          print('## GBIF regional pilot state')
          print(table['request_status'].value_counts().rename_axis('status').to_frame('n').to_csv())
          submitted = table.loc[table['request_status'].eq('submitted'), ['block_id', 'regional_cell', 'n_islands', 'download_key']]
          if not submitted.empty:
              print('### Submitted blocks')
              print('```csv')
              print(submitted.to_csv(index=False), end='')
              print('```')
          PY
      - name: Upload GBIF download state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-block-download-state-${{ github.run_id }}
          path: |
            input/gbif_block_request_manifest.csv
            input/gbif_block_members.csv
            input/gbif_block_policy.json
            input/gbif_block_taxon_resolution.json
            input/islands_v2.gpkg
            input/island_manifest.csv
            input/source_policy.json
          if-no-files-found: warn
          retention-days: 90
