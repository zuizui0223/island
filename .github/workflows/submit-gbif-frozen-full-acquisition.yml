name: submit_gbif_frozen_full_acquisition

# Manual-dispatch only. This used to also fire on push/schedule, which is
# exactly what raced against poll/reconcile pushing to the same ledger file
# and produced the non-fast-forward push failure recorded for run
# 28660644067. Resuming real GBIF submissions spends the account's live
# quota, so each batch is now a deliberate, explicit action.
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new blocks to submit this run"
        required: false
        default: "3"
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: gbif-full-acquisition
  cancel-in-progress: false

jobs:
  submit-next-batch:
    runs-on: ubuntu-latest
    environment: gbif-downloads
    env:
      FROZEN_ARTIFACT_ID: "8066083419"
      FROZEN_ARTIFACT_SHA256: "bee33e14672ec7ff4ed1f7acaea36b32cc6170a45c3d14b2caeb5f43bfaa623b"
      FROZEN_RUN_ID: "28659417688"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test GBIF block geometry
        run: pytest -q tests/test_gbif_blocks.py tests/test_gbif_submit_strict.py
      - name: Fetch and verify frozen pilot island universe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen_pilot data/v2/external/islands/frozen_pilot
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ARTIFACT_ID}/zip" \
            --output /tmp/frozen_pilot.zip
          actual="$(sha256sum /tmp/frozen_pilot.zip | awk '{print $1}')"
          test "$actual" = "$FROZEN_ARTIFACT_SHA256" || { echo "Frozen artifact digest mismatch: $actual" >&2; exit 2; }
          unzip -q /tmp/frozen_pilot.zip -d /tmp/frozen_pilot
          test -f /tmp/frozen_pilot/islands/gshhg/prepared/islands_v2.gpkg
          test -f /tmp/frozen_pilot/islands/gshhg/prepared/island_manifest.csv
          cp /tmp/frozen_pilot/islands/gshhg/prepared/islands_v2.gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg
          cp /tmp/frozen_pilot/islands/gshhg/prepared/island_manifest.csv data/v2/external/islands/frozen_pilot/island_manifest.csv
          cp /tmp/frozen_pilot/islands/gshhg/prepared/source_policy.json data/v2/external/islands/frozen_pilot/source_policy.json
      - name: Prepare full manifest from the frozen 8,265-island universe
        run: |
          island-v2-gbif-blocks prepare \
            --islands-gpkg data/v2/external/islands/frozen_pilot/islands_v2.gpkg \
            --output-dir data/v2/external/gbif/full \
            --taxon-name Tracheophyta \
            --taxon-rank PHYLUM \
            --target-scope angiosperms \
            --grid-degrees 30 \
            --max-wkt-chars 120000 \
            --max-islands-per-block 125 \
            --query-buffer-m 2000 \
            --query-simplify-m 500
      - name: Validate campaign and select a geographically distributed batch
        id: batch
        env:
          REQUESTED_BATCH_SIZE: ${{ inputs.batch_size || '3' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          requested = int(os.environ['REQUESTED_BATCH_SIZE'])
          if not 1 <= requested <= 20:
              raise SystemExit('batch_size must be between 1 and 20')
          campaign_path = Path('config/gbif_full_acquisition_v2.json')
          manifest_path = Path('data/v2/external/gbif/full/gbif_block_request_manifest.csv')
          batch_path = Path('data/v2/external/gbif/full/gbif_submit_batch.csv')
          plan_path = Path('data/v2/external/gbif/full/gbif_submit_batch_plan.json')
          campaign = json.loads(campaign_path.read_text(encoding='utf-8'))
          full = pd.read_csv(manifest_path, dtype=str).fillna('')
          lookup = full.set_index('block_id', drop=False)

          # deferred_capacity/geometry_repair_pending are transient: the block
          # regeneration above now includes the antimeridian split, so a block
          # id recorded under one of these statuses is expected to disappear
          # or change shape once the affected regional cell is rebuilt. Only
          # submitted/submit_failed represent an actual completed GBIF API
          # call and must still match the current manifest byte-for-byte, so
          # a real accepted download is never silently resubmitted or lost.
          transient_statuses = {'deferred_capacity', 'geometry_repair_pending'}
          recorded = {}
          for entry in campaign.get('ledger', []):
              block_id = str(entry['block_id'])
              status = entry.get('request_status')
              if status in transient_statuses:
                  continue
              if block_id in recorded:
                  raise SystemExit(f'Duplicate ledger block: {block_id}')
              if block_id not in lookup.index:
                  raise SystemExit(f'Ledger block missing from frozen manifest: {block_id}')
              current = lookup.loc[block_id]
              for key in ('regional_cell', 'geometry_wkt_sha256', 'query_geometry_sha256'):
                  if str(current[key]) != str(entry[key]):
                      raise SystemExit(f'Frozen provenance mismatch for {block_id}: {key}')
              if int(current['n_islands']) != int(entry['n_islands']):
                  raise SystemExit(f'Frozen island-count mismatch for {block_id}')
              if str(entry.get('download_key', '')).strip() and status == 'submitted':
                  recorded[block_id] = entry
              elif status == 'submit_failed':
                  recorded[block_id] = entry
              else:
                  raise SystemExit(f"Invalid recorded state for {block_id}: {status}")
          pending = full.loc[~full['block_id'].isin(recorded)].copy()
          queues = {
              cell: group.sort_values(['block_sequence', 'block_id']).to_dict('records')
              for cell, group in pending.groupby('regional_cell', sort=True)
          }
          selected = []
          while queues and len(selected) < requested:
              for cell in sorted(list(queues)):
                  if len(selected) == requested:
                      break
                  selected.append(queues[cell].pop(0))
                  if not queues[cell]:
                      del queues[cell]
          batch = pd.DataFrame(selected)
          if batch.empty:
              batch = full.iloc[0:0].copy()
          else:
              batch['request_status'] = 'prepared'
              batch['download_key'] = ''
              batch['error'] = ''
          batch.to_csv(batch_path, index=False)
          plan_path.write_text(json.dumps({
              'frozen_run_id': os.environ.get('FROZEN_RUN_ID', ''),
              'n_recorded_before_batch': len(recorded),
              'n_pending_before_batch': len(pending),
              'n_selected': len(batch),
              'selected_block_ids': batch['block_id'].tolist(),
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f'n_selected={len(batch)}\n')
          PY
      - name: Submit selected GBIF blocks
        id: submit
        if: steps.batch.outputs.n_selected != '0'
        env:
          GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
          GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
        run: |
          test -n "$GBIF_USERNAME" || { echo 'Environment secret GBIF_USERNAME is missing.' >&2; exit 2; }
          test -n "$GBIF_PASSWORD" || { echo 'Environment secret GBIF_PASSWORD is missing.' >&2; exit 2; }
          set +e
          python -m island_v2.gbif_submit_strict \
            --request-manifest data/v2/external/gbif/full/gbif_submit_batch.csv \
            --max-requests ${{ steps.batch.outputs.n_selected }} \
            --sleep-seconds 3
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record accepted or rejected requests in the campaign ledger
        if: always()
        env:
          SUBMIT_EXIT_CODE: ${{ steps.submit.outputs.exit_code || '0' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          import pandas as pd

          campaign_path = Path('config/gbif_full_acquisition_v2.json')
          batch_path = Path('data/v2/external/gbif/full/gbif_submit_batch.csv')
          campaign = json.loads(campaign_path.read_text(encoding='utf-8'))
          ledger = {str(row['block_id']): row for row in campaign.get('ledger', [])}
          now = datetime.now(UTC).isoformat()
          recognized_statuses = {'submitted', 'submit_failed', 'deferred_capacity', 'geometry_repair_pending'}
          if batch_path.exists() and batch_path.stat().st_size:
              batch = pd.read_csv(batch_path, dtype=str).fillna('')
              for row in batch.to_dict('records'):
                  status = str(row.get('request_status', ''))
                  if status not in recognized_statuses:
                      continue
                  block_id = str(row['block_id'])
                  prior = ledger.get(block_id)
                  if prior and str(prior.get('download_key', '')).strip():
                      raise SystemExit(f'Refusing to overwrite accepted GBIF key for {block_id}')
                  ledger[block_id] = {
                      'block_id': block_id,
                      'regional_cell': str(row['regional_cell']),
                      'n_islands': int(row['n_islands']),
                      'geometry_wkt_sha256': str(row['geometry_wkt_sha256']),
                      'query_geometry_sha256': str(row['query_geometry_sha256']),
                      'query_wkt_chars': int(row['query_wkt_chars']),
                      'request_status': status,
                      'download_key': str(row.get('download_key', '')),
                      'submitted_at_utc': now if status == 'submitted' else '',
                      'error': str(row.get('error', '')),
                      'source': 'frozen_full_campaign_batch',
                  }
          campaign['ledger'] = [ledger[key] for key in sorted(ledger)]
          counts = {}
          for entry in campaign['ledger']:
              counts[entry['request_status']] = counts.get(entry['request_status'], 0) + 1
          campaign['last_batch'] = {'updated_at_utc': now, 'submit_exit_code': int(os.environ['SUBMIT_EXIT_CODE']), 'ledger_status_counts': counts}
          n_settled = counts.get('submitted', 0) + counts.get('submit_failed', 0)
          if n_settled == int(campaign['island_universe']['n_gbif_blocks']):
              campaign['campaign_status'] = 'submission_complete_pending_downloads'
          else:
              campaign['campaign_status'] = 'submitting_in_bounded_batches'
          campaign_path.write_text(json.dumps(campaign, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', str(campaign_path)], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode:
              subprocess.run(['git', 'commit', '-m', 'chore: record GBIF frozen acquisition batch'], check=True)
              # The ledger is also written by poll/reconcile; rebase onto
              # whatever else has landed on main since checkout instead of
              # failing this run on a non-fast-forward push (see run 28660644067).
              subprocess.run(['git', 'pull', '--rebase', 'origin', 'main'], check=True)
              subprocess.run(['git', 'push'], check=True)
          PY
      - name: Summarize batch results
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd
          campaign = json.loads(Path('config/gbif_full_acquisition_v2.json').read_text(encoding='utf-8'))
          table = pd.DataFrame(campaign.get('ledger', []))
          print('## Frozen-universe GBIF acquisition')
          print(f"- Frozen pilot run: {28659417688}")
          print(f"- Blocks recorded: {len(table)} / {campaign['island_universe']['n_gbif_blocks']}")
          if not table.empty:
              print(table['request_status'].value_counts().rename_axis('status').to_frame('n').to_csv())
              print('```csv')
              print(table[['block_id', 'regional_cell', 'n_islands', 'request_status', 'download_key', 'error']].tail(20).to_csv(index=False), end='')
              print('```')
          PY
      - name: Upload provenance and request state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-frozen-full-acquisition-${{ github.run_id }}
          path: |
            config/gbif_full_acquisition_v2.json
            data/v2/external/islands/frozen_pilot/island_manifest.csv
            data/v2/external/islands/frozen_pilot/source_policy.json
            data/v2/external/gbif/full/gbif_submit_batch.csv
            data/v2/external/gbif/full/gbif_submit_batch_plan.json
            data/v2/external/gbif/full/gbif_block_policy.json
          if-no-files-found: warn
          retention-days: 90
      - name: Propagate an actual GBIF rejection
        if: steps.submit.outputs.exit_code != '' && steps.submit.outputs.exit_code != '0'
        run: exit ${{ steps.submit.outputs.exit_code }}
