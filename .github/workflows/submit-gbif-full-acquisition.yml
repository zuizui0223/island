name: submit_gbif_full_acquisition

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new regional blocks to submit (1-20)"
        required: false
        default: "10"
        type: string
  schedule:
    # One controlled batch every six hours; the ledger prevents duplicate requests.
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "config/gbif_full_acquisition_v2.json"

permissions:
  contents: write

concurrency:
  group: gbif-full-acquisition
  cancel-in-progress: false

jobs:
  submit-next-batch:
    if: github.event_name != 'push' || github.event.head_commit.message == 'launch GBIF full acquisition'
    runs-on: ubuntu-latest
    environment: gbif-downloads
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install v2 package
        run: pip install -e ".[dev]"
      - name: Test GBIF block geometry
        run: pytest -q tests/test_gbif_blocks.py
      - name: Resolve batch size
        id: batch
        env:
          REQUESTED_BATCH_SIZE: ${{ inputs.batch_size || '10' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          value = int(os.environ['REQUESTED_BATCH_SIZE'])
          if not 1 <= value <= 20:
              raise SystemExit('batch_size must be between 1 and 20')
          print(f'value={value}')
          PY
      - name: Build current five-square-kilometre island universe
        run: island-v2-gshhg build --output-dir data/v2/external/islands/gshhg
      - name: Prepare full deterministic GBIF block manifest
        run: |
          island-v2-gbif-blocks prepare \
            --islands-gpkg data/v2/external/islands/gshhg/prepared/islands_v2.gpkg \
            --output-dir data/v2/external/gbif/full \
            --taxon-name Tracheophyta \
            --taxon-rank PHYLUM \
            --target-scope angiosperms \
            --grid-degrees 30 \
            --max-wkt-chars 120000 \
            --max-islands-per-block 125 \
            --query-buffer-m 2000 \
            --query-simplify-m 500
      - name: Verify ledger and materialize next non-duplicate batch
        id: materialize
        env:
          BATCH_SIZE: ${{ steps.batch.outputs.value }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          ledger_path = Path('config/gbif_full_acquisition_v2.json')
          manifest_path = Path('data/v2/external/gbif/full/gbif_block_request_manifest.csv')
          batch_path = Path('data/v2/external/gbif/full/gbif_submit_batch.csv')
          plan_path = Path('data/v2/external/gbif/full/gbif_submit_batch_plan.json')
          campaign = json.loads(ledger_path.read_text(encoding='utf-8'))
          full = pd.read_csv(manifest_path, dtype=str).fillna('')
          expected_n_islands = int(campaign['island_universe']['n_islands'])
          expected_n_blocks = int(campaign['island_universe']['n_gbif_blocks'])
          if len(full) != expected_n_blocks:
              raise SystemExit(f'Block count drift: expected {expected_n_blocks}, got {len(full)}')
          if int(pd.to_numeric(full['n_islands']).sum()) != expected_n_islands:
              raise SystemExit('Island coverage drift: current manifest does not match campaign ledger')
          if full['block_id'].duplicated().any():
              raise SystemExit('Current block manifest contains duplicate block IDs')

          lookup = full.set_index('block_id', drop=False)
          seen = set()
          for entry in campaign.get('ledger', []):
              block_id = str(entry['block_id'])
              if block_id in seen:
                  raise SystemExit(f'Duplicate block in persistent ledger: {block_id}')
              seen.add(block_id)
              if block_id not in lookup.index:
                  raise SystemExit(f'Ledger block not present in current manifest: {block_id}')
              current = lookup.loc[block_id]
              for key in ('regional_cell', 'geometry_wkt_sha256', 'query_geometry_sha256'):
                  if str(current[key]) != str(entry[key]):
                      raise SystemExit(f'Geometry/provenance drift for {block_id}: {key}')
              if int(current['n_islands']) != int(entry['n_islands']):
                  raise SystemExit(f'Island-count drift for {block_id}')
              if entry.get('request_status') == 'submitted' and not str(entry.get('download_key', '')).strip():
                  raise SystemExit(f'Submitted ledger entry lacks download key: {block_id}')

          pending = full.loc[~full['block_id'].isin(seen)].copy()
          # Interleave regional cells so early batches give broad geographic coverage.
          pending = pending.sort_values(['regional_cell', 'block_sequence', 'block_id']).reset_index(drop=True)
          groups = {
              cell: group.sort_values(['block_sequence', 'block_id']).to_dict('records')
              for cell, group in pending.groupby('regional_cell', sort=True)
          }
          selected = []
          while groups and len(selected) < int(os.environ['BATCH_SIZE']):
              for cell in sorted(list(groups)):
                  if len(selected) >= int(os.environ['BATCH_SIZE']):
                      break
                  queue = groups[cell]
                  selected.append(queue.pop(0))
                  if not queue:
                      del groups[cell]
          batch = pd.DataFrame(selected)
          if batch.empty:
              batch = full.iloc[0:0].copy()
          if not batch.empty:
              batch['request_status'] = 'prepared'
              batch['download_key'] = ''
              batch['error'] = ''
          batch.to_csv(batch_path, index=False)
          plan = {
              'campaign_id': campaign['campaign_id'],
              'n_already_recorded': len(seen),
              'n_pending_before_batch': int(len(pending)),
              'n_selected': int(len(batch)),
              'selected_block_ids': batch['block_id'].tolist(),
          }
          plan_path.write_text(json.dumps(plan, ensure_ascii=False, indent=2), encoding='utf-8')
          Path(os.environ['GITHUB_OUTPUT']).write_text(
              f"n_selected={len(batch)}\n"
              f"n_pending_before_batch={len(pending)}\n",
              encoding='utf-8',
          )
          PY
      - name: Submit next controlled GBIF batch
        id: submit
        if: steps.materialize.outputs.n_selected != '0'
        env:
          GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
          GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
        run: |
          test -n "$GBIF_USERNAME" || { echo 'Environment secret GBIF_USERNAME is missing.' >&2; exit 2; }
          test -n "$GBIF_PASSWORD" || { echo 'Environment secret GBIF_PASSWORD is missing.' >&2; exit 2; }
          set +e
          python -m island_v2.gbif_submit_strict \
            --request-manifest data/v2/external/gbif/full/gbif_submit_batch.csv \
            --max-requests ${{ steps.materialize.outputs.n_selected }} \
            --sleep-seconds 3
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Merge batch results into persistent campaign ledger
        if: always()
        env:
          SUBMIT_EXIT_CODE: ${{ steps.submit.outputs.exit_code || '0' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          import pandas as pd

          ledger_path = Path('config/gbif_full_acquisition_v2.json')
          batch_path = Path('data/v2/external/gbif/full/gbif_submit_batch.csv')
          plan_path = Path('data/v2/external/gbif/full/gbif_submit_batch_plan.json')
          campaign = json.loads(ledger_path.read_text(encoding='utf-8'))
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          existing = {str(row['block_id']): row for row in campaign.get('ledger', [])}
          now = datetime.now(UTC).isoformat()
          if batch_path.exists() and batch_path.stat().st_size:
              batch = pd.read_csv(batch_path, dtype=str).fillna('')
              for row in batch.to_dict('records'):
                  status = str(row.get('request_status', ''))
                  if status not in {'submitted', 'submit_failed'}:
                      continue
                  block_id = str(row['block_id'])
                  entry = {
                      'block_id': block_id,
                      'regional_cell': str(row['regional_cell']),
                      'n_islands': int(row['n_islands']),
                      'geometry_wkt_sha256': str(row['geometry_wkt_sha256']),
                      'query_geometry_sha256': str(row['query_geometry_sha256']),
                      'query_wkt_chars': int(row['query_wkt_chars']),
                      'request_status': status,
                      'download_key': str(row.get('download_key', '')),
                      'submitted_at_utc': now if status == 'submitted' else '',
                      'error': str(row.get('error', '')),
                      'source': 'full_campaign_batch',
                  }
                  prior = existing.get(block_id)
                  if prior and prior.get('download_key') and prior.get('download_key') != entry['download_key']:
                      raise SystemExit(f'Refusing to overwrite an existing GBIF key for {block_id}')
                  existing[block_id] = entry
          campaign['ledger'] = [existing[key] for key in sorted(existing)]
          counts = {}
          for entry in campaign['ledger']:
              counts[entry['request_status']] = counts.get(entry['request_status'], 0) + 1
          campaign['last_batch'] = {
              'updated_at_utc': now,
              'submit_exit_code': int(os.environ['SUBMIT_EXIT_CODE']),
              'n_selected': plan['n_selected'],
              'n_pending_before_batch': plan['n_pending_before_batch'],
              'ledger_status_counts': counts,
          }
          if len(campaign['ledger']) == int(campaign['island_universe']['n_gbif_blocks']):
              campaign['campaign_status'] = 'submission_complete_pending_downloads'
          ledger_path.write_text(json.dumps(campaign, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', str(ledger_path)], check=True)
          diff = subprocess.run(['git', 'diff', '--cached', '--quiet'])
          if diff.returncode:
              subprocess.run(['git', 'commit', '-m', 'chore: update GBIF full acquisition ledger'], check=True)
              subprocess.run(['git', 'push'], check=True)
          PY
      - name: Summarize full-acquisition progress
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          ledger = json.loads(Path('config/gbif_full_acquisition_v2.json').read_text(encoding='utf-8'))
          rows = ledger.get('ledger', [])
          total = int(ledger['island_universe']['n_gbif_blocks'])
          table = pd.DataFrame(rows)
          print('## GBIF full-acquisition progress')
          print(f'- Blocks recorded: {len(rows)} / {total}')
          if not table.empty:
              print(table['request_status'].value_counts().rename_axis('status').to_frame('n').to_csv())
              columns = ['block_id', 'regional_cell', 'n_islands', 'request_status', 'download_key', 'error']
              print('### Current batch / latest ledger entries')
              print('```csv')
              print(table[columns].tail(20).to_csv(index=False), end='')
              print('```')
          else:
              print('No blocks have been recorded yet.')
          PY
      - name: Upload batch provenance and request state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-full-acquisition-batch-${{ github.run_id }}
          path: |
            config/gbif_full_acquisition_v2.json
            data/v2/external/islands/gshhg/prepared/island_manifest.csv
            data/v2/external/islands/gshhg/prepared/source_policy.json
            data/v2/external/gbif/full/gbif_submit_batch.csv
            data/v2/external/gbif/full/gbif_submit_batch_plan.json
            data/v2/external/gbif/full/gbif_block_taxon_resolution.json
            data/v2/external/gbif/full/gbif_block_policy.json
          if-no-files-found: warn
          retention-days: 90
      - name: Propagate a real GBIF submission failure
        if: steps.submit.outputs.exit_code != '' && steps.submit.outputs.exit_code != '0'
        run: exit ${{ steps.submit.outputs.exit_code }}
