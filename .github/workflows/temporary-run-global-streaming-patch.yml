name: temporary_run_global_streaming_patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-run-global-streaming-patch.yml"

permissions:
  contents: write

jobs:
  patch-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-streaming-bundle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply streaming patch
        run: python scripts/patch_global_streaming_bundle.py
      - name: Validate patched campaign
        run: |
          pip install -e ".[dev]"
          ruff check --fix src/island_v2/global_trait_campaign.py tests/test_global_trait_campaign.py
          ruff format src/island_v2/global_trait_campaign.py tests/test_global_trait_campaign.py
          pytest -q tests/test_global_trait_campaign.py tests/test_reported_ecology_machine.py
          python scripts/validate_workflow_contracts.py
      - name: Commit patch to feature branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/island_v2/global_trait_campaign.py tests/test_global_trait_campaign.py \
            config/global_trait_campaign.yml .github/workflows/drive-global-trait-campaign.yml \
            docs/global_trait_campaign.md
          git diff --cached --quiet && { echo "No patch changes."; exit 0; }
          git commit -m "feat: stream global trait stages per species"
          git push origin HEAD:feat/global-streaming-bundle
