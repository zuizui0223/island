name: Test Chapter 1 database release layer

on:
  pull_request:
    paths:
      - "config/chapter1_database_versions/**"
      - "config/chapter1_database_release_source_policy.yml"
      - "src/island_v2/chapter1_database_manifest.py"
      - "src/island_v2/chapter1_database_release.py"
      - "tests/test_chapter1_database_manifest.py"
      - "tests/test_chapter1_database_release.py"
      - ".github/workflows/dispatch-chapter1-from-database-version.yml"
      - ".github/workflows/build-chapter1-database-release.yml"
      - ".github/workflows/test-chapter1-database-release.yml"
      - "docs/CHAPTER1_DATABASE_RELEASE.md"
      - "CITATION.cff"
  push:
    branches: [main]
    paths:
      - "config/chapter1_database_versions/**"
      - "config/chapter1_database_release_source_policy.yml"
      - "src/island_v2/chapter1_database_manifest.py"
      - "src/island_v2/chapter1_database_release.py"
      - "tests/test_chapter1_database_manifest.py"
      - "tests/test_chapter1_database_release.py"
      - ".github/workflows/test-chapter1-database-release.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate database-version layer
        run: |
          pytest -q \
            tests/test_chapter1_database_manifest.py \
            tests/test_chapter1_database_release.py
          ruff check \
            src/island_v2/chapter1_database_manifest.py \
            src/island_v2/chapter1_database_release.py \
            tests/test_chapter1_database_manifest.py \
            tests/test_chapter1_database_release.py
          python -m island_v2.chapter1_database_manifest validate \
            --manifest config/chapter1_database_versions/current.yml
