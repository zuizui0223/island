name: Free bulk trait pilot check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run focused tests
        run: pytest -q tests/test_free_bulk_trait_pilot.py tests/test_fetch_austraits_bulk.py

  fetch-source:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: austraits
            shard: 0
          - source: leda
            shard: 0
          - source: bien
            shard: 0
          - source: bien
            shard: 1
          - source: bien
            shard: 2
          - source: bien
            shard: 3
          - source: bien
            shard: 4
          - source: bien
            shard: 5
          - source: gift
            shard: 0
          - source: wfo-plant-list
            shard: 0
          - source: wfo
            shard: 0
          - source: powo
            shard: 0
          - source: efloras
            shard: 0
          - source: try
            shard: 0
          - source: sid
            shard: 0
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: r-lib/actions/setup-r@v2
        if: matrix.source == 'bien'
        with:
          use-public-rspm: true

      - name: Install and verify BIEN package
        if: matrix.source == 'bien'
        run: |
          Rscript -e 'options(repos=c(CRAN="https://cloud.r-project.org")); install.packages("BIEN", dependencies=TRUE)'
          Rscript -e 'stopifnot(requireNamespace("BIEN", quietly=TRUE)); cat("BIEN version:", as.character(packageVersion("BIEN")), "\n")'

      - name: Install island package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Fetch and audit source
        env:
          SOURCE: ${{ matrix.source }}
          SHARD: ${{ matrix.shard }}
          BIEN_SHARD_COUNT: '6'
        run: |
          set -euo pipefail
          case "$SOURCE" in
            austraits)
              python -m island_v2.fetch_austraits_bulk \
                --dataset-key "" \
                --output-csv data/v2/staging/traits/bulk/austraits/austraits_all.csv \
                --manifest-json data/v2/staging/traits/bulk/austraits/fetch_manifest.json
              python -m island_v2.free_bulk_trait_pilot \
                --source-csv data/v2/staging/traits/bulk/austraits/austraits_all.csv \
                --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
                --source-taxon-column taxon_name \
                --source-trait-column trait_name \
                --source-dataset-column dataset_key \
                --master-name-column accepted_species \
                --output-json data/v2/staging/traits/bulk/austraits/coverage_report.json
              ;;
            leda)
              python scripts/fetch_leda_bulk.py
              ;;
            bien)
              export BIEN_SHARD_INDEX="$SHARD"
              Rscript scripts/fetch_bien_traits.R
              ;;
            gift|wfo-plant-list|wfo|powo|efloras|try|sid)
              python scripts/audit_verified_plant_sources.py --source "$SOURCE"
              ;;
            *)
              echo "Unknown source: $SOURCE" >&2
              exit 2
              ;;
          esac

      - name: Upload source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trait-source-${{ matrix.source }}-${{ matrix.shard }}
          path: |
            data/v2/staging/traits/bulk/austraits/fetch_manifest.json
            data/v2/staging/traits/bulk/austraits/coverage_report.json
            data/v2/staging/traits/bulk/leda/coverage_report.json
            data/v2/staging/traits/bulk/leda/file_coverage.csv
            data/v2/staging/traits/bulk/bien/
            data/v2/staging/traits/bulk/verified_source_audit/${{ matrix.source }}/
            data/v2/staging/traits/bulk/verified_source_audit/source_status.json
            data/v2/staging/traits/bulk/verified_source_audit/source_status.csv
            data/v2/staging/traits/bulk/verified_source_audit/discovered_machine_links.csv
          if-no-files-found: warn
          retention-days: 14

  collect-results:
    if: always()
    needs: fetch-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all source artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: trait-source-*
          path: collected-source-results
      - name: Inventory completed source outputs
        run: |
          find collected-source-results -type f -maxdepth 8 -print | sort
          python - <<'PY'
          import json
          from pathlib import Path
          reports = []
          for path in Path('collected-source-results').rglob('*.json'):
              try:
                  reports.append((str(path), json.loads(path.read_text(encoding='utf-8'))))
              except Exception as exc:
                  print(f'Could not parse {path}: {exc}')
          print(json.dumps(dict(reports), indent=2, ensure_ascii=False))
          PY