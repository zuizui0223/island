name: Trigger free bulk trait pilot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  run-pilot:
    if: github.event.issue.pull_request && github.event.issue.number == 119 && github.event.comment.body == '/run-free-bulk-trait-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR 119 experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/free-bulk-trait-pilot

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused tests
        run: pytest -q tests/test_free_bulk_trait_pilot.py tests/test_fetch_austraits_bulk.py

      - name: Fetch AusTraits and extract eFLOWER
        run: |
          python -m island_v2.fetch_austraits_bulk \
            --dataset-key eFLOWER_Dun_2022 \
            --output-csv data/v2/staging/traits/bulk/austraits/eFLOWER_Dun_2022.csv \
            --manifest-json data/v2/staging/traits/bulk/austraits/fetch_manifest.json

      - name: Audit against island master
        run: |
          python -m island_v2.free_bulk_trait_pilot \
            --source-csv data/v2/staging/traits/bulk/austraits/eFLOWER_Dun_2022.csv \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --source-taxon-column taxon_name \
            --source-trait-column trait_name \
            --master-name-column accepted_species \
            --output-json data/v2/staging/traits/bulk/austraits/coverage_report.json

      - name: Print results
        run: |
          cat data/v2/staging/traits/bulk/austraits/fetch_manifest.json
          cat data/v2/staging/traits/bulk/austraits/coverage_report.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: austraits-eflower-bulk-pilot
          path: |
            data/v2/staging/traits/bulk/austraits/fetch_manifest.json
            data/v2/staging/traits/bulk/austraits/coverage_report.json
            data/v2/staging/traits/bulk/austraits/eFLOWER_Dun_2022.csv
          retention-days: 14
