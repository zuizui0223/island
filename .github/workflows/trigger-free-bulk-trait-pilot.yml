name: Trigger free bulk trait pilot

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  run-pilot:
    if: github.event.pull_request.merged == true && github.event.pull_request.number == 119
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused tests
        run: pytest -q tests/test_free_bulk_trait_pilot.py tests/test_fetch_austraits_bulk.py

      - name: Fetch all AusTraits datasets
        run: |
          python -m island_v2.fetch_austraits_bulk \
            --dataset-key "" \
            --output-csv data/v2/staging/traits/bulk/austraits/austraits_all.csv \
            --manifest-json data/v2/staging/traits/bulk/austraits/fetch_manifest.json

      - name: Audit all AusTraits datasets against island master
        run: |
          python -m island_v2.free_bulk_trait_pilot \
            --source-csv data/v2/staging/traits/bulk/austraits/austraits_all.csv \
            --master-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --source-taxon-column taxon_name \
            --source-trait-column trait_name \
            --source-dataset-column dataset_key \
            --master-name-column accepted_species \
            --output-json data/v2/staging/traits/bulk/austraits/coverage_report.json

      - name: Print results
        run: |
          cat data/v2/staging/traits/bulk/austraits/fetch_manifest.json
          cat data/v2/staging/traits/bulk/austraits/coverage_report.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: austraits-all-floral-bulk-pilot
          path: |
            data/v2/staging/traits/bulk/austraits/fetch_manifest.json
            data/v2/staging/traits/bulk/austraits/coverage_report.json
          retention-days: 14
