name: Tropical far-tail coastal dispersal sensitivity

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_tropical_coastal_dispersal_sensitivity.py"
      - "config/tropical_far_tail_coastal_sensitivity_20261005.yml"
      - ".github/workflows/tropical-far-tail-coastal-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TRAIT_RUN_ID: "34191508045"
      TRAIT_ARTIFACT: "source-scale-batch-integration-34191508045"
      CANONICAL_RUN_ID: "32845980788"
      CANONICAL_ARTIFACT: "chapter1-when-where-main-32845980788"
      ALL_DATA_RUN_ID: "35100991898"
      ALL_DATA_ARTIFACT: "chapter1-all-data-primary-35100991898"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/coastal/{trait,canonical,all-data,results}
          gh run download "$TRAIT_RUN_ID" -n "$TRAIT_ARTIFACT" -D /tmp/coastal/trait
          gh run download "$CANONICAL_RUN_ID" -n "$CANONICAL_ARTIFACT" -D /tmp/coastal/canonical
          gh run download "$ALL_DATA_RUN_ID" -n "$ALL_DATA_ARTIFACT" -D /tmp/coastal/all-data
          test -s /tmp/coastal/trait/species_axis_coverage.csv.gz
          test -s /tmp/coastal/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/coastal/all-data/syndrome/direct/island_syndrome_scores.csv.gz
          test -s results/geography_20260924/corrected_geography_covariates.csv
          test -s results/h1_regional_common_support_20261005/common_support_windows.csv

      - name: Validate diagnostic
        run: |
          ruff check scripts/audit_tropical_coastal_dispersal_sensitivity.py
          python -m py_compile scripts/audit_tropical_coastal_dispersal_sensitivity.py

      - name: Run coastal dispersal sensitivity
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/audit_tropical_coastal_dispersal_sensitivity.py \
            --species-axis /tmp/coastal/trait/species_axis_coverage.csv.gz \
            --status-flora /tmp/coastal/canonical/input/chapter1_status_flora.csv.gz \
            --direct-scores /tmp/coastal/all-data/syndrome/direct/island_syndrome_scores.csv.gz \
            --covariates results/geography_20260924/corrected_geography_covariates.csv \
            --pattern-config config/chapter1_all_data_biogeographic_pattern.yml \
            --sensitivity-config config/tropical_far_tail_coastal_sensitivity_20261005.yml \
            --windows results/h1_regional_common_support_20261005/common_support_windows.csv \
            --output /tmp/coastal/results

      - name: Write summary
        run: |
          {
            echo "## Tropical far-tail coastal dispersal sensitivity"
            echo
            cat /tmp/coastal/results/coastal_exclusion_hinge_summary.csv
            echo
            echo "## Far-tail block leave-one-out"
            cat /tmp/coastal/results/coastal_exclusion_block_leaveout_summary.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tropical-far-tail-coastal-sensitivity-${{ github.run_id }}
          path: /tmp/coastal/results
          if-no-files-found: error
          retention-days: 30
