name: Tropical far-tail dispersal sensitivity

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_tropical_far_tail_dispersal.py"
      - "config/tropical_far_tail_ocean_dispersal_species_20261005.csv"
      - "config/tropical_far_tail_tube_coding_audit_20261005.csv"
      - "results/tropical_far_tail_dispersal_20261005/**"
      - ".github/workflows/tropical-far-tail-dispersal-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TRAIT_RUN_ID: "34191508045"
      TRAIT_ARTIFACT: "source-scale-batch-integration-34191508045"
      CANONICAL_RUN_ID: "32845980788"
      CANONICAL_ARTIFACT: "chapter1-when-where-main-32845980788"
      ALL_DATA_RUN_ID: "35100991898"
      ALL_DATA_ARTIFACT: "chapter1-all-data-primary-35100991898"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/tropical-far-tail/{trait,canonical,all-data,results}
          gh run download "$TRAIT_RUN_ID" -n "$TRAIT_ARTIFACT" -D /tmp/tropical-far-tail/trait
          gh run download "$CANONICAL_RUN_ID" -n "$CANONICAL_ARTIFACT" -D /tmp/tropical-far-tail/canonical
          gh run download "$ALL_DATA_RUN_ID" -n "$ALL_DATA_ARTIFACT" -D /tmp/tropical-far-tail/all-data
          test -s /tmp/tropical-far-tail/trait/species_axis_coverage.csv.gz
          test -s /tmp/tropical-far-tail/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/tropical-far-tail/all-data/syndrome/all/island_syndrome_scores.csv.gz
          test -s /tmp/tropical-far-tail/all-data/syndrome/direct/island_syndrome_scores.csv.gz
          test -s /tmp/tropical-far-tail/all-data/syndrome/all/species_syndrome_concordance.csv.gz
          test -s /tmp/tropical-far-tail/all-data/syndrome/direct/species_syndrome_concordance.csv.gz
          test -s results/geography_20260924/corrected_geography_covariates.csv
          test -s results/h1_regional_common_support_20261005/common_support_windows.csv

      - name: Validate diagnostic
        run: |
          ruff check scripts/audit_tropical_far_tail_dispersal.py
          python -m py_compile scripts/audit_tropical_far_tail_dispersal.py

      - name: Run dispersal sensitivity
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/audit_tropical_far_tail_dispersal.py \
            --species-axis /tmp/tropical-far-tail/trait/species_axis_coverage.csv.gz \
            --status-flora /tmp/tropical-far-tail/canonical/input/chapter1_status_flora.csv.gz \
            --all-scores /tmp/tropical-far-tail/all-data/syndrome/all/island_syndrome_scores.csv.gz \
            --direct-scores /tmp/tropical-far-tail/all-data/syndrome/direct/island_syndrome_scores.csv.gz \
            --all-species-scores /tmp/tropical-far-tail/all-data/syndrome/all/species_syndrome_concordance.csv.gz \
            --direct-species-scores /tmp/tropical-far-tail/all-data/syndrome/direct/species_syndrome_concordance.csv.gz \
            --covariates results/geography_20260924/corrected_geography_covariates.csv \
            --config config/chapter1_all_data_biogeographic_pattern.yml \
            --windows results/h1_regional_common_support_20261005/common_support_windows.csv \
            --exclusions config/tropical_far_tail_ocean_dispersal_species_20261005.csv \
            --coding-audit config/tropical_far_tail_tube_coding_audit_20261005.csv \
            --output /tmp/tropical-far-tail/results

      - name: Verify fixed-selfing replay
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd

          frozen = pd.read_csv(
              "results/tropical_far_tail_dispersal_20261005/local_exact_replay.csv"
          )
          new = pd.read_csv(
              "/tmp/tropical-far-tail/results/tropical_far_tail_dispersal_sensitivity.csv"
          )
          new = new.loc[
              new["evidence_scope"].eq("direct")
              & new["status"].eq("fit")
          ].copy()
          merged = frozen.merge(
              new,
              on=["stratum", "scenario"],
              suffixes=("_frozen", "_new"),
              validate="one_to_one",
          )
          if len(merged) != len(frozen):
              raise RuntimeError(
                  f"replay row mismatch: {len(merged)} vs {len(frozen)}"
              )
          for col in [
              "n_model_islands",
              "n_prehinge_islands",
              "n_far_tail_islands",
              "n_prehinge_blocks",
              "n_far_tail_blocks",
          ]:
              a = merged[f"{col}_frozen"].to_numpy(float)
              b = merged[f"{col}_new"].to_numpy(float)
              if not np.array_equal(a, b):
                  raise RuntimeError(f"count mismatch: {col}")
          a = merged["post_hinge_slope_frozen"].to_numpy(float)
          b = merged["post_hinge_slope_new"].to_numpy(float)
          if not np.allclose(a, b, atol=2e-9, rtol=2e-9):
              raise RuntimeError(
                  f"post-hinge replay mismatch: {np.max(np.abs(a-b))}"
              )
          print("fixed-selfing local replay reproduced exactly")
          PY

      - name: Write summary
        run: |
          {
            echo "## Tropical far-tail dispersal sensitivity"
            cat /tmp/tropical-far-tail/results/tropical_far_tail_primary_direct_native_nonendemic.csv
            echo
            echo "## Ocean-dispersed species assembly gradient"
            cat /tmp/tropical-far-tail/results/tropical_ocean_species_assembly_gradient.csv
            echo
            echo "## Recomputed-selfing sensitivity"
            cat /tmp/tropical-far-tail/results/tropical_far_tail_recomputed_selfing_sensitivity.csv
            echo
            echo "## Recomputed-selfing validation"
            cat /tmp/tropical-far-tail/results/tropical_far_tail_recomputed_selfing_validation.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tropical-far-tail-dispersal-${{ github.run_id }}
          path: /tmp/tropical-far-tail/results
          if-no-files-found: error
          retention-days: 30
