      - "src/island_v2/chapter1_information_weight_sensitivity.py"
      - "src/island_v2/chapter1_trait_resolution_bias.py"
      - "src/island_v2/chapter1_pr136_source_exposure.py"
      - "src/island_v2/flora_status_support.py"
      - "src/island_v2/genus_fixed_trait_null.py"
      - "src/island_v2/status_stratified_lineage_analysis.py"
      - "config/chapter1_context_analysis.yml"
      - "config/chapter1_when_where_omnibus.yml"
      - "config/chapter1_when_where_sensitivity.yml"
      - "config/chapter1_when_where_block_deletion.yml"
      - "config/chapter1_observation_bias.yml"
      - "config/chapter1_trait_probability.yml"
      - "config/chapter1_information_weight_sensitivity.yml"
      - "config/chapter1_trait_resolution_bias.yml"
      - "config/chapter1_pr136_channel_gated_validation.yml"
      - "config/chapter1_pr136_source_exposure.yml"
      - "config/flora_status_support.yml"
      - "tests/test_chapter1_context_workflow.py"
      - "tests/test_chapter1_multistate_normalization.py"
      - "tests/test_chapter1_trait_vector_freeze.py"
      - "tests/test_chapter1_when_where_omnibus.py"
      - "tests/test_chapter1_when_where_classification.py"
      - "tests/test_chapter1_when_where_sensitivity.py"
      - "tests/test_chapter1_when_where_domain_omnibus.py"
      - "tests/test_chapter1_when_where_block_deletion.py"
      - "tests/test_chapter1_observation_bias.py"
      - "tests/test_chapter1_trait_probability.py"
      - "tests/test_chapter1_information_weight_sensitivity.py"
      - "tests/test_chapter1_trait_resolution_bias.py"
      - "tests/test_chapter1_pr136_source_exposure.py"
      - ".github/workflows/validate-chapter1-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check \
            src/island_v2/chapter1_context_input.py \
            src/island_v2/chapter1_context_analysis.py \
            src/island_v2/chapter1_trait_vector_freeze.py \
            src/island_v2/chapter1_when_where_omnibus.py \
            src/island_v2/chapter1_when_where_classification.py \
            src/island_v2/chapter1_when_where_sensitivity.py \
            src/island_v2/chapter1_when_where_domain_omnibus.py \
            src/island_v2/chapter1_when_where_block_deletion.py \
            src/island_v2/chapter1_observation_bias.py \
            src/island_v2/chapter1_trait_probability.py \
            src/island_v2/chapter1_information_weight_sensitivity.py \
            src/island_v2/chapter1_trait_resolution_bias.py \
            src/island_v2/chapter1_pr136_source_exposure.py \
            src/island_v2/flora_status_support.py \
            src/island_v2/genus_fixed_trait_null.py \
            src/island_v2/status_stratified_lineage_analysis.py \
            tests/test_chapter1_context_workflow.py \
            tests/test_chapter1_multistate_normalization.py \
            tests/test_chapter1_trait_vector_freeze.py \
            tests/test_chapter1_when_where_omnibus.py \
            tests/test_chapter1_when_where_classification.py \
            tests/test_chapter1_when_where_sensitivity.py \
            tests/test_chapter1_when_where_domain_omnibus.py \
            tests/test_chapter1_when_where_block_deletion.py \
            tests/test_chapter1_observation_bias.py \
            tests/test_chapter1_trait_probability.py \
            tests/test_chapter1_information_weight_sensitivity.py \
            tests/test_chapter1_trait_resolution_bias.py \
            tests/test_chapter1_pr136_source_exposure.py
      - name: Synthetic regression tests
        run: |
          pytest -q \
            tests/test_chapter1_context_workflow.py \
            tests/test_chapter1_multistate_normalization.py \
            tests/test_chapter1_trait_vector_freeze.py \
            tests/test_chapter1_when_where_omnibus.py \
            tests/test_chapter1_when_where_classification.py \
            tests/test_chapter1_when_where_sensitivity.py \
            tests/test_chapter1_when_where_domain_omnibus.py \
            tests/test_chapter1_when_where_block_deletion.py \
            tests/test_chapter1_observation_bias.py \
            tests/test_chapter1_trait_probability.py \
            tests/test_chapter1_information_weight_sensitivity.py \
            tests/test_chapter1_trait_resolution_bias.py \
            tests/test_chapter1_pr136_source_exposure.py
      - name: Parse frozen configs
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              Path('config/chapter1_context_analysis.yml'),
              Path('config/chapter1_when_where_omnibus.yml'),
              Path('config/chapter1_when_where_sensitivity.yml'),
              Path('config/chapter1_when_where_block_deletion.yml'),
              Path('config/chapter1_observation_bias.yml'),
              Path('config/chapter1_trait_probability.yml'),
              Path('config/chapter1_information_weight_sensitivity.yml'),
              Path('config/chapter1_trait_resolution_bias.yml'),
              Path('config/chapter1_pr136_channel_gated_validation.yml'),
              Path('config/chapter1_pr136_source_exposure.yml'),
              Path('config/flora_status_support.yml'),
          ]:
              payload = yaml.safe_load(path.read_text())
              assert isinstance(payload, dict) and payload
              print(path, 'ok')
          PY
