      - "config/chapter1_when_where_sensitivity.yml"
      - "config/chapter1_when_where_block_deletion.yml"
      - "config/chapter1_observation_bias.yml"
      - "config/chapter1_trait_probability.yml"
      - "config/chapter1_information_weight_sensitivity.yml"
      - "config/chapter1_trait_resolution_bias.yml"
      - "config/chapter1_pr136_channel_gated_validation.yml"
      - "config/chapter1_pr136_source_exposure.yml"
      - "config/flora_status_support.yml"
      - "tests/test_chapter1_context_workflow.py"
      - "tests/test_chapter1_multistate_normalization.py"
      - "tests/test_chapter1_trait_vector_freeze.py"
      - "tests/test_chapter1_when_where_omnibus.py"
      - "tests/test_chapter1_when_where_classification.py"
      - "tests/test_chapter1_when_where_sensitivity.py"
      - "tests/test_chapter1_when_where_domain_omnibus.py"
      - "tests/test_chapter1_when_where_block_deletion.py"
      - "tests/test_chapter1_observation_bias.py"
      - "tests/test_chapter1_trait_probability.py"
      - "tests/test_chapter1_information_weight_sensitivity.py"
      - "tests/test_chapter1_trait_resolution_bias.py"
      - "tests/test_chapter1_pr136_source_exposure.py"
      - ".github/workflows/validate-chapter1-context.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/chapter1_context_input.py"
      - "src/island_v2/chapter1_context_analysis.py"
      - "src/island_v2/chapter1_trait_vector_freeze.py"
      - "src/island_v2/chapter1_when_where_omnibus.py"
      - "src/island_v2/chapter1_when_where_classification.py"
      - "src/island_v2/chapter1_when_where_sensitivity.py"
      - "src/island_v2/chapter1_when_where_domain_omnibus.py"
