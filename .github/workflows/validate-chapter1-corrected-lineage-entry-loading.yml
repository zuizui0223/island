name: Validate corrected lineage entry/loading replay

on:
  push:
    branches:
      - analysis/corrected-lineage-entry-loading
    paths:
      - "scripts/geography_correction/replay_corrected_lineage_entry_loading.py"
      - ".github/workflows/validate-chapter1-corrected-lineage-entry-loading.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Validate replay implementation
        run: |
          python -m py_compile scripts/geography_correction/replay_corrected_lineage_entry_loading.py
          ruff check scripts/geography_correction/replay_corrected_lineage_entry_loading.py

      - name: Download frozen lineage artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/entry_loading/source /tmp/entry_loading/result
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/entry_loading/source
          test -s /tmp/entry_loading/source/lineage/lineage_representation_island_scores.csv.gz
          test -s /tmp/entry_loading/source/lineage/lineage_representation_context_slopes.csv
          test -s /tmp/entry_loading/source/fixed/source/isolation/results/purpose_shortest_island_data.csv
          test -s results/geography_20260924/corrected_geography_covariates.csv

      - name: Replay frozen model and replace only geography
        run: |
          python scripts/geography_correction/replay_corrected_lineage_entry_loading.py             --scores-csv /tmp/entry_loading/source/lineage/lineage_representation_island_scores.csv.gz             --frozen-slopes-csv /tmp/entry_loading/source/lineage/lineage_representation_context_slopes.csv             --original-covariates-csv /tmp/entry_loading/source/fixed/source/isolation/results/purpose_shortest_island_data.csv             --corrected-covariates-csv results/geography_20260924/corrected_geography_covariates.csv             --output-dir /tmp/entry_loading/result

      - name: Show result
        run: |
          cat /tmp/entry_loading/result/classification.csv
          cat /tmp/entry_loading/result/corrected_replay.csv
          cat /tmp/entry_loading/result/RESULT.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-lineage-entry-loading-${{ github.run_id }}
          path: /tmp/entry_loading/result
          if-no-files-found: error
          retention-days: 30
