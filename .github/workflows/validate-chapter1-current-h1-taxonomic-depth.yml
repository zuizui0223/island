name: Validate current H1 taxonomic-depth replay

on:
  push:
    branches:
      - analysis/current-h1-taxonomic-depth
    paths:
      - "config/chapter1_current_h1_taxonomic_depth.yml"
      - "scripts/geography_correction/run_current_h1_taxonomic_depth.py"
      - ".github/workflows/validate-chapter1-current-h1-taxonomic-depth.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
      STATUS_RUN_ID: "32559322028"
      STATUS_ARTIFACT: "official-wcvp-corroborated-status-32559322028"
      WCVP_RUN_ID: "37089905542"
      WCVP_ARTIFACT: "chapter1-wcvp-native-corrected-37089905542"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Validate implementation
        run: |
          python -m py_compile scripts/geography_correction/run_current_h1_taxonomic_depth.py
          ruff check scripts/geography_correction/run_current_h1_taxonomic_depth.py
          pytest -q             tests/test_chapter1_h3_observed_taxonomic_depth.py             tests/test_chapter1_all_data_probability.py             tests/test_chapter1_wcvp_native_compatibility.py

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/depth/source /tmp/depth/status /tmp/depth/wcvp /tmp/depth/results
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/depth/source
          gh run download "$STATUS_RUN_ID" -n "$STATUS_ARTIFACT" -D /tmp/depth/status
          gh run download "$WCVP_RUN_ID" -n "$WCVP_ARTIFACT" -D /tmp/depth/wcvp
          test -s /tmp/depth/source/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/depth/source/snapshot/chapter1_trait_state_audit_all.csv.gz
          test -s /tmp/depth/source/snapshot/chapter1_trait_state_audit_direct.csv.gz
          test -s /tmp/depth/status/resolved/island_tdwg_l3_mapping.csv
          test -s /tmp/depth/wcvp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz
          test -s data/v2/staging/gbif/collected/island_taxa.csv
          test -s results/geography_20260924/corrected_geography_covariates.csv

      - name: Run all-analysis taxonomic-depth replay
        run: |
          python scripts/geography_correction/run_current_h1_taxonomic_depth.py             --status-flora-csv /tmp/depth/source/fixed/canonical/input/chapter1_status_flora.csv.gz             --state-audit-csv /tmp/depth/source/snapshot/chapter1_trait_state_audit_all.csv.gz             --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv             --covariates-csv results/geography_20260924/corrected_geography_covariates.csv             --wcvp-ranges-csv /tmp/depth/wcvp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz             --island-tdwg-csv /tmp/depth/status/resolved/island_tdwg_l3_mapping.csv             --h1-config-path config/chapter1_v14_all_data_probability.yml             --depth-config-path config/chapter1_current_h1_taxonomic_depth.yml             --evidence-scope all_analysis_eligible             --output-dir /tmp/depth/results/all

      - name: Run Direct-only taxonomic-depth replay
        run: |
          python scripts/geography_correction/run_current_h1_taxonomic_depth.py             --status-flora-csv /tmp/depth/source/fixed/canonical/input/chapter1_status_flora.csv.gz             --state-audit-csv /tmp/depth/source/snapshot/chapter1_trait_state_audit_direct.csv.gz             --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv             --covariates-csv results/geography_20260924/corrected_geography_covariates.csv             --wcvp-ranges-csv /tmp/depth/wcvp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz             --island-tdwg-csv /tmp/depth/status/resolved/island_tdwg_l3_mapping.csv             --h1-config-path config/chapter1_v14_all_data_probability.yml             --depth-config-path config/chapter1_current_h1_taxonomic_depth.yml             --evidence-scope direct_only             --output-dir /tmp/depth/results/direct

      - name: Summarize decision surface
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for evidence in ("all", "direct"):
              for flora in ("all_observed", "regional_native_compatible"):
                  path = Path(f"/tmp/depth/results/{evidence}/{flora}/taxonomic_depth_geometry.csv")
                  x = pd.read_csv(path)
                  print("\n", evidence, flora)
                  print(x[[
                      "context",
                      "common_support_H1_q",
                      "genus_attenuation",
                      "genus_cosine_to_observed",
                      "genus_stage_q",
                      "classification",
                  ]].to_string(index=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-h1-taxonomic-depth-${{ github.run_id }}
          path: /tmp/depth/results
          if-no-files-found: error
          retention-days: 30
