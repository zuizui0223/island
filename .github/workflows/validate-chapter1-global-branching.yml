name: Validate Chapter 1 global branching analysis

on:
  push:
    paths:
      - "src/island_v2/chapter1_global_branching.py"
      - "config/chapter1_global_branching.yml"
      - "tests/test_chapter1_global_branching.py"
      - ".github/workflows/validate-chapter1-global-branching.yml"
      - ".github/workflows/run-chapter1-global-branching.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/chapter1_global_branching.py"
      - "config/chapter1_global_branching.yml"
      - "tests/test_chapter1_global_branching.py"
      - ".github/workflows/validate-chapter1-global-branching.yml"
      - ".github/workflows/run-chapter1-global-branching.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src/island_v2/chapter1_global_branching.py tests/test_chapter1_global_branching.py
      - run: pytest -q tests/test_chapter1_global_branching.py
      - name: Parse hypothesis contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path('config/chapter1_global_branching.yml').read_text())
          assert cfg['hypothesis_name'] == 'Dispersal-filtered pollination-service branching hypothesis'
          assert 'analysis_regime' in cfg['context_layers']
          assert 'biogeographic_realm' in cfg['context_layers']
          assert cfg['axis_sets']['universal_plant_response']['classify'] is True
          assert cfg['axis_sets']['sampled_guild_concordance']['classify'] is False
          assert all(
              'bee' not in axis and 'bird' not in axis and 'butterfly' not in axis
              for axis in cfg['axis_sets']['universal_plant_response']['axes']
          )
          assert 'direct_effective_service_and_replacement_tests_belong_to_izu_core' in cfg['rules']
          print('global branching hypothesis contract: ok')
          PY
