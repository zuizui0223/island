name: Validate H1 origin sensitivity

on:
  push:
    branches:
      - analysis/h1-origin-sensitivity
    paths:
      - "config/chapter1_h1_origin_sensitivity.yml"
      - "tests/test_chapter1_h1_origin_sensitivity.py"
      - ".github/workflows/validate-chapter1-h1-origin-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and validate
        run: |
          pip install -e ".[dev]"
          pytest -q tests/test_chapter1_h1_origin_sensitivity.py
          ruff check tests/test_chapter1_h1_origin_sensitivity.py

      - name: Download frozen inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/h1origin/source /tmp/h1origin/all /tmp/h1origin/direct
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/h1origin/source
          test -s /tmp/h1origin/source/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/h1origin/source/snapshot/chapter1_trait_state_audit_all.csv.gz
          test -s /tmp/h1origin/source/snapshot/chapter1_trait_state_audit_direct.csv.gz
          test -s results/geography_20260924/corrected_geography_covariates.csv

      - name: Run frozen seven-trait H1 with origin strata
        run: |
          set -euo pipefail
          python -m island_v2.chapter1_h1_final_directional \
            --status-flora-csv /tmp/h1origin/source/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/h1origin/source/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --config-path config/chapter1_h1_origin_sensitivity.yml \
            --evidence-scope all_analysis_eligible \
            --output-dir /tmp/h1origin/all

          python -m island_v2.chapter1_h1_final_directional \
            --status-flora-csv /tmp/h1origin/source/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/h1origin/source/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --config-path config/chapter1_h1_origin_sensitivity.yml \
            --evidence-scope direct_only \
            --output-dir /tmp/h1origin/direct

      - name: Verify parent H1 and summarize origin sensitivity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          lock=json.loads(
              Path("config/chapter1_h1_final_directional_result_lock.json").read_text()
          )
          rows=[]
          origin=[]
          for label,scope in (("all","all_analysis_eligible"),("direct","direct_only")):
              root=Path("/tmp/h1origin")/label
              reg=pd.read_csv(root/"directional_score_results.csv")

              parent=reg.loc[reg["stratum"].eq("all_observed")].set_index("context")
              expected=pd.DataFrame(
                  lock["H1"]["regional_results"][scope]
              ).set_index("context")
              for context,row in expected.iterrows():
                  assert abs(
                      float(parent.loc[context,"estimate"])-float(row["estimate"])
                  ) < 2e-6

              part=reg.loc[reg["stratum"].eq("all_native")].copy()
              part.insert(0,"scope",label)
              origin.extend(part.to_dict(orient="records"))

              rows.append({
                  "scope": label,
                  "parent_all_observed_reproduced": True,
                  "native_testable_regions": int(
                      reg.loc[
                          reg["stratum"].eq("all_native")
                          & reg["status"].eq("fit")
                      ]["context"].nunique()
                  ),
              })

          summary=pd.DataFrame(rows)
          origin=pd.DataFrame(origin)
          summary.to_csv("/tmp/h1origin/origin_support_summary.csv",index=False)
          origin.to_csv("/tmp/h1origin/origin_sensitivity_regional.csv",index=False)
          print(summary.to_string(index=False))
          print("\n=== origin sensitivity ===")
          print(origin.to_string(index=False))
          PY
          cat /tmp/h1origin/origin_support_summary.csv >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/h1origin/origin_sensitivity_regional.csv >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-h1-origin-sensitivity-${{ github.run_id }}
          path: /tmp/h1origin
          if-no-files-found: error
          retention-days: 30
