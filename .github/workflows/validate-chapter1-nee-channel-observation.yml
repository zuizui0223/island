name: Historical replay — Validate Chapter 1 NEE channel observation policy

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate-observation-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test generic effort-aware channel classifier
        run: |
          pytest -q tests/test_chapter1_nee_channel_observation.py
          ruff check src/island_v2/chapter1_nee_channel_observation.py tests/test_chapter1_nee_channel_observation.py
