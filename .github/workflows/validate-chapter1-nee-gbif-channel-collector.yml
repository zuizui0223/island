name: Validate Chapter 1 NEE GBIF channel collector

on:
  push:
    branches:
      - "nee/double-filter-gbif-collector"
    paths:
      - "src/island_v2/chapter1_nee_gbif_channel_collect.py"
      - "tests/test_chapter1_nee_gbif_channel_collect.py"
      - ".github/workflows/validate-chapter1-nee-gbif-channel-collector.yml"
  pull_request:
    paths:
      - "src/island_v2/chapter1_nee_gbif_channel_collect.py"
      - "tests/test_chapter1_nee_gbif_channel_collect.py"
      - ".github/workflows/validate-chapter1-nee-gbif-channel-collector.yml"

permissions:
  contents: read

jobs:
  validate-generic-channel-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test taxon-agnostic exact-island collector
        run: |
          pytest -q tests/test_chapter1_nee_gbif_channel_collect.py
          ruff check src/island_v2/chapter1_nee_gbif_channel_collect.py tests/test_chapter1_nee_gbif_channel_collect.py
          python -m island_v2.chapter1_nee_gbif_channel_collect --help >/dev/null
