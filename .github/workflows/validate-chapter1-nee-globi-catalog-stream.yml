name: Validate Chapter 1 NEE GloBI catalog stream

on:
  push:
    branches:
      - "nee/**"
    paths:
      - "src/island_v2/chapter1_nee_channel_catalog_stream.py"
      - "tests/test_chapter1_nee_channel_catalog_stream.py"
      - ".github/workflows/validate-chapter1-nee-globi-catalog-stream.yml"
  pull_request:
    paths:
      - "src/island_v2/chapter1_nee_channel_catalog_stream.py"
      - "tests/test_chapter1_nee_channel_catalog_stream.py"
      - ".github/workflows/validate-chapter1-nee-globi-catalog-stream.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-streaming-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Test streaming catalog equivalence
        run: |
          pytest -q \
            tests/test_chapter1_nee_channel_catalog.py \
            tests/test_chapter1_nee_channel_catalog_stream.py
          ruff check \
            src/island_v2/chapter1_nee_channel_catalog.py \
            src/island_v2/chapter1_nee_channel_catalog_stream.py \
            tests/test_chapter1_nee_channel_catalog.py \
            tests/test_chapter1_nee_channel_catalog_stream.py
