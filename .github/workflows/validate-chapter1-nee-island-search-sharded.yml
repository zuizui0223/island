name: Validate Chapter 1 NEE sharded island Search execution

on:
  push:
    branches:
      - "nee/island-observation-search-sharded"
    paths:
      - "config/chapter1_nee_island_search_execution.yml"
      - "config/island_universe_artifact_lock.json"
      - ".github/workflows/run-chapter1-nee-island-search-observations-sharded.yml"
      - ".github/workflows/validate-chapter1-nee-island-search-sharded.yml"
      - "src/island_v2/chapter1_nee_island_search_observation.py"
      - "tests/test_chapter1_nee_island_search_observation.py"
  pull_request:
    branches:
      - main
    paths:
      - "config/chapter1_nee_island_search_execution.yml"
      - "config/island_universe_artifact_lock.json"
      - ".github/workflows/run-chapter1-nee-island-search-observations-sharded.yml"
      - ".github/workflows/validate-chapter1-nee-island-search-sharded.yml"
      - "src/island_v2/chapter1_nee_island_search_observation.py"
      - "tests/test_chapter1_nee_island_search_observation.py"

jobs:
  validate-sharded-island-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run frozen Search tests and lint
        run: |
          pytest -q tests/test_chapter1_nee_island_search_observation.py
          ruff check src/island_v2/chapter1_nee_island_search_observation.py tests/test_chapter1_nee_island_search_observation.py
      - name: Validate prospective execution and frozen island-universe contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          cfg=yaml.safe_load(Path('config/chapter1_nee_island_search_execution.yml').read_text())
          lock=json.loads(Path('config/island_universe_artifact_lock.json').read_text())
          assert cfg['contract'] == 'chapter1_nee_island_search_execution_v1'
          assert cfg['status'] == 'prospective_pre_island_channel_observation'
          exe=cfg['canonical_execution']
          assert exe['layout'] == 'deterministic_island_shards'
          assert exe['n_shards'] == 20
          assert exe['partition_rule'] == 'sorted_unique_frozen_GSHHG_island_id_index_mod_20'
          assert exe['partition_before_source_state_filter'] is True
          assert exe['frozen_island_universe_size'] == 8265
          assert exe['expected_shard_sizes']['size_414_shards'] == 5
          assert exe['expected_shard_sizes']['size_413_shards'] == 15
          assert exe['max_parallel_jobs'] == 10
          frozen=exe['island_universe']
          assert frozen['artifact_lock_path'] == 'config/island_universe_artifact_lock.json'
          assert frozen['workflow_run_id'] == 28659417688
          assert frozen['artifact_id'] == 8066083419
          assert frozen['artifact_name'] == 'gbif-three-block-pilot-28659417688'
          assert frozen['artifact_sha256'] == 'bee33e14672ec7ff4ed1f7acaea36b32cc6170a45c3d14b2caeb5f43bfaa623b'
          assert frozen['required_source_backend'] == 'gshhg'
          assert str(frozen['source_version']) == '2.3.7'
          assert frozen['resolution'] == 'h'
          assert float(frozen['minimum_area_km2']) == 5.0
          assert frozen['source_file_sha256'] == '8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41'
          assert frozen['n_islands'] == 8265
          assert frozen['acquisition_policy'] == 'download_pinned_artifact_do_not_rebuild_or_fallback'
          assert lock['contract'] == 'island_universe_artifact_lock_v1'
          assert lock['workflow_run_id'] == frozen['workflow_run_id']
          assert lock['artifact_id'] == frozen['artifact_id']
          assert lock['artifact_name'] == frozen['artifact_name']
          assert lock['artifact_digest'] == 'sha256:' + frozen['artifact_sha256']
          assert lock['verified_summary']['n_islands'] == 8265
          assert lock['status'] == 'canonical_frozen_global_island_universe_for_full_analysis'
          audit=cfg['pre_outcome_transport_audit']
          assert audit['first_attempt_run_id'] == 34731049099
          assert audit['island_observations_opened'] == 0
          assert audit['observed_rebuild_backend'] == 'natural_earth_10m_fallback'
          assert audit['observed_rebuild_n_islands'] == 4470
          assert audit['repair_changes_science_contract'] is False
          inv=cfg['invariants']
          assert inv['same_search_record_cap_per_island_channel'] == 900
          assert inv['source_availability_does_not_change_partition'] is True
          assert inv['island_observation_outcomes_do_not_change_partition'] is True
          assert inv['N1_effects_do_not_change_partition'] is True
          assert inv['focal_plant_traits_do_not_change_partition'] is True
          assert inv['canonical_search_must_not_rebuild_island_geometry'] is True
          assert inv['natural_earth_fallback_for_canonical_search_forbidden'] is True
          PY
      - name: Guard production workflow boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          text=Path('.github/workflows/run-chapter1-nee-island-search-observations-sharded.yml').read_text()
          required=[
              'source_proxy_run_id',
              'N_SHARDS: "20"',
              'max-parallel: 10',
              'sorted_unique_frozen_GSHHG_island_id_index_mod_20',
              'partition_before_source_state_filter',
              'chapter1-nee-island-search-observation-',
              'matrix.channel',
              'github.run_id',
              'max_records_per_island_channel',
              'if len(paths) != 20',
              'FROZEN_ISLAND_ARTIFACT_ID: "8066083419"',
              'FROZEN_ISLAND_ARTIFACT_SHA256: "bee33e14672ec7ff4ed1f7acaea36b32cc6170a45c3d14b2caeb5f43bfaa623b"',
              'sha256sum --check --strict',
              "source_policy['source_backend'] == 'gshhg'",
          ]
          for token in required:
              assert token in text, token
          forbidden=[
              'GBIF_USERNAME',
              'GBIF_PASSWORD',
              'chapter1_nee_n1_run',
              'pollination_guild',
              'flower_color',
              'mating_system',
              'island-v2-gshhg build',
              'natural_earth_10m_fallback',
          ]
          for token in forbidden:
              assert token not in text, token
          PY
