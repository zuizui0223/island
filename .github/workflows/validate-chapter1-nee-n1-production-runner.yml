name: Validate Chapter 1 NEE N1 production runner

on:
  push:
    branches:
      - "nee/double-filter-n1-production-runner"
    paths:
      - ".github/workflows/run-chapter1-nee-n1.yml"
      - ".github/workflows/validate-chapter1-nee-n1-production-runner.yml"
      - "docs/chapter1_nee_n1_production_runner.md"
      - "docs/chapter1_nee_n1_result_20260913.md"
      - "config/chapter1_nee_n1_result_lock.json"
  pull_request:
    paths:
      - ".github/workflows/run-chapter1-nee-n1.yml"
      - ".github/workflows/validate-chapter1-nee-n1-production-runner.yml"
      - "docs/chapter1_nee_n1_production_runner.md"
      - "docs/chapter1_nee_n1_result_20260913.md"
      - "config/chapter1_nee_n1_result_lock.json"

permissions:
  contents: read

jobs:
  validate-production-n1-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Re-run frozen N1 execution tests
        run: |
          pytest -q tests/test_chapter1_nee_n1_model.py tests/test_chapter1_nee_n1_run.py
          python -m island_v2.chapter1_nee_n1_run run --help >/dev/null
      - name: Guard production N1 workflow boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/run-chapter1-nee-n1.yml').read_text()
          required=[
              'qualification_run_id',
              'chapter1-nee-channel-qualification-',
              'nee_projected_channel_state.csv',
              'nee_channel_qualification_receipt.csv',
              '8270544465',
              '695f35b97bae07e81b05deab537dd73fa687b2d99e9efdb1cb3babd2fa12dfb6',
              'purpose_shortest_island_data.csv',
              'chapter1_nee_n1_run run',
              'stop_before_N2_and_keep_frozen_Chapter1',
              'N2 is not triggered automatically',
          ]
          missing=[value for value in required if value not in text]
          assert not missing, f'missing production N1 boundaries: {missing}'
          forbidden=[
              'GBIF_USERNAME',
              'GBIF_PASSWORD',
              'trait_snapshot',
              'flower_colour',
              'floral_form',
              'reproductive_assurance',
              'chapter1_nee_n2',
              'run_nee_n2',
          ]
          hits=[value for value in forbidden if value in text]
          assert not hits, f'production N1 workflow contains prohibited dependencies/actions: {hits}'
          print('Production N1 workflow is qualification-gated, covariate-pinned, and does not auto-open N2')
          PY
      - name: Validate canonical failed N1 result lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lock=json.loads(Path('config/chapter1_nee_n1_result_lock.json').read_text())
          assert lock['contract'] == 'chapter1_nee_n1_result_lock_v1'
          assert lock['status'] == 'canonical_N1_failed_stop_before_N2'
          assert lock['upstream']['qualification_run_id'] == 34750153702
          assert lock['upstream']['qualification_artifact_id'] == 10314984302
          assert lock['n1']['workflow_run_id'] == 34750351009
          assert lock['n1']['artifact_id'] == 10315671249
          assert lock['n1']['artifact_digest'] == 'sha256:01d938a1f42b7f64634232a2fcb76c68a60183824684c5f135f567107a4c5d85'
          assert lock['n1']['n_confirmatory_channels'] == 4
          assert lock['n1']['confirmatory_channels'] == [
              'bombus','diptera','flower_visiting_birds','non_bombus_bees'
          ]
          assert abs(lock['n1']['global_heterogeneity_test']['p_value'] - 0.6551581817640355) < 1e-15
          assert abs(lock['n1']['model_comparison']['heterogeneous_minus_common_log_likelihood'] - 2.1160612661845732) < 1e-12
          assert lock['n1']['spatial_block_deletion']['n_fitted'] == 225
          assert lock['n1']['spatial_block_deletion']['fraction_p_ge_0_05'] == 1.0
          assert lock['n1']['source_region_deletion']['n_fitted'] == 217
          assert lock['n1']['source_region_deletion']['fraction_p_ge_0_05'] == 1.0
          gate=lock['n1']['gate']
          assert gate['N1_pass'] is False
          assert gate['failure_action'] == 'stop_before_N2_and_keep_frozen_Chapter1'
          assert gate['claim_ceiling'] == 'N1_not_promoted'
          boundary=lock['interpretation_boundary']
          assert boundary['N2_may_open'] is False
          assert boundary['no_posthoc_channel_relabel_or_substitution'] is True
          assert boundary['no_search_rerun_or_negative_rescue'] is True
          assert boundary['no_reduced_channel_rescue_model'] is True
          assert Path('docs/chapter1_nee_n1_result_20260913.md').exists()
          print('Canonical N1 failure is locked; H5a stops before N2.')
          PY
