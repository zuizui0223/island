name: Validate Chapter 1 NEE source proxy

on:
  push:
    branches:
      - "nee/**"
    paths:
      - "config/chapter1_nee_source_proxy.yml"
      - "src/island_v2/chapter1_nee_source_proxy.py"
      - "tests/test_chapter1_nee_source_proxy.py"
      - "docs/chapter1_nee_source_proxy_contract.md"
      - ".github/workflows/run-chapter1-nee-source-proxy-from-full-scan.yml"
      - ".github/workflows/validate-chapter1-nee-source-proxy.yml"
  pull_request:
    paths:
      - "config/chapter1_nee_source_proxy.yml"
      - "src/island_v2/chapter1_nee_source_proxy.py"
      - "tests/test_chapter1_nee_source_proxy.py"
      - "docs/chapter1_nee_source_proxy_contract.md"
      - ".github/workflows/run-chapter1-nee-source-proxy-from-full-scan.yml"
      - ".github/workflows/validate-chapter1-nee-source-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate frozen source-set aggregation
        run: |
          pytest -q tests/test_chapter1_nee_source_proxy.py
          ruff check src/island_v2/chapter1_nee_source_proxy.py tests/test_chapter1_nee_source_proxy.py
          python -m island_v2.chapter1_nee_source_proxy --help >/dev/null
      - name: Guard production projection wiring and frozen source-mode coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          text=Path('.github/workflows/run-chapter1-nee-source-proxy-from-full-scan.yml').read_text()
          assert 'python -m island_v2.chapter1_nee_source_proxy \\' in text
          assert 'python -m island_v2.chapter1_nee_source_proxy aggregate' not in text
          assert "'geo_k5':(5,8265)" in text
          assert "'geo_k10':(10,8265)" in text
          assert "'geo_k20':(20,8265)" in text
          assert "'geo50_climate10':(10,8219)" in text
          assert 'full_scan_run_id' in text
          assert 'uses_pollinator_retention_outcomes' in text
          assert 'uses_focal_plant_traits' in text
          print('Production source-proxy wiring and frozen source-mode coverage validated')
          PY
