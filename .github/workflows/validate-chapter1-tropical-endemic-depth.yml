name: Validate tropical endemicity taxonomic-depth diagnostic

on:
  push:
    branches:
      - analysis/tropical-endemic-depth
    paths:
      - ".github/workflows/validate-chapter1-tropical-endemic-depth.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
      STATUS_RUN_ID: "32559322028"
      STATUS_ARTIFACT: "official-wcvp-corroborated-status-32559322028"
      WCVP_RUN_ID: "37089905542"
      WCVP_ARTIFACT: "chapter1-wcvp-native-corrected-37089905542"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Validate reused implementation
        run: |
          python -m py_compile src/island_v2/chapter1_h1_taxonomic_depth_current.py
          ruff check src/island_v2/chapter1_h1_taxonomic_depth_current.py

      - name: Download frozen Chapter 1 inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/status_depth/source /tmp/status_depth/status /tmp/status_depth/wcvp /tmp/status_depth/results
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/status_depth/source
          gh run download "$STATUS_RUN_ID" -n "$STATUS_ARTIFACT" -D /tmp/status_depth/status
          gh run download "$WCVP_RUN_ID" -n "$WCVP_ARTIFACT" -D /tmp/status_depth/wcvp
          test -s /tmp/status_depth/source/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/status_depth/source/snapshot/chapter1_trait_state_audit_all.csv.gz
          test -s /tmp/status_depth/source/snapshot/chapter1_trait_state_audit_direct.csv.gz
          test -s /tmp/status_depth/status/resolved/island_tdwg_l3_mapping.csv
          test -s /tmp/status_depth/wcvp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz
          test -s data/v2/staging/gbif/collected/island_taxa.csv
          test -s results/geography_20260924/corrected_geography_covariates.csv

      - name: Freeze exact and WCVP-derived floristic strata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from island_v2.chapter1_wcvp_native_compatibility import build_regional_native_compatible_flora

          flora = pd.read_csv("/tmp/status_depth/source/fixed/canonical/input/chapter1_status_flora.csv.gz")
          ranges = pd.read_csv("/tmp/status_depth/wcvp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz")
          mapping = pd.read_csv("/tmp/status_depth/status/resolved/island_tdwg_l3_mapping.csv")
          upgraded, audit = build_regional_native_compatible_flora(flora, ranges, mapping)
          assert audit["n_wcvp_compatible_upgrades"] == 362789
          out = {"wcvp_audit": audit}

          exact_specs = {
              "native_nonendemic": flora["floristic_status"].astype(str).eq("native_nonendemic"),
              "endemic": flora["floristic_status"].astype(str).eq("endemic"),
              "source_native_endemism_unresolved": flora["floristic_status"].astype(str).eq("native_endemism_unresolved"),
          }
          for label, mask in exact_specs.items():
              part = flora.loc[mask].copy()
              part.to_csv(f"/tmp/status_depth/{label}.csv.gz", index=False, compression="gzip")
              out[label] = {
                  "n_rows": int(len(part)),
                  "n_islands": int(part["island_id"].nunique()),
                  "n_species": int(part["accepted_species"].nunique()),
              }

          added = upgraded.loc[
              upgraded["origin_status_original"].astype(str).eq("unresolved")
              & upgraded["wcvp_regional_native_compatible"].astype(bool)
          ].copy()
          added.to_csv("/tmp/status_depth/wcvp_upgraded_native.csv.gz", index=False, compression="gzip")
          out["wcvp_upgraded_native"] = {
              "n_rows": int(len(added)),
              "n_islands": int(added["island_id"].nunique()),
              "n_species": int(added["accepted_species"].nunique()),
          }
          Path("/tmp/status_depth/status_support.json").write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY

      - name: Run native-nonendemic all-analysis
        run: |
          python -m island_v2.chapter1_h1_taxonomic_depth_current             --state-audit-csv /tmp/status_depth/source/snapshot/chapter1_trait_state_audit_all.csv.gz             --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv             --status-flora-csv /tmp/status_depth/native_nonendemic.csv.gz             --covariates-csv results/geography_20260924/corrected_geography_covariates.csv             --probability-config-path config/chapter1_v14_all_data_probability.yml             --depth-config-path config/chapter1_h1_taxonomic_depth_current.yml             --evidence-scope all_analysis_eligible             --flora-scope source_native_nonendemic             --output-dir /tmp/status_depth/results/native_nonendemic_all

      - name: Run native-nonendemic Direct-only
        run: |
          python -m island_v2.chapter1_h1_taxonomic_depth_current             --state-audit-csv /tmp/status_depth/source/snapshot/chapter1_trait_state_audit_direct.csv.gz             --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv             --status-flora-csv /tmp/status_depth/native_nonendemic.csv.gz             --covariates-csv results/geography_20260924/corrected_geography_covariates.csv             --probability-config-path config/chapter1_v14_all_data_probability.yml             --depth-config-path config/chapter1_h1_taxonomic_depth_current.yml             --evidence-scope direct_only             --flora-scope source_native_nonendemic             --output-dir /tmp/status_depth/results/native_nonendemic_direct

      - name: Run endemic all-analysis
        run: |
          python -m island_v2.chapter1_h1_taxonomic_depth_current             --state-audit-csv /tmp/status_depth/source/snapshot/chapter1_trait_state_audit_all.csv.gz             --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv             --status-flora-csv /tmp/status_depth/endemic.csv.gz             --covariates-csv results/geography_20260924/corrected_geography_covariates.csv             --probability-config-path config/chapter1_v14_all_data_probability.yml             --depth-config-path config/chapter1_h1_taxonomic_depth_current.yml             --evidence-scope all_analysis_eligible             --flora-scope source_endemic             --output-dir /tmp/status_depth/results/endemic_all

      - name: Run endemic Direct-only
        run: |
          python -m island_v2.chapter1_h1_taxonomic_depth_current             --state-audit-csv /tmp/status_depth/source/snapshot/chapter1_trait_state_audit_direct.csv.gz             --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv             --status-flora-csv /tmp/status_depth/endemic.csv.gz             --covariates-csv results/geography_20260924/corrected_geography_covariates.csv             --probability-config-path config/chapter1_v14_all_data_probability.yml             --depth-config-path config/chapter1_h1_taxonomic_depth_current.yml             --evidence-scope direct_only             --flora-scope source_endemic             --output-dir /tmp/status_depth/results/endemic_direct

      - name: Run source-native endemism-unresolved all-analysis
        run: |
          python -m island_v2.chapter1_h1_taxonomic_depth_current \
            --state-audit-csv /tmp/status_depth/source/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --status-flora-csv /tmp/status_depth/source_native_endemism_unresolved.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --probability-config-path config/chapter1_v14_all_data_probability.yml \
            --depth-config-path config/chapter1_h1_taxonomic_depth_current.yml \
            --evidence-scope all_analysis_eligible \
            --flora-scope source_native_endemism_unresolved \
            --output-dir /tmp/status_depth/results/source_unresolved_all

      - name: Run source-native endemism-unresolved Direct-only
        run: |
          python -m island_v2.chapter1_h1_taxonomic_depth_current \
            --state-audit-csv /tmp/status_depth/source/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --status-flora-csv /tmp/status_depth/source_native_endemism_unresolved.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --probability-config-path config/chapter1_v14_all_data_probability.yml \
            --depth-config-path config/chapter1_h1_taxonomic_depth_current.yml \
            --evidence-scope direct_only \
            --flora-scope source_native_endemism_unresolved \
            --output-dir /tmp/status_depth/results/source_unresolved_direct

      - name: Run WCVP-upgraded regional-native all-analysis
        run: |
          python -m island_v2.chapter1_h1_taxonomic_depth_current \
            --state-audit-csv /tmp/status_depth/source/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --status-flora-csv /tmp/status_depth/wcvp_upgraded_native.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --probability-config-path config/chapter1_v14_all_data_probability.yml \
            --depth-config-path config/chapter1_h1_taxonomic_depth_current.yml \
            --evidence-scope all_analysis_eligible \
            --flora-scope wcvp_upgraded_native \
            --output-dir /tmp/status_depth/results/wcvp_upgraded_all

      - name: Run WCVP-upgraded regional-native Direct-only
        run: |
          python -m island_v2.chapter1_h1_taxonomic_depth_current \
            --state-audit-csv /tmp/status_depth/source/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --taxonomy-csv data/v2/staging/gbif/collected/island_taxa.csv \
            --status-flora-csv /tmp/status_depth/wcvp_upgraded_native.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --probability-config-path config/chapter1_v14_all_data_probability.yml \
            --depth-config-path config/chapter1_h1_taxonomic_depth_current.yml \
            --evidence-scope direct_only \
            --flora-scope wcvp_upgraded_native \
            --output-dir /tmp/status_depth/results/wcvp_upgraded_direct

      - name: Summarize tropical support and depth
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          rows=[]
          stages=[]
          for p in sorted(Path("/tmp/status_depth/results").glob("*/classification.csv")):
              analysis=p.parent.name
              x=pd.read_csv(p)
              x=x.loc[x["context"].eq("tropical")].copy()
              x.insert(0,"analysis",analysis)
              rows.append(x)
              o=pd.read_csv(p.parent/"stage_omnibus.csv")
              o=o.loc[o["context"].eq("tropical")].copy()
              o.insert(0,"analysis",analysis)
              stages.append(o)
          summary=pd.concat(rows,ignore_index=True)
          stage=pd.concat(stages,ignore_index=True)
          summary.to_csv("/tmp/status_depth/results/tropical_classification_summary.csv",index=False)
          stage.to_csv("/tmp/status_depth/results/tropical_stage_omnibus.csv",index=False)
          print(summary.to_string(index=False))
          print(stage[["analysis","stage","status","n_retained_outcomes","n_unique_islands","q_value","vector_supported"]].to_string(index=False))
          PY
          cat /tmp/status_depth/status_support.json >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/status_depth/results/tropical_classification_summary.csv >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/status_depth/results/tropical_stage_omnibus.csv >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-tropical-endemic-depth-${{ github.run_id }}
          path: |
            /tmp/status_depth/results
            /tmp/status_depth/status_support.json
          if-no-files-found: error
          retention-days: 30
