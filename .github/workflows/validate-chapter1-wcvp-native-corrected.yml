name: Validate Chapter 1 WCVP regional-native sensitivity on corrected geography

on:
  push:
    branches:
      - analysis/wcvp-native-corrected
    paths:
      - ".github/workflows/run-chapter1-wcvp-native-corrected.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34232450884"
      SOURCE_ARTIFACT: "chapter1-progressive-analysis-34232450884"
      STATUS_RUN_ID: "32559322028"
      STATUS_ARTIFACT: "official-wcvp-corroborated-status-32559322028"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Validate implementation
        run: |
          pytest -q \
            tests/test_chapter1_wcvp_native_compatibility.py \
            tests/test_chapter1_wcvp_partition_diagnostic.py \
            tests/test_chapter1_all_data_probability.py
          ruff check \
            scripts/export_wcvp_native_ranges.py \
            src/island_v2/chapter1_wcvp_native_compatibility.py \
            src/island_v2/chapter1_wcvp_partition_diagnostic.py

      - name: Download frozen trait/status inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-wcvp/primary /tmp/ch1-wcvp/status
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D /tmp/ch1-wcvp/primary
          gh run download "$STATUS_RUN_ID" -n "$STATUS_ARTIFACT" -D /tmp/ch1-wcvp/status
          test -s /tmp/ch1-wcvp/primary/fixed/canonical/input/chapter1_status_flora.csv.gz
          test -s /tmp/ch1-wcvp/primary/snapshot/chapter1_trait_state_audit_all.csv.gz
          test -s /tmp/ch1-wcvp/primary/snapshot/chapter1_trait_state_audit_direct.csv.gz
          test -s /tmp/ch1-wcvp/status/resolved/island_tdwg_l3_mapping.csv
          test -s results/geography_20260924/corrected_geography_covariates.csv

      - name: Materialize current official WCVP native ranges and freeze checksum
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://sftp.kew.org/pub/data-repositories/WCVP/wcvp.zip \
            -o /tmp/ch1-wcvp/wcvp.zip
          sha256sum /tmp/ch1-wcvp/wcvp.zip | tee /tmp/ch1-wcvp/wcvp_sha256.txt
          python scripts/export_wcvp_native_ranges.py \
            data/v2/staging/gbif/collected/island_taxa.csv \
            /tmp/ch1-wcvp/wcvp.zip \
            /tmp/ch1-wcvp/ranges
          test -s /tmp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz

      - name: Run corrected-geography all-analysis regional-native sensitivity
        run: |
          python -m island_v2.chapter1_wcvp_native_compatibility \
            --status-flora-csv /tmp/ch1-wcvp/primary/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-wcvp/primary/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --wcvp-ranges-csv /tmp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz \
            --island-tdwg-csv /tmp/ch1-wcvp/status/resolved/island_tdwg_l3_mapping.csv \
            --config-path config/chapter1_v14_all_data_probability.yml \
            --evidence-scope all_analysis_eligible \
            --output-dir /tmp/results/all

      - name: Run corrected-geography direct-only regional-native sensitivity
        run: |
          python -m island_v2.chapter1_wcvp_native_compatibility \
            --status-flora-csv /tmp/ch1-wcvp/primary/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-wcvp/primary/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --wcvp-ranges-csv /tmp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz \
            --island-tdwg-csv /tmp/ch1-wcvp/status/resolved/island_tdwg_l3_mapping.csv \
            --config-path config/chapter1_v14_all_data_probability.yml \
            --evidence-scope direct_only \
            --output-dir /tmp/results/direct

      - name: Partition observed-flora signal by status evidence
        run: |
          python -m island_v2.chapter1_wcvp_partition_diagnostic \
            --status-flora-csv /tmp/ch1-wcvp/primary/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-wcvp/primary/snapshot/chapter1_trait_state_audit_all.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --wcvp-ranges-csv /tmp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz \
            --island-tdwg-csv /tmp/ch1-wcvp/status/resolved/island_tdwg_l3_mapping.csv \
            --config-path config/chapter1_v14_all_data_probability.yml \
            --evidence-scope all_analysis_eligible \
            --output-csv /tmp/results/all/wcvp_partition_diagnostic.csv

          python -m island_v2.chapter1_wcvp_partition_diagnostic \
            --status-flora-csv /tmp/ch1-wcvp/primary/fixed/canonical/input/chapter1_status_flora.csv.gz \
            --state-audit-csv /tmp/ch1-wcvp/primary/snapshot/chapter1_trait_state_audit_direct.csv.gz \
            --covariates-csv results/geography_20260924/corrected_geography_covariates.csv \
            --wcvp-ranges-csv /tmp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz \
            --island-tdwg-csv /tmp/ch1-wcvp/status/resolved/island_tdwg_l3_mapping.csv \
            --config-path config/chapter1_v14_all_data_probability.yml \
            --evidence-scope direct_only \
            --output-csv /tmp/results/direct/wcvp_partition_diagnostic.csv

      - name: Write compact validation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          blocks = []
          for scope in ("all", "direct"):
              coverage = pd.read_csv(f"/tmp/results/{scope}/regional_native_coverage.csv")
              omnibus = pd.read_csv(f"/tmp/results/{scope}/regional_native_within_omnibus.csv")
              slopes = pd.read_csv(f"/tmp/results/{scope}/regional_native_within_slopes.csv")
              blocks.append({
                  "scope": scope,
                  "coverage": coverage.to_dict(orient="records"),
                  "omnibus": omnibus.to_dict(orient="records"),
                  "slopes": slopes.to_dict(orient="records"),
              })
          out = {
              "analysis": "WCVP regional-native compatibility using corrected 2026-09-24 geography",
              "wcvp_sha256": Path("/tmp/ch1-wcvp/wcvp_sha256.txt").read_text().split()[0],
              "blocks": blocks,
          }
          Path("/tmp/results/validation_summary.json").write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY
          {
            echo "## WCVP regional-native corrected-geography sensitivity"
            cat /tmp/results/all/regional_native_coverage.csv
            echo
            cat /tmp/results/all/regional_native_within_omnibus.csv
            echo
            cat /tmp/results/direct/regional_native_coverage.csv
            echo
            cat /tmp/results/direct/regional_native_within_omnibus.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist validation results on branch
        if: success()
        run: |
          set -euo pipefail
          target=results/wcvp_native_corrected_20261003
          rm -rf "$target"
          mkdir -p "$target/all" "$target/direct"
          cp /tmp/results/validation_summary.json "$target/"
          cp /tmp/ch1-wcvp/wcvp_sha256.txt "$target/"
          cp /tmp/ch1-wcvp/ranges/wcvp_native_range_manifest.json "$target/"
          cp /tmp/results/all/*.csv "$target/all/"
          cp /tmp/results/direct/*.csv "$target/direct/"
          cat > "$target/README.md" <<'EOF'
          # WCVP regional-native sensitivity on corrected geography

          This surface replays Chapter 1 H1 using the 24 September 2026 corrected
          spherical-coastline geography and a conservative regional-native sensitivity.
          Unresolved island-species rows are upgraded only when the focal island maps
          unambiguously to a TDWG Level-3 unit that WCVP lists in the accepted species'
          native range. Source-backed introduced rows are never overwritten.

          The analysis is a status sensitivity, not a claim of exact island-level nativeness.
          Raw WCVP bulk bytes are not committed; the exact SHA256 and extraction manifest
          are retained here.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Persist corrected WCVP native sensitivity results"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-wcvp-native-corrected-${{ github.run_id }}
          path: |
            /tmp/results
            /tmp/ch1-wcvp/wcvp_sha256.txt
            /tmp/ch1-wcvp/ranges/wcvp_native_range_manifest.json
            /tmp/ch1-wcvp/ranges/wcvp_native_range_summary.csv.gz
          if-no-files-found: error
          retention-days: 30
