name: Validate PR138 biogeographic pattern

on:
  push:
    branches: [pr136-channel-gated-primary-validation]
    paths:
      - "src/island_v2/chapter1_pr138_biogeographic_pattern.py"
      - "src/island_v2/chapter1_pr138_direct_ledger_pattern.py"
      - "src/island_v2/chapter1_pr136_biogeographic_residual.py"
      - "config/chapter1_pr136_biogeographic_pattern.yml"
      - "config/chapter1_pr136_biogeographic_residual.yml"
      - "tests/test_chapter1_pr138_biogeographic_pattern.py"
      - "tests/test_chapter1_pr138_direct_ledger_pattern.py"
      - "tests/test_chapter1_pr136_biogeographic_residual.py"
      - ".github/workflows/validate-pr136-channel-gated.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/chapter1_pr138_biogeographic_pattern.py"
      - "src/island_v2/chapter1_pr138_direct_ledger_pattern.py"
      - "src/island_v2/chapter1_pr136_biogeographic_residual.py"
      - "config/chapter1_pr136_biogeographic_pattern.yml"
      - "config/chapter1_pr136_biogeographic_residual.yml"
      - "tests/test_chapter1_pr138_biogeographic_pattern.py"
      - "tests/test_chapter1_pr138_direct_ledger_pattern.py"
      - "tests/test_chapter1_pr136_biogeographic_residual.py"
      - ".github/workflows/validate-pr136-channel-gated.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check \
            src/island_v2/chapter1_pr138_biogeographic_pattern.py \
            src/island_v2/chapter1_pr138_direct_ledger_pattern.py \
            src/island_v2/chapter1_pr136_biogeographic_residual.py \
            tests/test_chapter1_pr138_biogeographic_pattern.py \
            tests/test_chapter1_pr138_direct_ledger_pattern.py \
            tests/test_chapter1_pr136_biogeographic_residual.py
      - name: Observed-pattern and decomposition falsification tests
        run: |
          pytest -q \
            tests/test_chapter1_pr138_biogeographic_pattern.py \
            tests/test_chapter1_pr138_direct_ledger_pattern.py \
            tests/test_chapter1_pr136_biogeographic_residual.py
      - name: Parse pattern contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          primary = yaml.safe_load(Path('config/chapter1_pr136_biogeographic_pattern.yml').read_text())
          secondary = yaml.safe_load(Path('config/chapter1_pr136_biogeographic_residual.yml').read_text())
          assert primary['inferential_layers']['primary'] == 'observed_native_flora_broad_syndrome_composition'
          assert primary['pollinator_predictors_in_primary_model'] is False
          assert len(primary['broad_outcomes']) == 8
          assert secondary['pollinator_predictors_in_primary_model'] is False
          print('Eight-axis observed assemblage primary + secondary genus-fixed decomposition: ok')
          PY
