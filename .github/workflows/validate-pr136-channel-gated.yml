name: Validate PR136 biogeographic primary

on:
  push:
    branches: [pr136-channel-gated-primary-validation]
    paths:
      - "src/island_v2/chapter1_pr136_biogeographic_residual.py"
      - "config/chapter1_pr136_biogeographic_residual.yml"
      - "config/chapter1_pr136_channel_gated_validation.yml"
      - "tests/test_chapter1_pr136_biogeographic_residual.py"
      - ".github/workflows/validate-pr136-channel-gated.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/island_v2/chapter1_pr136_biogeographic_residual.py"
      - "config/chapter1_pr136_biogeographic_residual.yml"
      - "config/chapter1_pr136_channel_gated_validation.yml"
      - "tests/test_chapter1_pr136_biogeographic_residual.py"
      - ".github/workflows/validate-pr136-channel-gated.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check \
            src/island_v2/chapter1_pr136_biogeographic_residual.py \
            tests/test_chapter1_pr136_biogeographic_residual.py
      - name: PR136 biogeographic falsification tests
        run: |
          pytest -q tests/test_chapter1_pr136_biogeographic_residual.py
      - name: Parse PR136 primary contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              Path('config/chapter1_pr136_channel_gated_validation.yml'),
              Path('config/chapter1_pr136_biogeographic_residual.yml'),
          ]:
              payload = yaml.safe_load(path.read_text())
              assert isinstance(payload, dict) and payload
              print(path, 'ok')
          PY
