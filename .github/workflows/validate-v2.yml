name: Validate v2 data architecture

on:
  push:
    branches: [main, v2-channel-architecture]
    paths:
      - "src/island_v2/**"
      - "tests/**"
      - "config/**"
      - "prompts/**"
      - "scripts/validate_workflows.py"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/island_v2/**"
      - "tests/**"
      - "config/**"
      - "prompts/**"
      - "scripts/validate_workflows.py"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test tools
        run: pip install -e ".[dev]"
      - name: Validate GitHub Actions workflow contracts
        run: python scripts/validate_workflows.py
      - name: Lint v2 package
        run: ruff check src/island_v2 tests scripts/validate_workflows.py
      - name: Validate ontology
        run: island-v2-validate ontology --ontology-path config/trait_ontology.yml
      - name: Test controlled inference and GBIF request construction
        run: pytest -q --junitxml=pytest-results.xml
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 7
