name: Validate v2 data architecture

# Emergency Actions-budget mode: run validation only when explicitly requested.
# Restore scoped push / pull_request triggers after the monthly billing cycle resets.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: github.ref != 'refs/heads/codex/direct-web-reacquisition'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test tools
        run: pip install -e ".[dev]"
      - name: Validate GitHub Actions workflow contracts
        run: python scripts/validate_workflows.py
      - name: Lint v2 package
        run: ruff check src/island_v2 tests scripts/validate_workflows.py
      - name: Validate ontology
        run: island-v2-validate ontology --ontology-path config/trait_ontology.yml
      - name: Test controlled inference and GBIF request construction
        run: pytest -q

  acquire_broad_web_medium:
    if: github.ref == 'refs/heads/codex/direct-web-reacquisition'
    uses: ./.github/workflows/run-broad-web-medium-acquisition.yml
    with:
      baseline_run_id: "30107066525"
      offset: 0
      limit: 0
      workers: 12
    permissions:
      actions: read
      contents: read
