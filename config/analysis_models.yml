# Chapter 1 analysis model contract.
#
# Primary question:
#   When and where is isolation-associated floral/reproductive filtering detectable,
#   and where does the multivariate response to isolation differ?
version: "4.0"

baseline_covariates:
  - island_area
  - climate
  - floristic_status_endemicity
  - lineage_source_pool_composition
  - establishment_reachability_if_represented
  - observation_evidence_support

primary_exposure: isolation
primary_context: biogeographic_context

headline_hypotheses:
  H1: universal_filtering
  H2: conditional_biogeographically_structured_filtering
  H3: floristic_status_persistence
  current_frozen_support: >-
    Filtering is confirmatorily detectable in northern_midlatitude and tropical
    contexts; their multivariate isolation-response vectors differ; both signals
    persist in native_nonendemic flora.

primary_outcomes:
  - multistate_flower_colour_composition
  - multistate_floral_form_composition
  - floral_symmetry_tube_depth_access_and_size_where_supported
  - reproductive_compatibility_and_assurance_composition

primary_when_where_tests:
  WHERE:
    implementation: chapter1_when_where_omnibus
    statistic: spatial_block_cluster_robust_joint_wald
    null: all_supported_atomic_isolation_slopes_equal_zero_within_context
    multiplicity: BH_across_contexts_within_stratum_and_support_tier
    question: Which biogeographic contexts show detectable isolation-associated filtering?

  BETWEEN_WHERE:
    implementation: chapter1_when_where_omnibus
    statistic: spatial_block_cluster_robust_joint_wald
    null: response_vector_context_A_equals_response_vector_context_B
    support_rule: same_threshold_required_in_both_contexts
    multiplicity: BH_across_context_pairs_within_stratum_and_support_tier
    question: Where do multivariate isolation responses genuinely differ?

  WHEN:
    implementation: floristic_status_persistence
    strata:
      - all_native
      - native_nonendemic
      - endemic
    rule: >-
      Persistence in native_nonendemic flora shows that a regional filtering signal
      is not confined to endemic taxa. Because strata overlap, this is a persistence
      classification rather than a causal status contrast.

support_policy:
  excluded_below_islands_per_response: 30
  pilot_min_islands_per_response: 30
  confirmatory_min_islands_per_response: 50
  rule: >-
    Every retained atomic response must meet the support threshold in the focal
    context. Pairwise context comparisons require the same threshold in both contexts.

secondary_atomic_models:
  M0:
    name: context_aware_atomic_baseline
    covariates: baseline_covariates + biogeographic_context
  M1:
    name: common_atomic_isolation_effect
    covariates: baseline_covariates + biogeographic_context + isolation
  M2:
    name: atomic_context_slope_heterogeneity
    covariates: baseline_covariates + biogeographic_context + isolation + isolation:biogeographic_context
  role: >-
    Atomic M0-M2 models characterize which traits contribute to supported response
    vectors. Counts of individually significant traits do not define WHERE.

M3_lineage_guardrail:
  method: genus_composition_preserving_null
  status: required_before_broad_syndrome_claims
  broad_outcomes:
    - generalized_form
    - plain_colour
    - self_compatibility
  current_result: >-
    These broad outcomes do not form a coherent confirmatory generalized+plain+SC
    syndrome in the main northern/tropical all_native or native_nonendemic analyses.

M4_category_decomposition:
  status: secondary_interpretation_after_when_where_freeze
  rule: >-
    Preserve atomic colour, floral-form and reproductive categories to explain what
    makes supported response vectors differ; do not construct the primary test from
    a composite syndrome score.

current_frozen_result:
  run_id: 32837335384
  artifact_id: 9559224512
  artifact_digest: sha256:dd8caf37fe830595083c643f871145295a6487883fe065a20a4209f159dd745c
  confirmatory_where:
    northern_midlatitude:
      all_native: true
      native_nonendemic: true
    tropical:
      all_native: true
      native_nonendemic: true
    northern_high_latitude: unresolved_support
    southern_extratropical: unresolved_confirmatorily_pilot_signal_present
  confirmatory_between_where:
    northern_midlatitude_vs_tropical:
      all_native_q: 2.352889e-08
      native_nonendemic_q: 7.125861e-07
  when_status:
    northern_midlatitude: persists_in_native_nonendemic
    tropical: persists_in_native_nonendemic

pollination_syndrome_concordance:
  stage: after_when_where_result_freeze
  role: discussion_interpretation_only
  rule: >-
    Compare frozen regional response vectors with literature-defined pollination
    expectations for concordance or mismatch. Never infer actual pollinator identity,
    historical loss, or functional replacement from floral phenotype alone.

bombus_products:
  canonical_primary_predictor: false
  retained_roles:
    - provenance
    - descriptive_regional_context
    - exploratory_diagnostics
    - sensitivity_analysis
    - candidate_system_selection_for_mechanistic_followup
  acquisition_rule: >-
    Do not launch additional Bombus acquisition solely to rescue a Chapter 1 mechanism.

guardrails:
  - a significant effect in one context and a nonsignificant effect in another is not evidence of a regional difference.
  - insufficient support is unresolved, not evidence of no filtering.
  - atomic significant-trait counts cannot replace response-vector omnibus tests.
  - category-preserving outcomes precede pollination-syndrome interpretation.
  - lineage/source-pool safeguards remain required before broad syndrome claims.
  - Chapter 1 identifies when/where boundary conditions; mechanism is handed to Chapter 2.
