# Chapter 1 analysis model ladder.
#
# Primary question:
#   When and where does island isolation coincide with floral and reproductive
#   filtering, and is that filtering globally uniform or biogeographically contingent?
#
# Bombus / bird / Lepidoptera / other pollinator-syndrome interpretations are
# downstream discussion layers, not required primary predictors.
version: "2.1"

baseline_covariates:
  - island_area
  - climate
  - floristic_status_endemicity
  - lineage_source_pool_composition
  - establishment_reachability_if_represented
  - observation_evidence_support

primary_exposure: isolation
primary_effect_modifier: biogeographic_context

biogeographic_context_rule: >-
  Freeze context independently of floral/reproductive outcomes. Context main effects
  must be represented before testing isolation so pre-existing regional differences
  in mean trait composition cannot masquerade as context-dependent isolation effects.

primary_outcomes:
  - multistate_flower_colour_composition
  - multistate_floral_form_composition
  - floral_symmetry_tube_depth_access_and_size_where_supported
  - reproductive_compatibility_and_assurance_composition

secondary_summaries:
  - plain_vs_conspicuous
  - generalized_vs_specialized
  - sc_vs_si

reproductive_non_equivalence_rule: >-
  Self-compatibility, autonomous selfing, mating system, sex system and pollen
  vector are separate domains. Never derive one from another unless a direct
  source explicitly supplies the relevant state.

models:
  M0:
    name: biogeographic_baseline
    covariates: baseline_covariates + biogeographic_context
    outcome: primary_outcomes
    question: >-
      How much composition is explained by baseline structure and context-specific
      mean composition before isolation is added?

  M1:
    name: universal_isolation_baseline
    covariates: baseline_covariates + biogeographic_context + isolation
    outcome: primary_outcomes
    comparison: M0_to_M1
    question: >-
      Does one common isolation slope improve the context-aware baseline?

  M2:
    name: biogeographic_contingency
    covariates: baseline_covariates + biogeographic_context + isolation + isolation:biogeographic_context
    outcome: primary_outcomes
    status: primary_chapter1_when_where_test
    comparison: M1_to_M2
    question: >-
      After regional mean composition is already represented, does allowing the
      isolation slope to differ among contexts improve the model and yield supported
      context contrasts?

  M3:
    name: status_lineage_residual
    base_model: M2
    safeguards:
      - conservative_native_or_endemicity_strata_where_supported
      - genus_family_or_source_pool_preserving_expectation
      - clade_stratified_or_phylogenetic_sensitivity_where_feasible
    outcome: residual_or_conditioned_primary_outcomes
    question: >-
      Does a regional isolation-associated trait pattern remain after floristic
      status and inherited lineage/source-pool composition are constrained?

  M4:
    name: category_preserving_decomposition
    base_model: M2_or_M3
    outcome: individual_retained_trait_categories
    question: >-
      Which observed colour, floral-form and reproductive categories create,
      oppose or cancel any supported regional response?

support_policy:
  primary_context_min_islands: 30
  confirmatory_context_min_islands: 50
  rule: >-
    Context-specific effects below 30 islands are exploratory and cannot define the
    primary when/where conclusion. Counts of 30-49 are pilot-level; >=50 meet the
    count component of the confirmatory support rule.

pollination_syndrome_concordance:
  stage: after_M0_to_M4_results_are_frozen
  role: discussion_interpretation_only
  comparisons:
    northern_temperate:
      candidate_literature_contexts:
        - Bombus_associated
        - large_or_long_tongued_bee_associated
    tropical_or_southern:
      candidate_literature_contexts:
        - bird_associated
        - butterfly_or_moth_associated
        - hawkmoth_associated
        - alternative_bee_associated
  rule: >-
    Compare multivariate observed trait directions with literature-defined syndrome
    expectations. Do not infer an actual pollinator guild from floral phenotype and
    do not use syndrome concordance as an input to a fitted model.

bombus_products:
  canonical_primary_predictor: false
  retained_roles:
    - provenance
    - descriptive_regional_context
    - exploratory_diagnostics
    - sensitivity_analysis
    - candidate_system_selection_for_mechanistic_followup
  prohibited_interpretations:
    - environmental_compatibility_as_realized_occurrence
    - opportunistic_nondetection_as_historical_loss
    - occurrence_as_visitation_or_effectiveness
    - association_as_pollinator_caused_evolution
  acquisition_rule: >-
    Do not launch additional Bombus acquisition solely to rescue a weak/null
    mechanism in Chapter 1.

guardrails:
  - regional mean differences cannot count as evidence for isolation x context.
  - reported evidence and proxy/inference remain separate in every analysis.
  - category-preserving outcomes precede composite syndrome summaries.
  - biogeographic context is frozen independently of trait outcomes.
  - lineage/source-pool structure is not optional for manuscript-level inference.
  - pollination-syndrome concordance is interpretation, not a fitted causal variable.
  - Chapter 1 identifies pattern and boundary conditions; unresolved mechanism is handed to Chapter 2.
