version: "1.0"

# Family-based angiosperm eligibility applied BEFORE any floral/pollination fill.
# The GBIF acquisition universe is Tracheophyta, but non-seed vascular plants and
# gymnosperms have no flowers or comparable pollen-vector states, so they must be
# marked out-of-scope rather than assigned global floral priors. A species is
# angiosperm-eligible when its family is present and not on any non-angiosperm
# list. An empty/unknown family cannot be confirmed as angiosperm and is
# out-of-scope (family_unresolved). Two fern-sounding families are angiosperms
# and are deliberately NOT excluded: Cardiopteridaceae, Pteridophyllaceae.
family_column: family
eligible_group: angiosperm
unresolved_group: family_unresolved

non_angiosperm_families:
  gymnosperm:
    - Araucariaceae
    - Cephalotaxaceae
    - Cupressaceae
    - Cycadaceae
    - Ephedraceae
    - Ginkgoaceae
    - Gnetaceae
    - Phyllocladaceae
    - Pinaceae
    - Podocarpaceae
    - Sciadopityaceae
    - Taxaceae
    - Taxodiaceae
    - Welwitschiaceae
    - Zamiaceae

  non_seed_vascular:
