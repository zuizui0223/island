  austraits_all_pollinator_guild:
    description: >-
      Selected AusTraits pollination_syndrome and pollination_system rows mapped
      to the v2 functional-guild vocabulary. Unidentified specialised biotic,
      rare, and unsupported mixed labels stay in the unmapped audit.
    read:
      delimiter: ","
      encoding: "utf-8"
    columns:
      scientific_name: "taxon_name"
      trait_name: "trait_name"
      trait_value: "trait_value"
      source_record_id: "source_record_id"
    source_defaults:
