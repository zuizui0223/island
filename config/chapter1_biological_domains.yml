contract: chapter1_biological_domains_v1
date: 2026-10-03
inferential_role: posthoc_biological_domain_reclassification_sensitivity

purpose: >-
  Re-express the frozen Chapter 1 component-trait evidence in biologically interpretable
  domains without replacing the confirmatory v14/final H1. Reproductive assurance and
  accessibility reuse previously frozen PR138 species-score definitions. Signal/display
  is newly named as a domain, but its only directional contrast reuses the pre-existing
  selfing-syndrome flower-size recode. Colour hue and inflorescence type are never
  coerced into an attraction-intensity ordering.

geography_column: log_distance_to_continent_km
context_column: analysis_regime
cluster_column: spatial_block
baseline_covariates:
  - log_island_area_km2
  - climate_pc1
  - climate_pc2
  - climate_pc3
  - climate_pc4
contexts:
  - northern_midlatitude
  - northern_high_latitude
  - tropical
  - southern_extratropical
minimum_islands: 50
alpha: 0.05

evidence_scopes:
  all_analysis_eligible: [high, medium, low]
  direct_only: [high, medium]

domains:
  reproductive_assurance:
    directional: true
    source_definition: config/chapter1_pr138_pollination_syndromes.yml::selfing_core
    traits:
      - self_incompatibility
      - mating_system
      - autonomous_selfing_capacity
    expected_isolation_direction: positive
  accessibility_specialization:
    directional: true
    source_definition: config/chapter1_pr138_pollination_syndromes.yml::generalized_accessible
    traits:
      - floral_form
      - floral_symmetry
      - tube_depth_class
    expected_isolation_direction: positive
  signal_display:
    directional: false
    traits:
      - flower_primary_color
      - flower_size_class
      - inflorescence_display
    directional_sensitivity:
      name: reduced_flower_size
      source_definition: config/chapter1_pr138_pollination_syndromes.yml::selfing_syndrome.flower_size_class
      preferred: [very_small, small]
      opposed: [large, very_large]
      expected_isolation_direction: positive
    descriptive_state_traits:
      - flower_primary_color
      - flower_size_class
      - inflorescence_display

species_score:
  missing_traits: ignored_in_denominator
  minimum_informative_traits:
    reproductive_assurance: 2
    accessibility_specialization: 2
    reduced_flower_size: 1
  ambiguous_or_mixed_preferred_opposed: missing_for_score
  island_aggregation: arithmetic_mean_over_scored_species
  minimum_scored_species_per_island: 10

H1:
  regional_model: domain_score ~ isolation + island_area + climate_PC1_to_PC4
  uncertainty: spatial_block_cluster_robust
  finite_cluster_reference: t_G_minus_1
  global_synthesis: paule_mandel_modified_hartung_knapp
  report:
    - regional_effect
    - regional_p
    - four_region_IUT
    - global_average
    - regional_heterogeneity
  signal_display_rule: >-
    Do not create a single directional signal/display score from colour hue or
    inflorescence type. Test reduced flower size directionally and report individual
    colour/size/display state slopes with finite-cluster inference and within-trait-region
    BH correction. No high-dimensional omnibus test is used.

H2:
  primary_posthoc_models:
    - accessibility_specialization ~ isolation + reproductive_assurance + controls
    - reduced_flower_size ~ isolation + reproductive_assurance + controls
  mutual_adjustment_models:
    - accessibility_specialization ~ isolation + reproductive_assurance + reduced_flower_size + controls
    - reduced_flower_size ~ isolation + reproductive_assurance + accessibility_specialization + controls
  common_species_support_sensitivity: true
  multiplicity: >-
    BH within evidence scope across the eight primary post-hoc isolation tests
    (two conditional responses x four regions). Mutual-adjustment and common-species
    support results are labelled sensitivities.

H3:
  definition: unchanged_corrected_GloPL_isolation_gradient
  source: results/geography_20260924/h3_original_corrected_comparison.json
  offshore_source: results/h3_offshore_gradient_20261003/h3_offshore_gradient_summary.json
  finite_cluster_reference: publication_t_G_minus_1

H4:
  role: posthoc_functional_triangulation
  evidence_scope: direct_only
  scores:
    - reproductive_assurance
    - accessibility_specialization
    - reduced_flower_size
  exact_species_matching: casefold_space_underscore_normalization_only
  no_synonym_or_genus_fallback: true
  corrected_GloPL_distance:
    mean_log1p_distance: 1.0336192482458344
    sd_log1p_distance: 2.3354963860020934
  publication_total_weight: 1.0
  finite_cluster_reference: publication_t_G_minus_1
  expected_trait_score_direction: negative_PL_association

reviewer_guards:
  - this_reclassification_is_posthoc_and_cannot_replace_confirmatory_H1
  - H3_is_unchanged_by_trait_reclassification
  - colour_hue_is_not_attraction_intensity
  - inflorescence_type_is_not_ordinal_display_investment
  - reduced_flower_size_direction_predates_this_reclassification
  - missing_trait_is_not_zero
  - all_observed_is_contemporary_flora_not_native_evolution
  - common_species_support_is_reported
  - finite_cluster_inference_is_used_for_scalar_tests
  - no_high_dimensional_cluster_Wald_is_used_for_domain_support
  - H2_is_conditional_decomposition_not_mediation
  - H4_is_current_functional_alignment_not_historical_selection
  - no_named_pollinator_identity_is_inferred
