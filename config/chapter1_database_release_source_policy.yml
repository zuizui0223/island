schema_version: 2
default_status: review_required
default_license: null
default_note: "Redistribution status has not yet been recorded for this normalized source family."
rules:
  - pattern: "^dataset:dryad$"
    status: redistributable
    license: CC0-1.0
    note: "Dryad states that published data are released under CC0; retain source DOI/provenance in the release."
  - pattern: "^dataset:austraits$"
    status: redistributable
    license: CC-BY-4.0
    note: "AusTraits releases are published under CC BY 4.0; attribution to AusTraits and contributing datasets is required."
  - pattern: "^dataset:bennett2020$"
    status: redistributable
    license: CC-BY-4.0
    note: "The lineage `dataset:bennett2020:glopl_pollinator_dependency` corresponds to pollinator-dependency data accompanying Bennett et al. (2020), Nature Communications 11:3999 (doi:10.1038/s41467-020-17751-y). The article provides Source Data under CC BY 4.0 and identifies the underlying GloPL dataset as Dryad doi:10.5061/dryad.dt437. Retain article, Source Data, and GloPL/Dryad attribution."
  - pattern: "^provider:bhl$"
    status: redistributable
    license: CC-BY-4.0
    note: "For immutable Database 1.0, `bhl:page:*` lineages were imported through Araujo, Hartley & Brummitt (2026), Angiosperm functional traits extracted from botanical descriptions, Natural History Museum dataset doi:10.5519/p3dm31kc, specifically its BHL-derived trait resource. The NHM dataset is published under Creative Commons Attribution. The BHL page identifier is retained as original-text provenance; this decision licenses redistribution of the NHM-derived structured trait values, not blanket republication of BHL page content."
  - pattern: "^database:usda_plants$"
    status: redistributable
    license: US-PUBLIC-DOMAIN
    note: "USDA NRCS PLANTS states that plant information, including distribution maps, lists, and text, is not copyrighted and is free for any use; cite the PLANTS Database. This decision applies to plant data, not separately licensed images."
  - pattern: "^provider_treatment:brazilian_flora_2020$"
    status: redistributable
    license: CC-BY-4.0
    note: "The Brazilian Flora 2020 dataset published by Jardim Botanico do Rio de Janeiro is licensed CC BY 4.0; retain dataset attribution and provenance."
  - pattern: "^database:pladias$"
    status: review_required
    license: null
    note: "Pladias data-provider conditions vary and third-party provision is conditional; do not redistribute until the relevant subset permission is documented."
  - pattern: "^derived:validated_low_without_direct_source_lineage$"
    status: review_required
    license: null
    note: "Derived Validated-Low provenance does not identify a directly licensable upstream source family; resolve before public redistribution."
  - pattern: "^unresolved:"
    status: review_required
    license: null
    note: "The stored lineage is insufficient to assign redistribution rights automatically."
  - pattern: "^domain:en\\.wikipedia\\.org$"
    status: review_required
    license: CC-BY-SA-4.0
    note: "Wikipedia content has attribution/share-alike conditions; release-level compatibility and attribution handling must be established first."
