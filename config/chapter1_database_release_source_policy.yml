schema_version: 2
public_release_license: CC-BY-SA-4.0
public_release_license_note: "The public Database 1.0 compilation uses CC BY-SA 4.0 as a conservative umbrella licence. This does not replace or relicense upstream sources: retain source-specific licences and provenance from SOURCE_LICENSE_INVENTORY.csv and SOURCE_LINEAGE_DETAILS.csv."
default_status: review_required
default_license: null
default_note: "Redistribution status has not yet been recorded for this normalized source family."
rules:
  - pattern: "^dataset:dryad$"
    status: redistributable
    license: CC0-1.0
    note: "Dryad states that published data are released under CC0; retain source DOI/provenance in the release."
  - pattern: "^dataset:austraits$"
    status: redistributable
    license: CC-BY-4.0
    note: "AusTraits releases are published under CC BY 4.0; attribution to AusTraits and contributing datasets is required."
  - pattern: "^dataset:bennett2020$"
    status: redistributable
    license: CC-BY-4.0
    note: "The lineage `dataset:bennett2020:glopl_pollinator_dependency` corresponds to pollinator-dependency data accompanying Bennett et al. (2020), Nature Communications 11:3999 (doi:10.1038/s41467-020-17751-y). The article provides Source Data under CC BY 4.0 and identifies the underlying GloPL dataset as Dryad doi:10.5061/dryad.dt437. Retain article, Source Data, and GloPL/Dryad attribution."
  - pattern: "^provider:bhl$"
    status: redistributable
    license: CC-BY-4.0
    note: "For immutable Database 1.0, `bhl:page:*` lineages were imported through Araujo, Hartley & Brummitt (2026), Angiosperm functional traits extracted from botanical descriptions, Natural History Museum dataset doi:10.5519/p3dm31kc, specifically its BHL-derived trait resource. The NHM dataset is published under Creative Commons Attribution. The BHL page identifier is retained as original-text provenance; this decision licenses redistribution of the NHM-derived structured trait values, not blanket republication of BHL page content."
  - pattern: "^wikidata-p2827:"
    status: redistributable
    license: CC0-1.0
    note: "Wikidata structured data in the main/property namespaces are released under CC0 1.0. This rule applies only to the structured P2827-derived lineage values, not prose from non-data namespaces."
  - pattern: "^database:usda_plants$"
    status: redistributable
    license: US-PUBLIC-DOMAIN
    note: "USDA NRCS PLANTS states that plant information, including distribution maps, lists, and text, is not copyrighted and is free for any use; cite the PLANTS Database. This decision applies to plant data, not separately licensed images."
  - pattern: "^provider_treatment:brazilian_flora_2020$"
    status: redistributable
    license: CC-BY-4.0
    note: "The Brazilian Flora 2020 dataset published by Jardim Botanico do Rio de Janeiro is licensed CC BY 4.0; retain dataset attribution and provenance."
  - pattern: "^provider_treatment:sanbi_eflora_south_africa$"
    status: redistributable
    license: CC-BY-4.0
    note: "Database 1.0 SANBI evidence was acquired from the official e-Flora of South Africa v1.42 Darwin Core Archive. The SANBI IPT identifies South African National Biodiversity Institute as publisher and rights holder and licenses the resource under CC BY 4.0. Retain the e-Flora v1.42 citation and SANBI attribution."
  - pattern: "^provider_treatment:flora_of_australia$"
    status: redistributable
    license: CC-BY
    note: "Database 1.0 Flora of Australia evidence was acquired from the official Flora of Australia ALA profile API and only the species-level Description field was interpreted. The current Flora of Australia collection states that all material is CC-BY unless otherwise stated, and the contributor guidelines state that all Flora content is delivered under a Creative Commons BY licence. The platform does not state a licence version on the collection footer, so this policy deliberately records CC-BY without inventing a version. Retain profile-level citation and attribution."
  - pattern: "^domain:en\\.wikipedia\\.org$"
    status: redistributable
    license: CC-BY-SA-4.0
    note: "Database 1.0 stores normalized trait facts and exact Wikipedia article URL provenance, not copied Wikipedia prose. Wikimedia text is reusable under CC BY-SA 4.0 and factual contributions may be reused; the public Database 1.0 compilation therefore uses CC BY-SA 4.0 as its umbrella licence and retains article-level attribution/provenance."
  - pattern: "^domain:gobotany\\.nativeplanttrust\\.org$"
    status: review_required
    license: null
    note: "Go Botany terms do not provide a blanket redistribution licence for reproducing/distributing site content or derivative use. Keep blocked unless written permission or a source-specific permissive licence is documented."
  - pattern: "^domain:plants\\.ces\\.ncsu\\.edu$"
    status: review_required
    license: null
    note: "NC State copyright guidance does not provide a blanket redistribution licence for Plant Toolbox text/content. Keep blocked unless permission or a source-specific permissive licence is documented."
  - pattern: "^database:pladias$"
    status: review_required
    license: null
    note: "Pladias data-provider conditions vary and third-party provision is conditional; do not redistribute until the relevant subset permission is documented."
  - pattern: "^derived:validated_low_without_direct_source_lineage$"
    status: review_required
    license: null
    note: "Derived Validated-Low provenance does not identify a directly licensable upstream source family; resolve before public redistribution."
  - pattern: "^unresolved:"
    status: review_required
    license: null
    note: "The stored lineage is insufficient to assign redistribution rights automatically."
