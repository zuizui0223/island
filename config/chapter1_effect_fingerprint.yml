contract: chapter1_effect_fingerprint_v1
status: post_freeze_descriptive_synthesis

pinned_input:
  workflow_run_id: 34232450884
  artifact_id: 10058653212
  artifact_name: chapter1-progressive-analysis-34232450884
  digest: sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999

purpose: >-
  Re-express already frozen Chapter 1 results as effect-size fingerprints rather than
  support-count votes. This layer introduces no new biological hypothesis, no new
  multiple-testing family, and no mechanism promotion.

primary_taxonomic_axes:
  - generalized_accessible
  - selfing_core
primary_taxonomic_context:
  context_layer: biogeographic_realm
  context: Palearctic
stages:
  - observed_score
  - after_family_residual
  - after_genus_residual
strata:
  - all_native
  - native_nonendemic
source_modes:
  - geo_k5
  - geo_k10
  - geo_k20
  - geo50_climate10

taxonomic_attenuation:
  metric: euclidean_norm_of_two_axis_distance_slopes
  family_retention: after_family_norm / observed_norm
  genus_retention: after_genus_norm / observed_norm
  genus_attenuation: 1 - genus_retention
  conditional_genus_attenuation: 1 - after_genus_norm / after_family_norm
  inferential_role: descriptive_only
  do_not_compute_ratio_when_observed_norm_below: 1.0e-12

atomic_fingerprint:
  contexts:
    - northern_midlatitude
    - tropical
  support_tier: confirmatory
  outcome_order:
    - plain_colour
    - generalized_form
    - actinomorphic_symmetry
    - shallow_open_tube
    - small_flower
    - self_compatibility
    - selfing_mating_system
    - autonomous_selfing
  outcome_domains:
    flower_colour:
      - plain_colour
    floral_structural_complexity:
      - generalized_form
      - actinomorphic_symmetry
      - shallow_open_tube
      - small_flower
    reproductive_assurance:
      - self_compatibility
      - selfing_mating_system
      - autonomous_selfing
  confidence_interval: normal_95_percent_from_existing_cluster_robust_se
  direction_class:
    positive: ci_low_gt_zero
    negative: ci_high_lt_zero
    otherwise: uncertain
  summary_metrics:
    - mean_classic_signed_slope
    - euclidean_slope_norm
    - n_positive_ci
    - n_negative_ci
    - n_uncertain
  cross_context_geometry:
    metric: angle_between_eight_component_slope_vectors_degrees
    interpretation: descriptive_orientation_only
    no_inferential_threshold: true

rules:
  - all_existing_outcomes_use_the_frozen_northern_classic_positive_direction
  - direct_only_never_overrides_all_analysis
  - vector_attenuation_is_not_percent_causal_mediation
  - vector_angle_is_not_a_new_heterogeneity_test
  - atomic_fingerprint_is_not_a_new_primary_H2_test
  - no_new_p_values_are_generated
  - no_pollinator_identity_is_inferred

claim_boundary: >-
  This synthesis can quantify how much the already observed response vector is reduced
  across family/genus source-matched stages and can display component-level effect-size
  fingerprints, including descriptive cross-context orientation. It cannot assign causal
  mediation, in-situ evolution, pollinator loss, or effective service.