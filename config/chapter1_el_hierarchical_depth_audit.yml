    digest: sha256:1301781e5c7420aeb7931fe034970188a2ea4b09e886def64c360aa89fbd6497

fixed_claim_boundary:
  primary_current_result: >-
    Isolation-associated floral/reproductive assemblage responses are biogeographically
    contingent, and the broad Palearctic primary response is compatible with
    source-matched genus-level assembly.
  prohibited_without_matched_depth_support:
    - endemicity is a time axis
    - endemic versus native-nonendemic separates in-situ evolution from assembly
    - taxonomic response depth differs universally among biogeographic contexts
    - a guild-labelled floral residual identifies the realized pollinator guild
    - pollinator-channel loss caused genus filtering

endemicity_gate:
  role: pilot_distribution_history_stratum
  confirmatory_min_islands_per_response: 50
  tropical_latest_support:
    generalized_form_islands: 30
    plain_colour_islands: 46
    self_compatibility_islands: 29
    when_where_pilot_joint_p: 0.204481
    confirmatory_eligible: false
  promotion_rule: >-
    Endemic strata may become a main comparison only after the same response family has
    >=50 supported islands in every compared context and evidence scope required by the
    Chapter 1 contract. Until then, endemic results are descriptive or pilot only.

reporting_reexpression:
  headline_unit: effect_size_with_uncertainty
  required_fields:
    - context_delta_slope
    - context_difference_in_delta_slope
    - cluster_robust_se
    - ci95_low
    - ci95_high
    - n_islands
    - source_mode
    - evidence_scope
    - floristic_stratum
  forbidden_headline_shortcut:
    - supported_mode_vote_counts_alone
    - significant_in_one_context_nonsignificant_in_another
  vote_counts_role: audit_only

matched_depth_test:
  rationale: >-
    A claim about context-dependent taxonomic depth must compare the same biological
    response family at the same taxonomic stages. Palearctic primary H2/H3 scores cannot
    be contrasted with tropical secondary V4 guild-labelled residuals and then relabelled
    as a taxonomic-depth difference.
  response_family: shared_architecture_decomposition
  components:
    - shared_architecture_factor
    - large_bee_like_residual
    - butterfly_like_residual
    - bird_like_residual
  interpretation: >-
    Component names are floral-architecture labels only. They do not assign pollinator
    identity or effective service.
  contexts:
    - northern_midlatitude
    - tropical
  context_column: analysis_regime
  cluster_column: spatial_block
  geography_column: log_distance_to_continent_km
  baseline_covariates:
    - log_island_area_km2
    - climate_pc1
    - climate_pc2
    - climate_pc3
    - climate_pc4
  floristic_strata:
    - all_native
    - native_nonendemic
  evidence_scopes:
    - all_analysis_eligible
    - direct_only
  source_modes:
    - geo_k5
    - geo_k10
    - geo_k20
    - geo50_climate10
  taxonomic_stages:
    pre_genus: source_adjusted_architecture_response
    beyond_genus: source_matched_beyond_genus_residual
  minimum_paired_islands_per_component_context: 50
  alpha: 0.05
  model: >-
    For each island x architecture component on common pre/post support, form
    delta = beyond_genus - pre_genus. Fit component- and context-specific distance slopes
    for delta while saturating component x context intercepts and baseline covariate
    effects, with spatial-block cluster-robust covariance. The formal statistic is the
    four-component tropical-minus-northern vector of delta-distance slopes.
  multiplicity: >-
    BH-FDR across the four frozen source modes within evidence_scope x floristic_stratum.
  interpretation_rule: >-
    A supported interaction means that genus adjustment changes the isolation-associated
    architecture vector differently between the two biogeographic contexts. It does not
    identify evolution, pollinator identity, or a pollination mechanism.

publication_gate:
  full_hierarchical_depth_promotion: >-
    All four source modes pass the matched multivariate interaction after FDR in both
    evidence scopes and both primary floristic strata.
  bounded_hierarchical_depth_signal: >-
    All four source modes pass after FDR in both evidence scopes for native_nonendemic,
    but support is weaker or evidence-scope-sensitive in all_native. This permits a
    bounded statement about widespread native assemblages, not a universal taxonomic-
    depth rule.
  no_promotion: >-
    The native_nonendemic four-source-mode gate fails in either evidence scope.

existing_v4_evidence_boundary:
  note: >-
    Existing V4 results show a robust north-versus-tropical beyond-genus architecture-
    vector difference in direct-only evidence across all four source modes and in
    all-analysis native-nonendemic across all four source modes. This motivates the
    matched re-expression but is not itself the context x taxonomic-stage interaction.

globi_source_side_extension:
  role: secondary_H3_extension
  status: definition_must_be_frozen_before_genus_entry_join
  allowed_input: pinned_GloBI_0_9_supported_flower_interactions
  outcome_blind_predictor: source_genus_sampled_functional_channel_breadth
  channels:
    - bombus
    - non_bombus_bees
    - lepidoptera
    - flower_visiting_birds
    - diptera
  safeguards:
    - never_treat_no_GloBI_record_as_specialization
    - never_use_raw_partner_count_without_effort_control
    - require_minimum_independent_reference_support_before_breadth_estimation
    - retain_reference_count_as_sampling_effort
    - compute_predictor_without_island_genus_entry_outcomes
    - D3_association_only_no_mechanism_promotion
  allowed_claim: >-
    Source-side sampled interaction breadth predicts isolation-associated representation
    of source-available plant genera.
  prohibited_claim: >-
    Pollinator loss caused the observed genus filtering.

routing:
  ecology_letters_candidate_requires:
    - full_hierarchical_depth_promotion OR bounded_hierarchical_depth_signal
    - effect-size and uncertainty framing replaces vote-count headline
    - direct-only versus all-analysis differences are shown rather than selected away
    - endemic strata remain pilot unless independently promoted
    - N1 prospective failure remains visible as the mechanistic claim boundary
  otherwise_primary_target: Global Ecology and Biogeography
