contract: chapter1_el_hierarchical_depth_audit_v1
status: frozen_before_tracked_matched_depth_reexpression
purpose: >-
  Decide whether Chapter 1 can support the general claim that the taxonomic depth at
  which isolation-associated floral/reproductive responses are expressed differs among
  biogeographic contexts. This is a matched secondary re-expression and publication
  promotion audit, not a new outcome-blind primary hypothesis and not a rescue analysis.

