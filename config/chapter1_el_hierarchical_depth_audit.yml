  final_trait_integration:
    workflow_run_id: 34191508045
    filled_species_axis_cells: 222688
    total_species_axis_cells: 318885
    fill_fraction: 0.6983
  final_pr142_progressive_reanalysis:
    workflow_run_id: 34232450884
    artifact_id: 10058653212
    artifact_name: chapter1-progressive-analysis-34232450884
    digest: sha256:b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999
  latest_status_support_audit:
