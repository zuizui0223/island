contract: chapter1_h4_prospective_temporal_replication_v1
status: frozen_before_post2015_outcome_extraction
inferential_role: prospective_temporal_replication
created: '2026-09-18'

purpose: >-
  Prospectively test two trait-to-current-pollen-limitation predictions generated by
  the locked v13 post-hoc functional bridge, using only publications after the GloPL
  source window. This contract must be committed before any post-2015 reproductive
  outcome or derived pollen-limitation effect is extracted for analysis.

discovery_origin:
  parent_result_lock: config/chapter1_v13_functional_bridge_result_lock.json
  parent_role: posthoc_functional_triangulation
  parent_result_is_not_relabelled_confirmatory: true

temporal_holdout:
  legacy_GloPL_publication_window:
    start_year: 1981
    end_year: 2015
  validation_publication_window:
    start_date: '2016-01-01'
    end_date: '2026-09-18'
  rule: publication_date_must_be_strictly_after_legacy_GloPL_window
  legacy_GloPL_publication_overlap_forbidden: true

literature_discovery:
  metadata_only_before_support_lock: true
  sources:
    - OpenAlex
    - Crossref
  query_families:
    - pollen limitation
    - pollen supplementation
    - hand pollination
    - supplemental pollination
    - pollen addition
  deduplication_key_priority:
    - normalized_DOI
    - source_record_id
  title_and_bibliographic_metadata_allowed: true
  abstract_fulltext_result_interpretation_before_support_lock: forbidden
  search_cutoff_date: '2026-09-18'

screening:
  include:
    - original_manipulative_pollen_supplementation_experiment
    - wild_angiosperm_species
    - species_level_identity
    - natural_or_semifield_population
    - natural_pollination_control_present
    - hand_outcross_or_supplemental_pollen_treatment_present
    - reproductive_output_endpoint_reported
    - geographic_site_resolvable
  exclude:
    - publication_date_before_2016
    - crop_or_cultivar_only
    - greenhouse_only_without_natural_population
    - self_pollen_only_without_outcross_or_supplemental_treatment
    - observational_only_without_pollen_manipulation
    - review_or_meta_analysis_without_new_experiment
    - no_species_level_identity
  screening_decisions_must_ignore_effect_direction: true

outcome_blind_preflight:
  required_metadata_columns:
    - experiment_key
    - publication_id
    - doi
    - publication_date
    - study_key
    - site_key
    - accepted_species
    - analysis_regime
    - z_distance
  allowed_optional_metadata_columns:
    - title
    - source_database
    - source_record_id
    - latitude
    - longitude
    - country
    - notes_without_outcome_direction
  forbidden_columns:
    - PL_Effect_Size
    - PL_Effect_Size_Type1
    - PL_Effect_Size_Type2
    - Constant_added
    - Level_of_Supplementation
    - Natural_N_FS
    - Natural_X_FS
    - Natural_SD_FS
    - Sup_N_FS
    - Sup_X_FS
    - Sup_SD_FS
    - Bagout_N_FS
    - Bagout_X_FS
    - Bagout_SD_FS
    - natural_output
    - supplemented_output
    - pollen_limitation
    - effect_size
  no_effect_or_treatment_output_may_be_read_before_support_lock: true

trait_snapshot:
  source: frozen_v13_direct_trait_snapshot
  parent_workflow_run_id: 34191508045
  parent_artifact_id: 10042377593
  parent_artifact_digest: sha256:5e9c887e093c42eb720f3abd2dc85701ce123fb7fe888c916dc4098ac898ccdd
  matching: exact_accepted_species_only
  synonym_or_genus_fallback_after_outcome_inspection: forbidden
  required_columns:
    - accepted_species
    - autonomous_selfing
    - generalized_form
    - actinomorphic_symmetry
    - shallow_open_tube

primary_hypotheses:
  H4a_reproductive_assurance:
    predictor: autonomous_selfing
    coding: binary_0_1
    prediction: negative_current_PL_association
    one_sided_alpha: 0.025
    support_gate:
      minimum_matched_species_total: 30
      minimum_species_per_state: 10
      minimum_publications_total: 10
      minimum_publications_per_state: 5
  H4b_accessibility_generalization:
    predictor: accessibility_generalization_score
    components:
      generalized_form: 1.0
      actinomorphic_symmetry: 1.0
      shallow_open_tube: 1.0
    score: arithmetic_mean_of_available_binary_components
    minimum_nonmissing_components_per_species: 2
    prediction: negative_current_PL_association
    one_sided_alpha: 0.025
    support_gate:
      minimum_matched_species_total: 30
      minimum_publications_total: 10
      minimum_score_sd: 0.10
      minimum_low_score_species: 8
      low_score_max: 0.3333333333
      minimum_high_score_species: 8
      high_score_min: 0.6666666667

secondary_not_confirmatory:
  - self_compatibility
  - generalized_form
  - actinomorphic_symmetry
  - shallow_open_tube
  - within_publication
  - within_publication_site
  - supplemental_only
  - no_zero_constant

response:
  column: PL_Effect_Size
  definition: log_hand_outcross_or_supplemented_output_over_natural_pollination_output
  direction: positive_values_mean_stronger_pollen_limitation
  zero_rule: add_0.5_only_when_either_mean_is_zero
  treatment_priority:
    - supplemental_unbagged
    - bagged_outcross
  endpoint_priority:
    - seeds_per_plant
    - seeds_per_flower
    - seeds_per_fruit
    - fruit_set
    - seed_set

analysis:
  primary_model: PL ~ predictor + z_distance + context_intercepts + measurement_fixed_effects
  unit: publication_x_site_x_species_x_measurement_cell
  duplicate_cell_summary: arithmetic_mean
  publication_total_weight: 1.0
  cluster: study_key
  measurement_fixed_effects:
    - PL_Effect_Size_Type1
    - PL_Effect_Size_Type2
    - Constant_added
    - Level_of_Supplementation
  context_reference: northern_midlatitude
  context_order:
    - northern_midlatitude
    - northern_high_latitude
    - tropical
    - southern_extratropical
  multiplicity: two_co_primary_hypotheses_each_one_sided_alpha_0_025
  no_model_selection_after_outcome_unblinding: true

support_lock:
  generated_from_metadata_and_frozen_traits_only: true
  must_record:
    - contract_sha256
    - metadata_sha256
    - trait_states_sha256
    - admitted_experiment_keys_sha256
    - support_counts
    - evaluable_primary_hypotheses
  frozen_commit_required_before_outcome_analysis: true
  placeholder_frozen_commit: REQUIRED_BEFORE_UNBLINDING
  outcome_status_before_analysis: unopened

rules:
  - post2015_validation_is_temporally_nonoverlapping_with_GloPL
  - metadata_screening_precedes_outcome_extraction
  - no_outcome_column_may_enter_preflight
  - no_threshold_relaxation_after_support_counts
  - no_trait_component_dropping_after_support_counts
  - shallow_open_tube_remains_in_H4b_even_if_weak_in_v13
  - exact_species_trait_matching_only
  - cohort_cannot_expand_after_support_lock_without_new_versioned_contract
  - outcome_rows_must_be_subset_of_locked_experiment_keys
  - parent_posthoc_H4_remains_posthoc
  - prospective_replication_does_not_establish_historical_mediation
  - prospective_replication_does_not_identify_pollinator_abundance_decline

claim_ceiling:
  trait_current_PL_functional_association_can_be_confirmatory_if_supported: true
  historical_pollen_limitation_selected_traits: false
  pollen_limitation_mediates_global_island_syndrome: false
  pollinator_abundance_decline_identified: false
  causal_trait_evolution_identified: false
