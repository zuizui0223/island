contract: chapter1_h5_channel_chain_v1
status: prospective_independent_channel_evidence_gate
purpose: >-
  Extend the Chapter 1 double geographic filter from the supported plant-side source/lineage
  filter to a separately measured pollinator-side chain without inferring pollinator mechanism
  from floral phenotype.

causal_chain:
  - source_channel_availability
  - island_retention_or_disruption
  - realized_visitation
  - single_visit_effectiveness
  - effective_service
  - residual_plant_response_after_H2_H4

unit_key:
  - system_id
  - island_id
  - channel_id

source_channel_states:
  - available
  - structurally_absent
  - unresolved

island_retention_states:
  - retained
  - disrupted
  - structurally_absent
  - unresolved

required_columns:
  - system_id
  - island_id
  - channel_id
  - source_channel_state
  - source_evidence_id
  - island_retention_state
  - retention_evidence_type
  - retention_evidence_id
  - observation_effort_flower_hours
  - visit_bouts
  - no_visit_control_present
  - mean_single_visit_conspecific_pollen
  - mean_no_visit_conspecific_pollen
  - evidence_scope

rules:
  source:
    - source_availability_must_be_outcome_blind
    - structural_absence_is_not_loss
    - source_state_requires_provenance
  retention:
    - retained_or_disrupted_requires_independent_evidence
    - climatic_compatibility_alone_cannot_define_disruption
    - floral_syndrome_cannot_define_retention_or_loss
  visitation:
    - zero_visitation_is_interpretable_only_with_positive_usable_effort
    - visit_rate_equals_visit_bouts_divided_by_monitored_flower_hours
  effectiveness:
    - positive_visitation_requires_single_visit_effectiveness_measurement
    - single_visit_effectiveness_requires_no_visit_control
    - zero_visitation_does_not_imply_zero_per_visit_effectiveness
  effective_service:
    - effective_service_equals_visit_rate_times_background_adjusted_single_visit_effectiveness
    - adequate_zero_visitation_can_identify_zero_realized_service_while_effectiveness_remains_not_applicable
    - missing_no_visit_control_with_positive_visitation_withholds_effective_service
  H5:
    - retained_vs_disrupted_contrast_requires_same_channel
    - structurally_absent_units_are_context_controls_not_loss_units
    - H5_promotion_requires_residual_plant_signal_beyond_H2_H4
    - null_or_adverse_results_do_not_trigger_posthoc_threshold_changes

single_visit_effectiveness:
  metric: conspecific_pollen_grains_per_single_visit
  background_adjustment: mean_single_visit_conspecific_pollen_minus_mean_no_visit_conspecific_pollen

contrast_readiness:
  minimum_states_for_channel_contrast:
    - retained
    - disrupted
  require_effective_service_estimable_in_both_states: true
  require_at_least_one_positive_visit_full_link_unit: true

claim_ceiling:
  - chain_completion_is_not_historical_loss_proof
  - occurrence_is_not_visitation
  - visitation_is_not_effectiveness
  - effectiveness_is_not_reproductive_dependency
  - effective_service_is_not_historical_selection
  - structural_absence_is_not_deficit
  - pollination_syndrome_is_not_channel_identity
