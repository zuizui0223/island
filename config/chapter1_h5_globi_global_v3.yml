contract: chapter1_h5_globi_global_v3
status: frozen_before_global_outcome_inspection
purpose: >-
  Extend the outcome-blind GloBI genus-breadth predictor to the same four analysis
  regimes used by the redesigned Chapter 1 H1-H3 ladder. The broad all-observed layer
  is a contemporary-flora association only; source-backed native strata remain the
  biological safeguard for native assembly interpretation.

predictor_contract: chapter1_globi_source_breadth_v2
response_metric: effective_channel_number
response_outcome: entry_enrichment
reference_thresholds: [2, 3, 5]
primary_reference_threshold: 3
source_modes: [geo_k5, geo_k10, geo_k20, geo50_climate10]
primary_source_matching: prevalence_richness_effort
sensitivity_source_matching: prevalence_richness
minimum_represented_genera: 5

flora_scopes:
  primary: all_observed
  sensitivities: [all_native, native_nonendemic]

contexts:
  - northern_midlatitude
  - northern_high_latitude
  - tropical
  - southern_extratropical

model:
  response: source_matched_GloBI_genus_entry_enrichment
  predictors:
    - climate_pc1
    - climate_pc2
    - climate_pc3
    - climate_pc4
    - log_distance_to_continent_km
    - log_island_area_km2
    - log_distance_to_continent_km:log_island_area_km2
  island_weight: equal
  cluster_column: spatial_block
  confirmatory_min_islands: 50
  pilot_min_islands: 30

hypotheses:
  G1_universal_breadth_filter:
    question: >-
      Do genera with broader independently documented flower-interaction channels become
      increasingly represented with island isolation across all four contexts?
    prediction: positive_distance_slope_in_each_context
    promotion_rule: >-
      At the primary threshold and source-matching scheme, all four source definitions
      must be positive and FDR-supported within every confirmatory context. Sensitivity
      thresholds may not reverse sign.
  G2_context_heterogeneity:
    question: >-
      Does the isolation-breadth association differ among the four biogeographic contexts?
    test: joint_cluster_robust_Wald_of_equal_context_distance_slopes
  G3_small_island_amplification:
    question: >-
      Is any breadth filter stronger on smaller islands?
    prediction: negative_distance_by_area
    promotion_rule: >-
      A context-specific small-island interpretation requires negative and FDR-supported
      distance-by-area coefficients across all four source definitions at the primary
      threshold, with no sign reversal at thresholds 2 or 5.
  G4_moderation_heterogeneity:
    question: >-
      Does distance-by-area moderation itself differ among the four contexts?
    test: joint_cluster_robust_Wald_of_equal_context_distance_by_area_coefficients

multiplicity:
  within_context: BH_across_four_source_modes_within_scope_x_matching_x_threshold_x_context_x_term
  global_heterogeneity: BH_across_four_source_modes_within_scope_x_matching_x_threshold_x_test
  alpha: 0.05

claim_ceiling:
  all_observed_is_native_assembly: false
  GloBI_breadth_is_true_specialization: false
  broad_source_matching_identifies_historical_source: false
  pollinator_loss_identified: false
  effective_service_identified: false

rules:
  - predictor_remains_identical_to_frozen_GloBI_v2
  - missing_GloBI_is_missing_not_specialist
  - source_matching_controls_prevalence_richness_and_reference_effort
  - equal_island_weight_primary
  - all_observed_result_is_observational_only
  - native_strata_reported_separately
  - direct_context_heterogeneity_test_required
  - no_pollinator_identity_from_floral_traits
