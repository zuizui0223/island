contract: chapter1_h5_multichannel_two_route_v1
status: posthoc_independent_falsification_bridge
purpose: >-
  Test whether reduced retention of source-available pollination functional channels is
  associated with two partially separable plant responses: reproductive assurance and
  pollinator-facing floral architecture. This bridge pools Bombus, non-Bombus bees,
  Lepidoptera, flower-visiting birds and Diptera rather than privileging Bombus.

claim_boundary:
  - channel disruption is source-available plus effort-qualified adequate non-detection
  - channel disruption is not temporal decline, historical extinction, abundance decline, visitation loss, or service loss
  - detected means potential channel retention, not effective pollination service
  - this posthoc bridge can falsify a simple global mechanism but cannot promote causation

channels:
  - bombus
  - non_bombus_bees
  - lepidoptera
  - flower_visiting_birds
  - diptera

symmetric_effort_gate:
  min_background_records: 50
  min_background_spatial_units: 3
  min_background_temporal_units: 2
  min_distinct_datasets: 2
  reference_year: 2026
  max_years_since_latest_background: 20
  rationale: >-
    A retained channel is included in the retained-versus-disrupted comparison only if
    the same background-effort gate required to call a non-detection is also satisfied.
    This avoids comparing high-effort non-detections against low-effort detections.

composite_exposure:
  primary: any_effort_qualified_source_available_channel_disrupted
  primary_min_evaluable_channels: 2
  sensitivity_min_evaluable_channels: [1, 3]
  adjust_for:
    - n_evaluable_channels
    - channel_specific_evaluable_indicators

plant_routes:
  reproductive_assurance:
    primary_response: selfing_core
    secondary_response: selfing_syndrome
    predicted_disruption_direction: positive
  pollinator_facing_architecture:
    primary_response: generalized_accessible
    predicted_disruption_direction: positive
    conditional_test: generalized_accessible ~ disruption + selfing_core + controls
    secondary_shared_architecture:
      definition: mean_of_large_bee_like_butterfly_like_bird_like_requiring_all_three
      predicted_disruption_direction: negative
      role: posthoc_common_architecture_summary_after_identity_specificity_failure
    legacy_attraction_shift:
      definition: (-large_bee_like + generalized_accessible) / 2
      role: northern_interpretive_sensitivity_only

models:
  primary_contexts: [northern_midlatitude, tropical]
  descriptive_contexts: [northern_high_latitude, northern_midlatitude, tropical, southern_extratropical]
  context_column: analysis_regime
  cluster_column: spatial_block
  controls:
    - log_distance_to_continent_km
    - log_island_area_km2
    - climate_pc1
    - climate_pc2
    - climate_pc3
    - climate_pc4
  primary_flora_scope: all_observed
  native_sensitivity_scopes: [all_native, native_nonendemic]

primary_decision:
  evidence_scope: direct_only
  min_evaluable_channels: 2
  require_each_primary_context_disrupted_n: 10
  require_each_primary_context_retained_n: 10
  fdr_alpha: 0.05
  global_two_route_support_requires:
    - selfing_core positive in both primary contexts
    - generalized_accessible conditional on selfing_core positive in both primary contexts
    - all four primary tests FDR supported
  failure_interpretation: >-
    Failure rejects promotion of a simple pooled pollinator-channel-disruption two-route
    mechanism from the current global occurrence data; it does not show that pollinators
    are irrelevant or that no channel-specific/local mechanism exists.
