contract: chapter1_h5c_pollination_mode_specificity_qualification_v1

source_trait:
  trait_name: pollen_vector_mode
  allowed_modes: [biotic, abiotic_wind]
  exclude_modes: [mixed, unresolved]
  conflicting_species: exclude
  missing_is_not_wind: true
  phenotype_inference_forbidden: true

focal_response:
  syndrome: generalized_accessible
  response_values_open_during_qualification: false
  species_eligibility_only: true

contexts:
  - context_layer: biogeographic_realm
    context: Palearctic
  - context_layer: analysis_regime
    context: tropical

strata: [all_native, native_nonendemic]
evidence_scopes: [all_analysis_eligible, direct_only]

support_gate:
  minimum_islands_per_mode: 50
  minimum_spatial_blocks_per_mode: 10
  minimum_species_per_island_mode: 1

simulation:
  replicates: 250
  seed: 20260914
  interaction_effect_sd_grid: [0.0, 0.25, 0.5, 0.75]
  cluster_random_effect_sd: 0.25
  residual_sd: 1.0
  alpha: 0.05
  information_weight: n_species

qualification:
  maximum_type1_error: 0.10
  target_effect_sd: 0.5
  minimum_target_recovery: 0.80
  observed_test_may_open_only_if_qualified: true

claim_ceiling: >-
  Qualification establishes only whether the realized design can distinguish a
  prespecified distance-by-independent-pollination-mode interaction. It does not
  inspect or estimate the observed interaction, identify pollinator loss, or reopen N1/N2.
