contract: chapter1_nee_channel_inputs_v1
parent_contract: chapter1_nee_double_filter_v1
status: pre_N1_input_qualification

channels:
  - bombus
  - non_bombus_bees
  - lepidoptera
  - flower_visiting_birds
  - diptera

source_states:
  - available
  - structurally_absent
  - unresolved

observation_states:
  - detected
  - adequate_non_detection
  - insufficient_effort
  - unresolved

projected_states:
  - retained
  - disrupted
  - structurally_absent
  - unresolved

projection_rules:
  structurally_absent_precedes_island_observation: true
  source_unresolved_yields_unresolved: true
  available_plus_detected: retained
  available_plus_adequate_non_detection: disrupted
  available_plus_insufficient_effort: unresolved
  available_plus_unresolved: unresolved
  island_non_detection_cannot_create_structural_absence: true
  detected_record_cannot_be_downgraded_by_low_background_effort: true

required_source_columns:
  - island_id
  - source_region_id
  - channel_id
  - source_state
  - evidence_id
  - evidence_type
  - source_citation
  - source_url
  - review_status

required_observation_columns:
  - island_id
  - channel_id
  - observation_state
  - channel_record_count
  - background_record_count
  - background_spatial_units
  - background_temporal_units
  - distinct_dataset_count
  - latest_background_year
  - evidence_source
  - quality_flags

review_status:
  accepted: accepted
  pending: pending
  rejected: rejected
  only_accepted_source_rows_can_create_available_or_structurally_absent: true

support_tiers:
  pilot:
    min_evaluable_source_available_islands: 30
    min_retained: 3
    min_disrupted: 3
    min_source_regions: 1
  confirmatory:
    min_evaluable_source_available_islands: 50
    min_retained: 5
    min_disrupted: 5
    min_source_regions: 2
  N1_gate_eligible_tier: confirmatory
  data_quality_failure_if_below_pilot: true
  channel_exclusion_is_recorded_not_silent: true

bombus_adapter:
  source_input: outcome_blind_bombus_applicability
  source_mapping:
    applicable: available
    structurally_not_applicable: structurally_absent
    unresolved: unresolved
  source_requires_both_reviews_accepted: true
  observation_input: recency_aware_bombus_occurrence_evidence
  observation_mapping:
    detected: detected
    adequate_non_detection: adequate_non_detection
    insufficient_effort: insufficient_effort
    unresolved: unresolved
  fixed_target_group: Apidae
  fixed_diagnostic_policy: config/bombus_observation_diagnostics.yml
  climate_compatibility_not_used_for_state_projection: true

other_channel_policy:
  no_generic_zero_as_absence: true
  each_channel_requires_predeclared_background_effort_definition: true
  provider_specific_raw_tables_must_be_normalized_before_projection: true
  floral_architecture_cannot_supply_source_or_observation_state: true

qualification_receipt:
  report_per_channel:
    - n_rows
    - n_source_available
    - n_structurally_absent
    - n_source_unresolved
    - n_retained
    - n_disrupted
    - n_observation_unresolved
    - n_evaluable_source_available
    - n_source_regions
    - support_tier
    - N1_gate_eligible
    - exclusion_reason
