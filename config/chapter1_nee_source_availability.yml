contract: chapter1_nee_source_availability_v1
parent_contracts:
  - chapter1_nee_double_filter_v1
  - chapter1_nee_channel_inputs_v1
  - chapter1_nee_channel_taxon_catalog_v1
status: prospective_pre_source_occurrence

channels:
  - bombus
  - non_bombus_bees
  - lepidoptera
  - flower_visiting_birds
  - diptera

review_status:
  accepted: accepted
  pending: pending
  rejected: rejected

assignment:
  required_columns:
    - island_id
    - source_region_id
    - review_status
  accepted_assignment_required_for_decisive_state: true
  missing_or_nonaccepted_assignment: unresolved
  no_island_occurrence_used_to_choose_source_region: true

positive_evidence:
  required_columns:
    - source_region_id
    - pollinator_species
    - evidence_id
    - evidence_type
    - source_citation
    - source_url
    - review_status
  accepted_types:
    - curated_native_distribution
    - curated_regional_checklist
    - quality_filtered_source_region_occurrence
  target_taxa: confirmatory_channel_catalog_only
  one_accepted_positive_record_is_sufficient_for_available: true
  positive_evidence_never_requires_zero_absence_effort: true

structural_absence_evidence:
  required_columns:
    - source_region_id
    - channel_id
    - evidence_id
    - evidence_type
    - source_citation
    - source_url
    - review_status
  accepted_types:
    - curated_explicit_biogeographic_absence
    - authoritative_native_range_exclusion
  prohibited_types:
    - zero_GBIF_records
    - island_non_detection
    - climate_unsuitability_only
    - floral_trait_inference
  accepted_review_required: true

conflict_policy:
  positive_and_structural_absence_for_same_source_channel: unresolved_conflict
  no_silent_precedence: true
  conflict_blocks_confirmatory_N1_use: true

resolution:
  positive_only: available
  structural_absence_only: structurally_absent
  neither: unresolved
  conflict: unresolved

output:
  one_row_per_island_x_channel: true
  required_columns:
    - island_id
    - source_region_id
    - channel_id
    - source_state
    - evidence_id
    - evidence_type
    - source_citation
    - source_url
    - review_status
  unresolved_review_status: pending
  evidence_aggregation: preserve_all_evidence_ids_and_citations_pipe_delimited

independence:
  focal_plant_traits_used: false
  island_channel_observation_used: false
  N1_outcome_used: false
  source_assignment_must_preexist_channel_state: true
