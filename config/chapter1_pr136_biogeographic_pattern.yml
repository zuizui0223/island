contract: chapter1_pr138_biogeographic_pattern_v2

primary_question: >-
  Does the observed floral island syndrome strengthen with mainland distance in northern
  mid-latitude island floras, and does that distance-response vector differ from tropical
  and southern island floras?

pattern_hypotheses:
  northern_classic_island_syndrome:
    prediction: >-
      With increasing mainland distance, northern mid-latitude island floras show an
      assemblage-level shift toward less conspicuous / plainer flowers, more generally
      accessible floral architecture, and greater reproductive assurance.
  tropical_southern_nonconvergence:
    prediction: >-
      Tropical and southern island floras do not have to reverse the northern vector,
      but they should not converge as strongly on the same classic island-syndrome vector;
      conspicuous and specialized floral states may instead be retained.
    reversed_vector_required: false

geography_column: log_distance_to_continent_km
geography_interpretation: composite_isolation_connectivity_source_supply_assembly_gradient
context_column: analysis_regime
cluster_column: spatial_block
baseline_covariates:
  - log_island_area_km2
  - climate_pc1
  - climate_pc2
  - climate_pc3
  - climate_pc4

contexts:
  - northern_midlatitude
  - northern_high_latitude
  - tropical
  - southern_extratropical

strata:
  - all_native
  - native_nonendemic
  - endemic

support_tiers:
  confirmatory: 50
  pilot: 30
minimum_outcomes_per_vector: 2
alpha: 0.05

# Broad contrasts are frozen before looking at their PR138 model coefficients.
# Boundary / mixed states that do not lie wholly on one side of a contrast fail closed.
broad_outcomes:
  plain_colour:
    trait_name: flower_primary_color
    positive_states: [white, green_brown_inconspicuous]
    negative_states: [yellow_orange, red_pink, blue_purple]
    northern_classic_direction: 1
  generalized_form:
    trait_name: floral_form
    positive_states: [open_radial, brush_puff, composite_head]
    negative_states:
      [tubular, bell_campanulate, funnel_trumpet, urn_urceolate, bilabiate,
       salverform, papilionaceous, spurred]
    northern_classic_direction: 1
  self_compatibility:
    trait_name: self_incompatibility
    positive_states: [SC]
    negative_states: [SI]
    northern_classic_direction: 1
  actinomorphic_symmetry:
    trait_name: floral_symmetry
    positive_states: [actinomorphic]
    negative_states: [zygomorphic]
    northern_classic_direction: 1
  small_flower:
    trait_name: flower_size_class
    positive_states: [very_small, small]
    negative_states: [large, very_large]
    northern_classic_direction: 1
  shallow_open_tube:
    trait_name: tube_depth_class
    positive_states: [absent_or_open, shallow]
    negative_states: [deep]
    northern_classic_direction: 1
  selfing_mating_system:
    trait_name: mating_system
    positive_states: [predominantly_selfing, obligate_selfing]
    negative_states: [predominantly_outcrossing]
    northern_classic_direction: 1
  autonomous_selfing:
    trait_name: autonomous_selfing_capacity
    positive_states: [autonomous, delayed]
    negative_states: [absent]
    northern_classic_direction: 1

inferential_layers:
  primary: observed_native_flora_broad_syndrome_composition
  secondary: genus_fixed_residual_decomposition
  discussion: pollination_syndrome_concordance

pollinator_predictors_in_primary_model: false
bombus_role: discussion_candidate_mechanism_only
butterfly_role: discussion_candidate_mechanism_only
bird_role: discussion_candidate_mechanism_only

rules:
  - all_islands_retained_in_observation_universe
  - no_distance_thresholds
  - missing_island_is_not_trait_zero
  - multistate_species_crossing_positive_and_negative_sets_are_unresolved_for_broad_binary
  - significant_in_one_region_and_nonsignificant_in_another_is_not_heterogeneity
  - between_region_vector_difference_requires_direct_joint_test
  - northern_classic_syndrome_requires_directional_multivariate_projection_not_single_trait_significance
  - tropical_and_southern_predictions_do_not_require_exact_reversal
  - genus_fixed_results_decompose_the_observed_pattern_but_do_not_define_whether_an_assemblage_pattern_exists
  - discuss_pollination_syndromes_only_after_the_biogeographic_pattern_is_established
