version: "1.0"

priority_strata:
  - all_native
  - native_nonendemic

minimum_outcomes_per_stratum: 2
context_column: analysis_regime
geography_column: log_distance_to_continent_km
distance_bins: 4
wave_size_per_context_distance_bin: 15

rules:
  unresolved_only: true
  use_trait_values: false
  use_residual_effect_direction: false
  use_p_values: false
  use_pollination_syndrome_match: false
  balance_by_context_and_distance: true

interpretation: >-
  This queue prioritizes source-region/applicability curation among unresolved islands
  that already have genus-fixed response support. It determines what to review next,
  never what the source-channel state should be.
