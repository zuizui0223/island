contract: chapter1_species_sorting_identifiability_v1
status: design_refined_before_formal_result_inspection
inferential_role: species_level_source_pool_sorting_and_within_lineage_identifiability_audit

question: >-
  Does the source-evaluable portion of current H1 arise because source-available
  species with particular trait states are differentially represented on islands,
  and can the current data distinguish that species sorting from within-species
  trait change?

scope:
  contexts:
    - northern_midlatitude
    - northern_high_latitude
    - tropical
    - southern_extratropical
  floristic_status: native_nonendemic
  evidence_scopes:
    - all_analysis_eligible
    - direct_only

source_pool:
  source_modes: [geo_k5, geo_k10, geo_k20, geo50_climate10]
  species_matching: unique_exact_then_unique_binomial
  matching_for_expectation: source_species_prevalence
  rule: >-
    For each island, outcome and source mode, observed source-candidate species are
    compared with all trait-resolved source-available species after matching on the
    number of assigned source entities in which each species occurs.

atomic_outcomes:
  - self_compatibility
  - selfing_mating_system
  - autonomous_selfing
  - plain_colour
  - generalized_form
  - actinomorphic_symmetry
  - shallow_open_tube

additive_decomposition:
  raw_h1_mean: mean_binary_state_among_observed_source_candidate_species
  source_species_expectation: >-
    Mean source-pool trait state expected after preserving the observed number of
    island species in each source-prevalence class, without fixing genus identity.
  represented_genus_species_expectation: >-
    Mean source-pool trait state expected after preserving, for every observed
    species slot, both its represented genus and source-prevalence class.
  genus_species_structure_enrichment: >-
    represented_genus_species_expectation_minus_source_species_expectation
  within_genus_species_sorting_enrichment: >-
    raw_h1_mean_minus_represented_genus_species_expectation
  total_species_sorting_enrichment: raw_h1_mean_minus_source_species_expectation
  identity: >-
    raw_h1_mean = source_species_expectation +
    genus_species_structure_enrichment +
    within_genus_species_sorting_enrichment
  identity_tolerance: 1.0e-12

model:
  family: equal_island_OLS
  predictors:
    - log_distance_to_continent_km
    - log_island_area_km2
    - climate_pc1
    - climate_pc2
    - climate_pc3
    - climate_pc4
  covariance: spatial_block_cluster_robust
  geography: corrected_20260924_spherical_coastline
  minimum_islands_per_outcome: 50
  minimum_outcomes_per_vector: 2

multiplicity:
  source_mode_family: BH_FDR_across_four_source_modes_within_context_evidence_component
  alpha: 0.05

identifiability:
  current_trait_unit: accepted_species
  required_for_within_species_change:
    - population_or_locality_identifier
    - island_vs_source_population_role
    - population_specific_trait_state
  rule: >-
    If the active trait-state input has only one trait state per accepted species
    and no population/location dimension, the within-species term is structurally
    unidentifiable and must not be set to zero or interpreted as no evolution.

claim_ceiling:
  genus_species_structure_is_assemblage_filtering: true
  within_genus_species_sorting_is_assemblage_filtering: true
  total_species_sorting_is_assemblage_filtering: true
  species_sorting_identifies_colonisation_vs_extinction: false
  within_species_change_estimable_from_current_H1: false
  within_species_change_zero: false
  within_lineage_evolution_identified: false

rules:
  - no_new_trait_recoding
  - no_post_result_threshold_tuning
  - all_four_source_modes_reported
  - source_evaluable_support_only
  - exact_additive_identity_must_pass
  - support_limited_contexts_remain_not_testable
  - population_specific_evidence_required_before_any_evolution_claim
