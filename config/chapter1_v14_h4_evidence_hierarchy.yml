contract: chapter1_v14_h4_evidence_hierarchy_v1
date: 2026-09-18
status: v14_H4_posthoc_functional_bridge

question: >-
  Are the mechanistically interpretable H2 response families associated with lower
  current experimental pollen limitation, and how independently has that association
  been tested?

evidence_layers:
  v13_exact_species_discovery:
    role: posthoc_functional_triangulation
    source_lock: config/chapter1_v13_functional_bridge_result_lock.json
    strongest_result:
      trait: autonomous_selfing
      beta: -0.446724
      two_sided_p: 2.600385e-08
    interpretation: discovery_not_confirmatory_validation

  v14_exact_H2_score_discovery:
    role: posthoc_exact_H2_score_functional_triangulation
    config: config/chapter1_v14_h4_exact_h2_score_bridge.yml
    local_reproduction_lock: config/chapter1_v14_h4_exact_h2_score_bridge_preflight_result_lock.json
    reproductive_assurance:
      score: exact_Direct_only_selfing_core_soft_membership
      beta: -0.29706162790382573
      two_sided_p: 0.004114773773355803
      supplemental_only_two_sided_p: 0.3132511023834126
      no_zero_constant_two_sided_p: 0.00402610677021115
    accessibility_generalization:
      score: exact_Direct_only_generalized_accessible_soft_membership
      beta: -0.2960123452279311
      two_sided_p: 0.022162544686764193
      supplemental_only_two_sided_p: 0.03842197114842902
      no_zero_constant_two_sided_p: 0.019718960134721204
      no_zero_constant_one_sided_negative_p: 0.009859480067360602
    interpretation: >-
      The exact H2 species-level scores used in Chapter 1 are negatively associated
      with current GloPL pollen limitation in the post-hoc discovery layer. This is the
      primary family-aligned H2-to-H4 bridge.

  v14_atomic_reconstruction_sensitivity:
    role: posthoc_atomic_family_reconstruction_sensitivity
    config: config/chapter1_v14_h4_family_bridge.yml
    local_reproduction_lock: config/chapter1_v14_h4_family_bridge_preflight_result_lock.json
    reproductive_assurance:
      beta: -0.3125493709156215
      two_sided_p: 0.0022214702949586752
    H2_weighted_accessibility_reconstruction:
      beta: -0.32932085948526735
      two_sided_p: 0.005145682811813261
      supplemental_only_two_sided_p: 0.036684787324208254
      no_zero_constant_two_sided_p: 0.003615783662185665
    equal_weight_H4b_reconstruction:
      beta: -0.32508511465279266
      two_sided_p: 0.006356184144918508
    interpretation: >-
      Reconstructing comparable family scores directly from the frozen H4 parent atomic
      states gives concordant results, but these scores are a sensitivity rather than
      the literal H2 species scores.


colour_bridge:
  primary_global_test: false
  reason: >-
    The H1/H2 colour response is context dependent and does not imply one globally
    directional trait-to-pollen-limitation prediction. Colour remains part of H1 and
    H2 display/architecture decomposition rather than being forced into H4.

rules:
  - keep_v13_discovery_posthoc
  - H4_does_not_establish_historical_mediation
  - do_not_add_global_colour_bridge_without_directional_functional_prediction

claim_ceiling:
  historical_pollen_limitation_selected_traits: false
  pollen_limitation_mediates_global_syndrome: false
  named_pollinator_mechanism_identified: false

validation_audit:
  role: supplementary_nonpromoted_validation_audit
  part_of_H4_result: false
  summary_lock: config/chapter1_h4_prospective_validation_summary_lock.json
  wild_temporal:
    status: support_gate_not_met_not_evaluable
    outcomes_unblinded: false
  pollimcrop:
    status: support_gate_not_met_not_evaluable
    outcomes_unblinded: false
    admitted_hypotheses: []
  rules:
    - support_failure_is_not_biological_null
    - external_domain_transportability_is_not_wild_temporal_replication
    - threshold_relaxation_not_authorized
  prospective_wild_replication_supported: false
  interpretation: >-
    The prospective attempts are retained for transparency about the confirmatory
    evidence boundary. They do not alter, promote, downgrade, or enter the H4 result.
