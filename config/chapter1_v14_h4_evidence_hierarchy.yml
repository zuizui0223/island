contract: chapter1_v14_h4_evidence_hierarchy_v1
date: 2026-09-18
status: v14_candidate_evidence_roles

question: >-
  Are the mechanistically interpretable H2 response families associated with lower
  current experimental pollen limitation, and how independently has that association
  been tested?

co_primary_functional_predictions:
  H4a_reproductive_assurance:
    predictor: autonomous_selfing
    prediction: lower_current_pollen_limitation
  H4b_accessibility_generalization:
    predictor: equal_weight_accessibility_generalization
    components:
      - generalized_form
      - actinomorphic_symmetry
      - shallow_open_tube
    prediction: lower_current_pollen_limitation

evidence_layers:
  v13_exact_species_discovery:
    role: posthoc_functional_triangulation
    source_lock: config/chapter1_v13_functional_bridge_result_lock.json
    strongest_result:
      trait: autonomous_selfing
      beta: -0.446724
      two_sided_p: 2.600385e-08
    interpretation: discovery_not_confirmatory_validation

  v14_H2_family_aligned_discovery:
    role: posthoc_family_aligned_functional_triangulation
    config: config/chapter1_v14_h4_family_bridge.yml
    local_reproduction_lock: config/chapter1_v14_h4_family_bridge_preflight_result_lock.json
    reproductive_assurance:
      score: H2_exact_selfing_core_equivalent
      beta: -0.3125493709156215
      two_sided_p: 0.0022214702949586752
      supplemental_only_two_sided_p: 0.14783151183776336
      no_zero_constant_two_sided_p: 0.0022886371211373775
    accessibility_generalization:
      score: H2_exact_weighted_generalized_accessible
      beta: -0.32932085948526735
      two_sided_p: 0.005145682811813261
      supplemental_only_two_sided_p: 0.036709300338101124
      no_zero_constant_two_sided_p: 0.013368489636637889
    equal_weight_H4b_sensitivity:
      beta: -0.32508511465279266
      two_sided_p: 0.006356184144918508
    interpretation: >-
      Both H2 response families point toward lower current pollen limitation in the
      post-hoc discovery layer. Accessibility/generalization is robust to both frozen
      measurement sensitivities. This improves H2-to-H4 alignment but is not prospective
      validation.

  prospective_post2015_wild:
    role: prospectively_frozen_temporal_validation_attempt
    source_pr: 236
    status: support_gate_not_met_not_evaluable
    H4a_support_ceiling:
      matched_species: 9
      publications: 6
    H4b_support_ceiling:
      matched_species: 9
      publications: 4
    frozen_minimum:
      matched_species: 30
      publications: 10
    outcomes_unblinded_for_primary_test: false
    interpretation: support_failure_not_biological_null

  pollimcrop_independent_domain:
    role: prospectively_frozen_secondary_transportability
    source_pr: 236
    dataset: PolLimCrop
    outcome_domain_independent_of_v13_GloPL: true
    status: pending_support_gated_execution
    can_rescue_wild_temporal_support_failure: false
    can_make_v13_wild_discovery_confirmatory: false

colour_bridge:
  primary_global_test: false
  reason: >-
    The H1/H2 colour response is context dependent and does not imply one globally
    directional trait-to-pollen-limitation prediction. Colour remains part of H1 and
    H2 display/architecture decomposition rather than being forced into H4.

rules:
  - keep_v13_discovery_posthoc
  - support_failure_is_not_biological_null
  - external_domain_transportability_is_not_wild_temporal_replication
  - H4_does_not_establish_historical_mediation
  - do_not_add_global_colour_bridge_without_directional_functional_prediction

claim_ceiling:
  historical_pollen_limitation_selected_traits: false
  pollen_limitation_mediates_global_syndrome: false
  prospective_wild_replication_supported: false
  named_pollinator_mechanism_identified: false
