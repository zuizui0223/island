version: "1.1"

baseline_covariates:
  - log_island_area_km2
  - climate_pc1
  - climate_pc2
  - climate_pc3
  - climate_pc4

cluster_column: spatial_block
canonical_context_column: analysis_regime
canonical_distance_column: distance_to_continent_km
canonical_gradient_column: log_distance_to_continent_km

contexts:
  - northern_midlatitude
  - northern_high_latitude
  - tropical
  - southern_extratropical

strata:
  - all_native
  - native_nonendemic
  - endemic

support_tiers:
  confirmatory: 50
  pilot: 30

# All scenarios retain the full island universe. Distance truncation is forbidden:
# distance is itself the focal geographic gradient and can encode both dispersal
# limitation and accessibility to the mainland/source species pool.
scenarios:
  - name: all_islands_log1p_distance
    distance_form: log1p

  - name: all_islands_sqrt_distance
    distance_form: sqrt

  - name: all_islands_raw_distance
    distance_form: raw

interpretation:
  rule: >-
    These are functional-form robustness checks on the same full island universe.
    No minimum-distance, oceanic-island, zero-distance, or other distance threshold
    is permitted. The distance-to-continent gradient is not interpreted as a pure
    causal isolation treatment: it can jointly represent dispersal limitation and
    changing accessibility to a mainland/source species pool.
  source_pool_boundary: >-
    A distance effect must therefore be described as geographic filtering along a
    mainland-distance/source-pool-accessibility gradient unless source-pool
    composition or accessibility is separately identified. Do not control away a
    source-pool pathway and then call the residual coefficient the total effect of
    geographic isolation.

pollinator_boundary:
  primary_predictors_allowed: false
  rule: >-
    Pollinator variables remain excluded from the when/where tests and enter only
    after the geographic result is frozen.
