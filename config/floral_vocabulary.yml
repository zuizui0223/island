version: "1.0"

# The floral colour vocabulary and organ discipline, shared by every acquisition
# lane.
#
# This file exists because the rules below are only worth anything if the lanes
# agree on them. Protologue mining and specimen-label mining feed the same
# candidate ledger and the same reviewer, so a colour word that is evidence in
# one lane and invisible in the other is not two policies -- it is one policy
# applied inconsistently. That is not hypothetical: the label lane was written
# with thirty English colour words and no boundary guard while the protologue
# lane grew to 255 terms across nine languages, and the two drifted until the
# same sentence produced different answers.
#
# Two constraints shape everything here.
#
# 1. Multilingual by requirement, not preference. In the WFO rejection ledger
#    the one automatically recoverable slice (8.8%) was non-English statements
#    that English-only rules had failed to bind, and a third of the first frozen
#    review ledger was Japanese sources an English-and-Latin vocabulary read as
#    having no colour at all.
#
# 2. Organ attachment, for the same measured reason: 38.6% of WFO rejections
#    were a style, calyx or fruit value being read as a whole-flower value. A
#    statement reading "fructus ruber" is not flower colour, on a printed page
#    or on a collector's label.
#
# What is deliberately NOT here: how wide the organ window is, and what voids a
# statement. Both are lane-specific and stay in the lane's own config.
# Protologue prose needs a wider window than a label written in the field, and a
# collector's "sterile" means there was nothing to observe while a protologue's
# "flores steriles" is a description of the floret.

# Matching is on folded text -- lowercased, diacritics stripped, ss for eszett,
# Japanese voicing marks preserved -- and every term is matched at word
# boundaries where its script has them. Boundaries are not optional: substring
# matching reads "rotundifolia" as German "rot", "albacea" as Latin "alba" and
# "reduced" as English "red". Japanese and Chinese need the opposite, because
# those scripts do not separate words at all.
#
# Terms are enumerated in full rather than stemmed, except in Latin, which
# inflects in a small closed set of endings.

