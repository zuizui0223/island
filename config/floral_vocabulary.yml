# When a description names colours mapping to different ontology values --
# "corolla alba demum rosea" -- the species is not given a single primary
# colour. The row is retained as variable rather than resolved to the first hit.
multiple_value_result: multicolored_variable

# The plain / non-plain line the analysis actually models. Declared here rather
# than imported so acquisition stays free of the analysis dependency chain; a
# test asserts it still equals the definition in status_category_decomposition.
plain_colour_values:
  - white
  - green_brown_inconspicuous

# Several ontology values written as one hue -- "pale reddish purple" -- is not
# the same claim as a corolla that changes colour, so it gets its own value. The
# reviewer's frozen call on exactly that phrase was that the five-value ontology
# cannot decide it while the binary plain/non-plain class can.
compound_hue_result: ontology_unresolved

# Words that may sit between two colour words without separating them. English
# puts its intensity word in front ("pale reddish purple") but Japanese puts it
# between (紫がかった濃いピンク色 -- "deep pink with a purple tinge"), so the gap
# rule needs them or it reads one hue as a corolla that changes colour.
#
# A bare range marker is deliberately absent. "Corolla white shading to pink" is
# one gradient, but "corolla white to pink" is a population that produces both,
# which is variability and not a hue the ontology merely cannot name. Listing
# "to" on its own would collapse the second onto the first.
compound_gap_terms:
  - pale
  - light
  - dark
  - deep
  - bright
  - dull
  - tinged
  - shading to
  - suffused with
  - がかった
  - がかつた
  - をおびた
  - を帯びた
  - っぽい
  - つぽい
  - みの
  - 濃い
  - 淡い
  - 薄い
  - やや

# Periods that abbreviate rather than end a sentence. "fl. pink" is one floral
# statement; split on that period the colour has no organ in its segment.
#
# The list is dominated by collectors' shorthand because a specimen label is
# written almost entirely in it, but nothing here is label-only: a protologue
# carrying "det." or "infl." wants the same treatment, and an abbreviation that
# never appears simply never masks anything.
