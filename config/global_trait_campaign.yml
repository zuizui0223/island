version: "2.0"
default_batch_size: 1000
max_attempts: 6
scope_config_path: config/angiosperm_scope.yml
expected_species: 106295

# Primary objective: obtain direct evidence for all three selfing-syndrome axes.
# A species remains in the direct-acquisition queue until colour vividness,
# floral complexity, and reproductive assurance each have at least one direct
# or synonym-direct source-backed observation. Repeated passes are allowed.
primary_axes:
  colour_vividness:
    target_traits:
      - flower_primary_color
  floral_complexity:
    target_traits:
      - floral_form
      - floral_symmetry
      - tube_depth_class
      - flower_size_class
      - inflorescence_display
  reproductive_assurance:
    target_traits:
      - self_incompatibility
      - autonomous_selfing_capacity
      - mating_system
      - cleistogamy

primary_completion:
  require_all_axes: true
  accepted_direct_tiers:
    - species_direct
    - synonym_direct
  repeat_until_complete: true
  max_rounds: 6

# Public and database descriptions are treated identically when they contain a
# source URL/record ID and an explicit species-level excerpt. Source class does
# not lower evidence scope.
wikipedia_languages:
  - en
  - es
  - fr
  - de
  - pt
  - it

task_order:
  - colour_wikimedia
  - complexity_wikimedia
  - reproduction_wikimedia
  - reproduction_openalex

reopen_not_applicable_tasks: []

tasks:
  colour_wikimedia:
    phase: colour_vividness
    source_kind: wikimedia_web_reported
    eligibility: all
    depends_on: []
    pause_seconds: 0.05
    max_retries: 4
    keyword_config: config/global_floral_access_keywords.yml
    target_traits:
      - flower_primary_color

  complexity_wikimedia:
    phase: floral_complexity
    source_kind: wikimedia_web_reported
    eligibility: all
    depends_on: []
    pause_seconds: 0.05
    max_retries: 4
    keyword_config: config/global_floral_access_keywords.yml
    target_traits:
      - floral_form
      - floral_symmetry
      - tube_depth_class
      - flower_size_class
      - inflorescence_display

  reproduction_wikimedia:
    phase: reproductive_assurance
    source_kind: wikimedia_reported_ecology
    eligibility: all
    depends_on: []
    pause_seconds: 0.05
    max_retries: 4
    target_traits:
      - self_incompatibility
      - autonomous_selfing_capacity
      - mating_system
      - cleistogamy

  reproduction_openalex:
    phase: reproductive_assurance
    required_for_primary_completion: false
    source_kind: openalex_reported_ecology
    eligibility: all
    depends_on:
      - reproduction_wikimedia
    pause_seconds: 0.25
    per_page: 5
    require_api_key: true
    max_retries: 3
    backoff_seconds: 5.0
    max_backoff_seconds: 60.0
    query_terms:
      - self-incompatibility
      - self-compatible
      - autonomous selfing
      - mating system
      - cleistogamy
      - breeding system
    target_traits:
      - self_incompatibility
      - autonomous_selfing_capacity
      - mating_system
      - cleistogamy

