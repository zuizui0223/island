version: "1.1"

# Hierarchical inference expands taxonomic coverage without pretending that a
# genus-level value is observed in the focal species.  The output is a category
# probability distribution, never an automatic hard-coded biological trait.
accepted_direct_scopes:
  - species_direct
  - species_indirect
accepted_source_reliability:
  - A_primary_or_monograph
  - B_curated_database_or_institution
  - C_curated_specialist_web

# Defaults apply unless a trait-specific rule overrides them.
default:
  genus:
    minimum_supporting_species: 3
    minimum_modal_probability: 0.55
  family:
    minimum_supporting_species: 15
    minimum_modal_probability: 0.65

