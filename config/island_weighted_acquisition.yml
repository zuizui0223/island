version: "1.0"

# Declared inputs for island-weighted acquisition value.
# Both files are frozen artifacts of the GBIF flora collection stage.
inputs:
  master_taxa: data/v2/staging/gbif/collected/island_taxa.csv
  island_species: data/v2/staging/gbif/collected/island_species_occurrences.csv.gz

# An island enters a composition analysis only when its realised flora is
# represented well enough for a proportion to mean anything. Both gates must
# hold: an absolute count so tiny floras cannot pass on a lucky single hit, and
# a share so large floras cannot pass on an unrepresentative fragment.
readiness:
  min_covered_species: 30
  min_covered_fraction: 0.5

# Planning frontier reported by `island-v2-acquisition-value frontier`.
frontier_targets: [2000, 5000, 10000, 20000, 30000, 50000]

# Scope classes are ACQUISITION-PLANNING labels only.
#
# They partition the target list by how floral evidence must be obtained; they
# are never trait values, never accepted evidence, and never a biological
# absence. A species labelled `anemophilous_candidate` still requires reviewed
# source-backed evidence, or an explicitly validated and separately reported
# clade rule, before any axis is counted. Nothing here bypasses the
# no-family-inference rule in docs/integrated_trait_coverage.md.
scope_classes:
  # Overwhelmingly wind-pollinated families. Listed at family level only where
  # the anemophilous state is near-invariant across the whole family.
  anemophilous_families:
    - Poaceae
    - Cyperaceae
    - Juncaceae
    - Betulaceae
    - Fagaceae
    - Salicaceae
    - Urticaceae
    - Typhaceae
    - Casuarinaceae
    - Myricaceae
    - Juglandaceae
    - Ulmaceae
    - Restionaceae
    - Chenopodiaceae
    - Amaranthaceae
  # Anemophilous genera inside families that are otherwise animal-pollinated.
  # Plantaginaceae sensu APG contains Veronica, Digitalis and Antirrhinum, so
  # the family must not be listed above; only Plantago itself qualifies.
  anemophilous_genera:
    - Plantago
    - Rumex
    - Thalictrum
    - Artemisia
    - Ambrosia
    - Sanguisorba
    - Acer
    - Fraxinus
  # Ferns, lycophytes and gymnosperms have no angiosperm flower. The three
  # floral axes are out of taxonomic scope for these rows, exactly as the
  # existing `not_applicable_taxonomic_scope` status in the acquisition-rate
  # ledger already records.
  non_angiosperm_families:
    - Dryopteridaceae
    - Pteridaceae
    - Polypodiaceae
    - Thelypteridaceae
    - Aspleniaceae
    - Athyriaceae
    - Blechnaceae
    - Dennstaedtiaceae
    - Equisetaceae
    - Lycopodiaceae
    - Selaginellaceae
    - Cyatheaceae
    - Hymenophyllaceae
    - Osmundaceae
    - Marattiaceae
    - Woodsiaceae
    - Schizaeaceae
    - Salviniaceae
    - Ophioglossaceae
    - Marsileaceae
    - Isoetaceae
    - Gleicheniaceae
    - Nephrolepidaceae
    - Davalliaceae
    - Tectariaceae
    - Lomariopsidaceae
    - Cystopteridaceae
    - Onocleaceae
    - Pinaceae
    - Cupressaceae
    - Podocarpaceae
    - Araucariaceae
    - Taxaceae
    - Cycadaceae
    - Zamiaceae
    - Ephedraceae
