# Review-packet compression for discovered literature leads.
#
# Stage-1 discovery returns many leads per species (species x trait-group x API).
# Trait relevance alone does not make a lead about the TARGET species, so most of
# that volume is not worth human time. This config drives compression into a
# bounded review packet: gate out leads that do not credibly concern the target
# species (taxon_relevance_score == 0), then keep the strongest few per
# (species, trait-group) so a human can evaluate irrelevant_literature_rate on a
# tractable set rather than on the full unfiltered dump.
version: "1.0"

# Bounded Tier-S packet size for human review.
target_min: 150
target_max: 300

# Leads are routed by taxon-relevance tier (set in Stage-1A discovery):
#   Tier S (score >= 3) -> review packet
#   Tier A (score 1-2)  -> genus/flora rescue CSV (quarantined, optional follow-up)
#   Tier B (score 0)    -> background-literature CSV (retained, not reviewed)
# The packet is compressed round-robin so no species/trait-group monopolises it.
