# Versioned thresholds for the v2 observation-process / data-coverage audit.
#
# Area remains an analytical covariate, never an inclusion rule. Raw
# Tracheophyta records are retained for observation-process flags, while primary
# floral/pollen-vector/reproductive-assurance analyses use these thresholds on
# reviewed accepted-angiosperm coverage supplied to island-v2-diagnostics.
version: "1.1"

primary_taxonomic_scope: accepted_angiosperms
raw_tracheophyta_without_scope_review: screening_only

# An island needs at least this many accepted angiosperm species and associated
# GBIF records before an island-level trait proportion is treated as stable
# enough to model. With no angiosperm coverage input the same threshold can be
# computed only as a clearly labelled raw-vacular screening diagnostic.
min_species_for_proportions: 5
min_records: 10

# Advisory data-process concern flags. They do not independently gate inclusion.
flags:
  # Flora dominated by a single GBIF dataset -> source-structure concern.
  single_dataset_max: 1
  # Weak physical-voucher support (share of PRESERVED_SPECIMEN records).
  low_specimen_support_fraction: 0.2
  # Non-trivial share of records flagged cultivated -> establishment concern.
  high_cultivation_fraction: 0.1
  # Median coordinate uncertainty above this (m) -> assignment-precision concern.
  coarse_coordinate_uncertainty_m: 5000.0
  # Latest record older than this -> only historical evidence.
  stale_last_record_year: 1980

# Re-run the inclusion gate at these species thresholds as labelled sensitivity
# analyses, always retaining the taxonomic-scope label in the output.
species_threshold_sensitivity:
  - 3
  - 5
  - 10
