# Versioned thresholds for the v2 observation-process / data-coverage audit.
#
# These decide island *analysis inclusion by realised data coverage* -- not by
# area (area stays an analytical covariate). Every threshold is an explicit,
# re-runnable sensitivity knob, never a hidden filter. Flags are advisory audit
# signals; only `min_species_for_proportions` + `min_records` gate inclusion.
version: "1.0"

# Realised-coverage inclusion gate: an island needs at least this many usable
# species and records before an island-level trait *proportion* is stable enough
# to model. Islands below the gate are retained in the table but marked
# analysis_included = false.
min_species_for_proportions: 5
min_records: 10

# Advisory data-process concern flags (do not gate inclusion on their own).
flags:
  # Flora dominated by a single GBIF dataset -> source-structure concern.
  single_dataset_max: 1
  # Weak physical-voucher support (share of PRESERVED_SPECIMEN records).
  low_specimen_support_fraction: 0.2
  # Non-trivial share of records flagged cultivated -> establishment concern.
  high_cultivation_fraction: 0.1
  # Median coordinate uncertainty above this (m) -> assignment-precision concern.
  coarse_coordinate_uncertainty_m: 5000.0
  # Latest record older than this -> only historical evidence.
  stale_last_record_year: 1980

# Re-run the inclusion gate at these species thresholds as a labelled coverage
# sensitivity analysis.
species_threshold_sensitivity:
  - 3
  - 5
  - 10
