# When a description names colours mapping to different ontology values --
# "corolla alba demum rosea" -- the species is not given a single primary
# colour. The row is retained as variable rather than resolved to the first hit.
multiple_value_result: multicolored_variable

# Every acquired record must carry these before it can become a candidate.
# Missing any one of them rejects the row rather than downgrading it.
required_lineage_fields:
  - source_url
  - source_citation
  - license
  - retrieval_date
  - exact_supporting_quote
