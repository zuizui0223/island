# Latin adjectives are not enumerated form by form. They agree with the noun, so
# the form that actually appears is dictated by which organ word precedes it --
# "corolla alba" but "flores albi" but "floribus albis" -- and a protologue uses
# the plural at least as often as the singular. Listing only the dictionary form
# would silently drop most real statements, which is why the endings are applied
# to the stem here rather than trusted to a hand-written list.
#
# The endings are the closed set that occurs in descriptive text: nominative
# singular and plural in all three genders, plus the ablative used in the
# "floribus albis" construction. Endings that generate a non-word simply never
# match, so over-generation costs nothing while under-generation loses evidence.
latin_adjective_endings: [us, a, um, i, ae, o, is]

latin_adjective_stems:
  alb: white
  albid: white
  nive: white
  lacte: white
  eburne: white
  flav: yellow_orange
  lute: yellow_orange
  aure: yellow_orange
  aurantiac: yellow_orange
  ochroleuc: yellow_orange
