version: "1.0"

# Acquiring floral descriptions from protologues, via IPNI for the citation and
# BHL for the scanned page.
#
# Why this source: the unresolved tail is 74,846 species on three islands or
# fewer, with a median of four GBIF records each. They are island endemics, and
# for most of them no monograph, revision or ecological study exists. What does
# exist -- by definition, because the name is validly published -- is the
# original description. For a species with four records the protologue is
# frequently the only floral description anywhere.
#
# Two constraints shape everything below.
#
# 1. Protologues are Latin, French, German or Spanish far more often than they
#    are English. This is not a preference but a measured requirement: in the
#    WFO rejection ledger the one automatically recoverable slice (8.8%) was
#    non-English statements that English-only rules had failed to bind. An
#    English-only vocabulary here would repeat that failure at scale.
#
# 2. The organ-attachment discipline from label mining applies unchanged, and
#    for the same measured reason: 38.6% of WFO rejections were a style, calyx
#    or fruit value being read as a whole-flower value. A protologue reading
#    "fructus ruber" is not flower colour.

# Which species to target. The tail is defined by island occupancy, not by
# record count alone -- a species on many islands is not the acquisition
# problem even when poorly recorded.
target_selection:
  max_islands: 3
  # Species already carrying species-direct evidence for the axis are skipped
  # when a resolved-species list is supplied; without one every tail species is
  # queued and the caller deduplicates downstream.
  axis: flower_primary_color

# Step 1: resolve the species to its protologue citation.
citation_index:
  provider: IPNI
  base_url: "https://www.ipni.org/api/1/search"
  access: official_api
  # A citation is only usable when it names both the work and the page.
  fields_required:
    - publication
    - page
    - year

# Step 2: locate the scanned page.
scan_provider:
  provider: BHL
  base_url: "https://www.biodiversitylibrary.org/api3"
  access: official_api
  # Items still in copyright are skipped, never scraped. Both gates must pass:
  # the declared rights string must be one of the public-domain values, and the
  # publication year must be at or before the cutoff.
  public_domain_rights:
    - "Public domain"
    - "Public domain. The BHL considers that this work is no longer under copyright protection"
    - "NOT_IN_COPYRIGHT"
    - "CC0"
  max_copyright_year: 1928

# A colour word counts only when it sits within this many characters of a floral
# organ word. Wider than the 40 used for specimen labels because protologue
# prose is denser: "Corolla infundibuliformis, tubo brevi, limbo albo" puts the
# colour well past 40 characters from its organ while still describing it.
organ_proximity_chars: 60

# Matching is on folded text -- lowercased, diacritics stripped, ss for eszett --
# and every term is matched at word boundaries. Boundaries are not optional
# here: substring matching would read "rotundifolia" as German "rot" and
# "albacea" as Latin "alba", and protologue prose is long enough that such hits
# would dominate the ledger.
#
# Terms are enumerated in full rather than stemmed. Latin inflects in a small
# closed set of endings, so enumeration is both feasible and honest about what
# is actually being matched.

floral_organ_terms:
  # English
  - flower
  - flowers
  - corolla
  - corollas
  - perianth
  - petal
  - petals
  - tepal
  - tepals
