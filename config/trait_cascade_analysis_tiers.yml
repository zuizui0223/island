version: "1.0"

# The species-trait matrix is rectangular but only evidence-grounded values are
# analysable. These tiers keep direct and qualified taxonomic inference explicit;
# unresolved_no_evidence is excluded from every tier.
analysis_tiers:
  primary:
    allowed_fill_tiers:
      - species_direct
    interpretation: "Direct source-backed species values only."

  broad:
    allowed_fill_tiers:
      - species_direct
      - genus_inference
      - family_inference
    interpretation: "Taxonomically informed values with qualified support and consensus."

  sensitivity_all:
    allowed_fill_tiers:
      - species_direct
      - genus_inference
      - family_inference
    interpretation: "All evidence-grounded direct/genus/family values; unresolved cells are excluded."

required_traits:
  floral:
    - flower_primary_color
    - floral_form
    - floral_symmetry
    - tube_depth_class
    - flower_size_class
    - inflorescence_display
    - reward_type
  pollen_vector_best_effort:
    - pollen_vector_mode
  reproductive:
    - sex_system
    - mating_system
    - self_incompatibility
    - autonomous_selfing_capacity
    - herkogamy
    - dichogamy
    - cleistogamy

optional_noncore_traits:
  interaction_evidence:
    - pollination_functional_guild

identity:
  species_column: accepted_species
  trait_column: trait_name
  value_column: filled_value
  tier_column: fill_tier
