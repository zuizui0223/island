version: "1.0"
contract: trait_cascade_leave_one_species_out_validation_v1

validate_traits:
  - flower_primary_color
  - floral_form
  - floral_symmetry
  - pollen_vector_mode
  - pollination_functional_guild
  - sex_system
  - mating_system
  - self_incompatibility
  - autonomous_selfing_capacity

cascade_policy:
  source_config: config/trait_fill_cascade.yml
  genus_support_grid: [1, 2, 3, 5, 10]
  family_support_grid: [3, 5, 10, 20]

focused_binary_diagnostic:
  trait_name: pollination_functional_guild
  positive_value: bumblebees

reporting:
  minimum_evaluable_for_metric: 5
  support_bins:
    - [1, 1]
    - [2, 2]
    - [3, 4]
    - [5, 9]
    - [10, 19]
    - [20, 49]
    - [50, 1000000]

interpretation_guardrails:
  - Validation is leave-one-species-out within species-direct cells; the target species is removed from genus, family, and global support before prediction.
  - Genus and family predictions reproduce the cascade weighted-modal logic over species-direct winners.
  - Global fallback reconstructs weighted raw evidence distributions from each direct cell value_distribution.
  - Threshold-grid results are reported completely and must not be cherry-picked after seeing accuracy.
