version: 2
canonical_analysis:
  workflow: .github/workflows/run-v2-inla-category-preserving-north.yml
  engine: INLA
  current_evidence_tier: sensitivity_all
  planned_confirmatory_evidence_tier: primary
  category_preserving: true
  population:
    primary: northern_midlatitude
    falsification: [tropical, southern_extratropical]
models:
  N0_geo:
    population: northern_midlatitude
    responses: [flower_color, floral_form, self_compatibility]
    predictors: [distance_to_continent, island_area, climate]
  N1_bombus:
    extends: N0_geo
    add_predictors: [bombus_channel]
  N2_sc:
    extends: N0_geo
    add_predictors: [self_compatibility]
  N3_direct_indirect:
    extends: N0_geo
    add_predictors: [bombus_channel, self_compatibility]
    reports: [direct_effect, sc_mediated_indirect_effect, total_effect]
  global_falsification:
    population: [northern_midlatitude, tropical, southern_extratropical]
    responses: [self_compatibility, plain_flower_color, open_generalized_floral_form]
    predictors: [distance_to_continent, island_area, climate, analysis_regime, distance_by_regime]
    interpretation: >-
      Tests whether the northern isolation-associated slopes weaken, disappear, or reverse
      outside the northern-midlatitude domain. Alternative pollinator guilds are not primary
      model covariates and may be discussed only as biological interpretations of counter-patterns.
engine_roles:
  INLA:
    owns: [category_preserving_flower_color, category_preserving_floral_form, direct_indirect_decomposition, global_falsification]
  brms:
    role: noncanonical_scalar_replication_only
    category_models_allowed: false
principles:
  unknown_is_not_negative: true
  preserve_category_resolution: true
  separate_current_exploratory_from_planned_confirmatory: true
  preserve_bombus_channel_components: true
  exclude_zero_distance_from_fitted_models: true
  use_equation_specific_maximum_support: true
  alternative_pollinator_covariates_in_primary_models: false
