version: 6
canonical_analysis:
  workflow: .github/workflows/run-v2-inla-category-preserving-north.yml
  engine: INLA
  current_evidence_tier: sensitivity_all
  planned_confirmatory_evidence_tier: primary
  layered_all_data: true
  joint_colour_form_composition: true
  population:
    primary: northern_midlatitude
    global_regimes:
      - northern_midlatitude
      - northern_high_latitude
      - tropical
      - southern_extratropical
retained_categories:
  flower_color: [plain, yellow_orange, red_pink, blue_purple]
  floral_form: [open_generalized, tubular_trumpet, zygomorphic_specialized, composite_brush]
  joint_colour_form_cells: 16
full_flora_outcomes:
  - animal_pollinated
  - wind_mixed
  - self_compatibility
bombus_channel_components:
  - bombus_deficit
  - bombus_environmental_compatibility
  - environmental_compatibility_max
  - environmental_compatibility_mean
  - environmental_extrapolation_share
  - n_bombus_species_total
  - n_bombus_species_scored
  - n_bombus_species_unscored
  - n_environmentally_compatible_species
alternative_guild_outcomes:
  - showy_alternative_guild
  - other_bee_guild
  - generalist_insect_guild
models:
  full_flora:
    responses: [animal_pollinated, wind_mixed, self_compatibility]
    predictors: [distance_to_continent, island_area, climate, bombus_deficit]
    self_compatibility_adjustment: [wind_mixed]
  bombus_geography:
    response: bombus_deficit
    predictors: [distance_to_continent, island_area, climate]
    domain: northern_midlatitude
  N0_geo:
    responses:
      - plain
      - yellow_orange
      - red_pink
      - blue_purple
      - open_generalized
      - tubular_trumpet
      - zygomorphic_specialized
      - composite_brush
    predictors: [distance_to_continent, island_area, climate]
  N1_bombus:
    extends: N0_geo
    add_predictors: [bombus_deficit]
  N2_sc:
    extends: N0_geo
    add_predictors: [self_compatibility]
  N3_direct_indirect:
    extends: N0_geo
    add_predictors: [bombus_deficit, self_compatibility]
    reports: [direct_effect, sc_mediated_indirect_effect, total_effect]
    applies_to:
      - plain
      - yellow_orange
      - red_pink
      - blue_purple
      - open_generalized
      - tubular_trumpet
      - zygomorphic_specialized
      - composite_brush
  N4_wind_adjusted:
    extends: N3_direct_indirect
    add_predictors: [wind_mixed]
    reports: [wind_adjusted_direct_effect, wind_adjusted_indirect_effect, wind_adjusted_total_effect]
  J0_joint_geo:
    response: joint_colour_form_composition
    cells: 16
    representation: poisson_loglinear_with_shared_island_effect
    predictors: [distance_to_continent, island_area, climate]
  J1_joint_bombus:
    extends: J0_joint_geo
    add_predictors: [bombus_deficit]
  J2_joint_sc_wind:
    extends: J0_joint_geo
    add_predictors: [self_compatibility, wind_mixed]
  J3_joint_full:
    extends: J0_joint_geo
    add_predictors: [bombus_deficit, self_compatibility, wind_mixed]
    interpretation: category_reallocation_within_joint_colour_form_composition
  global_falsification:
    population:
      - northern_midlatitude
      - northern_high_latitude
      - tropical
      - southern_extratropical
    responses:
      - animal_pollinated
      - wind_mixed
      - self_compatibility
      - plain
      - yellow_orange
      - red_pink
      - blue_purple
      - open_generalized
      - tubular_trumpet
      - zygomorphic_specialized
      - composite_brush
      - showy_alternative_guild
      - other_bee_guild
      - generalist_insect_guild
    predictors: [distance_to_continent, island_area, climate, analysis_regime, distance_by_regime]
engine_roles:
  INLA:
    owns:
      - full_flora_pollination_mode
      - all_retained_flower_categories
      - joint_colour_form_composition
      - direct_indirect_decomposition
      - wind_mixed_adjusted_decomposition
      - four_regime_falsification
  brms:
    role: noncanonical_scalar_replication_only
    category_models_allowed: false
principles:
  unknown_is_not_negative: true
  conflicting_species_states_are_unresolved: true
  category_omission_allowed: false
  outcome_layer_omission_allowed: false
  separate_binary_models_are_not_joint_composition: true
  joint_colour_form_counts_must_exhaust_joint_trials: true
  exclude_zero_distance_from_fitted_models: true
  use_equation_specific_maximum_support: true
  compare_models_only_on_matched_support: true
  preserve_bombus_channel_components: true
  do_not_force_collinear_bombus_components_into_one_equation: true
  alternative_pollinator_covariates_in_primary_models: false
  alternative_guilds_are_global_descriptive_outcomes: true
