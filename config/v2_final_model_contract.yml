version: 1
status: final_pr115_model
workflow: .github/workflows/run-v2-final-floral-composition.yml
engine: INLA
current_evidence_tier: sensitivity_all
planned_confirmatory_evidence_tier: primary

estimand:
  name: conditional_relative_category_probability
  definition: >-
    Probability of a fine floral category within the observed, trait-resolved
    island flora. This is not raw detection probability and not latent true
    occupancy or abundance.

primary_global_population:
  include_pollination_modes: [animal, wind, mixed, unresolved]
  rule: include every observed species with the focal floral trait resolved, regardless of pollen-vector-mode resolution
  exclude_zero_distance_from_fitted_models: true
  regimes:
    - northern_midlatitude
    - northern_high_latitude
    - tropical
    - southern_extratropical

primary_endpoints:
  fine_colour_composition:
    categories: [white, blue, yellow, red, green, cream, rare_other]
  fine_floral_form_composition:
    categories: [tubular, composite_head, star, bell_campanulate, open_radial, trumpet_funnel, rare_other]
  analyse_colour_and_form_separately: true
  colour_by_form_joint_model_role: sensitivity_only

isolation:
  predictor: log_distance_to_continent_km
  continuous: true
  quadratic_term: true
  interpretation:
    linear: local direction of compositional change along the isolation gradient
    quadratic: whether the change strengthens, saturates, or reverses on highly isolated islands

global_model:
  formula_concept: category_composition ~ isolation * regime + isolation_squared * regime + area + climate + spatial_effects
  purpose: test whether the isolation-associated floral redistribution differs among regional pollination regimes

northern_mechanism:
  population: northern_midlatitude animal-pollinated trait-resolved flora
  nested_models:
    N0_isolation: [isolation, isolation_squared, area, climate, spatial_effects]
    N1_bombus: [N0_isolation, bombus_deficit]
    N2_bombus_sc: [N1_bombus, self_compatibility]
    N3_full: [N2_bombus_sc, wind_share, mixed_share]
  mechanisms:
    bombus_deficit: relaxation_or_loss_of_Bombus_mediated_selection
    self_compatibility: reproductive_assurance_pathway_consistent_with_selfing_syndrome
    wind_and_mixed_shares: broader_pollination_mode_composition_controls
  explicit_sc_equation: self_compatibility ~ isolation + isolation_squared + bombus_deficit + wind_share + mixed_share + area + climate + spatial_effects

hypotheses:
  H1: isolation restructures fine colour and floral-form composition across the whole observed trait-resolved flora
  H2: compositional change can strengthen or bend at high isolation rather than being strictly linear
  H3: in northern temperate systems, Bombus deficit explains part of the isolation-associated floral redistribution
  H4: self-compatibility provides a non-exclusive reproductive-assurance pathway consistent with selfing-syndrome evolution
  H5: tropical and southern extratropical regimes need not show the northern Bombus-linked pattern because Bombus is not the regional baseline pollination channel

principles:
  use_all_available_pollination_modes_in_global_primary_model: true
  restrict_Bombus_mechanism_to_relevant_animal_pollinated_regime: true
  do_not_call_conditional_category_probability_detection_probability: true
  preserve_unknown_as_unknown: true
  preserve_rare_resolved_states_as_rare_other: true
  use_equation_specific_maximum_support: true
  compare_nested_models_on_matched_support: true
