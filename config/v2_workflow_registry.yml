version: 4
project: island-v2

canonical:
  current:
    workflow: .github/workflows/run-v2-inla-category-preserving-north.yml
    engine: INLA
    evidence_tier: sensitivity_all
    role: primary_category_preserving_inference
    models: [N0_geo, N1_bombus, N2_sc, N3_direct_indirect]
    description: >-
      Active v2 analysis. INLA owns category-preserving flower-colour and floral-form
      models, the northern-midlatitude Bombus direct/SC-mediated indirect decomposition,
      and tropical/southern falsification tests. Maximum available sensitivity_all data
      are used; zero-distance islands remain in the audit universe but are excluded from
      fitted model support.

  planned_primary:
    workflow: .github/workflows/run-v2-inla-category-preserving-north.yml
    engine: INLA
    evidence_tier: primary
    role: confirmatory_category_inference
    status: deferred_until_maximum_data_results_are_reviewed

engine_roles:
  inla:
    owns:
      - category_preserving_flower_colour
      - category_preserving_floral_form
      - northern_bombus_direct_effect
      - sc_mediated_indirect_effect
      - direct_indirect_total_decomposition
      - tropical_and_southern_falsification
    note: >-
      Category models stay in INLA. Do not move multinomial/category-preserving models
      into brms because that route is computationally prohibitive for this dataset.
  bayesian_brms:
    owns:
      - optional_scalar_aggregate_replication
      - optional_simple_path_replication
    excludes:
      - category_preserving_flower_colour
      - category_preserving_floral_form
      - multinomial_category_models
      - alternative_pollinator_primary_path
    status: noncanonical_replication_only
    note: >-
      brms is not allowed to own the category analysis. If used later, it is restricted
      to compact scalar/aggregate checks of the Bombus and self-compatibility paths.
      Alternative-pollinator guilds are biological interpretations, not required
      covariates in the canonical primary mechanism.

robustness:
  evidence_tiers:
    workflows:
      - .github/workflows/run-m0-m4-full-sensitivity.yml
      - .github/workflows/run-m0-m4-evidence-layer-diagnostics.yml
    evidence_tiers: [primary, broad, sensitivity_all]
    role: evidence_tier_comparison
  spatial:
    workflows:
      - .github/workflows/run-m0-m4-spatial-cv.yml
      - .github/workflows/run-m0-m4-common-support-cv.yml
    role: spatial_robustness
  trait_uncertainty:
    workflows:
      - .github/workflows/run-m1-probabilistic-trait-uncertainty.yml
      - .github/workflows/run-trait-inference-validation.yml
    role: trait_uncertainty

replication:
  bayesian_engine:
    workflow: .github/workflows/run-v2-bayesian-m0-m4-main.yml
    engine: brms
    role: noncanonical_scalar_replication_only
    required_evidence_tier: primary
    category_models_allowed: false
    alternative_pollinator_covariates_allowed: false
    note: >-
      This historical workflow is not the current analysis route. Any future brms reuse
      must remove/skip category models and be limited to compact scalar path replication.

legacy:
  workflows:
    - .github/workflows/run-v2-inla-m0-m4-main.yml
    - .github/workflows/run-m0-global-baseline.yml
    - .github/workflows/run-m0-m4-all-data.yml
    - .github/workflows/run-m0-m4-existing-paths.yml
    - .github/workflows/run-m0-m4-full-analysis.yml
    - .github/workflows/run-m1-species-direct-analysis.yml
    - .github/workflows/run-m1-species-direct-family-fe.yml
    - .github/workflows/run-v1-v2-minimal-bridge.yml
  role: development_history
  interpretation: >-
    Retained for provenance and method development. These workflows are not the current
    analysis route unless explicitly promoted in this registry.

guardrails:
  current_evidence_tier: sensitivity_all
  planned_confirmatory_evidence_tier: primary
  preserve_frozen_island_universe: true
  exclude_zero_distance_from_fitted_models: true
  use_equation_specific_maximum_support: true
  require_locked_inputs: true
  category_engine: INLA
  prohibit_brms_category_models: true
  prohibit_alternative_pollinator_primary_covariates: true
  require_analysis_contract: config/v2_analysis_contract.yml
  require_input_validation: src/island_v2/validate_analysis_inputs.py
