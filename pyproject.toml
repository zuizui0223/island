[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "island-floral-v2"
version = "0.1.0"
description = "Evidence-tracked data pipeline for global island floral-syndrome analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0.0",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "pydantic>=2.7.0",
  "pypdf>=5.0.0",
  "pyogrio>=0.9.0",
  "PyYAML>=6.0.1",
  "shapely>=2.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
island-v2-gshhg = "island_v2.gshhg_source:app"
island-v2-gbif-blocks = "island_v2.gbif_blocks:app"
island-v2-gbif-flora = "island_v2.gbif_flora:app"
island-v2-gbif-collect = "island_v2.gbif_collect_incremental:app"
island-v2-gbif-pollinator-collect = "island_v2.gbif_pollinator_collect:app"
island-v2-taxon-intake = "island_v2.taxon_intake:app"
island-v2-pilot-curation = "island_v2.pilot_curation:app"
island-v2-trait-review-packet = "island_v2.trait_review_packet:app"
island-v2-diagnostics = "island_v2.observation_diagnostics:app"
island-v2-taxon-scope = "island_v2.taxon_scope:app"
island-v2-bombus-applicability = "island_v2.bombus_applicability:app"
island-v2-applicability-auto-accept = "island_v2.applicability_auto_accept:app"
island-v2-core-pilot-nomination = "island_v2.core_pilot_nomination:app"
island-v2-bombus-diagnostics = "island_v2.bombus_diagnostics:app"
island-v2-attrition = "island_v2.attrition_audit:app"
island-v2-trait-source-discovery = "island_v2.trait_source_discovery:app"
island-v2-trait-layers = "island_v2.trait_layers:app"
island-v2-pollinator-evidence = "island_v2.pollinator_evidence:app"
island-v2-trait-measurements = "island_v2.trait_measurements:app"
island-v2-trait-colour = "island_v2.trait_colour:app"
island-v2-trait-pilot-eval = "island_v2.trait_pilot_eval:app"
island-v2-trait-lead-packet = "island_v2.trait_lead_packet:app"
island-v2-trait-descriptive-scout = "island_v2.trait_descriptive_scout:app"
island-v2-trait-web-reported-scout = "island_v2.trait_web_reported_scout:app"
island-v2-trait-proxy-generator = "island_v2.trait_proxy_generator:app"
island-v2-trait-candidate-review-queue = "island_v2.trait_candidate_review_queue:app"
island-v2-taxon-identity-b-lite = "island_v2.taxon_identity_b_lite:app"
island-v2-trait-pdf-locator = "island_v2.trait_pdf_locator:app"
island-v2-trait-candidate-logic = "island_v2.trait_candidate_logic:app"
island-v2-bulk-traits = "island_v2.bulk_trait_ingest:app"
island-v2-interaction-evidence = "island_v2.interaction_evidence:app"
island-v2-hierarchical = "island_v2.hierarchical:app"
island-v2-validate = "island_v2.validation:app"

[tool.hatch.build.targets.wheel]
packages = ["src/island_v2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["island_v2"]
combine-as-imports = true
