[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "island-floral-v2"
version = "0.1.0"
description = "Evidence-tracked data pipeline for global island floral-syndrome analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "geopandas>=1.0.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "Pillow>=10.0.0",
  "pydantic>=2.7.0",
  "pypdf>=5.0.0",
  "pyogrio>=0.9.0",
  "PyYAML>=6.0.1",
  "rasterio>=1.4.0",
  "requests>=2.32.0",
  "shapely>=2.0.0",
  "truststore>=0.10.0",
  "typer>=0.12.0",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0,<0.16.0",
]

[project.scripts]
island-v2-gshhg = "island_v2.gshhg_source:app"
island-v2-gbif-blocks = "island_v2.gbif_blocks:app"
island-v2-gbif-flora = "island_v2.gbif_flora:app"
