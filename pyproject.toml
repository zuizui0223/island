[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "island-floral-v2"
version = "0.1.0"
description = "Evidence-tracked data pipeline for global island floral-syndrome analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.109.0",
  "pandas>=2.2.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
island-v2-traits = "island_v2.trait_extraction:app"
island-v2-validate = "island_v2.validation:app"

[tool.hatch.build.targets.wheel]
packages = ["src/island_v2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
