[tool.poetry]
packages = [{ include = "island_v2", from = "src" }]

[tool.hatch.build.targets.wheel]
packages = ["src/island_v2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
