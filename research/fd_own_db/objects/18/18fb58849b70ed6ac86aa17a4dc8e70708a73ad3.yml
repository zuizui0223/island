name: General partner E2 synthetic contract
on:
  push:
    branches: [analysis/range-map-nectarivore-20261125]
    paths:
      - 'src/fd/partner_flora_e2.py'
      - 'scripts/range_map_partner_incidence.py'
      - 'tests/test_range_map_partner_incidence.py'
      - 'tests/test_partner_flora_e2.py'
      - 'docs/PARTNER_E2_EXTENSION_CONTRACT_20261125.md'
      - '.github/workflows/partner-e2-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test,geo]"
      - run: python -m pytest -q tests/test_partner_flora_e2.py tests/test_range_map_partner_incidence.py tests/test_nectarivore_flora_test.py tests/test_range_map_nectarivore.py tests/test_range_map_nectarivore_scripts.py
