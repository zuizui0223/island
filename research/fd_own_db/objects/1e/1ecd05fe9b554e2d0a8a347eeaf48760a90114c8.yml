name: audit_gift_original_target_species_genus_clusters
on:
  push:
    branches: [analysis/gift-target-taxon-cluster-audit-20261120]
    paths:
      - ".github/workflows/audit-gift-target-taxon-cluster.yml"
      - "scripts/verify_gift_target_taxon_source.py"
      - "tests/test_verify_gift_target_taxon_source.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-gift-target-taxon-cluster.yml"
      - "scripts/verify_gift_target_taxon_source.py"
      - "tests/test_verify_gift_target_taxon_source.py"
permissions:
  contents: read
jobs:
  source-taxon-cluster-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit test dependency
        run: python -m pip install -q pytest
      - name: Verify original all13 4505-island source accepted species and genus bootstrap contracts
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_verify_gift_target_taxon_source.py
          python -m compileall -q scripts/verify_gift_target_taxon_source.py
