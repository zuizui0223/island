name: fd original geology x GMMC joint positivity and two-way floral morphology source
on:
  push:
    branches: [analysis/discrete-functional-hypervolume-20261113]
    paths:
      - src/fd/geology_lgm_joint_identifiability.py
      - tests/test_geology_lgm_joint_identifiability.py
      - .github/workflows/fd-geology-lgm-joint-identifiability.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  botanical-four-history-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test original GIFT 4505 four-cell history support with two-way source-cluster bootstrap
        run: |
          set -euo pipefail
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_geology_lgm_joint_identifiability.py tests/test_geology_genus_flower_pair.py tests/test_genus_flower_pair_covariance.py
          python -m compileall -q src/fd/geology_lgm_joint_identifiability.py
