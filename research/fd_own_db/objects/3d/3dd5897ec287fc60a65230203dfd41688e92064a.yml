name: range_map_nectarivore_synthetic
on:
  push:
    branches: [analysis/range-map-nectarivore-20261125]
    paths:
      - ".github/workflows/range-map-nectarivore.yml"
      - "src/fd/range_map_nectarivore.py"
      - "src/fd/nectarivore_flora_test.py"
      - "src/fd/nectarivore_sim.py"
      - "scripts/range_map_nectarivore_*.py"
      - "tests/test_range_map_nectarivore*.py"
      - "tests/test_nectarivore_flora_test.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/range-map-nectarivore.yml"
      - "src/fd/range_map_nectarivore.py"
      - "src/fd/nectarivore_flora_test.py"
      - "src/fd/nectarivore_sim.py"
      - "scripts/range_map_nectarivore_*.py"
      - "tests/test_range_map_nectarivore*.py"
      - "tests/test_nectarivore_flora_test.py"
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with geo extras
        run: python -m pip install -q -e ".[test,geo]"
      - name: Synthetic incidence, test and end-to-end runs (no BirdLife or GIFT data)
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_range_map_nectarivore.py tests/test_nectarivore_flora_test.py tests/test_range_map_nectarivore_scripts.py
