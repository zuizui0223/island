name: audit_gift_original_direct_evidence_quality
on:
  push:
    branches: [analysis/gift-direct-quality-source-auditor-20261121]
    paths:
      - ".github/workflows/audit-gift-direct-evidence-quality.yml"
      - "scripts/verify_gift_original_direct_quality_source.py"
      - "tests/test_verify_gift_original_direct_quality_source.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-gift-direct-evidence-quality.yml"
      - "scripts/verify_gift_original_direct_quality_source.py"
      - "tests/test_verify_gift_original_direct_quality_source.py"
permissions:
  contents: read
jobs:
  audit-direct-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit test dependency
        run: python -m pip install -q pytest
      - name: Independently check original 78 GIFT Direct high-medium genus null panels and source privacy
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_verify_gift_original_direct_quality_source.py
          python -m compileall -q scripts/verify_gift_original_direct_quality_source.py
