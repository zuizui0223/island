name: audit_gift_joint_source_anonymous
on:
  push:
    branches: [analysis/gift-joint-source-audit-20261119]
    paths:
      - ".github/workflows/audit-gift-joint-source.yml"
      - "scripts/verify_gift_architecture_assurance_source.py"
      - "tests/test_verify_gift_architecture_assurance_source.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-gift-joint-source.yml"
      - "scripts/verify_gift_architecture_assurance_source.py"
      - "tests/test_verify_gift_architecture_assurance_source.py"
permissions:
  contents: read
jobs:
  audit-source-anonymous:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract tests
        run: python -m pip install -q pytest
      - name: Verify full 36-panel original source audit and no private identifiers
        run: |
          python -m pytest -q tests/test_verify_gift_architecture_assurance_source.py
          python -m compileall -q scripts/verify_gift_architecture_assurance_source.py
