name: fd true visitor-species degree-preserving bipartite floral null
on:
  push:
    branches: [analysis/discrete-functional-hypervolume-20261113]
    paths:
      - src/fd/dopi_degree_fixed_visitor_null.py
      - tests/test_dopi_degree_fixed_visitor_null.py
      - .github/workflows/fd-dopi-degree-fixed-network-null.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-observation-bipartite-network-null:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test real accepted visitor-species degree-preserving floral null
        run: |
          set -euo pipefail
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_dopi_degree_fixed_visitor_null.py \
             tests/test_dopi_guild_portfolio_effort_null.py
          python -m compileall -q src/fd/dopi_degree_fixed_visitor_null.py
