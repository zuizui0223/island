name: FD plant syndrome coherence Q2
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/plant_syndrome_core.py
      - scripts/plant_syndrome_q2_original.py
      - scripts/plant_syndrome_q2_public_pilot.py
      - scripts/plant_syndrome_q4_original.py
      - scripts/plant_syndrome_q3_original.py
      - scripts/plant_syndrome_pair_atlas.py
      - scripts/plant_syndrome_origin_size_diagnostic.py
      - .github/workflows/plant-syndrome-q2.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  public-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python scripts/plant_syndrome_q2_original.py --self-test
      - run: python scripts/plant_syndrome_q2_public_pilot.py --out work/plant_q2/public_pilot.json
      - uses: actions/upload-artifact@v4
        with:
          name: fd-plant-syndrome-public-pilot
          path: work/plant_q2/public_pilot.json
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      GH_TOKEN: ${{ secrets.ISLAND_READ_TOKEN || github.token }}
      STAGE: /tmp/fd-plant-q2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python scripts/plant_syndrome_q2_original.py --self-test
      - name: Restore exact authorized original source archive
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$STAGE"
          curl --fail --silent --show-error --location --max-time 300 --max-filesize 120000000 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/zuizui0223/island/actions/artifacts/10058653212/zip' -o "$STAGE/source.zip"
          printf '%s  %s\n' 'b7d7f357d9d4d93062abc4671f27434725f6e0da07c48c1c574c2b601c64f999' "$STAGE/source.zip" | sha256sum -c -
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/zuizui0223/island/d4a5dafab5f0737ea6c1c1c0263fc20decf6035c/results/geography_20260924/corrected_geography_covariates.csv' -o "$STAGE/geography.csv"
      - run: python scripts/plant_syndrome_q4_original.py --self-test
      - name: Paired four-axis coherence and lineage decomposition
        run: |
          set -euo pipefail
          python -u scripts/plant_syndrome_q2_original.py --archive "$STAGE/source.zip" --geography "$STAGE/geography.csv" --out "$STAGE/anonymous_plant_q2.json"
          python - <<'PY'
          import json,pathlib,os
          s=(pathlib.Path(os.environ["STAGE"])/"anonymous_plant_q2.json").read_text()
          a=json.loads(s)
          assert a["original_botanical_parent"]==4505 and a["original_geography_parent"]==8264 and a["mainland_candidate_regions"]==748 and len(a["panels"])==24
          for k in ("island_id","accepted_species","genus_name","entity_ID","work_species","latitude","longitude","species_name","first_source_id"):
              assert '"'+k+'":' not in s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fd-plant-syndrome-original-anonymous
          path: /tmp/fd-plant-q2/anonymous_plant_q2.json
      - name: Evaluate within-lineage source roster inclusion (Q4)
        run: |
          set -euo pipefail
          python -u scripts/plant_syndrome_q4_original.py --archive "$STAGE/source.zip" --geography "$STAGE/geography.csv" --out "$STAGE/anonymous_plant_q4.json"
          python - <<'PY'
          import json,os,pathlib
          s=(pathlib.Path(os.environ["STAGE"])/"anonymous_plant_q4.json").read_text()
          a=json.loads(s)
          assert len(a["panels"])==16 and a["original_botanical_parent"]==4505 and a["original_geography_parent"]==8264 and a["mainland_candidate_regions"]==748
          for k in ("island_id","accepted_species","genus_name","entity_ID","work_species","latitude","longitude","species_name","first_source_id","present_idx","absent_idx"):
              assert '"'+k+'":' not in s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fd-plant-syndrome-q4-anonymous
          path: /tmp/fd-plant-q2/anonymous_plant_q4.json
      - run: python scripts/plant_syndrome_q3_original.py --self-test
      - name: Evaluate paired morphology and reproductive assurance (Q3)
        run: |
          set -euo pipefail
          python -u scripts/plant_syndrome_q3_original.py --archive "$STAGE/source.zip" --geography "$STAGE/geography.csv" --out "$STAGE/anonymous_plant_q3.json"
          python - <<'PY'
          import json,os,pathlib
          s=(pathlib.Path(os.environ["STAGE"])/"anonymous_plant_q3.json").read_text()
          a=json.loads(s)
          assert len(a["panels"])==24 and a["original_botanical_parent"]==4505 and a["original_geography_parent"]==8264 and a["mainland_candidate_regions"]==748
          for k in ("island_id","accepted_species","genus_name","entity_ID","work_species","latitude","longitude","species_name","first_source_id"):
              assert '"'+k+'":' not in s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fd-plant-syndrome-q3-anonymous
          path: /tmp/fd-plant-q2/anonymous_plant_q3.json
      - run: python scripts/plant_syndrome_pair_atlas.py --self-test
      - name: Pairwise complete syndrome covariance atlas
        run: |
          set -euo pipefail
          python -u scripts/plant_syndrome_pair_atlas.py --archive "$STAGE/source.zip" --geography "$STAGE/geography.csv" --out "$STAGE/anonymous_plant_pair_atlas.json"
          python - <<'PY'
          import json,os,pathlib
          s=(pathlib.Path(os.environ["STAGE"])/"anonymous_plant_pair_atlas.json").read_text()
          a=json.loads(s)
          assert len(a["panels"])==80 and a["original_botanical_parent"]==4505 and a["original_geography_parent"]==8264 and a["mainland_candidate_regions"]==748
          for k in ("island_id","accepted_species","genus_name","entity_ID","work_species","latitude","longitude","species_name","first_source_id","target_idx","source_idx"):
              assert '"'+k+'":' not in s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fd-plant-syndrome-pair-atlas-anonymous
          path: /tmp/fd-plant-q2/anonymous_plant_pair_atlas.json
      - run: python scripts/plant_syndrome_origin_size_diagnostic.py --self-test
      - name: Same-island origin-status and syndrome size diagnostic
        run: |
          set -euo pipefail
          python -u scripts/plant_syndrome_origin_size_diagnostic.py --archive "$STAGE/source.zip" --geography "$STAGE/geography.csv" --out "$STAGE/anonymous_plant_origin_size.json"
          python - <<'PY'
          import json,os,pathlib
          s=(pathlib.Path(os.environ["STAGE"])/"anonymous_plant_origin_size.json").read_text()
          a=json.loads(s)
          assert len(a["panels"])==16 and a["original_botanical_parent"]==4505 and a["original_geography_parent"]==8264 and a["mainland_candidate_regions"]==748
          for k in ("island_id","accepted_species","genus_name","entity_ID","work_species","latitude","longitude","species_name","first_source_id","native_idx","all_idx","source_idx"):
              assert '"'+k+'":' not in s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fd-plant-syndrome-origin-size-anonymous
          path: /tmp/fd-plant-q2/anonymous_plant_origin_size.json
      - name: Remove temporary original inputs
        if: always()
        run: rm -rf "$STAGE"
