name: audit_gift_original_three_stage_residual_split
on:
  push:
    branches: [analysis/gift-three-stage-residual-anonymous-audit-20261120]
    paths:
      - ".github/workflows/audit-gift-original-residual-split.yml"
      - "scripts/verify_gift_flower_residual_split.py"
      - "tests/test_verify_gift_flower_residual_split.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-gift-original-residual-split.yml"
      - "scripts/verify_gift_flower_residual_split.py"
      - "tests/test_verify_gift_flower_residual_split.py"
permissions:
  contents: read
jobs:
  audit-original-source-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test
        run: python -m pip install -q pytest
      - name: Verify source-original 13-trait 78-panel residual identities, unchanged proper scores and privacy
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_verify_gift_flower_residual_split.py
          python -m compileall -q scripts/verify_gift_flower_residual_split.py
