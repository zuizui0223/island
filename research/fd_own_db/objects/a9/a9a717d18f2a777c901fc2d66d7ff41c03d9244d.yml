name: fd original GIFT 4505 environmental genus-composition source interpretation gates
on:
  workflow_dispatch:
  push:
    branches: [analysis/discrete-functional-hypervolume-20261113]
    paths:
      - src/fd/environment_genus_source_audit.py
      - tests/test_environment_genus_source_audit.py
      - .github/workflows/fd-environment-genus-source-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  source_provenance_and_proper_genus_composition_scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-only audit runtime
        run: python -m pip install -q pytest
      - name: Test GIFT original 4505 parent, no local genus oracle, both proper losses and two source geography blocks
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q tests/test_environment_genus_source_audit.py
          python -m compileall -q src/fd/environment_genus_source_audit.py
          echo "Source-only audit gates validated; empirical outcomes require protected original GIFT SHA source run, original artifact signature and complete real source group support."
