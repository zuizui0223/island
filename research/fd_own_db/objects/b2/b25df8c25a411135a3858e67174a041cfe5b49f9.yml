name: audit_gift_original_equalN_donor_sources
on:
  push:
    branches: [analysis/gift-equalN-source-audit-20261120]
    paths:
      - ".github/workflows/audit-gift-original-equalN.yml"
      - "scripts/verify_gift_equalN_source_reference.py"
      - "tests/test_verify_gift_equalN_source_reference.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-gift-original-equalN.yml"
      - "scripts/verify_gift_equalN_source_reference.py"
      - "tests/test_verify_gift_equalN_source_reference.py"
permissions:
  contents: read
jobs:
  validate-equalN-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Validate 78-panel source heldout exact matched N donor audit
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_verify_gift_equalN_source_reference.py
          python -m compileall -q scripts/verify_gift_equalN_source_reference.py
