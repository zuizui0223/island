name: fd exact genus within between true flower pair covariance tests
on:
  push:
    branches: [analysis/discrete-functional-hypervolume-20261113]
    paths:
      - src/fd/genus_flower_pair_covariance.py
      - tests/test_genus_flower_pair_covariance.py
      - .github/workflows/fd-genus-flower-pair-covariance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytical-genus-margins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify genus-fixed exact finite hypergeometric flower-pair decomposition
        run: |
          set -euo pipefail
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_genus_flower_pair_covariance.py tests/test_real_joint_syndrome_access.py
          python -m compileall -q src/fd/genus_flower_pair_covariance.py
