<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="540" viewBox="0 0 1060 540" role="img" aria-label="Figure 3 | Geographical differentiation of potential partners"><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" text-anchor="start" fill="#172B3A">Figure 3 | Geographical differentiation of potential partners</text><text x="24" y="55" font-size="13" font-weight="400" text-anchor="start" fill="#51616D">Provisional bird island matches; positive butterfly records do not measure complete native richness.</text><line x1="24" y1="69" x2="1036" y2="69" stroke="#DCE3E7" stroke-width="1"/><text x="24" y="101" font-size="20" font-weight="700" text-anchor="start" fill="#172B3A">A</text><text x="54" y="101" font-size="17" font-weight="700" text-anchor="start" fill="#172B3A">Independent source support</text><text x="450" y="101" font-size="20" font-weight="700" text-anchor="start" fill="#172B3A">B</text><text x="480" y="101" font-size="17" font-weight="700" text-anchor="start" fill="#172B3A">Isolation-distance sensitivity</text><text x="24" y="142" font-size="14" font-weight="400" text-anchor="start" fill="#172B3A">Native bee source islands</text><rect x="24" y="151" width="310" height="12" rx="2" fill="#3C6FA3"/><text x="345" y="162" font-size="14" font-weight="700" text-anchor="end" fill="#172B3A">305</text><text x="24" y="194" font-size="14" font-weight="400" text-anchor="start" fill="#172B3A">Unique bee–GSHHG matches</text><rect x="24" y="203" width="237.8360655737705" height="12" rx="2" fill="#3C6FA3"/><text x="345" y="214" font-size="14" font-weight="700" text-anchor="end" fill="#172B3A">234</text><text x="24" y="246" font-size="14" font-weight="400" text-anchor="start" fill="#172B3A">Historical floral aggregate joins</text><rect x="24" y="255" width="234.78688524590163" height="12" rx="2" fill="#3C6FA3"/><text x="345" y="266" font-size="14" font-weight="700" text-a