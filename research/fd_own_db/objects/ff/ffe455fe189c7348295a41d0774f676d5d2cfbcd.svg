oubling of 1 + distance</text><text x="644" y="172" font-size="13" font-weight="400" text-anchor="end" fill="#172B3A">Mainland</text><circle cx="972.2931704545454" cy="161" r="5" fill="#007C78" stroke="#007C78" stroke-width="1.6"/><circle cx="930.965215909091" cy="178" r="5" fill="#FFFFFF" stroke="#3C6FA3" stroke-width="1.6"/><text x="644" y="242" font-size="13" font-weight="400" text-anchor="end" fill="#172B3A">Nearest land &gt;1 km²</text><circle cx="682.0501477272727" cy="231" r="5" fill="#007C78" stroke="#007C78" stroke-width="1.6"/><circle cx="713.410284090909" cy="248" r="5" fill="#FFFFFF" stroke="#3C6FA3" stroke-width="1.6"/><text x="644" y="312" font-size="13" font-weight="400" text-anchor="end" fill="#172B3A">Nearest land &gt;1,000 km²</text><circle cx="747.6738295454545" cy="301" r="5" fill="#007C78" stroke="#007C78" stroke-width="1.6"/><circle cx="738.1166363636364" cy="318" r="5" fill="#FFFFFF" stroke="#3C6FA3" stroke-width="1.6"/><circle cx="470" cy="418" r="5" fill="#007C78" stroke="#007C78" stroke-width="1.6"/><text x="482" y="423" font-size="13" font-weight="400" text-anchor="start" fill="#172B3A">Nectar &gt;0 minus bees</text><circle cx="716" cy="418" r="5" fill="#FFFFFF" stroke="#3C6FA3" stroke-width="1.6"/><text x="728" y="423" font-size="13" font-weight="400" text-anchor="start" fill="#172B3A">Nectar &gt;0 minus nonnectar birds</text><line x1="24" y1="445" x2="1036" y2="445" stroke="#DCE3E7" stroke-width="1"/><text x="24" y="472" font-size="14" font-weight="400" text-anchor="start" fill="#51616D">Mainland bootstrap ranges include zero: bee contrast [−0.005, 2.127]; nonnectar [−0.129, 1.595].</text><text x="24" y="495" font-size="14" font-weight="700" text-anchor="start" fill="#172B3A">For ≥50% diet, the mainland contrast against bees is −0.0015. No robust guild replacement result.</text><line x1="24" y1="506" x2="1036" y2="506" stroke="#DCE3E7" stroke-width="1"/><text x="24" y="526" font-size="11" font-weight="400" text-anchor="start" fill="#51616D">Distance coefficients are from separate correlated-distance models. Only mainland exploratory resampling ranges are available here.</text></g></svg>
