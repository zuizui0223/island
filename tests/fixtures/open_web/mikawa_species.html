    <h1>ミカワイヌノヒゲ Eriocaulon mikawanum</h1>
    <p>学名 Eriocaulon mikawanum Satake et T.Koyama</p>
    <p>花冠は筒状で長さ約1.4mm、上部は淡青色になる。</p>
    <p>花序は頭花で、直径3～5mmである。</p>
    <p>果実は褐色である。</p>
